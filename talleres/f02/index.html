a jornada anual de actualización al personal de mantenimiento y limpieza","Inducción al personal ingresante sobre el uso de las dos redes","Preparación de la documentación para la auditoría de la certificación"],"dur":"10","per":"Anual; la inducción, al ingreso de cada agente","pre":["A"],"tp":"II","capDe":"no"}],"descripcion":{"cod":"C","texto":"Tender una segunda red de distribución de agua no potable en las cuatro plantas. La acción tiene por objetivo separar físicamente el agua de lluvia almacenada del agua potable de pozo, de modo que la primera alcance los artefactos que no exigen calidad potable. Una vez finalizada, el establecimiento contará con dos redes independientes y señalizadas, condición sin la cual el volumen captado no puede entregarse. Se ejecutará el tendido de montantes y ramales en planta baja y tres pisos, la conexión de los inodoros de habitaciones y áreas comunes, la instalación de bocas de riego sobre 2.600 m² de espacio verde y de canillas de servicio para limpieza y lavado. Toda la cañería se identificará con color violeta y cartelería de agua no apta para consumo. Se estima una duración de seis meses, coincidente con la tercera etapa de los 24 meses de obra, lo que evita romper instalaciones ya terminadas. Estará a cargo de la contratista sanitaria, bajo inspección de la dirección de obra. Como mecanismo de verificación se realizará una prueba de presión por tramo y un ensayo de ausencia de conexiones cruzadas, con acta firmada y registro fotográfico."},"recI":[{"cod":"A","tarea":"Provisión y montaje de canaletas y embudos en 9.650 m² de cubierta","recurso":"Canaleta de chapa galvanizada de 200 mm con embudos","unidad":"metros","cant":"1.150"},{"cod":"A","tarea":"Provisión y montaje de canaletas y embudos en 9.650 m² de cubierta","recurso":"Oficial zinguero y ayudante","unidad":"jornal","cant":"60"},{"cod":"A","tarea":"Instalación de dispositivos de desvío de primer lavado","recurso":"Dispositivo de desvío de primer lavado de 200 L","unidad":"cantidad","cant":"8"},{"cod":"B","tarea":"Excavación y perfilado del recinto de las cisternas","recurso":"Retroexcavadora con operador","unidad":"horas de uso","cant":"48"},{"cod":"B","tarea":"Ejecución de losa de fundación y tabiques de hormigón armado","recurso":"Hormigón elaborado H-21","unidad":"m³","cant":"185"},{"cod":"B","tarea":"Ejecución de losa de fundación y tabiques de hormigón armado","recurso":"Acero conformado ADN-420","unidad":"kg","cant":"9.500"},{"cod":"C","tarea":"Tendido de montantes y ramales de la red no potable en cuatro niveles","recurso":"Cañería de polipropileno de 32 a 63 mm con accesorios","unidad":"metros","cant":"2.400"},{"cod":"C","tarea":"Señalización e identificación cromática de la red no potable","recurso":"Cartelería y cinta de identificación violeta","unidad":"juego completo","cant":"1"},{"cod":"D","tarea":"Adquisición de dos electrobombas centrífugas y un tablero de comando","recurso":"Electrobomba centrífuga de 3 HP con tablero de comando","unidad":"cantidad","cant":"2"},{"cod":"E","tarea":"Adquisición de cuatro caudalímetros y un sensor de nivel de cisterna","recurso":"Caudalímetro DN 50 con emisor de pulsos","unidad":"cantidad","cant":"4"},{"cod":"F","tarea":"Dictado de tres jornadas de capacitación al personal de mantenimiento","recurso":"Capacitador especializado en instalaciones sanitarias","unidad":"jornal","cant":"3"}],"recO":[{"cod":"A","tarea":"Limpieza de canaletas, rejillas y cestos de retención de la cubierta","recurso":"Personal de mantenimiento","unidad":"jornal por año","cant":"24","origen":"gasto"},{"cod":"A","tarea":"Limpieza y desinfección anual de las dos cisternas","recurso":"Hipoclorito de sodio al 10 %","unidad":"litros por año","cant":"60","origen":"gasto"},{"cod":"A","tarea":"Limpieza y desinfección anual de las dos cisternas","recurso":"Cisternas de 300 m³ incorporadas en la inversión (sólo limpieza y conservación)","unidad":"m³ de capacidad","cant":"300","origen":"capital"},{"cod":"B","tarea":"Bombeo y presurización diaria de la red no potable","recurso":"Energía eléctrica","unidad":"kWh por año","cant":"5.200","origen":"gasto"},{"cod":"B","tarea":"Riego programado de 2.600 m² de espacio verde en la estación seca","recurso":"Agua de lluvia almacenada entregada al riego","unidad":"m³ por año","cant":"1.100","origen":"gasto"},{"cod":"B","tarea":"Reposición desde el pozo cuando la reserva de lluvia resulta insuficiente","recurso":"Agua de pozo de reposición","unidad":"m³ por año","cant":"2.650","origen":"gasto"},{"cod":"C","tarea":"Reemplazo de cartuchos y limpieza de filtros de malla","recurso":"Cartucho filtrante de 50 micrones","unidad":"cantidad por año","cant":"8","origen":"gasto"},{"cod":"C","tarea":"Mantenimiento preventivo de electrobombas y tablero de comando","recurso":"Electrobombas y tablero incorporados en la inversión (servicio técnico de conservación)","unidad":"horas de servicio por año","cant":"16","origen":"capital"},{"cod":"D","tarea":"Toma de muestras y análisis fisicoquímico y bacteriológico del agua no potable","recurso":"Análisis en laboratorio habilitado","unidad":"cantidad por año","cant":"4","origen":"gasto"},{"cod":"E","tarea":"Dictado de una jornada anual de actualización al personal de mantenimiento y limpieza","recurso":"Capacitador externo","unidad":"jornal por año","cant":"1","origen":"gasto"}],"claves":["La demanda de riego se calculó sobre 2.600 m², el valor de las fichas de riego, y no sobre los 5.000 m² de la distribución de superficies. Se adoptó el dato que tiene respaldo de cálculo por sector y se dejó asentado el supuesto: ante una contradicción de la fuente, el formulador decide y lo declara, no promedia en silencio.","La dimensión la impone el desfase estacional, no la superficie de captación. La oferta anual (5.980 m³) supera a la demanda no potable (4.950 m³), pero la lluvia cae en la estación húmeda y el riego se necesita en la seca. Por eso el sistema sustituye el 46 % y no el 100 %, y por eso la cisterna se dimensionó en 300 m³ y no en 600.","La segunda red aparece como acción de inversión (C) y no como una mejora posterior, porque la condición del escenario es explícita: decidirlo en obra cuesta mucho menos que después. La acción se secuencia dentro de la tercera etapa de los 24 meses de obra, antes de que las instalaciones sanitarias estén terminadas.","El pozo no desaparece del proyecto. La tarea «Reposición desde el pozo cuando la reserva de lluvia resulta insuficiente» está dentro de la operación y su recurso se cuantifica en 2.650 m³ anuales. Un proyecto de sustitución parcial tiene que mostrar el remanente, no ocultarlo.","Ninguna acción de inversión es «tramitar la concesión de agua subterránea» ni «diseñar la red no potable». Los permisos y el cálculo hidráulico pertenecen a la formulación y a lo administrativo, que a nivel de idea no se desagrega aunque consuma alrededor del 10 % del costo. Captar lluvia es, además, una de las alternativas posibles del escenario y no la única."],"trampa":{"mal":"Dimensionar la demanda de agua no potable del hotel y comprar los tanques de almacenamiento.","bien":"Construir dos cisternas de almacenamiento de 150 m³ cada una (componente: «Cisternas de almacenamiento de 300 m³ construidas»; tarea: «Ejecución de losa de fundación y tabiques de hormigón armado»).","porque":"Dimensionar la demanda es una acción de la formulación, ya resuelta antes del F02, y no vuelve a aparecer como acción del proyecto. La incorporación del almacenamiento se enuncia por el bien que queda instalado y por la componente que produce, no por el acto administrativo de comprarlo."},"notaO":"El Gantt de la operación muestra los diez años del horizonte de evaluación. Las cinco acciones son continuas y corren en paralelo desde la puesta en marcha: lo que las diferencia no es cuándo ocurren sino con qué periodicidad se repiten dentro de cada año.","notaI":"La inversión se inscribe dentro de los 24 meses de obra del hotel y en tres etapas de ocho: la ventana para incorporar el sistema existe sólo mientras las instalaciones no estén terminadas. Ese es el condicionante que ordena toda la secuencia."},{"n":9,"titulo":"Parque periurbano en el predio fiscal del borde este","proyecto":"Habilitación de un parque periurbano de conservación y regulación hídrica sobre 60 hectáreas del predio fiscal, catastro N° 133.745, borde este de la ciudad de Salta","actividad":"Habilitar un parque periurbano de conservación y regulación hídrica sobre 60 hectáreas del sector no urbanizable del predio fiscal","componente":"Parque periurbano de conservación y regulación hídrica habilitado sobre 60 hectáreas del sector no urbanizable del predio fiscal","dim":{"tipo":"Otro","ind":"Visitas atendidas en el parque habilitado","unid":"visitas","per":"por año","cap":"180.000","benef":"14.000 habitantes del borde este (población supuesta del área de influencia directa), más 1.800 alumnos de la escuela del sector","txt":"El parque se dimensiona sobre 60 de las 289,8 hectáreas que la zonificación destina a conservación, con capacidad de acogida instantánea de 1.200 personas y 180.000 visitas anuales. El insumo principal de la operación es el agua: 9.000 m³ por año para riego de reposición y sanitarios, provistos por perforación propia para no competir con la red, hoy interrumpida en el borde consolidado. La dimensión cubre cerca del 60 % del déficit de espacio verde público del sector, estimado sobre un estándar de 10 m² por habitante y 14.000 habitantes supuestos. La determinan la superficie bajo dominio único, la pendiente —se excluye la mitad alta, superior al 30 %— y la capacidad de las alcantarillas de la RN 9. Un parque mayor excedería la capacidad de mantenimiento del operador y la del cauce receptor; uno menor no reduciría la presión de extracción sobre el remanente.","capNota":"con capacidad de acogida instantánea de 1.200 personas sobre 60 hectáreas"},"uniI":"meses","uniO":"años","horI":18,"horO":10,"fluI":["Amojonar y cercar las 60 ha","Sanear microba "10","per":"anual, previo al período estival","pre":["A"],"tp":"II","capDe":"B"},{"n":"Prevenir y controlar los incendios y los usos no autorizados","comp":"Incendios y usos no autorizados prevenidos y controlados","tar":["Ejecución y mantenimiento de 12 km de cortafuegos","Recorridas de vigilancia perimetral","Atención de focos ígneos con equipo de primera intervención"],"dur":"10","per":"anual, con guardia reforzada de agosto a noviembre","pre":["A"],"tp":"II","capDe":"E"},{"n":"Monitorear el desempeño ambiental del parque e informar los resultados","comp":"Desempeño ambiental monitoreado y resultados informados","tar":["Medición de caudales y sólidos en la descarga a las alcantarillas","Censo anual de aves y de regeneración leñosa en parcelas fijas","Elaboración del informe anual y presentación a la autoridad de aplicación"],"dur":"10","per":"anual","pre":["A"],"tp":"II","capDe":"E"}],"descripcion":{"cod":"B","texto":"Construir las obras de regulación de la escorrentía. La acción tiene por objetivo retener e infiltrar el agua de lluvia dentro del predio, de modo que la habilitación del parque no incremente el caudal que descarga por las alcantarillas de la RN 9, único punto de salida y sin capacidad ociosa. Se ejecutan tres lagunas de retención de 1.800 m³ cada una, emplazadas en la cabecera de los tres colectores internos, y 3.600 m de zanjas de infiltración en curva de nivel sobre las laderas de pendiente media. El material excedente se destinará a terraplenes y a la subrasante de los senderos, sin salir del predio. Los vertederos se vincularán a las alcantarillas existentes mediante conductos de hormigón. Se estima que la acción demandará cinco meses, condicionados por la ventana seca de mayo a octubre. Los trabajos estarán a cargo de una empresa contratista, bajo supervisión del equipo técnico del proyecto. Se requerirán una retroexcavadora sobre orugas, una motoniveladora, un camión volcador, sus operadores y un topógrafo, además de 3.900 litros de gasoil. Como verificación se llevará un registro topográfico de los volúmenes excavados, un registro fotográfico y el control de los remitos de la contratista."},"recI":[{"cod":"A","tarea":"Instalación de 4.200 m de alambrado perimetral y tres portadas","recurso":"Poste de quebracho colorado","unidad":"unidad","cant":"1.400"},{"cod":"A","tarea":"Instalación de 4.200 m de alambrado perimetral y tres portadas","recurso":"Alambre de púa","unidad":"rollo de 500 m","cant":"36"},{"cod":"A","tarea":"Retiro y transporte a disposición final de los microbasurales","recurso":"Camión volcador con chofer","unidad":"hora de uso","cant":"120"},{"cod":"B","tarea":"Excavación de tres lagunas de retención de 1.800 m³ cada una","recurso":"Retroexcavadora sobre orugas con operador","unidad":"hora de uso","cant":"260"},{"cod":"B","tarea":"Excavación de tres lagunas de retención de 1.800 m³ cada una","recurso":"Gasoil","unidad":"litro","cant":"3.900"},{"cod":"B","tarea":"Ejecución de 3.600 m de zanjas de infiltración en curva de nivel","recurso":"Motoniveladora con operador","unidad":"hora de uso","cant":"90"},{"cod":"C","tarea":"Apertura y consolidación de 6 km de senderos y 1,8 km de camino interno","recurso":"Jornal de peón vial","unidad":"jornal","cant":"480"},{"cod":"C","tarea":"Ejecución del área de acceso, estacionamiento y sanitarios","recurso":"Hormigón elaborado H-21","unidad":"m³","cant":"95"},{"cod":"D","tarea":"Producción de 24.000 plantines de especies nativas en vivero de campaña","recurso":"Contenedor forestal de 300 cm³ con sustrato","unidad":"unidad","cant":"26.000"},{"cod":"D","tarea":"Preparación del terreno y plantación en 45 hectáreas","recurso":"Jornal de operario de plantación","unidad":"jornal","cant":"900"},{"cod":"E","tarea":"Adquisición de una camioneta 4x2 y un tractor con acoplado y tanque regador","recurso":"Camioneta 4x2 cabina doble","unidad":"unidad","cant":"1"},{"cod":"F","tarea":"Dictado de cuatro módulos sobre restauración, manejo del fuego y atención de visitantes","recurso":"Honorarios de instructor especializado","unidad":"hora cátedra","cant":"64"}],"recO":[{"cod":"A","tarea":"Apertura, control de acceso y registro de visitantes","recurso":"Jornal de agente de portería","unidad":"jornal","cant":"730","origen":"gasto"},{"cod":"A","tarea":"Limpieza diaria de sanitarios, áreas de estar y senderos","recurso":"Insumos de limpieza y bolsas de residuos","unidad":"juego completo mensual","cant":"12","origen":"gasto"},{"cod":"A","tarea":"Guiado de contingentes escolares y visitas comunitarias","recurso":"Conservación del aula abierta y de los senderos interpretativos incorporados en la acción C de inversión","unidad":"servicio anual","cant":"1","origen":"capital"},{"cod":"B","tarea":"Producción anual de 3.000 plantines de reposición","recurso":"Sustrato y contenedores forestales","unidad":"unidad","cant":"3.200","origen":"gasto"},{"cod":"B","tarea":"Riego de refuerzo en la temporada seca","recurso":"Combustible y service del tractor con tanque regador incorporado en la acción E de inversión","unidad":"hora de uso","cant":"180","origen":"capital"},{"cod":"C","tarea":"Purga y extracción de sedimentos de las tres lagunas","recurso":"Retroexcavadora contratada con operador","unidad":"hora de uso","cant":"48","origen":"gasto"},{"cod":"C","tarea":"Inspección de vertederos y alcantarillas antes de la temporada de lluvias","recurso":"Jornal de técnico hidráulico","unidad":"jornal","cant":"6","origen":"gasto"},{"cod":"D","tarea":"Ejecución y mantenimiento de 12 km de cortafuegos","recurso":"Motoniveladora contratada con operador","unidad":"hora de uso","cant":"36","origen":"gasto"},{"cod":"D","tarea":"Atención de focos ígneos con equipo de primera intervención","recurso":"Reposición y conservación de mochilas de extinción y equipo de protección personal incorporados en la acción E de inversión","unidad":"juego completo","cant":"12","origen":"capital"},{"cod":"E","tarea":"Medición de caudales y sólidos en la descarga a las alcantarillas","recurso":"Análisis de sólidos suspendidos en laboratorio","unidad":"muestra","cant":"24","origen":"gasto"}],"claves":["El proyecto se posiciona frente a la zonificación propuesta: la adopta en su zona no urbanizable, pero interviene sólo 60 de las 289,8 hectáreas de conservación. La superficie intervenida es una decisión de dimensionamiento, no un dato del estudio previo, y se justifica por la capacidad de descarga de las alcantarillas de la RN 9 y por la capacidad de mantenimiento del operador.","Las obras de regulación de la escorrentía (acción B de inversión) existen porque el escenario declara un único punto de salida sin capacidad ociosa que descarga sobre un sector de riesgo hídrico crítico. Sin ellas, habilitar un parque con senderos consolidados y estacionamiento aumentaría el caudal pico y trasladaría el costo aguas abajo.","La acción E de inversión se enuncia como «Dotar al parque de los bienes de capital necesarios para su operación», no como «comprar la camioneta». Todos los bienes que la operación usa —camioneta, tractor con tanque, perforación, herramientas, equipo de monitoreo— entran por esa acción, y en la operación sólo se computan su combustible, conservación y reposición.","El agua de riego proviene de perforación propia y no de la red. El escenario registra competencia por el agua entre los reparos de la población y una red que se interrumpe en el borde consolidado: tomar agua de red convertiría el proyecto en parte del problema que dice atender.","La operación se mide en años y la inversión en meses. Las cinco acciones de operación tienen periodicidad anual con ventanas estacionales distintas (plantación de septiembre a marzo, purga de lagunas antes del estío, guardia de incendios de agosto a noviembre), lo que muestra que la periodicidad no es una etiqueta uniforme."],"trampa":{"mal":"Zonificar el predio fiscal y definir qué sectores son urbanizables y cuáles se destinan a conservación.","bien":"Cercar el sector de conservación y sanear sus pasivos ambientales.","porque":"La zonificación es un estudio técnico de la formulación, ya disponible como insumo en el escenario: no es una acción de la etapa de inversión. Lo que corresponde ejecutar es la materialización en el terreno de la decisión de destino ya tomada, con producto verificable —el sector cercado, amojonado y libre de microbasurales—."},"notaO":"El Gantt de la operación muestra los diez años del horizonte. Las cinco acciones son permanentes y simultáneas: el parque opera, se mantiene, se vigila y se monitorea todos los años. La periodicidad de cada columna es lo que las distingue.","notaI":"La inversión encadena obra civil y cubierta vegetal: la implantación no puede arrancar antes de que el sector esté cercado y saneado, y el uso público no se habilita antes de que la vegetación prenda."},{"n":10,"titulo":"Residuos porcinos: biodigestión y compostaje","proyecto":"Planta de valorización de las tres corrientes de residuos —purines, fracción sólida y biogás— para abatir la carga contaminante y sustituir el gas comprado, en un establecimiento porcino de ciclo completo del Departamento Rosario de Lerma, Valle de Lerma, Salta","actividad":"Implementar un sistema integral de tratamiento y valorización de las tres corrientes de residuos del establecimiento","componente":"Sistema integral de tratamiento y valorización de residuos implementado","dim":{"tipo":"Saneamiento","ind":"Volumen de purín tratado y valorizado","unid":"m³ de purín","per":"por día","cap":"75","benef":"13 trabajadores del establecimiento y unos 45 hogares dispersos en un radio de 2 km","txt":"El sistema se dimensiona para 75 m³ diarios de purín, cifra que surge de aplicar el consumo declarado de 18 litros por animal y por día a un plantel estimado en 4.000 cabezas —supuesto adoptado para sostener la colocación de 160 capones semanales— más un 15 % de agua de lavado. La materia prima es el purín generado bajo el piso enrejillado, hoy vertido sin tratamiento. El proyecto atiende la totalidad del efluente propio, no una fracción: la observación de la autoridad recae sobre el establecimiento completo. La dimensión queda determinada por el plantel, por el consumo unitario de agua y por la superficie disponible para aplicación agronómica, 60 de las 120 ha del predio. Sobredimensionar el biodigestor inmovilizaría capital ocioso y enfriaría la digestión; subdimensionarlo obligaría a seguir descargando purín crudo y no resolvería el expediente.","capNota":"27.000 m³ por año"},"uniI":"meses","uniO":"años","horI":12,"horO":10,"fluI":["Adecuación de fosas y conducciones","Excavación e impermeabilización del vaso","Montaje del separador sólido-líquido","Cubierta de geomembrana y línea de gas","Acondicionamiento de playa de compostaje","Puesta en marcha y capacitación"],"fluO":["Colección del purín crudo en fosas","Separación sólido-líquido","Digestión anaeróbica de la fracción líquida","Captación y uso térmico del biogás","Compostaje de sólidos y mortandad","Aplicación agronómica del digerido","Monitoreo de efluente y freática"],"accI":[{"n":"Reparar las fosas y las conducciones de purín","comp":"Fosas y conducciones de purín reparadas y estancas","tar":["Vaciado y limpieza de las fosas bajo piso enrejillado","Reparación del talud roto de la pileta existente","Impermeabilización de fosas y cámaras de bombeo","Tendido de la cañería de conducción a la planta"],"dur":"2","per":"","pre":[],"tp":"FI"},{"n":"Dotar al proyecto de un separador sólido-líquido","comp":"Proyecto dotado con un separador sólido-líquido","tar":["Construcción de la platea y la sala técnica del separador","Adquisición de un separador de prensa helicoidal","Montaje eléctrico y conexión de las bombas de alimentación","Prueba de funcionamiento en vacío y con carga"],"dur":"3","per":"","pre":["A"],"tp":"FI"},{"n":"Construir un biodigestor de laguna cubierta","comp":"Biodigestor de laguna cubierta construido","tar":["Excavación y perfilado del vaso de 1.600 m³","Colocación de geomembrana de "Anual, con control diario","pre":["A"],"tp":"II","capDe":"C"},{"n":"Compostar la fracción sólida, la mortandad y las placentas","comp":"Fracción sólida, mortandad y placentas compostadas","tar":["Armado quincenal de pilas en la playa de compostaje","Volteo y control de temperatura y humedad de las pilas","Disposición de mortandad y placentas en la celda cerrada","Zarandeo, ensacado y estiba del compost terminado"],"dur":"10","per":"Anual, con volteos semanales","pre":["A"],"tp":"II","capDe":"D"},{"n":"Aplicar el digerido líquido en superficie agrícola propia","comp":"Digerido líquido aplicado según balance de nutrientes","tar":["Elaboración del plan anual de aplicación por lote","Bombeo y riego del digerido sobre 60 ha","Registro de dosis, lote y fecha de cada aplicación"],"dur":"10","per":"Dos ventanas por año, primavera y otoño","pre":["B"],"tp":"II","capDe":"no"},{"n":"Monitorear el efluente, el suelo y la freática","comp":"Efluente, suelo y freática monitoreados","tar":["Muestreo trimestral de entrada y salida del biodigestor","Muestreo semestral de los cuatro pozos de monitoreo","Análisis de suelo previo a cada ventana de aplicación","Elaboración del informe anual para la autoridad de aplicación"],"dur":"10","per":"Trimestral y semestral según matriz de monitoreo","pre":["B"],"tp":"II","capDe":"no"}],"descripcion":{"cod":"C","texto":"Construir un biodigestor de laguna cubierta. La acción tiene por objetivo estabilizar la fracción líquida del purín y capturar el metano que hoy se libera desde fosas y piletas. El vaso se dimensiona en 1.600 m³, resultado de un caudal de alimentación de 72 m³ diarios y un tiempo de retención hidráulica de 21 días, adoptado como supuesto para régimen psicrofílico. Finalizada la acción, el proyecto contará con el biodigestor construido, probado en estanqueidad y listo para el arranque. Se ejecutará por etapas: excavación y perfilado del vaso, colocación de la geomembrana de polietileno de alta densidad de 1,5 mm en fondo y taludes, montaje de la cubierta flotante de captación y tendido de la línea de biogás con trampa de condensado, filtro de sulfuro de hidrógeno y antorcha de seguridad. Se estiman cuatro meses de obra, con los animales en las naves y sin interrumpir la producción. La obra civil estará a cargo de una empresa contratista y la termofusión de membranas de un instalador certificado, bajo supervisión del responsable ambiental. Como verificación se exigirán el ensayo de estanqueidad del vaso, los certificados de soldadura de las membranas y un registro fotográfico por etapa."},"recI":[{"cod":"A","tarea":"Vaciado y limpieza de las fosas bajo piso enrejillado","recurso":"Camión atmosférico contratado con chofer","unidad":"horas de uso","cant":"40"},{"cod":"A","tarea":"Reparación del talud roto de la pileta existente","recurso":"Retroexcavadora con operador","unidad":"horas de uso","cant":"24"},{"cod":"A","tarea":"Tendido de la cañería de conducción a la planta","recurso":"Cañería de polietileno de alta densidad de 160 mm","unidad":"metros","cant":"320"},{"cod":"B","tarea":"Construcción de la platea y la sala técnica del separador","recurso":"Hormigón elaborado H-21","unidad":"m³","cant":"18"},{"cod":"B","tarea":"Adquisición de un separador de prensa helicoidal","recurso":"Separador de prensa helicoidal de 25 m³/h","unidad":"cantidad","cant":"1"},{"cod":"C","tarea":"Excavación y perfilado del vaso de 1.600 m³","recurso":"Excavadora sobre orugas con operador","unidad":"horas de uso","cant":"120"},{"cod":"C","tarea":"Colocación de geomembrana de fondo y taludes","recurso":"Geomembrana de polietileno de alta densidad de 1,5 mm","unidad":"m²","cant":"1.900"},{"cod":"C","tarea":"Instalación de la cubierta flotante de captación","recurso":"Geomembrana de cubierta reforzada con accesorios de anclaje","unidad":"m²","cant":"1.100"},{"cod":"C","tarea":"Montaje de la línea de biogás, filtro y antorcha","recurso":"Antorcha de seguridad con arrestallamas","unidad":"cantidad","cant":"1"},{"cod":"D","tarea":"Adquisición de un volteador de pilas acoplado al tractor","recurso":"Volteador de pilas de arrastre","unidad":"cantidad","cant":"1"},{"cod":"E","tarea":"Adquisición de una caldera dual de biogás de 150 kW","recurso":"Caldera dual biogás/gas envasado de 150 kW","unidad":"cantidad","cant":"1"},{"cod":"F","tarea":"Dictado de cuatro talleres sobre operación y bioseguridad","recurso":"Capacitador especializado en digestión anaeróbica","unidad":"jornal","cant":"4"}],"recO":[{"cod":"A","tarea":"Operación diaria del separador de prensa helicoidal","recurso":"Energía eléctrica","unidad":"kWh","cant":"9.500 por año","origen":"gasto"},{"cod":"A","tarea":"Limpieza y conservación del equipo y de las cañerías","recurso":"Juego de repuestos y mantenimiento del separador","unidad":"juego completo","cant":"1 por año","origen":"capital"},{"cod":"B","tarea":"Alimentación diaria del biodigestor con 72 m³ de líquido","recurso":"Operario de planta","unidad":"jornal","cant":"365 por año","origen":"gasto"},{"cod":"B","tarea":"Desulfuración y conducción del biogás a la caldera","recurso":"Carga de viruta de hierro del filtro de sulfuro de hidrógeno","unidad":"kg","cant":"600 por año","origen":"gasto"},{"cod":"B","tarea":"Purga de lodos y mantenimiento de la cubierta","recurso":"Limpieza y conservación de la cubierta de geomembrana","unidad":"horas","cant":"80 por año","origen":"capital"},{"cod":"C","tarea":"Volteo y control de temperatura y humedad de las pilas","recurso":"Gasoil para el tractor con volteador de pilas","unidad":"litros","cant":"1.800 por año","origen":"gasto"},{"cod":"C","tarea":"Zarandeo, ensacado y estiba del compost terminado","recurso":"Bolsas de rafia de 40 kg","unidad":"cantidad","cant":"10.500 por año","origen":"gasto"},{"cod":"D","tarea":"Bombeo y riego del digerido sobre 60 ha","recurso":"Cisterna esparcidora con tractor, contratada por hora","unidad":"horas de uso","cant":"180 por año","origen":"gasto"},{"cod":"E","tarea":"Muestreo trimestral de entrada y salida del biodigestor","recurso":"Análisis de laboratorio de DQO, DBO y sólidos totales","unidad":"cantidad","cant":"8 por año","origen":"gasto"},{"cod":"E","tarea":"Muestreo semestral de los cuatro pozos de monitoreo","recurso":"Análisis de laboratorio de coliformes fecales y nitratos","unidad":"cantidad","cant":"8 por año","origen":"gasto"}],"claves":["Las tres corrientes se resuelven con un único sistema encadenado, tal como exige la condición del escenario: el separador fija la carga que entra al biodigestor, el biodigestor fija el volumen y la composición del digerido que va a campo, y la fracción sólida separada es la que llena la playa de compostaje que hoy trabaja al 30 % de su capacidad. Cambiar el dimensionamiento de una acción mueve las otras dos.","Toda la operación se apoya en capital incorporado durante la inversión: el separador entra por la acción B, el biodigestor por la C, la playa acondicionada y el volteador por la D, la red térmica por la E. Por eso las acciones de operación llevan capDe con letra y en recO ese capital sólo aparece como limpieza y conservación, nunca como compra.","La aplicación agronómica es la única acción de operación con capDe 'no'. La decisión de formulación fue tercerizar la cisterna esparcidora, que se usa apenas dos ventanas por año: se consigna como recurso contratado por hora de uso y no como bien de capital del proyecto. Es el criterio de la regla 10 de la Guía.","El escenario no informa el plantel total ni el caudal de efluente —de hecho la primera evidencia dice que no se cuantifica—, así que el dimensionamiento se construyó con supuestos declarados: 4.000 cabezas derivadas de las 160 colocaciones semanales, 18 litros por animal y día de la evidencia, y 15 % adicional de lavado. En idea o perfil eso es admisible siempre que el supuesto quede escrito y sea defendible.","No aparecen como acciones el estudio hidrogeológico, la caracterización del purín ni la selección de la tecnología de tratamiento: son actividades de la formulación, ya resueltas antes del F02. Tampoco se desagrega la gestión del expediente de renovación del certificado de aptitud ambiental, que se reconoce como costo indirecto."],"trampa":{"mal":"Comprar un biodigestor y un separador de sólidos para tratar los purines del establecimiento.","bien":"Construir un biodigestor de laguna cubierta (componente: biodigestor de laguna cubierta construido) y Dotar al proyecto de un separador sólido-líquido (componente: proyecto dotado con un separador sólido-líquido), con la adquisición del equipo como tarea dentro de la segunda acción.","porque":"La incorporación de bienes de capital no se enuncia como el acto administrativo de comprar: se enuncia por lo que el proyecto queda teniendo, y la compra baja al nivel de tarea. Además, el enunciado incorrecto funde en una sola línea dos acciones con componentes, duraciones y predecesoras distintas, lo que impide secuenciarlas y asignarles recursos por separado."},"notaO":"El Gantt de la operación muestra los diez años del horizonte. Las cinco acciones son continuas y encadenadas dentro de cada jornada: la separación alimenta al biodigestor y al compostaje, y el digerido alimenta la aplicación agronómica. Por eso arrancan casi juntas (vínculo inicio–inicio) y no una después de la otra.","notaI":"La adecuación se ejecuta con los animales en las naves y sin detener la producción: por eso la reparación de fosas va primero y el biodigestor se construye en paralelo al acondicionamiento de la playa de compostaje."}];

function edtSVG(actividad, L, esInv, titulo){
  var P = PAL();
  var A = L.filter(function(a){ return txt(a.n); });
  if(!A.length) return null;
  var col = esInv ? P.oro : P.cel;
  var M = 18, CW = 196, GX = 16, TOPH = 52, GAP = 34, LH = 13, TLH = 12;
  var n = A.length;
  var W = M*2 + n*CW + (n-1)*GX;
  var nl = A.map(function(a){ return wrapTxt(a.n, 24); });
  var tl = A.map(function(a){ return (a.tar||[]).filter(function(t){ return txt(t.t); })
                                .map(function(t){ return wrapTxt('· '+txt(t.t), 27); }); });
  var cl = A.map(function(a){ return wrapTxt(txt(a.comp) || '—', 24); });
  var accH = 0, tarH = 0, compH = 0;
  nl.forEach(function(x){ accH = Math.max(accH, 24 + x.length*LH); });
  tl.forEach(function(x){ var h = 0; x.forEach(function(y){ h += y.length*TLH; }); tarH = Math.max(tarH, h + 20); });
  cl.forEach(function(x){ compH = Math.max(compH, 22 + x.length*LH); });
  var yAct = M + 22, yAcc = yAct + TOPH + GAP, yTar = yAcc + accH + 14, yComp = yTar + tarH + 14;
  var H = yComp + compH + M;

  var g = '<text x="'+M+'" y="'+(M+11)+'" fill="'+P.tx3+'" font-size="11" font-family="'+SVGFF+'" '+
          'font-weight="700" letter-spacing="1.6">'+xesc(String(titulo||'').toUpperCase())+'</text>';
  var actL = wrapTxt(txt(actividad) || 'Actividad de la EAP', 92).slice(0,2);
  g += '<rect x="'+M+'" y="'+yAct+'" width="'+(W-M*2)+'" height="'+TOPH+'" rx="12" fill="'+P.verde+'22" stroke="'+P.verde+'" stroke-width="1.6"/>';
  g += '<text x="'+(M+12)+'" y="'+(yAct+17)+'" fill="'+P.verdeL+'" font-size="9.5" font-family="'+SVGFF+'" font-weight="800" letter-spacing="1.3">ACTIVIDAD</text>';
  g += tspans(actL, W/2, yAct + 34 - (actL.length-1)*6, LH, P.tx, 12, '650');

  A.forEach(function(a, i){
    var x = M + i*(CW+GX), cx = x + CW/2;
    g += '<path d="M'+(W/2)+','+(yAct+TOPH)+' L'+(W/2)+','+(yAct+TOPH+GAP/2)+' L'+cx+','+(yAct+TOPH+GAP/2)+' L'+cx+','+(yAcc-7)+'" fill="none" stroke="'+P.tx3+'" stroke-width="1.3" marker-end="url(#ah)"/>';
    g += '<rect x="'+x+'" y="'+yAcc+'" width="'+CW+'" height="'+accH+'" rx="10" fill="'+col+'22" stroke="'+col+'" stroke-width="1.4"/>';
    g += '<circle cx="'+(x+15)+'" cy="'+(yAcc+14)+'" r="9" fill="'+col+'"/>';
    g += '<text x="'+(x+15)+'" y="'+(yAcc+18)+'" fill="#06110d" font-size="10" font-weight="800" font-family="'+SVGFF+'" text-anchor="middle">'+codeOf(i)+'</text>';
    g += tspans(nl[i], cx, yAcc + 30, LH, P.tx, 11, '650');
    var ty = yTar + 14;
    g += '<text x="'+x+'" y="'+(yTar+4)+'" fill="'+P.tx3+'" font-size="8.5" font-family="'+SVGFF+'" letter-spacing="1.2">TAREAS</text>';
    tl[i].forEach(function(lines){
      lines.forEach(function(ln, k){
        g += '<text x="'+(x+2)+'" y="'+ty+'" fill="'+P.tx2+'" font-size="10" font-family="'+SVGFF+'">'+xesc(ln)+'</text>';
        ty += TLH;
      });
    });
    g += '<path d="M'+cx+','+(yTar+tarH-4)+' L'+cx+','+(yComp-7)+'" fill="none" stroke="'+P.tx3+'" stroke-width="1.3" marker-end="url(#ah)"/>';
    g += '<rect x="'+x+'" y="'+yComp+'" width="'+CW+'" height="'+compH+'" rx="10" fill="'+P.verde+'1c" stroke="'+P.verde+'" stroke-width="1.3"/>';
    g += '<text x="'+(x+9)+'" y="'+(yComp+14)+'" fill="'+P.verdeL+'" font-size="8.5" font-family="'+SVGFF+'" font-weight="800" letter-spacing="1.2">COMPONENTE</text>';
    g += tspans(cl[i], cx, yComp + 28, LH, P.tx, 10.5, '600');
  });
  return {svg: svgWrap(W, H, g, P.bg), w:W, h:H};
}

var MAPA = [
  ['B','Dimensionamiento','El tamaño del proyecto','oro'],
  ['C','Descripción y localización','Macro y micro localización','cel'],
  ['D·E','Acciones y tareas','Acciones en la inversión','verde'],

function mapaSVG(){
  var P = PAL();

  var n = MAPA.length;
  var W = M*2 + n*BW + (n-1)*GX;
  var H = M*2 + BH + 46;
  var g = '';
  MAPA.forEach(function(r, i){
    var x = M + i*(BW+GX), y = M + 26;
    var c = P[r[3]] || P.verde;
    g += '<rect x="'+x+'" y="'+y+'" width="'+BW+'" height="'+BH+'" rx="11" fill="'+c+'1e" stroke="'+c+'" stroke-width="1.4"/>';
    g += '<text x="'+(x+10)+'" y="'+(y+17)+'" fill="'+c+'" font-size="10" font-family="'+SVGFF+'" font-weight="800" letter-spacing="1.2">ÍTEM '+xesc(r[0])+'</text>';
    var ln = wrapTxt(r[1], 20);
    g += tspans(ln, x + BW/2, y + 36, 13, P.tx, 11.5, '650');
    if(i < n-1){
      g += '<line x1="'+(x+BW)+'" y1="'+(y+BH/2)+'" x2="'+(x+BW+GX-8)+'" y2="'+(y+BH/2)+'" stroke="'+P.tx3+'" stroke-width="1.5" marker-end="url(#ah)"/>';
    }
  });
  g += '<text x="'+M+'" y="'+(H-M+2)+'" fill="'+P.tx3+'" font-size="9.5" font-family="'+SVGFF+'">Cada apartado se apoya en el anterior: el tamaño manda sobre las acciones, las acciones sobre los tiempos, y los tiempos sobre los recursos.</text>';
  return {svg: svgWrap(W, H, g, P.bg), w:W, h:H};
}

<script>
"use strict";
/* ===============================================================
   Generador de .xlsx nativo, sin librerías externas.
   Escribe un ZIP (entradas sin comprimir) con el mínimo OOXML que
   Excel, LibreOffice y Google Sheets abren igual.
   =============================================================== */

/* ---------- CRC32 ---------- */
var CRCT = (function(){
  var t = new Uint32Array(256);
  for(var n=0;n<256;n++){
    var c = n;
    for(var k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(buf){
  var c = 0xFFFFFFFF;
  for(var i=0;i<buf.length;i++) c = CRCT[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
var ENC = new TextEncoder();
function u8(s){ return ENC.encode(s); }

/* ---------- ZIP sin compresión ---------- */
function zipStore(files){
  /* files: [{name, data:Uint8Array}] */
  var parts = [], central = [], off = 0;
  function n16(v){ return [v & 255, (v >>> 8) & 255]; }
  function n32(v){ return [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255]; }
  files.forEach(function(f){
    var nm = u8(f.name), c = crc32(f.data), sz = f.data.length;
    var lh = [].concat([0x50,0x4b,0x03,0x04], n16(20), n16(0x0800), n16(0), n16(0), n16(0),
                       n32(c), n32(sz), n32(sz), n16(nm.length), n16(0));
    parts.push(new Uint8Array(lh), nm, f.data);
    central.push({nm:nm, c:c, sz:sz, off:off});
    off += lh.length + nm.length + sz;
  });
  var cdStart = off, cdLen = 0;
  central.forEach(function(e){
    var ch = [].concat([0x50,0x4b,0x01,0x02], n16(20), n16(20), n16(0x0800), n16(0), n16(0), n16(0),
                       n32(e.c), n32(e.sz), n32(e.sz), n16(e.nm.length),
                       n16(0), n16(0), n16(0), n16(0), n32(0), n32(e.off));
    parts.push(new Uint8Array(ch), e.nm);
    cdLen += ch.length + e.nm.length;
  });
  var eo = [].concat([0x50,0x4b,0x05,0x06], n16(0), n16(0), n16(central.length), n16(central.length),
                     n32(cdLen), n32(cdStart), n16(0));
  parts.push(new Uint8Array(eo));
  var total = parts.reduce(function(a,p){ return a + p.length; }, 0);
  var out = new Uint8Array(total), pos = 0;
  parts.forEach(function(p){ out.set(p, pos); pos += p.length; });
  return out;
}

/* ---------- utilidades de hoja ---------- */
function colName(i){
  var s = '';
  i = i + 1;
  while(i > 0){ var r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); }
  return s;
}
function xml(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&apos;')
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
}
/* estilos: 0 normal · 1 encabezado · 2 texto ajustado · 3 número ·

 '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+

 '</fills>'+
 '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>'+

 '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
 '<cellXfs count="8">'+
   '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'+

   '<xf numFmtId="0" fontId="2" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>'+
 '</cellXfs>'+
 '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';

function hojaXML(filas, anchos, congelar){
  var cols = '';
  if(anchos && anchos.length){
    cols = '<cols>' + anchos.map(function(w, i){
      return '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>';
    }).join('') + '</cols>';
  }
  var rows = filas.map(function(r, ri){
    var cells = r.map(function(c, ci){
      if(c == null || c === '') return '';
      var ref = colName(ci) + (ri + 1);
      var st = 0, v = c, num = false;
      if(typeof c === 'object'){ st = c.s || 0; v = (c.v == null ? '' : c.v); num = !!c.n; }
      else { st = (ri === 0) ? 1 : 2; }
      if(v === '' && st) return '<c r="'+ref+'" s="'+st+'"/>';
      if(num || (typeof v === 'number')) return '<c r="'+ref+'" s="'+(st||3)+'"><v>'+v+'</v></c>';
      return '<c r="'+ref+'" s="'+st+'" t="inlineStr"><is><t xml:space="preserve">'+xml(v)+'</t></is></c>';
    }).join('');
    return '<row r="'+(ri+1)+'">'+cells+'</row>';
  }).join('');
  var panes = congelar ? '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' : '';
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    panes + cols + '<sheetData>' + rows + '</sheetData></worksheet>';
}

/* hojas: [{nombre, filas, anchos}] */
function xlsxBuild(hojas){

    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+

function f01Scan(){
  var out = [];
  try{
    for(var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      var m = /^fepar2026_f01_e(\d+)$/.exec(k||'');
      if(!m) continue;
      var o = JSON.parse(localStorage.getItem(k));
      if(o) out.push({key:k, n:+m[1], d:o});
    }
  }catch(e){}
  return out.sort(function(a,b){ return a.n-b.n; });
}
function lbTexto(o){
  var lb = o.lb || {};
  var p = [lb.c, lb.v, lb.l, lb.p].filter(function(x){ return txt(x); }).join(' · ');
  return p + (txt(lb.mv) ? ' (según ' + txt(lb.mv) + ')' : '');
}
function f01Take(o, n){
  var eq = o.eq || {};
  if(txt(eq.nombre)) D.eq.nombre = eq.nombre;
  if(txt(eq.coord))  D.eq.coord  = eq.coord;
  if(Array.isArray(o.ints) && o.ints.length){
    D.ints = o.ints.map(function(x){ return {ap:x.ap||'', fun:x.fun||'', hs:x.hs||''}; });

  D.f01.fin  = txt(eap.fin) || D.f01.fin;
  D.f01.prop = txt(eap.prop) || txt(o.obj) || D.f01.prop;
  D.f01.comp = txt(eap.comp) || D.f01.comp;
  D.f01.act  = txt(eap.act) || D.f01.act;
  D.f01.lb   = lbTexto(o) || D.f01.lb;
  D.f01.pob  = txt((o.ctx||{}).pobO) || txt((o.ctx||{}).pobP) || D.f01.pob;

function dimFrase(){
  var d = D.dim;

  var u = txt(d.unid) || '[unidad]';
  var p = txt(d.per) || '[período]';

function fluDraw(){
  var holder = document.getElementById('flu-dg');
  if(!holder) return;
  var P = PAL();
  holder.innerHTML = '';
  holder.appendChild(dgmBox('fluI','Flujograma de la inversión',
    fluSVG(D.flu.inv, P.oro, 'Flujograma · etapa de inversión'), 'F02_flujograma_inversion',
    'Cargá los pasos de la inversión y el diagrama aparece acá.'));
  holder.appendChild(dgmBox('fluO','Flujograma de la operación',
    fluSVG(D.flu.ope, P.cel, 'Flujograma · etapa de operación'), 'F02_flujograma_operacion',
    'Cargá los pasos de la operación y el diagrama aparece acá.'));

function pasoLista(et, titulo, color){
  var arr = D.flu[et];
  var c = card(et==='inv'?'oro':'cel', titulo);
  c.appendChild(E('p','tiny', et==='inv'
    ? 'Paso a paso de lo que hay que hacer para <strong>dotar al proyecto de los bienes de capital</strong> que la operación va a necesitar.'
    : 'Paso a paso del <strong>proceso productivo</strong> con el que se obtiene el bien o se presta el servicio.'));
  var hold = E('div','col'); hold.style.marginTop='8px'; hold.style.gap='5px';
  function paint(){
    hold.innerHTML = '';
    arr.forEach(function(o,i){
      var r = E('div','tsk'); r.style.paddingLeft='0';
      r.appendChild(E('span','tn', String(i+1)));
      var inp = cell(o,'t','Paso del proceso');
      inp.addEventListener('input', function(){ if(inp._t) clearTimeout(inp._t);
        inp._t = setTimeout(fluDraw, 600); });
      r.appendChild(inp);
      var up = E('button','mv','▲'); up.type='button'; up.title='Subir';
      up.onclick = function(){ if(i>0){ var x=arr[i-1]; arr[i-1]=arr[i]; arr[i]=x; paint(); touch(); fluDraw(); } };
      var dn = E('button','mv','▼'); dn.type='button'; dn.title='Bajar';
      dn.onclick = function(){ if(i<arr.length-1){ var x=arr[i+1]; arr[i+1]=arr[i]; arr[i]=x; paint(); touch(); fluDraw(); } };
      var del = E('button','fdel','✕'); del.type='button';
      del.onclick = function(){ arr.splice(i,1); if(!arr.length) arr.push({t:''}); paint(); touch(); fluDraw(); };
      r.appendChild(up); r.appendChild(dn); r.appendChild(del);
      hold.appendChild(r);
    });
  }
  paint();
  c.appendChild(hold);
  var row = E('div','wrap'); row.style.marginTop='9px';
  row.appendChild(btn('+ Paso','ghost sm', function(){ arr.push({t:''}); paint(); touch(); }));
  row.appendChild(btn('⇄ Traer desde las acciones','ghost sm', function(){
    var L = accNamed(et);
    if(!L.length){ toast('Todavía no hay acciones cargadas en esa etapa.'); return; }
    D.flu[et] = L.map(function(a){ return {t:a.n}; });
    touch(); redraw();
  }));
  c.appendChild(row);
  return c;
}

<script>

/* =============================================================== VALIDACIONES DE ACCIÓN */
var VERBFORM = /^(diseñ|seleccion|dimension|analiz|determin|evalu|estudi|relev|investig|proyect|formul)/i;
var VERBADM  = /^(compr|licit|contrat|adquir|tramit|gestion|patent)/i;
function primera(s){ return String(s||'').trim().split(/\s+/)[0].toLowerCase(); }
function esInfinitivo(s){ var w = primera(s); return /(ar|er|ir)$/.test(w) && w.length > 3; }
function participio(v){
  v = String(v||'').toLowerCase();
  if(/ar$/.test(v)) return v.replace(/ar$/,'ado');
  if(/(er|ir)$/.test(v)) return v.replace(/(er|ir)$/,'ido');
  return v;
}
function sugComp(n){
  n = String(n||'').trim();
  if(!n) return '';
  var w = n.split(/\s+/);
  var v = w.shift();
  var resto = w.join(' ').replace(/^(el|la|los|las|un|una|unos|unas)\s+/i,'');
  if(!resto) return participio(v).replace(/^./, function(c){ return c.toUpperCase(); });
  resto = resto.replace(/\s+para\s+.*$/i, function(m){ return m; });
  var p = participio(v);
  return (resto.charAt(0).toUpperCase() + resto.slice(1) + ' ' + p).trim();
}
var PART = /(\b[a-záéíóúñ]+(?:ad[oa]s?|id[oa]s?)\b)|(\b(?:hech|dispuest|provist|resuelt|cubiert|abiert|puest|escrit|impres|vist|muert|rot)[oa]s?\b)/i;
function esProducto(c){
  /* la componente se lee como producto si contiene un participio en cualquier posición:
     «Galpón construido», pero también «Proyecto dotado con dos camionetas» */
  return PART.test(String(c||'').trim());
}
function accFlags(et, a){
  var f = [];
  if(txt(a.n)){
    if(!esInfinitivo(a.n)) f.push(['warn','el nombre debería empezar con un verbo en infinitivo']);
    if(VERBADM.test(primera(a.n))) f.push(['bad','parece una tarea administrativa: escribila como «Dotar al proyecto de…»']);
    if(VERBFORM.test(primera(a.n))) f.push(['bad','parece una acción de la formulación, no del proyecto']);
  }
  if(txt(a.comp) && !esProducto(a.comp)) f.push(['warn','la componente debería leerse como producto obtenido']);
  if(!tareas(a).length) f.push(['warn','sin tareas cargadas']);
  return f;
}

/* =============================================================== EDITOR DE ACCIONES */
function accCard(et, a, i, repaint){

                             : 'Acción: p. ej. Operar la planta de energía solar';

  n.addEventListener('blur', repaint);
  h.appendChild(n);
  c.appendChild(h);

  var cp = E('div','acc-cp');
  cp.appendChild(E('span','lb','Componente'));

  ci.addEventListener('blur', repaint);
  cp.appendChild(ci);
  var sg = E('button','mv','✨'); sg.type='button'; sg.title='Sugerir la componente a partir del nombre de la acción';
  sg.onclick = function(){ var s = sugComp(a.n); if(!s){ toast('Escribí primero el nombre de la acción.'); return; }
    a.comp = s; ci.value = s; touch(); repaint(); };
  cp.appendChild(sg);
  c.appendChild(cp);

  var tw = E('div');
  (a.tar||[]).forEach(function(t, k){
    var r = E('div','tsk');
    r.appendChild(E('span','tn', String(k+1)));
    r.appendChild(cell(t,'t','Tarea: ¿qué paso ejecuto para lograr la acción?'));
    var del = E('button','fdel','✕'); del.type='button';
    del.onclick = function(){ a.tar.splice(k,1); if(!a.tar.length) a.tar.push({t:''}); repaint(); touch(); };
    r.appendChild(del);
    tw.appendChild(r);
  });
  c.appendChild(tw);

  var f = E('div','acc-f');
  f.appendChild(btn('+ Tarea','ghost xs', function(){ a.tar.push({t:''}); repaint(); touch(); }));
  var up = E('button','mv','▲'); up.type='button'; up.title='Subir';
  up.onclick = function(){ if(i>0) moveAcc(et,i,i-1); };
  var dn = E('button','mv','▼'); dn.type='button'; dn.title='Bajar';

  f.appendChild(up); f.appendChild(dn);
  var del = E('button','fdel','✕'); del.type='button'; del.title='Quitar la acción';
  del.onclick = function(){ delAcc(et, i); };

  if(txt(a.n) && txt(a.comp) && tareas(a).length && !accFlags(et,a).length)
    f.appendChild(E('span','flag ok','✔ completa'));
  c.appendChild(f);
  return c;
}
/* mover y borrar acciones reindexando las predecesoras */
function remapPre(et, map){
  accList(et).forEach(function(a){
    a.pre = (a.pre||[]).map(function(p){ return map.hasOwnProperty(p) ? map[p] : -1; })
                       .filter(function(p){ return p >= 0; });
  });
  if(et === 'inv'){
    accList('ope').forEach(function(a){
      if(a.capDe === '' || a.capDe === 'no') return;
      var k = LET.indexOf(a.capDe);
      a.capDe = (map.hasOwnProperty(k) && map[k] >= 0) ? codeOf(map[k]) : '';
    });
  }
}
function moveAcc(et, i, j){
  var L = accList(et), map = {};
  L.forEach(function(_,k){ map[k] = k; });
  map[i] = j; map[j] = i;

/* =============================================================== SALIDA */
function dl(name, mime, content){
  var b = new Blob([content], {type:mime});
  dlBlob(name, b);
}
function dlBlob(name, b){
  var u = URL.createObjectURL(b);
  var a = document.createElement('a');
  a.href = u; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); }, 400);
}
function slug(t){
  return String(t||'equipo').normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40) || 'equipo';
}
function nl2br(t){ return esc(t).replace(/\n/g,'<br>'); }
function vacio(cols, msg){ return '<tr><td colspan="'+cols+'"><em>'+(msg||'Sin datos cargados.')+'</em></td></tr>'; }

function tblAcciones(et){
  var L = accList(et), rows = '';
  L.forEach(function(a,i){
    if(!txt(a.n)) return;
    var ts = tareas(a);
    if(!ts.length) ts = [{t:''}];
    ts.forEach(function(t,k){
      rows += '<tr><td>'+(k===0 ? '<strong>Acción '+(i+1)+' ('+codeOf(i)+'):</strong> '+esc(a.n) : '')+'</td>'+
              '<td>'+esc(txt(t.t))+'</td>'+
              '<td>'+(k===0 ? '<strong>Componente '+(i+1)+':</strong> '+esc(a.comp) : '')+'</td></tr>';
    });
  });
  return '<table><tr><th>ACCIÓN</th><th>TAREA</th><th>COMPONENTE (de la acción)</th></tr>'+
         (rows || vacio(3,'Sin acciones cargadas.'))+'</table>';
}
function tblDescr(et){
  var rows = '';
  accList(et).forEach(function(a,i){
    if(!txt(a.n)) return;
    var d = txt(a.d.txt);
    if(!d){
      var p = [];
      if(txt(a.d.obj)) p.push('Objetivo: '+txt(a.d.obj));
      if(txt(a.d.res)||txt(a.comp)) p.push('Resultado: '+(txt(a.d.res)||txt(a.comp)));
      if(txt(a.d.des)) p.push('Descripción: '+txt(a.d.des));
      if(txt(a.dur)) p.push('Duración: '+txt(a.dur)+' '+plu(a.dur, unidad(et)));
      if(txt(a.per)) p.push('Periodicidad: '+txt(a.per));
      if(txt(a.d.resp)) p.push('Responsables: '+txt(a.d.resp));
      if(txt(a.d.rec)) p.push('Recursos: '+txt(a.d.rec));
      if(txt(a.d.ind)) p.push('Indicadores: '+txt(a.d.ind));
      d = p.join('. ');
    }
    rows += '<tr><td><strong>'+codeOf(i)+'</strong> · '+esc(a.n)+'</td><td>'+
            (d ? nl2br(d) : '<em>— sin describir —</em>')+'</td></tr>';
  });
  return '<table><tr><th>ACCIÓN</th><th>DESCRIPCIÓN</th></tr>'+(rows || vacio(2,'Sin acciones cargadas.'))+'</table>';
}
function tblSec(et){
  var L = accList(et), rows = '';
  L.forEach(function(a,i){
    if(!txt(a.n)) return;
    var pre = (a.pre||[]).map(function(p){ return codeOf(p); }).join(' - ') || '--';
    var ts = tareas(a); if(!ts.length) ts = [{t:''}];
    ts.forEach(function(t,k){
      rows += '<tr><td>'+(k===0?'<strong>Acción '+(i+1)+':</strong> '+esc(a.n):'')+'</td>'+
              '<td>'+(k===0?codeOf(i):'')+'</td><td>'+esc(txt(t.t))+'</td>'+
              '<td>'+(k===0?esc(a.comp):'')+'</td><td>'+(k===0?esc(pre)+' ('+(a.tp||'FI')+')':'')+'</td></tr>';
    });
  });
  return '<table><tr><th>ACCIÓN</th><th>COD</th><th>TAREAS</th><th>COMPONENTE</th><th>Predecesoras</th></tr>'+
         (rows || vacio(5,'Sin acciones cargadas.'))+'</table>';
}
function tblTiempo(et){
  var rows = '';
  accList(et).forEach(function(a,i){
    if(!txt(a.n)) return;
    rows += '<tr><td><strong>'+codeOf(i)+'</strong> · '+esc(a.n)+'</td><td>'+
            (txt(a.dur) ? esc(a.dur)+' '+esc(plu(a.dur, unidad(et))) : '—')+'</td><td>'+(esc(a.per) || '—')+'</td></tr>';
  });
  return '<table><tr><th>ACCIÓN</th><th>DURACIÓN</th><th>PERIODICIDAD</th></tr>'+
         (rows || vacio(3,'Sin acciones cargadas.'))+'</table>';
}
function tblGantt(et){
  var L = accList(et), sc = schedule(et);
  var named = [];
  L.forEach(function(a,i){ if(txt(a.n)) named.push(i); });
  if(!named.length) return '<p><em>Sin acciones cargadas.</em></p>';
  var T = Math.max(1, Math.ceil(sc.T), Math.ceil(et==='inv' ? (+D.esc.invN||0) : (+D.esc.opeN||0)));
  T = Math.min(T, 40);
  var col = et==='inv' ? '#eda100' : '#39b6d8';
  var h = '<table><tr><th>ACCIÓN</th>';
  for(var t=1;t<=T;t++) h += '<th style="text-align:center;width:18px">'+t+'</th>';
  h += '</tr>';
  named.forEach(function(i){
    h += '<tr><td>'+codeOf(i)+' · '+esc(L[i].n)+'</td>';
    for(var t2=0;t2<T;t2++){
      var on = (t2 + 1 > sc.ES[i]) && (t2 < sc.EF[i]) && sc.dur[i] > 0;
      h += '<td'+(on ? ' bgcolor="'+col+'" style="background:'+col+'"' : '')+'>&nbsp;</td>';
    }
    h += '</tr>';
  });
  h += '</table><p style="font-size:9pt">Escala: '+esc(unidad(et))+'. Duración total estimada: '+
       (Math.round(sc.T*100)/100)+' '+esc(plu(sc.T, unidad(et)))+'.</p>';
  return h;
}
function tblRec(et){
  var arr = D.rec[et], L = accList(et), rows = '';
  arr.forEach(function(r){
    if(!txt(r.r) && !txt(r.t)) return;
    var i = LET.indexOf(r.a);
    var nom = (i>=0 && L[i]) ? (codeOf(i)+' · '+txt(L[i].n)) : txt(r.a);
    rows += '<tr><td>'+esc(nom)+'</td><td>'+esc(r.t)+'</td><td>'+esc(r.r)+'</td><td>'+esc(r.u)+'</td><td>'+esc(r.c)+'</td>'+
            (et==='ope' ? '<td>'+(r.o==='capital' ? 'capital ya incorporado en la inversión' : 'gasto operativo')+'</td>' : '')+'</tr>';
  });
  var nc = et==='ope' ? 6 : 5;
  return '<table><tr><th>ACCIÓN</th><th>TAREA</th><th>RECURSO NECESARIO</th><th>UNIDAD</th><th>CANTIDAD</th>'+
         (et==='ope' ? '<th>ORIGEN</th>' : '')+'</tr>'+(rows || vacio(nc,'Sin recursos cargados.'))+'</table>';
}
function tblFlu(et){
  var arr = (D.flu[et]||[]).filter(function(x){ return txt(x.t); });
  if(!arr.length) return '<p><em>Sin pasos cargados.</em></p>';
  return '<table><tr><th style="width:34px">Nº</th><th>PASO DEL PROCESO</th></tr>'+

}

    CK.map(function(q,i){ return '<tr><td style="width:22px">'+(D.ck[i]?'✔':'—')+'</td><td>'+esc(q)+'</td></tr>'; }).join('')+
    '</table>';

  if(txt(D.f01.act) || txt(D.f01.pc)){
    h += '<h2>Anexo · Trazabilidad con el Formulario 01</h2><table>'+
      [['Problema central',D.f01.pc],['Línea de base',D.f01.lb],['Fin',D.f01.fin],['Propósito · meta',D.f01.prop],
       ['Componente',D.f01.comp],['Actividad (punto de partida de la EDT)',D.f01.act],['Población objetivo',D.f01.pob]
      ].filter(function(r){ return txt(r[1]); }).map(function(r){
        return '<tr><th style="width:32%">'+esc(r[0])+'</th><td>'+nl2br(r[1])+'</td></tr>';
      }).join('')+'</table>';
  }
  return h;
}

/* ---------------- PLANILLA DE CÁLCULO (.xlsx nativo) ---------------- */
function T(v){ return {v: (v==null?'':String(v)), s:2}; }
function N(v){ var x = parseFloat(String(v).replace(',','.'));
  return isFinite(x) ? {v:x, n:true, s:3} : {v:(v==null?'':String(v)), s:2}; }
function L(v){ return {v:(v==null?'':String(v)), s:7}; }
function H(v){ return {v:(v==null?'':String(v)), s:1}; }

function xAcciones(et){
  var Ls = accList(et);
  var f = [[H('COD'),H('ACCIÓN'),H('TAREA'),H('COMPONENTE'),H('PREDECESORAS'),H('VÍNCULO'),
            H('DURACIÓN ('+unidad(et)+')'),H('PERIODICIDAD')]];
  Ls.forEach(function(a,i){
    if(!txt(a.n)) return;
    var ts = tareas(a); if(!ts.length) ts = [{t:''}];
    var pre = (a.pre||[]).map(function(p){ return codeOf(p); }).join(' - ') || '--';
    ts.forEach(function(t,k){
      f.push([L(codeOf(i)), T(k===0?txt(a.n):''), T(txt(t.t)), T(k===0?txt(a.comp):''),
              T(k===0?pre:''), T(k===0?(a.tp||'FI'):''), k===0?N(a.dur):T(''), T(k===0?txt(a.per):'')]);
    });
  });
  if(f.length === 1) f.push([T('—'),T('sin acciones cargadas'),T(''),T(''),T(''),T(''),T(''),T('')]);
  return {nombre:'ACCIONES-'+(et==='inv'?'I':'O'), filas:f, anchos:[6,34,34,30,14,9,14,22]};
}
function xGantt(et){
  var Ls = accList(et), sc = schedule(et);
  var Tt = Math.max(1, Math.ceil(sc.T), Math.ceil(et==='inv' ? (+D.esc.invN||0) : (+D.esc.opeN||0)));
  Tt = Math.min(Tt, 40);
  var cab = [H('COD'),H('ACCIÓN'),H('INICIO'),H('FIN'),H('DURACIÓN'),H('HOLGURA')];
  for(var t=1;t<=Tt;t++) cab.push(H(String(t)));
  var f = [cab], est = (et==='inv') ? 4 : 5;
  Ls.forEach(function(a,i){
    if(!txt(a.n)) return;
    var crit = sc.hol[i] <= .001 && sc.dur[i] > 0;
    var r = [L(codeOf(i)), T(txt(a.n)), N(Math.round(sc.ES[i]*100)/100), N(Math.round(sc.EF[i]*100)/100),
             N(Math.round(sc.dur[i]*100)/100), N(Math.round(sc.hol[i]*100)/100)];
    for(var k=0;k<Tt;k++){
      var on = (k+1 > sc.ES[i]) && (k < sc.EF[i]) && sc.dur[i] > 0;
      r.push(on ? {v:'', s:(crit ? 6 : est)} : {v:'', s:2});
    }
    f.push(r);
  });
  if(f.length === 1) f.push([T('—'),T('sin acciones cargadas')]);
  f.push([]);
  f.push([L('Escala'), T(unidad(et)), L('Duración total'), N(Math.round(sc.T*100)/100)]);
  f.push([T(''), T('Las celdas en color cálido son las de la ruta crítica (holgura cero).')]);
  var an = [6,34,9,9,10,10];
  for(var q=0;q<Tt;q++) an.push(4.5);
  return {nombre:'GANTT-'+(et==='inv'?'I':'O'), filas:f, anchos:an};
}
function xRec(et){
  var Ls = accList(et);
  var cab = [H('COD'),H('ACCIÓN'),H('TAREA'),H('RECURSO NECESARIO'),H('UNIDAD'),H('CANTIDAD')];
  if(et === 'ope') cab.push(H('ORIGEN'));
  var f = [cab];
  D.rec[et].forEach(function(r){
    if(!txt(r.r) && !txt(r.t)) return;
    var i = LET.indexOf(r.a);
    var fila = [L(r.a), T((i>=0 && Ls[i]) ? txt(Ls[i].n) : ''), T(txt(r.t)), T(txt(r.r)), T(txt(r.u)), N(r.c)];
    if(et === 'ope') fila.push(T(r.o === 'capital' ? 'capital ya incorporado en la inversión' : 'gasto operativo'));
    f.push(fila);
  });
  if(f.length === 1) f.push([T('—'),T('sin recursos cargados')]);
  var an = [6,30,30,30,14,11];
  if(et === 'ope') an.push(30);
  return {nombre:'RECURSOS-'+(et==='inv'?'I':'O'), filas:f, anchos:an};
}
function expXLS(){
  var d = D.dim;
  var dimF = [[H('CAMPO'),H('VALOR')]];
  [['Equipo',D.eq.nombre],['Proyecto',D.eq.proy],['Coordinación',D.eq.coord],
   ['Actividad (EAP · F01)',D.f01.act],['Componente (EAP · F01)',D.f01.comp],
   ['Problema central (F01)',D.f01.pc],['Línea de base (F01)',D.f01.lb],['Población objetivo (F01)',D.f01.pob],
   ['Tipo de proyecto',d.tipo],['Indicador del tamaño',d.ind],['Unidad de medida',d.unid],
   ['Período de referencia',d.per],['Capacidad de producción',d.cap],['Capacidad instalada',d.instal],
   ['Capacidad ociosa',d.ocio],['Beneficiarios o usuarios',d.benef],['Magnitud del problema',d.mag],
   ['Demanda actual',d.demA],['Demanda futura',d.demF],['Tecnología',d.tec],['Materias primas e insumos',d.mp],
   ['Localización',d.loc],['Escala temporal',d.escala],['Ritmo de producción',d.ritmo],
   ['Tamaño óptimo',d.opt],['Coherencia problema–demanda–capacidad',d.coh],
   ['Dimensionamiento (párrafo)',d.txt],['Macro localización',D.loc.macro],['Micro localización',D.loc.micro],
   ['Descripción general del proyecto',D.des.txt],['Escala temporal de la inversión',D.esc.inv],
   ['Escala temporal de la operación',D.esc.ope]
  ].forEach(function(r){ dimF.push([L(r[0]), T(r[1])]); });

  var fluF = [[H('ETAPA'),H('Nº'),H('PASO DEL PROCESO')]];
  (D.flu.inv||[]).filter(function(x){ return txt(x.t); }).forEach(function(x,i){ fluF.push([T('Inversión'), N(i+1), T(txt(x.t))]); });
  (D.flu.ope||[]).filter(function(x){ return txt(x.t); }).forEach(function(x,i){ fluF.push([T('Operación'), N(i+1), T(txt(x.t))]); });
  if(fluF.length === 1) fluF.push([T('—'),T(''),T('sin pasos cargados')]);

  var desF = [[H('ETAPA'),H('COD'),H('ACCIÓN'),H('DESCRIPCIÓN')]];
  ['inv','ope'].forEach(function(et){
    accList(et).forEach(function(a,i){
      if(!txt(a.n)) return;
      desF.push([T(et==='inv'?'Inversión':'Operación'), L(codeOf(i)), T(txt(a.n)), T(txt(a.d.txt))]);
    });
  });
  if(desF.length === 1) desF.push([T('—'),T(''),T(''),T('sin acciones cargadas')]);

  var hojas = [
    {nombre:'DIMENSION', filas:dimF, anchos:[34,88]},
    {nombre:'FLUJOGRAMAS', filas:fluF, anchos:[14,6,60]},
    xAcciones('inv'), xAcciones('ope'),
    {nombre:'DESCRIPCIONES', filas:desF, anchos:[13,6,34,100]},
    xGantt('inv'), xGantt('ope'),
    xRec('inv'), xRec('ope')
  ];
  try{
    var bytes = xlsxBuild(hojas);
    dlBlob('Planilla_F02_'+slug(D.eq.nombre)+'.xlsx',
           new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    toast('Planilla de cálculo descargada, con nueve hojas.');
  }catch(err){ toast('No se pudo generar la planilla: ' + err.message); }
}

document.getElementById('fileIn').addEventListener('change', function(ev){
  var f = ev.target.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var o = JSON.parse(rd.result);
      if(o && o.tipo === 'f02'){
        merge(o); touch(); railBuild(); show(cur);
        toast('Avance del F02 cargado' + (o.ts ? ' · guardado el '+o.ts : '') + '.');
      } else if(o && (o.eap || o.pc !== undefined || o.esc !== undefined)){
        f01Take(o, o.esc);
        railBuild(); show(cur);
        toast('Datos del Formulario 01' + (o.esc ? ' (Escenario '+o.esc+')' : '') + ' importados.');
      } else {
        toast('Ese archivo no parece un avance del F01 ni del F02.');
      }
    }catch(e){ toast('No se pudo leer ese archivo.'); }
  };
  rd.readAsText(f);
  ev.target.value = '';
});
