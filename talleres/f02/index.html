<!doctype html>
<html lang="es" data-theme="dark" data-rail="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FEPAR 2026 · Visor de trabajo del Formulario 02 — Estudios técnicos, acciones y tareas</title>
<meta name="description" content="Herramienta de trabajo del Taller 02 de FEPAR 2026: dimensionamiento, flujogramas, estructura de desglose de tareas, secuenciación, diagrama de Gantt y determinación de recursos, con exportación del Formulario 02.">
<style>

:root{
  --bg:#06110d; --bg2:#0a1a14; --panel:#0e2019; --panel2:#0b1a15;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.19);
  --tx:#eaf5f0; --tx2:#b9cfc6; --tx3:#7f9a90;
  --verde:#00a05a; --verde-l:#22c97f; --aqua:#12b5a0; --celeste:#39b6d8;
  --oro:#eda100; --violeta:#7b6bd6; --coral:#ef6a4b; --ok:#00c06a; --bad:#ef5350;
  --ff:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fh:var(--ff);
  --r:16px; --r-s:12px; --rail:300px;
  --shadow:0 22px 60px -26px rgba(0,0,0,.85);
}
html[data-theme="light"]{
  --bg:#f2f6f4; --bg2:#e8efec; --panel:#fff; --panel2:#f7faf9;
  --line:rgba(16,36,29,.12); --line2:rgba(16,36,29,.24);
  --tx:#10241d; --tx2:#3c554c; --tx3:#6b8279;
  --shadow:0 22px 60px -30px rgba(16,36,29,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ff);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(1100px 700px at 12% -6%, rgba(0,160,90,.16), transparent 60%),
   radial-gradient(900px 560px at 94% 6%, rgba(237,161,0,.11), transparent 60%),
   radial-gradient(1000px 700px at 55% 112%, rgba(123,107,214,.10), transparent 62%)}
html[data-theme="light"] body::before{
  background:
   radial-gradient(1100px 700px at 12% -6%, rgba(0,160,90,.10), transparent 60%),
   radial-gradient(900px 560px at 94% 6%, rgba(237,161,0,.09), transparent 60%)}
::selection{background:rgba(0,160,90,.35)}

/* scrollbars visibles en los dos ejes */
*{scrollbar-width:thin;scrollbar-color:rgba(0,192,106,.7) rgba(255,255,255,.05)}
*::-webkit-scrollbar{width:12px;height:12px}
*::-webkit-scrollbar-track{background:rgba(255,255,255,.05);border-radius:12px}
*::-webkit-scrollbar-thumb{background:rgba(0,192,106,.7);border-radius:12px;
  border:3px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:var(--verde-l);background-clip:padding-box;border:3px solid transparent}
*::-webkit-scrollbar-corner{background:transparent}
html[data-theme="light"] *{scrollbar-color:rgba(0,140,80,.55) rgba(0,0,0,.06)}
html[data-theme="light"] *::-webkit-scrollbar-track{background:rgba(0,0,0,.06)}

/* ===================== ESTRUCTURA ===================== */
#top{position:fixed;top:0;left:var(--rail);right:0;height:4px;z-index:40;background:rgba(255,255,255,.06);
  transition:left .3s cubic-bezier(.22,.9,.28,1)}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--verde),var(--aqua) 45%,var(--oro));
  transition:width .45s cubic-bezier(.22,.9,.28,1)}
#stage{position:fixed;top:4px;right:0;bottom:0;left:var(--rail);z-index:1;
  transition:left .3s cubic-bezier(.22,.9,.28,1)}
.sec{position:absolute;inset:0;display:none;flex-direction:column;gap:clamp(10px,1.4vh,18px);
  padding:clamp(16px,2.6vh,34px) clamp(18px,3.4vw,64px) 78px;overflow:auto;
  opacity:0;transform:translateY(14px)}
.sec.on{display:flex;animation:in .38s cubic-bezier(.22,.9,.28,1) forwards}
@keyframes in{to{opacity:1;transform:none}}
.fill{flex:1;min-height:0}
/* pantallas de trabajo: los paneles conservan su alto natural y la pantalla se desplaza */
.sec.work>*{flex:none!important}
.sec.work .fill{flex:none!important;min-height:0}

/* ===================== HUD ===================== */
#hud{position:fixed;bottom:0;left:var(--rail);right:0;height:58px;z-index:40;display:flex;align-items:center;
  gap:9px;padding:0 clamp(12px,2.4vw,34px);backdrop-filter:blur(8px);
  background:linear-gradient(0deg,rgba(0,0,0,.5),transparent);transition:left .3s cubic-bezier(.22,.9,.28,1)}
html[data-theme="light"] #hud{background:linear-gradient(0deg,rgba(255,255,255,.8),transparent)}
.hud-b{border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--tx2);
  border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:var(--ff);
  transition:.18s;white-space:nowrap}
.hud-b:hover{color:var(--tx);border-color:var(--verde);background:rgba(0,160,90,.14)}
.hud-b.pri{background:var(--verde);border-color:var(--verde);color:#04150e;font-weight:650}
.hud-b.pri:hover{background:var(--verde-l);color:#04150e}
html[data-theme="light"] .hud-b{background:rgba(255,255,255,.85)}
#counter{font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums;margin-left:auto;flex:none}
#saved{font-size:11.5px;color:var(--tx3);flex:none}
#saved.on{color:var(--verde-l)}
#zwrap{display:inline-flex;align-items:center;gap:4px;flex:none}
#zlabel{font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums;min-width:44px;text-align:center;cursor:pointer}

/* ===================== ÍNDICE LATERAL ===================== */
#rail{position:fixed;top:0;left:0;bottom:0;width:var(--rail);z-index:50;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--panel),var(--bg2));border-right:1px solid var(--line)}
#rail.off{display:none}
#rail-h{padding:15px 16px 11px;border-bottom:1px solid var(--line);flex:none}
#rail-h .rt{font-size:14.5px;font-weight:800;line-height:1.2}
#rail-h .rs{font-size:11px;color:var(--tx3);margin-top:3px}
#rail-b{flex:1;overflow:auto;padding:9px 9px 14px}
#rail-f{flex:none;padding:9px 13px 13px;border-top:1px solid var(--line)}
.rg{margin-bottom:5px;border-radius:11px;overflow:hidden;border:1px solid transparent}
.rg.cur{border-color:var(--line2);background:rgba(255,255,255,.035)}
.rg-h{display:flex;align-items:center;gap:9px;padding:8px 9px;cursor:pointer;transition:.16s}
.rg-h:hover{background:rgba(255,255,255,.05)}
.rg-n{flex:none;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:800;border:1px solid var(--line2);color:var(--tx3)}
.rg.cur .rg-n{background:var(--verde);border-color:var(--verde);color:#04150e}
.rg.done .rg-n{border-color:var(--verde);color:var(--verde-l)}
.rg-t{flex:1;min-width:0}
.rg-t b{display:block;font-size:12.5px;color:var(--tx2);font-weight:650;line-height:1.25}
.rg.cur .rg-t b{color:var(--tx)}
.rg-t span{font-size:10.5px;color:var(--tx3)}
.rg-p{height:3px;border-radius:3px;background:rgba(255,255,255,.08);margin:0 9px 7px;overflow:hidden}
.rg-p i{display:block;height:100%;background:linear-gradient(90deg,var(--verde),var(--aqua));border-radius:3px;
  transition:width .4s cubic-bezier(.22,.9,.28,1)}
.rg-l{display:none}
.rg.open .rg-l{display:block;padding:0 6px 6px}
.ri{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:8px;cursor:pointer;
  font-size:11.5px;color:var(--tx3);line-height:1.3;transition:.14s}
.ri:hover{background:rgba(255,255,255,.06);color:var(--tx2)}
.ri.cur{background:rgba(0,160,90,.16);color:var(--tx);font-weight:600;box-shadow:inset 2px 0 0 var(--verde-l)}
.ri .rn{flex:none;width:16px;font-size:10px;opacity:.7;text-align:right}
.ri .rk{flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line2)}
.ri.ok .rk{background:var(--verde);border-color:var(--verde)}
.ri.part .rk{background:var(--oro);border-color:var(--oro)}
#rail-toggle{border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--tx2);
  border-radius:8px;padding:5px 9px;font-size:11px;cursor:pointer;font-family:var(--ff)}

/* ===================== TIPOGRAFÍA ===================== */
h1{font-size:clamp(26px,3.4vw,44px);line-height:1.05;letter-spacing:-.03em;margin:0;font-weight:800}
h2{font-size:clamp(21px,2.5vw,33px);line-height:1.1;letter-spacing:-.025em;margin:0;font-weight:800}
h3{font-size:15px;margin:0;font-weight:700;letter-spacing:-.01em}
h4{font-size:12.5px;margin:0;font-weight:700;color:var(--tx2)}
p{margin:0}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--verde-l);font-weight:700}
.eyebrow::before{content:"";width:24px;height:2px;background:linear-gradient(90deg,var(--verde),transparent);border-radius:2px}
.lead{font-size:clamp(14px,1.15vw,17px);color:var(--tx2);line-height:1.5;max-width:88ch}
.sub{font-size:13px;color:var(--tx2);line-height:1.5}
.tiny{font-size:11.5px;color:var(--tx3);line-height:1.45}
.mono{font-family:ui-monospace,Consolas,monospace}
.g{color:var(--verde-l)} .o{color:var(--oro)} .c{color:var(--coral)}
.hl{background:linear-gradient(180deg,transparent 62%,rgba(237,161,0,.35) 0);padding:0 2px}
.kbd{font-family:ui-monospace,Consolas,monospace;font-size:11px;border:1px solid var(--line2);
  border-radius:5px;padding:1px 5px;color:var(--tx2);background:rgba(255,255,255,.05)}

/* ===================== LAYOUT ===================== */
.row{display:flex;gap:clamp(10px,1.3vw,18px)}
.col{display:flex;flex-direction:column;gap:clamp(9px,1.2vh,16px)}
.grid{display:grid;gap:clamp(10px,1.1vw,16px)}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)} .g5{grid-template-columns:repeat(5,1fr)}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.scrolly{overflow:auto;min-height:0}

/* ===================== COMPONENTES ===================== */
.card{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:var(--r);padding:clamp(12px,1.3vw,20px);position:relative;overflow:auto;
  overflow-wrap:break-word;transition:.22s}
.card>.tag{position:absolute;top:0;left:0;width:100%;height:3px;background:var(--verde);opacity:.85}
.card.oro>.tag{background:var(--oro)} .card.vio>.tag{background:var(--violeta)}
.card.coral>.tag{background:var(--coral)} .card.cel>.tag{background:var(--celeste)}
.card.aqua>.tag{background:var(--aqua)}
.box{border:1px solid var(--line);border-radius:var(--r-s);padding:11px 13px;background:rgba(255,255,255,.035)}
.box.ok{border-color:rgba(0,192,106,.45);background:rgba(0,192,106,.09)}
.box.bad{border-color:rgba(239,83,80,.45);background:rgba(239,83,80,.09)}
.box.warn{border-color:rgba(237,161,0,.45);background:rgba(237,161,0,.09)}
.box.info{border-color:rgba(57,182,216,.45);background:rgba(57,182,216,.09)}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:999px;
  padding:3px 10px;font-size:11.5px;color:var(--tx2)}
.pill.v{border-color:rgba(0,160,90,.5);color:var(--verde-l);background:rgba(0,160,90,.10)}
.pill.o{border-color:rgba(237,161,0,.5);color:var(--oro);background:rgba(237,161,0,.10)}
.pill.p{border-color:rgba(123,107,214,.5);color:var(--violeta);background:rgba(123,107,214,.12)}
.pill.c{border-color:rgba(239,106,75,.5);color:var(--coral);background:rgba(239,106,75,.10)}
.pill.a{border-color:rgba(57,182,216,.5);color:var(--celeste);background:rgba(57,182,216,.10)}
.btn{border:1px solid var(--verde);background:rgba(0,160,90,.16);color:var(--verde-l);
  border-radius:999px;padding:8px 15px;font-size:13px;cursor:pointer;font-family:var(--ff);
  font-weight:600;transition:.18s}
.btn:hover{background:var(--verde-l);color:#04150e}
.btn.ghost{border-color:var(--line2);color:var(--tx2);background:transparent}
.btn.ghost:hover{border-color:var(--oro);color:var(--oro);background:rgba(237,161,0,.1)}
.btn.sm{padding:5px 11px;font-size:12px}
.btn.xs{padding:3px 9px;font-size:11.5px}
.num{font-size:clamp(22px,2.3vw,34px);line-height:1;color:var(--verde-l);font-weight:800}
.hr{height:1px;background:var(--line);margin:2px 0}

/* ===================== FORMULARIO ===================== */
label.fl{display:block;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);
  font-weight:700;margin-bottom:5px}
input.fi,textarea.fa,select.fs{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line2);
  border-radius:10px;color:var(--tx);font-family:var(--ff);font-size:13.5px;padding:9px 11px;
  line-height:1.5;transition:.16s;resize:vertical}
html[data-theme="light"] input.fi,html[data-theme="light"] textarea.fa,html[data-theme="light"] select.fs{background:#fff}
input.fi:focus,textarea.fa:focus,select.fs:focus{outline:none;border-color:var(--verde);
  background:rgba(0,160,90,.08);box-shadow:0 0 0 3px rgba(0,160,90,.14)}
textarea.fa{min-height:88px}
textarea.fa.tall{min-height:150px}
textarea.fa.short{min-height:56px}
select.fs option{background:var(--panel);color:var(--tx)}
html[data-theme="light"] select.fs option{background:#fff;color:#10241d}
.fcount{font-size:10.5px;color:var(--tx3);text-align:right;margin-top:3px;font-variant-numeric:tabular-nums}
.fcount.warn{color:var(--oro)} .fcount.ok{color:var(--verde-l)}
.frow{display:flex;gap:9px;align-items:flex-start}
.frow>*{flex:1;min-width:0}
.fdel{flex:none!important;width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);
  background:rgba(255,255,255,.05);color:var(--tx3);cursor:pointer;font-size:13px;line-height:1}
.fdel:hover{border-color:var(--coral);color:var(--coral)}

/* ===================== TABLAS ===================== */
table.tb{width:100%;border-collapse:collapse;font-size:12.5px}
table.tb th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);
  font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line2);vertical-align:bottom}
table.tb td{padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--tx2)}
table.tb tr:last-child td{border-bottom:none}
table.tb input,table.tb textarea,table.tb select{width:100%;background:transparent;border:none;
  border-bottom:1px dashed var(--line2);color:var(--tx);font-family:var(--ff);font-size:12.5px;
  padding:4px 2px;resize:vertical}
table.tb input:focus,table.tb textarea:focus,table.tb select:focus{outline:none;border-bottom-color:var(--verde)}
table.tb select{border-bottom:1px dashed var(--line2)}
table.tb select option{background:var(--panel);color:var(--tx)}
html[data-theme="light"] table.tb select option{background:#fff;color:#10241d}

/* MML */
table.mml{width:100%;border-collapse:collapse;font-size:12px;min-width:820px}
table.mml th{background:rgba(0,160,90,.14);color:var(--verde-l);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;padding:8px;text-align:left;border:1px solid var(--line2);font-weight:700}
table.mml td{border:1px solid var(--line);padding:5px;vertical-align:top}
table.mml td textarea{width:100%;min-height:66px;background:transparent;border:none;color:var(--tx);
  font-family:var(--ff);font-size:12px;padding:4px;resize:vertical;line-height:1.45}
table.mml td textarea:focus{outline:none;background:rgba(0,160,90,.08);border-radius:6px}
table.mml td.lv{background:rgba(255,255,255,.04);width:15%}
table.mml .lvn{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--verde-l);font-weight:800}

/* árbol */
.tnode{display:flex;align-items:flex-start;gap:7px;border:1px solid var(--line2);border-radius:10px;
  padding:6px 9px;background:rgba(255,255,255,.045);transition:.16s}
.tnode.lv1{border-left:3px solid var(--coral)}
.tnode.lv2{border-left:3px solid var(--oro);margin-left:18px}
.tnode.lv3{border-left:3px solid var(--violeta);margin-left:36px}
.tnode.ef1{border-left:3px solid var(--celeste)}
.tnode.ef2{border-left:3px solid var(--aqua);margin-left:18px}
.tnode input{flex:1;min-width:0;background:transparent;border:none;color:var(--tx);font-size:12.5px;
  font-family:var(--ff);padding:2px}
.tnode input:focus{outline:none}
.tnode .lvb{flex:none;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);
  border:1px solid var(--line2);border-radius:6px;padding:1px 6px;cursor:pointer;background:transparent;
  font-family:var(--ff)}
.tnode .lvb:hover{border-color:var(--verde);color:var(--verde-l)}
.trunk{border:2px solid var(--verde);border-radius:13px;padding:11px 15px;background:rgba(0,160,90,.15)}
.trunk .lb{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--verde-l);font-weight:800}
.trunk .tx{font-size:14px;font-weight:700;line-height:1.35;margin-top:4px}
.mirror{display:grid;grid-template-columns:1fr 34px 1fr;gap:8px;align-items:center}
.mirror .ar{text-align:center;color:var(--verde-l);font-size:16px}

/* semáforo / progreso */
.meter{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--verde),var(--aqua));
  border-radius:6px;transition:width .45s cubic-bezier(.22,.9,.28,1)}
.meter.o i{background:linear-gradient(90deg,var(--oro),var(--coral))}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line2);flex:none}
.dot.ok{background:var(--verde)} .dot.part{background:var(--oro)}
.chk{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border:1px solid var(--line);
  border-radius:10px;background:rgba(255,255,255,.03);cursor:pointer;transition:.16s;font-size:12.5px;
  line-height:1.45;color:var(--tx2)}
.chk:hover{border-color:var(--line2)}
.chk input{margin-top:2px;accent-color:var(--verde);flex:none}
.chk.on{border-color:rgba(0,192,106,.45);background:rgba(0,192,106,.08);color:var(--tx)}

/* ítems del F01 */
.f01nav{display:flex;flex-wrap:wrap;gap:5px}
.f01b{width:33px;height:33px;border-radius:9px;border:1px solid var(--line2);background:rgba(255,255,255,.045);
  color:var(--tx2);font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--ff);position:relative;
  transition:.16s}
.f01b:hover{border-color:var(--verde);color:var(--verde-l)}
.f01b.on{background:var(--verde);border-color:var(--verde);color:#04150e}
.f01b.done::after{content:"";position:absolute;right:3px;bottom:3px;width:6px;height:6px;border-radius:50%;
  background:var(--verde-l)}
.f01b.on.done::after{background:#04150e}
.f01b.s2{border-color:rgba(237,161,0,.45)} .f01b.s2.on{background:var(--oro);border-color:var(--oro)}
.f01b.s3{border-color:rgba(123,107,214,.45)} .f01b.s3.on{background:var(--violeta);border-color:var(--violeta)}
.f01b.s4{border-color:rgba(57,182,216,.45)} .f01b.s4.on{background:var(--celeste);border-color:var(--celeste)}
.tk{list-style:none;padding:0;margin:0}
.tk li{position:relative;padding-left:16px;margin-top:5px;font-size:12.5px;color:var(--tx2);line-height:1.45}
.tk li::before{content:"◆";position:absolute;left:0;top:0;color:var(--verde-l);font-size:8px;line-height:1.9}
.tk.o li::before{color:var(--oro)} .tk.c li::before{color:var(--coral)}

/* esquema svg */
.esq{border:1px solid var(--line);border-radius:var(--r-s);padding:12px;background:rgba(255,255,255,.03);
  overflow:auto}
svg.esq-s{width:100%;height:auto;display:block;min-width:640px}

/* overlays */
.ov{position:fixed;inset:0;z-index:60;background:rgba(3,10,8,.9);backdrop-filter:blur(9px);
  display:none;flex-direction:column;padding:0}
html[data-theme="light"] .ov{background:rgba(240,246,243,.95)}
.ov.on{display:flex;animation:in .22s ease forwards}

<script>
"use strict";
/* =============================================================== ESTADO */
var KEY = 'fepar2026_f02';
var LET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

function blankAcc(){
  return {n:'', comp:'', tar:[{t:''}], pre:[], tp:'FI', dur:'', per:'', capDe:'',
          d:{obj:'',res:'',des:'',resp:'',rec:'',ind:'',txt:''}};
}
function blank(){
  return {
    v:1, tipo:'f02', ts:'', origen:'',
    eq:{nombre:'',coord:'',proy:'',met:''},
    ints:[{ap:'',fun:'',hs:''},{ap:'',fun:'',hs:''},{ap:'',fun:'',hs:''}],
    f01:{pc:'',obj:'',prop:'',fin:'',act:'',comp:'',lb:'',pob:'',nom:''},
    dim:{tipo:'',ind:'',mag:'',afect:'',esp:'',demA:'',demF:'',parte:'',pctDem:'',
         cap:'',unid:'',per:'',instal:'',ocio:'',tec:'',tecLim:'',mp:'',sum:'',
         loc:'',escala:'',ritmo:'',opt:'',coh:'',benef:'',txt:''},
    loc:{macro:'',micro:'',fm:{},fmi:{}},
    flu:{inv:[{t:''},{t:''},{t:''}], ope:[{t:''},{t:''},{t:''}]},
    des:{prop:'',comp:'',act:'',car:'',txt:''},
    acc:{inv:[blankAcc()], ope:[blankAcc()]},
    esc:{inv:'meses', ope:'años', invN:12, opeN:5},
    rec:{inv:[], ope:[]},
    quiz:{}, ck:[], ej:0, rub:{}
  };
}
var D = blank();

function get(p){ var o=D, a=p.split('.'); for(var i=0;i<a.length;i++){ if(o==null) return ''; o=o[a[i]]; } return o==null?'':o; }
function set(p,v){ var o=D, a=p.split('.'); for(var i=0;i<a.length-1;i++){ if(o[a[i]]==null) o[a[i]]={}; o=o[a[i]]; } o[a[a.length-1]]=v; }

var saveT=null, savedEl=null;
function touch(){
  clearTimeout(saveT);
  saveT = setTimeout(function(){
    D.ts = nowStr();
    try{ localStorage.setItem(KEY, JSON.stringify(D)); flagSaved('guardado ' + D.ts.slice(11,16)); }
    catch(e){ flagSaved('sin guardado automático'); }
  }, 500);
  paintProgress();
}
function flagSaved(t){ if(!savedEl) savedEl=document.getElementById('saved');
  savedEl.textContent = t; savedEl.classList.add('on');
  setTimeout(function(){ savedEl.classList.remove('on'); }, 1600); }
function nowStr(){
  var d=new Date(), z=function(n){return (n<10?'0':'')+n;};
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes());
}
function loadLocal(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return false;
    var o = JSON.parse(raw);
    if(o){ merge(o); return true; }
  }catch(e){}
  return false;
}
function merge(o){
  var b = blank();
  Object.keys(b).forEach(function(k){ if(o[k] !== undefined && o[k] !== null) b[k] = o[k]; });
  /* saneamiento: toda acción debe tener sus subestructuras */
  ['inv','ope'].forEach(function(et){
    if(!Array.isArray(b.acc[et]) || !b.acc[et].length) b.acc[et] = [blankAcc()];
    b.acc[et].forEach(function(a){
      if(!a.d) a.d = blankAcc().d;
      if(!Array.isArray(a.tar) || !a.tar.length) a.tar = [{t:''}];
      if(!Array.isArray(a.pre)) a.pre = [];
      if(!a.tp) a.tp = 'FI';
    });
    if(!Array.isArray(b.rec[et])) b.rec[et] = [];
    if(!Array.isArray(b.flu[et])) b.flu[et] = [{t:''}];
  });
  D = b;
}

/* =============================================================== MODELO F02 */
function codeOf(i){ return i < 26 ? LET[i] : LET[Math.floor(i/26)-1] + LET[i%26]; }
function accList(et){ return D.acc[et] || []; }
function accNamed(et){ return accList(et).filter(function(a){ return txt(a.n); }); }

function tareas(a){ return (a.tar||[]).filter(function(t){ return txt(t.t); }); }

/* detección de ciclos en las predecesoras */
function creaCiclo(et, i, j){
  /* ¿agregar j como predecesora de i genera un ciclo? */
  var L = accList(et), seen = {};
  function up(k, depth){
    if(depth > 60) return true;
    if(k === i) return true;
    if(seen[k]) return false;
    seen[k] = 1;
    var pre = L[k] ? (L[k].pre||[]) : [];
    for(var x=0; x<pre.length; x++){ if(up(pre[x], depth+1)) return true; }
    return false;
  }
  return up(j, 0);
}
function ciclos(et){
  var L = accList(et), bad = [];
  L.forEach(function(a, i){
    var seen = {};
    (function up(k, depth){
      if(depth > 60){ bad.push(i); return; }
      if(seen[k]) return;
      seen[k]=1;
      (L[k] ? (L[k].pre||[]) : []).forEach(function(p){
        if(p === i){ bad.push(i); return; }
        up(p, depth+1);
      });
    })(i, 0);
  });
  return bad.filter(function(v,k,arr){ return arr.indexOf(v)===k; });
}

/* CPM: calcula inicio y fin tempranos y la holgura de cada acción */
function schedule(et){ return scheduleOf(accList(et)); }
function scheduleOf(L){
  var n = L.length;
  var dur = L.map(function(a){ var d = parseFloat(String(a.dur).replace(',','.')); return (isFinite(d) && d>0) ? d : 0; });
  var ES = new Array(n).fill(0), EF = new Array(n).fill(0), done = new Array(n).fill(false);
  var guard = 0;
  while(done.indexOf(false) >= 0 && guard++ < n + 80){
    L.forEach(function(a, i){
      if(done[i]) return;
      var pre = (a.pre||[]).filter(function(p){ return p>=0 && p<n && p!==i; });
      if(pre.some(function(p){ return !done[p]; })) return;
      var s = 0, e = null, tp = a.tp || 'FI';
      pre.forEach(function(p){
        if(tp === 'II') s = Math.max(s, ES[p]);
        else if(tp === 'FF'){ e = Math.max(e==null?0:e, EF[p]); }
        else if(tp === 'IF'){ e = Math.max(e==null?0:e, ES[p]); }
        else s = Math.max(s, EF[p]);
      });
      if(e != null){ EF[i] = Math.max(e, s + dur[i]); ES[i] = Math.max(0, EF[i] - dur[i]); }
      else { ES[i] = s; EF[i] = s + dur[i]; }
      done[i] = true;
    });
  }
  /* las que quedaron en ciclo arrancan en 0 */
  for(var i=0;i<n;i++){ if(!done[i]){ ES[i]=0; EF[i]=dur[i]; } }
  var T = Math.max.apply(null, EF.concat([0]));
  /* hacia atrás */
  var LF = new Array(n).fill(T), LS = new Array(n).fill(T);
  for(var it=0; it<n+4; it++){
    for(var k=0;k<n;k++){ LS[k] = LF[k] - dur[k]; }
    for(var k2=0;k2<n;k2++){
      var succ = [];
      L.forEach(function(a,j){ if((a.pre||[]).indexOf(k2)>=0) succ.push(j); });
      if(succ.length) LF[k2] = Math.min.apply(null, succ.map(function(j){ return LS[j]; }));
    }
  }
  var hol = ES.map(function(v,i){ return Math.round((LS[i]-ES[i])*100)/100; });
  return {ES:ES, EF:EF, dur:dur, T:T, hol:hol};
}

/* =============================================================== AUTOAJUSTE */
var FITMIN = .76, FITMAX = 1.14;
function overflowPx(s){
  var n = Math.max(0, s.scrollHeight - s.clientHeight - 3);
  s.querySelectorAll('.card,.scrolly,.dgm').forEach(function(e){
    if(e.classList.contains('nofit') || getComputedStyle(e).display === 'none') return;
    var dy = e.scrollHeight - e.clientHeight - 6;
    var dx = e.scrollWidth - e.clientWidth - 14;
    if(dy > 0) n += dy;
    if(dx > 0) n += dx;
  });
  return n;
}
function nofitOver(s){
  var t = false;
  s.querySelectorAll('.nofit').forEach(function(e){
    if(e.scrollHeight > e.clientHeight + 6 || e.scrollWidth > e.clientWidth + 14) t = true; });
  return t;
}
function measureFit(s){
  var z = 1, g = 0;
  s.style.zoom = 1;
  if(SECS[cur] && SECS[cur].work) return 1;
  var base = overflowPx(s);
  if(base === 0){
    while(z < FITMAX - 1e-6 && g++ < 14 && !nofitOver(s)){
      var nz = Math.min(FITMAX, Math.round((z + .04)*100)/100);
      s.style.zoom = nz;
      if(overflowPx(s) > 0 || nofitOver(s)){ s.style.zoom = z; break; }
      z = nz;
    }
  } else {
    var best = z, bestN = base;
    while(z - .03 > FITMIN - 1e-6 && g++ < 18){
      z = Math.round((z - .03)*100)/100;
      s.style.zoom = z;
      var n = overflowPx(s);
      if(n < bestN){ bestN = n; best = z; }
      if(n === 0) break;
    }
    if(bestN > 0 && bestN > base * .75) best = 1;
    z = best; s.style.zoom = z;
  }
  return z;
}
function balUndo(e){
  if(!e.dataset.bal) return;
  e.style.paddingTop = '';
  [].forEach.call(e.children, function(c){ if(c.dataset && c.dataset.bal){ c.style.marginTop=''; delete c.dataset.bal; } });
  delete e.dataset.bal;
}
function balance(root){
  root.querySelectorAll('.card').forEach(function(e){
    balUndo(e);
    var cs = getComputedStyle(e);
    if(cs.display === 'none') return;
    var er = e.getBoundingClientRect();
    if(er.height < 130) return;
    var padT = parseFloat(cs.paddingTop), padB = parseFloat(cs.paddingBottom);
    var bot = er.top + padT, kids = [];
    [].forEach.call(e.children, function(c){
      if(c.classList.contains('pop-b') || c.classList.contains('tag')) return;
      var r = c.getBoundingClientRect();
      if(r.height === 0) return;
      kids.push(c); if(r.bottom > bot) bot = r.bottom;
    });
    if(!kids.length) return;
    var gap = (er.bottom - padB - parseFloat(cs.borderBottomWidth)) - bot;
    if(gap < 46) return;
    var extra = Math.min(gap / (kids.length + 1), 60);
    if(extra < 12) return;
    var h0 = e.offsetHeight;
    e.style.paddingTop = (padT + extra) + 'px';
    for(var k = 1; k < kids.length; k++){
      var m = parseFloat(getComputedStyle(kids[k]).marginTop) || 0;
      kids[k].style.marginTop = (m + extra) + 'px';
      kids[k].dataset.bal = '1';
    }
    e.dataset.bal = '1';
    if(e.offsetHeight > h0 + 2) balUndo(e);
  });
}

/* =============================================================== ZOOM */
var ZOOM = 1, FIT = 1;
function applyZoom(){
  document.getElementById('zlabel').textContent = Math.round(ZOOM*100)+'%';
  var s = SECS[cur] && SECS[cur].el;
  if(!s) return;
  if(window.innerWidth <= 760){ s.style.zoom = ''; return; }
  s.style.zoom = FIT * ZOOM;
}
function fitNow(){
  if(!SECS[cur]) return;
  var s = SECS[cur].el, work = !!SECS[cur].work;
  if(window.innerWidth <= 760){ s.style.zoom = ''; if(!work) balance(s); return; }
  FIT = measureFit(s);
  s.style.zoom = FIT * ZOOM;
  if(!work) balance(s);
}
function setZoom(z){ ZOOM = Math.max(.6, Math.min(2.2, Math.round(z*100)/100)); applyZoom(); }
document.getElementById('b-zi').onclick = function(){ setZoom(ZOOM+.1); };

/* =============================================================== ABRIR PANEL */
var POP = {node:null, ph:null, z:1};
function popArm(root){
  root.querySelectorAll('.card').forEach(function(e){
    if(e.classList.contains('nopop') || e.querySelector(':scope > .pop-b')) return;
    var b = E('button','pop-b','⤢'); b.type='button';
    b.title = 'Abrir este panel a pantalla completa';
    b.addEventListener('click', function(ev){ ev.stopPropagation(); ev.preventDefault(); popOpen(e); });
    e.appendChild(b);
  });
}
function popOpen(e){
  if(POP.node) return;
  POP.ph = E('div','pop-ph');
  e.parentNode.insertBefore(POP.ph, e);
  POP.node = e; e.classList.add('popped');
  var h = e.querySelector('h2,h3,h4');
  document.getElementById('pop-t').textContent = h ? h.textContent.trim().slice(0,70) : 'Panel ampliado';
  document.getElementById('pop-in').appendChild(e);
  POP.z = 1; popZ(0);
  document.getElementById('pop').classList.add('on');
}
function popClose(){
  if(!POP.node) return;
  POP.node.classList.remove('popped');
  POP.ph.parentNode.insertBefore(POP.node, POP.ph);
  POP.ph.parentNode.removeChild(POP.ph);
  POP.node = null; POP.ph = null;
  document.getElementById('pop').classList.remove('on');
  document.getElementById('pop-in').style.zoom = '';
}
function popZ(d){
  POP.z = Math.max(.6, Math.min(2.4, Math.round((POP.z+d)*100)/100));
  document.getElementById('pop-in').style.zoom = POP.z;
  document.getElementById('pop-z').textContent = Math.round(POP.z*100)+'%';
}
document.getElementById('pop-x').onclick = popClose;
document.getElementById('pop-zi').onclick = function(){ popZ(.1); };
document.getElementById('pop-zo').onclick = function(){ popZ(-.1); };
document.getElementById('pop').addEventListener('mousedown', function(ev){
  if(ev.target.id === 'pop-in' || ev.target.id === 'pop') popClose(); });

/* =============================================================== TEMA Y TECLADO */
document.getElementById('b-th').onclick = function(){
  var h = document.documentElement;
  h.dataset.theme = h.dataset.theme === 'light' ? 'dark' : 'light';
  setTimeout(fitNow, 40);
};
document.addEventListener('keydown', function(e){
  var t = e.target.tagName;
  var editing = (t==='INPUT'||t==='TEXTAREA'||t==='SELECT');
  var po = document.getElementById('pop').classList.contains('on');
  if(e.key === 'Escape'){ popClose(); document.getElementById('imgov').classList.remove('on'); return; }
  if(editing) return;
  if(e.key === '+' || e.key === '='){ e.preventDefault(); po?popZ(.1):setZoom(ZOOM+.1); return; }
  if(e.key === '-' || e.key === '_'){ e.preventDefault(); po?popZ(-.1):setZoom(ZOOM-.1); return; }
  if(e.key === '0'){ e.preventDefault(); if(po){POP.z=1;popZ(0);} else setZoom(1); return; }
  if(po) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); prev(); }
  else if(e.key==='i'||e.key==='I'){ railToggle(); }
  else if(e.key==='t'||e.key==='T'){ document.getElementById('b-th').click(); }
});
document.getElementById('b-next').onclick = next;
document.getElementById('b-prev').onclick = prev;
var rzT=null;
window.addEventListener('resize', function(){ clearTimeout(rzT); rzT=setTimeout(fitNow,220); });
</script>

    verde: v('--verde','#00a05a'),
    verdeL:v('--verde-l','#22c97f'),
    aqua:  v('--aqua','#12b5a0'),
    cel:   v('--celeste','#39b6d8'),
    oro:   v('--oro','#eda100'),
    vio:   v('--violeta','#7b6bd6'),
    coral: v('--coral','#ef6a4b'),
    line:  document.documentElement.dataset.theme === 'light' ? 'rgba(16,36,29,.22)' : 'rgba(255,255,255,.20)',
    soft:  document.documentElement.dataset.theme === 'light' ? 'rgba(16,36,29,.07)' : 'rgba(255,255,255,.07)'
  };
}
var SVGFF = "'Segoe UI',system-ui,Arial,Helvetica,sans-serif";
var SING = {'días':'día','semanas':'semana','meses':'mes','años':'año'};
function plu(n, u){
  var x = parseFloat(n);
  return (x === 1 && SING[u]) ? SING[u] : u;
}
function corta(s, n){
  s = String(s||'');
  return s.length > n ? s.slice(0, n-1).replace(/\s+\S*$/,'') + '…' : s;
}

function wrapTxt(s, maxc){
  s = String(s||'').replace(/\s+/g,' ').trim();
  if(!s) return [''];
  var w = s.split(' '), out = [], line = '';
  w.forEach(function(x){
    if((line + ' ' + x).trim().length <= maxc) line = (line ? line+' ' : '') + x;
    else { if(line) out.push(line); line = x; }
  });
  if(line) out.push(line);
  return out;
}
function xesc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function tspans(lines, x, y, lh, fill, size, weight){
  return lines.map(function(l,i){
    return '<text x="'+x+'" y="'+(y+i*lh)+'" fill="'+fill+'" font-size="'+size+'" font-family="'+SVGFF+'"'+
      (weight?' font-weight="'+weight+'"':'')+' text-anchor="middle">'+xesc(l)+'</text>';
  }).join('');
}
function svgWrap(w, h, inner, bg){
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+Math.round(w)+'" height="'+Math.round(h)+'" '+
    'viewBox="0 0 '+Math.round(w)+' '+Math.round(h)+'">'+
    '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">'+
    '<path d="M0,0 L10,5 L0,10 z" fill="'+PAL().tx3+'"/></marker></defs>'+
    (bg ? '<rect width="100%" height="100%" fill="'+bg+'" rx="10"/>' : '')+ inner + '</svg>';
}

/* ---------------- FLUJOGRAMA (serpentina) ---------------- */
function fluSVG(steps, color, titulo){
  var P = PAL();
  var L = (steps||[]).map(function(s){ return String(s.t||s||'').trim(); }).filter(function(s){ return s; });
  if(!L.length) return null;
  var M = 18, BW = 182, GX = 46, GY = 40, LH = 14, MAXC = 22, TOP = 26;
  var per = Math.min(4, Math.max(1, L.length));
  var rows = Math.ceil(L.length / per);
  var lines = L.map(function(s){ return wrapTxt(s, MAXC); });
  var rowH = [];
  for(var r=0;r<rows;r++){
    var h = 54;
    for(var k=r*per; k<Math.min(L.length,(r+1)*per); k++) h = Math.max(h, TOP + 8 + lines[k].length*LH);
    rowH.push(h);
  }
  var W = M*2 + per*BW + (per-1)*GX;
  var H = M*2 + rowH.reduce(function(a,b){return a+b;},0) + (rows-1)*GY + 26;
  var g = '', yTop = M + 26, ys = [];
  for(var r2=0;r2<rows;r2++){ ys.push(yTop); yTop += rowH[r2] + GY; }

  g += '<text x="'+M+'" y="'+(M+13)+'" fill="'+P.tx3+'" font-size="11.5" font-family="'+SVGFF+'" '+
       'font-weight="700" letter-spacing="1.6">'+xesc(String(titulo||'').toUpperCase())+'</text>';

  function posOf(i){
    var r = Math.floor(i/per), inRow = i % per;
    var col = (r % 2 === 0) ? inRow : (per - 1 - inRow);
    var cnt = Math.min(L.length, (r+1)*per) - r*per;
    if(r % 2 === 1) col = per - 1 - inRow;
    return {r:r, col:col, x:M + col*(BW+GX), y:ys[r], h:rowH[r], last:(inRow === cnt-1)};
  }
  L.forEach(function(s,i){
    var p = posOf(i);
    g += '<rect x="'+p.x+'" y="'+p.y+'" width="'+BW+'" height="'+p.h+'" rx="11" fill="'+color+'22" stroke="'+color+'" stroke-width="1.4"/>';
    g += '<circle cx="'+(p.x+15)+'" cy="'+(p.y+15)+'" r="9.5" fill="'+color+'"/>';
    g += '<text x="'+(p.x+15)+'" y="'+(p.y+19)+'" fill="#06110d" font-size="10.5" font-weight="800" font-family="'+SVGFF+'" text-anchor="middle">'+(i+1)+'</text>';
    var zona = p.h - TOP;
    var ty = p.y + TOP + (zona - (lines[i].length-1)*LH)/2;
    g += tspans(lines[i], p.x + BW/2, ty, LH, P.tx, 11.5, '600');
  });
  L.forEach(function(s,i){
    if(i === L.length-1) return;
    var a = posOf(i), b = posOf(i+1);
    if(a.r === b.r){
      var dir = (a.r % 2 === 0) ? 1 : -1;
      var x1 = dir > 0 ? a.x + BW : a.x;
      var x2 = dir > 0 ? b.x : b.x + BW;
      var y = a.y + a.h/2;
      g += '<line x1="'+x1+'" y1="'+y+'" x2="'+(x2 - dir*8)+'" y2="'+y+'" stroke="'+P.tx3+'" stroke-width="1.6" marker-end="url(#ah)"/>';
    } else {
      var cx = a.x + BW/2;
      g += '<line x1="'+cx+'" y1="'+(a.y+a.h)+'" x2="'+cx+'" y2="'+(b.y-8)+'" stroke="'+P.tx3+'" stroke-width="1.6" marker-end="url(#ah)"/>';
    }
  });
  return {svg: svgWrap(W, H, g, P.bg), w:W, h:H};
}

/* ---------------- RED DE PRECEDENCIAS ---------------- */
function nivelesDe(L){
  var n = L.length, lv = new Array(n).fill(0);
  for(var it=0; it<n+3; it++){
    L.forEach(function(a,i){
      var pre = (a.pre||[]).filter(function(p){ return p>=0 && p<n && p!==i; });
      if(pre.length) lv[i] = Math.min(40, Math.max.apply(null, pre.map(function(p){ return lv[p]+1; })));
    });
  }
  return lv;
}
function redSVG(et, titulo){ return redFrom(accList(et), et === 'inv', titulo); }
function redFrom(L, esInv, titulo){
  var P = PAL();
  var idx = [];
  L.forEach(function(a,i){ if(txt(a.n)) idx.push(i); });
  if(!idx.length) return null;
  var lv = nivelesDe(L);
  var cols = {}, maxL = 0;
  idx.forEach(function(i){ var k = lv[i]; (cols[k] = cols[k] || []).push(i); if(k>maxL) maxL = k; });
  var M = 18, BW = 162, GX = 66, BH = 58, GY = 20;
  var maxRows = 1;
  Object.keys(cols).forEach(function(k){ maxRows = Math.max(maxRows, cols[k].length); });
  var W = M*2 + (maxL+1)*BW + maxL*GX;
  var H = M*2 + 30 + maxRows*BH + (maxRows-1)*GY;
  var pos = {};
  var g = '<text x="'+M+'" y="'+(M+13)+'" fill="'+P.tx3+'" font-size="11.5" font-family="'+SVGFF+'" '+
          'font-weight="700" letter-spacing="1.6">'+xesc(String(titulo||'').toUpperCase())+'</text>';
  for(var k=0;k<=maxL;k++){
    var list = cols[k] || [];
    var x = M + k*(BW+GX);
    var totH = list.length*BH + (list.length-1)*GY;
    var y0 = M + 30 + (H - M*2 - 30 - totH)/2;
    g += '<text x="'+(x+BW/2)+'" y="'+(M+26)+'" fill="'+P.tx3+'" font-size="9.5" font-family="'+SVGFF+'" text-anchor="middle" letter-spacing="1.2">NIVEL '+(k+1)+'</text>';
    list.forEach(function(i, r){
      var y = y0 + r*(BH+GY);
      pos[i] = {x:x, y:y};
      var col = esInv ? P.oro : P.cel;
      g += '<rect x="'+x+'" y="'+y+'" width="'+BW+'" height="'+BH+'" rx="10" fill="'+col+'1f" stroke="'+col+'" stroke-width="1.4"/>';
      g += '<circle cx="'+(x+15)+'" cy="'+(y+15)+'" r="9.5" fill="'+col+'"/>';
      g += '<text x="'+(x+15)+'" y="'+(y+19)+'" fill="#06110d" font-size="10.5" font-weight="800" font-family="'+SVGFF+'" text-anchor="middle">'+codeOf(i)+'</text>';
      var ln = wrapTxt(txt(L[i].n), 22).slice(0,2);
      g += tspans(ln, x + BW/2, y + 28 + (26 - (ln.length-1)*12)/2, 12, P.tx, 10.5, '600');
    });
  }
  idx.forEach(function(i){
    (L[i].pre||[]).forEach(function(p){
      if(!pos[p] || !pos[i]) return;
      var a = pos[p], b = pos[i];
      var x1 = a.x + BW, y1 = a.y + BH/2, x2 = b.x - 8, y2 = b.y + BH/2;
      var salto = Math.abs((lv[i]||0) - (lv[p]||0)) > 1;
      var mx = salto ? Math.max(x1 + 24, x2 - 44) : (x1 + x2)/2;
      g += '<path d="M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2+'" fill="none" stroke="'+P.tx3+'" stroke-width="1.5" marker-end="url(#ah)"/>';
    });
  });
  return {svg: svgWrap(W, H, g, P.bg), w:W, h:H};
}

/* ---------------- DIAGRAMA DE GANTT ---------------- */
function ganttSVG(et, titulo){
  return ganttFrom(accList(et), unidad(et), et==='inv' ? (+D.esc.invN||0) : (+D.esc.opeN||0), et==='inv', titulo);
}
function ganttFrom(L, u, hor, esInv, titulo){
  var P = PAL();
  var idx = [];
  L.forEach(function(a,i){ if(txt(a.n)) idx.push(i); });
  if(!idx.length) return null;
  var sc = scheduleOf(L);
  var T = Math.max(1, Math.ceil(sc.T), Math.ceil(hor||0));
  T = Math.min(T, 60);
  var M = 18, LW = 262, RH = 30, GYh = 34, CW = Math.max(26, Math.min(58, Math.round(680 / T)));
  var W = M*2 + LW + T*CW + 96;
  var H = M*2 + 30 + GYh + idx.length*RH + 30;
  var g = '<text x="'+M+'" y="'+(M+13)+'" fill="'+P.tx3+'" font-size="11.5" font-family="'+SVGFF+'" '+
          'font-weight="700" letter-spacing="1.6">'+xesc(String(titulo||'').toUpperCase())+'</text>';
  var x0 = M + LW, y0 = M + 30 + GYh;

  g += '<text x="'+x0+'" y="'+(M+30+13)+'" fill="'+P.tx3+'" font-size="10" font-family="'+SVGFF+'" letter-spacing="1.1">'+
       xesc(u.toUpperCase())+'</text>';
  for(var t=0;t<T;t++){
    var xc = x0 + t*CW;
    g += '<rect x="'+xc+'" y="'+y0+'" width="'+CW+'" height="'+(idx.length*RH)+'" fill="'+(t%2?P.soft:'none')+'"/>';
    g += '<text x="'+(xc+CW/2)+'" y="'+(y0-8)+'" fill="'+P.tx3+'" font-size="10" font-family="'+SVGFF+'" text-anchor="middle">'+(t+1)+'</text>';
    g += '<line x1="'+xc+'" y1="'+y0+'" x2="'+xc+'" y2="'+(y0+idx.length*RH)+'" stroke="'+P.line+'" stroke-width=".8"/>';
  }
  g += '<line x1="'+(x0+T*CW)+'" y1="'+y0+'" x2="'+(x0+T*CW)+'" y2="'+(y0+idx.length*RH)+'" stroke="'+P.line+'" stroke-width=".8"/>';

  idx.forEach(function(i, r){
    var y = y0 + r*RH;
    g += '<line x1="'+M+'" y1="'+(y+RH)+'" x2="'+(x0+T*CW)+'" y2="'+(y+RH)+'" stroke="'+P.line+'" stroke-width=".8"/>';
    var nm = corta(codeOf(i)+' · '+txt(L[i].n), 40);
    g += '<text x="'+M+'" y="'+(y+RH/2+4)+'" fill="'+P.tx2+'" font-size="11" font-family="'+SVGFF+'">'+xesc(nm)+
         '<title>'+xesc(txt(L[i].n))+'</title></text>';
    var es = sc.ES[i], ef = sc.EF[i], dur = sc.dur[i];
    var crit = (sc.hol[i] <= 0.001) && dur > 0;
    var col = crit ? P.coral : (esInv ? P.oro : P.cel);
    if(dur > 0){
      var bx = x0 + es*CW, bw = Math.max(6, (ef-es)*CW);
      g += '<rect x="'+bx+'" y="'+(y+7)+'" width="'+bw+'" height="'+(RH-14)+'" rx="5" fill="'+col+'" opacity=".92"/>';
      var lab = dur + ' ' + plu(dur, u) + (crit ? ' · crítica' : '') + (txt(L[i].per) ? ' · ' + txt(L[i].per) : '');
      g += '<text x="'+(bx+bw+7)+'" y="'+(y+RH/2+4)+'" fill="'+P.tx3+'" font-size="9.5" font-family="'+SVGFF+'">'+xesc(lab)+'</text>';
    } else {
      var dx = x0 + es*CW;
      g += '<path d="M'+dx+','+(y+RH/2-7)+' L'+(dx+8)+','+(y+RH/2)+' L'+dx+','+(y+RH/2+7)+' L'+(dx-8)+','+(y+RH/2)+' z" fill="'+P.tx3+'"/>';
      g += '<text x="'+(dx+14)+'" y="'+(y+RH/2+4)+'" fill="'+P.tx3+'" font-size="9.5" font-family="'+SVGFF+'">sin duración cargada</text>';
    }
  });
  g += '<line x1="'+M+'" y1="'+y0+'" x2="'+(x0+T*CW)+'" y2="'+y0+'" stroke="'+P.line+'" stroke-width="1.1"/>';
  g += '<text x="'+M+'" y="'+(H-M+2)+'" fill="'+P.tx3+'" font-size="9.5" font-family="'+SVGFF+'">Duración total estimada: '+
       (Math.round(sc.T*100)/100)+' '+xesc(plu(sc.T, u))+' · las barras en color cálido son las de la ruta crítica (holgura cero).</text>';
  return {svg: svgWrap(W, H, g, P.bg), w:W, h:H};
}

/* =============================================================== CONTENEDOR DE DIAGRAMA */
var DIAG = {};
function dgmBox(key, titulo, obj, nombreArch, vacio){
  var w = E('div','dgm');
  var h = E('div','dgm-h');
  h.appendChild(E('span','t', titulo));
  if(!obj){
    w.appendChild(h);
    w.appendChild(E('p','tiny', vacio || 'Todavía no hay información suficiente para dibujar este diagrama.'));
    delete DIAG[key];
    return w;
  }
  DIAG[key] = {svg:obj.svg, name:nombreArch, t:titulo};
  h.appendChild(btn('⬇ PNG','ghost xs', function(){ svgPNG(obj.svg, nombreArch+'.png'); }));
  h.appendChild(btn('⬇ SVG','ghost xs', function(){ dl(nombreArch+'.svg','image/svg+xml', obj.svg); }));
  w.appendChild(h);
  var hold = E('div');
  hold.innerHTML = obj.svg;
  var s = hold.querySelector('svg');
  if(s){ s.setAttribute('class','dg'); s.removeAttribute('width'); s.removeAttribute('height');
         s.style.width = '100%'; s.style.minWidth = Math.min(obj.w, 860)+'px'; s.style.height='auto'; }
  w.appendChild(hold);
  return w;
}
function svgPNG(svgStr, name, scale){
  scale = scale || 2;
  try{
    var blob = new Blob([svgStr], {type:'image/svg+xml;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var img = new Image();
    img.onload = function(){
      var c = document.createElement('canvas');
      c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
      var ctx = c.getContext('2d');
      ctx.fillStyle = PAL().bg; ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      if(c.toBlob){ c.toBlob(function(b){ dlBlob(name, b); toast('Imagen descargada.'); }, 'image/png'); }
      else { var a=document.createElement('a'); a.href=c.toDataURL('image/png'); a.download=name; a.click(); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); toast('No se pudo generar el PNG; probá con SVG.'); };
    img.src = url;
  }catch(e){ toast('No se pudo generar el PNG; probá con SVG.'); }
}

², dimensionada para las 30.000 unidades del ciclo productivo. Finalizada la acción se contará con el galpón terminado, condición previa para incorporar el equipamiento de proceso. Se ejecutarán cuatro tareas: la platea de hormigón, el montaje de la estructura metálica y la cubierta, la instalación eléctrica y sanitaria interna, y la construcción de dos piletas de lavado y de la playa de secado exterior. Se estima que la acción requerirá catorce semanas de trabajo de una cuadrilla de cuatro operarios de una empresa contratista, bajo la supervisión del responsable técnico del proyecto. Se requerirán 18 m³ de hormigón elaborado H-21, 180 m² de chapa galvanizada, una hormigonera y un elevador alquilados por hora de uso. Como mecanismo de seguimiento se llevará un libro de obra con avances quincenales, registro fotográfico y control de los remitos y certificados de obra."},"recI":[{"cod":"A","tarea":"Desmalezado y limpieza superficial del lote","recurso":"Desmalezadora autopropulsada alquilada","unidad":"horas de uso","cant":"16"},{"cod":"A","tarea":"Nivelación y subsolado del terreno","recurso":"Tractor con subsolador, alquilado con operario","unidad":"horas de uso","cant":"12"},{"cod":"A","tarea":"Cercado perimetral con alambrado de siete hilos","recurso":"Poste de madera dura tratada de 2,20 m","unidad":"cantidad","cant":"45"},{"cod":"B","tarea":"Perforación y equipamiento del pozo de captación","recurso":"Servicio de perforación y entubado","unidad":"metros perforados","cant":"40"},{"cod":"B","tarea":"Tendido de cintas de goteo en una hectárea","recurso":"Cinta de goteo con emisores cada 0,30 m","unidad":"metros","cant":"5.500"},{"cod":"C","tarea":"Adquisición de postes, alambre y tutores","recurso":"Poste de eucalipto tratado de 2,50 m","unidad":"cantidad","cant":"600"},{"cod":"C","tarea":"Colocación de postes y tensado del alambre","recurso":"Jornal de peón rural","unidad":"jornal","cant":"24"},{"cod":"D","tarea":"Ejecución de la platea de hormigón de 150 m²","recurso":"Hormigón elaborado H-21","unidad":"m³","cant":"18"},{"cod":"D","tarea":"Montaje de la estructura metálica y la cubierta","recurso":"Chapa acanalada galvanizada","unidad":"m²","cant":"180"},{"cod":"E","tarea":"Adquisición de dos deshidratadores solares","recurso":"Deshidratador solar de 20 m² de bandejas","unidad":"cantidad","cant":"2"},{"cod":"F","tarea":"Dictado del módulo de manejo agronómico de Luffa cylindrica","recurso":"Honorarios de ingeniero agrónomo capacitador","unidad":"horas","cant":"16"},{"cod":"F","tarea":"Corrida de prueba del proceso con frutos adquiridos a terceros","recurso":"Fruto seco de Luffa cylindrica comprado a productores","unidad":"cantidad","cant":"300"}],"recO":[{"cod":"A","tarea":"Preparación del suelo y fertilización de base","recurso":"Compost de origen local","unidad":"kg","cant":"6.000","origen":"gasto"},{"cod":"A","tarea":"Trasplante a campo de 2.500 plantas","recurso":"Plantín de Luffa cylindrica, con 10 % de reposición","unidad":"cantidad","cant":"2.750","origen":"gasto"},{"cod":"B","tarea":"Riego y fertirriego según el estado fenológico","recurso":"Agua de riego","unidad":"m³","cant":"4.500","origen":"gasto"},{"cod":"B","tarea":"Riego y fertirriego según el estado fenológico","recurso":"Energía eléctrica para el equipo de bombeo","unidad":"kWh","cant":"3.200","origen":"gasto"},{"cod":"B","tarea":"Control de malezas y monitoreo sanitario","recurso":"Jornal de peón rural","unidad":"jornal","cant":"60","origen":"gasto"},{"cod":"B","tarea":"Tutorado y conducción de guías sobre la espaldera","recurso":"Conservación de la espaldera: reposición de alambre y tutores","unidad":"juego completo","cant":"1","origen":"capital"},{"cod":"C","tarea":"Cosecha manual de frutos secos en planta","recurso":"Jornal de cosechero","unidad":"jornal","cant":"90","origen":"gasto"},{"cod":"C","tarea":"Pelado, desemillado y lavado de los frutos","recurso":"Limpieza y conservación de las piletas de lavado del galpón","unidad":"horas","cant":"40","origen":"capital"},{"cod":"C","tarea":"Secado y blanqueado al sol de las fibras","recurso":"Limpieza y conservación de los dos deshidratadores solares","unidad":"horas","cant":"24","origen":"capital"},{"cod":"D","tarea":"Envasado y etiquetado de las esponjas","recurso":"Envase de papel kraft con etiqueta impresa","unidad":"cantidad","cant":"30.000","origen":"gasto"}],"claves":["Las escalas temporales son distintas por etapa y la elección está justificada: la inversión se mide en semanas porque son obras cortas y encadenadas, y la operación en meses porque el ciclo de la Luffa es anual. Todas las acciones de la operación llevan periodicidad anual y se repiten dentro del horizonte de cinco años del proyecto.","Todo bien de capital que usa la operación entró por una acción de la inversión: el riego por goteo (B), la espaldera (C), el galpón con sus piletas (D) y los deshidratadores solares (E). En la operación esos bienes no se vuelven a comprar; sólo aparecen sus gastos de limpieza y conservación, marcados con origen capital.","La incorporación de bienes de capital se formula como acción del proyecto, no como compra administrativa: «Dotar al proyecto del equipamiento de procesamiento y envasado», con componente «Proyecto dotado con equipamiento de procesamiento y envasado» y tareas de adquisición. No dice «Comprar una selladora».","No figuran acciones de la formulación: no aparecen «analizar la demanda de esponjas biodegradables», «seleccionar el predio» ni «dimensionar la planta», porque son estudios técnicos ya resueltos en el F01. Tampoco se desagrega lo administrativo (constitución de la unidad productiva, habilitaciones, registro de marca), que a nivel de idea o perfil se estima en alrededor del 10 % del costo como costo indirecto.","La Luffa cylindrica es una de varias alternativas que admite el árbol de objetivos del escenario. El dimensionamiento en una hectárea no es arbitrario: queda acotado por el agua de riego disponible y por la capacidad de absorción de los 45 puntos de venta relevados, dos datos que el equipo debe declarar como supuestos y defender."],"trampa":{"mal":"En la operación, para la tarea «Secado y blanqueado al sol de las fibras», se consigna como recurso la adquisición de dos deshidratadores solares.","bien":"En la operación, para la tarea «Secado y blanqueado al sol de las fibras», se consigna la limpieza y conservación de los dos deshidratadores solares incorporados en la inversión.","porque":"Los deshidratadores ya ingresaron al proyecto por la acción E de la etapa de inversión, de modo que volver a consignarlos como recurso operativo los contabiliza dos veces e infla el costo de operación. Del capital ya incorporado sólo corresponde imputar a la operación los gastos de limpieza y conservación."},"notaO":"El Gantt de la operación muestra <strong>un ciclo productivo anual completo, en meses</strong>: la Luffa es un cultivo anual y las cuatro acciones se suceden dentro de la temporada. Ese mismo ciclo se repite cada año del horizonte.","notaI":"La inversión se mide en semanas porque es corta y estacional: tiene que quedar terminada antes de la ventana de siembra, y esa fecha es la que manda sobre toda la secuencia."},{"n":2,"titulo":"Cierre y restauración de piletas · Puesto Guardián","proyecto":"Restauración del sector de piletas de contingencia de la Batería Puesto Guardián mediante tratamiento biológico de suelos hidrocarburados, para su reincorporación al uso agropecuario, departamento Orán, Salta","actividad":"Restaurar el sector de piletas de contingencia mediante el tratamiento biológico de los suelos y barros hidrocarburados","componente":"Sector de piletas de contingencia restaurado y apto para el uso agropecuario","dim":{"tipo":"Saneamiento","ind":"Volumen de suelos y barros hidrocarburados tratados","unid":"m³ de suelo tratado","per":"por año","cap":"3.000","benef":"1 establecimiento agropecuario, 12 puestos de trabajo directos y 2 ha reincorporadas al uso agropecuario","txt":"El proyecto trata 3.000 m³ de suelos y barros hidrocarburados por año, en dos ciclos semestrales de 1.500 m³ sobre una celda impermeabilizada de 3.000 m². La materia prima es el pasivo de las dos piletas de contingencia: la habilitada sin impermeabilizar, de 50 × 30 m y 1,5 a 2,5 m de profundidad, y la impermeabilizada de 50 × 50 × 3,5 m. Se adopta como supuesto un volumen total de 6.000 m³, que incluye 0,5 m de suelo afectado bajo la pileta no impermeabilizada; el pasivo se agota en dos años de operación. La dimensión la determinan ese volumen finito, la ventana de estación seca y el plazo de cierre exigido por la autoridad. Sobredimensionar dejaría celda y equipamiento ociosos apenas agotado el pasivo; una capacidad menor postergaría la ampliación agrícola que pretende el propietario.","capNota":"en dos ciclos semestrales de 1.500 m³ cada uno"},"uniI":"meses","uniO":"años","horI":12,"horO":3,"fluI":["Acondicionar acceso y playa de maniobras","Construir la celda de tratamiento","Instalar la red de freatímetros","Incorporar equipamiento y obrador","Capacitar al personal del proyecto","Poner en marcha el sector de tratamiento"],"fluO":["Extraer el material de las piletas","Clasificar y armar lotes de tratamiento","Armar las biopilas sobre la celda","Airear, regar y nutrir las biopilas","Analizar hidrocarburos por lote","Rellenar y reconformar con suelo tratado","Revegetar y entregar el sector"],"accI":[{"n":"Acondicionar el camino de acceso y la playa de maniobras del sector de piletas","comp":"Camino de acceso y playa de maniobras acondicionados","tar":["Desmalezado y retiro de la cubierta vegetal en 0,6 ha","Perfilado y compactación de 900 m de camino interno","Ejecución de cunetas y de dos alcantarillas de desagüe"],"dur":"1","per":"","pre":[],"tp":"FI"},{"n":"Construir la celda de tratamiento biológico de suelos hidrocarburados","comp":"Celda de tratamiento biológico construida","tar":["Nivelación y compactación de la base de 3.000 m²","Colocación de geomembrana de polietileno de ente y control de lixiviados, sobre la cual armar las biopilas durante la operación. La celda ocupa 3.000 m² dentro del sector de tratamiento de residuos peligrosos autorizado por la provincia, superficie que permite operar dos biopilas de 1.500 m³ y 2 m de altura con calles de circulación. Finalizada la acción se contará con la celda habilitada para recibir el primer lote extraído de las piletas. Se ejecutan la nivelación y compactación de la base con pendiente del 1 % hacia el sumidero, la colocación de geomembrana de polietileno de alta densidad de 1,5 mm con juntas termofusionadas, bermas perimetrales de 0,8 m y un sumidero de lixiviados de 12 m³. Se estima una duración de tres meses. Los trabajos están a cargo de una empresa contratista, bajo supervisión del responsable ambiental del proyecto, con motoniveladora, rodillo compactador y equipo de termofusión alquilados por hora. Como mecanismo de verificación se realizan el control de chispa sobre las soldaduras de la membrana, el ensayo de estanqueidad del sumidero, el registro fotográfico y el cotejo de los remitos de la contratista."},"recI":[{"cod":"A","tarea":"Desmalezado y retiro de la cubierta vegetal en 0,6 ha","recurso":"Retroexcavadora con hoja topadora y operador","unidad":"horas de uso","cant":"24"},{"cod":"A","tarea":"Perfilado y compactación de 900 m de camino interno","recurso":"Motoniveladora con operador","unidad":"horas de uso","cant":"40"},{"cod":"B","tarea":"Nivelación y compactación de la base de 3.000 m²","recurso":"Rodillo compactador autopropulsado con operador","unidad":"horas de uso","cant":"60"},{"cod":"B","tarea":"Colocación de geomembrana de polietileno de alta densidad de 1,5 mm","recurso":"Geomembrana de polietileno de alta densidad de 1,5 mm","unidad":"m²","cant":"3.450"},{"cod":"B","tarea":"Colocación de geomembrana de polietileno de alta densidad de 1,5 mm","recurso":"Equipo de termofusión con operador habilitado","unidad":"horas de uso","cant":"80"},{"cod":"B","tarea":"Construcción del sumidero de lixiviados de 12 m³","recurso":"Hormigón elaborado H-21","unidad":"m³","cant":"9"},{"cod":"C","tarea":"Adquisición de un tractor de 110 HP con pala frontal","recurso":"Tractor de 110 HP con pala frontal","unidad":"cantidad","cant":"1"},{"cod":"C","tarea":"Adquisición de un tanque australiano de 30 m³","recurso":"Tanque australiano de 30 m³","unidad":"cantidad","cant":"1"},{"cod":"D","tarea":"Perforación de tres freatímetros de 25 m de profundidad","recurso":"Equipo de perforación rotativa con operador","unidad":"horas de uso","cant":"36"},{"cod":"D","tarea":"Instalación de encamisado, filtros y cabezales con cierre","recurso":"Caño de PVC ranurado de 4 pulgadas","unidad":"metros","cant":"75"},{"cod":"F","tarea":"Dictado de tres jornadas teórico-prácticas sobre manejo de residuos peligrosos","recurso":"Instructor habilitado en residuos peligrosos","unidad":"jornal","cant":"3"},{"cod":"F","tarea":"Ejercicio de simulacro de derrame y de respuesta ante emergencias","recurso":"Juego de elementos de protección personal para el plantel","unidad":"juego completo","cant":"12"}],"recO":[{"cod":"A","tarea":"Extracción del material con excavadora y carga en camiones","recurso":"Excavadora sobre orugas con operador, alquilada por hora","unidad":"horas de uso","cant":"320 por año","origen":"gasto"},{"cod":"A","tarea":"Transporte interno al sector de tratamiento (900 m)","recurso":"Camión volcador de 12 m³ con chofer","unidad":"horas de uso","cant":"400 por año","origen":"gasto"},{"cod":"A","tarea":"Clasificación por contenido de hidrocarburos y armado de lotes","recurso":"Análisis de hidrocarburos totales de petróleo en laboratorio","unidad":"cantidad","cant":"24 por año","origen":"gasto"},{"cod":"B","tarea":"Armado de biopilas de 1.500 m³ sobre la celda impermeabilizada","recurso":"Tractor de 110 HP con pala frontal, incorporado en la acción C de la inversión","unidad":"horas de uso","cant":"240 por año","origen":"capital"},{"cod":"B","tarea":"Incorporación de nutrientes y enmienda estructurante","recurso":"Fertilizante nitrogenado y fosforado","unidad":"kg","cant":"3.600 por año","origen":"gasto"},{"cod":"B","tarea":"Incorporación de nutrientes y enmienda estructurante","recurso":"Enmienda estructurante de viruta y chip de madera","unidad":"m³","cant":"300 por año","origen":"gasto"},{"cod":"B","tarea":"Volteo y riego periódico para control de humedad y aireación","recurso":"Agua para riego de biopilas","unidad":"m³","cant":"900 por año","origen":"gasto"},{"cod":"B","tarea":"Volteo y riego periódico para control de humedad y aireación","recurso":"Gasoil para el tractor y el acoplado regador","unidad":"litros","cant":"2.400 por año","origen":"gasto"},{"cod":"C","tarea":"Muestreo trimestral de los tres freatímetros","recurso":"Limpieza y conservación de los tres freatímetros incorporados en la acción D de la inversión","unidad":"jornal","cant":"8 por año","origen":"capital"},{"cod":"E","tarea":"Siembra de especies forrajeras y nativas en 0,6 ha","recurso":"Semilla de gramíneas forrajeras y de especies nativas","unidad":"kg","cant":"90 por año","origen":"gasto"}],"claves":["La dimensión no la fija una demanda de mercado sino un pasivo finito: 6.000 m³ de suelos y barros, adoptados como supuesto explícito a partir de las medidas de las dos piletas. Por eso la operación se agota en dos años de tratamiento y el horizonte se cierra con el relleno y la revegetación.","La celda impermeabilizada, los freatímetros y el tractor con acoplado regador entran por la etapa de inversión; en la operación esos bienes aparecen con origen capital y sólo se computan sus horas de uso y sus gastos de conservación, para no contabilizar dos veces el mismo desembolso.","La excavadora, el camión volcador, la motoniveladora y el equipo de termofusión se alquilan por hora y se consignan como recurso de la tarea que los usa, no como bienes de capital del proyecto.","La extracción del material está en la operación y no en la inversión: es el proceso productivo del proyecto de remediación, que se repite en campañas semestrales, mientras la inversión sólo construye la capacidad de tratarlo.","El destino final del sector responde a la pretensión del propietario de ampliar la superficie agropecuaria, pero el criterio de cierre lo fija la autoridad: por eso la revegetación es posterior al análisis de hidrocarburos por lote y al informe de monitoreo."],"trampa":{"mal":"Caracterizar el pasivo ambiental de las piletas y determinar el volumen de suelo contaminado a tratar.","bien":"Construir la celda de tratamiento biológico de suelos hidrocarburados.","porque":"Caracterizar el pasivo y determinar el volumen a tratar son estudios técnicos de la formulación, ya resueltos cuando se llega al F02: son los que permitieron dimensionar el proyecto en 3.000 m³ por año. La EDT desagrega la ejecución del proyecto, es decir las obras y las incorporaciones de bienes que hacen posible el tratamiento."},"notaO":"El Gantt de la operación <strong>encadena y no superpone</strong>, porque acá la operación no es un proceso productivo que se repite: es una remediación con fases sucesivas. No se puede rellenar un sector cuyo suelo todavía está en tratamiento, ni revegetar antes de reconformar.","notaI":"La inversión es breve —cuatro meses— y prepara el sitio de tratamiento: sin celda impermeabilizada y sin red de monitoreo no se puede empezar a mover suelo hidrocarburado."},{"n":3,"titulo":"Vivero de nativas para restauración y arbolado","proyecto":"Producción de plantines forestales nativos de procedencia local para la restauración del predio fiscal del borde este y las campañas de forestación urbana de la ciudad de Salta","actividad":"Producir plantines de especies forestales nativas de procedencia local","componente":"Plantines de especies forestales nativas de procedencia local producidos","dim":{"tipo":"Forestal","ind":"Plantines nativos aptos para plantación entregados en la ventana de lluvias","unid":"plantines","per":"por año","cap":"60.000","benef":"El programa de restauración de las 800 ha del predio fiscal del borde este (50.000 plantines por año) y unas 20 instituciones educativas, organizaciones sociales y municipios de las campañas de forestación urbana (10.000 plantines por año)","txt":"El vivero se dimensiona para entregar 60.000 plantines por año de 18 especies leñosas nativas de procedencia local, de las 32 inventariadas en el predio fiscal, dos de ellas con categoría de conservación desfavorable. El insumo principal es semilla cosechada en rodales semilleros de la región, con registro de procedencia. La dimensión responde a la demanda del programa de restauración de las 800 hectáreas del borde este —enriquecimiento, estabilización de laderas de más del 30 % de pendiente y forestación de los sectores de uso público, estimada en 50.000 plantines anuales— y a las campañas urbanas de municipios e instituciones, estimadas en 10.000. Como un plantín nativo requiere entre doce y dieciocho meses de vivero, se trabaja con dos cohortes superpuestas y un stock permanente de 90.000 envases. Se evita sobredimensionar porque la demanda institucional se decide año a año, y subdimensionar porque la ventana de plantación no admite reprogramación.","capNota":"en régimen, alcanzado en el tercer año"},"uniI":"meses","uniO":"años","horI":12,"horO":5,"fluI":["Acondicionamiento del predio del vivero","Construcción de invernáculo y umbráculo","Instalación del sistema de agua y riego","Incorporación de equipamiento y vehículos","Capacitación del equipo y manual de trabajo","Puesta en marcha del vivero"],"fluO":["Marcado de árboles madre y cosecha","Beneficio y conservación de semilla","Siembra, repique y llenado de envases","Riego, sanidad y crecimiento en vivero","Rustificación y selección de plantines","Entrega en la ventana de lluvias","Monitoreo de supervivencia y ajuste"],"accI":[{"n":"Nivelar y acondicionar el predio del vivero","comp":"Predio del vivero nivelado y acondicionado","tar":["Desmalezado y limpieza del terreno","Nivelación y compactación de la superficie de canteros","Ejecución de canales de desagüe perimetrales","Cierre perimetral con alambrado olímpico"],"dur":"2","per":"","pre":[],"tp":"FI"},{"n":"Dotar al vivero de la infraestructura de propagación","comp":"Vivero dotado de infraestructura de propagación","tar":["Construcción de un invernáculo de 300 m²","Montaje de umbráculo de media sombra de 1.200 m²","Construcción del galpón de sustratos y herramientas","Armado de canteros y platabandas de rustificación"],"dur":"4","per":"","pre":["A"],"tp":"FI"},{"n":"Dotar al proyecto del sistema de captación y riego","comp":"Proyecto dotado del sistema de captación y riego","tar":["Perforación y equipamiento del pozo de agua","Instalación de tanque de reserva de 20.000 litros","Tendido de la red de riego por microaspersión y goteo","Instalación del grupo electrógeno de respaldo"],"dur":"3","per":"","pre":["A"],"tp":"II"},{"n":"Dotar al vivero del equipamiento de manejo de semilla","comp":"Vivero dotado de equipamiento de manejo de semilla","tar":["Adquisición de la cámara de conservación de semillas","Adquisición del equipamiento del laboratorio de germinación","Adquisición de zarandas, secadora y balanzas de precisión"],"dur":"2","per":"","pre":["B"],"tp":"FI"},{"n":"Dotar al proyecto de los vehículos de recolección y despacho","comp":"Proyecto dotado de una camioneta y un acoplado playo","tar":["Adquisición de una camioneta utilitaria 4x4","Adquisición de un acoplado playo para transporte de plantines","Acondicionamiento del acoplado con bandejas portaplantines"],"dur":"1","per":"","pre":[],"tp":"FI"},{"n":"Capacitar al equipo técnico y operativo del vivero","comp":"Equipo técnico y operativo del vivero capacitado","tar":["Capacitación en identificación y cosecha de semilla nativa","Capacitación en propagación y sanidad de plantines","Elaboración del manual de procedimientos y registros de trazabilidad"],"dur":"2","per":"","pre":["B","D"],"tp":"FI"}],"accO":[{"n":"Recolectar y acondicionar semilla de procedencia local","comp":"Semilla de procedencia local recolectada y acondicionada","tar":["Recorrido de rodales semilleros y marcado de árboles madre","Cosecha de frutos y semillas por especie","Beneficio, secado y control de calidad de la semilla","Registro de procedencia y almacenamiento en cámara"],"dur":"0,4","per":"anual, según el calendario de fructificación de cada especie","pre":[],"tp":"FI","capDe":"D"},{"n":"Producir plantines en vivero","comp":"Plantines producidos en vivero","tar":["Preparación y llenado de envases con sustrato","Siembra y repique de plantines","Riego, fertilización y control sanitario","Rustificación y selección de plantines aptos"],"dur":"1,5","per":"continua, con dos cohortes anuales superpuestas","pre":["A"],"tp":"FI","capDe":"B"},{"n":"Entregar los plantines en los sitios de plantación","comp":"Plantines entregados en los sitios de plantación","tar":["Programación de entregas con los destinatarios","Carga y transporte de plantines","Entrega con remito y registro de trazabilidad"],"dur":"0,3","per":"anual, dentro de la ventana de lluvias de diciembre a marzo","pre":["B"],"tp":"FI","capDe":"E"},{"n":"Monitorear la supervivencia de los plantines entregados","comp":"Supervivencia de los plantines entregados monitoreada","tar":["Instalación de parcelas de control en los sitios plantados","Medición de supervivencia y crecimiento a los 6 y 12 meses","Informe anual de resultados y ajuste del plan de producción"],"dur":"0,5","per":"anual","pre":["C"],"tp":"FI","capDe":"no"}],"descripcion":{"cod":"C","texto":"Dotar al proyecto del sistema de captación y riego. La acción tiene por objetivo asegurar el abastecimiento de agua del vivero durante los doce meses del año, dado que en el predio la disponibilidad de agua es variable y el riego determina la supervivencia de las dos cohortes en producción. Una vez finalizada, el vivero contará con fuente propia, reserva y red de distribución en condiciones de sostener un stock permanente de 90.000 envases, con un consumo estimado de 3.600 m³ por año. Para su ejecución se realizarán la perforación y el equipamiento de un pozo, la instalación de un tanque de reserva de 20.000 litros sobre plataforma elevada, el tendido de la red de microaspersión para los canteros de siembra y de goteo para las platabandas de rustificación, y la instalación de un grupo electrógeno de respaldo. Se estima una duración de tres meses. Los trabajos estarán a cargo de una empresa perforista y de un instalador matriculado, bajo la supervisión del responsable técnico del proyecto. Como mecanismo de seguimiento y verificación se realizarán el ensayo de bombeo con registro de caudal, la prueba de presión de la red y el control de remitos y certificados de obra."},"recI":[{"cod":"A","tarea":"Nivelación y compactación de la superficie de canteros","recurso":"Motoniveladora con operador","unidad":"horas de uso","cant":"24"},{"cod":"A","tarea":"Nivelación y compactación de la superficie de canteros","recurso":"Gasoil","unidad":"litros","cant":"180"},{"cod":"A","tarea":"Cierre perimetral con alambrado olímpico","recurso":"Alambrado olímpico de 2 m de altura con postes","unidad":"metros lineales","cant":"420"},{"cod":"B","tarea":"Construcción de un invernáculo de 300 m²","recurso":"Cuadrilla de montaje de dos oficiales y dos ayudantes","unidad":"jornales","cant":"160"},{"cod":"B","tarea":"Montaje de umbráculo de media sombra de 1.200 m²","recurso":"Media sombra al 50 % con estructura y tensores","unidad":"m²","cant":"1.300"},{"cod":"B","tarea":"Armado de canteros y platabandas de rustificación","recurso":"Ladrillo y arena para bordes de cantero","unidad":"m³","cant":"18"},{"cod":"C","tarea":"Perforación y equipamiento del pozo de agua","recurso":"Equipo de perforación con operador","unidad":"horas de uso","cant":"40"},{"cod":"C","tarea":"Instalación de tanque de reserva de 20.000 litros","recurso":"Tanque de polietileno de 20.000 litros con plataforma","unidad":"cantidad","cant":"1"},{"cod":"C","tarea":"Tendido de la red de riego por microaspersión y goteo","recurso":"Cañerías, microaspersores, goteros y accesorios","unidad":"juego completo","cant":"1"},{"cod":"E","tarea":"Adquisición de una camioneta utilitaria 4x4","recurso":"Camioneta utilitaria 4x4 cero kilómetro","unidad":"cantidad","cant":"1"},{"cod":"F","tarea":"Capacitación en propagación y sanidad de plantines","recurso":"Instructor especialista en viverismo forestal","unidad":"horas","cant":"40"}],"recO":[{"cod":"A","tarea":"Cosecha de frutos y semillas por especie","recurso":"Recolectores con experiencia de monte","unidad":"jornales","cant":"120","origen":"gasto"},{"cod":"A","tarea":"Registro de procedencia y almacenamiento en cámara","recurso":"Limpieza y mantenimiento de la cámara de conservación","unidad":"servicio anual","cant":"1","origen":"capital"},{"cod":"B","tarea":"Preparación y llenado de envases con sustrato","recurso":"Sustrato de tierra, compost y perlita","unidad":"m³","cant":"95","origen":"gasto"},{"cod":"B","tarea":"Preparación y llenado de envases con sustrato","recurso":"Envases de polietileno de 1,5 litros","unidad":"cantidad","cant":"66.000","origen":"gasto"},{"cod":"B","tarea":"Riego, fertilización y control sanitario","recurso":"Agua de riego","unidad":"m³ por año","cant":"3.600","origen":"gasto"},{"cod":"B","tarea":"Riego, fertilización y control sanitario","recurso":"Operarios de vivero","unidad":"jornales","cant":"480","origen":"gasto"},{"cod":"B","tarea":"Rustificación y selección de plantines aptos","recurso":"Reposición parcial de la media sombra del umbráculo","unidad":"m²","cant":"150","origen":"capital"},{"cod":"C","tarea":"Carga y transporte de plantines","recurso":"Gasoil de la camioneta y el acoplado","unidad":"litros","cant":"1.400","origen":"gasto"},{"cod":"C","tarea":"Carga y transporte de plantines","recurso":"Servicio de mantenimiento de la camioneta y el acoplado","unidad":"servicio anual","cant":"2","origen":"capital"},{"cod":"D","tarea":"Medición de supervivencia y crecimiento a los 6 y 12 meses","recurso":"Técnico forestal","unidad":"jornales","cant":"36","origen":"gasto"}],"claves":["El proyecto no es la restauración del predio fiscal: es el vivero que la abastece. El dimensionamiento se apoya en la demanda de ese destinatario, pero la actividad, las acciones, los tiempos y los recursos son los del vivero.","Relevar la demanda por especie y por año y estimar la capacidad instalada de vivero en la región son estudios de la formulación, no acciones del F02. El ejemplo los da por resueltos y los convierte en un supuesto declarado: 60.000 plantines por año, de los cuales 50.000 van a la restauración.","Todo el capital que usa la operación entró por la inversión: la cámara de conservación de semillas por la acción D, el invernáculo y el umbráculo por la acción B, la camioneta y el acoplado por la acción E. En recO ese capital sólo reaparece como limpieza, mantenimiento y reposición, nunca como compra.","El desfasaje temporal es la decisión de formulación central. Un plantín nativo necesita de doce a dieciocho meses de vivero, de modo que la operación arranca con la cosecha de semilla y recién entrega en la temporada siguiente. Por eso la inversión se planifica en meses y la operación en años, con dos cohortes superpuestas.","La periodicidad de la entrega está atada a la ventana de lluvias: la acción C de la operación dura tres décimas de año, se repite una vez por año y no admite reprogramación fuera de esa temporada."],"trampa":{"mal":"Comprar la cámara de conservación de semillas y determinar cuántos plantines por especie va a demandar la restauración.","bien":"Dotar al vivero del equipamiento de manejo de semilla (componente: «Vivero dotado de equipamiento de manejo de semilla»; tareas: «Adquisición de la cámara de conservación de semillas», «Adquisición del equipamiento del laboratorio de germinación»).","porque":"La incorporación de un bien de capital se enuncia como dotación al proyecto, no como el acto administrativo de comprarlo, que aparece recién a nivel de tarea. Y determinar la demanda por especie es un estudio de la formulación, ya resuelto antes del F02: no puede ser una acción de la EDT."},"notaO":"El Gantt de la operación muestra <strong>el ciclo de una cohorte de plantines</strong>, que tarda alrededor de 2,7 años desde la recolección de semilla hasta el monitoreo de supervivencia. Las cohortes se superponen: en cualquier momento hay plantines en distinto estado, y por eso las periodicidades dicen «anual» o «continua».","notaI":"La inversión concentra todo lo que el vivero necesita antes de recibir la primera semilla. La capacitación va en paralelo a la obra: no depende de ella y no conviene dejarla para el final."},{"n":6,"titulo":"Agua de lluvia para usos no potables en un hotel","proyecto":"Sistema de captación y aprovechamiento de agua de lluvia para usos no potables en un establecimiento hotelero de 109 habitaciones, piedemonte del Departamento Capital","actividad":"Dotar al establecimiento hotelero de un sistema de captación y aprovechamiento de agua de lluvia para usos no potables","componente":"Establecimiento hotelero dotado de un sistema de captación y aprovechamiento de agua de lluvia para usos no potables","dim":{"tipo":"Turístico hotelero","ind":"Volumen de agua de lluvia entregado a la red no potable","unid":"m³ de agua no potable","per":"por año","cap":"2.300","benef":"109 habitaciones y unas 41.000 pernoctaciones anuales; 38 puestos de trabajo del establecimiento","txt":"El sistema entrega 2.300 m³ de agua no potable por año, el 46 % de la demanda no potable del hotel, estimada en 4.950 m³ anuales entre descarga de inodoros, riego, limpieza y lavado. La materia prima es la lluvia sobre 9.650 m² de cubierta: con 775 mm anuales, valor medio de la franja de isohietas de 750 a 800 mm, y un coeficiente de aprovechamiento de 0,80, la oferta bruta asciende a 5.980 m³. La dimensión no la fija esa oferta sino el desfase estacional, porque 197 mm caen en enero y el riego se necesita entre abril y octubre. Con dos cisternas de 150 m³ se alcanza el 46 % citado; duplicar el almacenamiento agregaría alrededor de 13 puntos, por lo que se descarta el sobredimensionamiento. Se riegan 2.600 m² de espacio verde, valor adoptado de las fichas de riego.","capNota":"el 46 % de la demanda no potable del establecimiento"},"uniI":"meses","uniO":"años","horI":12,"horO":10,"fluI":["Adecuación de cubiertas y canalizaciones","Excavación y montaje de cisternas","Tendido de la segunda red no potable","Montaje de bombeo, filtrado y cloración","Instalación de medidores y pluviómetro","Pruebas de estanqueidad y presión","Capacitación y puesta en marcha"],"fluO":["Lluvia sobre 9.650 m² de cubierta","Desvío del primer lavado y filtrado","Almacenamiento en cisternas de 300 m³","Bombeo, cloración y presurización","Entrega a inodoros, riego y limpieza","Reposición desde el pozo si falta","Medición y registro mensual"],"accI":[{"n":"Adecuar las cubiertas y la canalización para la captación de agua de lluvia","comp":"Cubiertas y canalización adecuadas para la captación","tar":["Provisión y montaje de canaletas y embudos en 9.650 m² de cubierta","Instalación de rejillas y cestos de retención de hojas","Montaje de bajadas y colectores hasta el recinto de cisternas","Instalación de dispositivos de desvío de primer lavado","Prueba hidráulica de canaletas y colectores"],"dur":"4","per":"","pre":[],"tp":"FI"},{"n":"Construir dos cisternas de almacenamiento de 150 m³ cada una","comp":"Cisternas de almacenamiento de 300 m³ construidas","tar":["Excavación y perfilado del recinto de las cisternas","Ejecución de losa de fundación y tabiques de hormigón armado","Impermeabilización interior y montaje de tapas y accesos","Instalación del vertedero de excedentes hacia el canal perimetral","Prueba de estanqueidad y limpieza previa a la puesta en servicio"],"dur":"5","per":"","pre":[],"tp":"FI"},{"n":"Tender una segunda
