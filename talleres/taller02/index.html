<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FEPAR 2026 · Taller 02 — Formulario 02 paso a paso</title>
<meta name="description" content="Visor del Taller 02 de FEPAR 2026: una consigna por pantalla, preguntas orientadoras por escenario, cronómetro y sorteo de equipos.">
<style>
:root{
  --bg:#06110d; --bg2:#0a1a14; --panel:#0e2019; --panel2:#0b1a15;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.20);
  --tx:#eaf5f0; --tx2:#b9cfc6; --tx3:#7f9a90;
  --verde:#00a05a; --verde-l:#22c97f; --aqua:#12b5a0; --celeste:#39b6d8;
  --oro:#eda100; --violeta:#7b6bd6; --coral:#ef6a4b; --bad:#ef5350;
  --ff:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:16px; --r-s:12px; --head:66px;
}
html[data-theme="light"]{
  --bg:#f2f6f4; --bg2:#e8efec; --panel:#fff; --panel2:#f7faf9;
  --line:rgba(16,36,29,.13); --line2:rgba(16,36,29,.26);
  --tx:#10241d; --tx2:#3c554c; --tx3:#668076;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ff);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(1100px 700px at 10% -8%, rgba(0,160,90,.15), transparent 60%),
             radial-gradient(900px 560px at 95% 4%, rgba(237,161,0,.09), transparent 60%)}
html[data-theme="light"] body::before{background:radial-gradient(1100px 700px at 10% -8%, rgba(0,160,90,.09), transparent 60%)}
*{scrollbar-width:thin;scrollbar-color:rgba(0,192,106,.65) transparent}
*::-webkit-scrollbar{width:11px;height:11px}
*::-webkit-scrollbar-thumb{background:rgba(0,192,106,.65);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-track{background:transparent}

/* ============ ENCABEZADO FIJO ============ */
#head{position:fixed;top:0;left:0;right:0;height:var(--head);z-index:40;display:flex;
  align-items:center;gap:10px;padding:0 clamp(12px,2.2vw,26px);
  background:linear-gradient(180deg,var(--panel),var(--panel2));border-bottom:1px solid var(--line2)}
#head .marca{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--verde-l);
  font-weight:800;flex:none;line-height:1.2}
#head .marca small{display:block;font-size:10px;letter-spacing:.08em;color:var(--tx3);
  text-transform:none;font-weight:600}
#paso-n{flex:none;font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums;
  border:1px solid var(--line2);border-radius:8px;padding:4px 9px;font-weight:700}
#paso-t{flex:1;min-width:60px;font-size:14.5px;font-weight:700;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
#reloj{flex:none;font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--verde-l);
  font-variant-numeric:tabular-nums;min-width:88px;text-align:right;line-height:1}
#reloj.ambar{color:var(--oro)} #reloj.rojo{color:var(--coral)}
#reloj.fin{color:var(--bad);animation:pulso 1s ease-in-out infinite}
@keyframes pulso{0%,100%{opacity:1}50%{opacity:.3}}
#barra{position:absolute;left:0;bottom:0;height:3px;background:var(--verde);width:100%;transition:width .3s linear}
#barra.ambar{background:var(--oro)} #barra.rojo{background:var(--coral)} #barra.fin{background:var(--bad)}

.b{border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--tx2);
  border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:var(--ff);
  font-weight:600;transition:.16s;white-space:nowrap;flex:none}
.b:hover{color:var(--tx);border-color:var(--verde);background:rgba(0,160,90,.14)}
.b.pri{background:var(--verde);border-color:var(--verde);color:#04150e;font-weight:700}
.b.pri:hover{background:var(--verde-l);color:#04150e}
.b.gr{font-size:15px;padding:11px 20px}
.b:disabled{opacity:.35;cursor:not-allowed}
html[data-theme="light"] .b{background:rgba(255,255,255,.9)}

/* ============ CUERPO ============ */
#main{position:fixed;top:var(--head);left:0;right:0;bottom:0;z-index:1;overflow:auto;
  padding:clamp(16px,2.4vw,30px) clamp(14px,3vw,44px) 44px}
.wrap{max-width:1500px;margin:0 auto}
.cols{display:grid;grid-template-columns:1.35fr 1fr;gap:clamp(14px,1.8vw,26px);align-items:start}
.card{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:var(--r);padding:clamp(15px,1.5vw,24px);position:relative;overflow:hidden}
.card>.tag{position:absolute;top:0;left:0;width:100%;height:3px;background:var(--verde)}
.card.oro>.tag{background:var(--oro)} .card.vio>.tag{background:var(--violeta)}
.card.cel>.tag{background:var(--celeste)} .card.coral>.tag{background:var(--coral)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--verde-l);font-weight:800}
.eyebrow.o{color:var(--oro)} .eyebrow.v{color:var(--violeta)} .eyebrow.c{color:var(--celeste)}
h1{font-size:clamp(25px,3.1vw,40px);line-height:1.08;letter-spacing:-.03em;margin:8px 0 0;font-weight:800}
h2{font-size:clamp(19px,2.1vw,27px);line-height:1.15;letter-spacing:-.02em;margin:0;font-weight:800}
h3{font-size:15.5px;margin:0;font-weight:750}
p{margin:0}
.consigna{font-size:clamp(16px,1.35vw,20px);line-height:1.5;color:var(--tx);margin-top:12px}
.sub{font-size:14px;color:var(--tx2);line-height:1.55}
.tiny{font-size:12px;color:var(--tx3);line-height:1.5}
strong{font-weight:750;color:var(--tx)}
.hr{height:1px;background:var(--line);margin:14px 0}

/* preguntas */
ol.preg{list-style:none;padding:0;margin:12px 0 0;counter-reset:p}
ol.preg li{counter-increment:p;position:relative;padding:9px 0 9px 34px;font-size:14.5px;
  line-height:1.5;color:var(--tx);border-bottom:1px solid var(--line)}
ol.preg li:last-child{border-bottom:none}
ol.preg li::before{content:counter(p);position:absolute;left:0;top:9px;width:23px;height:23px;
  border-radius:7px;background:rgba(237,161,0,.16);border:1px solid rgba(237,161,0,.5);
  color:var(--oro);font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center}

.box{border:1px solid var(--line);border-radius:var(--r-s);padding:12px 14px;background:rgba(255,255,255,.04)}
.box.ok{border-color:rgba(0,192,106,.45);background:rgba(0,192,106,.09)}
.box.warn{border-color:rgba(237,161,0,.45);background:rgba(237,161,0,.09)}
.box.info{border-color:rgba(57,182,216,.45);background:rgba(57,182,216,.09)}
.et{display:inline-block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  font-weight:800;color:var(--tx3);margin-bottom:5px}

/* respuesta */
textarea.resp{width:100%;min-height:230px;background:rgba(255,255,255,.05);border:1px solid var(--line2);
  border-radius:12px;color:var(--tx);font-family:var(--ff);font-size:14.5px;padding:13px 15px;
  line-height:1.6;resize:vertical;margin-top:10px}
html[data-theme="light"] textarea.resp{background:#fff}
textarea.resp:focus{outline:none;border-color:var(--verde);background:rgba(0,160,90,.07);
  box-shadow:0 0 0 3px rgba(0,160,90,.14)}
.cuenta{font-size:11.5px;color:var(--tx3);text-align:right;margin-top:5px;font-variant-numeric:tabular-nums}

/* portada */
.escgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.esc{text-align:left;border:1px solid var(--line2);border-radius:14px;padding:14px 16px;
  background:rgba(255,255,255,.035);cursor:pointer;font-family:var(--ff);transition:.16s}
.esc:hover{border-color:var(--verde);background:rgba(0,160,90,.10);transform:translateY(-2px)}
.esc.on{border-color:var(--verde);background:rgba(0,160,90,.17);box-shadow:inset 0 3px 0 var(--verde)}
.esc .n{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--verde-l)}
.esc .t{display:block;font-size:15px;font-weight:700;margin-top:5px;line-height:1.3;color:var(--tx)}
.esc .l{display:block;font-size:11.5px;color:var(--tx3);margin-top:5px;line-height:1.35}
label.fl{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);
  font-weight:800;margin-bottom:6px}
input.fi{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:10px;
  color:var(--tx);font-family:var(--ff);font-size:14.5px;padding:10px 13px}
html[data-theme="light"] input.fi{background:#fff}
input.fi:focus{outline:none;border-color:var(--verde)}

/* progreso de pasos */
.pasos{display:flex;gap:5px;flex-wrap:wrap;margin-top:14px}
.pb{width:30px;height:30px;border-radius:9px;border:1px solid var(--line2);background:transparent;
  color:var(--tx3);font-size:12px;font-weight:700;cursor:pointer;font-family:var(--ff);
  transition:.14s;position:relative;padding:0}
.pb:hover{border-color:var(--verde);color:var(--verde-l)}
.pb.on{background:var(--verde);border-color:var(--verde);color:#04150e}
.pb.hecho::after{content:"";position:absolute;right:3px;bottom:3px;width:6px;height:6px;
  border-radius:50%;background:var(--verde-l)}
.pb.on.hecho::after{background:#04150e}

/* overlay */
.ov{position:fixed;inset:0;z-index:60;background:rgba(3,10,8,.94);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
html[data-theme="light"] .ov{background:rgba(240,246,243,.96)}
.ov.on{display:flex}
.ov-in{max-width:900px;width:100%}
.sorteo{font-size:clamp(34px,7vw,80px);font-weight:800;letter-spacing:-.03em;color:var(--tx3);
  margin:20px 0 10px;line-height:1.1;min-height:1.15em}
.sorteo.fin{color:var(--verde-l);text-shadow:0 0 46px rgba(0,192,106,.35)}
.wrapb{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:70;opacity:0;
  background:var(--panel);border:1px solid var(--verde);border-radius:999px;padding:10px 22px;
  font-size:13.5px;box-shadow:0 20px 50px -20px rgba(0,0,0,.7);pointer-events:none;transition:.26s}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:980px){
  .cols{grid-template-columns:1fr}
  .escgrid{grid-template-columns:repeat(2,1fr)}
  #paso-t{display:none}
}
@media (max-width:640px){
  :root{--head:58px}
  #reloj{font-size:23px;min-width:68px}
  #head{gap:7px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
  #head::-webkit-scrollbar{display:none}
  #head>*{flex:none}
  .escgrid{grid-template-columns:1fr}
  .b{padding:6px 10px;font-size:12.5px}
}
@media print{
  body{overflow:visible;background:#fff;color:#111}
  #head,#main,.ov,.toast{position:static}
  #head,.ov,.toast{display:none!important}
}

/* en la portada y en el cierre no hay reloj ni consigna que cronometrar */
body[data-vista="portada"] #paso-n, body[data-vista="portada"] #paso-t,
body[data-vista="portada"] #reloj, body[data-vista="portada"] #b-play,
body[data-vista="portada"] #b-mas, body[data-vista="portada"] #b-reset,
body[data-vista="portada"] #b-ant, body[data-vista="portada"] #b-sig,
body[data-vista="portada"] #barra,
body[data-vista="cierre"] #reloj, body[data-vista="cierre"] #b-play,
body[data-vista="cierre"] #b-mas, body[data-vista="cierre"] #b-reset,
body[data-vista="cierre"] #barra{display:none}
body[data-vista="portada"] #head .marca{flex:1}
</style>
</head>
<body>
<div id="head">
  <div class="marca">FEPAR 2026<small>Taller 02 · Formulario 02</small></div>
  <span id="paso-n">—</span>
  <span id="paso-t">—</span>
  <span id="reloj">0:00</span>
  <button class="b pri" id="b-play" title="Arrancar o pausar (barra espaciadora)">▶ Arrancar</button>
  <button class="b" id="b-mas" title="Sumar dos minutos">+2 min</button>
  <button class="b" id="b-reset" title="Reiniciar el reloj de esta consigna">↺</button>
  <button class="b" id="b-dado" title="Sortear un equipo">🎲 Sortear</button>
  <button class="b" id="b-ant" title="Consigna anterior">◀</button>
  <button class="b" id="b-sig" title="Consigna siguiente">Siguiente ▶</button>
  <button class="b" id="b-tema" title="Cambiar el tema">◐</button>
  <div id="barra"></div>
</div>

<div id="main"><div class="wrap" id="wrap"></div></div>

<div class="ov" id="ov-sorteo"><div class="ov-in">
  <span class="eyebrow o">Sorteo</span>
  <h2 id="sorteo-t">Comparte…</h2>
  <div class="sorteo" id="sorteo-v">—</div>
  <p class="tiny" id="sorteo-s"></p>
  <div class="wrapb" id="sorteo-b"></div>
</div></div>

<input type="file" id="arch" accept=".json,application/json" style="display:none">
<div class="toast" id="toast"></div>
<script>
"use strict";
var ESC  = {"1":{"t":"Producción de esponjas vegetales (Luffa cylindrica)","lug":"Localidades urbanas y periurbanas de la provincia de Salta","ent":"Urbano y periurbano","res":"Productos de higiene y limpieza fabricados con plásticos de un solo uso, frente a una demanda creciente de alternativas biodegradables cuya oferta local es discontinua."},"2":{"t":"Restauración de sitios contaminados con hidrocarburos","lug":"Área Puesto Guardián, departamento Orán","ent":"Rural · área hidrocarburífera","res":"Dos piletas de contingencia fuera de servicio desde el incidente del pozo MdT 14 (2007). La autoridad exige el cierre y la restauración; el propietario quiere ampliar la superficie agrícola."},"3":{"t":"Producción de especies forestales nativas","lug":"Provincia de Salta · el equipo define dónde se produce; el destino principal es el predio fiscal del borde este de la capital","ent":"Urbano y periurbano","res":"Una restauración de escala en el borde este de la ciudad de Salta, sumada a las campañas de forestación urbana, demandaría plantines de especies nativas que hoy nadie produce en las especies, cantidades, calidad y fechas que esa restauración necesita."},"6":{"t":"Aprovechamiento del agua de lluvia en edificios e instituciones","lug":"Departamento Capital · establecimiento hotelero proyectado en el piedemonte, a 7,5 km del centro","ent":"Urbano · borde suburbano en expansión","res":"Un hotel proyectado de 109 habitaciones se abastecerá íntegramente de un pozo propio, sobre un acuífero que ya tiene una depresión regional, mientras el agua de lluvia que cae sobre casi 15.000 m² del predio se conduce fuera por diseño."},"9":{"t":"Ochocientas hectáreas fiscales en el borde este de Salta","lug":"Departamento Capital · predio fiscal, catastro N° 133.745, ~847 ha sobre la RN 9, a 6 km del centro","ent":"Periurbano · interfaz campo–ciudad","res":"Deterioro simultáneo de las condiciones de habitabilidad de la población del borde este y de la base natural que la sostiene, sobre el último remanente continuo de vegetación nativa del sector, con una zonificación ya propuesta sobre el predio."},"10":{"t":"Gestión integral de residuos en un establecimiento porcino","lug":"Departamento Rosario de Lerma · predio rural de ~120 ha del Valle de Lerma","ent":"Rural de población dispersa","res":"Tres corrientes de residuos —líquida, sólida y gaseosa— acopladas entre sí, con observaciones de la autoridad en el expediente de renovación del certificado de aptitud ambiental."}};
var PREG = {"1":{"titulo":"Esponjas vegetales biodegradables en Salta","foco":"El escenario no dice cuánta demanda hay ni qué escala corresponde, así que el equipo tiene que dimensionar y desagregar un proyecto agrícola de ciclo anual sosteniéndose en supuestos que declare y pueda defender.","preguntas":{"apertura":["La actividad que traen del F01, ¿está escrita como un verbo en infinitivo que produce algo vendible, o todavía dice analizar, evaluar o seleccionar el sitio?","Si la componente que traen dice esponjas vegetales producidas, ¿queda claro que incluye el acondicionamiento para la venta, o el envasado y el etiquetado quedan afuera del alcance?","El escenario aclara que la Luffa cylindrica es una alternativa entre varias del árbol de objetivos: ¿por qué eligieron ese recurso y no otro producto biodegradable?","¿Cuál de las cuatro aplicaciones que menciona el escenario, esponja de baño, esponja de vajilla, cosmética natural o artesanía, va a ser el producto principal del proyecto?","¿Todo el equipo entiende lo mismo cuando dice el proyecto, o hay dos versiones dando vueltas sobre qué se produce y a quién se abastece?"],"dim":["¿Cuántas esponjas por ciclo productivo van a declarar, y qué supuesto de rendimiento por planta y de unidades comercializables por fruto sostiene ese número?","El escenario dice que no hay información sobre si la oferta satisface la demanda potencial: ¿qué supuesto de escala adoptan y cómo lo dejan declarado en el formulario?","¿Qué limita primero la escala: el agua de riego disponible, la superficie de la parcela, la capacidad del galpón o la cantidad de comercios que pueden absorber el producto?","Si la Luffa es una cucurbitácea anual, ¿la capacidad se expresa por ciclo, por año o por mes, y qué pasa con los meses sin cosecha?","¿A cuántos puntos de venta de Salta y a cuántos integrantes del emprendimiento alcanza el proyecto, y de dónde sale ese número si nadie relevó la demanda?"],"loc":["El escenario dice que las condiciones agroclimáticas cambian según la región de la provincia: ¿qué zona eligen para el cultivo y con qué criterio agroclimático la defienden?","¿La macrolocalización la manda el cultivo o la manda el mercado, si los comercios especializados y las ferias de emprendedores están en las localidades urbanas y periurbanas?","¿Conviene que el predio de cultivo y el galpón de procesamiento estén en el mismo sitio, o pueden separarse y cuánto flete asumen por hacerlo?","Para el micrositio, ¿qué factores van a tratar como excluyentes: disponibilidad de agua, acceso para camiones, energía eléctrica, pendiente del terreno o distancia a los puntos de venta?","El escenario menciona pequeños productores y emprendimientos familiares con experiencia agrícola: ¿la ubicación también se decide por dónde está disponible esa mano de obra?"],"flu":["En el flujograma de la inversión, ¿qué va primero, el acondicionamiento del predio o la obra del galpón, y qué paso no puede empezar hasta que el riego esté tendido?","¿El flujograma de la operación arranca en el almácigo o en la preparación del suelo, y dónde termina, en el envasado o en el despacho al comercio?","Entre la cosecha del fruto seco y la esponja envasada, ¿cuántos pasos hay realmente, pelado, desemillado, lavado, secado, corte, envasado, y les está faltando alguno?","¿Hay algún paso de la operación que dependa del clima, como el secado y blanqueado al sol, y qué hacen si llueve toda esa semana?","¿Los dos flujogramas se tocan en algún punto, o la corrida de prueba y puesta en marcha es la bisagra entre la inversión y la operación?"],"desc":["Si tuvieran que explicar el proyecto en un párrafo a un comercio de productos naturales de Salta, ¿qué dirían que produce, en qué cantidad y para quién?","¿Cuáles son las componentes que el proyecto entrega al terminar la inversión, y cuál es la componente que entrega cada año la etapa de operación?","¿El propósito es sustituir plásticos de un solo uso, generar ingreso para emprendimientos familiares, o las dos cosas, y cuál de las dos ponen adelante?","¿Qué características del producto van a declarar, medidas, presentación, tipo de envase, para que un comercio o una feria pueda decidir si lo compra?","¿La descripción deja claro que se formula a nivel de idea o perfil, con supuestos declarados, o promete precisiones que a esta altura no tienen?"],"accI":["¿Cuántas acciones de inversión necesitan de verdad, y hay alguna que en realidad sea una tarea de otra, como el cercado perimetral del lote?","El equipamiento de proceso, la selladora y las mesas de corte, ¿entra como Comprar una selladora o como Dotar al proyecto del equipamiento de procesamiento y envasado?","¿Aparece en su lista alguna acción de la formulación, como analizar la demanda de productos biodegradables o seleccionar el predio, que habría que sacar del F02?","¿La capacitación de los productores con experiencia agrícola que menciona el escenario es una acción con componente propia, o la están dando por incluida en otra?","Para cada acción, ¿la componente está en participio y nombra el producto obtenido, por ejemplo Galpón de procesamiento construido, sin repetir el verbo de la acción?"],"accO":["¿Las acciones de la operación cubren el ciclo completo, implantación, conducción, cosecha, acondicionamiento y despacho, o quedó alguna etapa del proceso sin acción que la contenga?","El secado y blanqueado al sol de las fibras, ¿es una tarea de la cosecha o merece acción propia por su duración y su dependencia del clima?","¿Qué bien de capital usa cada acción de la operación, y pueden señalar la acción de la inversión por la cual ese bien entró al proyecto?","Si el despacho a comercios y ferias es mensual pero la cosecha de Luffa es anual, ¿cómo queda expresada la periodicidad de la acción de despacho?","¿Se les coló alguna acción que en realidad es inversión, como instalar la espaldera o construir las piletas de lavado, dentro de la etapa operativa?"],"descA":["¿Cuál de sus acciones eligen para describir con los nueve descriptores, y por qué es esa la que más discusión genera dentro del equipo?","Para esa acción, ¿el resultado que escriben es la componente terminada y verificable, o repitieron el objetivo con otras palabras?","¿Cuánto dura la acción y en qué unidad, semanas o meses, y quién la ejecuta, el equipo del proyecto, una empresa contratista o un capacitador externo?","¿Qué recursos concretos entran en el descriptor, por ejemplo metros cúbicos de hormigón, metros cuadrados de chapa u horas de un ingeniero agrónomo, y en qué cantidad?","¿Qué indicador van a poder mirar para saber si la acción avanza, avance de obra quincenal, remitos y certificados, o planillas de asistencia a la capacitación?"],"sec":["¿Qué acción de la inversión es predecesora de casi todas las demás, y qué se arrastra si el acondicionamiento del predio se atrasa tres semanas?","¿El equipamiento de procesamiento puede llegar antes de que el galpón esté terminado, o hay que esperar la cubierta y la instalación eléctrica para recibirlo?","¿Qué acciones pueden ir en paralelo, por ejemplo el riego por goteo y las espalderas, y qué gana el proyecto si las superponen en el tiempo?","En la operación, ¿la conducción del cultivo puede empezar antes de terminar el trasplante, o la secuencia entre implantación, conducción y cosecha es estrictamente encadenada?","¿La capacitación del equipo va al final de la inversión, antes de la corrida de prueba, y qué acción figura como su predecesora inmediata?"],"tiempo":["¿Miden la inversión en semanas y la operación en meses, y pueden defender esa elección con la duración de las obras y el ciclo anual de la Luffa?","¿Qué acciones son recurrentes y con qué periodicidad, anual para las del cultivo y mensual para los despachos a comercios y ferias de emprendedores?","¿Cuál es la acción más larga de la inversión, y ese plazo cierra con la ventana de siembra que impone un cultivo anual?","¿Cuántos meses del año quedan sin actividad de cultivo, y qué hace en ese período el personal del emprendimiento familiar?","¿Cuál es el horizonte del proyecto en años, y cuántas veces se repite el ciclo productivo completo dentro de ese horizonte?"],"gantt":["Si la inversión tiene que terminar antes de la ventana de siembra, ¿qué fecha de arranque necesitan y qué margen dejan para atrasos de obra?","¿El Gantt de la operación muestra un ciclo productivo anual completo en meses, o mezclaron varios años del horizonte en la misma grilla?","¿Qué tarea tiene más riesgo de correr todo el cronograma, la perforación del pozo, la obra del galpón o la llegada del equipamiento de proceso?","Mirando el Gantt terminado, ¿lo podrían defender ante alguien que pregunte por qué el galpón lleva catorce semanas y no seis?","¿Las barras coinciden con las duraciones y las predecesoras que cargaron antes, o hay alguna acción que arranca antes que la acción de la que depende?"],"recI":["Para cada tarea de la inversión, ¿tienen recurso, unidad de medida y cantidad, o hay alguna que todavía quedó con la cantidad a definir?","El riego por goteo, ¿lo cargan por metros de cinta y metros perforados de pozo, o lo dejaron como un global sin unidad de medida?","¿Qué recursos se alquilan por hora de uso, como una desmalezadora o un tractor con subsolador, y cuáles se adquieren e ingresan como capital del proyecto?","¿La capacitación tiene recursos propios, horas de honorarios del capacitador y materia prima para la corrida de prueba, o quedó sin ningún recurso cargado?","A nivel de idea o perfil, ¿qué precisión le van a exigir a las cantidades, y qué supuestos declaran para las que estimaron a ojo?"],"recO":["En la tarea de secado al sol, ¿cargaron la compra de los deshidratadores solares, o solamente su limpieza y conservación porque ya entraron por la inversión?","¿Qué recursos operativos son gasto genuino, plantines, compost, agua de riego, energía para la bomba y envases, y cuáles son capital ya incorporado?","¿Cuántos jornales de peón y de cosechero necesita un ciclo completo, y de dónde salen esas personas si el escenario habla de emprendimientos familiares?","¿La cantidad de envases y etiquetas coincide con las unidades que declararon en el dimensionamiento, o quedaron dos números distintos en el mismo formulario?","¿Previeron reposición de plantines por fallas de trasplante, y con qué porcentaje, o están asumiendo que prende el cien por ciento de lo trasplantado?"]},"dato":{"apertura":"El escenario aclara que la Luffa cylindrica es una alternativa entre varias del árbol de objetivos: el equipo no está obligado a trabajar ese recurso.","dim":"El escenario declara que no hay información para saber si la oferta actual satisface la demanda potencial ni cuál sería la escala adecuada.","loc":"Las condiciones agroclimáticas difieren según la región de la provincia, y los comercios y las ferias se concentran en localidades urbanas y periurbanas.","flu":"La Luffa cylindrica es una cucurbitácea anual cuyo fruto seco desarrolla la red de fibras: recién después del secado hay materia prima utilizable.","desc":"Las aplicaciones posibles son esponjas de baño y de vajilla, limpieza doméstica, cosmética natural y artesanías, y no todas exigen el mismo acondicionamiento.","accI":"Comprar no es una acción: la incorporación de bienes se escribe como Dotar al proyecto de, con su componente redactada en participio.","accO":"El escenario advierte que la disponibilidad de infraestructura de producción, procesamiento y almacenamiento es variable en la provincia.","descA":"Los nueve descriptores son nombre, objetivo, resultado, descripción, duración, periodicidad, responsables, recursos e indicadores.","sec":"En la inversión el proyecto se dota de todos los bienes que la operación va a usar, así que las obras condicionan al equipamiento.","tiempo":"La inversión se mide en semanas o meses y la operación en años; la Luffa admite un solo ciclo productivo por año.","gantt":"La inversión es corta y estacional: tiene que quedar terminada antes de la ventana de siembra, y esa fecha manda sobre toda la secuencia.","recI":"Se formula a nivel de idea o perfil: no hay precisión en las cantidades, se adoptan supuestos y se los declara.","recO":"Todo bien de capital que usa la operación entró por una acción de la inversión; de ese capital sólo se imputan limpieza y conservación."}},"2":{"titulo":"Cierre y restauración de piletas · Puesto Guardián","foco":"El proyecto no se dimensiona por una demanda de mercado sino por un pasivo finito que la autoridad manda cerrar y el propietario quiere convertir en campo.","preguntas":{"apertura":["El F01 los deja con un sector de piletas fuera de servicio desde 2007: ¿la actividad que traen empieza con un verbo en infinitivo y nombra qué se hace con ese pasivo?","¿La componente que escribieron está en participio y dice qué queda al final en la Batería Puesto Guardián, o repite la actividad con otras palabras?","Si la autoridad exige el cierre y el propietario quiere sumar superficie agrícola, ¿cuál de los dos define el enunciado de la componente de ustedes, y por qué?","¿Caracterizar el pasivo y determinar el volumen contaminado son parte del proyecto que van a formular, o estudios de la formulación que ya deberían estar resueltos?","¿Qué supuestos van a declarar hoy, antes de dimensionar, para poder trabajar con las dos piletas sin contar con análisis de suelo actualizados?"],"dim":["Con una pileta de 50 × 30 metros y 1,5 a 2,5 de profundidad, y otra de 50 × 50 × 3,5, ¿qué volumen total de pasivo adoptan como supuesto?","¿Incluyen en ese volumen el suelo afectado por debajo de la pileta que se habilitó sin impermeabilizar durante la contingencia, y con qué espesor lo estiman?","Si el pasivo es finito, ¿la capacidad anual la fija la demanda de alguien o el plazo de cierre que exige la autoridad provincial?","¿Cuántos metros cúbicos por año pueden tratar sin que la celda quede ociosa apenas se agote el material de las dos piletas?","¿A quiénes alcanza el proyecto: cuántas hectáreas vuelven al uso agropecuario y cuántos puestos de trabajo directos sostiene mientras dura la operación?"],"loc":["La macrolocalización ya está dada por el pasivo: ¿qué sentido tiene discutirla, y qué factores quedan realmente en juego dentro del Área Puesto Guardián?","¿Dónde ubican la celda de tratamiento: dentro del sector de residuos peligrosos ya autorizado por la provincia, o en un sitio nuevo que habría que gestionar?","¿Qué distancia de acarreo interno entre las piletas y la celda están dispuestos a aceptar, y cómo pesa eso en el costo de transporte?","Si el establecimiento hace agricultura y ganadería junto a la infraestructura hidrocarburífera, ¿qué distancias mínimas fijan respecto de corrales, cultivos y viviendas?","¿Qué información sobre napa, escurrimiento y accesos les falta para defender la microlocalización, y qué supuesto adoptan mientras tanto?"],"flu":["En el flujograma de la inversión, ¿qué paso va primero, acondicionar el acceso o construir la celda, y qué pasa si lo invierten?","¿El flujograma de operación de ustedes termina cuando el suelo cumple el parámetro de hidrocarburos, o cuando el sector queda revegetado y entregado al propietario?","¿En qué paso del flujo operativo aparece la extracción del material de las dos piletas, y por qué no puede estar en la inversión?","¿Dónde ubican el análisis de laboratorio por lote: como un paso más del flujo o como control que puede devolver el material a tratamiento?","¿El flujo de operación es lineal o tiene un lazo de retorno cuando un lote no alcanza el valor de cierre exigido?"],"desc":["Si tuvieran que explicarle el proyecto al propietario en tres oraciones, ¿qué dirían que produce, en cuánto tiempo y qué le queda a él?","¿Cómo describen el propósito sin prometer más de lo que un tratamiento biológico puede lograr sobre barros mezclados con agua de formación de alto contenido salino?","¿Qué componentes enumeran en la descripción: celda, red de freatímetros, equipamiento, personal capacitado, sector restaurado, o alguno de esos sobra?","¿La descripción deja claro que el proyecto tiene fin, porque el pasivo se agota, y qué destino le dan a la celda después?","¿Qué características del sitio de Orán, como el clima, la estación seca o la coexistencia con la actividad agropecuaria, entran en la descripción?"],"accI":["¿Cuántas acciones necesitan para dejar el sitio en condiciones de recibir el primer lote extraído, y cuál es la componente de cada una?","Comprar el tractor no es una acción: ¿cómo la enuncian para que quede como dotación del proyecto y no como un trámite administrativo?","¿La red de tres freatímetros entra por una acción propia de la inversión, o la cuelgan como tarea de la construcción de la celda?","¿Qué tareas concretas ponen bajo la construcción de la celda de 3.000 metros cuadrados: nivelación, geomembrana, bermas perimetrales, sumidero de lixiviados, alguna más?","¿Capacitar al personal en el manejo de residuos peligrosos es una acción de la inversión o un gasto de la operación, y cómo lo justifican?"],"accO":["¿Cuál es la primera acción de la operación, extraer el material de las piletas o armar las biopilas, y de qué depende ese orden?","Si el pasivo se agota en dos años de tratamiento, ¿cuántas campañas de extracción planifican por año y en qué estación las ubican?","¿El monitoreo de agua subterránea y de calidad de suelo es una acción operativa con componente propio, o lo esconden dentro del tratamiento?","¿Rellenar y reconformar el sector de piletas es una acción de la operación o del cierre, y dónde la van a poner ustedes?","¿Qué componente en participio le asignan a la revegetación del sector para que se distinga con claridad de la reconformación topográfica previa?"],"descA":["¿Qué acción eligen describir con los nueve descriptores, y por qué esa y no otra les resulta la más difícil de defender?","Para la construcción de la celda, ¿qué diferencia escriben entre objetivo y resultado sin terminar repitiendo la misma oración dos veces seguidas?","¿Quién queda como responsable, la empresa contratista, el responsable ambiental del proyecto o ambos, y cómo reparten la supervisión en el descriptor?","¿Qué indicadores de verificación proponen para la geomembrana de 1,5 milímetros: control de chispa, ensayo de estanqueidad, remitos, registro fotográfico?","¿Qué duración en meses estiman y qué supuesto la sostiene, sabiendo que formulan a nivel de idea y no de proyecto ejecutivo?"],"sec":["¿Qué acción de la inversión no tiene predecesora, y están seguros de que se puede empezar sin acondicionar antes el acceso y la playa de maniobras?","¿La capacitación del personal va antes o después de la puesta en marcha del equipamiento, y qué riesgo corren si la dejan para el final?","En la operación, ¿pueden armar biopilas sobre la celda sin haber extraído y clasificado antes el material, o esa dependencia es estricta?","¿Por qué no se puede revegetar antes de reconformar, y qué análisis por lote obliga a esperar antes de rellenar el sector?","¿Qué acciones de la inversión pueden correr en paralelo una vez acondicionado el acceso, sin depender de que la celda esté terminada?"],"tiempo":["Si la inversión se mide en meses y la operación en años, ¿qué horizonte total declaran para un pasivo que se agota solo?","¿Cuántos meses le asignan a la construcción de la celda de 3.000 metros cuadrados, y qué imprevisto los llevaría a estirar ese plazo?","¿Qué acciones son recurrentes y con qué periodicidad: campañas semestrales de extracción, ciclos de tratamiento, muestreos trimestrales de los freatímetros?","¿La ventana de estación seca les alcanza para dos ciclos de tratamiento por año, o tienen que revisar la capacidad anual que declararon?","¿Qué duración le dan a la revegetación y por qué conviene atarla al inicio de la estación húmeda en Orán?"],"gantt":["¿El Gantt de la operación encadena fases sucesivas o las superpone, sabiendo que no se puede rellenar un sector cuyo suelo sigue en tratamiento?","¿Cuánto dura la inversión completa en su cronograma, y qué acción está en el camino crítico hacia la llegada del primer lote?","¿En qué mes del cronograma ubican el inicio de la extracción, y coincide con la estación seca del departamento Orán?","Si la autoridad pidiera adelantar el cierre seis meses, ¿qué barra del Gantt acortan y cuál no se puede tocar sin romper el proceso?","¿El cronograma muestra el momento en que la celda queda ociosa por agotamiento del pasivo, o ese final queda invisible en el dibujo?"],"recI":["Para la celda de 3.000 metros cuadrados, ¿cuántos metros cuadrados de geomembrana compran realmente, contando solapes y anclaje en las bermas perimetrales?","¿Qué unidad de medida usan para la motoniveladora y para el equipo de termofusión: horas de uso, jornal o cantidad de unidades?","¿La excavadora y el equipo de perforación se alquilan o se compran, y qué cambia esa decisión en la lista de recursos de ustedes?","¿Cuántos metros de caño ranurado necesitan para tres freatímetros de 25 metros de profundidad, y qué otros materiales lleva cada pozo?","¿Qué recursos exige la capacitación del plantel, jornales de instructor habilitado o juegos de elementos de protección personal, y en qué cantidad cada uno?"],"recO":["¿Qué recursos de la operación son gasto y cuáles son capital ya incorporado en la inversión, para no contabilizar dos veces el mismo desembolso?","El tractor de 110 HP ya entró por la inversión: ¿qué consignan entonces en la operación, sus horas de uso o su compra?","¿Cuánta agua de riego por año necesitan las biopilas, y de dónde sale en un establecimiento que ya usa agua para agricultura y ganadería?","¿Cuántos análisis de hidrocarburos totales por año prevén, y a quién le asignan ese costo dentro del proyecto de remediación?","¿Qué cantidades de fertilizante, enmienda estructurante y semilla estiman por año, y con qué supuesto de dosis por metro cúbico las justifican?"]},"dato":{"apertura":"Las piletas se construyeron para la contingencia del pozo MdT 14 en 2007 y nunca fueron instalaciones permanentes del proceso productivo.","dim":"Las dos piletas miden 50 × 30 metros con 1,5 a 2,5 de profundidad y 50 × 50 × 3,5 metros.","loc":"La empresa ya gestionó la autorización provincial para un sector de tratamiento de residuos peligrosos dentro de la Batería Puesto Guardián.","flu":"La inversión construye la capacidad de tratar; la operación extrae, trata, analiza, rellena y revegeta, en fases sucesivas y no simultáneas.","desc":"El propietario pretende ampliar la superficie agropecuaria una vez finalizada la remediación, pero el criterio de cierre lo fija la autoridad.","accI":"Todo bien de capital que use la operación debe entrar por una acción de la inversión: celda, freatímetros, tractor, obrador.","accO":"La extracción del material es el proceso productivo del proyecto y se repite en campañas; no es una obra de la inversión.","descA":"Los nueve descriptores son nombre, objetivo, resultado, descripción, duración, periodicidad, responsables, recursos e indicadores; ninguno puede quedar vacío.","sec":"Sin celda impermeabilizada y sin red de monitoreo instalada no se puede empezar a mover suelo hidrocarburado en el sector.","tiempo":"La inversión suele medirse en meses y la operación en años; acá el pasivo finito acota el horizonte operativo.","gantt":"La operación no es un ciclo que se repite indefinidamente sino una remediación con fases sucesivas: extraer, tratar, rellenar, revegetar.","recI":"Los equipos alquilados por hora se consignan como recurso de la tarea que los usa, no como bienes de capital del proyecto.","recO":"En la operación se computan las horas de uso y la conservación de los bienes ya incorporados, y aparte los insumos consumidos."}},"3":{"titulo":"Vivero de nativas para restauración y arbolado","foco":"El proyecto es el vivero y no la restauración que lo demanda, y hay que dimensionarlo sin saber cuántos plantines por especie se van a pedir, con un ciclo productivo de hasta dos años y una única ventana de entrega por año.","preguntas":{"apertura":["¿La actividad que traen del F01 dice producir plantines nativos, o se les coló la restauración de las 800 hectáreas del borde este, que es el destinatario y no el proyecto?","¿La componente está escrita en participio y nombra el producto que queda, o todavía dice comprar, gestionar o alguna tarea administrativa que no corresponde a este nivel?","Si un plantín nativo necesita entre uno y dos años de vivero, ¿la actividad que enunciaron alcanza a entregar algo dentro del horizonte que se fijaron?","¿Están formulando un vivero, un servicio de recolección de semilla o un programa de forestación urbana, y por qué esa alternativa y no otra?","¿Quién queda como responsable del proyecto: un organismo provincial, un municipio, una institución educativa o un privado, y eso cambia lo que pueden formular?"],"dim":["Sin información sobre cuántos plantines por especie demandan la restauración y las campañas urbanas, ¿qué supuesto de demanda anual adoptan y con qué lo fundamentan?","¿Cuántos plantines por año necesitan las 800 hectáreas del predio fiscal si se plantan por etapas, y cuántos suman las campañas de municipios e instituciones educativas?","De las 32 especies leñosas nativas inventariadas, ¿con cuántas van a trabajar, y qué hacen con las dos que tienen categoría de conservación desfavorable?","Si cada cohorte ocupa envases entre doce y dieciocho meses, ¿cuántos envases en stock permanente hace falta sostener para entregar la cantidad anual que definieron?","¿La capacidad que declaran es la del primer año o la de régimen, y en qué año del proyecto la alcanzan?"],"loc":["¿En qué zona de la provincia ubican el vivero: cerca del predio fiscal del borde este, cerca de los rodales semilleros, o cerca de la mano de obra?","Si la restauración exige procedencia local, ¿el sitio del vivero tiene que estar dentro de la misma región de procedencia que los sitios de plantación?","¿Qué factores pesan más en la microlocalización: disponibilidad de agua, energía, superficie plana, acceso para camiones o seguridad del predio?","El predio de destino tiene pendientes de más del 30 % y suelos erosionables, ¿eso condiciona dónde producir o solamente cómo plantar?","¿El terreno del vivero es propio, cedido o alquilado, y qué pasa con la inversión en obra si esa cesión se cae al tercer año?"],"flu":["¿El flujograma de inversión termina donde el vivero está listo para recibir la primera semilla, o se les mezclaron pasos que ya son producción?","¿La cosecha de semilla en los rodales semilleros es el primer paso de la operación, o entra antes, mientras el vivero todavía se está construyendo?","En el flujo de operación, ¿dónde ponen la rustificación y la selección, y qué pasa con los plantines que no califican para entrega?","¿El flujograma de operación cierra en la entrega, o incluye el monitoreo de supervivencia en los sitios plantados y el ajuste del plan de producción?","¿Cuántos pasos necesitan para que el flujo se entienda leído en voz alta, sin convertirlo en la lista de tareas de la EDT?"],"desc":["En una síntesis de diez líneas, ¿cómo explican que el proyecto es el vivero y no la restauración de las 800 hectáreas que lo demanda?","¿Qué características del proyecto declaran como distintivas: procedencia local, trazabilidad de la semilla, calendario atado a las lluvias, o las tres juntas?","¿Qué supuestos están adoptando por falta de información, y los dejaron escritos en la descripción o quedaron en la cabeza de alguien?","¿Cuáles son los destinatarios que nombran: el programa del predio fiscal, los municipios, las instituciones educativas, las organizaciones sociales, y en qué proporción?","Si alguien lee sólo la descripción general, ¿entiende por qué hoy los viveros de la región producen ornamentales exóticas y este proyecto no?"],"accI":["¿Qué acciones dotan al proyecto de todo lo que la operación va a usar: invernáculo, umbráculo, agua de riego, manejo de semilla, vehículos?","¿Escribieron dotar al vivero del equipamiento de manejo de semilla, o pusieron comprar la cámara de conservación, que es una tarea y no una acción?","¿Relevar la demanda por especie y estimar la capacidad instalada de vivero de la región quedaron como acciones, cuando son estudios de la formulación?","La capacitación del equipo en cosecha de semilla y propagación, ¿es una acción de la inversión con componente propia, o la dejaron implícita?","¿Cada acción de la inversión tiene su componente en participio, y cada componente nombra un bien o capacidad que la operación efectivamente va a usar?"],"accO":["¿Cuáles son las acciones del proceso productivo: recolectar semilla, producir plantines, entregar en los sitios, monitorear supervivencia, o las desagregaron de otra manera?","¿La entrega en la ventana de lluvias es una acción propia o una tarea metida adentro de la producción, y qué les conviene para el Gantt?","El monitoreo de supervivencia en los sitios plantados, ¿es parte de este proyecto o se lo dejan al programa de restauración del predio fiscal?","¿Aparece alguna acción de la operación que en realidad incorpora un bien de capital que debió entrar por una acción de la inversión?","¿Cómo desagregan la producción cuando hay dos cohortes superpuestas y en el mismo mes conviven siembra, repique, riego y rustificación?"],"descA":["¿Qué acción eligen describir con los nueve descriptores, y por qué es esa la que más decisiones de formulación esconde?","Si describen la acción que dota al vivero de agua, ¿qué resultado declaran, sabiendo que en el predio la disponibilidad de agua para riego es variable?","¿Qué indicadores de verificación ponen que se puedan controlar de verdad: ensayo de bombeo, prueba de presión, remitos, certificados de obra?","¿Los responsables que nombran existen en el proyecto, o están inventando un área técnica que nadie previó en la estructura?","En la periodicidad, ¿distinguen las acciones que se hacen una sola vez de las que se repiten cada año según el calendario de fructificación?"],"sec":["¿Qué acción de la inversión puede arrancar sin predecesora, y cuál no puede empezar hasta que el predio del vivero esté nivelado y cerrado?","¿La capacitación del equipo depende de que la obra del invernáculo esté terminada, o puede correr en paralelo y ganarles algunos meses?","¿La incorporación de la camioneta y el acoplado tiene una predecesora real, o la encadenaron sin necesidad y alargaron la inversión?","En la operación, ¿la producción de plantines espera a que la semilla esté cosechada y acondicionada, o entre cohortes esas acciones se solapan?","¿Hay alguna acción de la operación que dependa de una acción de la inversión todavía sin terminar, y eso se ve en la secuencia?"],"tiempo":["¿Cuántos meses le dan a la inversión completa, y llega la obra a estar terminada antes de la primera temporada de cosecha de semilla?","Si el plantín necesita de doce a dieciocho meses de vivero, ¿qué duración le asignan a la acción de producir, medida en años?","¿Qué periodicidad tiene la recolección de semilla si cada una de las especies fructifica en su propia fecha, y cómo lo escriben en una línea?","La entrega ocupa pocas semanas dentro de la ventana de lluvias, ¿cómo expresan esa duración en años y qué periodicidad le ponen?","¿Miden la inversión en meses y la operación en años, o mezclaron unidades y el Gantt les va a quedar ilegible?"],"gantt":["¿El Gantt de la operación muestra el ciclo de una cohorte de plantines, o intenta mostrar todas las cohortes superpuestas al mismo tiempo?","Desde la cosecha de semilla hasta el monitoreo de supervivencia a los doce meses, ¿cuánto tiempo total ocupa una cohorte en el cronograma?","¿La primera entrega de plantines cae dentro de una ventana de lluvias real, o el cronograma se las ubica en pleno invierno?","¿Podrían defender este cronograma ante alguien que pregunte por qué la inversión dura exactamente lo que dura, y con qué argumento?","¿Qué pasa en el cronograma si el programa de restauración del predio fiscal se aprueba un año más tarde de lo previsto?"],"recI":["Para nivelar y cerrar el predio del vivero, ¿qué recursos listan y en qué unidad: horas de máquina, jornales, metros lineales de alambrado?","¿Cuántos metros cuadrados de invernáculo y de umbráculo necesitan para sostener el stock de envases que definieron en el dimensionamiento?","El abastecimiento de agua, ¿lo resuelven con pozo, con red o con reserva, y qué recursos cambian según esa decisión?","¿Cargaron acá, en la inversión, el equipamiento de manejo de semilla y los vehículos, con su unidad y cantidad, y no en la operación?","¿Cada recurso de la inversión está colgado de una tarea concreta, o quedaron recursos sueltos que ninguna tarea justifica?"],"recO":["¿Cuántos envases, cuántos metros cúbicos de sustrato y cuánta agua de riego por año consume la producción que dimensionaron?","¿Cuántos jornales de operarios de vivero y cuántos de recolectores de semilla necesitan por año, y en qué meses se concentran?","¿El equipamiento de semilla, el umbráculo y la camioneta aparecen acá como mantenimiento y reposición, o los volvieron a comprar y los contaron dos veces?","¿Cuánto combustible consume el reparto si las entregas van al borde este y también a municipios e instituciones educativas dispersas?","¿Marcaron para cada recurso de la operación si es gasto operativo o capital ya incorporado durante la etapa de inversión?"]},"dato":{"apertura":"El escenario aclara que producir plantines es una alternativa posible, no la respuesta obligada: el equipo define su propio problema central y fundamenta la alternativa.","dim":"No hay información sobre cuántos plantines por especie y por año se demandarían, ni sobre la capacidad instalada de vivero en la región.","loc":"La restauración exige procedencia local y trazabilidad de la semilla: no cualquier plantín nativo sirve para cualquier sitio de plantación.","flu":"Un plantín de especie nativa necesita entre uno y dos años de vivero antes de estar en condiciones de plantarse.","desc":"El predio fiscal del borde este tiene unas 800 hectáreas y 32 especies leñosas nativas inventariadas, dos con categoría de conservación desfavorable.","accI":"Comprar no es una acción sino una tarea administrativa: la incorporación de un bien se enuncia como dotar al proyecto de algo.","accO":"En la operación se ejecuta el proceso productivo con los bienes que ya entraron por la inversión, sin volver a incorporarlos.","descA":"Los nueve descriptores son nombre, objetivo, resultado, descripción, duración, periodicidad, responsables, recursos e indicadores.","sec":"La capacitación del equipo no depende de que la obra esté terminada y puede ejecutarse en paralelo a la construcción.","tiempo":"La ventana de plantación está atada al régimen de lluvias; fuera de esa ventana la supervivencia de los plantines cae.","gantt":"La inversión suele medirse en meses y la operación en años; las cohortes de plantines se superponen entre temporadas.","recI":"El predio de destino presenta pendientes superiores al 30 % en su mitad alta, suelos erosionables y disponibilidad variable de agua.","recO":"La demanda institucional se decide con presupuestos anuales, mientras producir un plantín compromete hasta dos años de vivero."}},"6":{"titulo":"Agua de lluvia para usos no potables en un hotel","foco":"El proyecto no lo dimensiona la superficie de captación sino el desfase estacional entre la lluvia de verano y el riego de la estación seca, y la ventana de obra que permite tender una segunda red antes de que las instalaciones estén terminadas.","preguntas":{"apertura":["La actividad que traen del F01, ¿está enunciada como «Dotar al establecimiento de…» o todavía dice «comprar tanques», que es una tarea administrativa y no una acción?","¿La componente que escribieron está en participio y nombra el bien que queda instalado en el hotel de 109 habitaciones, o describe una intención?","El escenario aclara que captar lluvia es una alternativa entre otras: ¿pueden defender por qué eligieron esa y no reducir consumo o reusar aguas grises?","¿Sobre quién recae el problema que eligieron: sobre el hotel que paga el bombeo, sobre el acuífero deprimido, o sobre la ciudad hacia la que hoy converge el flujo?","¿Están de acuerdo en que el proyecto es el sistema de captación y no el hotel entero, cuyo visado de planos y estudio de impacto ya están presentados?"],"dim":["Con 9.650 m² de cubierta y una franja de isohietas de 750 a 800 mm, ¿qué volumen bruto anual da la cuenta y qué coeficiente de pérdidas adoptan?","Si 197 mm caen en enero y el riego se necesita entre abril y octubre, ¿la capacidad del sistema la fija la lluvia, la cisterna o el desfase estacional?","¿Con qué valor de espacio verde van a dimensionar el riego, los 5.000 m² de la distribución de superficies o los 2.600 m² de las fichas, y por qué?","¿En qué unidad y por qué período van a expresar la capacidad: metros cúbicos entregados por año a la red no potable, o porcentaje de demanda sustituida?","¿A cuántos alcanza el proyecto: a las 109 habitaciones, a las pernoctaciones anuales, al personal del hotel, o al conjunto de usuarios del acuífero deprimido?","Si duplicar el almacenamiento suma pocos puntos de sustitución, ¿hasta dónde conviene crecer y con qué criterio cortan el tamaño de las cisternas?"],"loc":["Para la macrolocalización, ¿qué pesa más: estar en el Departamento Capital, estar fuera del radio servido por la prestadora, o estar sobre un acuífero con depresión regional?","¿Dónde ubican las cisternas dentro de los 13.045,03 m² del predio para que la cubierta descargue por gravedad y no haya que bombear dos veces?","El pozo está a 200 m y la cisterna semienterrada es de 55.000 L: ¿el almacenamiento de lluvia va al lado, o conviene separarlo para no cruzar redes?","¿Qué factores de microlocalización van a listar además de la cota: distancia a la sala de bombas, acceso para camión atmosférico, retiros municipales, interferencia con el canal perimetral?","El excedente hoy va por cordón cuneta y canal perimetral al río, 800 m al norte: ¿el vertedero de las cisternas descarga ahí o en otro lado?"],"flu":["En el flujograma de inversión, ¿qué va primero: adecuar cubiertas y canaletas, o excavar las cisternas, y qué obliga a ese orden dentro de los 24 meses de obra?","¿El flujograma de operación arranca en la lluvia sobre los 9.650 m² de cubierta o en el almacenamiento, y dónde entra el desvío del primer lavado?","¿En qué paso del flujograma operativo aparece la reposición desde el pozo cuando la reserva de lluvia no alcanza en la estación seca?","¿El flujograma de operación termina cuando el agua llega a los inodoros, o incluye la medición y el registro mensual que la certificación va a pedir?","¿Dónde muestran el excedente que se va por el vertedero cuando llueven 197 mm en enero y las cisternas ya están llenas?"],"desc":["En dos oraciones, ¿cuál es el propósito del proyecto: sustituir agua de pozo, aliviar el acuífero, o sostener la certificación de hotelería sustentable?","¿Qué componentes van a listar en la síntesis: cubiertas adecuadas, cisternas, segunda red, equipo de bombeo, medición y personal capacitado, o alguna se cae?","¿Cómo describen el proyecto sin prometer autosuficiencia, si el pozo sigue reponiendo buena parte de la demanda no potable durante la estación seca?","¿Qué características técnicas entran en la descripción: superficie de captación, volumen de cisterna, calidad del agua entregada, artefactos alcanzados, o hace falta algo más?","El estudio dice que el canal existente no tiene problemas de manejo: ¿cómo redactan la justificación sin apoyarse en un anegamiento que el escenario niega?"],"accI":["¿Cuántas acciones de inversión necesitan, y cada una empieza con verbo en infinitivo que nombra una dotación y no un trámite como tramitar la concesión?","La segunda red no potable, ¿es acción de la inversión o mejora posterior, sabiendo que decidirla en obra cuesta mucho menos que romper instalaciones terminadas?","¿Qué componente escriben para la acción que incorpora el almacenamiento: «cisternas construidas» con su volumen, o algo que todavía suena a compra?","Capacitar al personal para convivir con dos redes, ¿es una acción de inversión con su componente, o lo dejan colgado dentro de la operación?","¿Qué tareas concretas cuelgan de adecuar los 9.650 m² de cubierta: canaletas, rejillas, bajadas, desvío de primer lavado, prueba hidráulica, o falta alguna?","¿Está todo bien de capital que la operación va a usar entrando por alguna acción de inversión, incluidos medidores, pluviómetro y equipo de cloración?"],"accO":["¿Cuáles son las acciones que se repiten todos los años de operación: captar y almacenar, distribuir, mantener equipos, controlar calidad, formar personal, o falta alguna?","¿En qué acción de la operación ponen la reposición desde el pozo, y cómo evitan que parezca que el sistema sustituye el 100 % de la demanda?","El riego de la estación seca y la limpieza de canaletas antes de las lluvias de verano, ¿son tareas de la misma acción o de acciones distintas?","¿Qué componente produce la acción de controlar la calidad y verificar que no haya conexiones cruzadas entre la red potable y la violeta?","La certificación de hotelería sustentable exige documentación y auditoría: ¿eso genera una acción operativa propia o se reparte como tarea dentro de otras?"],"descA":["¿Qué acción eligen para describir con los nueve descriptores, y por qué esa es la que más se juega en este caso?","En el descriptor resultado, ¿qué queda instalado al terminar la acción, y en qué se diferencia del objetivo que escribieron arriba?","¿Quiénes son los responsables: la contratista sanitaria, la dirección de obra, el propietario, o el personal del hotel, y quién firma la recepción?","¿Qué indicador verificable proponen: metros de cañería probados, actas de ensayo de conexiones cruzadas, o metros cúbicos medidos en la primera carga?","Si la acción se ejecuta dentro de las tres etapas de ocho meses de la obra, ¿qué duración y qué periodicidad declaran, y con qué supuesto la sostienen?"],"sec":["¿Qué acción no tiene predecesora y puede arrancar apenas empieza la obra: la adecuación de cubiertas, la excavación de cisternas, o las dos en paralelo?","¿La segunda red no potable puede tenderse antes de que existan las cisternas, o depende de ellas para la prueba de presión y la puesta en servicio?","La capacitación del personal, ¿va última porque necesita el sistema montado y medidores instalados, o puede solaparse con el final de la obra?","¿Alguna predecesora que escribieron es en realidad un trámite externo, como la concesión de agua subterránea que sigue pendiente ante la autoridad provincial?","En la operación, ¿todas las acciones dependen de que la captación y el almacenamiento estén funcionando, o alguna corre con independencia desde el primer año?"],"tiempo":["¿Miden la inversión en meses y la operación en años, y qué horizonte de operación adoptan para un sistema de cisternas y cañerías?","¿Cuántos meses le asignan al tendido de la red en cuatro niveles con 109 habitaciones, y ese número entra en la etapa de obra que eligieron?","¿Con qué periodicidad se limpian canaletas y cestos si las lluvias se concentran entre noviembre y marzo, y esa frecuencia cambia en la estación seca?","¿Qué acciones operativas son diarias, cuáles trimestrales o semestrales, y cuáles anuales, y cómo justifican cada frecuencia sin inventar precisión que no tienen?","El riego corre de abril a octubre: ¿la acción que lo contiene dura todo el año o sólo esos meses, y cómo lo escriben en el formulario?"],"gantt":["¿El Gantt de la inversión entra dentro de los 24 meses de obra, o se les estira más allá del momento en que se inaugura el hotel?","¿Qué barras se superponen y cuáles no pueden superponerse, por ejemplo excavar cisternas mientras se tiende la red en los cuatro niveles?","Si un inspector les pregunta por qué la capacitación cierra el cronograma, ¿tienen una respuesta que no sea que quedaba espacio al final?","¿Conviene que la puesta en marcha coincida con el inicio de la temporada de lluvias para cargar las cisternas antes de la primera estación seca?","En el Gantt de la operación, ¿qué muestran si todas las acciones corren en paralelo durante todo el horizonte: barras continuas o marcas de periodicidad?"],"recI":["¿Cuántos metros de canaleta necesitan para 9.650 m² de cubierta, con qué supuesto de perímetro y pendiente lo estiman, y en qué unidad lo escriben?","Para las cisternas, ¿qué recursos listan por tarea: horas de retroexcavadora, metros cúbicos de hormigón, kilos de acero, jornales, o mezclan todo en un ítem?","¿La señalización violeta y la cartelería de agua no apta para consumo figuran como recurso con unidad y cantidad, o se les traspapeló?","¿Qué unidad de medida usan para el capacitador, el pluviómetro y los caudalímetros, sabiendo que jornal, cantidad y metro no son intercambiables?","¿Cada tarea de las acciones de inversión tiene al menos un recurso cargado, o quedaron tareas de prueba y ensayo sin nada asignado?"],"recO":["¿Qué recursos de la operación son gasto anual, como energía, hipoclorito, cartuchos y análisis de laboratorio, y cuáles son capital ya incorporado en la inversión?","Las cisternas y las electrobombas, ¿aparecen en la operación como inversión repetida o sólo como conservación de un capital que ya entró?","¿Cuántos metros cúbicos anuales de agua de pozo siguen haciendo falta como reposición, y cómo los declaran para no exagerar el ahorro del proyecto?","¿Con qué unidad expresan la energía de bombeo y el agua entregada al riego de los 2.600 m², kWh por año y m³ por año?","¿Cuántos jornales anuales de mantenimiento suponen para limpiar canaletas y cisternas, y ese personal es del hotel o se contrata afuera?"]},"dato":{"apertura":"El hotel proyecta 109 habitaciones, piscina de 180 m² y lavandería sobre un predio de 13.045,03 m² fuera del radio servido por la prestadora.","dim":"La serie 1991-2020 de la estación a 5,5 km registra 197 mm en enero, dentro de una franja de isohietas de 750 a 800 mm anuales.","loc":"El predio está fuera del radio de la prestadora y se abastece de un pozo propio a 200 m, con concesión provincial todavía en trámite.","flu":"La obra del hotel se ejecuta en 24 meses y tres etapas de ocho, ventana única para incorporar el sistema antes de terminar las instalaciones.","desc":"Duchas, lavabos, cocina y lavandería exigen calidad potable; la descarga de inodoros, el riego, la limpieza y el lavado no la exigen.","accI":"Diseñar la red, dimensionar la demanda y tramitar la concesión pertenecen a la formulación y a lo administrativo, no son acciones del proyecto.","accO":"El escenario advierte que un sistema construido no rinde solo: exige medición, procedimientos de operación y mantenimiento, y personal formado para dos redes.","descA":"Los nueve descriptores son nombre, objetivo, resultado, descripción, duración, periodicidad, responsables, recursos e indicadores; a nivel de idea se declaran los supuestos adoptados.","sec":"Las instalaciones sanitarias del hotel se terminan dentro de las tres etapas de obra: después de eso, tender la red no potable implica romper lo hecho.","tiempo":"La inversión suele medirse en meses y la operación en años; en este caso la obra del hotel impone una ventana de 24 meses.","gantt":"Las tres etapas de obra duran ocho meses cada una y ordenan toda la secuencia de la inversión dentro del cronograma del hotel.","recI":"Se formula a nivel de idea o perfil: las cantidades se estiman con supuestos declarados, no con cómputo métrico de proyecto ejecutivo.","recO":"En la operación hay que distinguir el gasto operativo del capital ya incorporado en la inversión, para no contabilizar dos veces el mismo bien."}},"9":{"titulo":"Predio fiscal de 847 ha en el borde este de Salta","foco":"El escenario ya trae una zonificación resuelta y un dominio público continuo, así que el F02 tiene que convertir una decisión de destino en acciones ejecutables sobre el terreno, dimensionadas por la pendiente, el agua y la única salida de escurrimiento.","preguntas":{"apertura":["La actividad que traen del F01, ¿se enuncia con un verbo en infinitivo y una superficie concreta del catastro N° 133.745, o todavía dice zonificar, planificar o estudiar?","Si la componente que escribieron no puede leerse como algo habilitado, cercado o restaurado sobre una porción del predio, ¿qué producto verificable están prometiendo realmente?","El estudio declara 847,97 hectáreas y la digitalización 846,6: ¿sobre qué superficie van a formular, y cómo dejan escrito ese supuesto para que nadie lo confunda con un dato firme?","¿Su proyecto adopta, ajusta o discute la zonificación de 289,8, 324,0 y 215,3 hectáreas, y en cuál de las tres zonas cae la actividad que eligieron?","¿Están formulando una actividad que el proyecto va a ejecutar, o siguen describiendo un estudio previo que el escenario ya les entregó resuelto sobre la mesa?"],"dim":["Con 289,8 hectáreas destinadas a conservación, ¿cuántas va a intervenir efectivamente su proyecto, y qué le pone el techo: la pendiente, el financiamiento o la capacidad de mantenimiento del operador?","¿Cuál es la unidad de producción de su actividad, visitas atendidas, hectáreas restauradas, metros cúbicos retenidos o plantines producidos, y por qué eligieron esa y no otra?","Si el sector no tiene espacios verdes públicos, ¿qué superficie haría falta para cubrir un estándar de diez metros cuadrados por habitante, y qué porcentaje de ese déficit cubre su proyecto?","Las alcantarillas de la RN 9 son el único punto de salida y el cauce receptor no tiene capacidad ociosa: ¿esa restricción le pone tamaño máximo a lo que pueden habilitar?","¿A cuántos beneficiarios directos alcanzan, y de dónde sacan ese número si el escenario no da la población del área de influencia directa?"],"loc":["¿Cuál es la macrolocalización de su proyecto, el aglomerado de Salta, el Departamento Capital o el borde este, y qué agrega cada una de esas escalas a la decisión?","Dentro de las 847 hectáreas, ¿en qué sector concreto se emplaza: la mitad alta con pendientes superiores al 30 %, la franja sobre la RN 9 o el contacto con los barrios?","¿Qué pesa más al elegir el sitio, la accesibilidad por la RN 9 y la única línea de transporte público, o la distancia a los frentes de ocupación informal?","Si la cuenca visual se observa desde veinte puntos sobre la ruta, ¿eso condiciona dónde ubicar accesos, miradores o instalaciones, o es indiferente para el proyecto que eligieron?","El predio es cabecera de cuenca y zona de conducción de un acuífero de escasa dimensión: ¿qué usos quedan excluidos del sitio sólo por esa condición?"],"flu":["En el flujograma de inversión, ¿qué paso va primero, cercar y sanear o excavar y construir, y qué pasa si invierten ese orden en un predio con extracción activa de leña y áridos?","¿Su flujograma de operación describe un ciclo que se repite todos los años, o todavía está describiendo pasos de obra que ocurren una sola vez?","¿En qué paso del flujograma entra el saneamiento de los microbasurales perimetrales, y de qué depende que ese paso no haya que repetirlo todos los años?","Si la ventana seca va de mayo a octubre y la plantación pide septiembre a marzo, ¿cómo ordenan obra e implantación en el flujograma sin que se pisen entre sí?","¿Cuántos pasos tiene cada flujograma, y hay alguno que en realidad sea un trámite administrativo disfrazado de paso del proceso productivo?"],"desc":["En cinco líneas, ¿qué problema del borde este resuelve su proyecto y para quién: los habitantes sin espacio verde, el remanente de bosque o el sector de riesgo hídrico aguas abajo?","¿Cuántas componentes tiene su proyecto, y cada una se entiende como un producto terminado y verificable sobre el predio, no como una intención?","Si alguien lee sólo la descripción general, ¿queda claro que el dominio es público y único, y con qué figura se ejecuta: concesión de uso, asociación público privada o financiamiento internacional?","El inventario describe 32 especies leñosas nativas, dos con categoría de conservación desfavorable, y 82 especies de aves: ¿aparece eso en su descripción o quedó afuera del relato?","¿La descripción explicita los supuestos que adoptaron sobre población, superficie y horizonte, o los deja implícitos donde nadie los pueda discutir después?"],"accI":["Zonificar el predio no es una acción de inversión sino un estudio que el escenario ya entregó: ¿cuáles de las acciones que listaron son en realidad tareas de la formulación?","¿Cómo van a enunciar la acción que incorpora vehículos, herramientas y perforación, si comprar no es una acción y corresponde escribir dotar al proyecto de esos bienes?","Cerrar el perímetro de la superficie que eligieron exige miles de metros de alambrado: ¿qué tareas cuelgan de esa acción y quién sostiene el cierre frente al pastoreo y la extracción de leña?","¿Cada acción de inversión que escribieron deriva en una componente redactada en participio, o quedaron acciones sueltas sin un producto que se pueda mostrar terminado?","¿Qué acción de la inversión responde al riesgo de que el escurrimiento aumente al consolidar senderos, accesos y superficies, y por qué no puede quedar postergada para la operación?"],"accO":["¿Qué se hace todos los años en su proyecto, atender visitantes, regar y reponer plantas, limpiar las obras hidráulicas, vigilar y monitorear, y cuántas acciones distintas son en rigor?","La quema de pastizales concentra el riesgo de fuego en la primavera: ¿esa estacionalidad les cambia la acción o solamente la periodicidad con que se ejecuta cada año?","¿Todo bien de capital que usan sus acciones de operación entró antes por una acción de la inversión, o hay equipos que aparecen de la nada en la etapa operativa?","Con la red de agua interrumpida en el borde consolidado y la competencia por el agua entre los reparos de la población, ¿de dónde saca su operación el agua que consume?","¿Alguna de sus acciones de operación se ejecuta una sola vez, y si es así, no debería estar en la etapa de inversión?"],"descA":["De las acciones que listaron, ¿cuál eligen para describir con los nueve descriptores, y por qué esa es la que mejor muestra el conflicto central del predio?","En el descriptor de resultado, ¿qué van a poder mostrar terminado: metros de zanja, hectáreas plantadas, metros cúbicos de retención o agentes capacitados y certificados?","¿Qué duración le asignan a esa acción, y qué la condiciona: la ventana seca de mayo a octubre, la disponibilidad de contratista o la temporada de plantación?","¿Quiénes son los responsables, el municipio, la provincia como titular del dominio fiscal, una contratista o un operador concesionado, y con qué instrumento se los ata al resultado?","¿Qué indicador propusieron para verificar esa acción, y se puede medir con lo que el proyecto realmente va a tener en el terreno?","Los recursos que declaran para esa acción, ¿alcanzan para todas las tareas que listaron, o hay tareas escritas sin ningún recurso asignado detrás?"],"sec":["¿Qué acción no puede empezar antes de que el sector esté cercado y saneado, y por qué el cierre perimetral termina siendo predecesora de casi todo lo demás?","¿La implantación de nativas depende de las obras de regulación del escurrimiento, o pueden ir en paralelo si se ejecutan sobre laderas distintas del predio?","¿Hay alguna acción sin predecesoras en su lista, y si hay más de una, arrancan todas juntas el primer mes de la inversión?","La capacitación del personal, ¿va antes o después de incorporar los bienes de capital que ese mismo personal tiene que aprender a operar?","¿Qué acción de operación no puede arrancar hasta que la última acción de inversión esté terminada, y cuál sí podría solaparse con el final de la obra?"],"tiempo":["¿Cuántos meses dura la inversión completa en su formulación, y qué acción manda el camino crítico, el cercado, la obra hidráulica o la implantación de la cubierta vegetal?","¿Su horizonte de operación es de cinco, diez o veinte años, y qué justifica ese número en un proyecto que interviene sobre bosque nativo joven?","Las acciones recurrentes, ¿tienen todas la misma periodicidad anual, o cada una cae en una ventana distinta según la lluvia, la plantación y el riesgo de incendio?","Si la ventana seca de mayo a octubre condiciona el movimiento de suelo, ¿cuántos meses de obra efectiva quedan por año y cuánto estira eso la etapa de inversión?","¿En qué unidad miden cada etapa, y por qué la inversión se expresa en meses mientras la operación se expresa en años?"],"gantt":["Si dibujan la inversión mes a mes, ¿el cronograma cierra dentro del plazo que declararon, o hay acciones superpuestas para las que los recursos no alcanzan?","¿El Gantt de operación muestra barras continuas a lo largo de todo el horizonte, o dibuja cada acción una sola vez como si fuera obra?","¿Qué mes del cronograma habilita el ingreso del público al predio, y qué tiene que estar efectivamente terminado para poder abrir ese mes?","Si un frente de ocupación informal avanza mientras dura la obra, ¿el cronograma tiene margen, o cualquier atraso deja el predio abierto y sin control por más tiempo?","¿Se ve en el Gantt la estacionalidad de la plantación entre septiembre y marzo, o quedó dibujada como una barra pareja de doce meses iguales?"],"recI":["Para cerrar el perímetro, ¿cuántos postes, cuántos rollos de alambre y cuántos jornales necesitan, y con qué criterio estimaron esas cantidades a nivel de idea o perfil?","¿Qué unidad de medida usan para el equipo pesado, hora de uso, día de alquiler o global, y por qué esa unidad es la que se puede verificar después?","Retirar los microbasurales perimetrales, ¿qué recursos exige, y adónde va ese material si el predio no cuenta con sitio de disposición final propio?","¿Cada tarea de su EDT de inversión tiene al menos un recurso con unidad y cantidad, o hay tareas escritas sin nada material detrás?","La perforación, el tanque y la red de riego, ¿están cargados como recursos de la etapa de inversión, o se les colaron dentro de la operación?"],"recO":["El combustible del tractor es gasto operativo, pero el tractor ya entró por la inversión: ¿cómo escriben esa línea sin contabilizar dos veces el mismo bien de capital?","¿Cuántos jornales por año necesitan para portería, limpieza, guiado y vigilancia, y de dónde sale ese número si suponen apertura todos los días del año?","El mantenimiento de cortafuegos y la limpieza de las obras de retención, ¿se hacen con equipo propio o contratado, y eso cambia si son gasto o capital ya incorporado?","Si el agua sale de perforación propia y no de la red interrumpida, ¿qué recursos anuales tiene ese servicio, energía, mantenimiento y análisis, y cuántos metros cúbicos consumen?","¿El monitoreo de caudales, de aves y de regeneración leñosa aparece con recursos concretos, muestras, jornales y honorarios, o quedó como una intención sin costo asociado?"]},"dato":{"apertura":"La zonificación reparte el catastro N° 133.745 en 289,8 hectáreas de conservación, 324,0 urbanizables con restricciones y 215,3 con cambio de uso; es un insumo, no una decisión.","dim":"El sector no dispone de espacios verdes públicos: sólo una plaza reducida y en pendiente y una escuela con patio insuficiente.","loc":"El predio suma unas 847 hectáreas sobre la RN 9, a 6 km del centro, con pendientes superiores al 30 % en la mitad alta.","flu":"Sobre el predio se registran extracción de leña y áridos, pastoreo, quema de pastizales y microbasurales perimetrales activos.","desc":"El inventario forestal describe un bosque joven con 32 especies leñosas nativas, dos con conservación desfavorable, más 82 especies de aves y 6 de mamíferos.","accI":"Diseñar, zonificar, seleccionar el sitio y dimensionar son acciones de la formulación; la inversión materializa en el terreno lo que esos estudios ya definieron.","accO":"La red de agua se interrumpe en el límite del área consolidada y las cotas superiores se abastecen por camión cisterna.","descA":"Se formula a nivel de idea o perfil: no hay precisión, se adoptan supuestos y se los declara por escrito.","sec":"Todo bien de capital que usa la operación tiene que haber entrado antes por una acción de la etapa de inversión.","tiempo":"La inversión suele medirse en meses y la operación en años; la ventana seca del sector va de mayo a octubre.","gantt":"El escurrimiento descarga por las alcantarillas del corredor vial, único punto de salida, sobre un cauce revestido sin capacidad ociosa.","recI":"Comprar no es una acción sino una tarea administrativa: se escribe dotar al proyecto de los bienes que la operación va a usar.","recO":"Entre los reparos de la población consultada figuran la pérdida de áreas verdes, el aumento del escurrimiento y la competencia por el agua."}},"10":{"titulo":"Residuos porcinos en el Valle de Lerma","foco":"El caso obliga a formular un solo sistema para tres corrientes acopladas —purines, sólidos y biogás— sobre datos que el propio escenario admite que nadie mide, y sin detener la producción.","preguntas":{"apertura":["La actividad que traen del F01, ¿nombra las tres corrientes —líquida, sólida y gaseosa— o se quedaron con una sola y dejaron afuera el metano que hoy se pierde?","¿La componente que escribieron está en participio y describe lo que el establecimiento queda teniendo, o todavía dice comprar un biodigestor como acto administrativo?","Antes de avanzar, ¿el titular del establecimiento porcino es el que formula y financia este proyecto, o están escribiendo desde la autoridad que puso las observaciones en el expediente?","Si tuvieran que decir en una sola oración qué queda distinto en el predio de 120 hectáreas cuando el proyecto termine, ¿qué dirían, y eso coincide con la componente del F01?","¿El alcance que eligieron cubre todo el efluente del establecimiento o sólo una fracción, sabiendo que la observación de la autoridad recae sobre el establecimiento completo?"],"dim":["Si el consumo es de 18 litros por animal y por día, ¿qué plantel van a suponer para sostener 160 capones por semana, y cómo lo justifican?","La primera evidencia dice que nadie cuantifica el volumen de efluente: ¿con qué supuesto declarado van a fijar los metros cúbicos diarios que entran al sistema, y quién podría discutirlo?","¿Van a sumar el agua de lavado al caudal de diseño, y en qué porcentaje, o van a dimensionar sólo con los purines de bajo piso enrejillado?","La playa de compostaje tiene 1.080 m² y trabaja al 30 %: ¿esa capacidad ociosa fija el techo de la fracción sólida que pueden tratar, o hay que ampliarla?","¿A quiénes van a declarar como beneficiarios: sólo a los trece trabajadores, o también al vecindario que hoy percibe el olor a amoníaco y sulfuro de hidrógeno?"],"loc":["La macrolocalización ya está dada por el establecimiento existente en Rosario de Lerma: ¿qué queda entonces por decidir en la microlocalización dentro de las 120 hectáreas del predio?","¿Dónde ubican el vaso del tratamiento respecto de las naves, de la perforación propia y de los pozos donde detectaron coliformes por encima de los valores admisibles?","Sin cartografía provincial de acuíferos someros ni registro de pozos vecinos, ¿qué factor de localización van a adoptar como supuesto y cómo lo dejan escrito en el formulario?","¿La dirección del viento hacia el vecindario disperso pesa más que la distancia de bombeo desde las fosas al elegir el sitio de las piletas?","¿Qué superficie del predio reservan para la aplicación agronómica del efluente tratado, y ese lote está aguas abajo o aguas arriba de los pozos de monitoreo?"],"flu":["En el flujograma de inversión, ¿la reparación del talud roto y de las fosas va antes o después de excavar el vaso nuevo, y por qué?","¿Cuál es el primer paso del flujograma de operación: la colección del purín bajo el piso enrejillado, o la separación sólido-líquido que define lo que entra a cada corriente?","Si las tres corrientes están acopladas, ¿el flujograma de operación
