se dibuja como una sola línea o se abre en ramas que después vuelven a juntarse en el campo?","¿En qué paso del flujograma aparece el biogás, y qué pasa con ese gas los días en que la caldera de calefacción no lo consume?","¿Dónde termina el flujograma de la inversión y empieza el de la operación, si la adecuación se hace con los animales adentro y sin parar la producción?"],"desc":["En la descripción general, ¿cómo enuncian el propósito sin que quede como un trámite para levantar las observaciones del expediente de renovación del certificado de aptitud ambiental?","¿Cuántas componentes va a tener el proyecto y alcanzan para cubrir las tres corrientes, o hay alguna —la gaseosa, por ejemplo— que quedó sin producto propio?","¿La descripción menciona que el establecimiento compra gas mientras libera metano, o eso queda escondido y el lector no entiende de dónde sale el beneficio?","Si alguien ajeno al equipo lee sólo esta descripción, ¿entiende que se trata de un establecimiento en marcha con trece empleados y no de una planta nueva?","¿Qué características del proyecto declaran como supuestos —plantel, caudal, superficie de aplicación— y cuáles presentan como datos verificados del escenario?"],"accI":["¿Cómo enuncian la incorporación del separador sólido-líquido sin escribir comprar, y qué componente en participio queda cuando esa acción termina?","La reparación del talud roto y de las fosas, ¿es una acción propia o una tarea dentro de otra acción, y qué cambia eso al secuenciar y asignar recursos?","¿El acondicionamiento de la playa de compostaje existente entra como acción de inversión, aunque la playa ya está construida y sólo trabaja al 30 % de su capacidad?","¿Dejaron alguna acción de inversión que en realidad pertenece a la formulación, como caracterizar el purín, estudiar la freática o elegir la tecnología de tratamiento?","Si la operación va a usar una caldera a biogás y un volteador de pilas, ¿por qué acción de la inversión entran esos bienes al proyecto?","¿Cuántas tareas por acción les alcanzan para que otro equipo pueda ejecutarlas, sin que la lista se vuelva un instructivo de obra de treinta renglones?"],"accO":["¿Qué acción operativa se hace cargo de la mortandad y las placentas, hoy mezcladas con el resto de los sólidos, y con qué frecuencia se ejecuta?","La aplicación agronómica del efluente tratado, ¿es una acción de operación del proyecto o una práctica agrícola que ya hace el establecimiento por su cuenta?","¿Incluyeron una acción de monitoreo del efluente y de la freática, sabiendo que hoy no se analiza la composición de manera sistemática y los pozos dieron coliformes?","¿Cada acción de operación se apoya en un bien que entró por la inversión, y pueden decir por cuál acción de inversión entró cada uno?","El aprovechamiento térmico del biogás, ¿es una acción operativa propia o una tarea dentro de la digestión, y qué conviene para poder medirle indicadores?"],"descA":["¿Qué acción eligen para describir con los nueve descriptores: la que tiene más incertidumbre técnica o la que más plata inmoviliza en el predio?","En el descriptor de resultado, ¿qué queda cuando la acción termina: una obra construida y probada, o un volumen de purín ya tratado, que es resultado de la operación?","¿Qué indicador de verificación puede exigir la autoridad al cierre de esa acción: un ensayo de estanqueidad, un certificado de soldadura, un registro fotográfico por etapa?","¿Quién es responsable de esa acción: el titular, un contratista de obra civil, un instalador certificado, o el responsable ambiental que firma ante la autoridad?","Si la acción se ejecuta con trece personas trabajando y animales en las naves, ¿qué recaudo de bioseguridad entra en el descriptor de descripción?"],"sec":["¿La reparación de las fosas y del talud roto es predecesora de todo lo demás, o el biodigestor puede excavarse en paralelo sin riesgo de pérdida al terreno?","¿La capacitación del personal va al final de la inversión o antes de la puesta en marcha, y qué acciones tienen que estar cerradas para poder dictarla?","La red térmica que reemplaza el gas comprado, ¿puede montarse antes de que el biodigestor produzca biogás, o queda encadenada a esa acción?","En la operación, ¿las acciones arrancan una después de otra o casi juntas, si la separación alimenta el mismo día al biodigestor y a la playa de compostaje?","¿Alguna acción quedó sin predecesora y sin sucesora, y si es así tiene sentido que esté suelta o le falta un vínculo con las otras corrientes?"],"tiempo":["¿Cuántos meses le asignan a la obra del vaso y de la cubierta, con lluvias del Valle de Lerma y sin poder detener la producción?","¿El horizonte de operación se mide en años y el de inversión en meses, y qué número de años eligieron para este establecimiento en marcha?","La aplicación agronómica exige ventanas compatibles con el régimen de lluvias: ¿cuántas ventanas por año declaran y en qué estaciones caen?","¿Qué periodicidad le ponen al volteo de pilas, al muestreo de los pozos de monitoreo y a la purga de lodos, y por qué esa y no otra?","El arranque de un biodigestor no es instantáneo: ¿contemplaron un período de puesta en régimen antes de contar el primer año de operación plena?"],"gantt":["¿El Gantt de la inversión entra en doce meses, o la obra del biodigestor y el acondicionamiento de la playa tienen que solaparse para que cierre?","Si dos acciones se solapan, ¿el establecimiento tiene personal y frentes de obra para sostenerlas a la vez con trece empleados y animales en las naves?","¿En qué mes del cronograma queda la puesta en marcha, y coincide con una estación en la que la digestión anaeróbica no se enfríe demasiado?","¿El Gantt de la operación muestra los años del horizonte con las acciones continuas, o repite el detalle diario que ya está en las tareas?","Si la autoridad pide un plazo de cumplimiento en el expediente de renovación, ¿este cronograma es defendible ante ella o hay meses sin justificar?"],"recI":["¿Cuántos metros cuadrados de geomembrana necesitan para fondo, taludes y cubierta, y de dónde sale esa cifra si todavía no fijaron la geometría del vaso?","El vaciado de las fosas bajo el piso enrejillado, ¿se hace con camión atmosférico contratado por hora o con equipo propio, y cuántas horas estiman?","¿En qué unidad miden cada recurso —horas de uso, metros, metros cuadrados, cantidad, jornal— y esa unidad permite después ponerle un precio unitario?","¿Cargaron recursos a la capacitación del personal, o quedó como una acción sin insumos aunque exige un capacitador, materiales y horas de los trece trabajadores?","¿Alguna tarea de la inversión quedó sin ningún recurso asignado, y si es así, es una tarea real o un enunciado que sobra?"],"recO":["El biodigestor y el separador ya entraron por la inversión: ¿qué figura entonces en la operación, la compra otra vez o sólo el mantenimiento y los repuestos?","¿Cómo contabilizan el gas que hoy se compra para calefacción una vez que el biogás lo sustituye: menos gasto operativo, o un ingreso del proyecto?","¿Cuántos análisis de laboratorio por año presupuestan para el efluente y para los pozos de monitoreo propios donde aparecieron coliformes por encima de lo admisible?","El equipo que se usa apenas dos ventanas por año para regar el digerido, ¿lo incorporan como bien de capital en la inversión o lo contratan por hora?","¿Los trece empleados actuales alcanzan para operar la planta todos los días, o el proyecto suma jornales que hay que cargar como gasto operativo?","¿Qué consumo de energía eléctrica y de combustible agrega la operación diaria, y de dónde sacan una cifra defendible a nivel de perfil?"]},"dato":{"apertura":"El escenario advierte que la gestión integral admite múltiples alternativas: no conviene cerrar el F02 sobre una sola tecnología de tratamiento.","dim":"El escenario informa 18 litros por animal y día y 160 capones semanales, pero no da el plantel ni el caudal de efluente.","loc":"No hay cartografía provincial de acuíferos someros ni regi var KEY = 'fepar2026_taller02';
var S = {esc:0, equipo:'', equipos:8, nombres:'', i:-1, resp:{}, hecho:{},
         sorteados:[], plan:null, left:0, endsAt:0, run:false, sono:false, ts:''};

function guardar(){
  S.ts = ahora();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}
function cargar(){
  try{
    var o = JSON.parse(localStorage.getItem(KEY) || 'null');
    if(o) Object.keys(S).forEach(function(k){ if(o[k] !== undefined) S[k] = o[k]; });
  }catch(e){}
  if(!Array.isArray(S.plan) || S.plan.length !== PASOS.length)
    S.plan = PASOS.map(function(p){ return p.min; });
  S.run = false;
}
function ahora(){
  var d = new Date(), z = function(n){ return (n<10?'0':'')+n; };
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes());
}
function min(i){ return (S.plan && S.plan[i] != null) ? S.plan[i] : PASOS[i].min; }
function total(){ return PASOS.reduce(function(a,_,i){ return a + min(i); }, 0); }
function escAct(){ return ESC[String(S.esc)] || null; }
function pregDe(k){
  var p = PREG[String(S.esc)];
  return (p && p.preguntas && p.preguntas[k]) ? p.preguntas[k] : [];
}
function datoDe(k){
  var p = PREG[String(S.esc)];
  return (p && p.dato && p.dato[k]) ? p.dato[k] : '';
}

/* =============================================================== DOM */
function E(tag, cls, html){ var e=document.createElement(tag); if(cls) e.className=cls;
  if(html!=null) e.innerHTML=html; return e; }
function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function txt(v){ return String(v==null?'':v).trim(); }
function id(x){ return document.getElementById(x); }
function btn(t, cls, fn){ var b=E('button','b '+(cls||''),t); b.type='button'; b.onclick=fn; return b; }
function aviso(m){ var t=id('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('on'); }, 2400); }

/* =============================================================== RELOJ */
function queda(){
  return S.run ? Math.max(0, Math.round((S.endsAt - Date.now())/1000)) : Math.max(0, S.left|0);
}
function mmss(s){ s=Math.max(0,s|0); var m=Math.floor(s/60), q=s%60; return m+':'+(q<10?'0':'')+q; }
function arrancar(){ S.endsAt = Date.now() + (S.left|0)*1000; S.run = true; S.sono = false; guardar(); reloj(); }
function pausar(){ if(!S.run) return; S.left = queda(); S.run = false; guardar(); reloj(); }
function alternar(){ S.run ? pausar() : arrancar(); }
function reiniciar(){ S.left = min(S.i)*60; S.run = false; S.sono = false; guardar(); reloj(); }
function sumar(seg){
  S.left = queda() + seg;
  if(S.run) S.endsAt = Date.now() + S.left*1000;
  S.sono = false; guardar(); reloj();
}
function reloj(){
  var esPaso = (S.i >= 0 && S.i < PASOS.length);
  document.body.dataset.vista = S.i < 0 ? 'portada' : (esPaso ? 'consigna' : 'cierre');
  if(!esPaso){ id('reloj').textContent = '—'; id('barra').style.width = '0%'; return; }
  var s = queda(), tot = min(S.i)*60;
  id('reloj').textContent = mmss(s);
  id('paso-n').textContent = (S.i+1) + ' / ' + PASOS.length;
  id('paso-t').textContent = PASOS[S.i].t;
  id('b-play').textContent = S.run ? '⏸ Pausar' : '▶ Arrancar';
  var st = s <= 0 ? 'fin' : (s <= 30 ? 'rojo' : (s <= 120 ? 'ambar' : ''));
  id('reloj').className = st;
  id('barra').className = st;
  id('barra').style.width = (tot > 0 ? Math.max(0, Math.min(1, s/tot))*100 : 0) + '%';
}
var AUD = null;
function pito(n){
  try{
    if(!AUD) AUD = new (window.AudioContext || window.webkitAudioContext)();
    if(AUD.state === 'suspended') AUD.resume();
    for(var k=0;k<(n||3);k++){
      var o=AUD.createOscillator(), g=AUD.createGain(), t0=AUD.currentTime + k*0.28;
      o.type='sine'; o.frequency.setValueAtTime(k===2?660:880, t0);
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.22,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.22);
      o.connect(g); g.connect(AUD.destination); o.start(t0); o.stop(t0+0.24);
    }
  }catch(e){}
}
setInterval(function(){
  if(S.i < 0 || S.i >= PASOS.length) return;
  if(S.run && queda() <= 0 && !S.sono){
    S.sono = true; pito(3); aviso('Se cumplió el tiempo de esta consigna.');
  }
  reloj();
}, 250);

}

}

  c1.appendChild(E('span','et','La consigna'));
  c1.appendChild(E('p','consigna', p.consigna));
  var bx = E('div','box ok'); bx.style.marginTop='14px';
  bx.appendChild(E('span','et','Cómo saben que está lograda'));
  bx.appendChild(E('p','sub', esc(p.criterio)));
  c1.appendChild(bx);
  izq.appendChild(c1);

  var c2 = E('div','card cel'); c2.style.marginTop='14px';
  c2.appendChild(E('div','tag'));
  c2.appendChild(E('span','et','La respuesta del equipo'));
  c2.appendChild(E('p','tiny','Pueden escribirla acá o dejarla vacía si la están trabajando en Word, en Excel o en papel. Lo que escriban se guarda solo y sale en el documento final.'));
  var ta = E('textarea','resp');
  ta.value = S.resp[p.k] || '';
  ta.placeholder = p.ph;
  var cu = E('div','cuenta');
  function cuenta(){
    var n = ta.value.trim().length;
    cu.textContent = n ? (n + ' caracteres') : 'sin escribir';
  }
  ta.addEventListener('input', function(){ S.resp[p.k] = ta.value; cuenta(); guardar(); });
  cuenta();
  c2.appendChild(ta);
  c2.appendChild(cu);
  izq.appendChild(c2);
  cols.appendChild(izq);

  /* ---- derecha: preguntas orientadoras ---- */
  var der = E('div');
  var c3 = E('div','card oro');
  c3.appendChild(E('div','tag'));
  c3.appendChild(E('span','et','Para pensar en el grupo'));
  c3.appendChild(E('h3',null,'Preguntas orientadoras'));
  if(e) c3.appendChild(E('p','tiny','Escenario ' + S.esc + ' · ' + esc(e.t)));
  var qs = pregDe(p.k);
  if(qs.length){
    var ol = E('ol','preg');
    qs.forEach(function(q){ ol.appendChild(E('li',null, esc(q))); });
    c3.appendChild(ol);
  } else {
    c3.appendChild(E('p','sub','Elijan el escenario en la portada para ver las preguntas de su caso.'));

  var dt = datoDe(p.k);
  if(dt){
    var c4 = E('div','card vio'); c4.style.marginTop='14px';
    c4.appendChild(E('div','tag'));
    c4.appendChild(E('span','et','Dato del caso'));
    c4.appendChild(E('p','sub', esc(dt)));
    der.appendChild(c4);
  }

  var c5 = E('div','card coral'); c5.style.marginTop='14px';
  c5.appendChild(E('div','tag'));
  c5.appendChild(E('span','et','Puesta en común'));
  c5.appendChild(E('p','sub','Si el docente lo indica, se sortea un equipo para que comparta lo que resolvió en esta consigna.'));
  var bs = btn('🎲 Sortear un equipo','', function(){ sortear(1); });
  bs.style.marginTop='10px';
  c5.appendChild(bs);
  der.appendChild(c5);
  cols.appendChild(der);
  w.appendChild(cols);

  /* ---- pie: navegación por pasos ---- */
  var pie = E('div'); pie.style.marginTop='22px';
  var nav = E('div','wrapb'); nav.style.justifyContent='flex-start';
  if(S.i > 0) nav.appendChild(btn('◀ Consigna anterior','', anterior));
  nav.appendChild(btn(S.i === PASOS.length-1 ? 'Terminar el taller ▶' : 'Consigna siguiente ▶','pri gr', siguiente));
  nav.appendChild(btn('Volver a la portada','', function(){ ir(-1); }));
  pie.appendChild(nav);

  var ps = E('div','pasos');
  PASOS.forEach(function(x, i){
    var b = E('button','pb'+(i===S.i?' on':'')+(txt(S.resp[x.k])?' hecho':''), String(i+1));
    b.type='button'; b.title = x.t;
    b.onclick = function(){ ir(i); };
    ps.appendChild(b);
  });
  pie.appendChild(ps);
  w.appendChild(pie);
}

/* =============================================================== CIERRE */

  var w = id('wrap'); w.innerHTML = '';
  var e = escAct();
  var cab = E('div');
  cab.appendChild(E('span','eyebrow','Taller 02 · cierre'));
  cab.appendChild(E('h1',null,'Terminamos el taller'));
  var n = PASOS.filter(function(p){ return txt(S.resp[p.k]); }).length;
  cab.appendChild(E('p','consigna','Respondieron <strong>' + n + ' de las ' + PASOS.length +
    ' consignas</strong>. Descarguen el documento: es el borrador del Formulario 02 con todo lo que escribieron.'));
  w.appendChild(cab);

  var cols = E('div','cols'); cols.style.marginTop='18px';
  var izq = E('div','card');
  izq.appendChild(E('div','tag'));
  izq.appendChild(E('h3',null,'Lo que quedó escrito'));
  var l = E('div'); l.style.marginTop='10px';
  PASOS.forEach(function(p, i){
    var r = E('div'); r.style.display='flex'; r.style.gap='9px'; r.style.alignItems='baseline';
    r.style.padding='6px 0'; r.style.borderBottom='1px solid var(--line)';
    var hay = txt(S.resp[p.k]);
    var mk = E('span','tiny', hay ? '✔' : '—');
    mk.style.width='16px'; mk.style.flex='none';
    mk.style.color = hay ? 'var(--verde-l)' : 'var(--tx3)';
    var t = E('span','sub', (i+1) + ' · ' + esc(p.t)); t.style.flex='1';
    var c = E('span','tiny', hay ? (hay.length + ' car.') : 'sin escribir'); c.style.flex='none';
    r.appendChild(mk); r.appendChild(t); r.appendChild(c);
    var b = E('button','b'); b.textContent='ver'; b.style.padding='3px 9px'; b.style.fontSize='11.5px';
    b.onclick = function(){ ir(i); };
    r.appendChild(b);
    l.appendChild(r);
  });
  izq.appendChild(l);
  cols.appendChild(izq);

  var der = E('div');
  var c1 = E('div','card oro');
  c1.appendChild(E('div','tag'));
  c1.appendChild(E('h3',null,'Llevarse el trabajo'));
  var wb = E('div','wrapb'); wb.style.justifyContent='flex-start'; wb.style.marginTop='12px';
  wb.appendChild(btn('⬇ Documento del Formulario 02','pri gr', expWord));
  wb.appendChild(btn('💾 Archivo de avance', '', expJSON));
  wb.appendChild(btn('🖨 Imprimir o PDF','', function(){ window.print(); }));
  c1.appendChild(wb);
  c1.appendChild(E('p','tiny','El archivo de avance sirve para seguir en otra computadora: se carga desde la portada.'));
  der.appendChild(c1);

  var c2 = E('div','card vio'); c2.style.marginTop='14px';
  c2.appendChild(E('div','tag'));
  c2.appendChild(E('h3',null,'Lo que sigue'));
  c2.appendChild(E('p','sub','Lo que quedó sin responder se completa fuera del taller. El Formulario 02 se entrega por Moodle junto con la planilla de cálculo con la información cuantitativa: acciones, secuenciación, Gantt y recursos.'));
  der.appendChild(c2);
  cols.appendChild(der);
  w.appendChild(cols);

  var pie = E('div','wrapb'); pie.style.justifyContent='flex-start'; pie.style.marginTop='20px';
  pie.appendChild(btn('◀ Volver a las consignas','', function(){ ir(PASOS.length-1); }));
  pie.appendChild(btn('Portada','', function(){ ir(-1); }));
  w.appendChild(pie);
}

/* =============================================================== SORTEO */
function equipos(){
  var nm = S.nombres ? S.nombres.split('\n').map(function(x){ return x.trim(); })
                                .filter(function(x){ return x; }) : [];
  var out = [];
  for(var i=0;i<S.equipos;i++) out.push(nm[i] || ('Equipo ' + (i+1)));
  return out;
}
function sortear(cuantos){
  cuantos = cuantos || 1;
  var eq = equipos();
  var libres = eq.filter(function(x){ return S.sorteados.indexOf(x) < 0; });
  if(libres.length < cuantos){ S.sorteados = []; libres = eq.slice(); }
  var v = id('sorteo-v'), s = id('sorteo-s'), b = id('sorteo-b');
  v.className = 'sorteo'; v.textContent = '—';
  s.textContent = 'Entre ' + libres.length + ' equipos que todavía no compartieron…';
  b.innerHTML = '';
  id('ov-sorteo').classList.add('on');
  var elegidos = [], pool = libres.slice();
  for(var k=0;k<cuantos;k++) elegidos.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  var c = 0;
  var iv = setInterval(function(){
    v.textContent = libres[Math.floor(Math.random()*libres.length)];
    if(++c >= 26){
      clearInterval(iv);
      v.textContent = elegidos.join('  ·  ');
      v.className = 'sorteo fin';
      S.sorteados = S.sorteados.concat(elegidos);
      guardar(); pito(2);
      s.textContent = 'Ya compartieron ' + S.sorteados.length + ' de ' + eq.length + ' equipos.';
      b.appendChild(btn('Cerrar','pri', function(){ id('ov-sorteo').classList.remove('on'); }));
      b.appendChild(btn('🎲 Sortear otro','', function(){ sortear(1); }));
      b.appendChild(btn('Reiniciar la lista','', function(){
        S.sorteados = []; guardar(); aviso('Vuelven a entrar todos los equipos en el sorteo.');
        id('ov-sorteo').classList.remove('on'); }));
    }
  }, 70);
}

/* =============================================================== SALIDAS */
function bajar(nombre, mime, contenido){
  var b = new Blob([contenido], {type:mime}), u = URL.createObjectURL(b);
  var a = document.createElement('a'); a.href=u; a.download=nombre;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); }, 400);
}
function slug(t){
  return String(t||'equipo').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40) || 'equipo';
}
function nl2br(t){ return esc(t).replace(/\n/g,'<br>'); }
function expWord(){
  var e = escAct();
  var css = 'body{font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#111;line-height:1.45}'+
    'h1{font-size:19pt;color:#0e5c3a;margin:0 0 4pt}'+
    'h2{font-size:13pt;color:#0e5c3a;margin:16pt 0 3pt;border-bottom:1px solid #cfd8d4;padding-bottom:3pt}'+
    '.c{font-style:italic;color:#4a5c55;margin:2pt 0 6pt}'+
    '.r{border-left:2px solid #cfd8d4;padding-left:9pt;white-space:pre-wrap}'+
    '.q{font-size:9.5pt;color:#5a6b64;margin-top:6pt}';
  var h = '<h1>Formulario 02 · FEPAR 2026</h1>'+
    '<p><strong>Equipo:</strong> ' + esc(S.equipo || 'sin nombre') + '<br>'+
    (e ? '<strong>Escenario ' + S.esc + ':</strong> ' + esc(e.t) + '<br>' : '')+
    '<span style="font-size:9pt;color:#5a6b64">Borrador armado en el Taller 02 el ' + ahora() + '</span></p>';
  PASOS.forEach(function(p, i){
    h += '<h2>' + (i+1) + ' · ' + esc(p.t) + ' <span style="font-size:9pt;font-weight:normal">(' + esc(p.item) + ')</span></h2>';
    h += '<p class="c">' + p.consigna.replace(/<\/?strong>/g,'') + '</p>';
    var r = txt(S.resp[p.k]);
    h += '<div class="r">' + (r ? nl2br(r) : '<em style="color:#8a9a94">— sin completar en el taller —</em>') + '</div>';
    var qs = pregDe(p.k);
    if(qs.length) h += '<p class="q"><strong>Preguntas orientadoras:</strong> ' +
      qs.map(function(q){ return esc(q); }).join(' ') + '</p>';
  });
  var doc = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'+
    '<head><meta charset="utf-8"><title>Formulario 02 · FEPAR 2026</title>'+
    '<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View></w:WordDocument></xml><![endif]-->'+
    '<style>@page{size:A4;margin:2cm}' + css + '</style></head><body>' + h + '</body></html>';
  bajar('F02_taller_' + slug(S.equipo) + '.doc', 'application/msword', '\ufeff' + doc);
  aviso('Documento descargado.');
}
function expJSON(){
  guardar();
  bajar('avance_taller02_' + slug(S.equipo) + '.json', 'application/json', JSON.stringify(S, null, 1));
  aviso('Archivo de avance descargado.');
}

/* =============================================================== PINTAR */
function pinta(){
  if(S.i < 0) portada();
  else if(S.i >= PASOS.length) cierre();
  else consigna();
}

/* =============================================================== EVENTOS */
id('b-play').onclick  = alternar;
id('b-mas').onclick   = function(){ sumar(120); };
id('b-reset').onclick = reiniciar;
id('b-dado').onclick  = function(){ sortear(1); };
id('b-ant').onclick   = anterior;
id('b-sig').onclick   = siguiente;
id('b-tema').onclick  = function(){
  var r = document.documentElement;
  r.dataset.theme = r.dataset.theme === 'light' ? 'dark' : 'light';
  try{ localStorage.setItem('fepar2026_taller02_tema', r.dataset.theme); }catch(e){}
};
id('ov-sorteo').addEventListener('mousedown', function(ev){
  if(ev.target === this) this.classList.remove('on');
});
document.addEventListener('keydown', function(ev){
  var t = ev.target.tagName;
  if(t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
  if(ev.key === 'Escape'){ id('ov-sorteo').classList.remove('on'); return; }
  if(id('ov-sorteo').classList.contains('on')) return;
  if(S.i < 0 || S.i >= PASOS.length) return;
  if(ev.key === ' '){ ev.preventDefault(); alternar(); }
  else if(ev.key === 'ArrowRight'){ ev.preventDefault(); siguiente(); }
  else if(ev.key === 'ArrowLeft'){ ev.preventDefault(); anterior(); }
});
id('arch').addEventListener('change', function(ev){
  var f = ev.target.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var o = JSON.parse(rd.result);
      if(o && o.resp){
        Object.keys(S).forEach(function(k){ if(o[k] !== undefined) S[k] = o[k]; });
        S.run = false;
        if(!Array.isArray(S.plan) || S.plan.length !== PASOS.length)
          S.plan = PASOS.map(function(p){ return p.min; });
        guardar(); pinta(); reloj();
        aviso('Avance cargado' + (o.ts ? ' · guardado el ' + o.ts : '') + '.');
      } else aviso('Ese archivo no parece un avance del taller.');
    }catch(e){ aviso('No se pudo leer ese archivo.'); }
  };
  rd.readAsText(f);
  ev.target.value = '';
});

/* =============================================================== ARRANQUE */
(function(){
  try{
    var tm = localStorage.getItem('fepar2026_taller02_tema');
    if(tm) document.documentElement.dataset.theme = tm;
  }catch(e){}
  cargar();
  if(S.i >= 0 && S.i < PASOS.length) S.left = min(S.i) * 60;
  pinta(); reloj();
})();
</script>
