<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FEPAR 2026 · Taller 03 — Formulario 03 paso a paso</title>
<meta name="description" content="Visor del Taller 03 de FEPAR 2026: la Guía 03 explicada paso a paso, los seis escenarios resueltos, calculadora de flujo de fondos con VAN, TIR, RBC y VAC, cronómetro y sorteo de equipos.">
<style>
:root{
  --bg:#06110d; --bg2:#0a1a14; --panel:#0e2019; --panel2:#0b1a15;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.20);
  --tx:#eaf5f0; --tx2:#b9cfc6; --tx3:#7f9a90;
  --verde:#00a05a; --verde-l:#22c97f; --aqua:#12b5a0; --celeste:#39b6d8;
  --oro:#eda100; --violeta:#7b6bd6; --coral:#ef6a4b; --bad:#ef5350;
  --ff:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fm:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --r:16px; --r-s:12px; --head:66px;
}
html[data-theme="light"]{
  --bg:#f2f6f4; --bg2:#e8efec; --panel:#fff; --panel2:#f7faf9;
  --line:rgba(16,36,29,.13); --line2:rgba(16,36,29,.26);
  --tx:#10241d; --tx2:#3c554c; --tx3:#668076;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ff);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(1100px 700px at 10% -8%, rgba(0,160,90,.15), transparent 60%),
             radial-gradient(900px 560px at 95% 4%, rgba(237,161,0,.09), transparent 60%)}
html[data-theme="light"] body::before{background:radial-gradient(1100px 700px at 10% -8%, rgba(0,160,90,.09), transparent 60%)}
*{scrollbar-width:thin;scrollbar-color:rgba(0,192,106,.65) transparent}
*::-webkit-scrollbar{width:11px;height:11px}
*::-webkit-scrollbar-thumb{background:rgba(0,192,106,.65);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-track{background:transparent}

/* ============ ENCABEZADO FIJO ============ */
#head{position:fixed;top:0;left:0;right:0;height:var(--head);z-index:40;display:flex;
  align-items:center;gap:10px;padding:0 clamp(12px,2.2vw,26px);
  background:linear-gradient(180deg,var(--panel),var(--panel2));border-bottom:1px solid var(--line2)}
#head .marca{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--verde-l);
  font-weight:800;flex:none;line-height:1.2}
#head .marca small{display:block;font-size:10px;letter-spacing:.08em;color:var(--tx3);
  text-transform:none;font-weight:600}
#paso-n{flex:none;font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums;
  border:1px solid var(--line2);border-radius:8px;padding:4px 9px;font-weight:700}
#paso-t{flex:1;min-width:60px;font-size:14.5px;font-weight:700;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
#reloj{flex:none;font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--verde-l);
  font-variant-numeric:tabular-nums;min-width:88px;text-align:right;line-height:1}
#reloj.ambar{color:var(--oro)} #reloj.rojo{color:var(--coral)}
#reloj.fin{color:var(--bad);animation:pulso 1s ease-in-out infinite}
@keyframes pulso{0%,100%{opacity:1}50%{opacity:.3}}
#barra{position:absolute;left:0;bottom:0;height:3px;background:var(--verde);width:100%;transition:width .3s linear}
#barra.ambar{background:var(--oro)} #barra.rojo{background:var(--coral)} #barra.fin{background:var(--bad)}

.b{border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--tx2);
  border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:var(--ff);
  font-weight:600;transition:.16s;white-space:nowrap;flex:none}
.b:hover{color:var(--tx);border-color:var(--verde);background:rgba(0,160,90,.14)}
.b.pri{background:var(--verde);border-color:var(--verde);color:#04150e;font-weight:700}
.b.pri:hover{background:var(--verde-l);color:#04150e}
.b.gr{font-size:15px;padding:11px 20px}
.b.xs{font-size:11.5px;padding:3px 9px;border-radius:8px}
.b:disabled{opacity:.35;cursor:not-allowed}
html[data-theme="light"] .b{background:rgba(255,255,255,.9)}

/* ============ CUERPO ============ */
#main{position:fixed;top:var(--head);left:0;right:0;bottom:0;z-index:1;overflow:auto;
  padding:clamp(16px,2.4vw,30px) clamp(14px,3vw,44px) 60px}
.wrap{max-width:1580px;margin:0 auto}
.cols{display:grid;grid-template-columns:1.32fr 1fr;gap:clamp(14px,1.8vw,26px);align-items:start}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
/* sin esto una tabla ancha estira su columna y empuja la otra fuera de la pantalla */
.cols>*,.cols3>*{min-width:0}
.card{min-width:0}
.card{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:var(--r);padding:clamp(15px,1.5vw,24px);position:relative;overflow:hidden}
.card>.tag{position:absolute;top:0;left:0;width:100%;height:3px;background:var(--verde)}
.card.oro>.tag{background:var(--oro)} .card.vio>.tag{background:var(--violeta)}
.card.cel>.tag{background:var(--celeste)} .card.coral>.tag{background:var(--coral)}
.card.aq>.tag{background:var(--aqua)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--verde-l);font-weight:800}
.eyebrow.o{color:var(--oro)} .eyebrow.v{color:var(--violeta)} .eyebrow.c{color:var(--celeste)}
h1{font-size:clamp(25px,3.1vw,40px);line-height:1.08;letter-spacing:-.03em;margin:8px 0 0;font-weight:800}
h2{font-size:clamp(19px,2.1vw,27px);line-height:1.15;letter-spacing:-.02em;margin:0;font-weight:800}
h3{font-size:15.5px;margin:0;font-weight:750}
h4{font-size:13px;margin:0;font-weight:750;color:var(--tx2)}
p{margin:0}
.consigna{font-size:clamp(16px,1.35vw,20px);line-height:1.5;color:var(--tx);margin-top:12px}
.sub{font-size:14px;color:var(--tx2);line-height:1.55}
.tiny{font-size:12px;color:var(--tx3);line-height:1.5}
strong{font-weight:750;color:var(--tx)}
.hr{height:1px;background:var(--line);margin:14px 0}
.mt{margin-top:14px} .mt2{margin-top:22px}

/* preguntas orientadoras */
ol.preg{list-style:none;padding:0;margin:12px 0 0;counter-reset:p}
ol.preg li{counter-increment:p;position:relative;padding:9px 0 9px 34px;font-size:14.5px;
  line-height:1.5;color:var(--tx);border-bottom:1px solid var(--line)}
ol.preg li:last-child{border-bottom:none}
ol.preg li::before{content:counter(p);position:absolute;left:0;top:9px;width:23px;height:23px;
  border-radius:7px;background:rgba(237,161,0,.16);border:1px solid rgba(237,161,0,.5);
  color:var(--oro);font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* listas de la guía */
ul.gl{list-style:none;padding:0;margin:10px 0 0}
ul.gl li{position:relative;padding:6px 0 6px 20px;font-size:14px;line-height:1.55;color:var(--tx2);}
ul.gl li::before{content:"";position:absolute;left:3px;top:14px;width:6px;height:6px;border-radius:2px;background:var(--verde)}
ul.gl li b{color:var(--tx);font-weight:750}

.box{border:1px solid var(--line);border-radius:var(--r-s);padding:12px 14px;background:rgba(255,255,255,.04)}
.box.ok{border-color:rgba(0,192,106,.45);background:rgba(0,192,106,.09)}
.box.warn{border-color:rgba(237,161,0,.45);background:rgba(237,161,0,.09)}
.box.info{border-color:rgba(57,182,216,.45);background:rgba(57,182,216,.09)}
.box.mal{border-color:rgba(239,106,75,.45);background:rgba(239,106,75,.09)}
.et{display:inline-block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  font-weight:800;color:var(--tx3);margin-bottom:5px}

/* respuesta */
textarea.resp{width:100%;min-height:200px;background:rgba(255,255,255,.05);border:1px solid var(--line2);
  border-radius:12px;color:var(--tx);font-family:var(--ff);font-size:14.5px;padding:13px 15px;
  line-height:1.6;resize:vertical;margin-top:10px}
html[data-theme="light"] textarea.resp{background:#fff}
textarea.resp:focus{outline:none;border-color:var(--verde);background:rgba(0,160,90,.07);
  box-shadow:0 0 0 3px rgba(0,160,90,.14)}
.cuenta{font-size:11.5px;color:var(--tx3);text-align:right;margin-top:5px;font-variant-numeric:tabular-nums}

/* portada */
.escgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.esc{text-align:left;border:1px solid var(--line2);border-radius:14px;padding:14px 16px;
  background:rgba(255,255,255,.035);cursor:pointer;font-family:var(--ff);transition:.16s}
.esc:hover{border-color:var(--verde);background:rgba(0,160,90,.10);transform:translateY(-2px)}
.esc.on{border-color:var(--verde);background:rgba(0,160,90,.17);box-shadow:inset 0 3px 0 var(--verde)}
.esc .n{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--verde-l)}
.esc .t{display:block;font-size:15px;font-weight:700;margin-top:5px;line-height:1.3;color:var(--tx)}
.esc .l{display:block;font-size:11.5px;color:var(--tx3);margin-top:5px;line-height:1.35}
.esc .k{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;margin-top:8px;
  padding:2px 8px;border-radius:999px;text-transform:uppercase}
.esc .k.priv{background:rgba(0,192,106,.16);color:var(--verde-l);border:1px solid rgba(0,192,106,.4)}
.esc .k.pub{background:rgba(57,182,216,.16);color:var(--celeste);border:1px solid rgba(57,182,216,.4)}
.esc .k.mix{background:rgba(123,107,214,.18);color:var(--violeta);border:1px solid rgba(123,107,214,.45)}
label.fl{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);
  font-weight:800;margin-bottom:6px}
input.fi,select.fi{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:10px;
  color:var(--tx);font-family:var(--ff);font-size:14.5px;padding:10px 13px}
html[data-theme="light"] input.fi,html[data-theme="light"] select.fi{background:#fff}
input.fi:focus,select.fi:focus{outline:none;border-color:var(--verde)}
input.fi.num{text-align:right;font-variant-numeric:tabular-nums}

/* progreso de pasos */
.pasos{display:flex;gap:5px;flex-wrap:wrap;margin-top:14px}
.pb{width:30px;height:30px;border-radius:9px;border:1px solid var(--line2);background:transparent;
  color:var(--tx3);font-size:12px;font-weight:700;cursor:pointer;font-family:var(--ff);
  transition:.14s;position:relative;padding:0}
.pb:hover{border-color:var(--verde);color:var(--verde-l)}
.pb.on{background:var(--verde);border-color:var(--verde);color:#04150e}
.pb.hecho::after{content:"";position:absolute;right:3px;bottom:3px;width:6px;height:6px;
  border-radius:50%;background:var(--verde-l)}
.pb.on.hecho::after{background:#04150e}

/* ============ TABLAS ============ */
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r-s);margin-top:12px;max-height:60vh}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{position:sticky;top:0;z-index:2;background:var(--panel);text-align:left;
  font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);font-weight:800;
  padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.t td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--tx2);line-height:1.45}
table.t tr:last-child td{border-bottom:none}
table.t tr:hover td{background:rgba(255,255,255,.035)}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t td.b{color:var(--tx);font-weight:700}
table.t tr.tot td{background:rgba(0,160,90,.12);color:var(--tx);font-weight:750;border-top:1px solid rgba(0,192,106,.4)}
table.t tr.sub td{background:rgba(255,255,255,.05);color:var(--tx);font-weight:700}
table.t td.neg{color:var(--coral)} table.t td.pos{color:var(--verde-l)}
table.t input.ci{width:100%;background:transparent;border:1px solid transparent;border-radius:7px;
  color:var(--tx);font-family:var(--ff);font-size:13px;padding:3px 6px}
table.t input.ci:hover{border-color:var(--line2)}
table.t input.ci:focus{outline:none;border-color:var(--verde);background:rgba(0,160,90,.09)}
table.t input.ci.num{text-align:right;font-variant-numeric:tabular-nums}
table.t select.ci{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:7px;
  color:var(--tx2);font-family:var(--ff);font-size:12px;padding:3px 5px;max-width:100%}
html[data-theme="light"] table.t select.ci{background:#fff}
/* matriz del flujo de fondos: la primera columna queda fija al desplazar los períodos */
table.t.mx{table-layout:fixed;min-width:100%;width:auto}
table.t.mx th:first-child,table.t.mx td:first-child{position:sticky;left:0;z-index:1;
  width:262px;min-width:262px;max-width:262px;background:var(--panel);
  box-shadow:1px 0 0 var(--line2);
  white-space:normal;overflow-wrap:anywhere;overflow:hidden;font-size:12.5px}
table.t.mx thead th:first-child{z-index:3}
table.t.mx tr:hover td:first-child{background:var(--panel2)}
table.t.mx tr.tot td:first-child,table.t.mx tr.sub td:first-child{background:#0d2a20}
html[data-theme="light"] table.t.mx tr.tot td:first-child,
html[data-theme="light"] table.t.mx tr.sub td:first-child{background:#e7f2ec}
table.t.mx th:not(:first-child),table.t.mx td:not(:first-child){width:92px;min-width:92px}
.chip{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;padding:2px 7px;
  border-radius:999px;text-transform:uppercase;white-space:nowrap}
.chip.dep{background:rgba(0,192,106,.15);color:var(--verde-l)}
.chip.nod{background:rgba(18,181,160,.16);color:var(--aqua)}
.chip.nom{background:rgba(123,107,214,.18);color:var(--violeta)}
.chip.cir{background:rgba(237,161,0,.16);color:var(--oro)}
.chip.fun{background:rgba(0,192,106,.15);color:var(--verde-l)}
.chip.man{background:rgba(57,182,216,.16);color:var(--celeste)}
.chip.com{background:rgba(239,106,75,.16);color:var(--coral)}

/* ============ INDICADORES ============ */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-top:14px}
.kpi{border:1px solid var(--line2);border-radius:var(--r-s);padding:12px 14px;background:rgba(255,255,255,.04)}
.kpi .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);font-weight:800}
.kpi .v{font-size:23px;font-weight:800;letter-spacing:-.02em;margin-top:4px;
  font-variant-numeric:tabular-nums;line-height:1.1;word-break:break-all}
.kpi .d{font-size:11.5px;color:var(--tx3);margin-top:3px;line-height:1.35}
.kpi.ok{border-color:rgba(0,192,106,.5);background:rgba(0,192,106,.1)} .kpi.ok .v{color:var(--verde-l)}
.kpi.no{border-color:rgba(239,106,75,.45);background:rgba(239,106,75,.09)} .kpi.no .v{color:var(--coral)}
.kpi.neu .v{color:var(--celeste)}
.kpi.off{opacity:.42} .kpi.off .v{font-size:17px;color:var(--tx3)}

/* ============ GRÁFICOS ============ */
.graf{width:100%;height:auto;display:block;margin-top:10px;border-radius:var(--r-s);
  background:rgba(255,255,255,.03);border:1px solid var(--line)}
.graf.torta{max-width:540px}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.leg span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--tx3)}
.leg i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* ============ PESTAÑAS ============ */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{border:1px solid var(--line2);background:transparent;color:var(--tx3);border-radius:999px;
  padding:5px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--ff);transition:.14s}
.tab:hover{color:var(--tx2);border-color:var(--verde)}
.tab.on{background:var(--verde);border-color:var(--verde);color:#04150e}

/* ============ PLEGABLE ============ */
details.pl{border:1px solid var(--line);border-radius:var(--r-s);margin-top:12px;overflow:hidden;
  background:rgba(255,255,255,.03)}
details.pl>summary{cursor:pointer;padding:10px 14px;font-size:13px;font-weight:750;color:var(--tx2);
  list-style:none;display:flex;align-items:center;gap:9px;user-select:none}
details.pl>summary::-webkit-details-marker{display:none}
details.pl>summary::before{content:"▸";color:var(--verde-l);font-size:12px;transition:.18s}
details.pl[open]>summary::before{transform:rotate(90deg)}
details.pl>summary:hover{color:var(--tx);background:rgba(0,160,90,.08)}
details.pl .in{padding:0 14px 14px}
details.pl[open]>summary{border-bottom:1px solid var(--line)}
details.pl .in{padding-top:12px}

/* ============ OVERLAY Y AVISOS ============ */
.ov{position:fixed;inset:0;z-index:60;background:rgba(3,10,8,.94);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
html[data-theme="light"] .ov{background:rgba(240,246,243,.96)}
.ov.on{display:flex}
.ov-in{max-width:900px;width:100%}
.sorteo{font-size:clamp(34px,7vw,80px);font-weight:800;letter-spacing:-.03em;color:var(--tx3);
  margin:20px 0 10px;line-height:1.1;min-height:1.15em}
.sorteo.fin{color:var(--verde-l);text-shadow:0 0 46px rgba(0,192,106,.35)}
.wrapb{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:70;opacity:0;
  background:var(--panel);border:1px solid var(--verde);border-radius:999px;padding:10px 22px;
  font-size:13.5px;box-shadow:0 20px 50px -20px rgba(0,0,0,.7);pointer-events:none;transition:.26s;
  max-width:88vw}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1180px){ .cols3{grid-template-columns:1fr 1fr} }
@media (max-width:980px){
  .cols{grid-template-columns:1fr}
  .cols3{grid-template-columns:1fr}
  .escgrid{grid-template-columns:repeat(2,1fr)}
  #paso-t{display:none}
}
@media (max-width:640px){
  :root{--head:58px}
  #reloj{font-size:23px;min-width:68px}
  #head{gap:7px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
  #head::-webkit-scrollbar{display:none}
  #head>*{flex:none}
  .escgrid{grid-template-columns:1fr}
  .b{padding:6px 10px;font-size:12.5px}
  .kpis{grid-template-columns:1fr 1fr}
}
@media print{
  body{overflow:visible;background:#fff;color:#111}
  #head,#main,.ov,.toast{position:static}
  #head,.ov,.toast{display:none!important}
  details.pl{border:none} details.pl>summary{display:none}
}

body[data-vista="portada"] #paso-n, body[data-vista="portada"] #paso-t,
body[data-vista="portada"] #reloj, body[data-vista="portada"] #b-play,
body[data-vista="portada"] #b-mas, body[data-vista="portada"] #b-reset,
body[data-vista="portada"] #b-ant, body[data-vista="portada"] #b-sig,
body[data-vista="portada"] #barra,
body[data-vista="cierre"] #reloj, body[data-vista="cierre"] #b-play,
body[data-vista="cierre"] #b-mas, body[data-vista="cierre"] #b-reset,
body[data-vista="cierre"] #paso-n, body[data-vista="cierre"] #paso-t,
body[data-vista="cierre"] #barra{display:none}
body[data-vista="cierre"] #head .marca{flex:1}
body[data-vista="portada"] #head .marca{flex:1}
</style>
</head>
<body>
<div id="head">
  <div class="marca">FEPAR 2026<small>Taller 03 · Formulario 03</small></div>
  <span id="paso-n">—</span>

 cuando la autoridad la exige para firmar el acta?","La recertificación del plantel en manejo de residuos peligrosos, ¿va al período 0 junto con la capacitación inicial o al período en que efectivamente se dicta?","¿Qué reposiciones prevén durante la operación para los equipos castigados por el suelo hidrocarburado, empezando por la motobomba y los elementos de riego?","El valor de salvamento de U$S 46.000 en el período 5, ¿entra como componente negativa con signo cambiado o como una fila aparte, y por qué?","¿Los períodos 4 y 5 llevan la campaña completa de U$S 145.460 o sólo monitoreo y control de cobertura, y qué criterio adoptan para resolverlo?"],"hor":["Si el pasivo de 6.000 m³ se agota en dos campañas de 3.000 m³, ¿por qué el horizonte llega a cinco períodos y no se cierra en dos?","¿Los dos años de seguimiento post cierre son parte del proyecto o responsabilidad posterior del propietario, y quién paga el monitoreo de la freática en ese lapso?","¿Sirve la regla del recupero de la inversión más tres a cinco años en un proyecto que no recupera nada en dinero?","La geomembrana tiene vida útil de diez años y los freatímetros de quince, ¿por qué el horizonte no se estira hasta agotar ese capital instalado?","¿Qué hito marca el final del horizonte: el acta de cierre de la autoridad, la cobertura vegetal consolidada o la entrega del sector al propietario?"],"ff":["Con U$S 163.450 en el período 0 y U$S 145.460 por año, la relación es 1,12, ¿qué les dice ese número sobre la naturaleza del proyecto?","¿El flujo acumulado cambia de signo en algún período, y si nunca lo hace qué sentido tiene buscar un período de repago en la matriz?","¿Cómo dejan asentado en la matriz que los períodos 4 y 5 están sobrestimados, sin romper la convención de repetir la componente operativa?","¿Dónde ubican los U$S 46.000 de salvamento del tractor, el acoplado regador, el tanque australiano, los módulos habitables y el galpón de 60 m²?","Si armaran la matriz con período semestral en lugar de anual, ¿cuántas columnas necesitan y mejora en algo la lectura de las dos campañas de 1.500 m³?"],"td":["¿De qué instrumento toman la tasa libre de riesgo y con qué fecha, si adoptaron 4 % anual en dólares?","El riesgo país de 10 %, ¿lo aplican igual aunque quien financia sea la previsión contable de la empresa operadora del área y no un banco?","¿Por qué fijan la prima por riesgo del proyecto en 7 % y no en 15 %, si el volumen real del pasivo todavía es un supuesto sin verificar?","Una TMAR del 21 % castiga fuerte los períodos lejanos, ¿eso favorece o perjudica a un proyecto cuyo mayor gasto ocurre en los primeros años?","¿Tiene sentido descontar al 21 % un flujo sin ingresos, o acá la tasa sirve solamente para comparar alternativas de remediación entre sí?"],"ind":["¿Por qué no pueden calcular una TIR sobre un flujo que es negativo en los seis períodos, incluido el cero?","El VAC de U$S 579.173 equivale a unos U$S 96 por m³ tratado, ¿ese valor unitario es comparable con presupuestos de landfarming o de transporte a operador habilitado?","¿Qué conclusión parcial admite el VAC y cuál no: sirve para elegir tecnología, sirve para decidir si conviene remediar el sector de piletas?","Si corrigen los períodos 4 y 5 el VAC baja al orden de U$S 460.000, ¿cuál de los dos valores llevan a la tabla de indicadores y con qué aclaración?","¿Cómo completan la columna de conclusiones parciales cuando dos de las tres filas de indicadores del formulario no corresponden a este proyecto?"],"trib":["¿Sobre qué ingreso bruto anual se categoriza un proyecto que factura cero, y qué escriben entonces en la casilla de monto anual del impuesto?","La empresa operadora del área tributa por su actividad hidrocarburífera, ¿eso alcanza para dar por resuelto el ítem J o hay que fundamentar por qué queda afuera?","Si en vez de remediar para sí vendieran tratamiento a terceros a U$S 96 el m³, ¿en qué categoría caerían con 3.000 m³ anuales?","¿Los 12 puestos de trabajo generan obligaciones previsionales que convenga mencionar aunque el proyecto no tenga categoría tributaria propia?","¿Qué riesgo corren si dejan el ítem J en blanco en lugar de justificar expresamente por qué no aplica?"],"concl":["¿Qué habilita a decir un VAC de U$S 579.173 y qué no: alcanza para afirmar cuánto va a costar finalmente la remediación de Puesto Guardián?","Si una caracterización del pasivo y un ensayo de tratabilidad pueden mover el costo un 30 %, ¿cómo lo escriben sin invalidar el trabajo que ya hicieron?","¿Contra qué alternativa concreta hay que comparar este VAC antes de sostener que las biopilas sobre 3.000 m² son la mejor opción?","Estamos en etapa de idea o perfil, ¿qué frase evitan escribir para que el formulario no termine funcionando como una recomendación de invertir?","¿La conclusión aclara que los 6.000 m³ incluyen 0,5 m de suelo afectado bajo la pileta sin impermeabilizar, un espesor que nadie verificó todavía?"],"fin":["¿Qué etapa necesita financiamiento externo: los U$S 163.450 de la inversión, la operación anual de U$S 145.460, o las dos?","Si la empresa operadora ya tiene provisionada contablemente la remediación, ¿para qué buscarían crédito del Banco de Inversión y Comercio Exterior o del Consejo Federal de Inversiones?","La póliza de caución ambiental de la Ley 25.675, ¿financia esta obligación ya declarada o sólo cubre la recomposición ante un siniestro futuro?","¿Qué garantía puede ofrecer un proyecto cuyo único activo recuperable son U$S 46.000 de valor residual al quinto año?","¿Hay líneas provinciales de Salta o fondos para pasivos ambientales hidrocarburíferos que convenga relevar antes de cerrar el ítem L?"]},"dato":{"apertura":"El F02 fija 3.000 m³ por año en dos ciclos semestrales de 1.500 m³, con doce meses de inversión previa; el flujo usa período anual.","valI":"La inversión total es de U$S 163.450 y se reparte entre acceso, celda, equipamiento, freatímetros, obrador y capacitación; el equipamiento solo suma U$S 65.260.","narrI":"El equipamiento explica el 40 % de la inversión y dentro de él el tractor de 110 HP con pala frontal cuesta U$S 48.000.","valO":"El tractor incorporado en la inversión entra en la operación a U$S 8 la hora por 240 horas anuales, no por sus U$S 48.000.","narrO":"La campaña anual cuesta U$S 145.460; extracción y clasificación se lleva U$S 64.480, el 44 %, casi todo alquiler horario de excavadora y camión volcador.","ing":"No hay componente positiva: el suelo tratado vuelve al establecimiento sin transacción y la sanción evitada es de magnitud y probabilidad inciertas.","benef":"El beneficio son 2 ha reincorporadas, la freática protegida y el menor riesgo de nueva contingencia; ninguno de los tres se valora en el flujo.","neg":"En el período 3 hay reposiciones por U$S 2.200 y U$S 3.500, y en el período 5 una auditoría ambiental de cierre de U$S 12.000.","hor":"El horizonte es de cinco períodos anuales: tres de operación que agotan los 6.000 m³ y dos de seguimiento post cierre exigidos por la autoridad.","ff":"La relación entre inversión y operación anual es 1,12 y el flujo acumulado nunca cambia de signo porque no hay ingresos.","td":"La TMAR es 21 % anual en dólares: 4 % de tasa libre de riesgo, 10 % de riesgo país y 7 % de prima del proyecto.","ind":"El único indicador posible es el VAC, U$S 579.173 al 21 %, unos U$S 96 por m³ tratado; no corresponden VAN, TIR ni RBC.","trib":"El proyecto no tiene ingreso bruto anual, de modo que no hay base imponible que categorizar en el ítem J.","concl":"El VAC de U$S 579.173 es una cota superior: corregidos los períodos 4 y 5, el orden baja a U$S 460.000.","fin":"La fuente principal es la previsión contable de abandono y remediación de la empresa operadora, fondos propios que no devengan intereses."}},"3":{"titulo":"Vivero de nativas para restauración y arbolado","foco":"El grueso de la producción, 50.000 de los 60.000 plantines, no genera ingreso monetario, y el F03 tiene que registrar sólo los U$S 26.000 de convenio y resolverse por VAC.","preguntas":{"apertura":["¿Qué traen del F02 que ya está decidido y no se toca: las seis acciones de inversión, las cuatro de operación y los 60.000 plantines por año?","Si 50.000 de los 60.000 plantines van a la restauración del predio fiscal sin que nadie pague, ¿el proyecto es público, privado o mixto?","¿El período del flujo es el año o el mes, sabiendo que un plantín nativo necesita entre doce y dieciocho meses de vivero y dos cohortes superpuestas?","¿Qué entra exactamente en el período 0 del vivero y qué queda para el período 1, si la etapa de inversión del F02 dura doce meses?","¿Quién del equipo va a sostener frente al curso la clasificación del proyecto, y con qué argumento sobre la órbita pública provincial del vivero?"],"valI":["¿Cuánto vale el metro lineal de alambrado olímpico de dos metros en Salta, y de dónde sacan ese precio para los 420 metros del cierre perimetral?","La camioneta 4x4 sola puede llevarse U$S 32.000 de una inversión de U$S 192.458: ¿la compran cero kilómetro o la alquilan por campaña de entrega?","¿El predio nivelado, con desagües y alambrado es un bien de capital no depreciable, y qué cambia si el vivero se instala en terreno cedido?","¿La capacitación del equipo técnico, del orden de U$S 7.410, es activo nominal o gasto operativo, y en qué período la registran?","¿Previeron capital de trabajo para arrancar la producción antes de la primera entrega, o el vivero funciona dos años sin un dólar de circulante?","¿Qué fuente secundaria van a citar para el galpón de 120 m² y el invernáculo de 300 m², y qué margen de error le reconocen?"],"narrI":["¿Cuál es el bloque que manda en su inversión y por qué: infraestructura de propagación, vehículos o sistema de captación y riego?","Si el invernáculo, el umbráculo y el galpón se llevan U$S 58.260, ¿pueden explicar en tres renglones por qué un vivero de 60.000 plantines necesita esa obra?","¿Cómo redactan la procedencia de los precios sin inventar cotizaciones firmes, si trabajan con listas de corralón, tarifarios de maquinaria y escalas de convenio?","¿La memoria dice cuál es el costo principal y cómo se estimó, o se limita a repetir la tabla de valoración fila por fila?","¿Qué le contestan a alguien que dice que U$S 192.458 es demasiado para abastecer una restauración de 800 hectáreas en el borde este de Salta?"],"valO":["¿Cuántos jornales de operario por año necesitan el riego, la fertilización y el control sanitario de un stock permanente de 90.000 envases?","El ejemplo paga U$S 35 el jornal de peón rural y U$S 45 el de técnico forestal: ¿esos valores resisten la escala salarial del convenio vigente?","¿Dónde aparece la cámara de conservación de semillas en la operación: por su energía y su mantenimiento, o alguien la volvió a comprar en el período 1?","¿El flete de plantines en la ventana de lluvias de diciembre a marzo es gasto de comercialización o de funcionamiento, y qué cambia esa decisión?","¿Los 66.000 envases de polietileno y los 95 m³ de sustrato se compran todos los años, o hay reutilización que baje ese gasto?","¿Separaron el mantenimiento del capital instalado, umbráculo, camioneta y bomba, del funcionamiento puro, o quedó todo mezclado en una sola bolsa?"],"narrO":["¿Qué porcentaje del costo operativo se les va en mano de obra, y por qué el repique y la selección no se automatizan a esta escala?","Si el costo operativo anual ronda los U$S 64.143 sobre 60.000 plantines, ¿cuánto les cuesta cada plantín y contra qué precio lo comparan?","¿La memoria explica por qué producir en vivero pesa más que la cosecha de semilla, la entrega y el monitoreo sumados?","¿Declararon expresamente que ningún bien de capital vuelve a valorarse en la operación, o dan esa aclaración por sobreentendida?","¿Qué dicen del riesgo de que se mueva la escala salarial del peón rural, si dos tercios del gasto operativo son jornales?"],"ing":["¿Cuántos de los 60.000 plantines generan efectivamente una entrada de dinero al proyecto, y quién firma el pago por ellos?","Si los 50.000 plantines de la restauración se entregan dentro de la misma órbita pública provincial, ¿pueden registrarlos como venta sin inflar el flujo?","¿U$S 2,60 por plantín en envase de 1,5 litros es un precio de convenio defendible, o van a tomar la góndola del vivero comercial?","¿Desde qué período empieza a entrar dinero, si la primera cohorte recién sale a los doce o dieciocho meses de sembrada?","¿Qué factor de escala aplican en los períodos 1 y 2, y cómo justifican que en el tercero ya se entregue el volumen pleno?","¿Ven el tamaño del error de contar los 60.000 a U$S 2,60, que daría U$S 156.000 por año en lugar de U$S 26.000?"],"benef":["¿A quiénes beneficia el vivero más allá de quienes pagan: las 800 hectáreas del predio fiscal, los municipios, las escuelas, la ciudad entera?","¿Cuántas instituciones educativas y organizaciones sociales participan hoy de las campañas de forestación urbana, y cómo piensan verificar ese número?","¿Qué efectos concretos genera plantar en laderas de más del 30 % de pendiente: menos erosión, menos sedimento sobre la ciudad, qué más?","¿Cómo explican que dos especies con categoría de conservación desfavorable tengan un valor que ninguna celda del flujo de fondos puede mostrar?","¿Por qué el beneficio económico no se suma al ingreso monetario en el F03, aunque sea la razón por la que el proyecto existe?"],"neg":["¿Qué ítems negativos tiene el flujo además de la inversión del período 0 y el costo operativo que se repite todos los años?","¿En qué período reponen el film del invernáculo y los paños más castigados de la media sombra, y cuánto estiman esa reposición?","¿La electrobomba sumergible del pozo aguanta los diez años, o hay que cambiarla a mitad de horizonte y registrarla en ese período?","¿Las capacitaciones de actualización van al período 0 con el resto de la inversión, o al período en que efectivamente ocurren?","¿El salvamento de la camioneta, el galpón y el alambrado entra en el período 10 con signo positivo, o directamente lo olvidaron?"],"hor":["¿Cuántos períodos van a evaluar y qué capital manda esa decisión: el invernáculo de quince años, el riego de doce o los vehículos de diez?","Si el flujo neto es negativo en todos los períodos, ¿tiene sentido fijar el horizonte por recupero de la inversión más tres a cinco años?","¿Un horizonte menor a diez años les deja ver la puesta en régimen del tercer año y las reposiciones de film y de bomba?","¿El horizonte acompaña el ritmo del programa de restauración de las 800 hectáreas, que se ejecuta en etapas plurianuales?","¿Qué le pasa al VAC si estiran el horizonte a quince años: baja el costo por plantín o suman costos operativos sin contrapartida?"],"ff":["¿La matriz tiene una fila por componente de inversión, una por componente de operación, una de ingreso y una de flujo neto, o improvisaron el formato?","¿El período 0 lleva los U$S 192.458 de inversión y ningún costo operativo, o metieron gasto de vivero antes de que el vivero exista?","Si el costo operativo es un tercio de la inversión por período, ¿a partir de qué año el acumulado de operación pesa más que la obra inicial?","¿Qué muestra el flujo neto de los períodos 1 y 2, cuando todavía no hay entrega plena y ya se paga la operación completa?","¿Aplicaron la convención de fin de período a todos los movimientos, incluida la entrega de plantines que ocurre entre diciembre y marzo?"],"td":["¿Qué tasa libre de riesgo toman dentro del rango de 3 a 5 %, y de qué instrumento dicen que sale?","¿El riesgo país argentino lo fijan en 10 % o discuten toda la banda de 8 a 12 %, y con qué fecha de referencia?","¿Qué prima de riesgo corresponde a un vivero forestal, si la tecnología es conocida pero el ciclo biológico obliga a producir antes de conocer la demanda?","Si la demanda institucional se decide año a año, ¿eso empuja la prima hacia el 8 % o hacia el 15 % del rango?","¿Una TMAR del 22 % en dólares es coherente con un vivero público que no busca rentabilidad, o deberían discutir ese piso?"],"ind":["¿Cuáles indicadores corresponden acá: VAN, TIR y RBC sobre la fracción con ingreso, VAC sobre el conjunto, o los cuatro a la vez?","Si el VAN da del orden de U$S −379.698 al 22 %, ¿qué conclusión parcial admite ese número y cuál no admite de ninguna manera?","¿Por qué no hay TIR calculable cuando el flujo neto es negativo en los diez períodos y nunca cambia de signo?","Con una RBC de 0,153, ¿pueden decir que cada dólar de costo devuelve quince centavos en dinero, y qué le falta a esa cuenta?","¿El VAC de U$S 379.698 sobre 600.000 plantines en diez años les da un costo actual por plantín, y contra qué alternativa lo comparan?"],"trib":["¿El vivero se opera desde la órbita pública provincial o como unidad privada, y qué cambia eso para la categoría tributaria?","Si las entregas a municipios e instituciones se instrumentan por convenio, ¿hay actividad comercial gravada o no la hay?","¿Cuál es el ingreso bruto anual que deberían declarar, U$S 26.000 o los U$S 156.000 que saldrían de valorar los 60.000 plantines?","Si mañana el vivero se desprendiera como unidad privada, ¿en qué categoría de monotributo caería con U$S 26.000 anuales de facturación?","¿Dejan registrado el cálculo y la justificación aunque concluyan que no aplica, o borran el ítem J del formulario?"],"concl":["¿Qué habilitan a decir estos indicadores y qué no, si estamos a nivel de idea con precios de fuentes secundarias y sin una sola cotización firme?","¿La conclusión dice que el vivero no es viable como negocio, o se anima a decir que no conviene hacerlo?","Si el criterio de decisión es el costo por plantín puesto en la ventana de lluvias, ¿contra qué lo comparan cuando nadie más produce nativas?","¿Qué supuestos declaran frágiles: el volumen de demanda institucional, el precio de convenio de U$S 2,60 o la escala salarial de los jornales?","¿Cómo cierran sin recomendar invertir y sin dejar la impresión de que el proyecto fracasó porque el VAN dio negativo?"],"fin":["¿Qué etapa necesita financiamiento con más urgencia: los U$S 192.458 del período 0 o los U$S 64.143 anuales de operación?","¿El Fondo de la Ley 26.331 de bosques nativos financia un vivero, o sólo planes de conservación con superficie bajo plan?","¿Un convenio plurianual con la provincia por provisión de plantines resuelve la operación, si la demanda institucional se decide año a año?","¿Qué garantía puede ofrecer un vivero de gestión pública para una línea que financia hasta el 70 % de los bienes de capital?","¿Buscan aportes no reembolsables de fondos de restauración de paisajes, y con qué contraparte local e informes de supervivencia se comprometen?"]},"dato":{"apertura":"El F02 fija 60.000 plantines por año en régimen desde el tercer año; sólo 10.000 van a campañas urbanas con pago de por medio.","valI":"La infraestructura de propagación es el 30 % de la inversión: U$S 58.260 sobre U$S 192.458, con galpón e invernáculo como partidas mayores.","narrI":"El resumen pide identificar el costo principal, cómo se estimó y de dónde salieron los precios; la camioneta sola mueve el orden de magnitud.","valO":"Producir plantines en vivero es el 64 % del costo operativo: U$S 41.030 de U$S 64.143, con 480 jornales de operario como partida mayor.","narrO":"La mano de obra explica cerca de dos tercios del gasto operativo anual; el costo por plantín da U$S 1,07 sobre 60.000 unidades.","ing":"El ingreso pleno son U$S 26.000 por año: 10.000 plantines a U$S 2,60, con escala 0, 0,35 y 0,7 antes del régimen.","benef":"De las 32 especies leñosas inventariadas en el predio fiscal el vivero produce 18; dos tienen categoría de conservación desfavorable.","neg":"Las reposiciones de capital y las capacitaciones durante la operación se registran en el período en que ocurren, no en el período 0.","hor":"Con U$S 26.000 de ingreso contra U$S 64.143 de costo operativo, nunca se recuperan los U$S 192.458 y el horizonte lo fija el capital.","ff":"El flujo neto es negativo en los diez períodos y nunca cambia de signo: la inversión no se recupera por vía del ingreso.","td":"La TMAR del ejemplo es 22 %: 4 % de tasa libre de riesgo, 10 % de riesgo país y 8 % de prima del proyecto.","ind":"Al 22 % el VAN da U$S −379.698, la RBC 0,153 y el VAC U$S 379.698; no hay TIR porque el flujo nunca cambia de signo.","trib":"El ingreso bruto anual en régimen es U$S 26.000; si el vivero fuera privado, ese monto definiría la categoría de monotributo aplicable.","concl":"Un VAN negativo no invalida el proyecto: el grueso de la producción abastece una restauración pública que hoy no tiene proveedor.","fin":"La inversión y la operación necesitan fuentes distintas: crédito o aportes no reembolsables para el período 0, convenio plurianual para los años operativos."}},"6":{"titulo":"Agua de lluvia para usos no potables en un hotel","foco":"La componente positiva no es una venta sino un costo evitado de U$S 13.430 anuales, y ese ahorro no alcanza para recuperar los U$S 182.353 de inversión.","preguntas":{"apertura":["El F02 les dejó un sistema que entrega 2.300 m³ al año, el 46 % de la demanda no potable: ¿con qué tipo de proyecto están trabajando, privado, público o mixto?","¿El período del flujo va a ser el año, cuando la lluvia cae en enero y el riego se necesita entre abril y octubre?","La obra del hotel dura 24 meses en tres etapas de ocho: ¿todo eso entra en el período 0 o parte queda fuera del proyecto?","¿Qué le pertenece al proyecto de captación y qué le pertenece al hotel que se construye igual, por ejemplo la cisterna de 55.000 L del pozo?","¿Están de acuerdo en que el titular es privado y se apropia del resultado, o alguno sostiene que la concesión en trámite lo vuelve mixto?"],"valI":["Las dos cisternas de 150 m³ se llevan U$S 69.890, el 38 % de la inversión: ¿ese peso es coherente con almacenar apenas 300 m³?","¿A cuánto van a tomar el jornal de la cuadrilla sanitaria, si los 180 jornales del tendido de la segunda red pesan tanto como los 2.400 m de cañería?","¿La capacitación del personal, U$S 2.928, la clasifican como activo nominal o la mandan a la operación, y qué consecuencia tiene esa decisión sobre el flujo?","La excavación y el retiro de 320 m³ de suelo cuestan U$S 4.560: ¿es un bien no depreciable adosado al suelo o queda incorporado a la obra?","¿De dónde van a sacar el precio del hormigón H-21 y del acero ADN-420, que entre los dos explican U$S 37.800, y con qué margen de error?","¿Hay algo en esta inversión que sea capital de trabajo o costo operativo adelantado, o todo es obra civil, cañería y equipo?"],"narrI":["Si tienen que decir en tres oraciones cuál es el costo principal, ¿nombran las cisternas por U$S 69.890 o la suma de cañerías de las componentes A y C?","¿Cómo explican que 9.650 m² de cubierta se conviertan en superficie de captación por U$S 41.440, es decir unos U$S 4,3 por metro cuadrado?","¿Qué precios vinieron de listas de mercado, cuáles del convenio de la construcción, y cuáles no encontraron y tuvieron que suponer?","A nivel de idea el error esperable es del orden del 20 %: ¿alcanza para que la inversión baje de U$S 182.353 a algo que cambie la decisión?","¿La memoria deja claro que las cantidades vienen del F02 sin retoques, o hay alguna cantidad que ustedes ajustaron al momento de valorar?"],"valO":["Los 1.100 m³ de lluvia que van al riego: ¿a qué precio unitario entran en la operación, y qué pasa con el flujo si los cargan a U$S 8,50?","Las cisternas costaron U$S 69.890 en la inversión: ¿cuánto pueden volver a poner en la operación por ellas, y en concepto de qué?","¿Los 2.650 m³ anuales de reposición desde el pozo son gasto de funcionamiento del sistema, o son del hotel, que los bombearía igual?","¿Dónde clasifican los U$S 720 de servicio técnico de las electrobombas: funcionamiento, mantenimiento del capital o comercialización?","¿Hay algún gasto de comercialización en este proyecto, o la respuesta correcta es cero porque no hay absolutamente nada que vender?","¿Los 48 jornales anuales del personal de mantenimiento se imputan al proyecto aunque el hotel no contrate a nadie nuevo para cubrirlos?"],"narrO":["La operación cuesta U$S 8.753 al año, el 4,8 % de la inversión: ¿esa relación tan baja les parece verosímil para un sistema que trabaja por gravedad?","¿Cuánto pesa la mano de obra propia, U$S 2.160 de 48 jornales a U$S 45, frente a los U$S 3.340 de servicios técnicos y profesionales?","¿La energía de bombeo, 5.200 kWh a U$S 0,115, está bien estimada para presurizar 2.300 m³ anuales en cuatro plantas?","¿El arancel de la certificación de hotelería sustentable entra al proyecto, si el establecimiento la tramita con sistema de captación o sin él?","¿Qué costo operativo van a discutir primero si el gerente del hotel pide bajar el gasto anual un 20 %?"],"ing":["El hotel no vende agua: ¿qué justifica entonces poner U$S 13.430 del lado positivo del flujo, y en qué se diferencia eso de una venta?","¿Por qué los 2.300 m³ se valoran a U$S 8,50 y a U$S 1,70 según la fuente sustituida, y no a un único precio promedio?","¿Quién les asegura que el hotel hoy compra 1.400 m³ a camión cisterna por año, y qué pasa con el costo evitado si ese número resulta cero?","Si el pozo abasteciera todo a U$S 1,70 el m³, el ahorro caería a U$S 3.910: ¿se animan a correr el flujo con ese supuesto?","¿Los factores de puesta en régimen 0,7 y 0,9 de los dos primeros períodos responden a la curva de ocupación del hotel o a la estacionalidad de la lluvia?","¿Un costo evitado genera caja disponible el mismo año en que ocurre, o sólo mejora el resultado del establecimiento?"],"benef":["¿Cuántos usuarios del acuífero de abanico aluvial se benefician de los 2.300 m³ que el hotel deja de extraer, y cómo los cuentan?","El ingreso monetario son U$S 13.430: ¿cómo explican en una sola oración que el beneficio económico sea mayor y no aparezca en el flujo?","¿A quién le entregan qué: a las 41.000 pernoctaciones anuales, a los 38 puestos de trabajo, o a los vecinos aguas abajo del canal perimetral?","¿Vale la pena dimensionar en unidades físicas la menor descarga al canal que cruza la avenida, o alcanza con declarar los 2.300 m³?","La depresión regional ya hizo converger el flujo subterráneo hacia la ciudad: ¿qué parte de ese daño evitado le corresponde a un hotel de 109 habitaciones?"],"neg":["¿Qué entra en la componente negativa además de la inversión del período 0 y los U$S 8.753 anuales de operación?","Las tres reposiciones, U$S 2.600 en el período 6, U$S 2.900 en el 7 y U$S 3.400 en el 8: ¿por qué no van en el período 0?","¿La capacitación de U$S 2.928 va entera al período 0, o parte se repite durante la operación por la rotación del personal hotelero?","Por convención de fin de período, ¿dónde ubican el reacondicionamiento de las electrobombas si ocurre en el mes seis del año seis?","¿Los U$S 88.000 de valor residual son una componente negativa con signo cambiado, o se consignan aparte en el período 10?"],"hor":["¿Por qué diez períodos y no veinte, si las cisternas tienen cuarenta años de vida útil y la segunda red, treinta?","La regla para proyectos privados es recupero más tres a cinco años: ¿cómo la aplican si con U$S 4.677 anuales el recupero supera los treinta años?","¿Estirar el horizonte hasta que el VAN cambie de signo es una decisión técnica o una forma elegante de esconder el resultado?","¿El activo que manda es el equipamiento electromecánico de diez años, o la instrumentación de ocho que se repone en el período 8?","Si adoptaran veinte períodos, ¿qué reposiciones nuevas tendrían que agregar al flujo y por qué monto aproximado?"],"ff":["¿El período 0 lleva los U$S 182.353 completos, o los reparten entre las dos etapas de obra en que se ejecuta el sistema?","Con escala 0,7 el primer período rinde U$S 9.401 de costo evitado contra U$S 8.753 de operación: ¿el flujo del año 1 da positivo?","¿El flujo de fondos neto acumulado cambia de signo en alguno de los diez períodos, y qué les dice eso antes de calcular el VAN?","¿Dónde ubican los U$S 88.000 de salvamento y qué proporción ica, sin que parezca que se olvidaron de completarlo?"],"concl":["Los indicadores dicen que la inversión no se recupera: ¿qué no los habilitan a decir sobre si el hotel debe hacer la obra?","¿Un error del 20 % en precios de perfil mueve el signo del VAN de U$S −156.891, o solamente su magnitud?","El VAN mide lo que pasa por el bolsillo del hotel: ¿qué queda afuera cuando los 2.300 m³ anuales dejan de extraerse de un acuífero ya deprimido?","¿Cuánto tendría que valer el m³ de agua sustituida, hoy U$S 8,50 y U$S 1,70, para que el VAN llegue a cero?","Si la certificación de hotelería sustentable trajera tarifa o demanda extra, ¿eso pertenece a este flujo de fondos o a otra evaluación?","¿Cómo redactan la conclusión para que mida la brecha que la evaluación económica deberá cubrir, sin recomendar ni desaconsejar invertir?"],"fin":["¿Qué etapa hay que financiar, los U$S 182.353 del período 0 o también los U$S 8.753 anuales de operación?","Si el propietario pone capital propio dentro del presupuesto de los 24 meses de obra, ¿qué costo financiero corresponde consignar?","Un crédito del Banco Nación a 60 meses con garantía real sobre el inmueble: ¿lo puede pagar un margen de U$S 4.677 al año?","¿El aporte no reembolsable para establecimientos con certificación de sustentabilidad cambia el VAN del proyecto, o cambia quién soporta la inversión?","¿Qué le presentan al Consejo Federal de Inversiones si el proyecto tiene una TIR negativa, y con qué argumento lo sostienen?"]},"dato":{"apertura":"El hotel es privado y financia la obra con capital propio: corresponden VAN, TIR y RBC, no VAC.","valI":"La inversión total es U$S 182.353; obra civil y cañerías explican el 90 % y el equipamiento apenas el 10 % restante.","narrI":"El hormigón elaborado y el acero de las cisternas suman U$S 37.800 por sí solos, más de la quinta parte de la inversión.","valO":"Un bien de capital ya incorporado en la inversión sólo reaparece en la operación por su gasto de funcionamiento y su mantenimiento.","narrO":"Los servicios técnicos y profesionales son el rubro mayor de la operación: U$S 3.340 al año, el 38 % de los U$S 8.753.","ing":"El costo evitado se valora al precio de la fuente que sustituye: 1.400 m³ de camión a U$S 8,50 y 900 m³ propios a U$S 1,70.","benef":"El beneficio económico se declara y se dimensiona en unidades físicas, pero en el F03 no se valora en dinero.","neg":"Las reposiciones y las capacitaciones son las únicas inversiones que no van al período 0 sino durante la operación.","hor":"El horizonte lo marca el activo decisivo más corto: el equipamiento electromecánico, con diez años de vida útil.","ff":"El margen anual en régimen es U$S 4.677: la operación se paga sola desde el primer período, pero la inversión no se recupera.","td":"TMAR adoptada: 4 % de tasa libre de riesgo más 10 % de riesgo país más 7 % de prima del proyecto, 21 % anual en dólares.","ind":"VAN U$S −156.891, TIR −4,51 % y RBC 0,287: los tres indicadores coinciden en que la componente monetaria no sostiene el proyecto.","trib":"La categorización tributaria se define sobre lo facturado; un costo evitado no se factura, así que el ingreso bruto del proyecto es cero.","concl":"Estamos a nivel de idea: se declaran supuestos y se mide, no se recomienda invertir ni descartar el proyecto.","fin":"La decisión hay que tomarla antes de la tercera etapa de ocho meses: después, incorporar la segunda red cuesta mucho más."}},"9":{"titulo":"Parque periurbano en el predio fiscal del borde este","foco":"Un proyecto público de acceso libre sin un peso de ingreso, donde sostener el parque cuesta tres veces y media lo que cuesta construirlo y el único indicador posible es el VAC.","preguntas":{"apertura":["El F02 dimensionó 60 de las 289,8 hectáreas que la zonificación destina a conservación, ¿ese recorte es el que van a valorar o van a discutir la superficie antes de ponerle precio?","¿El parque es un proyecto público puro, o alguno del equipo piensa concesionar servicios y convertirlo en mixto antes de armar el flujo?","Si el período 0 abarca los dieciocho meses que van de la firma del convenio de afectación a la habilitación al público, ¿por qué el flujo se lleva en años y no en meses?","¿Qué entra en el período 0 y qué queda para T1, si la capacitación de los doce agentes se dicta antes de abrir pero se repite durante la operación?","El predio es fiscal y no se compra, ¿cómo se registra entonces el suelo en la inversión, o directamente no se registra y con qué argumento?"],"valI":["Los 1.400 postes de quebracho a U$S 11 y los 260 jornales de alambrador a U$S 38 dan los 4.200 m de perímetro, ¿de dónde sacan esos precios y de qué año son?","¿Las tres lagunas de 1.800 m³ y los 3.600 m de zanjas son bien de capital depreciable o no depreciable, y qué argumento sostiene la respuesta?","La acción E se lleva U$S 134.720, el 29 % de la inversión, ¿ese peso se justifica con la camioneta, el tractor y la perforación, o hay equipamiento que podrían alquilar?","¿Los U$S 7.000 de capacitación de los doce agentes son activo nominal o costo operativo adelantado, y qué cambia en el flujo según cómo lo clasifiquen?","El módulo sanitario prefabricado con biodigestor cotiza U$S 9.800 por unidad, ¿verificaron ese precio en alguna lista de proveedores o lo están adoptando como supuesto declarado?","¿Hay alguna acción del F02 que genere capital de trabajo, o el primer año de operación se resuelve con el adelanto de la partida presupuestaria?"],"narrI":["Si tuvieran que explicar la inversión en tres oraciones, ¿empiezan por los U$S 134.720 de bienes de capital o por los U$S 120.335 de uso público, y por qué?","¿Cómo redactan que los precios salen de listas de corralón de Salta, tarifarios de equipo vial y escalas de jornal de convenio, sin aparentar un cómputo de obra?","En la cubierta vegetal los jornales explican cerca de la mitad de los U$S 89.780, ¿ese dato entra en la memoria o se pierde dentro del total del componente?","¿Qué supuestos declaran por escrito: rendimiento de plantación por jornal, metros de alambrado por jornal de alambrador, horas de retroexcavadora por laguna de 1.800 m³?","Estamos a nivel de idea y perfil, ¿cómo lo dicen en la memoria sin que el lector confunda los U$S 462.240 con un presupuesto licitable?"],"valO":["¿En qué tipo de gasto cae cada componente: la portería y el guiado son funcionamiento, la purga de lagunas mantenimiento, y comercialización directamente no existe acá?","Los 730 jornales de portería y los 730 de vigilancia perimetral salen de abrir los 365 días, ¿es una sola persona por turno o están contando de más?","¿Alguien cargó el valor del tractor o de la camioneta en la operación, cuando lo único que corresponde son los 4.200 litros de nafta y el service?","La energía de bombeo de los 9.000 m³ de la perforación a U$S 0,28 el m³, ¿cubre el riego de reposición y los sanitarios de los visitantes?","¿El mantenimiento de las obras de regulación, U$S 12.266 por año, alcanza para purgar tres lagunas de 1.800 m³ y reparar 3.600 m de zanjas?","¿Qué pasa con el costo operativo si en vez de abrir los 365 días abren de miércoles a domingo, y qué pierde el proyecto con eso?"],"narrO":["Operación y vigilancia suman U$S 129.098, el 76 % del costo anual y casi todo jornales, ¿cómo lo escriben sin que parezca un parque sobredotado de personal?","¿La memoria explica por qué abrir los 365 días fija una dotación mínima que no se puede achicar sin cerrar días al público?","¿Dónde dice la memoria, con todas las letras, que de los bienes de la acción E sólo se computan combustible, energía, conservación y reposición del equipo de incendios?","Si el costo por visita da U$S 0,94 sobre 180.000 visitas, ¿ese número va en la memoria de la operación o lo reservan para las conclusiones?","¿Qué parte del costo operativo es ineludible y cuál podría bajar si la escuela del sector aportara guías o el municipio se hiciera cargo de la recolección?"],"ing":["¿La componente positiva es cero en T0 y de T1 a T10, o alguien del equipo quiere cobrar el estacionamiento y tiene un argumento para sostenerlo?","Si cobraran U$S 2 por visita, las 180.000 visitas darían U$S 360.000 por año, más del doble del costo operativo, ¿por qué eso no puede entrar al flujo?","¿El vivero que produce 3.000 plantines por año para reposición podría vender excedente, y si no figura en el F02 corresponde inventarlo ahora?","¿Qué escriben en el ítem D para que el ingreso nulo no parezca un olvido: acceso libre, dominio público, población con déficit de espacio verde?","Las obras de regulación evitan daño aguas abajo, ¿eso es un costo evitado que hoy paga alguien y podría ser componente positiva, o no lo es y por qué?"],"benef":["¿Cuántos son los beneficiarios: los 14.000 habitantes del borde este, los 1.800 alumnos de la escuela, o también los vecinos aguas abajo de las alcantarillas de la RN 9?","Hoy el sector tiene una sola plaza reducida y en pendiente, ¿qué significa en bienestar pasar de eso a 60 hectáreas con 180.000 visitas por año?","¿Por qué las 13 visitas por habitante y por año son beneficio y no ingreso, y cómo lo explican en una sola oración del ítem D?","El estándar de 10 m² de verde por habitante deja un déficit que el parque cubre en un 60 %, ¿ese porcentaje les sirve para dimensionar el beneficio?","¿Qué beneficio se llevan los que nunca visiten el parque, por ejemplo los que viven junto al cauce revestido que descarga en el sector de riesgo hídrico crítico?"],"neg":["¿La componente negativa es sólo inversión más operación, o incluyen también las reposiciones y la capacitación de actualización de los períodos 4 y 8?","La reposición del equipo de incendios cae en el período 5, el reacondicionamiento de camioneta y tractor en el 6 y la bomba sumergible en el 7, ¿esas vidas útiles las verificaron o las supusieron?","¿Los U$S 38.000 de valor residual entran como negativo con signo cambiado en el período 10, y qué bienes del parque lo componen?","Si la bomba sumergible fallara antes del período 7, ¿se int ?","¿Los 365 jornales del operario de planta a U$S 38, U$S 13.870 al año, son gasto de funcionamiento o los quieren repartir entre digestión y compostaje?","¿La limpieza de la cubierta de geomembrana y los repuestos de la línea de biogás son mantenimiento del capital, y por qué no funcionamiento?","¿Hay algún gasto de comercialización en esta operación, si el compost se vende a puerta de establecimiento y el F02 no previó acción de venta ni flete?","¿Los U$S 5.280 de monitoreo, veintiocho análisis y diez jornadas del responsable ambiental, son costo de la planta o el precio de sostener la licencia ambiental?"],"narrO":["¿Cómo justifican que la digestión anaeróbica se lleve U$S 20.630 al año, el 35 % de la operación, si el equipo grande ya está pagado en la inversión?","¿Un jornal diario los 365 días es el mínimo para alimentar 72 m³ de líquido por día, o pueden repartir esa tarea entre los trece empleados actuales?","¿La mano de obra directa de U$S 19.298, el 33 % del costo anual, sube o baja si voltean las pilas cada quince días en lugar de semanalmente?","¿Las 10.500 bolsas de rafia a U$S 0,45 son funcionamiento del compostaje o ya son comercialización, y cómo argumentan esa clasificación en el resumen narrativo?","¿Qué dicen en la memoria sobre los 1.800 litros de gasoil del tractor, si el combustible es el precio más volátil de todo el cuadro de operación?"],"ing":["¿Las 10.500 bolsas de compost salen de los mismos residuos que el F02 mandó compostar, o están vendiendo una cantidad que la planta no llega a producir?","¿U$S 4,50 la bolsa de 40 kg retirada en el predio es defendible si el compost no tiene mercado formal en Salta ni precio de referencia provincial?","¿Los U$S 29.760 de biogás y los U$S 12.000 de digerido son costo evitado y no venta, y dónde escriben esa distinción para que nadie los facture?","¿En qué período empieza a entrar cada concepto, si el biodigestor rinde la mitad en T1 y el 85 % en T2 antes de llegar a régimen?","¿Qué pasa con el ingreso pamiento de procesamiento y envasado","comp":"Proyecto dotado con equipamiento de procesamiento y envasado","activo":"depreciable","vida":10,"rel":"Se obtiene la línea de proceso completa, prensa manual, dos mesas de corte, selladora, balanza de precisión y dos deshidratadores solares, por U$S 5.420, equipamiento depreciable en diez años."},{"cod":"F","acc":"Capacitar al equipo de trabajo en manejo del cultivo y procesamiento","comp":"Equipo de trabajo capacitado en manejo del cultivo y procesamiento","activo":"nominal","vida":null,"rel":"Se obtienen doce integrantes formados en manejo agronómico y en procesamiento, con manual de procedimientos y una corrida de prueba sobre 300 frutos comprados a terceros, por U$S 3.020, activo nominal que no se deprecia y se actualiza durante la operación."}],"compO":[{"cod":"A","acc":"Implantar el cultivo de Luffa cylindrica en una hectárea","comp":"Cultivo de Luffa cylindrica implantado en una hectárea","tipoFF":"funcionamiento","rel":"La implantación anual de 2.750 plantines con su compost, fertilización de base, almácigo bajo cubierta y jornales de trasplante cuesta U$S 2.903 por ciclo, y se repite en cada período del horizonte."},{"cod":"B","acc":"Conducir el cultivo hasta la maduración de los frutos","comp":"Cultivo conducido hasta la maduración de los frutos","tipoFF":"funcionamiento","rel":"La conducción del cultivo durante cinco meses, con 4.500 m³ de agua, la energía del bombeo, el fertirriego, el tutorado y 90 jornales de manejo, cuesta U$S 4.554 por ciclo, de los cuales U$S 380 son conservación de la espaldera ya incorporada en la inversión."},{"cod":"C","acc":"Cosechar y acondicionar los frutos maduros","comp":"Frutos maduros cosechados y acondicionados","tipoFF":"funcionamiento","rel":"La cosecha manual y el acondicionamiento de los frutos, con 195 jornales, insumos de lavado y blanqueado y agua de proceso, cuesta U$S 7.324,80 por ciclo, de los cuales U$S 768 son limpieza y conservación de las piletas y de los dos deshidratadores solares."},{"cod":"D","acc":"Elaborar y despachar las esponjas envasadas","comp":"Esponjas envasadas elaboradas y despachadas","tipoFF":"funcionamiento","rel":"El corte, el envasado de 30.000 unidades y el despacho a los 45 puntos de venta cuestan U$S 12.774 por ciclo; U$S 7.540 corresponden a elaboración y U$S 5.234 a comercialización, que se abrirían como componente propia si el F02 hubiera definido una acción de comercialización separada."}],"ing":{"aplica":true,"momento":"t1tn","items":[{"concepto":"Esponja vegetal de Luffa cylindrica envasada y etiquetada, venta mayorista a comercios y ferias","cant":30000,"unidad":"unidades","precio":1.65,"desde":1,"escala":[0.6,0.85,1,1,1,1,1,1],"nota":"La cantidad es la capacidad del F02, 45 puntos de venta por 55 unidades mensuales, y el precio mayorista es del orden del 45 % del precio de góndola relevado para esponjas vegetales importadas."}],"just":"El ingreso anual pleno es de U$S 49.500: 30.000 unidades a U$S 1,65. La cantidad no se estimó desde la demanda sino desde la capacidad instalada del F02, que cubre alrededor de un tercio de la demanda potencial del Valle de Lerma, con 45 puntos de venta y 55 unidades mensuales cada uno. El precio corresponde a venta mayorista al comercio, no al público: se tomó el precio de góndola de esponjas vegetales relevado en comercios de productos naturales y ferias, y se aplicó el margen habitual del canal minorista. Los dos primeros períodos se afectan por factores de 0,6 y 0,85, que representan la puesta en régimen del cultivo y la apertura progresiva de los puntos de venta. Son estimaciones de nivel de idea o perfil, de fuentes secundarias, que un estudio de mercado debe confirmar.","benef":"El ingreso en dinero es lo que la unidad productiva cobra por vender esponjas: U$S 49.500 anuales en régimen. El beneficio económico es otra cosa y no se valora en esta instancia. Comprende el plástico que deja de producirse y de disponerse, ya que cada esponja vegetal sustituye entre tres y cuatro esponjas sintéticas por año y al final de su vida útil se composta en lugar de sumar al relleno sanitario. Comprende también los doce puestos de trabajo locales, la retención de valor agregado en el Valle de Lerma y la diversificación productiva de pequeños productores. Ese incremento de bienestar social requiere precios sociales y no entra en el flujo de fondos privado, pero debe declararse porque sostiene el interés público del proyecto y su elegibilidad para financiamiento promocional."},"repo":[{"concepto":"Reposición de las cintas de goteo de la hectárea","periodos":[5],"monto":1150.0,"nota":"Las cintas de goteo tienen una vida útil de cinco campañas, menor que la del resto del sistema de riego, y se reponen una vez dentro del horizonte."},{"concepto":"Actualización de la capacitación del equipo de trabajo","periodos":[4,8],"monto":900.0,"nota":"Cada cuatro ciclos se dicta un módulo de actualización en manejo del cultivo y control de calidad, imputado al período en que ocurre y no al período 0."},{"concepto":"Reposición de la malla de conducción de la espaldera","periodos":[6],"monto":700.0,"nota":"La malla plástica se degrada por radiación antes que los postes y el alambre, y se renueva una sola vez en el horizonte."}],"salv":{"monto":12000.0,"just":"Al cierre del octavo período el galpón conserva la mayor parte de su vida útil y el riego y el equipamiento un remanente menor; el valor contable se castiga por el mercado acotado de reventa rural y se estima en U$S 12.000."},"td":{"rf":4.0,"rp":10.0,"rpr":8.0,"just":"Se adopta 4 % de tasa libre de riesgo, según los bonos del Tesoro de Estados Unidos, y 10 % de riesgo país, valor medio del índice para la Argentina. La prima del proyecto se fija en 8 %: actividad agrícola a cielo abierto, con riesgo climático y sanitario, pero de tecnología conocida y sin dependencia de un único comprador. El mercado de productos biodegradables es incipiente y no está cuantificado, lo que justifica no bajar de ese valor. La TMAR resultante es 22 % anual en dólares."},"narrI":"La inversión total es de U$S 49.840,50. El componente dominante es el galpón de procesamiento y almacenamiento, con U$S 21.652,50, el 43 % del total: se estimó por cómputo y presupuesto de 150 m², a unos U$S 144 por metro cuadrado, con precios de corralón local para materiales y escalas del convenio de la construcción para la mano de obra de la cuadrilla contratista. Le siguen el sistema de riego por goteo, con U$S 9.610, donde pesan la perforación de 40 metros y el equipo de bombeo, y la espaldera, con U$S 6.884, determinada por los 600 postes de eucalipto tratado. El equipamiento de proceso suma U$S 5.420 y la capacitación, activo nominal, U$S 3.020. El acondicionamiento del predio, U$S 3.254, es el único bien de capital no depreciable. No se incorporó una componente de capital de trabajo porque el F02 no la definió como acción: los costos del primer ciclo se imputan íntegros en el período 1.","narrO":"El costo operativo anual en régimen es de U$S 27.555,80. La mano de obra es el rubro decisivo: 476 jornales y 64 horas de tareas de conservación suman U$S 15.196, el 55 % del costo de operación, coherente con un proceso manual de pelado, desemillado, secado, corte y envasado. La componente más cara es la elaboración y despacho, con U$S 12.774, dentro de la cual el envase de papel kraft con etiqueta impresa pesa U$S 3.600 y la comercialización U$S 5.234. La cosecha y el acondicionamiento suman U$S 7.324,80, la conducción del cultivo U$S 4.554 y la implantación U$S 2.903. Los bienes de capital ya incorporados en la inversión no se vuelven a valorar: del riego, la espaldera, las piletas y los deshidratadores sólo se imputan la energía de bombeo, U$S 352, y las tareas de conservación, reposición de alambre y tutores y horas de limpieza, U$S 1.148 en total.","narrFF":"El flujo de fondos muestra una inversión de U$S 49.840,50 en el período 0 y un costo de operación anual de U$S 27.555,80, es decir que la operación de un ciclo equivale al 55 % de la inversión inicial: la relación es propia de un proyecto intensivo en mano de obra y no en capital. Los ingresos plenos de U$S 49.500 superan a los costos operativos desde el primer período, pero por los factores de escala de 0,6 y 0,85 el margen recién se vuelve significativo en el segundo ciclo, con U$S 14.519, y alcanza U$S 21.944 desde el tercero. El saldo acumulado cancela la inversión durante el cuarto período. Los períodos 4, 5, 6 y 8 llevan además las reposiciones de cintas, malla y capacitación, montos menores que no alteran el signo del flujo. El octavo período incorpora el salvamento de U$S 12.000.","tributo":{"aplica":true,"ingresoAnual":49500.0,"just":"Con un ingreso bruto anual de U$S 49.500 en régimen, la unidad productiva se ubica en las categorías superiores del Régimen Simplificado para Pequeños Contribuyentes, próxima al tope de facturación, por lo que debe preverse el pase a responsable inscripto hacia el tercer o cuarto período. Corresponde además el impuesto provincial sobre los ingresos brutos, con la alícuota reducida de actividad primaria."},"concl":"Con una TMAR del 22 % anual en dólares, el flujo arroja un VAN positivo pero acotado, del orden de U$S 9.600, una TIR cercana al 27 % y una relación beneficio-costo de 1,06, apenas por encima de la unidad. El recupero de la inversión se completa durante el cuarto ciclo productivo. El resultado es sensible a dos supuestos que el F02 declaró y que no están verificados: el rendimiento de 10 frutos aptos por planta y 1,2 unidades comercializables por fruto, y el precio mayorista de U$S 1,65. Una caída del 6 % en cualquiera de los dos lleva el VAN a cero. Estos números no habilitan a decir que el proyecto es rentable: habilitan a decir que, con precios de nivel de idea o perfil tomados de fuentes secundarias, la alternativa no queda descartada y amerita pasar a prefactibilidad. Lo que corresponde ahora es un estudio de mercado que mida la demanda real de los 45 puntos de venta y un ensayo agronómico que confirme el rendimiento del cultivo en el Valle de Lerma.","fin":[{"org":"Consejo Federal de Inversiones","linea":"Crédito para la reactivación productiva de pymes","etapa":"ambas","cond":"Tasa subsidiada, plazo de hasta 48 meses con período de gracia, garantía real o SGR"},{"org":"Ministerio de Producción de la Provincia de Salta","linea":"Fondo de fomento a emprendimientos productivos","etapa":"inversión","cond":"Aporte no reembolsable parcial, contraparte del emprendimiento y rendición por certificación"},{"org":"Instituto Nacional de Tecnología Agropecuaria","linea":"Cambio Rural y asistencia técnica a grupos de productores","etapa":"ambas","cond":"No reembolsable, asistencia técnica y capacitación, requiere grupo formalizado"},{"org":"Banco de la Nación Argentina","linea":"Línea de inversión productiva para pymes agropecuarias","etapa":"inversión","cond":"Tasa fija en pesos, plazo de 60 meses, hasta el 80 % del proyecto de inversión"},{"org":"Instituto Nacional de Asociativismo y Economía Social","linea":"Financiamiento a cooperativas y mutuales","etapa":"operación","cond":"Requiere matrícula vigente, destinado a capital de trabajo del primer ciclo"}],"claves":["El precio se pone sobre lo que el F02 ya decidió: no se agregan acciones ni se cambian cantidades, sólo se valoran los recursos que ya estaban y se completan los que faltaban en cada tarea.","Los bienes de capital se valoran una sola vez, en la inversión; del riego, la espaldera, las piletas y los deshidratadores sólo aparecen en la operación U$S 1.148 de reposición de alambre y tutores y de horas de limpieza y conservación.","Una componente se clasifica por la naturaleza predominante de su costo, aunque contenga rubros de otro tipo: la acción D de operación se imputa a funcionamiento porque U$S 7.540 son elaboración, y se declara que U$S 5.234 son comercialización.","Las reposiciones de vida útil corta se imputan al período en que ocurren y no al período 0: las cintas de goteo en el quinto ciclo, la malla en el sexto y la actualización de la capacitación en el cuarto y el octavo.","El horizonte no se elige por costumbre: se estima primero el recupero de la inversión, que aquí ocurre en el cuarto ciclo, y se fija el horizonte cuatro períodos más allá, verificando que no exceda la vida útil de los bienes principales."],"trampa":{"mal":"Valorar en la operación la compra de frutos secos de Luffa a productores como materia prima del proceso, arrastrando el precio de U$S 0,90 por fruto que la acción F de la inversión usó para la corrida de prueba.","bien":"En la operación la materia prima es el fruto del propio cultivo: su costo ya está en las componentes A, B y C, que valoran plantines, agua, fertilización, conducción y cosecha. La compra a terceros se valora una sola vez, en la corrida de prueba de la inversión, por 300 frutos y U$S 270.","porque":"Producir 30.000 esponjas exige unos 25.000 frutos; valorarlos a U$S 0,90 agrega U$S 22.500 al costo anual de operación, que pasaría de U$S 27.555,80 a U$S 50.055,80, un 82 % más. El margen anual en régimen caería de U$S 21.944 a menos de U$S 600 y el proyecto aparecería como inviable por un error de doble contabilización, no por una razón económica."}},"2":{"n":2,"titulo":"Cierre y restauración de piletas · Puesto Guardián","tipo":"publico","tipoNota":"El proyecto lo ejecuta una empresa privada, pero no genera componente positiva: la remediación de las piletas es una obligación regulatoria y no un bien que se venda, de modo que el flujo de fondos tiene sólo costos. Por eso se lo trata como público en el sentido de la Guía y el indicador es el VAC; no corresponden VAN, TIR ni RBC.","periodo":"año","per0":"Los doce meses de la etapa de inversión del F02: acondicionamiento del acceso y la playa de maniobras, construcción de la celda, red de freatímetros, incorporación del equipamiento y del obrador y capacitación del plantel. Todos los desembolsos se registran al cierre del período 0.","horizonte":5,"horizonteJust":"El F02 fija tres años de operación: dos campañas anuales de 3.000 m³ que agotan el pasivo de 6.000 m³ y un tercer año de relleno, reconformación y revegetación. Se agregan dos años de seguimiento post cierre, con monitoreo de la freática y control de cobertura, que la autoridad exige antes del acta de cierre. Son cinco períodos operativos. No corresponde estimar el tiempo de recupero de la inversión: el proyecto no tiene ingresos y lo que se recupera son 2 ha de suelo y la protección del acuífero, no un retorno monetario.","recI":[{"cod":"A","tarea":"Desmalezado y retiro de la cubierta vegetal en 0,6 ha","recurso":"Retroexcavadora con hoja topadora y operador","unidad":"horas de uso","cant":24,"pu":45,"fuente":"Tarifas de alquiler de equipo vial, NOA 2026"},{"cod":"A","tarea":"Perfilado y compactación de 900 m de camino interno","recurso":"Motoniveladora con operador","unidad":"horas de uso","cant":40,"pu":55,"fuente":"Tarifas de alquiler de equipo vial, NOA 2026"},{"cod":"A","tarea":"Ejecución de cunetas y de dos alcantarillas de desagüe","recurso":"Caño de hormigón de 0,60 m de diámetro para alcantarillas","unidad":"metros","cant":24,"pu":55,"fuente":"Mercado local de materiales de construcción"},{"cod":"A","tarea":"Ejecución de cunetas y de dos alcantarillas de desagüe","recurso":"Retroexcavadora con operador para apertura de cunetas","unidad":"horas de uso","cant":20,"pu":45,"fuente":"Tarifas de alquiler de equipo vial, NOA 2026"},{"cod":"B","tarea":"Nivelación y compactación de la base de 3.000 m²","recurso":"Rodillo compactador autopropulsado con operador","unidad":"horas de uso","cant":60,"pu":50,"fuente":"Tarifas de alquiler de equipo vial, NOA 2026"},{"cod":"B","tarea":"Colocación de geomembrana de polietileno de alta densidad de 1,5 mm","recurso":"Geomembrana de polietileno de alta densidad de 1,5 mm","unidad":"m²","cant":3450,"pu":6.5,"fuente":"Proveedores de geosintéticos, lista 2026"},{"cod":"B","tarea":"Colocación de
