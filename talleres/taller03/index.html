  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes());
}
function min(i){ return (S.plan && S.plan[i] != null) ? S.plan[i] : PASOS[i].min; }
function total(){ return PASOS.reduce(function(a,_,i){ return a + min(i); }, 0); }
function escAct(){ return ESC[String(S.esc)] || null; }
function ffAct(){ return FF[String(S.esc)] || null; }
function pregDe(k){
  var p = PREG[String(S.esc)];
  return (p && p.preguntas && p.preguntas[k]) ? p.preguntas[k] : [];
}
function datoDe(k){
  var p = PREG[String(S.esc)];
  return (p && p.dato && p.dato[k]) ? p.dato[k] : '';
}

/* =============================================================== RELOJ */
function queda(){
  return S.run ? Math.max(0, Math.round((S.endsAt - Date.now())/1000)) : Math.max(0, S.left|0);
}
function mmss(s){ s=Math.max(0,s|0); var m=Math.floor(s/60), q=s%60; return m+':'+(q<10?'0':'')+q; }
function arrancar(){ S.endsAt = Date.now() + (S.left|0)*1000; S.run = true; S.sono = false; guardar(); reloj(); }
function pausar(){ if(!S.run) return; S.left = queda(); S.run = false; guardar(); reloj(); }
function alternar(){ S.run ? pausar() : arrancar(); }
function reiniciar(){ S.left = min(S.i)*60; S.run = false; S.sono = false; guardar(); reloj(); }
function sumar(seg){
  S.left = queda() + seg;
  if(S.run) S.endsAt = Date.now() + S.left*1000;
  S.sono = false; guardar(); reloj();
}
function reloj(){
  var esPaso = (S.i >= 0 && S.i < PASOS.length);
  document.body.dataset.vista = S.i < 0 ? 'portada' : (esPaso ? 'consigna' : 'cierre');
  if(!esPaso){ id('reloj').textContent = '—'; id('barra').style.width = '0%'; return; }
  var s = queda(), tot = min(S.i)*60;
  id('reloj').textContent = mmss(s);
  id('paso-n').textContent = (S.i+1) + ' / ' + PASOS.length;
  id('paso-t').textContent = PASOS[S.i].t;
  id('b-play').textContent = S.run ? '⏸ Pausar' : '▶ Arrancar';
  var st = s <= 0 ? 'fin' : (s <= 30 ? 'rojo' : (s <= 120 ? 'ambar' : ''));
  id('reloj').className = st;
  id('barra').className = st;
  id('barra').style.width = (tot > 0 ? Math.max(0, Math.min(1, s/tot))*100 : 0) + '%';
}
var AUD = null;
function pito(n){
  try{
    if(!AUD) AUD = new (window.AudioContext || window.webkitAudioContext)();
    if(AUD.state === 'suspended') AUD.resume();
    for(var k=0;k<(n||3);k++){
      var o=AUD.createOscillator(), g=AUD.createGain(), t0=AUD.currentTime + k*0.28;
      o.type='sine'; o.frequency.setValueAtTime(k===2?660:880, t0);
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.22,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.22);
      o.connect(g); g.connect(AUD.destination); o.start(t0); o.stop(t0+0.24);
    }
  }catch(e){}
}
setInterval(function(){
  if(S.i < 0 || S.i >= PASOS.length) return;
  if(S.run && queda() <= 0 && !S.sono){
    S.sono = true; pito(3); aviso('Se cumplió el tiempo de esta consigna.');
  }
  reloj();
}, 250);

/* =============================================================== NAVEGACIÓN */
function ir(i){
  if(i < -1 || i > PASOS.length) return;
  S.i = i;
  if(i >= 0 && i < PASOS.length){ S.left = min(i)*60; S.run = false; S.sono = false; }
  guardar(); pinta(); reloj();
  id('main').scrollTop = 0;
}
function siguiente(){
  if(S.i >= 0 && S.i < PASOS.length) S.hecho[PASOS[S.i].k] = true;
  ir(Math.min(S.i + 1, PASOS.length));
}
function anterior(){ ir(Math.max(S.i - 1, -1)); }

/* =============================================================== SORTEO */
function equipos(){
  var nm = S.nombres ? S.nombres.split('\n').map(function(x){ return x.trim(); })
                                .filter(function(x){ return x; }) : [];
  var out = [];
  for(var i=0;i<S.equipos;i++) out.push(nm[i] || ('Equipo ' + (i+1)));
  return out;
}
function sortear(cuantos){
  cuantos = cuantos || 1;
  var eq = equipos();
  var libres = eq.filter(function(x){ return S.sorteados.indexOf(x) < 0; });
  if(libres.length < cuantos){ S.sorteados = []; libres = eq.slice(); }
  var v = id('sorteo-v'), s = id('sorteo-s'), b = id('sorteo-b');
  v.className = 'sorteo'; v.textContent = '—';
  s.textContent = 'Entre ' + libres.length + ' equipos que todavía no compartieron…';
  b.innerHTML = '';
  id('ov-sorteo').classList.add('on');
  var elegidos = [], pool = libres.slice();
  for(var k=0;k<cuantos;k++) elegidos.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  var c = 0;
  var iv = setInterval(function(){
    v.textContent = libres[Math.floor(Math.random()*libres.length)];
    if(++c >= 26){
      clearInterval(iv);
      v.textContent = elegidos.join('  ·  ');
      v.className = 'sorteo fin';
      S.sorteados = S.sorteados.concat(elegidos);
      guardar(); pito(2);
      s.textContent = 'Ya compartieron ' + S.sorteados.length + ' de ' + eq.length + ' equipos.';
      b.appendChild(btn('Cerrar','pri', function(){ id('ov-sorteo').classList.remove('on'); }));
      b.appendChild(btn('🎲 Sortear otro','', function(){ sortear(1); }));
      b.appendChild(btn('Reiniciar la lista','', function(){
        S.sorteados = []; guardar(); aviso('Vuelven a entrar todos los equipos en el sorteo.');
        id('ov-sorteo').classList.remove('on'); }));
    }
  }, 70);
}

/* =============================================================== DESCARGAS */
function bajar(nombre, mime, contenido){
  var b = new Blob([contenido], {type:mime}), u = URL.createObjectURL(b);
  var a = document.createElement('a'); a.href=u; a.download=nombre;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); }, 500);
}
function slug(t){
  return String(t||'equipo').normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40) || 'equipo';
}
function nl2br(t){ return esc(t).replace(/\n/g,'<br>'); }

<script>
"use strict";
/* ===============================================================
   MOTOR FINANCIERO
   Toma la planilla del equipo (S.fin) o un ejemplo resuelto y
   devuelve la matriz del flujo de fondos y los indicadores.
   =============================================================== */

var ACTIVOS = {
  depreciable:  {n:'Bien de capital depreciable',      c:'dep', d:'Vida útil mayor a dos años y se desvaloriza: vehículos, galpón, alambrado, equipos.'},
  nodepreciable:{n:'Bien de capital no depreciable',   c:'nod', d:'El suelo y todo lo que se le adosa como unidad inseparable: tierra, desmonte, nivelación.'},
  nominal:      {n:'Activo nominal (intangible)',      c:'nom', d:'Habilitaciones, patentes, capacitaciones, llave de negocio. No se deprecia.'},
  circulante:   {n:'Costo operativo adelantado',       c:'cir', d:'Capital de trabajo: salarios, insumos y combustible para arrancar la operación.'}
};
var GASTOS = {
  funcionamiento: {n:'Gasto de funcionamiento', c:'fun', d:'Alimento, semilla, jornales, salarios, combustible, servicios, insumos.'},
  mantenimiento:  {n:'Mantenimiento del capital', c:'man', d:'Conservación de lo que ya se incorporó en la inversión: vehículos, corrales, galpones, parques.'},
  comercializacion:{n:'Gasto de comercialización', c:'com', d:'Publicidad, salarios de venta, fletes, envases de despacho.'}
};

/* --------- escala: "0,6 · 0,85 · 1" → [0.6,0.85,1] --------- */
function parseEsc(s){
  if(!s) return null;
  if(Array.isArray(s)) return s.map(function(x){ return +x; });
  /* separadores: espacio, punto medio, punto y coma, barra o pleca.
     La coma NO separa: se usa como coma decimal (0,6 · 0,85 · 1). */
  var a = String(s).split(/[;·\/|]+|\s+/)
          .map(function(x){ return parseFloat(x.replace(/,/g,'.')); })
          .filter(function(x){ return isFinite(x); });
  return a.length ? a : null;
}
function escStr(a){
  if(!a || !a.length) return '';
  return a.map(function(x){ return String(x).replace('.',','); }).join(' · ');
}

/* --------- el cálculo --------- */
function calcular(F){
  var H = Math.max(1, Math.min(40, parseInt(F.H,10) || 10));
  var inv = (F.inv||[]), ope = (F.ope||[]), ing = (F.ing||[]), repo = (F.repo||[]);
  var I0 = inv.reduce(function(a,r){ return a + (+r.monto||0); }, 0);
  var CO = ope.reduce(function(a,r){ return a + (+r.monto||0); }, 0);
  var salv = +F.salv || 0;

  var vIng = [], vEgr = [], vFfn = [], vAcu = [], t;
  for(t=0; t<=H; t++){ vIng.push(0); vEgr.push(0); }
  vEgr[0] = I0;
  for(t=1; t<=H; t++) vEgr[t] = CO;
  repo.forEach(function(r){
    var p = parseInt(r.per,10);
    if(p >= 1 && p <= H) vEgr[p] += (+r.monto||0);
  });
  ing.forEach(function(it){
    var base = (+it.cant||0) * (+it.precio||0);
    var desde = Math.max(1, parseInt(it.desde,10) || 1);
    var e = parseEsc(it.esc);
    for(t = desde; t <= H; t++){
      var f = 1;
      if(e) f = (t-1 < e.length) ? e[t-1] : e[e.length-1];
      vIng[t] += base * f;
    }
  });
  if(salv) vIng[H] += salv;

  var ac = 0;
  for(t=0; t<=H; t++){
    vFfn.push(vIng[t] - vEgr[t]);
    ac += vFfn[t];
    vAcu.push(ac);
  }

  var i = ((+F.td.rf||0) + (+F.td.rp||0) + (+F.td.rpr||0)) / 100;
  var VAN = 0, VAB = 0, VACc = 0;
  for(t=0; t<=H; t++){
    var d = Math.pow(1+i, t);
    VAN  += vFfn[t]/d;
    VAB  += vIng[t]/d;
    VACc += vEgr[t]/d;
  }
  var RBC = VACc ? VAB/VACc : null;
  var TIR = tirDe(vFfn);
  var TRI = null;
  for(t=1; t<=H; t++){ if(vAcu[t] >= 0){ TRI = t; break; } }

  return {H:H, I0:I0, CO:CO, salv:salv, tmar:i,
          ing:vIng, egr:vEgr, ffn:vFfn, acu:vAcu,
          VAN:VAN, VAB:VAB, VACcost:VACc, VAC:VACc - VAB, RBC:RBC, TIR:TIR, TRI:TRI,
          hayIng: vIng.slice(0,H).some(function(x,k){ return k>0 && x>0; }) || (vIng[H]-salv)>0};
}
function vanDe(ffn, i){
  var v = 0;
  for(var t=0;t<ffn.length;t++) v += ffn[t]/Math.pow(1+i, t);
  return v;
}
function tirDe(ffn){
  var lo = -0.95, hi = 10, flo = vanDe(ffn, lo), fhi = vanDe(ffn, hi);
  if(!isFinite(flo) || !isFinite(fhi) || flo*fhi > 0) return null;
  for(var k=0;k<220;k++){
    var m = (lo+hi)/2, fm = vanDe(ffn, m);
    if(flo*fm <= 0){ hi = m; fhi = fm; } else { lo = m; flo = fm; }
  }
  return (lo+hi)/2;
}

/* --------- cargar el ejemplo resuelto del escenario en la planilla --------- */
function costePorCod(rec){
  var t = {};
  (rec||[]).forEach(function(r){ t[r.cod] = (t[r.cod]||0) + (+r.cant||0)*(+r.pu||0); });
  return t;
}
function esEvitado(s){ return /evitad|deja de|sustituc|sustitu/i.test(String(s||'')); }
function finDesdeFF(f){
  var cI = costePorCod(f.recI), cO = costePorCod(f.recO);
  return {
    tipo: f.tipo, periodo: f.periodo || 'año', H: f.horizonte, tc: (S.fin && S.fin.tc) || 1450,
    td: {rf: +f.td.rf, rp: +f.td.rp, rpr: +f.td.rpr},
    inv: (f.compI||[]).map(function(c){
      return {comp: c.comp, activo: c.activo, monto: Math.round((cI[c.cod]||0)*100)/100}; }),
    ope: (f.compO||[]).map(function(c){
      return {comp: c.comp, tipo: c.tipoFF, monto: Math.round((cO[c.cod]||0)*100)/100}; }),
    ing: ((f.ing && f.ing.aplica) ? f.ing.items : []).map(function(it){
      return {concepto: it.concepto, cant: +it.cant, precio: +it.precio,
              desde: it.desde || 1, esc: escStr(it.escala),
              clase: esEvitado(it.concepto) ? 'evitado' : 'venta'}; }),
    repo: [].concat.apply([], (f.repo||[]).map(function(r){
      return (r.periodos||[]).map(function(p){
        return {concepto: r.concepto, per: p, monto: +r.monto}; }); })),
    salv: (f.salv && +f.salv.monto) || 0
  };
}

/* --------- ingreso bruto anual por venta (para el ítem tributario) --------- */
function ingresoVenta(F){
  return (F.ing||[]).filter(function(it){ return it.clase !== 'evitado'; })
    .reduce(function(a,it){ return a + (+it.cant||0)*(+it.precio||0); }, 0);
}
function ingresoEvitado(F){
  return (F.ing||[]).filter(function(it){ return it.clase === 'evitado'; })
    .reduce(function(a,it){ return a + (+it.cant||0)*(+it.precio||0); }, 0);
}

/* ===============================================================

var SVGFF = "'Segoe UI',system-ui,Arial,Helvetica,sans-serif";
function svgEl(tag, at){
  var e = document.createElementNS('http://www.w3.org/2000/svg', tag);

function colTx(){ return document.documentElement.dataset.theme === 'light' ? '#3c554c' : '#b9cfc6'; }

/* barras de ingresos y egresos por período */
function grafBarras(R){
  var W = 980, Hh = 320, mL = 78, mR = 16, mT = 18, mB = 40;
  var n = R.H + 1, aW = W - mL - mR, aH = Hh - mT - mB;
  var maxV = 1;
  for(var t=0;t<n;t++) maxV = Math.max(maxV, R.ing[t], R.egr[t]);
  var s = svgEl('svg', {viewBox:'0 0 '+W+' '+Hh, class:'graf', preserveAspectRatio:'xMidYMid meet'});
  var g = svgEl('g', {}); s.appendChild(g);
  /* ejes */
  var pasos = 5;
  for(var q=0;q<=pasos;q++){
    var v = maxV*q/pasos, y = mT + aH - (v/maxV)*aH;
    g.appendChild(svgEl('line',{x1:mL,y1:y,x2:W-mR,y2:y,stroke:colLine(),'stroke-width':1}));
    var tl = svgEl('text',{x:mL-8,y:y+4,'text-anchor':'end','font-size':10.5,fill:colTx3(),'font-family':SVGFF});
    tl.textContent = fmt(v/1000,0)+'k'; g.appendChild(tl);
  }
  var bw = aW/n, gap = Math.min(7, bw*0.16), hw = (bw - gap*2)/2;
  for(t=0;t<n;t++){
    var x0 = mL + t*bw + gap/2;
    var hI = (R.ing[t]/maxV)*aH, hE = (R.egr[t]/maxV)*aH;
    if(R.ing[t] > 0) g.appendChild(svgEl('rect',{x:x0, y:mT+aH-hI, width:hw, height:Math.max(1,hI),
      fill:'#00c06a', rx:2, opacity:.92}));
    if(R.egr[t] > 0) g.appendChild(svgEl('rect',{x:x0+hw+1, y:mT+aH-hE, width:hw, height:Math.max(1,hE),
      fill:'#ef6a4b', rx:2, opacity:.92}));
    var lb = svgEl('text',{x:mL+t*bw+bw/2, y:Hh-mB+17,'text-anchor':'middle','font-size':11,
      fill: t===0 ? '#eda100' : colTx3(), 'font-weight': t===0?'800':'600','font-family':SVGFF});
    lb.textContent = t; g.appendChild(lb);
  }
  g.appendChild(svgEl('line',{x1:mL,y1:mT+aH,x2:W-mR,y2:mT+aH,stroke:colTx3(),'stroke-width':1.4}));
  var tt = svgEl('text',{x:mL, y:Hh-6,'font-size':10.5,fill:colTx3(),'font-family':SVGFF});
  tt.textContent = 'períodos'; g.appendChild(tt);
  return s;
}

/* flujo de fondos neto acumulado */
function grafAcum(R){
  var W = 980, Hh = 300, mL = 82, mR = 16, mT = 20, mB = 38;
  var n = R.H + 1, aW = W - mL - mR, aH = Hh - mT - mB;
  var mx = Math.max.apply(null, R.acu), mn = Math.min.apply(null, R.acu);
  if(mx === mn){ mx = mx + 1; mn = mn - 1; }
  var pad = (mx - mn)*0.08; mx += pad; mn -= pad;
  function Y(v){ return mT + aH - ((v - mn)/(mx - mn))*aH; }
  function X(t){ return mL + (n<=1 ? 0 : (t/(n-1))*aW); }
  var s = svgEl('svg', {viewBox:'0 0 '+W+' '+Hh, class:'graf', preserveAspectRatio:'xMidYMid meet'});
  var g = svgEl('g', {}); s.appendChild(g);
  var pasos = 5;
  for(var q=0;q<=pasos;q++){
    var v = mn + (mx-mn)*q/pasos, y = Y(v);
    g.appendChild(svgEl('line',{x1:mL,y1:y,x2:W-mR,y2:y,stroke:colLine(),'stroke-width':1}));
    var tl = svgEl('text',{x:mL-8,y:y+4,'text-anchor':'end','font-size':10.5,fill:colTx3(),'font-family':SVGFF});
    tl.textContent = fmt(v/1000,0)+'k'; g.appendChild(tl);
  }
  /* cero */
  if(mn < 0 && mx > 0){
    g.appendChild(svgEl('line',{x1:mL,y1:Y(0),x2:W-mR,y2:Y(0),stroke:'#eda100','stroke-width':1.6,'stroke-dasharray':'5 4'}));
  }
  var d = '', t;
  for(t=0;t<n;t++) d += (t===0?'M':'L') + X(t).toFixed(1) + ' ' + Y(R.acu[t]).toFixed(1) + ' ';
  var ar = d + 'L' + X(n-1).toFixed(1) + ' ' + Y(Math.max(mn,0)).toFixed(1) +
           ' L' + X(0).toFixed(1) + ' ' + Y(Math.max(mn,0)).toFixed(1) + ' Z';
  g.appendChild(svgEl('path',{d:ar, fill:'rgba(0,192,106,.13)', stroke:'none'}));
  g.appendChild(svgEl('path',{d:d, fill:'none', stroke:'#22c97f','stroke-width':2.6,
    'stroke-linejoin':'round','stroke-linecap':'round'}));
  for(t=0;t<n;t++){
    g.appendChild(svgEl('circle',{cx:X(t), cy:Y(R.acu[t]), r:3.4,
      fill: R.acu[t] >= 0 ? '#22c97f' : '#ef6a4b', stroke:'none'}));
    var lb = svgEl('text',{x:X(t), y:Hh-mB+17,'text-anchor':'middle','font-size':11,
      fill: (R.TRI === t) ? '#22c97f' : colTx3(), 'font-weight': (R.TRI===t)?'800':'600','font-family':SVGFF});
    lb.textContent = t; g.appendChild(lb);
  }
  if(R.TRI != null){
    g.appendChild(svgEl('line',{x1:X(R.TRI),y1:mT,x2:X(R.TRI),y2:mT+aH,stroke:'#22c97f',
      'stroke-width':1.3,'stroke-dasharray':'4 4',opacity:.7}));
    var rt = svgEl('text',{x:X(R.TRI)+6, y:mT+12,'font-size':11,fill:'#22c97f','font-weight':'800','font-family':SVGFF});
    rt.textContent = 'recupero'; g.appendChild(rt);
  }
  return s;
}

/* composición de la inversión por tipo de activo */
function grafTorta(items, mapa, titulo){
  var W = 430, Hh = 240, cx = 112, cy = 118, r = 86;
  var tot = items.reduce(function(a,x){ return a + x.v; }, 0);
  var s = svgEl('svg', {viewBox:'0 0 '+W+' '+Hh, class:'graf torta', preserveAspectRatio:'xMidYMid meet'});
  if(tot <= 0){
    var t0 = svgEl('text',{x:W/2,y:Hh/2,'text-anchor':'middle','font-size':13,fill:colTx3(),'font-family':SVGFF});
    t0.textContent = 'sin datos todavía'; s.appendChild(t0); return s;
  }
  var a0 = -Math.PI/2;
  items.forEach(function(x, k){
    var frac = x.v/tot, a1 = a0 + frac*Math.PI*2;
    var lg = frac > 0.5 ? 1 : 0;
    var d = 'M'+cx+' '+cy+' L'+(cx+r*Math.cos(a0)).toFixed(2)+' '+(cy+r*Math.sin(a0)).toFixed(2)+
            ' A'+r+' '+r+' 0 '+lg+' 1 '+(cx+r*Math.cos(a1)).toFixed(2)+' '+(cy+r*Math.sin(a1)).toFixed(2)+' Z';
    s.appendChild(svgEl('path',{d:d, fill:x.c, opacity:.92, stroke:'rgba(0,0,0,.25)','stroke-width':1}));
    a0 = a1;
    var y = 30 + k*26;
    s.appendChild(svgEl('rect',{x:232, y:y-9, width:12, height:12, rx:3, fill:x.c}));
    var tl = svgEl('text',{x:250, y:y+1,'font-size':11.5,fill:colTx(),'font-family':SVGFF});
    tl.textContent = x.n; s.appendChild(tl);
    var tv = svgEl('text',{x:250, y:y+14,'font-size':10.5,fill:colTx3(),'font-family':SVGFF});
    tv.textContent = fmtM(x.v) + '  ·  ' + fmt(frac*100,1) + ' %'; s.appendChild(tv);
  });
  s.appendChild(svgEl('circle',{cx:cx, cy:cy, r:r*0.52, fill: document.documentElement.dataset.theme==='light' ? '#fff' : '#0e2019'}));
  var c1 = svgEl('text',{x:cx, y:cy-2,'text-anchor':'middle','font-size':15,fill:colTx(),'font-weight':'800','font-family':SVGFF});
  c1.textContent = fmt(tot/1000,0)+'k'; s.appendChild(c1);
  var c2 = svgEl('text',{x:cx, y:cy+14,'text-anchor':'middle','font-size':10,fill:colTx3(),'font-family':SVGFF});
  c2.textContent = titulo || 'U$S'; s.appendChild(c2);
  return s;
}

/* sensibilidad del VAN a la tasa */
function grafTasa(F){
  var W = 980, Hh = 250, mL = 82, mR = 16, mT = 18, mB = 38;
  var aW = W - mL - mR, aH = Hh - mT - mB;
  var R0 = calcular(F), pts = [], k;
  for(k=0; k<=40; k++){
    var i = k/100;                       /* 0 % a 40 % */
    pts.push({i:i, v: vanDe(R0.ffn, i)});
  }
  var mx = Math.max.apply(null, pts.map(function(p){ return p.v; }));
  var mn = Math.min.apply(null, pts.map(function(p){ return p.v; }));
  if(mx === mn){ mx += 1; mn -= 1; }
  var pad = (mx-mn)*0.08; mx += pad; mn -= pad;
  function Y(v){ return mT + aH - ((v-mn)/(mx-mn))*aH; }
  function X(i){ return mL + (i/0.40)*aW; }
  var s = svgEl('svg', {viewBox:'0 0 '+W+' '+Hh, class:'graf', preserveAspectRatio:'xMidYMid meet'});
  for(k=0;k<=5;k++){
    var v = mn + (mx-mn)*k/5, y = Y(v);
    s.appendChild(svgEl('line',{x1:mL,y1:y,x2:W-mR,y2:y,stroke:colLine(),'stroke-width':1}));
    var tl = svgEl('text',{x:mL-8,y:y+4,'text-anchor':'end','font-size':10.5,fill:colTx3(),'font-family':SVGFF});
    tl.textContent = fmt(v/1000,0)+'k'; s.appendChild(tl);
  }
  if(mn < 0 && mx > 0)
    s.appendChild(svgEl('line',{x1:mL,y1:Y(0),x2:W-mR,y2:Y(0),stroke:'#eda100','stroke-width':1.6,'stroke-dasharray':'5 4'}));
  var d = '';
  pts.forEach(function(p,j){ d += (j===0?'M':'L') + X(p.i).toFixed(1) + ' ' + Y(p.v).toFixed(1) + ' '; });
  s.appendChild(svgEl('path',{d:d, fill:'none', stroke:'#39b6d8','stroke-width':2.6,'stroke-linejoin':'round'}));
  for(k=0;k<=8;k++){
    var ii = k*0.05;
    var lb = svgEl('text',{x:X(ii), y:Hh-mB+17,'text-anchor':'middle','font-size':11,fill:colTx3(),'font-family':SVGFF});
    lb.textContent = (k*5)+'%'; s.appendChild(lb);
  }
  /* la TMAR del equipo */
  if(R0.tmar <= 0.40){
    s.appendChild(svgEl('line',{x1:X(R0.tmar),y1:mT,x2:X(R0.tmar),y2:mT+aH,stroke:'#22c97f','stroke-width':1.8,'stroke-dasharray':'4 4'}));
    var t1 = svgEl('text',{x:X(R0.tmar)+6, y:mT+12,'font-size':11,fill:'#22c97f','font-weight':'800','font-family':SVGFF});
    t1.textContent = 'TMAR ' + fmt(R0.tmar*100,0) + ' %'; s.appendChild(t1);
  }
  /* la TIR */
  if(R0.TIR != null && R0.TIR > 0 && R0.TIR <= 0.40){
    s.appendChild(svgEl('line',{x1:X(R0.TIR),y1:mT,x2:X(R0.TIR),y2:mT+aH,stroke:'#ef6a4b','stroke-width':1.8,'stroke-dasharray':'4 4'}));
    var t2 = svgEl('text',{x:X(R0.TIR)+6, y:mT+28,'font-size':11,fill:'#ef6a4b','font-weight':'800','font-family':SVGFF});
    t2.textContent = 'TIR ' + fmt(R0.TIR*100,1) + ' %'; s.appendChild(t2);
  }
  return s;
}
</script>
<script>
"use strict";
/* ===============================================================
   Generador de .xlsx nativo, sin librerías externas.
   Escribe un ZIP (entradas sin comprimir) con el mínimo OOXML que
   Excel, LibreOffice y Google Sheets abren igual.
   =============================================================== */

/* ---------- CRC32 ---------- */
var CRCT = (function(){
  var t = new Uint32Array(256);
  for(var n=0;n<256;n++){
    var c = n;
    for(var k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(buf){
  var c = 0xFFFFFFFF;
  for(var i=0;i<buf.length;i++) c = CRCT[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
var ENC = new TextEncoder();
function u8(s){ return ENC.encode(s); }

/* ---------- ZIP sin compresión ---------- */
function zipStore(files){
  /* files: [{name, data:Uint8Array}] */
  var parts = [], central = [], off = 0;
  function n16(v){ return [v & 255, (v >>> 8) & 255]; }
  function n32(v){ return [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255]; }
  files.forEach(function(f){
    var nm = u8(f.name), c = crc32(f.data), sz = f.data.length;
    var lh = [].concat([0x50,0x4b,0x03,0x04], n16(20), n16(0x0800), n16(0), n16(0), n16(0),
                       n32(c), n32(sz), n32(sz), n16(nm.length), n16(0));
    parts.push(new Uint8Array(lh), nm, f.data);
    central.push({nm:nm, c:c, sz:sz, off:off});
    off += lh.length + nm.length + sz;
  });
  var cdStart = off, cdLen = 0;
  central.forEach(function(e){
    var ch = [].concat([0x50,0x4b,0x01,0x02], n16(20), n16(20), n16(0x0800), n16(0), n16(0), n16(0),
                       n32(e.c), n32(e.sz), n32(e.sz), n16(e.nm.length),
                       n16(0), n16(0), n16(0), n16(0), n32(0), n32(e.off));
    parts.push(new Uint8Array(ch), e.nm);
    cdLen += ch.length + e.nm.length;
  });
  var eo = [].concat([0x50,0x4b,0x05,0x06], n16(0), n16(0), n16(central.length), n16(central.length),
                     n32(cdLen), n32(cdStart), n16(0));
  parts.push(new Uint8Array(eo));
  var total = parts.reduce(function(a,p){ return a + p.length; }, 0);
  var out = new Uint8Array(total), pos = 0;
  parts.forEach(function(p){ out.set(p, pos); pos += p.length; });
  return out;
}

/* ---------- utilidades de hoja ---------- */
function colName(i){
  var s = '';
  i = i + 1;
  while(i > 0){ var r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); }
  return s;
}
function xml(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&apos;')
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
}
/* estilos: 0 normal · 1 encabezado · 2 texto ajustado · 3 número ·
   4 barra inversión · 5 barra operación · 6 barra crítica · 7 etiqueta en negrita */
var XSTY =
 '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
 '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
 '<fonts count="3">'+
   '<font><sz val="10"/><name val="Calibri"/></font>'+
   '<font><b/><sz val="10"/><color rgb="FF0E5C3A"/><name val="Calibri"/></font>'+
   '<font><b/><sz val="10"/><name val="Calibri"/></font>'+
 '</fonts>'+
 '<fills count="6">'+
   '<fill><patternFill patternType="none"/></fill>'+
   '<fill><patternFill patternType="gray125"/></fill>'+
   '<fill><patternFill patternType="solid"><fgColor rgb="FFEEF4F1"/><bgColor indexed="64"/></patternFill></fill>'+
   '<fill><patternFill patternType="solid"><fgColor rgb="FFEDA100"/><bgColor indexed="64"/></patternFill></fill>'+
   '<fill><patternFill patternType="solid"><fgColor rgb="FF39B6D8"/><bgColor indexed="64"/></patternFill></fill>'+
   '<fill><patternFill patternType="solid"><fgColor rgb="FFEF6A4B"/><bgColor indexed="64"/></patternFill></fill>'+
 '</fills>'+
 '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>'+
   '<border><left style="thin"><color rgb="FFD8E2DE"/></left><right style="thin"><color rgb="FFD8E2DE"/></right>'+
   '<top style="thin"><color rgb="FFD8E2DE"/></top><bottom style="thin"><color rgb="FFD8E2DE"/></bottom><diagonal/></border></borders>'+
 '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
 '<cellXfs count="8">'+
   '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'+
   '<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>'+
   '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>'+
   '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="top" horizontal="right"/></xf>'+
   '<xf numFmtId="0" fontId="0" fillId="3" borderId="1" xfId="0" applyFill="1" applyBorder="1"/>'+
   '<xf numFmtId="0" fontId="0" fillId="4" borderId="1" xfId="0" applyFill="1" applyBorder="1"/>'+
   '<xf numFmtId="0" fontId="0" fillId="5" borderId="1" xfId="0" applyFill="1" applyBorder="1"/>'+
   '<xf numFmtId="0" fontId="2" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>'+
 '</cellXfs>'+
 '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';

function hojaXML(filas, anchos, congelar){
  var cols = '';
  if(anchos && anchos.length){
    cols = '<cols>' + anchos.map(function(w, i){
      return '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>';
    }).join('') + '</cols>';
  }
  var rows = filas.map(function(r, ri){
    var cells = r.map(function(c, ci){
      if(c == null || c === '') return '';
      var ref = colName(ci) + (ri + 1);
      var st = 0, v = c, num = false;
      if(typeof c === 'object'){ st = c.s || 0; v = (c.v == null ? '' : c.v); num = !!c.n; }
      else { st = (ri === 0) ? 1 : 2; }
      if(v === '' && st) return '<c r="'+ref+'" s="'+st+'"/>';
      if(num || (typeof v === 'number')) return '<c r="'+ref+'" s="'+(st||3)+'"><v>'+v+'</v></c>';
      return '<c r="'+ref+'" s="'+st+'" t="inlineStr"><is><t xml:space="preserve">'+xml(v)+'</t></is></c>';
    }).join('');
    return '<row r="'+(ri+1)+'">'+cells+'</row>';
  }).join('');
  var panes = congelar ? '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' : '';
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    panes + cols + '<sheetData>' + rows + '</sheetData></worksheet>';
}

/* hojas: [{nombre, filas, anchos}] */
function xlsxBuild(hojas){
  var files = [];
  files.push({name:'[Content_Types].xml', data: u8(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+
    hojas.map(function(_,i){
      return '<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
    }).join('')+'</Types>')});
  files.push({name:'_rels/.rels', data: u8(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'+
    '</Relationships>')});
  files.push({name:'xl/workbook.xml', data: u8(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '+
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+
    hojas.map(function(h,i){
      return '<sheet name="'+xml(h.nombre.slice(0,31))+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>';
    }).join('')+'</sheets></workbook>')});
  files.push({name:'xl/_rels/workbook.xml.rels', data: u8(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    hojas.map(function(_,i){
      return '<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>';
    }).join('')+
    '<Relationship Id="rId'+(hojas.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'+
    '</Relationships>')});
  files.push({name:'xl/styles.xml', data: u8(XSTY)});
  hojas.forEach(function(h, i){
    files.push({name:'xl/worksheets/sheet'+(i+1)+'.xml',
                data: u8(hojaXML(h.filas, h.anchos, true))});
  });
  return zipStore(files);
}
</script>

 ph:'RESUMEN NARRATIVO DE LOS COSTOS DE INVERSIÓN\n\n'},

{k:'valO', min:14, item:'Guía 03 · ítem C', t:'Ponerle precio a la operación', herr:'ope', ejem:'valO',
 consigna:'Lo mismo para la etapa operativa, con una diferencia decisiva: de los <strong>bienes de capital que ya entraron por la inversión</strong> sólo se consignan sus gastos de funcionamiento y de mantenimiento, nunca su valor.',
 guia:'<p class="sub">En la operación se pone a disposición de la sociedad el bien o el servicio. Se cuenta con todo el capital incorporado en la inversión, más el circulante necesario para que el proceso funcione.</p>'+
   '<div class="box mal mt"><span class="et">El error más común de todo el formulario</span>'+
   '<p class="sub">Volver a valorar en la operación un bien que ya se pagó en la inversión. La Guía es explícita: cuando se usan recursos adquiridos durante la inversión, <b>no se consigna el valor del equipo</b>, sino sus gastos de funcionamiento: pilas para las linternas, electricidad para recargar la balanza, aceite y filtros del motor, repuestos.</p></div>'+
   '<h4 class="mt">Los tres tipos de gasto operativo</h4>'+
   '<ul class="gl">'+
   '<li><b>Gastos de funcionamiento</b> (circulante): alimento, semilla, jornales, salarios, combustible, servicios, insumos.</li>'+
   '<li><b>Gastos de mantenimiento del capital</b>: mantenimiento de vehículos, de corrales, limpieza de galpones, parques y jardines. El objetivo es conservar el capital instalado.</li>'+
   '<li><b>Gastos de comercialización</b>: publicidad, salarios de venta, combustibles, servicios, fletes.</li>'+
   '</ul>'+
   '<div class="box info mt"><span class="et">El período importa</span><p class="sub">El costo de la componente operativa corresponde al período que el equipo definió. Si el período es el año, ese número es el costo de un año de operación, y se repite en los siguientes mientras no cambie nada en las acciones o las tareas: trabajamos con flujos libres de riesgo.</p></div>'+
   '<div class="box mt"><span class="et">El ejemplo de la Guía</span><p class="tiny">En la acción «Recolectar caracoles adultos para comercialización» la tableta digital y la balanza figuran con precio unitario en blanco: ya se pagaron en la inversión. Lo que se consigna son las pilas, la electricidad de recarga y el mantenimiento de los caminos internos. La componente «Recolección de caracoles lograda» cuesta U$S 1.159 al año.</p></div>',
 criterio:'Ningún bien de capital de la inversión aparece con su valor en la operación, y cada componente está clasificada en uno de los tres tipos de gasto.',
 ph:'COMPONENTE · TIPO DE GASTO · COSTO POR PERÍODO\n\nBienes de capital que sólo aparecen por su funcionamiento o mantenimiento:\n\nSupuestos adoptados:'},

{k:'narrO', min:8, item:'Guía 03 · ítem C', t:'La memoria de cálculo de la operación', herr:'resO', ejem:'narrO',
 consigna:'Escriban el <strong>resumen narrativo</strong> de los costos de operación: cuál es el más importante del período, qué incidencia tiene la mano de obra y cómo se determinaron los recursos.',
 guia:'<h4>Lo que el equipo tiene que preguntarse</h4>'+
   '<ul class="gl">'+
   '<li>¿Cuál es el costo operativo más importante dentro del período considerado?</li>'+
   '<li>¿Cuál es la incidencia de la mano de obra en el costo operativo total?</li>'+
   '<li>¿Hay relación entre la dimensión de los costos operativos y el proceso productivo descripto en el F02?</li>'+
   '<li>¿Las tareas son continuas, periódicas, aperiódicas, concentradas en ciertas épocas del año, o discontinuas?</li>'+
   '</ul>'+
   '<div class="box mt"><span class="et">El ejemplo de la Guía</span><p class="tiny">«Para la acción operativa de mantener un motor de lancha, que tiene como componente Motor de lancha mantenido, se requiere una serie de tareas periódicas: mantenimiento básico U$S 400; reemplazo de piezas U$S 300; revisión del sistema de combustible U$S 300; revisión del sistema eléctrico U$S 200; revisión del sistema de refrigeración U$S 250. Todas se realizan una vez al año, todos los años del horizonte. El costo total de la acción se estimó en U$S 1.450 al año.»</p></div>'+
   '<div class="box warn mt"><span class="et">Ojo con la mano de obra</span><p class="sub">Se consignan las <b>horas efectivas trabajadas</b> para lograr la componente de cada tarea. Si las tareas tienen secuenciación fin-comienzo, pueden ser realizadas por el mismo operario y no hace falta multiplicar el personal.</p></div>',
 criterio:'Un párrafo que identifica el costo operativo dominante, la incidencia de la mano de obra y la coherencia con el proceso productivo.',
 ph:'RESUMEN NARRATIVO DE LOS COSTOS DE OPERACIÓN\n\n'},

{k:'ing', min:10, item:'Guía 03 · ítem D', t:'La componente positiva', herr:'ing', ejem:'ing',
 consigna:'Determinen el <strong>ingreso del proyecto</strong>: cantidad producida por período multiplicada por el precio de mercado, y en qué momento del tiempo se registra. Si el proyecto no tiene ingresos directos, escriban NO APLICA y justifiquen por qué.',
 guia:'<h4>Las dos variables</h4>'+
   '<ul class="gl">'+
   '<li><b>Cantidad.</b> Cuánto bien o servicio se produce y se ofrece en un período. Sale del dimensionamiento óptimo del F02: depende de la capacidad instalada, en relación directa con la inversión realizada.</li>'+
   '<li><b>Precio.</b> El precio de mercado al que se ofrecerá el bien o servicio, relevado del estudio de mercado.</li>'+
   '</ul>'+
   '<div class="box mt"><span class="et">El ejemplo de la Guía</span><p class="tiny">Planta procesadora de granza de PET: 4 toneladas por día durante 250 días al año, a U$S 2,50 el kilogramo. El ingreso bruto es de <b>2.500.000 U$S por año</b>, una suma uniforme y periódica porque se considera inexistente el riesgo.</p></div>'+
   '<h4 class="mt">Cuándo se registra</h4>'+
   '<p class="sub">Hay que marcar si los ingresos se registran en el tiempo 0 o desde el tiempo 1 hasta el horizonte. Lo habitual es que se verifiquen con regularidad desde T1, generando un flujo periódico.</p>'+
   '<div class="box info mt"><span class="et">Proyectos sin ingresos directos</span><p class="sub">Escriben NO APLICA en la tabla y en la justificación técnica y de mercado. Pero <b>igual tienen que justificar cómo dimensionaron</b> la cantidad de bienes o servicios que el proyecto le suministra a la sociedad.</p></div>'+
   '<div class="box warn mt"><span class="et">El costo evitado</span><p class="sub">Un ahorro entra al flujo del lado positivo, porque es una salida de dinero que deja de ocurrir. No es una venta: no hay cliente ni factura, y por eso no constituye ingreso bruto a los fines tributarios. Se valora al precio de la fuente que sustituye.</p></div>',
 criterio:'Hay una cantidad, un precio y un momento, o hay un NO APLICA justificado. La magnitud es coherente con la capacidad instalada del F02.',
 ph:'CONCEPTO · CANTIDAD · UNIDAD · PRECIO · MOMENTO (T0 o T1-Tn)\n\nJUSTIFICACIÓN TÉCNICA Y DE MERCADO DEL INGRESO ESTIMADO:\n'},

{k:'benef', min:6, item:'Guía 03 · ítem D', t:'El beneficio económico', herr:null, ejem:'benef',
 consigna:'Justifiquen el <strong>beneficio económico</strong> del proyecto: a quiénes beneficia, cuántos son, qué se les entrega. Esto se completa <strong>siempre</strong>, tenga el proyecto ingresos o no.',
 guia:'<div class="box warn"><span class="et">La distinción central del ítem D</span>'+
   '<p class="sub">El <b>ingreso</b> es el dinero que entra al proyecto. El <b>beneficio económico</b> es el incremento del bienestar de la sociedad. Coinciden solamente bajo competencia perfecta, sin distorsiones ni externalidades, cuando la utilidad marginal del consumo iguala al costo marginal de producción. En el mundo real casi nunca coinciden.</p></div>'+
   '<div class="box mt"><span class="et">El ejemplo de la Guía</span><p class="tiny">Un proyecto que vende granza de PET: el <b>ingreso</b> son las toneladas producidas por el precio de mercado. El <b>beneficio económico</b> es la mejora en el bienestar de los consumidores de granza por tener acceso al producto dentro de sus procesos productivos, medida con los indicadores marshallianos o hicksianos que correspondan.</p>'+
   '<p class="tiny mt">Un proyecto de arbolado urbano no tiene ingresos por ventas, y sin embargo tiene beneficio económico: el incremento del bienestar de la población con la incorporación del arbolado, financiado indirectamente con los impuestos y las tasas municipales.</p></div>'+
   '<h4 class="mt">Las preguntas de la Guía</h4>'+
   '<ul class="gl">'+
   '<li>¿A quiénes beneficia el proyecto?</li>'+
   '<li>¿Cuántos son los beneficiados?</li>'+
   '<li>¿Qué bien o servicio le ofrecemos a la sociedad?</li>'+
   '<li>¿Podemos cuantificar la cantidad entregada, aunque todavía no podamos valorarla?</li>'+
   '</ul>'+
   '<p class="tiny mt">En próximas entregas habrá que cuantificar la magnitud de estos beneficios. Acá se identifican y se dimensionan en unidades físicas.</p>',
 criterio:'Se distingue con claridad el ingreso monetario del beneficio económico, y el beneficio está dimensionado en unidades físicas aunque no en dinero.',
 ph:'JUSTIFICACIÓN DEL BENEFICIO ECONÓMICO DEL PROYECTO\n\n¿A quiénes beneficia?\n\n¿Cuántos son?\n\n¿Qué reciben?\n\nPor qué no es lo mismo que el ingreso:'},

{k:'neg', min:6, item:'Guía 03 · ítem E', t:'La componente negativa y su lugar en el tiempo', herr:'repo', ejem:'neg',
 consigna:'Identifiquen <strong>qué ítems negativos</strong> tiene el flujo y <strong>en qué período se registra cada uno</strong>. Marquen especialmente las inversiones que ocurren durante la operación: reposiciones y capacitaciones.',
 guia:'<h4>De la inversión</h4>'+
   '<ul class="gl">'+
   '<li>Bienes de capital depreciables: alambrado, galpón, tractor, motosierra, equipos de medición.</li>'+
   '<li>Bienes de capital no depreciables: nivelación, desmonte.</li>'+
   '<li>Activos nominales: capacitación, patentes.</li>'+
   '<li>Costos operativos adelantados o capital de trabajo: salarios, materias primas, combustible.</li>'+
   '</ul>'+
   '<h4 class="mt">De la operación</h4>'+
   '<ul class="gl">'+
   '<li>Costos operativos directos: salarios, materias primas, insumos de producción.</li>'+
   '<li>Costos de mantenimiento del capital.</li>'+
   '<li>Costos de comercialización.</li>'+
   '</ul>'+
   '<div class="box info mt"><span class="et">La convención de fin de período</span><p class="sub">Todo movimiento de dinero dentro de un período se registra <b>al cierre</b>. Si una acción implica un movimiento cada dos meses y el período es anual, los seis registros bimestrales se ubican al final del año.</p></div>'+
   '<div class="box warn mt"><span class="et">Lo que no va en el período 0</span><p class="sub">Las inversiones de reposición de bienes de capital y las capacitaciones que ocurren durante la operación se registran <b>en el período en que ocurren</b>. Es un error frecuente empujarlas al período 0 para simplificar.</p></div>',
 criterio:'Cada ítem negativo tiene su período. Las reposiciones y capacitaciones de la operación están en el período en que ocurren, no en el 0.',
 ph:'COMPONENTE NEGATIVA · T0 · T1-Tn\n\nInversiones durante la operación (concepto, período, monto):\n\nValor de salvamento al final del horizonte:'},

{k:'hor', min:6, item:'Guía 03 · ítem F', t:'El horizonte del proyecto', herr:'hor', ejem:'hor',
 consigna:'Definan el <strong>horizonte o vida útil</strong>: cuántos períodos va a durar la evaluación, y por qué ese número y no otro.',
 guia:'<p class="sub">El horizonte no es necesariamente el fin de la vida del proyecto: es el tiempo que el equipo fija para la evaluación posterior.</p>'+
   '<h4 class="mt">Proyectos con ingresos directos</h4>'+
   '<p class="sub">Se puede preguntar si el proyecto es eficiente financieramente dentro del horizonte considerado, y si aumentando el horizonte se vuelve viable. La bibliografía recomienda estimar primero el <b>Tiempo de Recupero de la Inversión</b> y después fijar el horizonte tres a cinco años más allá.</p>'+
   '<h4 class="mt">Proyectos públicos</h4>'+
   '<p class="sub">El horizonte está vinculado a la magnitud de los beneficios económicos, que todavía no conocemos. Se sugiere un horizonte para una primera evaluación financiera y para estimar el VAC, dejando planteada la pregunta: ¿en ese horizonte los beneficios económicos pueden cubrir los costos de inversión, los operativos y el costo de oportunidad social?</p>'+
   '<div class="box mal mt"><span class="et">La tentación</span><p class="sub">Estirar el horizonte hasta que el VAN cambie de signo no es una decisión técnica. El horizonte se justifica por la vida útil de los bienes principales, por el ciclo del programa que se abastece o por el recupero, nunca por el resultado que uno quiere obtener.</p></div>',
 criterio:'El número de períodos tiene un argumento técnico verificable y no excede la vida útil de los bienes que mandan.',
 ph:'Horizonte adoptado (cantidad de períodos):\n\nCriterio que lo fija:\n\nTiempo de recupero estimado (si corresponde):\n\nVidas útiles de los bienes principales:'},

{k:'ff', min:10, item:'Guía 03 · ítem G', t:'La matriz del flujo de fondos', herr:'ff', ejem:'ff',
 consigna:'Armen la <strong>matriz del flujo de fondos</strong> y sumen algebraicamente cada columna para obtener el <strong>flujo de fondos neto</strong>. Después escriban qué observan en él.',
 guia:'<p class="sub">Con el ítem D tienen las variables del ingreso y el momento en que se registran. Con el ítem E, las componentes negativas y su ubicación temporal. Ahora se organiza todo en una matriz temporal, del tiempo 0 al horizonte.</p>'+
   '<h4 class="mt">La matriz mínima</h4>'+
   '<p class="sub">Filas de ingresos, un total; filas de egresos, un total; y la fila del <b>FFN</b>, que es la suma algebraica de cada columna. Cada equipo puede desagregar las componentes como prefiera. En proyectos públicos no hay filas de ingreso y la matriz es mucho más sencilla.</p>'+
   '<h4 class="mt">Lo que hay que mirar</h4>'+
   '<ul class="gl">'+
   '<li>¿Qué relación hay entre la inversión y el costo operativo de un período?</li>'+
   '<li>¿Superan los ingresos a los costos, y desde qué período?</li>'+
   '<li>¿Los costos de inversión guardan proporción con el problema a resolver?</li>'+
   '<li>¿En qué período el acumulado cambia de signo, si es que lo hace?</li>'+
   '</ul>'+
   '<div class="box info mt"><span class="et">Flujo libre de riesgo</span><p class="sub">La componente de costos operativos de un período se repite en los siguientes mientras no cambie nada en las acciones o tareas. La incorporación del riesgo queda para etapas avanzadas de la formulación.</p></div>',
 criterio:'La matriz cierra, el FFN está sumado período por período y hay un párrafo que dice qué se observa.',
 ph:'RESUMEN NARRATIVO DE LO OBSERVADO EN EL FLUJO DE FONDOS\n\n'},

{k:'td', min:6, item:'Guía 03 · ítem H', t:'La tasa de descuento (TD)', herr:'td', ejem:'td',
 consigna:'Determinen la <strong>tasa de descuento (TD)</strong> que van a usar y describan el procedimiento con el que llegaron a ella.',
 guia:'<p class="sub">Todos los criterios de evaluación trabajan sobre flujos descontados. La <b>TD</b> representa el <b>costo de oportunidad del inversor</b>; la <b>TMAR</b> es el procedimiento con el que se estima. Es un mismo número con dos nombres.</p>'+
   '<h4 class="mt">La TMAR se arma con tres partes</h4>'+
   '<ul class="gl">'+
   '<li><b>Tasa libre de riesgo:</b> 3 a 5 %, según bonos del Tesoro de los Estados Unidos.</li>'+
   '<li><b>Riesgo país:</b> 8 a 12 % para la Argentina, según el índice de JP Morgan.</li>'+
   '<li><b>Prima por riesgo del proyecto:</b> 5 a 15 %, según el sector, el tamaño y la incertidumbre.</li>'+
   '</ul>'+
   '<div class="box warn mt"><span class="et">La moneda manda</span><p class="sub">La tasa tiene que respetar la moneda del flujo. Con tasas de referencia en dólares, la evaluación se hace en moneda dura. Si los flujos están en pesos, la tasa debe incorporar la inflación esperada y la TMAR nominal resulta bastante más alta.</p></div>'+
   '<div class="box info mt"><span class="et">El contexto que la Guía señala</span><p class="sub">Formulamos sin incorporar el riesgo de la inversión. En la Argentina la principal componente de riesgo sobre los flujos es el proceso inflacionario: el relevamiento de expectativas ubica los escenarios de 2026 en torno al 30 %, con dispersión significativa entre agentes. Esa heterogeneidad refleja incertidumbre macroeconómica y debe incorporarse explícitamente.</p></div>',
 criterio:'La tasa tiene sus tres componentes explicitadas, con fuente, y la prima del proyecto está argumentada por sector.',
 ph:'Tasa libre de riesgo:            % — fuente:\nRiesgo país:                    % — fuente:\nPrima por riesgo del proyecto:  % — por qué:\n\nTMAR resultante:                %\n\nMoneda del flujo:'},

{k:'ind', min:10, item:'Guía 03 · ítem I', t:'Los indicadores financieros', herr:'ind', ejem:'ind',
 consigna:'Calculen los <strong>indicadores que corresponden a su tipo de proyecto</strong> y escriban una conclusión parcial para cada uno.',
 guia:'<h4>Cuáles corresponden</h4>'+
   '<ul class="gl">'+
   '<li><b>Proyectos privados</b>, con ingresos directos: VAN, TIR y RBC.</li>'+
   '<li><b>Proyectos públicos</b>, sin ingresos directos: VAC, el Valor Actualizado de Costos.</li>'+
   '</ul>'+
   '<div class="box info mt"><span class="et">Cómo se calcula en Excel</span><p class="sub">En Fórmulas → Insertar función, VNA y TIR. Para el VNA, incorporen <b>solamente los flujos netos desde t1 hasta el horizonte</b>, y después súmenle el costo de inversión del t0. Presten atención a los signos: los flujos de los años operativos suelen ser positivos y la inversión es negativa.</p>'+
   '<p class="sub mt">Para proyectos sin ingresos el procedimiento es el mismo, pero todos los flujos son negativos: se calcula el VNA de los costos de t1 al horizonte y se le agrega el costo de inversión para obtener el VAC.</p></div>'+
   '<div class="box warn mt"><span class="et">Cuándo no hay TIR</span><p class="sub">La TIR es la tasa que hace cero el valor actual del flujo. Si el flujo neto <b>nunca cambia de signo</b> —todos los períodos negativos, como en los proyectos públicos— no existe ninguna tasa que lo anule: no hay TIR, y forzarla es un error.</p></div>'+
   '<p class="tiny mt">La RBC compara el valor actual de los beneficios con el de los costos. Mayor que uno significa que, descontado, cada peso de costo devuelve más de un peso de beneficio monetario.</p>',
 criterio:'Están calculados los indicadores que corresponden —y sólo esos—, cada uno con su conclusión parcial.',
 ph:'INDICADOR · VALOR · CONCLUSIÓN PARCIAL\n\nVAN:\n\nTIR:\n\nRBC:\n\nVAC:'},

{k:'trib', min:5, item:'Guía 03 · ítem J', t:'La categoría tributaria', herr:'trib', ejem:'trib',
 consigna:'Sólo para proyectos privados: observen el <strong>ingreso bruto anual</strong> del proyecto y determinen en qué categoría se enrola, con el monto del impuesto que deberá afrontar.',
 guia:'<p class="sub">Todo proyecto de inversión privada está inmerso en un sistema económico y sujeto a reglas fiscales. La Agencia de Recaudación y Control Aduanero regula los aspectos tributarios.</p>'+
   '<h4 class="mt">Cómo se resuelve</h4>'+
   '<ul class="gl">'+
   '<li>Se observa el <b>monto del ingreso periódico</b>. Si el período no es anual, se anualiza.</li>'+
   '<li>A los fines académicos se considera <b>sólo la variable ingresos brutos anuales</b>. No es la única variable real, pero alcanza para este ejercicio.</li>'+
   '<li>Se define si el proyecto es <b>responsable inscripto</b> o <b>monotributista</b>, y en este último caso en qué categoría.</li>'+
   '<li>El monotributista paga un monto fijo mensual según el nivel de ingresos brutos anuales. El responsable inscripto paga un porcentaje sobre las ganancias anuales registradas.</li>'+
   '</ul>'+
   '<div class="box warn mt"><span class="et">Lo que no es ingreso bruto</span><p class="sub">Un <b>costo evitado</b> mejora el resultado del titular pero no se factura: no constituye ingreso bruto ni genera hecho imponible. Si la componente positiva del proyecto es enteramente un ahorro, el ingreso bruto atribuible al proyecto es cero.</p></div>'+
   '<p class="tiny mt">Las escalas del régimen simplificado se actualizan periódicamente: hay que consultarlas en la página oficial al momento de completar el formulario. En proyectos públicos el ítem no aplica, pero conviene justificar por qué en lugar de dejarlo en blanco.</p>',
 criterio:'El ingreso bruto anual está anualizado y sólo incluye ventas, la categoría está identificada y el monto del impuesto estimado.',
 ph:'INGRESOS BRUTOS ANUALES DEL PROYECTO:\n\nCATEGORÍA:\n\nMONTO ANUAL DEL IMPUESTO:\n\nJUSTIFICACIÓN:'},

{k:'concl', min:6, item:'Guía 03 · ítem K', t:'Las conclusiones financieras', herr:'concl', ejem:'concl',
 consigna:'Elaboren la conclusión sobre los aspectos financieros: qué dicen los indicadores, cómo queda el balance inversión-operación, y —sobre todo— <strong>qué no habilitan a decir</strong>.',
 guia:'<h4>Lo que la conclusión tiene que cubrir</h4>'+
   '<ul class="gl">'+
   '<li>Las componentes financieras identificadas y el balance entre inversión y operación.</li>'+
   '<li>En proyectos privados, la rentabilidad financiera y la incidencia del impuesto a las ganancias.</li>'+
   '<li>Los supuestos que sostienen el resultado y cuánto se mueve el resultado si alguno falla.</li>'+
   '</ul>'+
   '<div class="box mal mt"><span class="et">El límite que la Guía marca con todas las letras</span>'+
   '<p class="sub">«Aún queda un largo camino por recorrer hasta que estemos en condiciones de pasar a la fase ejecutiva del proyecto, por lo que <b>bajo ningún aspecto podemos recomendar que se realicen las inversiones</b> sin antes haber avanzado a la etapa de factibilidad.»</p></div>'+
   '<p class="tiny mt">Un VAN negativo tampoco clausura la decisión: en proyectos ambientales suele medir la brecha que el beneficio económico —todavía no valorado— tendrá que cubrir en la evaluación económica y social.</p>',
 criterio:'La conclusión dice qué muestran los indicadores, declara los supuestos frágiles y no recomienda invertir.',
 ph:'CONCLUSIONES SOBRE LOS RESULTADOS FINANCIEROS DEL PROYECTO\n\nQué dicen los indicadores:\n\nQué supuestos sostienen ese resultado:\n\nQué NO habilitan a concluir:'},

{k:'fin', min:5, item:'Guía 03 · ítem L', t:'El financiamiento', herr:null, ejem:'fin',
 consigna:'Indiquen las <strong>posibles líneas de financiamiento</strong>: qué etapa hay que financiar, qué organismos o instituciones, y qué características tiene cada línea.',
 guia:'<h4>Qué se financia</h4>'+
   '<ul class="gl">'+
   '<li>En <b>proyectos privados</b> el financiamiento es para la etapa de inversión: se supone que la operación se financia con los ingresos que genera el propio proyecto.</li>'+
   '<li>En <b>proyectos públicos sin ingresos directos</b> hay que financiar las dos etapas, la inversión y la operación.</li>'+
   '</ul>'+
   '<h4 class="mt">Qué hay que especificar de cada línea</h4>'+
   '<ul class="gl">'+
   '<li>La etapa del proyecto que financia.</li>'+
   '<li>El organismo o la institución financista.</li>'+
   '<li>Las características de la línea: plazo, tasa, garantías, período de gracia, contraparte exigida.</li>'+
   '</ul>'+
   '<div class="box info mt"><span class="et">Un dato que vale</span><p class="sub">En proyectos públicos, financiar la construcción resuelve la parte fácil. Lo difícil es el compromiso plurianual del gasto operativo: sin él, la obra se degrada en pocos años.</p></div>',
 criterio:'Entre tres y cinco líneas identificadas, cada una con etapa, organismo y condiciones.',
 ph:'ORGANISMO · LÍNEA · ETAPA QUE FINANCIA · CONDICIONES\n\n1.\n\n2.\n\n3.'}
];
</script>
<script>
"use strict";
/* ===============================================================
   INTERFAZ
   =============================================================== */

/* moneda activa */
function M(v, dec){
  if(v == null || !isFinite(v)) return '—';
  if(S.moneda === 'ars'){
    var t = (+S.fin.tc || 1);
    return (v<0?'−':'') + '$ ' + fmt(Math.abs(v)*t, dec==null?0:dec);
  }
  return fmtM(v, dec);
}
function unidadMon(){ return S.moneda === 'ars' ? '$' : 'U$S'; }

/* --------------------------------------------------------------- tabla editable */
function tablaEd(cols, filas, opts){
  opts = opts || {};
  if(opts.pieFn) opts.pie = opts.pieFn();
  var tw = E('div','tw'), tb = E('table','t');
  var th = E('thead'), tr = E('tr');
  cols.forEach(function(c){
    var x = E('th', c.n ? 'n' : '', esc(c.t));
    if(c.w) x.style.width = c.w;
    tr.appendChild(x);
  });
  tr.appendChild(E('th','', ''));
  th.appendChild(tr); tb.appendChild(th);
  var tbody = E('tbody');
  filas.forEach(function(r, ri){
    var f = E('tr');
    cols.forEach(function(c){
      var td = E('td', c.n ? 'n' : '');
      if(c.tipo === 'sel'){
        var s = E('select','ci');
        Object.keys(c.op).forEach(function(v){
          var o = E('option', null, esc(c.op[v].n || c.op[v]));
          o.value = v; if(String(r[c.f]) === v) o.selected = true;
          s.appendChild(o);
        });
        /* el select cambia una clasificación: refresca lo derivado, sin rehacer la tabla */
        s.onchange = function(){ r[c.f] = s.value; guardar();
          if(opts.vivo) opts.vivo(); else if(opts.al) opts.al(); };
        td.appendChild(s);
      } else if(c.calc){
        /* columna calculada: no se edita, la refresca opts.vivo */
        td.appendChild(E('span','calc'));
      } else {
        var i = E('input','ci' + (c.n ? ' num' : ''));
        i.type = 'text';
        /* un cero se muestra vacío: si no, al tipear sobre él queda 32540 en vez de 3254 */
        i.value = (c.n ? (r[c.f] ? String(r[c.f]).replace('.',',') : '') : (r[c.f] || ''));
        i.placeholder = c.ph || '';
        /* NUNCA se rehace la tabla mientras alguien escribe: perdería el foco
           y se comería el clic en la celda siguiente. Sólo se refresca lo derivado. */
        i.addEventListener('input', function(){
          r[c.f] = c.n ? numLibre(i.value) : i.value;
          guardar(); if(opts.vivo) opts.vivo();
        });
        td.appendChild(i);
      }
      f.appendChild(td);
    });
    var tq = E('td','n');
    var bq = E('button','b xs','✕'); bq.type='button'; bq.title='Quitar esta fila';
    bq.onclick = function(){ filas.splice(ri,1); guardar(); if(opts.al) opts.al(); };
    tq.appendChild(bq); f.appendChild(tq);
    tbody.appendChild(f);
  });
  var pies = [];
  function ponPie(lista){
    pies.forEach(function(f){ if(f.parentNode) f.parentNode.removeChild(f); });
    pies = [];
    (lista||[]).forEach(function(p){
      var f = E('tr', p.cls || 'tot');
      p.c.forEach(function(v, k){
        var td = E('td', (cols[k] && cols[k].n ? 'n ' : '') + (p.clsC && p.clsC[k] ? p.clsC[k] : ''));
        td.innerHTML = v == null ? '' : v;
        f.appendChild(td);
      });
      f.appendChild(E('td'));
      tbody.appendChild(f);
      pies.push(f);
    });
  }
  ponPie(opts.pie);
  tb.appendChild(tbody); tw.appendChild(tb);
  /* refresca sólo la fila de totales, sin tocar los campos que se están editando */
  tw.repie = function(){ if(opts.pieFn) ponPie(opts.pieFn()); };
  tw.cuerpo = tbody;
  return tw;
}
function botonAgregar(txtb, filas, plantilla, al){
  return btn('+ ' + txtb, '', function(){ filas.push(plantilla()); guardar(); al(); });
}

/* --------------------------------------------------------------- campos sueltos */
function campoNum(lab, valor, set, suf, ancho){
  var d = E('div'); d.style.flex = ancho || '1'; d.style.minWidth = '110px';
  d.appendChild(E('label','fl', esc(lab)));
  var fila = E('div'); fila.style.display='flex'; fila.style.alignItems='center'; fila.style.gap='7px';
  var i = E('input','fi num'); i.type='text'; i.value = String(valor).replace('.',',');
  i.addEventListener('input', function(){ set(numLibre(i.value)); guardar(); });
  fila.appendChild(i);
  if(suf){ var u = E('span','tiny', esc(suf)); u.style.flex='none'; fila.appendChild(u); }
  d.appendChild(fila);
  return d;
}
function campoSel(lab, valor, opciones, set, ancho){
  var d = E('div'); d.style.flex = ancho || '1'; d.style.minWidth = '150px';
  d.appendChild(E('label','fl', esc(lab)));
  var s = E('select','fi');
  Object.keys(opciones).forEach(function(v){
    var o = E('option', null, esc(opciones[v])); o.value = v;
    if(String(valor) === v) o.selected = true;
    s.appendChild(o);
  });
  s.onchange = function(){ set(s.value); guardar(); };
  d.appendChild(s);
  return d;
}
function fila(){ var f = E('div'); f.style.display='flex'; f.style.gap='12px'; f.style.flexWrap='wrap';
  f.style.marginTop='12px';
  for(var i=0;i<arguments.length;i++) if(arguments[i]) f.appendChild(arguments[i]);
  return f; }

/* --------------------------------------------------------------- KPIs */
function kpi(k, v, d, cls){
  var x = E('div','kpi ' + (cls||''));
  x.appendChild(E('div','k', esc(k)));
  x.appendChild(E('div','v', v));
  if(d) x.appendChild(E('div','d', esc(d)));
  return x;
}
function panelKPI(R, F, compacto){
  var g = E('div','kpis');
  var privado = F.tipo !== 'publico' && R.hayIng;
  g.appendChild(kpi('Inversión · T0', M(R.I0), 'período 0'));
  g.appendChild(kpi('Operación · por período', M(R.CO), F.periodo || 'año'));
  if(privado){
    g.appendChild(kpi('VAN', M(R.VAN), 'a TMAR ' + fmt(R.tmar*100,1) + ' %', R.VAN >= 0 ? 'ok' : 'no'));
    g.appendChild(kpi('TIR', R.TIR == null ? 'no existe' : fmtP(R.TIR*100,2),
      R.TIR == null ? 'el flujo no cambia de signo' : (R.TIR >= R.tmar ? 'supera la TMAR' : 'por debajo de la TMAR'),
      R.TIR == null ? 'off' : (R.TIR >= R.tmar ? 'ok' : 'no')));
    g.appendChild(kpi('RBC', R.RBC == null ? '—' : fmt(R.RBC,3), 'beneficios sobre costos actualizados',
      (R.RBC != null && R.RBC >= 1) ? 'ok' : 'no'));
    g.appendChild(kpi('Recupero', R.TRI == null ? 'no ocurre' : ('período ' + R.TRI),
      R.TRI == null ? 'dentro del horizonte' : 'el acumulado cambia de signo', R.TRI == null ? 'off' : 'neu'));
  } else {
    g.appendChild(kpi('VAC', M(R.VAC), 'valor actualizado de costos, a TMAR ' + fmt(R.tmar*100,1) + ' %', 'neu'));
    g.appendChild(kpi('VAN', 'no corresponde', 'sin componente positiva', 'off'));
    g.appendChild(kpi('TIR', 'no corresponde', 'el flujo no cambia de signo', 'off'));
    g.appendChild(kpi('RBC', 'no corresponde', 'el numerador está vacío', 'off'));
  }
  if(!compacto) g.appendChild(kpi('Horizonte', R.H + ' períodos', (F.periodo || 'año') + ' cada uno'));
  return g;
}

/* ===============================================================
   HERRAMIENTAS DE LA PLANILLA
   =============================================================== */
function herramienta(k){
  var F = S.fin;
  var caja = E('div','card aq'); caja.appendChild(E('div','tag'));
  var cab = E('div'); cab.style.display='flex'; cab.style.alignItems='center';
  cab.style.justifyContent='space-between'; cab.style.gap='10px'; cab.style.flexWrap='wrap';
  cab.appendChild(E('span','et','La planilla del equipo'));
  var herr = E('div'); herr.style.display='flex'; herr.style.gap='7px';
  herr.appendChild(btn(S.moneda === 'usd' ? 'U$S' : '$ ARS', 'xs', function(){
    S.moneda = S.moneda === 'usd' ? 'ars' : 'usd'; guardar(); repintaHerr();
  }));
  herr.appendChild(btn('Cargar el ejemplo del escenario', 'xs', function(){
    var f = ffAct();
    if(!f){ aviso('Elijan primero el escenario en la portada.'); return; }
    if(!confirm('Esto reemplaza toda la planilla con el ejemplo resuelto del escenario ' + S.esc +
                '. Lo que hayan cargado se pierde. ¿Siguen?')) return;
    S.fin = finDesdeFF(f); guardar(); pinta();
    aviso('Planilla cargada con el ejemplo del escenario ' + S.esc + '.');
  }));
  herr.appendChild(btn('Vaciar', 'xs', function(){
    if(!confirm('¿Vaciar toda la planilla?')) return;
    S.fin = PLANILLA_VACIA(); guardar(); pinta();
  }));
  cab.appendChild(herr);
  caja.appendChild(cab);
  var cont = E('div'); cont.id = 'herr-in';
  caja.appendChild(cont);
  pintaHerr(cont, k, F);
  return caja;
}
function repintaHerr(){
  var c = id('herr-in');
  if(!c) return;
  c.innerHTML = '';
  pintaHerr(c, PASOS[S.i].herr, S.fin);
}
function pintaHerr(c, k, F){
  var R = calcular(F);

  if(k === 'tipo'){
    c.appendChild(fila(
      campoSel('Tipo de proyecto', F.tipo,
        {privado:'Privado · con ingresos directos', publico:'Público · sin ingresos directos', mixto:'Mixto'},
        function(v){ F.tipo = v; repintaHerr(); }, '2'),
      campoSel('Período del flujo', F.periodo,
        {'año':'Año','semestre':'Semestre','mes':'Mes','ciclo productivo':'Ciclo productivo'},
        function(v){ F.periodo = v; }, '1'),
      campoNum('Horizonte', F.H, function(v){ F.H = Math.max(1, Math.min(40, Math.round(v)||1)); }, 'períodos', '1')
    ));
    var b = E('div','box ' + (F.tipo === 'publico' ? 'info' : 'ok')); b.style.marginTop='14px';
    b.appendChild(E('span','et','Indicadores que les corresponden'));
    b.appendChild(E('p','sub', F.tipo === 'publico'
      ? 'Sólo el <strong>VAC</strong>. Sin componente positiva no hay VAN, ni TIR, ni RBC: no existe ninguna tasa que anule un flujo que nunca cambia de signo.'
      : (F.tipo === 'mixto'
        ? '<strong>VAN, TIR y RBC</strong> sobre la fracción que genera ingreso monetario, y en paralelo el <strong>VAC</strong> sobre el conjunto, que suele ser el indicador que ordena la decisión.'
        : '<strong>VAN, TIR y RBC</strong>. El VAC no corresponde, porque hay componente positiva.')));
    c.appendChild(b);
    c.appendChild(campoNum('Tipo de cambio para ver los montos en pesos', F.tc,
      function(v){ F.tc = v; }, 'pesos por dólar', '1'));
    return;
  }

  if(k === 'inv'){
    var derI = E('div'); derI.style.marginTop='14px';
    var tI = tablaEd(
      [{t:'Componente de la inversión (el producto de la acción)', f:'comp', ph:'p. ej. Galpón construido'},
       {t:'Tipo de activo', f:'activo', tipo:'sel', op:ACTIVOS, w:'190px'},
       {t:'Costo ('+unidadMon()+')', f:'monto', n:true, w:'130px'}],
      F.inv, {al: repintaHerr,
        vivo: function(){ tI.repie(); redibI(); },
        pieFn: function(){ return [{c:['<strong>COSTO TOTAL DE INVERSIÓN</strong>','',
          '<strong>'+M(calcular(F).I0)+'</strong>']}]; }});
    c.appendChild(tI);
    var wb = E('div','wrapb'); wb.style.justifyContent='flex-start'; wb.style.marginTop='11px';
    wb.appendChild(botonAgregar('Agregar componente', F.inv,
      function(){ return {comp:'', activo:'depreciable', monto:0}; }, repintaHerr));
    c.appendChild(wb);
    c.appendChild(derI);
    function redibI(){
      derI.innerHTML = '';
      var I0 = calcular(F).I0, porA = {};
      F.inv.forEach(function(r){ porA[r.activo] = (porA[r.activo]||0) + (+r.monto||0); });
      var colA = {depreciable:'#00c06a', nodepreciable:'#12b5a0', nominal:'#7b6bd6', circulante:'#eda100'};
      var items = Object.keys(ACTIVOS).filter(function(a){ return porA[a] > 0; })
        .map(function(a){ return {n: ACTIVOS[a].n, v: porA[a], c: colA[a]}; });
      if(items.length){
        derI.appendChild(E('span','et','Composición por tipo de activo'));
        derI.appendChild(grafTorta(items, null, 'U$S'));
      }
      var av = E('div','box info'); av.style.marginTop='12px';
      av.appendChild(E('p','tiny','Los precios se cargan en dólares. El botón U$S / $ ARS sólo cambia cómo se muestran los totales.'));
      derI.appendChild(av);
    }
    redibI();
    return;
  }

  if(k === 'ope'){
    var derO = E('div'); derO.style.marginTop='14px';
    var tO = tablaEd(
      [{t:'Componente de la operación', f:'comp', ph:'p. ej. Recolección de caracoles lograda'},
       {t:'Tipo de gasto', f:'tipo', tipo:'sel', op:GASTOS, w:'200px'},
       {t:'Costo por período ('+unidadMon()+')', f:'monto', n:true, w:'150px'}],
      F.ope, {al: repintaHerr,
        vivo: function(){ tO.repie(); redibO(); },
        pieFn: function(){ return [{c:['<strong>COSTO TOTAL DE OPERACIÓN · por '+(F.periodo||'período')+'</strong>','',
          '<strong>'+M(calcular(F).CO)+'</strong>']}]; }});
    c.appendChild(tO);
    var wb2 = E('div','wrapb'); wb2.style.justifyContent='flex-start'; wb2.style.marginTop='11px';
    wb2.appendChild(botonAgregar('Agregar componente', F.ope,
      function(){ return {comp:'', tipo:'funcionamiento', monto:0}; }, repintaHerr));
    c.appendChild(wb2);
    c.appendChild(derO);
    function redibO(){
      derO.innerHTML = '';
      var R2 = calcular(F), porG = {};
      F.ope.forEach(function(r){ porG[r.tipo] = (porG[r.tipo]||0) + (+r.monto||0); });
      var colG = {funcionamiento:'#00c06a', mantenimiento:'#39b6d8', comercializacion:'#ef6a4b'};
      var itG = Object.keys(GASTOS).filter(function(a){ return porG[a] > 0; })
        .map(function(a){ return {n: GASTOS[a].n, v: porG[a], c: colG[a]}; });
      if(itG.length){
        derO.appendChild(E('span','et','Composición por tipo de gasto'));
        derO.appendChild(grafTorta(itG, null, 'U$S'));
      }
      if(R2.I0 > 0 && R2.CO > 0){
        var rel = E('div','box'); rel.style.marginTop='12px';
        rel.appendChild(E('span','et','Relación inversión / operación'));
        rel.appendChild(E('p','sub','Un período de operación equivale al <strong>' +
          fmt(R2.CO/R2.I0*100,1) + ' %</strong> de la inversión inicial. En <strong>' +
          fmt(R2.I0/R2.CO,1) + ' períodos</strong> la operación acumulada iguala lo invertido.'));
        derO.appendChild(rel);
      }
    }
    redibO();
    return;
  }

  if(k === 'resI' || k === 'resO'){
    var lista = k === 'resI' ? F.inv : F.ope;
    var mapa  = k === 'resI' ? ACTIVOS : GASTOS;
    var campo = k === 'resI' ? 'activo' : 'tipo';
    var tot   = k === 'resI' ? R.I0 : R.CO;
    if(!lista.length){
      c.appendChild(E('p','sub','Todavía no cargaron la ' + (k==='resI'?'inversión':'operación') +
        '. Vuelvan a la consigna anterior o carguen el ejemplo del escenario.'));
      return;
    }
    var tw = E('div','tw'), tb = E('table','t');
    var th = E('thead'), tr = E('tr');
    ['Componente','Clasificación','Costo','Peso'].forEach(function(t,i){
      tr.appendChild(E('th', i>=2 ? 'n' : '', t)); });
    th.appendChild(tr); tb.appendChild(th);
    var tbo = E('tbody');
    lista.slice().sort(function(a,b){ return (+b.monto||0)-(+a.monto||0); }).forEach(function(r){
      var f = E('tr');
      f.appendChild(E('td','b', esc(r.comp || '—')));
      var td2 = E('td');
      var m = mapa[r[campo]] || {n:'—', c:''};
      td2.innerHTML = '<span class="chip '+m.c+'">'+esc(m.n)+'</span>';
      f.appendChild(td2);
      f.appendChild(E('td','n', M(+r.monto||0)));
      f.appendChild(E('td','n', tot ? fmt((+r.monto||0)/tot*100,1)+' %' : '—'));
      tbo.appendChild(f);
    });
    var ft = E('tr','tot');
    ft.appendChild(E('td',null,'<strong>TOTAL</strong>')); ft.appendChild(E('td'));
    ft.appendChild(E('td','n','<strong>'+M(tot)+'</strong>')); ft.appendChild(E('td','n','100 %'));
    tbo.appendChild(ft);
    tb.appendChild(tbo); tw.appendChild(tb); c.appendChild(tw);
    var may = lista.slice().sort(function(a,b){ return (+b.monto||0)-(+a.monto||0); })[0];
    if(may && tot){
      var bx = E('div','box warn'); bx.style.marginTop='12px';
      bx.appendChild(E('span','et','El dato que tiene que estar en la memoria'));
      bx.appendChild(E('p','sub','La componente más cara es <strong>' + esc(may.comp || 'sin nombre') +
        '</strong>, con ' + M(+may.monto||0) + ', el <strong>' + fmt((+may.monto||0)/tot*100,0) +
        ' %</strong> del total. Expliquen cómo llegaron a ese número y de qué fuente salieron los precios.'));
      c.appendChild(bx);
    }
    return;
  }

  if(k === 'ing'){
    if(F.tipo === 'publico'){
      var nb = E('div','box info');
      nb.appendChild(E('span','et','NO APLICA'));
      nb.appendChild(E('p','sub','Marcaron el proyecto como público sin ingresos directos, así que la componente positiva es cero en T0 y de T1 a Tn. Igual tienen que justificar en el formulario <strong>cómo dimensionaron</strong> la cantidad de bienes o servicios que el proyecto le entrega a la sociedad, y desarrollar el beneficio económico en la consigna siguiente.'));
      c.appendChild(nb);
      c.appendChild(btn('Cambiar el tipo de proyecto','', function(){ ir(0); }));
      return;
    }
    var derG = E('div'); derG.style.marginTop='14px';
    var tG = tablaEd(
      [{t:'Concepto', f:'concepto', ph:'qué se vende o qué costo se evita'},
       {t:'Clase', f:'clase', tipo:'sel', op:{venta:'Venta', evitado:'Costo evitado'}, w:'130px'},
       {t:'Cantidad', f:'cant', n:true, w:'105px'},
       {t:'Precio ('+unidadMon()+')', f:'precio', n:true, w:'110px'},
       {t:'Ingreso pleno', f:'_x', n:true, calc:true, w:'120px'},
       {t:'Desde T', f:'desde', n:true, w:'80px'},
       {t:'Escala por período', f:'esc', ph:'0,6 · 0,85 · 1', w:'150px'}],
      F.ing, {al: repintaHerr,
        vivo: function(){ tG.repie(); calcCol(); redibG(); },
        pieFn: function(){ return [{c:['<strong>INGRESO PLENO POR PERÍODO</strong>','','','',
          '<strong>'+M(ingresoVenta(F)+ingresoEvitado(F))+'</strong>','','']}]; }});
    c.appendChild(tG);
    /* la quinta columna es calculada: se rellena y se refresca a mano */
    function calcCol(){
      F.ing.forEach(function(r, i){
        var f = tG.cuerpo.children[i]; if(!f) return;
        var sp = f.querySelector('span.calc'); if(!sp) return;
        sp.style.color = 'var(--verde-l)'; sp.style.fontWeight = '700';
        sp.textContent = M((+r.cant||0)*(+r.precio||0));
      });
    }
    calcCol();
    var wb3 = E('div','wrapb'); wb3.style.justifyContent='flex-start'; wb3.style.marginTop='11px';
    wb3.appendChild(botonAgregar('Agregar componente positiva', F.ing,
      function(){ return {concepto:'', clase:'venta', cant:0, precio:0, desde:1, esc:''}; }, repintaHerr));
    c.appendChild(wb3);
    c.appendChild(derG);
    function redibG(){
      derG.innerHTML = '';
      var totV = ingresoVenta(F), totE = ingresoEvitado(F);
      var g2 = E('div','kpis');
      g2.appendChild(kpi('Venta', M(totV), 'ingreso bruto facturable', totV ? 'ok' : 'off'));
      g2.appendChild(kpi('Costo evitado', M(totE), 'mejora la caja, no se factura', totE ? 'neu' : 'off'));
      g2.appendChild(kpi('Total por período', M(totV+totE), 'componente positiva plena'));
      derG.appendChild(g2);
    }
    redibG();
    var ay = E('div','box'); ay.style.marginTop='12px';
    ay.appendChild(E('span','et','Cómo se usan las dos últimas columnas'));
    ay.appendChild(E('p','tiny','<strong>Desde T</strong> es el primer período con ingreso: normalmente 1. <strong>Escala</strong> sirve para la puesta en régimen: escriban un factor por período separado por espacios, por ejemplo 0,6 · 0,85 · 1. Los períodos que sobren repiten el último factor.'));
    c.appendChild(ay);
    return;
  }

  if(k === 'repo'){
    c.appendChild(E('p','sub','Inversiones que ocurren <strong>durante</strong> la operación: reposición de bienes de capital de vida útil corta, capacitaciones de actualización, auditorías de cierre. Van en el período en que ocurren, no en el 0.'));
    var derR = E('div'); derR.style.marginTop='14px';
    var tR = tablaEd(
      [{t:'Concepto', f:'concepto', ph:'p. ej. Reposición de las cintas de goteo'},
       {t:'Período', f:'per', n:true, w:'100px'},
       {t:'Monto ('+unidadMon()+')', f:'monto', n:true, w:'130px'}],
      F.repo, {al: repintaHerr,
        vivo: function(){ tR.repie(); redibR(); },
        pieFn: function(){ return [{c:['<strong>TOTAL DE REPOSICIONES</strong>','','<strong>' +
          M(F.repo.reduce(function(a,r){ return a+(+r.monto||0); },0)) + '</strong>']}]; }});

/* --------------------------------------------------------------- matriz del FF */
function matrizFF(R, F){
  var d = E('div');
  var tw = E('div','tw'), tb = E('table','t mx');
  /* con table-layout:fixed y width:auto el navegador mide el contenido y estira
     la primera columna; el ancho se fija a mano para que las columnas no bailen */
  tb.style.width = (262 + 92*(R.H+1)) + 'px';
  var th = E('thead'), tr = E('tr');
  tr.appendChild(E('th','','Componentes'));
  for(var t=0; t<=R.H; t++) tr.appendChild(E('th','n', String(t)));
  th.appendChild(tr); tb.appendChild(th);
  var tbo = E('tbody'), i;

  function filaM(nombre, vals, cls, chip){
    var f = E('tr', cls || '');
    var c0 = E('td', 'b');
    c0.innerHTML = (chip ? '<span class="chip '+chip+'">'+chip.toUpperCase()+'</span> ' : '') + esc(nombre);
    f.appendChild(c0);
    for(var t=0; t<=R.H; t++){
      var v = vals[t];
      var td = E('td','n' + (v < 0 ? ' neg' : (v > 0 ? ' pos' : '')));
      td.textContent = v ? fmt(S.moneda==='ars' ? v*(+F.tc||1) : v, 0) : '—';
      f.appendChild(td);
    }
    tbo.appendChild(f);
  }
  function ceros(){ var a = []; for(var t=0;t<=R.H;t++) a.push(0); return a; }

  /* ingresos */
  if(R.hayIng){
    var hI = E('tr','sub'); var ch = E('td','b', 'COMPONENTE POSITIVA');
    hI.appendChild(ch);
    for(i=0;i<=R.H;i++) hI.appendChild(E('td'));
    tbo.appendChild(hI);
    (F.ing||[]).forEach(function(it){
      var a = ceros(), base = (+it.cant||0)*(+it.precio||0);
      var desde = Math.max(1, parseInt(it.desde,10)||1), e = parseEsc(it.esc);
      for(var t=desde; t<=R.H; t++){
        var f2 = 1; if(e) f2 = (t-1 < e.length) ? e[t-1] : e[e.length-1];
        a[t] = base*f2;
      }
      filaM(it.concepto || 'ingreso', a);
    });
    if(F.salv){ var s2 = ceros(); s2[R.H] = +F.salv; filaM('Valor de salvamento', s2); }
    filaM('Total de la componente positiva', R.ing, 'tot');
  }

  /* egresos */
  var hE = E('tr','sub'); hE.appendChild(E('td','b','COMPONENTE NEGATIVA'));
  for(i=0;i<=R.H;i++) hE.appendChild(E('td'));
  tbo.appendChild(hE);
  (F.inv||[]).forEach(function(r){
    var a = ceros(); a[0] = +r.monto||0;
    filaM(r.comp || 'inversión', a.map(function(x){ return -x; }), '', (ACTIVOS[r.activo]||{}).c);
  });
  (F.ope||[]).forEach(function(r){
    var a = ceros();
    for(var t=1;t<=R.H;t++) a[t] = -(+r.monto||0);
    filaM(r.comp || 'operación', a, '', (GASTOS[r.tipo]||{}).c);
  });
  (F.repo||[]).forEach(function(r){
    var p = parseInt(r.per,10); if(!(p>=1 && p<=R.H)) return;
    var a = ceros(); a[p] = -(+r.monto||0);
    filaM(r.concepto || 'reposición', a);
  });
  filaM('Total de la componente negativa', R.egr.map(function(x){ return -x; }), 'tot');

  /* FFN */
  filaM('FLUJO DE FONDOS NETO', R.ffn, 'tot');
  filaM('FFN acumulado', R.acu, 'tot');

  tb.appendChild(tbo); tw.appendChild(tb);
  d.appendChild(tw);
  d.appendChild(E('p','tiny','Los egresos se muestran con signo negativo. El FFN es la suma algebraica de cada columna. Montos en ' +
    (S.moneda === 'ars' ? 'pesos, al tipo de cambio cargado en la planilla' : 'dólares') + '.'));
  return d;
}

<script>
"use strict";
/* =============================================================== WORD */
function expWord(){
  var e = escAct(), F = S.fin, R = calcular(F);
  var css = 'body{font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#111;line-height:1.45}'+
    'h1{font-size:19pt;color:#0e5c3a;margin:0 0 4pt}'+
