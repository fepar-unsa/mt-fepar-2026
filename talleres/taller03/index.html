  function tabla(cab, filas, nCols){
    var h = '<table><tr>' + cab.map(function(c,i){
      return '<th'+((nCols||[]).indexOf(i)>=0?' style="text-align:right"':'')+'>'+esc(c)+'</th>'; }).join('') + '</tr>';
    filas.forEach(function(r){
      var cls = r._cls ? ' class="'+r._cls+'"' : '';
      var cc = r.c || r;
      h += '<tr'+cls+'>' + cc.map(function(v,i){
        return '<td'+((nCols||[]).indexOf(i)>=0?' class="n"':'')+'>'+(v==null?'':v)+'</td>'; }).join('') + '</tr>';
    });
    return h + '</table>';
  }

  var h = '<h1>Formulario 03 · FEPAR 2026</h1>'+
    '<p><strong>Estudios financieros de proyectos. Flujos de fondos e indicadores</strong></p>'+
    '<p><strong>Equipo:</strong> ' + esc(S.equipo || 'sin nombre') + '<br>'+
    (e ? '<strong>Escenario ' + S.esc + ':</strong> ' + esc(e.t) + '<br>' : '')+
    '<strong>Tipo de proyecto:</strong> ' + esc(F.tipo) + ' · <strong>Período:</strong> ' + esc(F.periodo) +
    ' · <strong>Horizonte:</strong> ' + R.H + ' períodos<br>'+
    '<span style="font-size:9pt;color:#5a6b64">Borrador armado en el Taller 03 el ' + ahora() + '</span></p>';

  PASOS.forEach(function(p, i){
    h += '<h2>' + (i+1) + ' · ' + esc(p.t) + ' <span style="font-size:9pt;font-weight:normal">(' + esc(p.item) + ')</span></h2>';
    h += '<p class="c">' + p.consigna.replace(/<\/?strong>/g,'') + '</p>';
    var r = txt(S.resp[p.k]);
    h += '<div class="r">' + (r ? nl2br(r) : '<em style="color:#8a9a94">— sin completar en el taller —</em>') + '</div>';

    /* las tablas de la planilla que corresponden a ese ítem */
    if(p.k === 'valI' && F.inv.length){
      h += '<h3>Valoración de las componentes de la etapa de inversión</h3>';
      h += tabla(['Componente','Tipo de activo','Costo (U$S)'],
        F.inv.map(function(x){ return [esc(x.comp), esc((ACTIVOS[x.activo]||{}).n||x.activo), fmt(+x.monto||0)]; })
        .concat([{_cls:'tot', c:['COSTO TOTAL DE INVERSIÓN','', fmt(R.I0)]}]), [2]);
    }
    if(p.k === 'valO' && F.ope.length){
      h += '<h3>Valoración de las componentes de la etapa de operación</h3>';
      h += tabla(['Componente','Tipo de gasto','Costo por período (U$S)'],
        F.ope.map(function(x){ return [esc(x.comp), esc((GASTOS[x.tipo]||{}).n||x.tipo), fmt(+x.monto||0)]; })
        .concat([{_cls:'tot', c:['COSTO TOTAL DE OPERACIÓN','', fmt(R.CO)]}]), [2]);
    }
    if(p.k === 'ing'){
      h += '<h3>Componente positiva del flujo de fondos</h3>';
      if(F.tipo === 'publico' || !F.ing.length){
        h += tabla(['Componente positiva','Descripción','T0','T1 hasta Tn'],
          [['INGRESOS DIRECTOS DEL PROYECTO','NO APLICA','','']]);
      } else {
        h += tabla(['Concepto','Clase','Cantidad','Precio (U$S)','Ingreso pleno (U$S)','T0','T1-Tn'],
          F.ing.map(function(x){
            return [esc(x.concepto), x.clase === 'evitado' ? 'costo evitado' : 'venta',
                    fmt(+x.cant||0), fmt(+x.precio||0, 2), fmt((+x.cant||0)*(+x.precio||0)),
                    (+x.desde||1) === 0 ? 'X' : '', (+x.desde||1) >= 1 ? 'X' : '']; }), [2,3,4]);
      }
    }
    if(p.k === 'neg'){
      h += '<h3>Componente negativa del flujo de fondos</h3>';
      var fn = F.inv.map(function(x){
          return [esc(x.comp) + ' (' + esc((ACTIVOS[x.activo]||{}).n||'') + ')', 'X', '']; })
        .concat(F.ope.map(function(x){
          return [esc(x.comp) + ' (' + esc((GASTOS[x.tipo]||{}).n||'') + ')', '', 'X']; }))
        .concat(F.repo.map(function(x){
          return [esc(x.concepto) + ' (período ' + x.per + ')', '', 'X']; }));
      h += tabla(['Componente negativa','T0','T1 - Tn'], fn);
    }
    if(p.k === 'ff' && (R.I0 || R.CO)){
      h += '<h3>Matriz del flujo de fondos (U$S)</h3>';
      var cabm = ['Componentes'];
      for(var t=0;t<=R.H;t++) cabm.push(String(t));
      var nC = []; for(t=1;t<=R.H+1;t++) nC.push(t);
      var fm = [];
      if(R.hayIng) fm.push({_cls:'tot', c:['Total componente positiva'].concat(R.ing.map(function(v){ return fmt(v); }))});
      fm.push({_cls:'tot', c:['Total componente negativa'].concat(R.egr.map(function(v){ return '−'+fmt(v); }))});
      fm.push({_cls:'tot', c:['FLUJO DE FONDOS NETO'].concat(R.ffn.map(function(v){ return fmt(v); }))});
      fm.push({_cls:'tot', c:['FFN acumulado'].concat(R.acu.map(function(v){ return fmt(v); }))});
      h += tabla(cabm, fm, nC);
    }
    if(p.k === 'td'){
      h += '<h3>Identificación de la tasa de descuento</h3>';
      h += tabla(['Componente','Valor'],
        [['Tasa libre de riesgo', F.td.rf + ' %'],
         ['Riesgo país', F.td.rp + ' %'],
         ['Prima por riesgo del proyecto', F.td.rpr + ' %'],
         {_cls:'tot', c:['TMAR', fmt(R.tmar*100,1) + ' %']}], [1]);
    }
    if(p.k === 'ind'){
      h += '<h3>Cálculo de indicadores financieros</h3>';
      var priv = F.tipo !== 'publico' && R.hayIng;
      var fi = priv
        ? [['VAN', fmtM(R.VAN), esc(txt(S.resp.ind) ? '' : '')],
           ['TIR', R.TIR == null ? 'no existe' : fmtP(R.TIR*100,2), ''],
           ['RBC', R.RBC == null ? '—' : fmt(R.RBC,3), '']]
        : [['VAC', fmtM(R.VAC), '']];
      h += tabla(['Indicador financiero','Valor','Conclusiones parciales'], fi, [1]);
    }
    if(p.k === 'trib' && F.tipo !== 'publico'){
      var fac = {'año':1,'semestre':2,'mes':12,'ciclo productivo':1}[F.periodo] || 1;
      h += '<h3>Categoría tributaria del proyecto</h3>';
      h += tabla(['Concepto','Valor'],
        [['Ingresos del proyecto por venta, anualizados', fmtM(ingresoVenta(F)*fac)],
         ['Costo evitado (no integra el ingreso bruto)', fmtM(ingresoEvitado(F)*fac)]], [1]);
    }

    var qs = pregDe(p.k);
    if(qs.length) h += '<p class="q"><strong>Preguntas orientadoras del escenario:</strong> ' +
      qs.map(function(q){ return esc(q); }).join(' ') + '</p>';
  });

  var doc = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'+
    '<head><meta charset="utf-8"><title>Formulario 03 · FEPAR 2026</title>'+
    '<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View></w:WordDocument></xml><![endif]-->'+
    '<style>@page{size:A4 landscape;margin:1.6cm}' + css + '</style></head><body>' + h + '</body></html>';
  bajar('F03_taller_' + slug(S.equipo) + '.doc', 'application/msword', '﻿' + doc);
  aviso('Documento del Formulario 03 descargado.');
}

/* =============================================================== EXCEL */
function expExcel(){
  var e = escAct(), F = S.fin, R = calcular(F), t;
  var H = function(x){ return {v:x, s:1}; };
  var N = function(x){ return {v:(isFinite(x)?x:0), s:3, n:true}; };
  var B = function(x){ return {v:x, s:7}; };
  var hojas = [];

  /* 1 · portada */
  hojas.push({nombre:'PROYECTO', anchos:[34,60], filas:[
    [H('Dato'), H('Valor')],
    ['Formulario', 'FEPAR 03 · Estudios financieros'],
    ['Equipo', S.equipo || 'sin nombre'],
    ['Escenario', e ? (S.esc + ' · ' + e.t) : '—'],
    ['Tipo de proyecto', F.tipo],
    ['Período del flujo', F.periodo],
    ['Horizonte (períodos)', N(R.H)],
    ['Moneda', 'dólares estadounidenses (U$S)'],
    ['Tipo de cambio de referencia', N(+F.tc||0)],
    ['Tasa libre de riesgo (%)', N(+F.td.rf||0)],
    ['Riesgo país (%)', N(+F.td.rp||0)],
    ['Prima por riesgo del proyecto (%)', N(+F.td.rpr||0)],
    ['TMAR (%)', N(Math.round(R.tmar*10000)/100)],
    ['Armado el', ahora()]
  ]});

  /* 2 · recursos de la inversión */
  var fI = [[H('Componente de la inversión'), H('Tipo de activo'), H('Costo U$S'), H('Peso %')]];
  F.inv.forEach(function(r){
    fI.push([r.comp || '', (ACTIVOS[r.activo]||{}).n || r.activo, N(+r.monto||0),
             N(R.I0 ? Math.round((+r.monto||0)/R.I0*1000)/10 : 0)]);
  });
  fI.push([B('COSTO TOTAL DE INVERSIÓN'), '', {v:R.I0, s:3, n:true}, N(100)]);
  hojas.push({nombre:'RECURSOS-I', anchos:[56,32,15,10], filas:fI});

  /* 3 · recursos de la operación */
  var fO = [[H('Componente de la operación'), H('Tipo de gasto'), H('Costo por período U$S'), H('Peso %')]];
  F.ope.forEach(function(r){
    fO.push([r.comp || '', (GASTOS[r.tipo]||{}).n || r.tipo, N(+r.monto||0),
             N(R.CO ? Math.round((+r.monto||0)/R.CO*1000)/10 : 0)]);
  });
  fO.push([B('COSTO TOTAL DE OPERACIÓN'), '', {v:R.CO, s:3, n:true}, N(100)]);
  hojas.push({nombre:'RECURSOS-O', anchos:[56,32,20,10], filas:fO});

  /* 4 · componente positiva */
  var fG = [[H('Concepto'), H('Clase'), H('Cantidad'), H('Unidad'), H('Precio U$S'),
             H('Ingreso pleno U$S'), H('Desde T'), H('Escala')]];
  F.ing.forEach(function(r){
    fG.push([r.concepto||'', r.clase === 'evitado' ? 'costo evitado' : 'venta',
             N(+r.cant||0), '', N(+r.precio||0), N((+r.cant||0)*(+r.precio||0)),
             N(+r.desde||1), r.esc || '']);
  });
  fG.push([B('INGRESO POR VENTA'), '', '', '', '', {v:ingresoVenta(F), s:3, n:true}, '', '']);
  fG.push([B('COSTO EVITADO'), '', '', '', '', {v:ingresoEvitado(F), s:3, n:true}, '', '']);
  hojas.push({nombre:'INGRESOS', anchos:[52,15,12,12,12,16,9,16], filas:fG});

  /* 5 · reposiciones */
  var fR = [[H('Concepto'), H('Período'), H('Monto U$S')]];
  F.repo.forEach(function(r){ fR.push([r.concepto||'', N(+r.per||0), N(+r.monto||0)]); });
  fR.push([B('Valor de salvamento'), N(R.H), N(+F.salv||0)]);
  hojas.push({nombre:'REPOSICIONES', anchos:[56,12,15], filas:fR});

  /* 6 · matriz del flujo de fondos */
  var cabF = [H('Componentes')];
  for(t=0;t<=R.H;t++) cabF.push(H('T'+t));
  var fF = [cabF];
  function filaX(nom, vals, sty){
    var r = [sty ? B(nom) : nom];
    for(var t=0;t<=R.H;t++) r.push(N(Math.round(vals[t]*100)/100));
    return r;
  }
  function ceros2(){ var a=[]; for(var t=0;t<=R.H;t++) a.push(0); return a; }
  if(R.hayIng){
    F.ing.forEach(function(it){
      var a = ceros2(), base = (+it.cant||0)*(+it.precio||0);
      var desde = Math.max(1, parseInt(it.desde,10)||1), ee = parseEsc(it.esc);
      for(var t=desde;t<=R.H;t++){ var f2=1; if(ee) f2=(t-1<ee.length)?ee[t-1]:ee[ee.length-1]; a[t]=base*f2; }
      fF.push(filaX(it.concepto || 'ingreso', a));
    });
    if(F.salv){ var sv = ceros2(); sv[R.H] = +F.salv; fF.push(filaX('Valor de salvamento', sv)); }
    fF.push(filaX('TOTAL COMPONENTE POSITIVA', R.ing, true));
  }
  F.inv.forEach(function(r){ var a = ceros2(); a[0] = -(+r.monto||0); fF.push(filaX(r.comp||'inversión', a)); });
  F.ope.forEach(function(r){ var a = ceros2(); for(var t=1;t<=R.H;t++) a[t] = -(+r.monto||0);
    fF.push(filaX(r.comp||'operación', a)); });
  F.repo.forEach(function(r){ var p = parseInt(r.per,10); if(!(p>=1&&p<=R.H)) return;
    var a = ceros2(); a[p] = -(+r.monto||0); fF.push(filaX(r.concepto||'reposición', a)); });
  fF.push(filaX('TOTAL COMPONENTE NEGATIVA', R.egr.map(function(x){ return -x; }), true));
  fF.push(filaX('FLUJO DE FONDOS NETO', R.ffn, true));
  fF.push(filaX('FFN ACUMULADO', R.acu, true));
  var anF = [46]; for(t=0;t<=R.H;t++) anF.push(14);
  hojas.push({nombre:'FLUJO DE FONDOS', anchos:anF, filas:fF});

  /* 7 · indicadores */

  var fN = [[H('Indicador financiero'), H('Valor'), H('Conclusiones parciales')]];
  if(priv){

  fN.push([B('Operación por período (U$S)'), N(Math.round(R.CO*100)/100), '']);
  hojas.push({nombre:'INDICADORES', anchos:[28,18,70], filas:fN});

  /* 8 · las respuestas escritas */
  var fT = [[H('Ítem'), H('Consigna'), H('Respuesta del equipo')]];
  PASOS.forEach(function(p, i){
    fT.push([ (i+1) + ' · ' + p.t, p.item, txt(S.resp[p.k]) || '' ]);
  });
  hojas.push({nombre:'FORMULARIO', anchos:[34,20,95], filas:fT});

  try{
    var data = xlsxBuild(hojas);
    bajar('F03_planilla_' + slug(S.equipo) + '.xlsx',
          'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', data);
    aviso('Planilla descargada · ' + hojas.length + ' hojas.');
  }catch(err){
    aviso('No se pudo generar la planilla en este navegador.');
  }
}

id('ov-sorteo').addEventListener('mousedown', function(ev){
  if(ev.target === this) this.classList.remove('on');
});
document.addEventListener('keydown', function(ev){
  var t = ev.target.tagName;
  if(t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
  if(ev.key === 'Escape'){ id('ov-sorteo').classList.remove('on'); return; }
  if(id('ov-sorteo').classList.contains('on')) return;
  if(S.i < 0 || S.i >= PASOS.length) return;
  if(ev.key === ' '){ ev.preventDefault(); alternar(); }
  else if(ev.key === 'ArrowRight'){ ev.preventDefault(); siguiente(); }
  else if(ev.key === 'ArrowLeft'){ ev.preventDefault(); anterior(); }
});
id('arch').addEventListener('change', function(ev){
  var f = ev.target.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var o = JSON.parse(rd.result);
      if(o && o.resp){
        Object.keys(S).forEach(function(k){ if(o[k] !== undefined) S[k] = o[k]; });
        S.run = false;
        if(!Array.isArray(S.plan) || S.plan.length !== PASOS.length)
          S.plan = PASOS.map(function(p){ return p.min; });
        if(!S.fin) S.fin = PLANILLA_VACIA();
        ['inv','ope','ing','repo'].forEach(function(k){ if(!Array.isArray(S.fin[k])) S.fin[k] = []; });
        guardar(); pinta(); reloj();
        aviso('Avance cargado' + (o.ts ? ' · guardado el ' + o.ts : '') + '.');
      } else aviso('Ese archivo no parece un avance del taller.');
    }catch(e){ aviso('No se pudo leer ese archivo.'); }
  };
  rd.readAsText(f);
  ev.target.value = '';
});
