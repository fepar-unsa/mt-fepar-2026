trol de cobertura y resiembra","unidad":"jornal","cant":12,"pu":110,"fuente":"Escala salarial de la construcción y convenio rural"},{"cod":"E","tarea":"Control de cobertura y reposición de fallas","recurso":"Semilla para reposición de fallas","unidad":"kg","cant":15,"pu":12,"fuente":"Lista de agroinsumos y viveros del NOA, 2026"}],"compI":[{"cod":"A","acc":"Acondicionar el camino de acceso y la playa de maniobras del sector de piletas","comp":"Camino de acceso y playa de maniobras acondicionados","activo":"nodepreciable","vida":null,"rel":"Se obtienen 900 m de camino perfilado y compactado, las cunetas con dos alcantarillas y 0,6 ha desmalezadas, por U$S 5.500; son trabajos que se adosan al suelo como unidad inseparable y por eso no se deprecian."},{"cod":"B","acc":"Construir la celda de tratamiento biológico de suelos hidrocarburados","comp":"Celda de tratamiento biológico construida","activo":"depreciable","vida":10,"rel":"Se obtienen 3.000 m² de celda impermeabilizada con geomembrana de 1,5 mm, bermas de 0,8 m y sumidero de lixiviados de 12 m³, por U$S 34.610; la membrana y el sumidero tienen vida útil propia y se desvalorizan con el uso."},{"cod":"C","acc":"Dotar al proyecto del equipamiento de manejo y riego de biopilas","comp":"Proyecto dotado con el equipamiento de manejo y riego de biopilas","activo":"depreciable","vida":10,"rel":"Se obtienen el tractor de 110 HP con pala frontal, el acoplado regador de 6.000 litros con motobomba y el tanque australiano de 30 m³, montados y en marcha, por U$S 65.260."},{"cod":"D","acc":"Construir la red de monitoreo de agua subterránea del sector","comp":"Red de monitoreo de agua subterránea construida","activo":"depreciable","vida":15,"rel":"Se obtienen tres freatímetros de 25 m encamisados, desarrollados y con la línea de base analizada, por U$S 11.310."},{"cod":"E","acc":"Dotar al proyecto del obrador y del sector de acopio de insumos","comp":"Obrador y sector de acopio de insumos incorporados","activo":"depreciable","vida":10,"rel":"Se obtienen dos módulos habitables con sanitario químico, un galpón de 60 m² para insumos, 350 m de cerco perimetral y la cartelería de seguridad, por U$S 42.540."},{"cod":"F","acc":"Capacitar al personal en el manejo de suelos hidrocarburados","comp":"Personal capacitado en el manejo de suelos hidrocarburados","activo":"nominal","vida":null,"rel":"Se obtienen doce operarios capacitados y certificados en manejo de residuos peligrosos, con simulacro de derrame incluido, por U$S 4.230; es un intangible, sin valor de reventa."}],"compO":[{"cod":"A","acc":"Extraer y clasificar los suelos y barros hidrocarburados de las piletas","comp":"Suelos y barros hidrocarburados extraídos y clasificados","tipoFF":"funcionamiento","rel":"Extraer, transportar 900 m y clasificar 3.000 m³ por año cuesta U$S 64.480, casi todo alquiler horario de excavadora y de camión volcador."},{"cod":"B","acc":"Tratar biológicamente los suelos hidrocarburados en biopilas","comp":"Suelos hidrocarburados tratados biológicamente","tipoFF":"funcionamiento","rel":"Tratar 3.000 m³ anuales en dos biopilas de 1.500 m³ cuesta U$S 32.940 en nutrientes, enmienda, agua, gasoil, análisis y jornales; el tractor entra por su costo horario de mantenimiento, no por su valor."},{"cod":"C","acc":"Monitorear el agua subterránea y la calidad del suelo del sector","comp":"Agua subterránea y suelo del sector monitoreados","tipoFF":"mantenimiento","rel":"Conservar la red de tres freatímetros y verificar el desempeño del capital instalado y del suelo cuesta U$S 8.680 por año, con los análisis y el informe trimestral a la autoridad incluidos."},{"cod":"D","acc":"Rellenar y reconformar el sector de piletas con el suelo tratado","comp":"Sector de piletas relleno y reconformado","tipoFF":"funcionamiento","rel":"Retirar la membrana y los escombros y rellenar y reconformar el sector con el suelo tratado cuesta U$S 21.580 por año de campaña."},{"cod":"E","acc":"Revegetar el sector y reincorporarlo al uso agropecuario","comp":"Sector revegetado y reincorporado al uso agropecuario","tipoFF":"funcionamiento","rel":"Incorporar 0,2 m de suelo vegetal, sembrar 0,6 ha con forrajeras y nativas y controlar la cobertura cuesta U$S 17.780 por año."}],"ing":{"aplica":false,"momento":"no","items":[],"just":"El proyecto no tiene ingresos directos. La remediación de las piletas de contingencia es una obligación impuesta por la autoridad: no produce un bien ni un servicio que se venda a un tercero, y el suelo tratado se reincorpora al establecimiento del propietario sin transacción de mercado. Tampoco se computa como ingreso el ahorro de una eventual sanción, porque es un costo evitado de magnitud y probabilidad inciertas y no un flujo de caja del proyecto. En consecuencia la componente positiva es cero, el flujo tiene sólo componente negativa y el indicador que corresponde es el VAC.","benef":"El beneficio económico no es un ingreso: es el incremento de bienestar social que deja el proyecto, y acá tiene tres partes. La primera son las 2 ha que vuelven al uso agropecuario: dejan de ser un pasivo cercado y se suman a la superficie productiva del establecimiento, con un valor de uso que nadie factura. La segunda es la afectación de la freática que se evita: la pileta habilitada en la contingencia no está impermeabilizada, y el retiro del material más el monitoreo con tres freatímetros cortan la vía de infiltración de hidrocarburos y de agua de formación salina hacia el acuífero del que dependen el establecimiento y sus vecinos. La tercera es la reducción del riesgo de una nueva contingencia. Ninguna de las tres se valora en el flujo; las tres se justifican."},"repo":[{"concepto":"Recertificación del plantel en manejo de residuos peligrosos","periodos":[3],"monto":2200,"nota":"Las capacitaciones que ocurren durante la operación se registran en el período en que se dictan, no en el período 0."},{"concepto":"Reposición de la motobomba y de los elementos de riego de biopilas","periodos":[3],"monto":3500,"nota":"Equipos menores con vida útil inferior al horizonte, castigados por el trabajo con suelo hidrocarburado."},{"concepto":"Auditoría ambiental de cierre e informe final a la autoridad","periodos":[5],"monto":12000,"nota":"Estudio de verificación exigido para el acta de cierre; se registra en el período en que se ejecuta."}],"salv":{"monto":46000,"just":"Valor residual del tractor, el acoplado regador, el tanque australiano, los módulos habitables y el galpón al quinto año, estimado en la mitad del valor de incorporación por el desgaste del trabajo en ambiente hidrocarburado; la celda y los freatímetros se desmantelan y no tienen valor de recupero."},"td":{"rf":4,"rp":10,"rpr":7,"just":"La tasa libre de riesgo se toma de los bonos del Tesoro de los Estados Unidos a diez años, 4 %, y el riesgo país argentino del índice de JP Morgan, 10 %. La prima por riesgo del proyecto se fija en 7 %, en la banda baja del rango: la tecnología de biopilas es conocida y depende de variables controlables como humedad, nutrientes y aireación, pero persiste incertidumbre sobre el volumen real del pasivo y sobre los tiempos de biodegradación. La TMAR resultante es 21 % anual en dólares."},"narrI":"La inversión total asciende a U$S 163.450. El componente mayor es el equipamiento de manejo y riego de biopilas, con U$S 65.260, el 40 % del total, y dentro de él el tractor de 110 HP con pala frontal explica U$S 48.000: es el único bien que interviene en todas las campañas de armado y volteo. Le siguen el obrador y el sector de acopio, con U$S 42.540, y la celda de tratamiento, con U$S 34.610, donde la geomembrana de polietileno de alta densidad de 1,5 mm sobre 3.450 m² pesa U$S 22.425. La red de freatímetros suma U$S 11.310, el acondicionamiento del acceso U$S 5.500 y la capacitación U$S 4.230. Los precios se estimaron por orden de magnitud con listas de proveedores de geosintéticos y de maquinaria agrícola, tarifas horarias de alquiler de equipo vial del NOA y aranceles de laboratorios ambientales de Salta. No se consigna capital de trabajo: ninguna acción de la EDT lo constituye y la primera campaña se cubre con el presupuesto anual de remediación de la empresa.","narrO":"El costo operativo de una campaña anual completa es de U$S 145.460. La componente más pesada es la extracción y clasificación, con U$S 64.480, el 44 % del total, empujada por el alquiler de la excavadora sobre orugas, U$S 30.400 por 320 horas, y del camión volcador, U$S 22.000 por 400 horas. El tratamiento biológico suma U$S 32.940, con la enmienda estructurante y el fertilizante como principales insumos. El relleno y la reconformación alcanzan U$S 21.580 y la revegetación U$S 17.780, concentrada en los 1.200 m³ de suelo vegetal. El monitoreo, con U$S 8.680, es el capítulo menor en dinero y el que habilita la aprobación de la autoridad. La mano de obra propia, capataz, operarios, operador de tractor, técnico y profesional ambiental, representa unos U$S 26.400 por año, el 18 % del costo operativo: el proyecto es intensivo en equipo alquilado más que en plantel. El tractor incorporado en la inversión entra acá sólo por su costo horario de mantenimiento, U$S 8 la hora, y no por su valor.","narrFF":"El flujo tiene un único desembolso en el período 0, de U$S 163.450, y una componente operativa de U$S 145.460 que se repite en los cinco períodos siguientes por la convención de flujo libre de riesgo. La relación entre inversión y operación anual es de 1,12: el proyecto gasta cada año casi lo mismo que invirtió, porque remediar es mover y tratar material, no instalar una capacidad que después produce sola. No hay componente positiva, así que el saldo de todos los períodos es negativo y el flujo acumulado nunca cambia de signo. Corresponde una observación de coherencia: el pasivo se agota en dos campañas y el tercer año cierra con el relleno y la revegetación, de modo que los períodos 4 y 5 sólo comprenden monitoreo y control de cobertura. Repetir en ellos la campaña completa sobrestima el costo y deja el VAC del orden de U$S 579.000 como cota superior; corregidos esos dos períodos, el orden baja a U$S 460.000. En etapa de idea/perfil se trabaja con la cota superior y se declara el ajuste.","tributo":{"aplica":false,"ingresoAnual":0,"just":"La categoría tributaria se determina sobre el ingreso bruto anual y el proyecto no tiene ingresos: no hay base imponible que categorizar. El costo de la remediación se imputa como gasto de la empresa operadora del área, que tributa por su actividad hidrocarburífera, ajena al alcance de este formulario."},"concl":"El VAC a una TMAR del 21 % es del orden de U$S 579.000, equivalente a unos U$S 198.000 anuales sobre el horizonte de cinco períodos. Referido al pasivo, son unos U$S 96 por m³ de suelo y barro tratado, un orden compatible con el tratamiento biológico en biopilas para volúmenes de esta escala. No hay VAN, TIR ni RBC: sin componente positiva no existe tasa que anule el flujo. El VAC sirve para comparar alternativas que produzcan el mismo resultado ambiental, biopilas contra landfarming o tratamiento en sitio contra transporte a operador habilitado, y no para decidir si el proyecto conviene: conviene porque es una obligación y porque el resultado es el levantamiento del pasivo. Lo que estos números no habilitan a decir, en etapa de idea/perfil, es cuánto va a costar efectivamente la remediación. El volumen de 6.000 m³ es un supuesto derivado de las dimensiones de las piletas y no de una caracterización, y el tiempo de biodegradación depende de la concentración inicial, del clima y de la textura del suelo. Una caracterización del pasivo y un ensayo de tratabilidad pueden mover el costo total en más o menos 30 %.","fin":[{"org":"Banco de Inversión y Comercio Exterior","linea":"Crédito de inversión productiva con destino ambiental","etapa":"inversión","cond":"Financia bienes de capital y obra civil; plazo de 5 a 7 años, con período de gracia."},{"org":"Consejo Federal de Inversiones","linea":"Crédito para la producción regional","etapa":"ambas","cond":"Montos acotados, tasa subsidiada y garantía real; requiere aval provincial."},{"org":"Aseguradora con póliza de caución ambiental (Ley 25.675, art. 22)","linea":"Seguro ambiental obligatorio por daño de incidencia colectiva","etapa":"ambas","cond":"Cubre la recomposición del sitio ante siniestro; no financia la obligación ya declarada."},{"org":"Empresa operadora del área hidrocarburífera","linea":"Previsión contable de abandono y remediación","etapa":"ambas","cond":"Fondos propios ya provisionados; es la fuente principal y no devenga intereses."}],"claves":["Un proyecto de remediación ejecutado por una empresa privada se valora como público: sin un bien que se venda no hay componente positiva y el único indicador posible es el VAC.","El bien de capital incorporado en la inversión entra en la operación por su gasto de funcionamiento y mantenimiento: el tractor de U$S 48.000 aparece en la operación a U$S 8 la hora, no a U$S 48.000.","Los equipos alquilados por hora, excavadora, camión volcador, motoniveladora y termofusión, son recurso de la tarea que los usa y no bienes de capital del proyecto; por eso la extracción, con U$S 64.480 anuales, es el mayor costo operativo y no figura en la inversión.","El horizonte no lo fija el recupero de la inversión sino el pasivo finito y el plazo de cierre de la autoridad: tres años de operación más dos de seguimiento post cierre.","Cuando la materia prima es finita, repetir la componente operativa en todos los períodos da una cota superior del VAC: hay que declararlo en lugar de esconderlo detrás de la convención."],"trampa":{"mal":"Inventar una componente positiva: valuar a precio de campo las 2 ha reincorporadas al uso agropecuario y sumarles el ahorro de la sanción que la autoridad no va a aplicar, para cerrar el ejercicio con un VAN y una TIR.","bien":"El proyecto no vende nada. La componente positiva es cero, el flujo tiene sólo costos y el indicador es el VAC. Las 2 ha recuperadas y la freática protegida se justifican como beneficio económico social en el ítem D, sin valorarlas en el flujo de fondos.","porque":"Las 2 ha de campo en el departamento de Orán valen del orden de U$S 6.000, frente a un VAC de U$S 579.000: el 1 % del flujo. Incorporadas como ingreso, sin embargo, obligan a calcular una TIR sobre un flujo que nunca cambia de signo y convierten una obligación regulatoria cumplida en un proyecto aparentemente rentable. El error no está en el monto sino en el instrumento."}},"3":{"n":3,"titulo":"Vivero de nativas para restauración y arbolado","tipo":"mixto","tipoNota":"El vivero es de gestión pública y destina 50.000 de los 60.000 plantines anuales al programa de restauración del propio predio fiscal, sin venta, mientras entrega los 10.000 restantes a municipios e instituciones a precio de convenio: hay una componente positiva monetaria, pero minoritaria. Por eso se calculan VAN, TIR y RBC sobre esa fracción y, en paralelo, el VAC, que es el indicador que ordena la comparación con otras alternativas de abastecimiento de plantines.","periodo":"año","per0":"El período 0 abarca los doce meses de la etapa de inversión: acondicionamiento del predio, infraestructura de propagación, sistema de agua y riego, equipamiento de semilla, vehículos y capacitación del equipo, más la puesta en marcha del vivero.","horizonte":10,"horizonteJust":"Diez años operativos. El horizonte se fija por la vida útil del capital que manda: invernáculo y umbráculo del orden de quince años con reposición de film a mitad de camino, sistema de riego doce años, cámara de semillas y vehículos diez. Por debajo de diez años el horizonte cortaría el programa de restauración de las 800 ha, que se ejecuta en etapas plurianuales, y no permitiría ver la puesta en régimen del tercer año. No corresponde fijar el horizonte a partir del recupero de la inversión: con un ingreso monetario de U$S 26.000 por año sobre un costo operativo de U$S 64.143, el proyecto no recupera los U$S 192.458 invertidos por vía de la venta, y el criterio de decisión es el costo por plantín, no el repago.","recI":[{"cod":"A","tarea":"Desmalezado y limpieza del terreno","recurso":"Cuadrilla de desmalezado y retiro de residuos","unidad":"jornales","cant":24,"pu":35.0,"fuente":"Escala salarial de peón rural, convenio vigente"},{"cod":"A","tarea":"Desmalezado y limpieza del terreno","recurso":"Retroexcavadora con operador para retiro de raigones","unidad":"horas de uso","cant":16,"pu":45.0,"fuente":"Tarifario de alquiler de maquinaria vial local"},{"cod":"A","tarea":"Nivelación y compactación de la superficie de canteros","recurso":"Motoniveladora con operador","unidad":"horas de uso","cant":24,"pu":60.0,"fuente":"Tarifario de alquiler de maquinaria vial local"},{"cod":"A","tarea":"Nivelación y compactación de la superficie de canteros","recurso":"Gasoil","unidad":"litros","cant":180,"pu":1.1,"fuente":"Precio surtidor de gasoil grado 2, Salta"},{"cod":"A","tarea":"Ejecución de canales de desagüe perimetrales","recurso":"Retroexcavadora con operador","unidad":"horas de uso","cant":30,"pu":45.0,"fuente":"Tarifario de alquiler de maquinaria vial local"},{"cod":"A","tarea":"Ejecución de canales de desagüe perimetrales","recurso":"Tubos de hormigón y material de cruces","unidad":"metros lineales","cant":40,"pu":28.0,"fuente":"Lista de corralón de materiales, plaza local"},{"cod":"A","tarea":"Cierre perimetral con alambrado olímpico","recurso":"Alambrado olímpico de 2 m de altura con postes","unidad":"metros lineales","cant":420,"pu":42.0,"fuente":"Lista de corralón de materiales, plaza local"},{"cod":"A","tarea":"Cierre perimetral con alambrado olímpico","recurso":"Cuadrilla de montaje del cierre perimetral","unidad":"jornales","cant":30,"pu":35.0,"fuente":"Escala salarial de peón rural, convenio vigente"},{"cod":"A","tarea":"Cierre perimetral con alambrado olímpico","recurso":"Portón de acceso de dos hojas","unidad":"cantidad","cant":1,"pu":650.0,"fuente":"Lista de corral ro del equipamiento de manejo de semilla","comp":"Vivero dotado de equipamiento de manejo de semilla","activo":"depreciable","vida":10,"rel":"Se obtienen la cámara de conservación, el laboratorio de germinación y el equipamiento de beneficio de semilla, que sostienen la trazabilidad de procedencia, por U$S 27.600."},{"cod":"E","acc":"Dotar al proyecto de los vehículos de recolección y despacho","comp":"Proyecto dotado de una camioneta y un acoplado playo","activo":"depreciable","vida":10,"rel":"Se obtienen la camioneta 4x4 y el acoplado playo acondicionado con bandejas portaplantines, que resuelven cosecha y despacho, por U$S 40.700."},{"cod":"F","acc":"Capacitar al equipo técnico y operativo del vivero","comp":"Equipo técnico y operativo del vivero capacitado","activo":"nominal","vida":5,"rel":"Se obtienen el equipo formado en cosecha de semilla, propagación y sanidad, y el manual de procedimientos y trazabilidad, por U$S 7.410."}],"compO":[{"cod":"A","acc":"Recolectar y acondicionar semilla de procedencia local","comp":"Semilla de procedencia local recolectada y acondicionada","tipoFF":"funcionamiento","rel":"La semilla de procedencia registrada de 18 especies cuesta U$S 11.203 por año, con la cosecha de monte como partida dominante; la cámara ya está en la inversión y sólo aparece por su energía y su mantenimiento."},{"cod":"B","acc":"Producir plantines en vivero","comp":"Plantines producidos en vivero","tipoFF":"funcionamiento","rel":"La producción de las dos cohortes superpuestas, con 66.000 envases, 95 m³ de sustrato y 3.600 m³ de agua, cuesta U$S 41.030 por año."},{"cod":"C","acc":"Entregar los plantines en los sitios de plantación","comp":"Plantines entregados en los sitios de plantación","tipoFF":"comercializacion","rel":"La programación, el flete y el registro de las entregas de la ventana de lluvias cuestan U$S 7.170 por año, incluidos combustible, seguro y mantenimiento de los vehículos ya invertidos."},{"cod":"D","acc":"Monitorear la supervivencia de los plantines entregados","comp":"Supervivencia de los plantines entregados monitoreada","tipoFF":"funcionamiento","rel":"El control de supervivencia a los 6 y 12 meses y el informe anual de ajuste del plan de producción cuestan U$S 4.740 por año."}],"ing":{"aplica":true,"momento":"t1tn","items":[{"concepto":"Plantines nativos entregados a municipios, instituciones educativas y organizaciones a precio de convenio","cant":10000,"unidad":"plantines por año","precio":2.6,"desde":1,"escala":[0,0.35,0.7,1,1,1,1,1,1,1],"nota":"Son los 10.000 plantines anuales de las campañas de forestación urbana; el factor de escala refleja que el vivero entra en régimen en el tercer año, con la primera entrega parcial recién en el segundo, porque un plantín nativo requiere de doce a dieciocho meses de vivero."}],"just":"De los 60.000 plantines por año del dimensionamiento, sólo los 10.000 de las campañas urbanas generan un ingreso monetario al proyecto: se entregan a municipios, escuelas y organizaciones mediante convenio, a un precio de U$S 2,60 por plantín en envase de 1,5 litros, por debajo de la góndola de vivero comercial y por encima del costo directo de producción. Los 50.000 restantes van al programa de restauración del propio predio fiscal, dentro de la misma órbita pública: no hay venta ni transferencia de fondos, y contabilizarlos como ingreso inflaría el flujo con dinero que nunca entra. El precio de convenio es una referencia de plaza para plantín forestal de un año; el volumen depende de decisiones presupuestarias anuales y por eso se toma conservador.","benef":"El ingreso monetario del proyecto son U$S 26.000 por año en régimen. El beneficio económico es otra cosa y es mucho mayor: 50.000 plantines anuales de procedencia local y trazable habilitan el enriquecimiento del bosque nativo, la estabilización de laderas de más del 30 % de pendiente y la forestación de los sectores de uso público de las 800 ha del borde este. Eso se traduce en control de erosión y de sedimentos sobre la ciudad, regulación hídrica, sombra y confort térmico urbano, hábitat y conservación de dos especies con categoría desfavorable, y disponibilidad de material vegetal en la ventana de lluvias, que hoy no existe en la región. Ninguno de esos efectos se valora en este formulario, pero son la razón del proyecto."},"repo":[{"concepto":"Reposición del film del invernáculo y de parte de la media sombra","periodos":[5,9],"monto":3600.0,"nota":"El film de polietileno pierde transmisión y resistencia a los cuatro o cinco años de exposición y se repone junto con los paños más castigados del umbráculo."},{"concepto":"Reposición de la electrobomba sumergible del pozo","periodos":[7],"monto":2800.0,"nota":"El equipo de bombeo trabaja todo el año contra un stock permanente de 90.000 envases y se estima una vida útil menor que la del pozo."},{"concepto":"Capacitación de actualización en propagación y sanidad","periodos":[4,8],"monto":2600.0,"nota":"Las capacitaciones durante la operación se registran en el período en que ocurren, no en el período 0."}],"salv":{"monto":27000.0,"just":"Valor residual al cabo de diez años de la camioneta y el acoplado, el galpón de sustratos, el alambrado perimetral y la cámara de conservación, estimado por vida útil remanente."},"td":{"rf":4.0,"rp":10.0,"rpr":8.0,"just":"Tasa libre de riesgo del 4 % de bonos del Tesoro estadounidense, riesgo país del 10 % dentro de la banda argentina, y prima de riesgo del proyecto del 8 %, en el tramo medio-bajo. La producción de plantines es una tecnología conocida, con activos de uso alternativo, pero enfrenta dos riesgos propios: un ciclo biológico de doce a dieciocho meses que compromete producción antes de conocer la demanda, y una demanda institucional que se decide año a año. TMAR resultante del 22 % en dólares."},"narrI":"La inversión total asciende a U$S 192.458 y se concentra en tres bloques. El primero es la infraestructura de propagación, U$S 58.260, es decir el 30 % del total, con el galpón de sustratos y el invernáculo de 300 m² como partidas mayores. El segundo son los vehículos, U$S 40.700, donde la camioneta 4x4 sola explica U$S 32.000: es el único ítem que por sí mismo mueve el orden de magnitud del flujo. El tercero es el sistema de captación y riego, U$S 33.480, dominado por la perforación y la red de microaspersión y goteo. El acondicionamiento del predio suma U$S 25.008, con el alambrado olímpico de 420 metros como partida principal, y el equipamiento de semilla U$S 27.600. La capacitación, U$S 7.410, es el único activo nominal. Los precios se estimaron a nivel de idea con listas de corralón, tarifarios de maquinaria, listas de proveedores de equipamiento y escalas salariales de convenio, sin cotización firme: son estimaciones de fuentes secundarias.","narrO":"El costo operativo anual en régimen es de U$S 64.143, equivalente a U$S 1,07 por plantín entregado sobre 60.000. La producción en vivero es la componente dominante, U$S 41.030, el 64 % del total. Dentro de ella mandan los jornales: 480 jornales de operarios de vivero, U$S 16.800, a los que se suman 150 de siembra y repique y 60 de traslado y selección. Sumando la cosecha de semilla y el monitoreo, la mano de obra representa cerca de dos tercios del gasto operativo, lo que era esperable en una actividad donde el repique y la selección no se automatizan a esta escala. Los insumos que siguen en peso son los 66.000 envases y los 95 m³ de sustrato. Ningún bien de capital vuelve a aparecer por su valor: la cámara, el umbráculo y los vehículos se consignan sólo por su energía, su mantenimiento, su seguro y su reposición parcial.","narrFF":"El flujo muestra una inversión de U$S 192.458 en el período 0 contra un costo operativo de U$S 64.143 por año: la operación equivale a un tercio de la inversión por período, de modo que a partir del tercer año el acumulado de costos operativos pesa más que la inversión inicial. Los ingresos monetarios nunca alcanzan a los costos. En régimen entran U$S 26.000 por año, el 41 % del costo operativo anual, y en los dos primeros años ni siquiera eso, porque el vivero entra en régimen recién en el tercero y la primera entrega se produce en el segundo. El flujo neto es negativo en todos los períodos y el proyecto no se repaga por vía del ingreso. Eso no lo invalida: la mayor parte de la producción abastece una restauración pública que hoy no tiene proveedor. Por eso el flujo se lee con VAC y el resultado relevante es el costo por plantín puesto en la ventana de plantación.","tributo":{"aplica":false,"ingresoAnual":26000.0,"just":"El vivero se opera desde la órbita pública provincial y las entregas a municipios e instituciones se instrumentan por convenio, sin actividad comercial gravada, de modo que no corresponde categoría tributaria. Se deja registrado el ingreso bruto anual de U$S 26.000 en régimen porque, si el vivero se desprendiera como unidad privada, ese monto definiría la categoría de monotributo aplicable."},"concl":"Los indicadores que corresponden leer son dos. Sobre la fracción con ingreso, VAN, TIR y RBC dan resultado negativo: con U$S 26.000 anuales frente a U$S 64.143 de costo operativo y U$S 192.458 de inversión, no hay TIR positiva ni relación beneficio-costo mayor que uno, y el proyecto no es viable como negocio. Sobre el conjunto, el indicador que ordena la decisión es el VAC, descontado al 22 %: el costo actual de poner 60.000 plantines nativos por año en la ventana de lluvias durante diez años. Ese número es el que se compara con la alternativa de comprar plantines a terceros, si existiera oferta, o con el costo de no restaurar. Estos resultados no habilitan a decir que el proyecto es conveniente ni inconveniente: estamos a nivel de idea, con precios de fuentes secundarias, sin cotización firme, con un volumen de demanda institucional supuesto y sin haber valorado el beneficio económico de la restauración. Habilitan a decir que el orden de magnitud cierra y que la decisión se juega en el costo unitario, no en la rentabilidad.","fin":[{"org":"Fondo Nacional para el Enriquecimiento y la Conservación de los Bosques Nativos (Ley 26.331)","linea":"Planes de conservación y restauración con componente de vivero","etapa":"ambas","cond":"Plan aprobado por la autoridad local de aplicación, rendición anual y superficie bajo plan"},{"org":"Consejo Federal de Inversiones","linea":"Crédito para la producción regional","etapa":"inversión","cond":"Tasa subsidiada, plazo de hasta cinco años con período de gracia; garantía real o fianza"},{"org":"Ministerio de Ambiente y Producción de la provincia de Salta","linea":"Convenio de provisión de plantines para arbolado urbano y restauración","etapa":"operación","cond":"Convenio plurianual con metas anuales por especie y precio de referencia actualizable"},{"org":"Banco de la Nación Argentina","linea":"Línea de inversión productiva para actividades agroforestales","etapa":"inversión","cond":"Financia hasta el 70 % de bienes de capital; amortización a diez años"},{"org":"Cooperación internacional y fondos de restauración de paisajes","linea":"Aportes no reembolsables para restauración y conservación de especies amenazadas","etapa":"ambas","cond":"Contraparte local del 20 %, monitoreo de supervivencia e informes de resultados"}],"claves":["En un proyecto mixto se valora como ingreso sólo lo que entra efectivamente en dinero: los 50.000 plantines que van a la restauración del propio predio fiscal no son venta y no se registran, aunque sean el grueso de la producción.","El bien de capital se paga una sola vez, en la inversión: en la operación la cámara de conservación, el umbráculo y la camioneta reaparecen únicamente como energía, mantenimiento, seguro y reposición parcial.","El factor de escala del ingreso traduce al flujo una decisión ya tomada en el F02: el vivero entra en régimen en el tercer año porque un plantín nativo necesita de doce a dieciocho meses, y el flujo no puede mostrar producción plena desde el período 1.","Cuando los ingresos no cubren los costos, el horizonte no se fija por el recupero de la inversión sino por la vida útil del capital que manda y por el ciclo del programa que se abastece.","El beneficio económico se justifica siempre, aunque no se valore: el control de erosión, la regulación hídrica y la conservación de dos especies amenazadas son la razón del proyecto, y no aparecen en ninguna celda del flujo."],"trampa":{"mal":"Valorar los 60.000 plantines como ingreso, a precio de vivero comercial, porque el F02 declara una capacidad de 60.000 plantines por año.","bien":"Registrar como componente positiva sólo los 10.000 plantines entregados a municipios e instituciones a precio de convenio, U$S 26.000 por año en régimen, y dejar los 50.000 de la restauración fuera del ingreso, justificados en el beneficio económico.","porque":"A U$S 2,60 el plantín, contar los 60.000 daría U$S 156.000 por año en lugar de U$S 26.000: un flujo neto positivo inventado de más de U$S 90.000 anuales sobre un costo operativo de U$S 64.143, con VAN y TIR que dirían que el vivero es un buen negocio cuando la restauración no le paga nada. El error convierte un proyecto que debe evaluarse por VAC en uno que aparenta rentabilidad."}},"6":{"n":6,"titulo":"Agua de lluvia para usos no potables en un hotel","tipo":"privado","tipoNota":"El titular es un establecimiento hotelero privado que financia la obra con capital propio y se apropia íntegramente de su resultado, de modo que corresponden VAN, TIR y RBC. La particularidad del caso es que la componente positiva no es una venta sino un costo evitado: el hotel no vende agua, deja de comprarla, y ese ahorro entra al flujo de fondos como componente positiva porque es una salida de dinero que deja de ocurrir.","periodo":"año","per0":"Los 12 meses de la etapa de inversión, ejecutados dentro de los 24 meses de obra del hotel y concentrados en la segunda y la tercera etapa de ocho meses. Abarca la adecuación de cubiertas, las dos cisternas, la segunda red, el equipamiento de bombeo y filtrado, la medición y la capacitación. Toda la inversión se registra al cierre del período 0.","horizonte":10,"horizonteJust":"Se adoptan diez períodos anuales, los mismos que el F02 fijó para la etapa de operación. El horizonte lo marca la vida útil del equipamiento electromecánico, diez años, que es el activo más corto entre los decisivos; la obra civil y la red duran mucho más y su remanente se recupera como valor residual. La regla de fijar el horizonte tres a cinco años más allá del recupero no puede aplicarse acá: con un margen anual del orden de U$S 4.677 sobre una inversión de U$S 182.353, el tiempo de recupero simple supera los treinta años y ningún horizonte razonable lo alcanza. Ese resultado es el hallazgo del análisis, no un motivo para estirar el horizonte hasta que el VAN cambie de signo.","recI":[{"cod":"A","tarea":"Provisión y montaje de canaletas y embudos en 9.650 m² de cubierta","recurso":"Canaleta de chapa galvanizada de 200 mm con embudos","unidad":"metros","cant":1150,"pu":14,"fuente":"Mercado local de chapa y zinguería"},{"cod":"A","tarea":"Provisión y montaje de canaletas y embudos en 9.650 m² de cubierta","recurso":"Oficial zinguero y ayudante","unidad":"jornal","cant":60,"pu":85,"fuente":"Escala salarial del convenio de la construcción"},{"cod":"A","tarea":"Instalación de rejillas y cestos de retención de hojas","recurso":"Rejilla y cesto de retención de hojas para embudo","unidad":"cantidad","cant":48,"pu":35,"fuente":"Proveedores de accesorios pluviales"},{"cod":"A","tarea":"Instalación de rejillas y cestos de retención de hojas","recurso":"Oficial zinguero y ayudante","unidad":"jornal","cant":8,"pu":85,"fuente":"Escala salarial del convenio de la construcción"},{"cod":"A","tarea":"Montaje de bajadas y colectores hasta el recinto de cisternas","recurso":"Caño de PVC de 110 a 160 mm con accesorios","unidad":"metros","cant":620,"pu":18,"fuente":"Mercado local de materiales sanitarios"},{"cod":"A","tarea":"Montaje de bajadas y co l agua controlada y separación de las dos redes verificada","tipoFF":"funcionamiento","rel":"El control de calidad y la verificación de la separación de las dos redes cuestan U$S 1.500 por año, entre cuatro análisis de laboratorio, el ensayo de conexiones cruzadas y el informe anual de desempeño."},{"cod":"E","acc":"Actualizar la formación del personal y sostener la certificación de hotelería sustentable","comp":"Personal actualizado y certificación de hotelería sustentable sostenida","tipoFF":"funcionamiento","rel":"La actualización anual del personal y la documentación de la certificación de hotelería sustentable cuestan U$S 870 por año; no se consigna el arancel de la certificación, que el establecimiento paga con proyecto o sin él."}],"ing":{"aplica":true,"momento":"t1tn","items":[{"concepto":"Agua de camión cisterna que el establecimiento deja de comprar","cant":1400,"unidad":"m³ por año","precio":8.5,"desde":1,"escala":[0.7,0.9,1,1,1,1,1,1,1,1],"nota":"Es la fracción del volumen sustituido que hoy se cubre con agua comprada a camión en los picos de temporada alta y en las paradas del pozo; el precio es el del m³ entregado en el predio."},{"concepto":"Agua de pozo y de red que el establecimiento deja de extraer y tratar","cant":900,"unidad":"m³ por año","precio":1.7,"desde":1,"escala":[0.7,0.9,1,1,1,1,1,1,1,1],"nota":"Resto del volumen sustituido, valorado al costo propio de extracción, cloración y presurización más el canon de la concesión en trámite."}],"just":"El sistema entrega 2.300 m³ por año y el hotel no los vende: deja de comprarlos. Un ahorro de costo se incorpora legítimamente al flujo de fondos como componente positiva porque representa una salida de dinero que deja de ocurrir, y un peso que no sale vale, en el flujo, lo mismo que un peso que entra. No es lo mismo que un ingreso por venta: no hay cliente, no hay factura ni ingreso bruto. Por eso el volumen no se valora a un precio de venta sino al de la fuente que sustituye: 1.400 m³ de camión cisterna a U$S 8,50 y 900 m³ de extracción propia a U$S 1,70, en total U$S 13.430 por año. Los dos primeros períodos llevan factor de puesta en régimen, 0,7 y 0,9.","benef":"El ingreso monetario del proyecto son los U$S 13.430 anuales que el establecimiento deja de gastar. El beneficio económico es otra cosa y es mayor: 2.300 m³ por año que no se extraen de un acuífero de abanico aluvial cuya depresión regional ya modificó las direcciones de flujo originales, que hoy convergen hacia la ciudad. Ese caudal queda disponible para los demás usuarios del mismo acuífero, que no le pagan nada al hotel y no aparecen en su flujo de fondos. Se suman la menor descarga al canal perimetral que cruza la avenida y una reserva propia de 300 m³ frente a cortes. Nada de eso se valora en el F03: se declara, se dimensiona en unidades físicas y se deja asentado para la evaluación económica."},"repo":[{"concepto":"Reacondicionamiento mayor de las dos electrobombas y del tablero de comando","periodos":[6],"monto":2600,"nota":"A mitad de la vida útil del equipamiento se rehacen sellos, rodamientos y contactores para llegar al año diez sin reemplazo completo."},{"concepto":"Reposición de los dispositivos de desvío de primer lavado y de los cestos de retención","periodos":[7],"monto":2900,"nota":"Son los elementos más expuestos de la captación y se reponen una vez dentro del horizonte."},{"concepto":"Reemplazo de los cuatro caudalímetros, el sensor de nivel y el pluviómetro registrador","periodos":[8],"monto":3400,"nota":"Vencida la vida útil de ocho años de la instrumentación, sin ella el volumen entregado deja de poder verificarse."}],"salv":{"monto":88000,"just":"Valor residual contable de la obra civil, de la canalización y de la segunda red al cierre del período 10, calculado en línea recta sobre vidas útiles de 40, 20 y 30 años; no es un valor de venta separada, porque quedan incorporados al inmueble."},"td":{"rf":4,"rp":10,"rpr":7,"just":"Tasa libre de riesgo del 4 % por bonos del Tesoro estadounidense y riesgo país del 10 %, dentro de la franja que informa el índice de JP Morgan. La prima del proyecto se fija en 7 %, en la mitad inferior del rango: la tecnología es madura y no hay riesgo comercial, porque no hay nada que vender. El riesgo que queda es de desempeño, ya que el volumen entregado depende de la lluvia y de la operación. La TMAR resulta del 21 % anual en dólares."},"narrI":"La inversión total asciende a U$S 182.353 y se concentra en obra civil y cañerías. Las dos cisternas de 150 m³ son la componente más pesada, U$S 69.890, el 38 % del total, con el hormigón elaborado y el acero explicando por sí solos U$S 37.800. La segunda red no potable sigue con U$S 52.555, el 29 %, donde los 180 jornales de la cuadrilla sanitaria pesan tanto como la cañería. La adecuación de cubiertas y canalizaciones aporta U$S 41.440, el 23 %. El equipamiento electromecánico, la medición y la capacitación suman apenas el 10 % restante. Las cantidades vienen del F02 y no se tocaron; los precios unitarios se tomaron de listas de materiales del mercado local, de la escala salarial del convenio de la construcción y de listas de proveedores de equipamiento. Son precios de perfil, con un error esperable del orden del 20 %, y no reemplazan un cómputo y presupuesto.","narrO":"La operación cuesta U$S 8.753 por año, el 4,8 % de la inversión, una relación baja y característica de un sistema pasivo que trabaja por gravedad y bombeo intermitente. Los servicios técnicos y profesionales son el rubro mayor, U$S 3.340, el 38 %: análisis de laboratorio, ensayo de conexiones cruzadas, informe anual, conservación del equipamiento y documentación de la certificación. La mano de obra propia es el 25 %, U$S 2.160, unos 48 jornales anuales del personal de mantenimiento del hotel, que no se incorpora sino que se afecta parcialmente. Los insumos aportan el 21 % y la energía de bombeo más el agua de reposición del pozo, el 16 %. Las dos filas de origen capital se valoran por su gasto de conservación, U$S 360 las cisternas y U$S 720 las electrobombas, nunca por el valor del bien. No hay gastos de comercialización: el proyecto no vende nada.","narrFF":"El flujo muestra una inversión de U$S 182.353 en el período 0 contra movimientos anuales chicos y parejos: U$S 13.430 de costo evitado y U$S 8.753 de costos operativos, con un margen de U$S 4.677 por año una vez alcanzado el régimen. La operación se paga a sí misma desde el primer período, incluso con el factor de puesta en régimen de 0,7, y eso ya es un resultado: el sistema no consume más de lo que ahorra. Lo que no ocurre es la recuperación de la inversión. Con ese margen harían falta más de treinta años, muy por encima del horizonte de diez, y aun sumando el valor residual de U$S 88.000 el VAN al 21 % queda netamente negativo y la relación beneficio-costo, bastante por debajo de uno. Las tres reposiciones de los períodos 6, 7 y 8 son marginales y no alteran el cuadro.","tributo":{"aplica":false,"ingresoAnual":0,"just":"No aplica. La categorización tributaria se define sobre el ingreso bruto anual, es decir sobre lo facturado por ventas o servicios, y este proyecto no factura nada: su componente positiva son U$S 13.430 de agua que el establecimiento deja de comprar. Un costo evitado reduce el gasto del hotel y mejora su resultado, pero no constituye ingreso bruto ni genera hecho imponible, de modo que el ingreso bruto anual atribuible al proyecto es cero. Lo que sí cambia es la categoría del hotel como contribuyente: su estructura de costos baja, no su facturación."},"concl":"Los indicadores dicen que el proyecto no se sostiene por su componente monetaria. El VAN al 21 % es netamente negativo, la relación beneficio-costo queda bastante por debajo de uno y la TIR resulta muy inferior a la TMAR: U$S 182.353 de inversión no se recuperan con U$S 4.677 anuales de ahorro. Eso es todo lo que los indicadores habilitan a decir. No habilitan a decir que el proyecto sea malo ni que deba descartarse. Primero, porque a nivel de idea los precios son de fuentes secundarias y arrastran un error del orden del 20 %, suficiente para mover magnitudes pero no el signo. Segundo, y sobre todo, porque el VAN sólo mide lo que pasa por el bolsillo del hotel, y el sentido del proyecto está en los 2.300 m³ anuales que no se extraen de un acuífero deprimido, un beneficio que ningún precio de mercado recoge. El F03 no decide acá: mide con precisión la brecha que la evaluación económica y la certificación deberán cubrir.","fin":[{"org":"Banco de la Nación Argentina","linea":"Línea de inversión productiva para pymes del sector turístico","etapa":"inversión","cond":"Hasta 60 meses, garantía real sobre el inmueble, desembolso contra certificación de avance"},{"org":"Consejo Federal de Inversiones","linea":"Créditos para la producción regional, sector turismo","etapa":"inversión","cond":"Monto y plazo acotados, tasa subsidiada, presentación a través de la provincia"},{"org":"Ministerio de Turismo y Deportes de la Nación","linea":"Asistencia a establecimientos con certificación de sustentabilidad","etapa":"ambas","cond":"Aporte no reembolsable parcial, exige certificación vigente o en trámite"},{"org":"Propietario del establecimiento","linea":"Capital propio dentro del presupuesto de los 24 meses de obra","etapa":"inversión","cond":"Sin costo financiero adicional, condicionado a decidir el sistema antes de la tercera etapa"}],"claves":["Un costo evitado es componente positiva legítima del flujo de fondos: los U$S 13.430 anuales que el hotel deja de gastar en agua comprada son una salida de dinero que deja de ocurrir, y por eso entran del lado positivo aunque nadie facture nada.","El costo evitado se valora al precio de la fuente que se sustituye, no a un precio de venta inventado: por eso los 2.300 m³ se separaron en 1.400 de camión cisterna a U$S 8,50 y 900 de extracción propia a U$S 1,70.","Los bienes de capital ya incorporados en la inversión vuelven a aparecer en la operación sólo por su gasto: las cisternas, U$S 360 anuales de conservación, y las electrobombas, U$S 720 de servicio técnico; nunca por los U$S 69.890 y U$S 11.720 que costaron.","El agua de lluvia que el propio sistema entrega al riego se consigna con precio unitario cero, porque es el producto del proyecto y no un insumo que se compre; valorarla a precio de mercado sería contar dos veces lo mismo.","Un VAN negativo no clausura la decisión: acá mide la brecha que el beneficio económico no valorado, los 2.300 m³ que no se extraen de un acuífero deprimido, tendrá que cubrir en la evaluación económica."],"trampa":{"mal":"Cargar en la operación los 1.100 m³ anuales de agua de lluvia entregados al riego a precio de mercado, como si el proyecto los comprara, y contar además el costo evitado del lado positivo.","bien":"El agua de lluvia es el producto del propio sistema: en la valoración de la operación se consigna con precio unitario 0 y su valor aparece una sola vez, del lado positivo, como agua que el establecimiento deja de comprar.","porque":"Valorados a los U$S 8,50 del agua de camión, esos 1.100 m³ agregarían U$S 9.350 de costo anual inexistente sobre una operación de U$S 8.753 y un margen de U$S 4.677: el flujo anual pasaría de positivo a negativo en casi U$S 4.700 por año y el proyecto quedaría descartado por un error de imputación y no por su desempeño."}},"9":{"n":9,"titulo":"Parque periurbano en el predio fiscal del borde este","tipo":"publico","tipoNota":"El parque se habilita sobre un predio fiscal, es de acceso libre y no cobra entrada ni concesiona servicios, de modo que no genera ingreso monetario alguno. Por eso el único indicador que corresponde calcular es el VAC: no hay VAN, ni TIR, ni RBC.","periodo":"año","per0":"El período 0 abarca las seis acciones de la etapa de inversión del F02, dieciocho meses de calendario desde la firma del convenio de afectación del predio hasta la habilitación al público. Todas las erogaciones de esos dieciocho meses se registran al cierre del período 0.","horizonte":10,"horizonteJust":"Se adopta el horizonte de diez años que el F02 fijó para la etapa de operación. Coincide con la vida útil de la camioneta y del equipamiento de monitoreo, que son los bienes de capital de rotación más corta, y con el plazo en que la cubierta implantada sobre las 45 hectáreas alcanza autonomía y las lagunas completan varios ciclos de purga. No corresponde estimar el Tiempo de Recupero de la Inversión ni fijar el horizonte tres a cinco años más allá: ese criterio es para proyectos privados con ingresos, y acá el flujo no tiene componente positiva que pueda recuperar nada.","recI":[{"cod":"A","tarea":"Amojonamiento del polígono de 60 hectáreas","recurso":"Jornada de cuadrilla topográfica con equipo GNSS","unidad":"jornada","cant":12,"pu":180.0,"fuente":"Aranceles de colegios profesionales, 2026"},{"cod":"A","tarea":"Amojonamiento del polígono de 60 hectáreas","recurso":"Mojón de hormigón premoldeado","unidad":"unidad","cant":60,"pu":18.0,"fuente":"Listas de corralón local, Salta, 2026"},{"cod":"A","tarea":"Instalación de 4.200 m de alambrado perimetral y tres portadas","recurso":"Poste de quebracho colorado","unidad":"unidad","cant":1400,"pu":11.0,"fuente":"Listas de corralón local, Salta, 2026"},{"cod":"A","tarea":"Instalación de 4.200 m de alambrado perimetral y tres portadas","recurso":"Alambre de púa","unidad":"rollo de 500 m","cant":36,"pu":55.0,"fuente":"Listas de corralón local, Salta, 2026"},{"cod":"A","tarea":"Instalación de 4.200 m de alambrado perimetral y tres portadas","recurso":"Portada metálica con tranquera","unidad":"unidad","cant":3,"pu":620.0,"fuente":"Listas de corralón local, Salta, 2026"},{"cod":"A","tarea":"Instalación de 4.200 m de alambrado perimetral y tres portadas","recurso":"Jornal de alambrador","unidad":"jornal","cant":260,"pu":38.0,"fuente":"Escala salarial de convenio rural, jornal 2026"},{"cod":"A","tarea":"Retiro y transporte a disposición final de los microbasurales","recurso":"Camión volcador con de microbasurales y las sendas de extracción clausuradas, por U$S 47.200."},{"cod":"B","acc":"Construir las obras de regulación de la escorrentía","comp":"Obras de regulación de la escorrentía construidas","activo":"nodepreciable","vida":null,"rel":"Se obtienen tres lagunas de retención de 1.800 m³, 3.600 m de zanjas de infiltración, los vertederos conectados a las alcantarillas de la RN 9 y los taludes estabilizados, por U$S 63.205: son movimientos de suelo que se adosan al terreno como unidad inseparable y no se desvalorizan."},{"cod":"C","acc":"Construir los senderos, accesos y áreas de uso público del parque","comp":"Senderos, accesos y áreas de uso público construidos","activo":"depreciable","vida":20,"rel":"Se obtienen 6 km de senderos, 1,8 km de camino interno, el área de acceso con estacionamiento y sanitarios, dos miradores, el aula abierta y cuatro áreas de estar, por U$S 120.335. La base de senderos es inseparable del suelo, pero las construcciones y el equipamiento explican el 59 % del costo y definen la clasificación."},{"cod":"D","acc":"Implantar la cubierta vegetal nativa en los sectores degradados","comp":"Cubierta vegetal nativa implantada","activo":"nodepreciable","vida":null,"rel":"Se obtienen 24.000 plantines nativos implantados sobre 45 hectáreas, con riego de arraigo, protección individual y reposición de fallas al cierre de la primera temporada, por U$S 89.780: la cubierta vegetal se adosa al suelo y no se deprecia, se mantiene."},{"cod":"E","acc":"Dotar al parque de los bienes de capital necesarios para su operación","comp":"Parque dotado de los bienes de capital necesarios para su operación","activo":"depreciable","vida":10,"rel":"Se obtienen la camioneta 4x2, el tractor con acoplado y tanque regador, la perforación con tanque de 20 m³ y red de riego, las herramientas de vivero y poda, el equipo de primera intervención de incendios y el equipamiento de monitoreo hídrico y de fauna, por U$S 134.720."},{"cod":"F","acc":"Capacitar al personal de operación del parque","comp":"Personal de operación del parque capacitado","activo":"nominal","vida":null,"rel":"Se obtienen doce agentes capacitados y certificados en restauración, manejo del fuego y atención de visitantes, por U$S 7.000: es el único activo intangible de la inversión y habilita la puesta en marcha de la operación."}],"compO":[{"cod":"A","acc":"Operar el parque y atender a los visitantes","comp":"Parque operado y visitantes atendidos","tipoFF":"funcionamiento","rel":"El parque abierto los 365 días con portería, guiado de contingentes y limpieza diaria demanda U$S 81.140 por año, el 48 % del costo operativo total, casi íntegramente jornales."},{"cod":"B","acc":"Mantener la cubierta vegetal implantada y reponer las fallas","comp":"Cubierta vegetal mantenida y fallas repuestas","tipoFF":"funcionamiento","rel":"Producir y reponer 3.000 plantines por año, regar en la temporada seca y controlar hormiga y exóticas cuesta U$S 19.120, incluida la energía de bombeo de los 9.000 m³ de la perforación."},{"cod":"C","acc":"Mantener las obras de regulación de la escorrentía","comp":"Obras de regulación de la escorrentía mantenidas","tipoFF":"mantenimiento","rel":"Purgar las tres lagunas, desmalezar y reparar las zanjas e inspeccionar los vertederos antes de cada temporada de lluvias cuesta U$S 12.266 por año, y es lo que conserva la capacidad de retención construida en la acción B de inversión."},{"cod":"D","acc":"Prevenir y controlar los incendios y los usos no autorizados","comp":"Incendios y usos no autorizados prevenidos y controlados","tipoFF":"funcionamiento","rel":"Las recorridas de vigilancia, la reejecución de los 12 km de cortafuegos y la guardia reforzada de agosto a noviembre demandan U$S 47.958 por año, el segundo costo operativo del parque."},{"cod":"E","acc":"Monitorear el desempeño ambiental del parque e informar los resultados","comp":"Desempeño ambiental monitoreado y resultados informados","tipoFF":"funcionamiento","rel":"Medir caudales y sólidos, censar aves y regeneración leñosa en parcelas fijas y elaborar el informe anual para la autoridad de aplicación cuesta U$S 8.432 por año."}],"ing":{"aplica":false,"momento":"no","items":[],"just":"No aplica. El parque es de acceso libre sobre un predio de dominio público: no hay entrada, ni canon de estacionamiento, ni concesión de servicios, ni venta de producto. La componente positiva del flujo de fondos es nula en T0 y de T1 a T10. Se decidió no incorporar ingresos marginales que serían técnicamente posibles, como una concesión gastronómica o la venta de plantines del vivero, por dos razones: ninguno figura entre las acciones que el F02 dimensionó, y cobrar por el acceso levantaría una barrera justamente para la población cuyo déficit de espacio verde justifica el proyecto. El flujo queda integrado sólo por costos y el único indicador calculable es el VAC.","benef":"El proyecto no genera ingreso y sin embargo produce beneficio económico verificable: el incremento de bienestar social, que no se valora acá pero sí se justifica. Primero, 14.000 habitantes del borde este pasan de no tener espacio verde público —una plaza reducida y en pendiente— a disponer de 60 hectáreas, con 180.000 visitas por año, unas 13 por habitante, a un costo operativo de U$S 0,94 por visita. Segundo, las obras de regulación evitan que la habilitación incremente el caudal pico sobre las alcantarillas de la RN 9, único punto de salida sin capacidad ociosa y que descarga sobre un sector de riesgo hídrico crítico: ese daño evitado aguas abajo hoy lo pagan terceros. Tercero, los 1.800 alumnos de la escuela del sector incorporan un aula abierta de 60 hectáreas. Ninguno entra al flujo."},"repo":[{"concepto":"Reposición del equipo de primera intervención de incendios y de las herramientas de vivero y poda","periodos":[5],"monto":6500.0,"nota":"Doce juegos de mochila, batefuego y equipo de protección personal más el herramental, con vida útil de cinco años de uso intensivo."},{"concepto":"Reacondicionamiento mayor de la camioneta y del tractor","periodos":[6],"monto":9800.0,"nota":"Tren rodante, motor y sistema hidráulico a mitad de la vida útil, para llegar al cierre del horizonte en condiciones de uso."},{"concepto":"Reposición de la bomba sumergible de la perforación","periodos":[7],"monto":4200.0,"nota":"La bomba tiene vida útil menor que la perforación y su falla interrumpe el riego de reposición y el servicio de sanitarios."},{"concepto":"Capacitación de actualización del personal de operación","periodos":[4,8],"monto":3800.0,"nota":"Dos ciclos de actualización en manejo del fuego y atención de visitantes, que son capacitaciones durante la operación y van en el período en que ocurren."}],"salv":{"monto":38000.0,"just":"Valor residual de los bienes cuya vida útil excede el horizonte —el tractor con tanque regador, la perforación con su tanque y red de riego, los miradores y el aula abierta—, computado al cierre del período 10 aunque no haya venta, porque el activo sigue prestando servicio."},"td":{"rf":4.0,"rp":10.0,"rpr":6.0,"just":"Se adopta 4 % de tasa libre de riesgo sobre bonos del Tesoro de los Estados Unidos, 10 % de riesgo país argentino según el índice de JP Morgan y 6 % de prima por riesgo del proyecto, el extremo bajo de la banda 5-15 %. El parque no enfrenta riesgo comercial ni de demanda —no vende nada— y opera sobre un predio de dominio público único. El riesgo que sí carga es institucional: la continuidad de la partida operativa. La TMAR resultante es del 20 % en dólares."},"narrI":"El costo de inversión asciende a U$S 462.240 y se registra íntegramente en el período 0. La componente de mayor peso es la dotación de bienes de capital, la acción E, con U$S 134.720, el 29 % del total: la camioneta, el tractor con tanque regador y la perforación con su red de riego concentran esa cifra. La siguen las obras de uso público, U$S 120.335, y la implantación de la cubierta vegetal, U$S 89.780, donde los jornales explican cerca de la mitad. Las obras de regulación de la escorrentía suman U$S 63.205 y el cercado con saneamiento U$S 47.200. La capacitación, U$S 7.000, es el único activo nominal. Los precios se estimaron con listas de corralón local, tarifarios de alquiler de equipo vial, escalas de jornal de convenio y listas de proveedores: fuentes secundarias de 2026, órdenes de magnitud de nivel de perfil y no un cómputo de obra. No se consigna componente circulante porque ninguna acción del F02 la genera; el capital de trabajo del primer año se resuelve con el adelanto de la partida operativa.","narrO":"El costo operativo es de U$S 168.916 por año y se repite sin cambios de T1 a T10, según el supuesto de flujo libre de riesgo. La mano de obra lo domina: la operación del parque, U$S 81.140, y la prevención de incendios con la vigilancia perimetral, U$S 47.958, suman U$S 129.098, el 76 % del costo anual, y son casi todo jornales. El parque abre los 365 días y eso fija una dotación mínima que no se puede escalar hacia abajo sin cerrar días. El mantenimiento de la cubierta implantada cuesta U$S 19.120, el de las obras de regulación U$S 12.266 y el monitoreo con su informe anual U$S 8.432. De los bienes de capital ya incorporados en la inversión sólo se computan su combustible, su energía de bombeo, su conservación y la reposición del equipo de incendios: el valor del tractor, de la camioneta, de la perforación y del aula abierta no vuelve a aparecer en la operación.","narrFF":"El flujo de fondos tiene una sola componente, la negativa. En el período 0 se registran U$S 462.240 de inversión; de T1 a T10, U$S 168.916 por año de operación, más cuatro conceptos de reposición que caen en los períodos 4, 5, 6, 7 y 8, y un recupero de U$S 38.000 de valor residual al cierre. La relación entre ambas etapas es la que hay que leer: en 2,7 años de operación el parque gasta lo que costó construirlo, y a lo largo del horizonte los costos operativos acumulados, U$S 1.689.160 sin descontar, superan tres veces y media la inversión. Es lo contrario de lo que muestra un proyecto productivo y es la marca de los proyectos públicos de espacio verde: lo caro no es hacerlos, es sostenerlos. Como no hay ingresos, la línea del flujo nunca cruza el cero: no hay repago ni punto de equilibrio. El saldo es coherente con el dimensionamiento de 60 hectáreas y 180.000 visitas.","tributo":{"aplica":false,"ingresoAnual":0,"just":"No corresponde categoría tributaria: el proyecto es público, de acceso libre, y no tiene ingreso bruto anual sobre el cual categorizar. El operador, sea el municipio o un tercero por convenio de gestión, tributa por su propia condición y no por este proyecto."},"concl":"Los indicadores dicen menos de lo que un equipo querría. Al 20 % en dólares y con horizonte de diez años, este proyecto tiene VAC y nada más: no hay VAN porque no hay ingresos, no hay TIR porque el flujo no cambia de signo, no hay RBC porque el numerador está vacío. El VAC sí ordena la comparación entre alternativas de un mismo objetivo —habilitar 60 hectáreas frente a habilitar 30, o frente a comprar suelo ya consolidado— y el costo por visita y por habitante permite contrastarlo con estándares de gestión. Lo que el VAC no habilita a decir es si el proyecto conviene. Esa es la pregunta que la Guía deja abierta y que este caso obliga a formular: si en los diez años del horizonte los beneficios económicos —el acceso de 14.000 habitantes a un espacio verde del que hoy carecen, el daño hídrico evitado aguas abajo, la formación de 1.800 alumnos— alcanzan a cubrir los costos de inversión, los costos operativos y el costo de oportunidad social de destinar 60 hectáreas fiscales a conservación. Responderla exige valorar esos beneficios, y eso ya no es Formulario 03.","fin":[{"org":"Ministerio de Ambiente y Desarrollo Sostenible de la Nación","linea":"Fondo Nacional para el Enriquecimiento y la Conservación de los Bosques Nativos (Ley 26.331)","etapa":"inversión","cond":"Plan de conservación aprobado por la autoridad local; desembolso contra avance verificado."},{"org":"Banco Interamericano de Desarrollo","linea":"Préstamo de desarrollo urbano y ambiental para municipios","etapa":"ambas","cond":"Requiere aval provincial, contrapartida local y evaluación económica del proyecto."},{"org":"CAF - Banco de Desarrollo de América Latina","linea":"Línea de infraestructura verde y adaptación urbana","etapa":"inversión","cond":"Proyecto ejecutivo, gestión ambiental y social, y unidad ejecutora conformada."},{"org":"Municipalidad de Salta y Provincia de Salta","linea":"Partida presupuestaria anual y convenio de gestión del predio fiscal","etapa":"operación","cond":"Compromiso plurianual del costo operativo; es la condición de continuidad del proyecto."},{"org":"Régimen provincial de asociación público-privada y concesión de uso","linea":"Concesión de uso de sectores acotados con obligación de mantenimiento","etapa":"ambas","cond":"No puede restringir el acceso libre ni afectar el sector de conservación."}],"claves":["Un proyecto público sin ingresos no tiene VAN ni TIR: tiene VAC, y la decisión se juega en el costo por visita y por habitante, no en el signo del saldo.","El beneficio económico se justifica siempre, aunque no se valore: 14.000 habitantes sin espacio verde, 180.000 visitas, el daño hídrico evitado aguas abajo y 1.800 alumnos son beneficio real, y ninguno es ingreso.","Los bienes de capital de la acción E de inversión entran una sola vez: en la operación se computan el combustible del tractor, la energía de bombeo de la perforación, la conservación del aula abierta y la reposición del equipo de incendios, nunca el valor del bien.","No todo lo que se construye se deprecia: las lagunas, las zanjas y la cubierta vegetal implantada se adosan al suelo como unidad inseparable y van como bienes de capital no depreciables, mientras el alambrado, los sanitarios y el equipamiento sí se deprecian.","En este proyecto los costos operativos acumulados superan tres veces y media la inversión, de modo que el financiamiento de la construcción resuelve la parte fácil: sin compromiso plurianual del gasto operativo el parque se degrada en pocos años."],"trampa":{"mal":"Ponerle un precio sombra a las 180.000 visitas anuales, cargarlas como componente positiva del flujo de fondos y calcular un VAN y una TIR.","bien":"Dejar la componente positiva en cero, calcular el VAC como único indicador y desarrollar el beneficio económico en el ítem D, en texto y con sus magnitudes físicas, sin convertirlo en dinero dentro del flujo.","porque":"A U$S 2 por visita, las 180.000 visitas aportarían U$S 360.000 por año de ingreso inventado, más del doble del costo operativo de U$S 168.916: el flujo pasaría de puros costos a un VAN holgadamente positivo y el proyecto parecería rentable sin haber cobrado nunca un peso. El precio sombra es una herramienta de la evaluación económica y social, no del flujo de fondos financiero del Formulario 03."}},"10":{"n":10,"titulo":"Residuos porcinos: biodigestión y compostaje","tipo":"privado","tipoNota":"El titular es un establecimiento porcino comercial que financia la adecuación con su propio patrimonio y se apropia de los resultados: el compost que vende, el gas que deja de comprar y el fertilizante que deja de aplicar. Corresponden VAN, TIR y RBC, y también la categoría tributaria sobre el ingreso bruto por venta.","periodo":"año","per0":"El período 0 abarca los doce meses de obra y puesta en marcha previstos en el F02 —reparación de fosas, montaje del separador, construcción del biodigestor, acondicionamiento de la playa, red térmica y capacitación—, ejecutados con los animales en las naves y sin detener la producción. Todas las erogaciones de inversión se registran al cierre de ese período.","horizonte":12,"horizonteJust":"El recupero simple de la inversión, contando la puesta en régimen del biodigestor durante los dos primeros años, se alcanza cerca del noveno período. Siguiendo el criterio de la Guía para proyectos privados, el horizonte se fija tres períodos más allá: doce. El plazo también es compatible con la vida útil de la geomembrana de fondo y taludes, del orden de quince años, y con los diez años de operación previstos en el F02, que se extienden dos períodos para que el flujo alcance a mostrar el recupero.","recI":[{"cod":"A","tarea":"Vaciado y limpieza de las fosas bajo piso enrejillado","recurso":"Camión atmosférico contratado con chofer","unidad":"horas de uso","cant":40,"pu":60,"fuente":"Tarifario de transportistas de efluentes de Salta, 2026"},{"cod":"A","tarea":"Vaciado y limpieza de las fosas bajo piso enrejillado","recurso":"Peón para limpieza manual y retiro de sedimentos","unidad":"jornal","cant":24,"pu":38,"fuente":"Escala de jornal del convenio de trabajo agrario"},{"cod":"A","tarea":"Reparación del talud roto de la pileta existente","recurso":"Retroexcavadora con operador","unidad":"horas de uso","cant":24,"pu":55,"fuente":"Lista de contratistas de movimiento de suelos, 2026"},{"cod":"A","tarea":"Reparación del talud roto de la pileta existente","recurso":"Suelo seleccionado y compactación para recomponer el talud","unidad":"m³","cant":180,"pu":12,"fuente":"Lista de contratistas de movimiento de suelos, 2026"},{"cod":"A","tarea":"Impermeabilización de fosas y cámaras de bombeo","recurso":"Revestimiento epoxi-cementicio resistente a purín","unidad":"m²","cant":260,"pu":22,"fuente":"Corralón de materiales de Salta, lista mayorista 2026"},{"cod":"A","tarea":"Impermeabilización de fosas y cámaras de bombeo","recurso":"Cuadrilla de albañilería contratada","unidad":"jornal","cant":30,"pu":45,"fuente":"Escala salarial del convenio de la construcción, 2026"},{"cod":"A","tarea":"Tendido de la cañería de conducción a la planta","recurso":"Cañería de polietileno de alta densidad de 160 mm","unidad":"metros","cant":320,"pu":18,"fuente":"Corralón de materiales de Salta, lista mayorista 2026"},{"cod":"A","tarea":"Tendido de la cañería de conducción a la planta","recurso":"Zanjeo, accesorios nte dicha hay una sola: el compost ensacado, U$S 47.250 por año, colocado a puerta de establecimiento entre horticultores y viveristas del Valle de Lerma. Las otras dos son costos evitados: el biogás que sustituye gas envasado, U$S 29.760, y el digerido que sustituye fertilizante comprado, U$S 12.000, U$S 41.760 en conjunto. Ambos mejoran el flujo igual que un ingreso, pero no son facturación. Los tres valores son estimaciones de perfil: el compost no tiene mercado formal en la provincia y el precio se tomó conservador; el biogás depende de la demanda térmica real y se afectó con una puesta en régimen de dos años.","benef":"El ingreso monetario son los U$S 89.010 que entran o dejan de salir de la caja del titular. El beneficio económico es otra cosa y recae sobre terceros que no pagan por él. Los purines dejan de aportar coliformes tres órdenes de magnitud sobre el límite a una freática sin cartografía ni registro de pozos, en un área con unos 45 hogares dispersos. El olor a amoníaco y sulfuro de hidrógeno que hoy percibe el vecindario disminuye al cerrar fosas y piletas. La captura de metano evita del orden de 1.100 t de CO₂ equivalente por año, cerca del 1 % del inventario provincial del sector porcino. Y los 13 trabajadores dejan de manipular mortandad y purín crudo sin protocolo. Nada de eso se valora acá, pero es lo que justifica el interés público en el proyecto."},"repo":[{"concepto":"Capacitación de refuerzo por rotación de personal","periodos":[4,8],"monto":1800,"nota":"Dos jornadas de actualización en operación y bioseguridad en cada uno de esos períodos, porque la rotación del plantel vacía la capacitación del período 0."},{"concepto":"Repuesto mayor del separador: tornillo sin fin y cribas","periodos":[5,10],"monto":6500,"nota":"Recambio de las partes de desgaste del separador de prensa helicoidal, que trabaja todos los días con material abrasivo; es reposición parcial, no compra del equipo."},{"concepto":"Mantenimiento mayor y cambio de quemador de la caldera dual","periodos":[7],"monto":3500,"nota":"El quemador de biogás se degrada por el sulfuro de hidrógeno residual y se cambia una vez dentro del horizonte."},{"concepto":"Recambio de la cubierta flotante de geomembrana","periodos":[10],"monto":18000,"nota":"La cubierta de captación tiene una vida útil menor que la geomembrana de fondo, del orden de diez años, y se repone en el período en que ocurre."}],"salv":{"monto":45000,"just":"Al cierre del período 12 el separador y el volteador están amortizados, pero la laguna impermeabilizada, las fosas reparadas, la playa y la red térmica conservan valor de uso; se adopta un residual conservador del orden del 20 % de la inversión."},"td":{"rf":4,"rp":10,"rpr":8,"just":"Tasa libre de riesgo del 4 % por bonos del Tesoro estadounidense y riesgo país del 10 %, valor medio del rango de la Guía. La prima del proyecto se fija en 8 %: la tecnología está probada y la materia prima es cautiva y gratuita, lo que baja el riesgo de abastecimiento, pero el compost no tiene mercado formal ni precio de referencia provincial, el rendimiento del biogás en régimen psicrofílico es incierto y no hay norma que estabilice las reglas. TMAR: 22 % anual en dólares."},"narrI":"La inversión total se estima en U$S 229.367, a precios de mercado de 2026 y con la precisión propia de una idea o perfil. El componente más pesado es el biodigestor de laguna cubierta, U$S 60.800, el 27 % del total, donde la geomembrana de fondo, taludes y cubierta explica por sí sola U$S 38.800. Le sigue el separador sólido-líquido con U$S 56.555, el 25 %, concentrado en el equipo de prensa helicoidal. Tercera viene la red térmica a biogás con U$S 45.740, el 20 %, repartida entre la caldera dual y los 420 m de cañería preaislada. Las tres suman el 71 % de la inversión. La reparación de fosas y conducciones aporta el 10 %, la playa de compostaje el 16 % y la capacitación apenas el 3 %. Los precios se estimaron por unidad de obra, con listas de corralones, de proveedores de geosintéticos y de equipamiento pecuario, y con la escala de jornal del convenio agrario. No hay cotización en firme de ningún proveedor y eso debe declararse.","narrO":"El costo de operación anual se estima en U$S 58.223 y se repite sin cambios a lo largo del horizonte, salvo las reposiciones consignadas. La componente más costosa es la digestión anaeróbica, U$S 20.630, el 35 % del total, arrastrada por el operario de planta: 365 jornales al año, U$S 13.870, que solos explican el 24 % de la operación. Le sigue el compostaje con U$S 16.873, el 29 %, repartido entre el material estructurante, el gasoil del tractor y las 10.500 bolsas. La aplicación agronómica aporta el 18 %, casi todo en la cisterna esparcidora contratada por hora. Sumadas las horas de peón, tractorista y operario, la mano de obra directa llega a U$S 19.298, el 33 %; con el asesor agronómico y el responsable ambiental, los servicios de personas explican el 42 %. Ningún bien de capital vuelve a consignarse: el separador, el biodigestor, el volteador y la caldera aparecen sólo por su energía, sus repuestos y su limpieza.","narrFF":"El flujo muestra una inversión concentrada en el período 0, U$S 229.367, y una operación anual estable de U$S 58.223 contra ingresos en régimen de U$S 89.010, de los cuales U$S 47.250 son venta de compost y U$S 41.760 son costos que el establecimiento deja de pagar. El margen de régimen, unos U$S 30.787 por año, recién se alcanza en T3: en T1 la puesta en marcha del biodigestor y el arranque del compostaje dejan un margen apenas positivo, del orden de U$S 1.700. La operación se sostiene sola desde el primer período y no necesita subsidio corriente. El problema no está ahí sino en el tamaño de la inversión frente a ese margen: la relación inversión sobre operación anual es de 3,9 y el recupero simple se alcanza cerca del noveno período. Las reposiciones de los períodos 4, 5, 7, 8 y 10 son menores frente a la inversión inicial y no cambian el perfil del flujo.","tributo":{"aplica":true,"ingresoAnual":47250,"just":"Sólo el compost genera ingreso bruto por venta: 10.500 bolsas de 40 kg a U$S 4,5, U$S 47.250 al año en régimen. El biogás y el digerido, U$S 41.760 entre ambos, son costos evitados y no constituyen facturación, de modo que no integran la base del ingreso bruto aunque sí mejoren el flujo. Con ese nivel el proyecto encuadra en una categoría alta del régimen simplificado, pero se incorpora a la situación fiscal ya existente del establecimiento, que no es un contribuyente nuevo."},"concl":"Los indicadores dicen algo preciso y limitado. Con una TMAR del 22 % anual en dólares y doce períodos, el valor actual neto resulta negativo, la tasa interna de retorno se ubica por debajo del 6 % anual y la relación beneficio-costo cae por debajo de uno, cerca de 0,7. Dentro del rango de tasas que admite la Guía no hay combinación que vuelva positivo este VAN: el resultado es robusto y no depende de la prima elegida. Eso no autoriza a decir que el proyecto no deba hacerse. El flujo compara la planta contra un escenario de base en el que el establecimiento sigue operando como hasta hoy, y ese escenario no existe: hay un expediente de renovación con observaciones, coliformes sobre el límite en los pozos propios y una pérdida al terreno natural. El costo de no hacer nada, multa, clausura o pérdida del certificado de aptitud ambiental, no está en este flujo y es el que decide. En idea o perfil, con precios estimados y un plantel supuesto, estos números fijan el orden de magnitud y permiten comparar alternativas, no aprobar ni rechazar la inversión.","fin":[{"org":"Titular del establecimiento","linea":"Aporte propio y reinversión de utilidades","etapa":"ambas","cond":"Sin costo financiero explícito; compite con la reposición de plantel y galpones"},{"org":"Banco de la Nación Argentina","linea":"Línea de inversión productiva para PyMEs agropecuarias","etapa":"inversión","cond":"Plazo de 5 a 7 años, garantía prendaria o hipotecaria, tasa subsidiada"},{"org":"Consejo Federal de Inversiones","linea":"Créditos para la reactivación productiva","etapa":"ambas","cond":"Monto acotado por empresa, tasa fija en pesos, evaluación técnica provincial"},{"org":"Fondo Nacional de Desarrollo Productivo","linea":"Bonificación de tasa para eficiencia energética y biogás","etapa":"inversión","cond":"Bonificación de puntos de tasa sobre crédito bancario; exige proyecto técnico"},{"org":"Banca comercial","linea":"Leasing de bienes de capital","etapa":"inversión","cond":"Aplicable al separador, la caldera y el volteador; canon mensual, opción de compra"}],"claves":["Un proyecto puede tener margen operativo positivo desde el primer período y aun así VAN negativo: lo que no cierra acá no es la operación sino el tamaño de la inversión frente a un margen anual de U$S 30.787.","El costo evitado entra al flujo con el mismo signo que una venta, pero no es lo mismo: de los U$S 89.010 de ingreso anual, sólo los U$S 47.250 del compost son ingreso bruto facturable y van al ítem tributario.","Los bienes de capital incorporados en la inversión no vuelven a valorarse en la operación: el separador, el biodigestor, el volteador y la caldera aparecen en recO sólo por su energía, sus repuestos y su limpieza.","El F02 no previó una acción de comercialización, así que el compost tiene que valorarse a precio de retiro en el predio, U$S 4,5 la bolsa; si el equipo quisiera venderlo puesto en la ciudad tendría que volver al F02 y agregar la acción con su flete.","Cuando el VAN es negativo bajo todo el rango de tasas de la Guía, la conclusión útil no es rechazar el proyecto sino explicitar qué quedó fuera del flujo: acá, el costo de perder el certificado de aptitud ambiental."],"trampa":{"mal":"Contar el digerido líquido dos veces: cargarlo como ingreso de U$S 12.000 anuales por fertilizante evitado en la componente positiva y, además, restar esos mismos U$S 12.000 del costo de operación de la acción D porque «ya no se compra fertilizante».","bien":"Se elige un solo lado del flujo y se lo mantiene. Acá se registra el digerido como componente positiva, U$S 12.000 al año, y la acción D se consigna con su costo real completo, U$S 10.680, que es la cisterna esparcidora, el asesor agronómico y el registro. El costo del fertilizante que ya no se compra no aparece en ningún lado, porque nunca estuvo en este flujo: pertenece a la actividad agrícola preexistente del establecimiento, no al proyecto.","porque":"El doble cómputo agrega U$S 12.000 falsos por período. Sobre un margen de régimen de U$S 30.787 son un 39 % de inflación del resultado anual, U$S 144.000 nominales a lo largo de los doce períodos, suficiente para adelantar el recupero del noveno período al séptimo y para que el equipo crea que el VAN se acerca al cero cuando no se movió. El error es tentador porque el beneficio es real: lo que está mal es contarlo dos veces."}}};    /* el Formulario 03 resuelto de cada escenario */

/* formato argentino */
function fmt(n, dec){
  if(n == null || !isFinite(n)) return '—';
  dec = (dec == null ? 0 : dec);
  var neg = n < 0; n = Math.abs(n);
  var s = n.toFixed(dec);
  var p = s.split('.');
  p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (neg ? '−' : '') + p.join(',');
}
function fmtM(n, dec){ return (n == null || !isFinite(n)) ? '—' : (n<0?'−':'') + 'U$S ' + fmt(Math.abs(n), dec==null?0:dec); }
function fmtP(n, dec){ return (n == null || !isFinite(n)) ? '—' : fmt(n, dec==null?2:dec) + ' %'; }
