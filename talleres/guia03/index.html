<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FEPAR 2026 · Guía 03 y Formulario 03 — presentación de clase</title>
<meta name="description" content="Presentación de clase de la Guía 03 de FEPAR 2026: el flujo de fondos, los tipos de activo, la componente positiva y negativa, el horizonte, la TMAR y los indicadores, con el recorrido del Formulario 03 campo por campo.">
<style>
:root{
  --bg:#06110d; --bg2:#0a1a14; --panel:#0e2019; --panel2:#0b1a15;
  --line:rgba(255,255,255,.11); --line2:rgba(255,255,255,.22);
  --tx:#eef7f3; --tx2:#bdd3ca; --tx3:#84a096;
  --verde:#00a05a; --verde-l:#22c97f; --aqua:#12b5a0; --celeste:#39b6d8;
  --oro:#eda100; --violeta:#8a79e0; --coral:#ef6a4b; --bad:#ef5350;
  --ac:var(--verde-l);
  --ff:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:20px; --r-s:14px;
  --u:clamp(9px, 1.05vw, 17px);        /* unidad tipográfica base de la proyección */
}
html[data-theme="light"]{
  --bg:#f4f8f6; --bg2:#eaf1ee; --panel:#fff; --panel2:#f6faf8;
  --line:rgba(16,36,29,.14); --line2:rgba(16,36,29,.28);
  --tx:#0d211a; --tx2:#3a534a; --tx3:#647e74;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:var(--ff);overflow:hidden;
  -webkit-font-smoothing:antialiased;line-height:1.45}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;transition:background .5s;
  background:radial-gradient(1200px 780px at 8% -10%, color-mix(in srgb, var(--ac) 22%, transparent), transparent 62%),
             radial-gradient(900px 600px at 98% 108%, color-mix(in srgb, var(--ac) 12%, transparent), transparent 60%)}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb, var(--ac) 70%, transparent) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:color-mix(in srgb, var(--ac) 70%, transparent);border-radius:9px;
  border:3px solid transparent;background-clip:padding-box}

/* ============================== ESCENARIO ============================== */
#esc{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;
  padding:calc(var(--u)*3.4) calc(var(--u)*4.2) calc(var(--u)*5.2)}
#dia{width:100%;max-width:1680px;max-height:100%;overflow:auto;padding:2px}
/* entrada suave de cada pantalla */
/* fundido puro: un desplazamiento haría aparecer la barra de scroll un instante */
@keyframes entra{from{opacity:0}to{opacity:1}}
#dia.entra>*{animation:entra .34s cubic-bezier(.22,.8,.3,1) both}
#dia.entra>*:nth-child(2){animation-delay:.05s}
#dia.entra>*:nth-child(3){animation-delay:.09s}
@media (prefers-reduced-motion:reduce){#dia.entra>*{animation:none}}
/* las pantallas con demostración llevan más cosas: se compactan un poco */
#dia.demo{--u:clamp(8px, .86vw, 14px)}
#dia.demo .dato{font-size:calc(var(--u)*2.5)}
#dia.demo .dato.largo{font-size:calc(var(--u)*1.5)}
#dia.demo .lead{font-size:calc(var(--u)*1.3);margin-top:calc(var(--u)*.7)}
#dia.demo .box{padding:calc(var(--u)*.78) calc(var(--u)*1)}
#dia.demo .card{padding:calc(var(--u)*1.05) calc(var(--u)*1.15)}
#dia.demo svg.g{margin-top:calc(var(--u)*.5)}
#dia::-webkit-scrollbar{width:8px}

/* ============================== BARRA ============================== */
#pie{position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(var(--u)*3.4);
  display:flex;align-items:center;gap:calc(var(--u)*.9);padding:0 calc(var(--u)*1.6);
  background:linear-gradient(0deg, var(--panel), transparent);pointer-events:none}
#pie>*{pointer-events:auto}
.marca{font-size:calc(var(--u)*.78);letter-spacing:.16em;text-transform:uppercase;color:var(--ac);
  font-weight:800;flex:none}
#sec-n{font-size:calc(var(--u)*.82);color:var(--tx3);flex:1;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;font-weight:600}
#cont{font-size:calc(var(--u)*.82);color:var(--tx3);font-variant-numeric:tabular-nums;flex:none;font-weight:700}
#prog{position:fixed;left:0;bottom:0;height:3px;background:var(--ac);z-index:21;transition:width .28s ease}
.bi{border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--tx2);border-radius:9px;
  padding:calc(var(--u)*.26) calc(var(--u)*.62);font-size:calc(var(--u)*.78);cursor:pointer;
  font-family:var(--ff);font-weight:700;transition:.15s;flex:none}
.bi:hover{color:var(--tx);border-color:var(--ac);background:color-mix(in srgb, var(--ac) 16%, transparent)}
html[data-theme="light"] .bi{background:rgba(255,255,255,.92)}

/* ============================== TIPOGRAFÍA ============================== */
.kicker{display:inline-flex;align-items:center;gap:calc(var(--u)*.6);font-size:calc(var(--u)*.86);
  letter-spacing:.2em;text-transform:uppercase;color:var(--ac);font-weight:800;margin-bottom:calc(var(--u)*.9)}
.kicker i{width:calc(var(--u)*.55);height:calc(var(--u)*.55);border-radius:50%;background:var(--ac);display:inline-block}
h1{font-size:calc(var(--u)*4.3);line-height:1.02;letter-spacing:-.035em;margin:0;font-weight:800}
h2{font-size:calc(var(--u)*2.9);line-height:1.08;letter-spacing:-.03em;margin:0;font-weight:800}
h3{font-size:calc(var(--u)*1.42);line-height:1.2;margin:0;font-weight:750;letter-spacing:-.01em}
h4{font-size:calc(var(--u)*1.05);margin:0;font-weight:800;color:var(--ac);
  letter-spacing:.06em;text-transform:uppercase}
.lead{font-size:calc(var(--u)*1.55);line-height:1.42;color:var(--tx2);margin-top:calc(var(--u)*1.2);
  max-width:46em}
.lead strong{color:var(--tx);font-weight:750}
p{margin:0;font-size:calc(var(--u)*1.12);line-height:1.5;color:var(--tx2)}
p strong,li strong{color:var(--tx);font-weight:750}
.sm{font-size:calc(var(--u)*.95);color:var(--tx3);line-height:1.5}
.mt{margin-top:calc(var(--u)*1.2)} .mt2{margin-top:calc(var(--u)*2)}

ul.li{list-style:none;padding:0;margin:calc(var(--u)*1.2) 0 0}
ul.li>li{position:relative;padding:calc(var(--u)*.5) 0 calc(var(--u)*.5) calc(var(--u)*1.8);
  font-size:calc(var(--u)*1.12);line-height:1.48;color:var(--tx2)}
ul.li>li::before{content:"";position:absolute;left:calc(var(--u)*.28);top:calc(var(--u)*1.05);
  width:calc(var(--u)*.44);height:calc(var(--u)*.44);border-radius:2px;background:var(--ac)}
ol.num{list-style:none;padding:0;margin:calc(var(--u)*1.2) 0 0;counter-reset:n}
ol.num>li{counter-increment:n;position:relative;padding:calc(var(--u)*.55) 0 calc(var(--u)*.55) calc(var(--u)*2.5);
  font-size:calc(var(--u)*1.12);line-height:1.48;color:var(--tx2)}
ol.num>li::before{content:counter(n);position:absolute;left:0;top:calc(var(--u)*.52);
  width:calc(var(--u)*1.75);height:calc(var(--u)*1.75);border-radius:calc(var(--u)*.55);
  background:color-mix(in srgb, var(--ac) 18%, transparent);
  border:1px solid color-mix(in srgb, var(--ac) 55%, transparent);color:var(--ac);
  font-size:calc(var(--u)*.88);font-weight:800;display:flex;align-items:center;justify-content:center}

/* ============================== CAJAS ============================== */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*1.6);align-items:start}
.cols>*{min-width:0}
.c3{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*1.2)}
.c4{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*1)}
.c3>*,.c4>*{min-width:0}
.card{background:linear-gradient(158deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:var(--r);padding:calc(var(--u)*1.4) calc(var(--u)*1.5);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--ac)}
.card.v::before{background:var(--violeta)} .card.o::before{background:var(--oro)}
.card.c::before{background:var(--celeste)} .card.r::before{background:var(--coral)}
.card.a::before{background:var(--aqua)}
.card h3{margin-bottom:calc(var(--u)*.55)}
.card .et{display:block;font-size:calc(var(--u)*.72);letter-spacing:.14em;text-transform:uppercase;
  font-weight:800;color:var(--tx3);margin-bottom:calc(var(--u)*.45)}
.box{border:1px solid var(--line);border-radius:var(--r-s);padding:calc(var(--u)*1) calc(var(--u)*1.2);
  background:rgba(255,255,255,.04)}
.box.ok{border-color:color-mix(in srgb,#00c06a 55%,transparent);background:rgba(0,192,106,.1)}
.box.no{border-color:color-mix(in srgb,#ef6a4b 55%,transparent);background:rgba(239,106,75,.1)}
.box.info{border-color:color-mix(in srgb,#39b6d8 55%,transparent);background:rgba(57,182,216,.1)}
.box.warn{border-color:color-mix(in srgb,#eda100 55%,transparent);background:rgba(237,161,0,.1)}
.box .et{display:block;font-size:calc(var(--u)*.72);letter-spacing:.14em;text-transform:uppercase;
  font-weight:800;color:var(--tx3);margin-bottom:calc(var(--u)*.35)}
.cita{border-left:3px solid var(--ac);padding-left:calc(var(--u)*1.2);font-size:calc(var(--u)*1.2);
  line-height:1.5;color:var(--tx2);font-style:italic}
.cita b{color:var(--tx);font-style:normal}

/* números grandes */
.dato{font-size:calc(var(--u)*3.2);font-weight:800;letter-spacing:-.035em;line-height:1;
  color:var(--ac);font-variant-numeric:tabular-nums}
.dato.largo{font-size:calc(var(--u)*1.85);letter-spacing:-.02em}
.dato small{display:block;font-size:calc(var(--u)*.82);font-weight:700;color:var(--tx3);
  letter-spacing:.08em;text-transform:uppercase;margin-top:calc(var(--u)*.4)}
.chip{display:inline-block;font-size:calc(var(--u)*.7);font-weight:800;letter-spacing:.08em;
  padding:calc(var(--u)*.16) calc(var(--u)*.6);border-radius:999px;text-transform:uppercase}
.chip.g{background:rgba(0,192,106,.18);color:var(--verde-l)}
.chip.a{background:rgba(18,181,160,.2);color:var(--aqua)}
.chip.v{background:rgba(138,121,224,.22);color:var(--violeta)}
.chip.o{background:rgba(237,161,0,.2);color:var(--oro)}
.chip.c{background:rgba(57,182,216,.2);color:var(--celeste)}
.chip.r{background:rgba(239,106,75,.2);color:var(--coral)}

/* tablas */
table.t{width:100%;border-collapse:collapse;font-size:calc(var(--u)*.98);margin-top:calc(var(--u)*1)}
table.t th{text-align:left;font-size:calc(var(--u)*.74);letter-spacing:.12em;text-transform:uppercase;
  color:var(--tx3);font-weight:800;padding:calc(var(--u)*.5) calc(var(--u)*.7);
  border-bottom:1px solid var(--line2)}
table.t td{padding:calc(var(--u)*.5) calc(var(--u)*.7);border-bottom:1px solid var(--line);
  color:var(--tx2);vertical-align:top;line-height:1.42}
table.t tr:last-child td{border-bottom:none}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t td.b{color:var(--tx);font-weight:700}
table.t tr.tot td{background:color-mix(in srgb, var(--ac) 12%, transparent);color:var(--tx);font-weight:750}
table.t td.pos{color:var(--verde-l)} table.t td.neg{color:var(--coral)}

/* el formulario, tal como se ve en el Word */
.form{border:1px solid var(--line2);border-radius:var(--r-s);overflow:hidden;background:rgba(255,255,255,.035)}
.form .ft{background:color-mix(in srgb, var(--ac) 16%, transparent);color:var(--tx);
  font-size:calc(var(--u)*.82);font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:calc(var(--u)*.55) calc(var(--u)*.9);border-bottom:1px solid var(--line2)}
.form .fc{padding:calc(var(--u)*1.1) calc(var(--u)*.9);color:var(--tx3);font-size:calc(var(--u)*.95);
  font-style:italic;min-height:calc(var(--u)*3)}
.form table{width:100%;border-collapse:collapse;font-size:calc(var(--u)*.9)}
.form table th,.form table td{border:1px solid var(--line);padding:calc(var(--u)*.45) calc(var(--u)*.7);
  text-align:left;color:var(--tx2)}
.form table th{background:rgba(255,255,255,.05);font-weight:750;color:var(--tx);
  font-size:calc(var(--u)*.78);text-transform:uppercase;letter-spacing:.06em}
.form table td.e{color:var(--tx3);font-style:italic}

/* campos de las demos */
label.fl{display:block;font-size:calc(var(--u)*.74);letter-spacing:.1em;text-transform:uppercase;
  color:var(--tx3);font-weight:800;margin-bottom:calc(var(--u)*.35)}
input.fi,select.fi{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line2);
  border-radius:10px;color:var(--tx);font-family:var(--ff);font-size:calc(var(--u)*1);
  padding:calc(var(--u)*.5) calc(var(--u)*.7);font-variant-numeric:tabular-nums}
html[data-theme="light"] input.fi,html[data-theme="light"] select.fi{background:#fff}
input.fi:focus,select.fi:focus{outline:none;border-color:var(--ac)}
input[type=range]{width:100%;accent-color:var(--verde-l);height:calc(var(--u)*1.4)}
.bt{border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--tx2);border-radius:11px;
  padding:calc(var(--u)*.45) calc(var(--u)*.95);font-size:calc(var(--u)*.92);cursor:pointer;
  font-family:var(--ff);font-weight:700;transition:.15s}
.bt:hover{color:var(--tx);border-color:var(--ac);background:color-mix(in srgb, var(--ac) 16%, transparent)}
.bt.on{background:var(--verde);border-color:var(--verde);color:#04150e;font-weight:800}
html[data-theme="light"] .bt{background:rgba(255,255,255,.92)}
.bt.mini{padding:calc(var(--u)*.3) calc(var(--u)*.7);font-size:calc(var(--u)*.82)}
.wrapb{display:flex;gap:calc(var(--u)*.6);flex-wrap:wrap;margin-top:calc(var(--u)*1)}

svg.g{width:100%;height:auto;display:block;border-radius:var(--r-s);
  background:rgba(255,255,255,.035);border:1px solid var(--line);margin-top:calc(var(--u)*.8)}

/* ============================== ESQUEMAS ============================== */
svg.esq{width:100%;height:auto;display:block;margin:calc(var(--u)*1) auto 0;max-height:62vh}

/* ============================== DISCUSIÓN ============================== */
.disc h1{font-size:calc(var(--u)*3.5);line-height:1.04}
.disc .lead{max-width:56em}
.disc h4{margin-bottom:calc(var(--u)*.3)}
ul.qq{list-style:none;padding:0;margin:calc(var(--u)*.8) 0 0}
ul.qq>li{position:relative;padding:calc(var(--u)*.52) 0 calc(var(--u)*.52) calc(var(--u)*1.7);
  font-size:calc(var(--u)*1.1);line-height:1.46;color:var(--tx);
  border-bottom:1px solid var(--line)}
ul.qq>li:last-child{border-bottom:none}
ul.qq>li::before{content:"?";position:absolute;left:0;top:calc(var(--u)*.52);
  width:calc(var(--u)*1.15);height:calc(var(--u)*1.15);border-radius:50%;
  background:color-mix(in srgb, var(--ac) 22%, transparent);color:var(--ac);
  font-size:calc(var(--u)*.78);font-weight:800;display:flex;align-items:center;justify-content:center}
body[data-tipo="disc"] #esc::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 620px at 84% 18%, color-mix(in srgb, var(--ac) 14%, transparent), transparent 66%)}
.box.mal{border-color:color-mix(in srgb,#ef6a4b 55%,transparent);background:rgba(239,106,75,.1)}

/* clasificador */
.bienes{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.55);margin-top:calc(var(--u)*1)}
.bien{border:1px solid var(--line2);border-radius:11px;padding:calc(var(--u)*.45) calc(var(--u)*.85);
  font-size:calc(var(--u)*.98);cursor:pointer;background:rgba(255,255,255,.05);color:var(--tx2);
  font-family:var(--ff);font-weight:650;transition:.15s}
.bien:hover{border-color:var(--ac);color:var(--tx)}
.bien.sel{border-color:var(--ac);background:color-mix(in srgb, var(--ac) 22%, transparent);color:var(--tx)}
.bien.ok{border-color:#00c06a;background:rgba(0,192,106,.2);color:var(--verde-l)}
.bien.mal{border-color:#ef6a4b;background:rgba(239,106,75,.2);color:var(--coral)}
.bien.hecho{opacity:.45}
html[data-theme="light"] .bien{background:rgba(255,255,255,.9)}

/* índice */
.ov{position:fixed;inset:0;z-index:60;background:rgba(3,10,8,.95);backdrop-filter:blur(10px);
  display:none;padding:calc(var(--u)*2.6);overflow:auto}
html[data-theme="light"] .ov{background:rgba(242,248,245,.97)}
.ov.on{display:block}
.ovw{max-width:1500px;margin:0 auto}
.ix{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:calc(var(--u)*1);
  margin-top:calc(var(--u)*1.4)}
.ixs{border:1px solid var(--line);border-radius:var(--r-s);padding:calc(var(--u)*1);
  background:rgba(255,255,255,.035)}
.ixs h4{margin-bottom:calc(var(--u)*.6)}
.ixs button{display:block;width:100%;text-align:left;border:none;background:transparent;
  color:var(--tx2);font-family:var(--ff);font-size:calc(var(--u)*.92);cursor:pointer;
  padding:calc(var(--u)*.3) calc(var(--u)*.4);border-radius:8px;line-height:1.35}
.ixs button:hover{background:color-mix(in srgb, var(--ac) 16%, transparent);color:var(--tx)}
.ixs button.on{color:var(--ac);font-weight:750}
.ixs button b{color:var(--tx3);font-weight:700;font-variant-numeric:tabular-nums;margin-right:6px}

/* notas del docente */
#notas{position:fixed;left:0;right:0;bottom:calc(var(--u)*3.4);z-index:22;display:none;
  background:var(--panel);border-top:2px solid var(--oro);
  padding:calc(var(--u)*1) calc(var(--u)*1.8);max-height:36vh;overflow:auto}
#notas.on{display:block}
#notas .et{display:block;font-size:calc(var(--u)*.7);letter-spacing:.16em;text-transform:uppercase;
  color:var(--oro);font-weight:800;margin-bottom:calc(var(--u)*.4)}
#notas p{font-size:calc(var(--u)*1);color:var(--tx2)}

.toast{position:fixed;left:50%;bottom:calc(var(--u)*5);transform:translate(-50%,12px);z-index:70;opacity:0;
  background:var(--panel);border:1px solid var(--ac);border-radius:999px;
  padding:calc(var(--u)*.55) calc(var(--u)*1.3);font-size:calc(var(--u)*.92);
  box-shadow:0 20px 50px -20px rgba(0,0,0,.7);pointer-events:none;transition:.25s}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* portada y separadores de sección */
.portada h1{font-size:calc(var(--u)*5.4)}
.sep{text-align:left;position:relative;overflow:hidden}
.sep .n{position:absolute;right:0;top:50%;transform:translateY(-50%);
  font-size:calc(var(--u)*11);font-weight:800;line-height:.8;letter-spacing:-.07em;
  color:color-mix(in srgb, var(--ac) 13%, transparent);
  pointer-events:none;user-select:none;z-index:0}
.sep h1{margin-top:calc(var(--u)*.4);position:relative}
.sep .lead{max-width:36em}

@media (max-width:900px){
  :root{--u:clamp(11px,3.1vw,16px)}
  .cols,.c3,.c4{grid-template-columns:1fr}
  #esc{padding:calc(var(--u)*2) calc(var(--u)*1.4) calc(var(--u)*5)}
}
@media print{
  body{overflow:visible} #pie,#prog,.ov,.toast,#notas{display:none!important}
  #esc{position:static;padding:14mm;page-break-after:always;min-height:auto}
}
</style>
</head>
<body>
<div id="esc"><div id="dia"></div></div>

<div id="notas"><span class="et">Para el docente</span><p id="notas-t"></p></div>

<div id="pie">
  <span class="marca">FEPAR 2026</span>
  <button class="bi" id="b-ant" title="Anterior (← o Re Pág)">◀</button>
  <button class="bi" id="b-sig" title="Siguiente (→, espacio o Av Pág)">▶</button>
  <span id="sec-n">—</span>
  <button class="bi" id="b-notas" title="Notas del docente (N)">Notas</button>
  <button class="bi" id="b-indice" title="Índice (I o Esc)">Índice</button>
  <button class="bi" id="b-tema" title="Tema claro u oscuro (T)">◐</button>
  <button class="bi" id="b-full" title="Pantalla completa (F)">⛶</button>
  <span id="cont">0 / 0</span>
</div>
<div id="prog"></div>

<div class="ov" id="ov-ix"><div class="ovw">
  <span class="kicker"><i></i>Índice</span>
  <h2>Guía 03 y Formulario 03</h2>

<div class="toast" id="toast"></div>
<script>
"use strict";
/* ===============================================================
   LAS TRES DEMOSTRACIONES EN VIVO
   =============================================================== */

/* ---------- utilidades ---------- */
function E(tag, cls, html){ var e=document.createElement(tag); if(cls) e.className=cls;
  if(html!=null) e.innerHTML=html; return e; }
function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function id(x){ return document.getElementById(x); }
function fmt(n, dec){
  if(n == null || !isFinite(n)) return '—';
  dec = (dec == null ? 0 : dec);
  var neg = n < 0; n = Math.abs(n);
  var p = n.toFixed(dec).split('.');
  p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (neg ? '−' : '') + p.join(',');
}
function fmtM(n, dec){ return (n==null||!isFinite(n)) ? '—' : (n<0?'−':'')+'U$S '+fmt(Math.abs(n), dec||0); }
function avisoD(m){ var t=id('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('on'); }, 2600); }

/* ---------- motor financiero mínimo ---------- */
function flujoDe(p){
  var f = [-p.I0], t;
  for(t=1; t<=p.H; t++) f.push((p.ing||0) - (p.ope||0));
  if(p.salv) f[p.H] += p.salv;
  return f;
}
function vanDe(f, i){ var v=0; for(var t=0;t<f.length;t++) v += f[t]/Math.pow(1+i,t); return v; }
function tirDe(f){
  var lo=-0.95, hi=10, flo=vanDe(f,lo), fhi=vanDe(f,hi);
  if(!isFinite(flo)||!isFinite(fhi)||flo*fhi>0) return null;
  for(var k=0;k<200;k++){ var m=(lo+hi)/2, fm=vanDe(f,m);
    if(flo*fm<=0){ hi=m; fhi=fm; } else { lo=m; flo=fm; } }
  return (lo+hi)/2;
}
function indicDe(p){
  var f = flujoDe(p), i = p.tasa, t;
  var VAB = 0, VAC = 0;
  for(t=0; t<f.length; t++){
    var pos = (t===0 ? 0 : (p.ing||0)) + ((t===p.H && p.salv) ? p.salv : 0);
    var neg = (t===0 ? p.I0 : (p.ope||0));
    VAB += pos/Math.pow(1+i,t);
    VAC += neg/Math.pow(1+i,t);
  }
  var ac = 0, TRI = null;
  for(t=0; t<f.length; t++){ ac += f[t]; if(t>0 && ac>=0 && TRI===null) TRI = t; }
  return {f:f, VAN:vanDe(f,i), TIR:tirDe(f), RBC: VAC ? VAB/VAC : null, VAC: VAC-VAB, TRI:TRI};
}

/* ---------- SVG ---------- */
var FFD = "'Segoe UI',system-ui,Arial,Helvetica,sans-serif";
function sv(tag, at){ var e=document.createElementNS('http://www.w3.org/2000/svg', tag);
  for(var k in at) if(at.hasOwnProperty(k)) e.setAttribute(k, at[k]); return e; }
function claro(){ return document.documentElement.dataset.theme === 'light'; }
function cTx(){ return claro() ? '#3a534a' : '#bdd3ca'; }
function cTx3(){ return claro() ? '#647e74' : '#84a096'; }
function cLin(){ return claro() ? 'rgba(16,36,29,.16)' : 'rgba(255,255,255,.13)'; }

/* curva del VAN contra la tasa */
function curvaVAN(p, hasta){
  hasta = hasta || 0.45;
  var W=1020, H=215, mL=92, mR=20, mT=18, mB=34;
  var aW=W-mL-mR, aH=H-mT-mB;
  var f = flujoDe(p), pts=[], k;
  for(k=0;k<=90;k++){ var i=hasta*k/90; pts.push({i:i, v:vanDe(f,i)}); }
  var mx=Math.max.apply(null,pts.map(function(x){return x.v;}));
  var mn=Math.min.apply(null,pts.map(function(x){return x.v;}));
  if(mx===mn){ mx+=1; mn-=1; }
  var pad=(mx-mn)*.09; mx+=pad; mn-=pad;
  if(mn>0) mn = -pad; if(mx<0) mx = pad;
  function Y(v){ return mT+aH-((v-mn)/(mx-mn))*aH; }
  function X(i){ return mL+(i/hasta)*aW; }
  var s = sv('svg',{viewBox:'0 0 '+W+' '+H, class:'g', preserveAspectRatio:'xMidYMid meet'});
  for(k=0;k<=5;k++){
    var v=mn+(mx-mn)*k/5, y=Y(v);
    s.appendChild(sv('line',{x1:mL,y1:y,x2:W-mR,y2:y,stroke:cLin(),'stroke-width':1}));
    var tl=sv('text',{x:mL-9,y:y+4,'text-anchor':'end','font-size':11.5,fill:cTx3(),'font-family':FFD});
    tl.textContent=fmt(v/1000,0)+'k'; s.appendChild(tl);
  }
  if(mn<0 && mx>0)
    s.appendChild(sv('line',{x1:mL,y1:Y(0),x2:W-mR,y2:Y(0),stroke:'#eda100','stroke-width':2,'stroke-dasharray':'6 5'}));
  var d='';
  pts.forEach(function(x,j){ d += (j===0?'M':'L')+X(x.i).toFixed(1)+' '+Y(x.v).toFixed(1)+' '; });
  s.appendChild(sv('path',{d:d,fill:'none',stroke:'#39b6d8','stroke-width':3,'stroke-linejoin':'round'}));
  for(k=0;k<=Math.round(hasta*100/5);k++){
    var ii=k*0.05; if(ii>hasta+1e-9) break;
    var lb=sv('text',{x:X(ii),y:H-mB+19,'text-anchor':'middle','font-size':11.5,fill:cTx3(),'font-family':FFD});
    lb.textContent=(k*5)+'%'; s.appendChild(lb);
  }
  /* TMAR */
  if(p.tasa<=hasta){
    s.appendChild(sv('line',{x1:X(p.tasa),y1:mT,x2:X(p.tasa),y2:mT+aH,stroke:'#22c97f','stroke-width':2,'stroke-dasharray':'5 4'}));
    var fin1 = p.tasa > hasta*0.72;
    var t1=sv('text',{x:X(p.tasa)+(fin1?-8:8),y:mT+14,'font-size':12.5,fill:'#22c97f',
      'font-weight':'800','text-anchor':fin1?'end':'start','font-family':FFD});
    t1.textContent='TMAR '+fmt(p.tasa*100,1)+' %'; s.appendChild(t1);
    var vv=vanDe(f,p.tasa);
    s.appendChild(sv('circle',{cx:X(p.tasa),cy:Y(vv),r:6,fill:vv>=0?'#22c97f':'#ef6a4b',stroke:claro()?'#fff':'#0e2019','stroke-width':2}));
  }
  /* TIR */
  var T = tirDe(f);
  if(T!=null && T>0 && T<=hasta){
    s.appendChild(sv('line',{x1:X(T),y1:mT,x2:X(T),y2:mT+aH,stroke:'#ef6a4b','stroke-width':2,'stroke-dasharray':'5 4'}));
    var fin2 = T > hasta*0.72;
    var t2=sv('text',{x:X(T)+(fin2?-8:8),y:mT+32,'font-size':12.5,fill:'#ef6a4b',
      'font-weight':'800','text-anchor':fin2?'end':'start','font-family':FFD});
    t2.textContent='TIR '+fmt(T*100,2)+' %'; s.appendChild(t2);
  }
  return s;
}

/* flujo acumulado, chico */
function miniAcum(p, color){
  var W=560, H=158, mL=62, mR=14, mT=14, mB=28;
  var aW=W-mL-mR, aH=H-mT-mB;
  var f=flujoDe(p), ac=[], s0=0, t;
  for(t=0;t<f.length;t++){ s0+=f[t]; ac.push(s0); }
  var mx=Math.max.apply(null,ac), mn=Math.min.apply(null,ac);
  if(mx===mn){ mx+=1; mn-=1; }
  var pad=(mx-mn)*.1; mx+=pad; mn-=pad;
  if(mn>0) mn=-pad; if(mx<0) mx=pad;
  function Y(v){ return mT+aH-((v-mn)/(mx-mn))*aH; }
  function X(i){ return mL+(ac.length<=1?0:(i/(ac.length-1))*aW); }
  var s=sv('svg',{viewBox:'0 0 '+W+' '+H, class:'g', preserveAspectRatio:'xMidYMid meet'});
  for(var k=0;k<=3;k++){
    var v=mn+(mx-mn)*k/3, y=Y(v);
    s.appendChild(sv('line',{x1:mL,y1:y,x2:W-mR,y2:y,stroke:cLin(),'stroke-width':1}));
    var tl=sv('text',{x:mL-7,y:y+4,'text-anchor':'end','font-size':10.5,fill:cTx3(),'font-family':FFD});
    tl.textContent=fmt(v/1000,0)+'k'; s.appendChild(tl);
  }
  if(mn<0&&mx>0) s.appendChild(sv('line',{x1:mL,y1:Y(0),x2:W-mR,y2:Y(0),stroke:'#eda100','stroke-width':1.6,'stroke-dasharray':'5 4'}));
  var d='';
  ac.forEach(function(v,j){ d += (j===0?'M':'L')+X(j).toFixed(1)+' '+Y(v).toFixed(1)+' '; });
  s.appendChild(sv('path',{d:d,fill:'none',stroke:color,'stroke-width':2.8,'stroke-linejoin':'round'}));
  ac.forEach(function(v,j){
    s.appendChild(sv('circle',{cx:X(j),cy:Y(v),r:3.2,fill:v>=0?'#22c97f':'#ef6a4b'}));
    if(j%2===0 || j===ac.length-1){
      var lb=sv('text',{x:X(j),y:H-mB+17,'text-anchor':'middle','font-size':10.5,fill:cTx3(),'font-family':FFD});
      lb.textContent=j; s.appendChild(lb);
    }
  });
  return s;
}

function dato(k, v, d, col){
  var x = E('div','box'); x.style.textAlign='left';
  x.appendChild(E('span','et', esc(k)));
  var n = E('div','dato' + (String(v).length > 11 ? ' largo' : ''), v);
  if(col) n.style.color = col;
  x.appendChild(n);
  if(d) x.appendChild(E('p','sm', esc(d)));
  return x;
}

/* ===============================================================
   DEMO 1 · VAN Y TIR EN VIVO
   =============================================================== */
var D1 = {I0:50000, ing:22000, ope:9000, H:8, tasa:0.22, salv:6000, conIng:true};
function demoVan(c){
  var wrap = E('div');
  var mandos = E('div','c3'); mandos.style.marginTop='calc(var(--u)*.4)';

  function sl(lab, min, max, paso, get, set, fmtv){
    var d = E('div'); d.style.marginBottom='calc(var(--u)*.8)';
    var top = E('div'); top.style.display='flex'; top.style.justifyContent='space-between';
    top.style.alignItems='baseline'; top.style.gap='10px';
    top.appendChild(E('label','fl', esc(lab)));
    var val = E('span'); val.style.fontWeight='800'; val.style.fontVariantNumeric='tabular-nums';
    val.style.color='var(--ac)'; val.style.fontSize='calc(var(--u)*1.05)';
    val.textContent = fmtv(get());
    top.appendChild(val);
    d.appendChild(top);
    var r = E('input'); r.type='range'; r.min=min; r.max=max; r.step=paso; r.value=get();
    r.addEventListener('input', function(){ set(parseFloat(r.value)); val.textContent=fmtv(get()); pintar(); });
    d.appendChild(r);
    return d;
  }

  var izq = E('div');
  izq.appendChild(sl('Tasa de descuento · TD (TMAR)', 0, 45, 0.5,
    function(){ return D1.tasa*100; }, function(v){ D1.tasa=v/100; },
    function(v){ return fmt(v,1)+' %'; }));
  izq.appendChild(sl('Ingreso por período', 0, 40000, 500,
    function(){ return D1.ing; }, function(v){ D1.ing=v; },
    function(v){ return fmtM(v); }));
  izq.appendChild(sl('Costo operativo por período', 0, 30000, 500,
    function(){ return D1.ope; }, function(v){ D1.ope=v; },
    function(v){ return fmtM(v); }));
  var med = E('div');
  med.appendChild(sl('Inversión en el período 0', 10000, 150000, 1000,
    function(){ return D1.I0; }, function(v){ D1.I0=v; },
    function(v){ return fmtM(v); }));
  med.appendChild(sl('Horizonte', 3, 20, 1,
    function(){ return D1.H; }, function(v){ D1.H=Math.round(v); },
    function(v){ return Math.round(v)+' períodos'; }));
  var der = E('div');
  var bs = E('div','wrapb');
  var bq = E('button','bt' + (D1.conIng ? '' : ' on'),
    D1.conIng ? 'Apagar los ingresos' : 'Volver a encender los ingresos');
  bq.type='button';
  bq.onclick = function(){
    if(D1.conIng){ D1._ing = D1.ing; D1.ing = 0; D1.conIng = false; }
    else { D1.ing = D1._ing || 22000; D1.conIng = true; }
    demoVan(c);
  };
  bs.appendChild(bq);
  var br = E('button','bt','Reiniciar'); br.type='button';
  br.onclick = function(){ D1 = {I0:50000, ing:22000, ope:9000, H:8, tasa:0.22, salv:6000, conIng:true}; demoVan(c); };
  bs.appendChild(br);
  der.appendChild(bs);
  mandos.appendChild(izq); mandos.appendChild(med); mandos.appendChild(der);
  wrap.appendChild(mandos);

  var salida = E('div'); salida.style.marginTop='calc(var(--u)*1.2)';
  wrap.appendChild(salida);

  function pintar(){
    salida.innerHTML = '';
    var R = indicDe(D1);
    var hay = D1.ing > 0;
    var kp = E('div','c4');
    kp.appendChild(dato('VAN', fmtM(R.VAN), 'a la TMAR elegida', R.VAN>=0 ? 'var(--verde-l)' : 'var(--coral)'));
    kp.appendChild(dato('TIR', R.TIR==null ? 'no existe' : fmt(R.TIR*100,2)+' %',
      R.TIR==null ? 'el flujo nunca cambia de signo' : (R.TIR>=D1.tasa ? 'supera la TMAR' : 'no alcanza la TMAR'),
      R.TIR==null ? 'var(--tx3)' : (R.TIR>=D1.tasa ? 'var(--verde-l)' : 'var(--coral)')));
    if(hay) kp.appendChild(dato('RBC', R.RBC==null?'—':fmt(R.RBC,3), 'beneficios sobre costos',
      (R.RBC!=null && R.RBC>=1) ? 'var(--verde-l)' : 'var(--coral)'));
    else kp.appendChild(dato('VAC', fmtM(R.VAC), 'valor actualizado de costos', 'var(--celeste)'));
    kp.appendChild(dato('Recupero', R.TRI==null?'no ocurre':('período '+R.TRI),
      R.TRI==null?'dentro del horizonte':'el acumulado cambia de signo', R.TRI==null?'var(--tx3)':'var(--aqua)'));
    salida.appendChild(kp);

    var g = E('div'); g.style.marginTop='calc(var(--u)*1)';
    g.appendChild(E('span','et','El VAN según la tasa de descuento (TD)'));
    g.appendChild(curvaVAN(D1));
    salida.appendChild(g);

    var msg = E('div','box ' + (hay ? (R.VAN>=0?'ok':'warn') : 'info'));
    msg.style.marginTop='calc(var(--u)*.9)';
    if(!hay){
      msg.innerHTML = '<p><strong>Sin componente positiva</strong> la curva no cruza el cero en ningún lado: no hay ninguna tasa que anule el flujo, y por eso <strong>no existe la TIR</strong>. Lo único que se puede calcular es el VAC.</p>';
    } else if(R.TIR==null){
      msg.innerHTML = '<p>Con estos valores el flujo no cambia de signo y la TIR no existe.</p>';
    } else {
      msg.innerHTML = '<p>La curva cruza el cero exactamente en la TIR, <strong>'+fmt(R.TIR*100,2)+' %</strong>. '+
        'A la izquierda de ese punto el VAN es positivo; a la derecha, negativo. '+
        (R.TIR>=D1.tasa
          ? 'Como la TMAR (<strong>'+fmt(D1.tasa*100,1)+' %</strong>) está por debajo de la TIR, el VAN da positivo.'
          : 'Como la TMAR (<strong>'+fmt(D1.tasa*100,1)+' %</strong>) está por encima de la TIR, el VAN da negativo.')+'</p>';
    }
    salida.appendChild(msg);
  }
  pintar();
  c.innerHTML = '';
  c.appendChild(wrap);
}

/* ===============================================================
   DEMO 2 · CLASIFICADOR DE ACTIVOS
   =============================================================== */
var TIPOS = [
 {k:'dep',  n:'Bien de capital depreciable',    c:'g', d:'Vida útil mayor a dos años y se desvaloriza.'},
 {k:'nod',  n:'Bien de capital no depreciable', c:'a', d:'El suelo y lo que se le adosa como unidad inseparable.'},
 {k:'nom',  n:'Activo nominal (intangible)',    c:'v', d:'Habilitaciones, patentes, capacitaciones, llave de negocio.'},
 {k:'cir',  n:'Costo operativo adelantado',     c:'o', d:'Capital de trabajo para arrancar el proceso productivo.'}
];
var BIENES = [
 {t:'Camioneta 4x4', k:'dep'},
 {t:'Nivelación del terreno', k:'nod', p:'Forma con el suelo una unidad inseparable.'},
 {t:'Capacitación del personal', k:'nom'},
 {t:'Adelanto de salarios del primer ciclo', k:'cir'},
 {t:'Galpón de 150 m²', k:'dep'},
 {t:'Desmonte del lote', k:'nod'},
 {t:'Alambrado perimetral', k:'dep', p:'Se deprecia: los postes y el alambre tienen vida útil y se reponen.'},
 {t:'Habilitación municipal', k:'nom'},
 {t:'Alimento para animales antes de producir', k:'cir'},
 {t:'La tierra', k:'nod'},
 {t:'Motosierra', k:'dep'},
 {t:'Patente de un procedimiento', k:'nom'},
 {t:'Combustible para arrancar la actividad', k:'cir'},
 {t:'Equipo de medición de gases', k:'dep'},
 {t:'Manual de procedimientos y su elaboración', k:'nom'},
 {t:'Contrapiso y platea de hormigón', k:'nod', p:'Forma una unidad inseparable con el suelo.'}
];
var D2 = {sel:'dep', hechos:{}, ok:0, mal:0};
function demoActivos(c){
  c.innerHTML = '';
  var w = E('div');

  var tipos = E('div','c4');
  TIPOS.forEach(function(t){
    var b = E('button','bt'+(D2.sel===t.k?' on':''));
    b.type='button';
    b.style.textAlign='left'; b.style.padding='calc(var(--u)*.7) calc(var(--u)*.9)';
    b.innerHTML = '<span class="chip '+t.c+'">'+esc(t.n.split(' ')[0])+'</span>'+
      '<div style="font-size:calc(var(--u)*1);font-weight:750;margin-top:calc(var(--u)*.35)">'+esc(t.n)+'</div>'+
      '<div style="font-size:calc(var(--u)*.82);font-weight:500;opacity:.75;margin-top:calc(var(--u)*.2)">'+esc(t.d)+'</div>';
    b.onclick = function(){ D2.sel = t.k; demoActivos(c); };
    tipos.appendChild(b);
  });
  w.appendChild(tipos);

  var elegido = TIPOS.filter(function(t){ return t.k===D2.sel; })[0];
  var ind = E('p','sm'); ind.style.marginTop='calc(var(--u)*1)';
  ind.innerHTML = 'Toquen los bienes que son <strong style="color:var(--ac)">'+esc(elegido.n.toLowerCase())+'</strong>.';
  w.appendChild(ind);

  var bienes = E('div','bienes');
  BIENES.forEach(function(b, i){
    var st = D2.hechos[i];
    var el = E('button','bien'+(st ? ' '+st : ''));
    el.type='button'; el.textContent = b.t;
    if(st) el.classList.add('hecho');
    el.onclick = function(){
      if(D2.hechos[i]) return;
      var bien = (b.k === D2.sel);
      D2.hechos[i] = bien ? 'ok' : 'mal';
      if(bien){ D2.ok++; avisoD('Correcto.'); }
      else { D2.mal++;
        var real = TIPOS.filter(function(t){ return t.k===b.k; })[0];
        avisoD((b.p ? b.p+' ' : '') + 'Va en: ' + real.n + '.'); }
      demoActivos(c);
    };
    bienes.appendChild(el);
  });
  w.appendChild(bienes);

  var pie = E('div','wrapb');
  var m = E('div','box'); m.style.flex='1'; m.style.minWidth='240px';
  var faltan = BIENES.length - Object.keys(D2.hechos).length;
  m.innerHTML = '<p><strong style="color:var(--verde-l)">'+D2.ok+'</strong> bien · '+
    '<strong style="color:var(--coral)">'+D2.mal+'</strong> mal · '+faltan+' sin clasificar</p>';
  pie.appendChild(m);
  var br = E('button','bt','Empezar de nuevo'); br.type='button';
  br.onclick = function(){ D2 = {sel:'dep', hechos:{}, ok:0, mal:0}; demoActivos(c); };
  pie.appendChild(br);
  w.appendChild(pie);

  if(faltan === 0){
    var fin = E('div','box ' + (D2.mal===0 ? 'ok' : 'warn'));
    fin.style.marginTop='calc(var(--u)*.9)';
    fin.innerHTML = D2.mal===0
      ? '<p>Los dieciséis bien clasificados. Eso es exactamente lo que hay que hacer con cada componente de la inversión del proyecto de ustedes.</p>'
      : '<p>Los que más cuestan son los que quedan incorporados al suelo y los que no se pueden tocar. Revisen esos dos casos en las componentes de inversión de su proyecto.</p>';
    w.appendChild(fin);
  }
  c.appendChild(w);
}

/* ===============================================================
   DEMO 3 · PRIVADO CONTRA PÚBLICO
   =============================================================== */
var D3 = {I0:120000, ope:26000, H:10, tasa:0.21, precio:9, cant:4200, salv:14000};
function demoPubPriv(c){
  c.innerHTML = '';
  var w = E('div');

  var top = E('div'); top.style.display='flex'; top.style.gap='calc(var(--u)*1.4)';
  top.style.flexWrap='wrap'; top.style.alignItems='flex-end';
  function campo(lab, min, max, paso, get, set, fmtv){
    var d = E('div'); d.style.flex='1'; d.style.minWidth='240px';
    var fila = E('div'); fila.style.display='flex'; fila.style.justifyContent='space-between';
    fila.style.alignItems='baseline'; fila.style.gap='10px';
    fila.appendChild(E('label','fl', esc(lab)));
    var val = E('span'); val.style.fontWeight='800'; val.style.color='var(--ac)';
    val.style.fontVariantNumeric='tabular-nums'; val.style.fontSize='calc(var(--u)*1.05)';
    val.textContent = fmtv(get()); fila.appendChild(val);
    d.appendChild(fila);
    var r = E('input'); r.type='range'; r.min=min; r.max=max; r.step=paso; r.value=get();
    r.addEventListener('input', function(){ set(parseFloat(r.value)); val.textContent=fmtv(get()); pintar(); });
    d.appendChild(r);
    return d;
  }
  top.appendChild(campo('Precio del servicio', 0, 20, 0.5,
    function(){ return D3.precio; }, function(v){ D3.precio=v; },
    function(v){ return 'U$S '+fmt(v,2); }));
  top.appendChild(campo('Tasa de descuento (TD)', 5, 40, 0.5,

    ka.appendChild(dato('RBC', Rp.RBC==null?'—':fmt(Rp.RBC,2), null,

    b.appendChild(miniAcum(pub, '#39b6d8'));
    var kb = E('div','c3'); kb.style.marginTop='calc(var(--u)*.8)';

        'Por eso en un proyecto público el VAC no es un premio consuelo: es el único indicador posible, y sirve para comparar alternativas que produzcan el mismo resultado.</p>';
    }
    salida.appendChild(msg);

<script>
"use strict";
/* ===============================================================
   ESQUEMAS DIBUJADOS
   Cada concepto central se explica con un dibujo, no con una lista.
   Se redibujan al cambiar de tema porque pinta() rehace la pantalla.
   =============================================================== */

var C = {
  verde:'#22c97f', verdeO:'#00a05a', aqua:'#12b5a0', celeste:'#39b6d8',
  oro:'#eda100', violeta:'#8a79e0', coral:'#ef6a4b'
};
function cFondo(){ return claro() ? '#ffffff' : '#0e2019'; }
function cSuave(){ return claro() ? 'rgba(16,36,29,.05)' : 'rgba(255,255,255,.05)'; }
function cBorde(){ return claro() ? 'rgba(16,36,29,.20)' : 'rgba(255,255,255,.20)'; }

function lienzo(W, H){
  var s = sv('svg', {viewBox:'0 0 '+W+' '+H, class:'esq', preserveAspectRatio:'xMidYMid meet'});
  var defs = sv('defs');
  ['verde','celeste','coral','oro','violeta','aqua'].forEach(function(k){
    var m = sv('marker', {id:'fl-'+k, viewBox:'0 0 10 10', refX:'9', refY:'5',
      markerWidth:'6', markerHeight:'6', orient:'auto-start-reverse'});
    m.appendChild(sv('path', {d:'M 0 0 L 10 5 L 0 10 z', fill:C[k]}));
    defs.appendChild(m);
  });
  var gr = sv('marker', {id:'fl-gris', viewBox:'0 0 10 10', refX:'9', refY:'5',
    markerWidth:'6', markerHeight:'6', orient:'auto-start-reverse'});
  gr.appendChild(sv('path', {d:'M 0 0 L 10 5 L 0 10 z', fill:cTx3()}));
  defs.appendChild(gr);
  s.appendChild(defs);
  return s;
}
function txt(s, x, y, t, o){
  o = o || {};
  var e = sv('text', {x:x, y:y, 'font-size':o.s || 17, fill:o.c || cTx(),
    'text-anchor':o.a || 'middle', 'font-weight':o.w || '600', 'font-family':FFD,
    'letter-spacing':o.ls || 0});
  e.textContent = t; s.appendChild(e); return e;
}
function multi(s, x, y, lineas, o){
  o = o || {};
  var lh = o.lh || ((o.s || 17) * 1.32);
  lineas.forEach(function(l, i){ txt(s, x, y + i*lh, l, o); });
}
function caja(s, x, y, w, h, o){
  o = o || {};
  var r = sv('rect', {x:x, y:y, width:w, height:h, rx:o.r == null ? 14 : o.r,
    fill: o.fill || cSuave(), stroke: o.stroke || cBorde(), 'stroke-width': o.sw || 1.5});
  if(o.dash) r.setAttribute('stroke-dasharray', o.dash);
  s.appendChild(r); return r;
}
function flecha(s, x1, y1, x2, y2, col, o){
  o = o || {};
  var l = sv(o.curva ? 'path' : 'line', o.curva
    ? {d:o.curva, fill:'none'}
    : {x1:x1, y1:y1, x2:x2, y2:y2});
  l.setAttribute('stroke', C[col] || col);
  l.setAttribute('stroke-width', o.sw || 2.4);
  l.setAttribute('stroke-linecap', 'round');
  if(o.dash) l.setAttribute('stroke-dasharray', o.dash);
  if(o.marker !== false) l.setAttribute('marker-end', 'url(#fl-' + (C[col] ? col : 'gris') + ')');
  s.appendChild(l); return l;
}
function tono(col, a){ return 'color-mix(in srgb, ' + col + ' ' + a + '%, transparent)'; }

/* ---------------------------------------------------------------
   1 · EL FLUJO DE FONDOS EN EL TIEMPO
   --------------------------------------------------------------- */
function esqFlujo(){

  for(var i = 1; i < n; i++){

  /* operación */
  for(i = 1; i < n; i++){

  caja(s, X(0)-88, y0+62, 176, 66, {fill:tono(C.coral,14), stroke:tono(C.coral,55), r:12});
  multi(s, X(0), y0+90, ['COSTOS DE','INVERSIÓN'], {s:15, w:'800', c:C.coral, lh:21});

  /* salvamento */
  caja(s, X(n-1)-88, y0-176, 176, 52, {fill:tono(C.celeste,13), stroke:tono(C.celeste,50), r:12});
  multi(s, X(n-1), y0-152, ['VALOR DE','SALVAMENTO'], {s:13.5, w:'800', c:C.celeste, lh:18});
  flecha(s, X(n-1), y0-122, X(n-1), y0-108, 'celeste', {sw:2.4});

  /* los períodos, encima de la línea y con el fondo recortado */
  var etq = ['0','1','2','3','4','…','H'];

      fill:cFondo(), stroke: esCero ? C.oro : cTx3(), 'stroke-width': esCero ? 2 : 1.4}));
    txt(s, X(i), y0+6, etq[i], {s:15.5, w:'800', c: esCero ? C.oro : cTx3()});
  }

  /* rótulos de lado */
  txt(s, 40, y0-78, 'entra', {a:'start', s:16, w:'800', c:C.verde});
  txt(s, 40, y0+95, 'sale',  {a:'start', s:16, w:'800', c:C.coral});

  /* el FFN */
  caja(s, 145, H-60, 1051, 46, {fill:cSuave(), stroke:cBorde(), r:12, dash:'7 5'});
  txt(s, 670, H-31, 'FLUJO DE FONDOS NETO  =  suma algebraica de cada columna',
      {s:16.5, w:'800', c:cTx()});
  return s;
}

function esqHorizonte(){

  /* recupero */
  var xR = x0 + 5*paso;
  s.appendChild(sv('line', {x1:xR, y1:y-92, x2:xR, y2:y+12, stroke:C.verde,
    'stroke-width':2.6, 'stroke-dasharray':'6 5'}));
  caja(s, xR-136, y-134, 272, 44, {fill:tono(C.verde,15), stroke:tono(C.verde,55), r:12});
  txt(s, xR, y-105, 'RECUPERO DE LA INVERSIÓN', {s:14.5, w:'800', c:C.verde});

  /* franja +3 a +5 */
  var xa = x0 + 8*paso, xb = x0 + 10*paso;
  caja(s, xa, y-52, xb-xa, 40, {fill:tono(C.oro,16), stroke:tono(C.oro,55), r:10, dash:'6 4'});
  txt(s, (xa+xb)/2, y-26, 'horizonte', {s:15, w:'800', c:C.oro});

/* ---------------------------------------------------------------
   8 · POR QUÉ SE DESCUENTA
   --------------------------------------------------------------- */
function esqDescuento(){
  var W = 1200, H = 330;
  var s = lienzo(W, H);
  var n = 9, x0 = 130, paso = 112, base = 258, hMax = 170;
  var tasa = 0.22;
  txt(s, 60, 46, 'El mismo peso, cada año más lejos, vale menos hoy',
    {a:'start', s:19, w:'800', c:cTx()});
  for(var t=0; t<n; t++){
    var f = Math.pow(1+tasa, -t);
    var h = hMax * f, x = x0 + t*paso;
    /* fantasma del valor nominal */
    caja(s, x, base-hMax, 76, hMax, {fill:'none', stroke:cBorde(), r:8, dash:'4 4', sw:1.2});
    caja(s, x, base-h, 76, h, {fill:tono(C.celeste, 22), stroke:tono(C.celeste, 55), r:8});
    txt(s, x+38, base+24, 'T'+t, {s:14.5, w:'800', c:cTx3()});
    txt(s, x+38, base-h-10, Math.round(f*100)+'%', {s:13.5, w:'800', c:C.celeste});
  }
  s.appendChild(sv('line', {x1:x0-22, y1:base, x2:x0+n*paso-20, y2:base,
    stroke:cTx3(), 'stroke-width':2}));
  txt(s, W-60, 46, 'con una tasa del 22 %', {a:'end', s:15, w:'700', c:C.celeste});
  txt(s, W/2, base+62,
    'Por eso la tasa que elijan cambia el resultado: no es un detalle de cálculo, es una decisión',
    {s:15.5, w:'700', c:cTx3()});
  return s;
}

}

   --------------------------------------------------------------- */

    {n:'VAN', d:'Valor Actual Neto', q:'¿Genera valor por encima de lo que el inversor exige?', c:C.verde},

    {n:'RBC', d:'Relación Beneficio-Costo', q:'¿Cuánto devuelve cada peso de costo?', c:C.verde}
  ];
  var y = 70, h = 78, gap = 14;
  txt(s, 300, 42, 'CON INGRESOS DIRECTOS', {s:16, w:'800', c:C.verde, ls:'.12em'});
  izq.forEach(function(k, i){

    caja(s, 60, yy, 480, h, {fill:tono(k.c, 10), stroke:tono(k.c, 45), r:14});
    txt(s, 92, yy+34, k.n, {a:'start', s:22, w:'800', c:k.c});
    txt(s, 172, yy+33, k.d, {a:'start', s:15, c:cTx2s(), w:'700'});
    txt(s, 92, yy+60, k.q, {a:'start', s:14, c:cTx3(), w:'600'});
  });
  txt(s, 900, 42, 'SIN INGRESOS DIRECTOS', {s:16, w:'800', c:C.celeste, ls:'.12em'});
  caja(s, 660, y, 480, h, {fill:tono(C.celeste, 10), stroke:tono(C.celeste, 45), r:14});
  txt(s, 692, y+34, 'VAC', {a:'start', s:22, w:'800', c:C.celeste});
  txt(s, 772, y+33, 'Valor Actualizado de Costos', {a:'start', s:15, c:cTx2s(), w:'700'});
  txt(s, 692, y+60, '¿Cuánto cuesta, traído a hoy, sostener el proyecto?', {a:'start', s:14, c:cTx3(), w:'600'});

  caja(s, 660, y+h+gap, 480, 2*h+gap, {fill:cSuave(), stroke:cBorde(), r:14, dash:'7 5'});
  txt(s, 900, y+h+gap+40, 'NO CORRESPONDEN', {s:16, w:'800', c:cTx3(), ls:'.1em'});
  multi(s, 900, y+h+gap+76, ['Sin componente positiva no hay valor neto que calcular,',
    'el flujo nunca cambia de signo y el numerador de la',
    'relación beneficio-costo está vacío.'],
    {s:14.5, c:cTx3(), lh:22, w:'600'});

  caja(s, 60, y+3*(h+gap)+6, W-120, 48, {fill:tono(C.oro,11), stroke:tono(C.oro,48), r:13});
  txt(s, W/2, y+3*(h+gap)+36,
    '¿Y si ninguno alcanza? Hay más indicadores posibles, y elegir cuáles usar es parte del trabajo del equipo',
    {s:16, w:'750', c:C.oro});
  return s;
}

  '<div class="box warn mt"><span class="et">La pregunta que ordena</span><p>¿Cuál es el capital que necesitamos para que el proyecto funcione? Un error acá tiene efectos en los tiempos de ejecución, en los costos, en el alcance y en el cumplimiento de las metas proyectadas.</p></div>',
 nota:'Recalcar que la unidad de análisis es la componente, no la tarea ni el recurso suelto. El formulario pide el costo por componente.'},

{s:'Valorar la inversión', t:'El ejemplo de la Guía', ac:'var(--verde-l)',

   '<tr><td class="b">Mano de obra</td><td>jornal</td><td class="n">1</td><td class="n">U$S 30,00</td><td class="n b">U$S 30,00</td></tr>'+
   '<tr><td class="b">Retroexcavadora</td><td>horas</td><td class="n">1</td><td class="n">U$S 65,00</td><td class="n b">U$S 65,00</td></tr>'+
   '<tr><td class="b">Combustible</td><td>litros</td><td class="n">20</td><td class="n">U$S 1,00</td><td class="n b">U$S 20,00</td></tr>'+
   '<tr class="tot"><td colspan="4">Costo de la tarea</td><td class="n">U$S 205,00</td></tr>'+
  '</table>'+
  '<div class="cols mt2">'+
   '<div class="box"><p>Lo mismo con <strong>todas</strong> las tareas de la acción «Construir galpón».</p></div>'+

    '<p>La componente <strong>«Galpón construido»</strong> cuesta <strong>U$S 1.887,00</strong>.</p></div>'+
  '</div>',

{s:'Valorar la inversión', t:'Los cuatro tipos de activo', ac:'var(--verde-l)',
 html:'<div data-esq="activos"></div>',
 nota:'La confusión más común es entre depreciable y no depreciable. El eje vertical del dibujo la resuelve: lo que se adosa al suelo no pierde valor porque dura infinitos actos productivos.'},

{s:'Valorar la inversión', t:'Clasifiquemos', ac:'var(--verde-l)', demo:'activos',
 html:'<p class="lead">Elijan un tipo de activo y después toquen los bienes que le corresponden. Van a ver en el momento si acertaron.</p>',
 nota:'Hacerlo con toda el aula en voz alta. Los que más discusión generan son la nivelación, la capacitación y los adelantos de salario.'},

/* ============================================================ 04 · VALORAR LA OPERACIÓN */
{s:'Valorar la operación', t:'', tipo:'sep', ac:'var(--oro)',
 html:'<div class="sep"><div class="n">04</div><h1>Valorar la operación</h1>'+
  '<p class="lead">Donde el proyecto empieza a resolver el problema, y donde está el error más caro del formulario.</p></div>',
 nota:''},

{s:'Valorar la operación', t:'El error que más se repite', ac:'var(--coral)',
 html:'<div data-esq="doble"></div>'+
  '<div class="box warn mt"><span class="et">Por qué importa tanto</span><p>Un bien de capital contabilizado dos veces infla el costo operativo de <strong>todos</strong> los períodos del horizonte. No es un error de un renglón: se multiplica por la cantidad de años y puede dar por inviable un proyecto que no lo es.</p></div>',
 nota:'Este es el punto donde más se pierden los equipos. En el ejemplo de la Guía, la tableta y la balanza aparecen en la planilla con el precio unitario en blanco: no es un olvido, es la regla.'},

{s:'Valorar la operación', t:'Los tres tipos de gasto operativo', ac:'var(--oro)',
 html:'<div class="c3 mt">'+
   '<div class="card"><span class="chip g">Funcionamiento</span><h3 class="mt">Gastos de funcionamiento</h3>'+
    '<p class="sm mt">El circulante que consume el proceso productivo.</p>'+
    '<p class="sm mt" style="color:var(--tx3)">Alimento, semilla, jornales, salarios, combustible, servicios, insumos.</p></div>'+
   '<div class="card c"><span class="chip c">Mantenimiento</span><h3 class="mt">Mantenimiento del capital</h3>'+
    '<p class="sm mt">Lo que conserva el capital ya instalado para que no se degrade.</p>'+
    '<p class="sm mt" style="color:var(--tx3)">Mantenimiento de vehículos y de corrales, limpieza de galpones, parques y jardines.</p></div>'+
   '<div class="card r"><span class="chip r">Comercialización</span><h3 class="mt">Gastos de comercialización</h3>'+
    '<p class="sm mt">Lo que cuesta poner el producto en manos de quien lo recibe.</p>'+
    '<p class="sm mt" style="color:var(--tx3)">Publicidad, salarios de venta, combustibles, servicios, fletes, envases de despacho.</p></div>'+
  '</div>'+
  '<div class="box info mt2"><span class="et">La mano de obra</span><p>Se consignan las <strong>horas efectivas trabajadas</strong> para lograr la componente de cada tarea. Si las tareas van una después de otra —secuenciación fin-comienzo— las puede hacer el mismo operario: no hace falta multiplicar el personal.</p></div>',
 nota:'Preguntarles dónde pondrían el flete que lleva el producto al punto de venta. Es comercialización, y en muchos F02 quedó escondido dentro de la acción de producción.'},

{s:'Valorar la operación', t:'El período manda', ac:'var(--oro)',
 html:'<p class="lead">El costo de la componente operativa corresponde al <strong>período que el equipo definió</strong>, no a «un rato» ni a «una campaña».</p>'+
  '<div class="box mt2"><span class="et">El ejemplo de la Guía</span>'+
   '<p>En el establecimiento de producción helicícola el período operativo es un año. Entonces el costo de la componente «Caracoles adultos para comercialización recolectados», <strong>U$S 1.159,00</strong>, corresponde a un año entero de ejecución del proyecto.</p></div>'+
  '<div class="box info mt"><span class="et">Flujo libre de riesgo</span>'+
   '<p>Determinamos la componente de costos operativos para un período y la <strong>repetimos en los sucesivos</strong>, mientras no cambie nada en las acciones o las tareas descriptas. El análisis del riesgo queda para etapas avanzadas de la formulación.</p></div>'+
  '<div class="box warn mt"><span class="et">Cuándo no se repite</span>'+
   '<p>Cuando el proyecto tiene una materia prima finita —un pasivo ambiental que se agota en dos campañas—, repetir la componente completa en todos los períodos <strong>sobreestima el costo</strong>. Hay que declararlo en lugar de esconderlo detrás de la convención.</p></div>',
 nota:'El caso de las piletas de contingencia es el ejemplo claro: el pasivo se agota, y los últimos años son sólo monitoreo.'},

/* ============================================================ 05 · COMPONENTE POSITIVA */
{s:'La componente positiva', t:'', tipo:'sep', ac:'var(--verde-l)',
 html:'<div class="sep"><div class="n">05</div><h1>La componente positiva</h1>'+
  '<p class="lead">Cuánto entra, cuándo entra, y por qué el ingreso no es lo mismo que el beneficio.</p></div>',
 nota:''},

{s:'La componente positiva', t:'Dos variables y un momento', ac:'var(--verde-l)',
 html:'<h2 style="color:var(--ac)">Ingreso = cantidad producida por período × precio de mercado</h2>'+
  '<div class="cols mt2">'+
   '<div class="card"><span class="et">La cantidad</span><h3>¿Cuánto podemos producir y ofrecer?</h3>'+
    '<p class="mt">Esta pregunta se responde desde los <strong>estudios técnicos</strong>. Depende de la capacidad instalada, en relación directa con la inversión realizada.</p>'+
    '<p class="sm mt">El dimensionamiento óptimo que determinaron en el F02 es el que fija esta cifra. No se inventa acá.</p></div>'+
   '<div class="card o"><span class="et">El precio</span><h3>¿A cuánto lo vamos a ofrecer?</h3>'+
    '<p class="mt">El precio de mercado del bien o el servicio, relevado del <strong>estudio de mercado</strong>.</p>'+
    '<p class="sm mt">Ojo con el canal: no es lo mismo el precio de góndola al público que el precio mayorista que paga el comercio.</p></div>'+
  '</div>'+
  '<div class="box info mt2"><span class="et">El momento</span><p>Hay que marcar con una cruz si el ingreso se registra en el <strong>tiempo 0</strong> o <strong>desde el tiempo 1 hasta el horizonte</strong>. Lo habitual es que se verifique con regularidad desde T1, generando un flujo periódico.</p></div>',
 nota:'Preguntarles de dónde sacaron la cantidad. Si la sacaron de la demanda y no de la capacidad instalada, hay un problema: el proyecto no puede vender más de lo que produce.'},

{s:'La componente positiva', t:'El ejemplo de la Guía', ac:'var(--verde-l)',
 html:'<p class="lead">Una planta procesadora de <strong>granza de PET</strong> a partir de botellas plásticas.</p>'+
  '<table class="t mt">'+
   '<tr><th>Dato</th><th>Descripción</th></tr>'+
   '<tr><td class="b">Producto</td><td>Granza de PET.</td></tr>'+
   '<tr><td class="b">Período</td><td>Se considera un período de producción anual.</td></tr>'+
   '<tr><td class="b">Capacidad de producción</td><td>4 toneladas de producto reciclado por día. La planta procesa PET durante 250 días al año.</td></tr>'+
   '<tr><td class="b">Precio del kilogramo</td><td>U$S 2,50, de fuentes secundarias de mercado de granza a nivel nacional.</td></tr>'+
   '<tr class="tot"><td>Ingreso bruto por período</td><td>2.500.000 U$S por año</td></tr>'+
  '</table>'+
  '<p class="sm mt">4 t/día × 250 días = 1.000 t al año = 1.000.000 kg × U$S 2,50 = U$S 2.500.000.</p>'+
  '<div class="box ok mt"><p>Es una <strong>suma uniforme y periódica</strong>, porque estamos considerando inexistente el riesgo a lo largo de los años de producción.</p></div>',
 nota:'Hacer la cuenta en el pizarrón con ellos. Sirve para que vean que el número grande sale de tres datos chicos y verificables.'},

{s:'La componente positiva', t:'Cuando no hay ingresos directos', ac:'var(--celeste)',
 html:'<p class="lead">Muchos de los proyectos que estamos formulando <strong>no tienen ingresos directos</strong>. Eso no los invalida: cambia lo que se puede calcular.</p>'+
  '<div class="cols mt2">'+
   '<div class="box"><span class="et">Qué se escribe</span>'+
    '<p>En la tabla de componente positiva y en la justificación técnica y de mercado: <strong>NO APLICA</strong>.</p>'+
    '<p class="sm mt">Dejarlo en blanco no sirve. Quien lo lea tiene que entender que no es un olvido.</p></div>'+
   '<div class="box warn"><span class="et">Lo que igual hay que justificar</span>'+
    '<p>Aunque no haya ingresos, el equipo <strong>tiene que justificar cómo dimensionó</strong> la cantidad de bienes o servicios que el proyecto le suministra a la sociedad.</p></div>'+
  '</div>'+
  '<div class="box info mt2"><p>Todos los proyectos de infraestructura pública —escuelas, caminos, hospitales, obras de saneamiento, obras energéticas— tienen su componente positiva en fondos del Estado, que se financian con los impuestos de empresas y familias. Y no olvidemos los proyectos ambientales, sociales y educativos financiados por ONG, fundaciones y organizaciones altruistas.</p></div>'+
  '<p class="sm mt">La planilla, en estos casos, es mucho más sencilla: período por período, sólo salidas de dinero hasta el horizonte.</p>',
 nota:'Es importante que no lo vivan como una carencia del proyecto. Un parque público no tiene ingresos y es un proyecto perfectamente válido.'},

{s:'La componente positiva', t:'Ingreso no es beneficio económico', ac:'var(--violeta)',
 html:'<div class="cols">'+
   '<div class="card"><span class="et">Ingreso</span><h3>La plata que entra al proyecto</h3>'+
    '<p class="mt">Toneladas de granza producidas en un período, por el precio de la tonelada en el mercado.</p>'+
    '<p class="sm mt">Se mide en dinero y va al flujo de fondos.</p></div>'+
   '<div class="card v"><span class="et">Beneficio económico</span><h3>El incremento del bienestar de la sociedad</h3>'+
    '<p class="mt">La mejora en el bienestar de los consumidores de granza por tener acceso al producto dentro de sus procesos productivos, medida con los indicadores marshallianos o hicksianos que correspondan.</p>'+
    '<p class="sm mt">No se valora todavía. Sí se justifica, siempre.</p></div>'+
  '</div>'+
  '<div class="box info mt2"><span class="et">Cuándo coinciden</span>'+
   '<p>El ingreso en dinero coincide con el beneficio económico sólo bajo <strong>competencia perfecta</strong>, sin distorsiones ni externalidades, cuando la utilidad marginal del consumo iguala al costo marginal de producción. En el mundo real casi nunca coinciden.</p></div>'+
  '<div class="box warn mt"><p>Un proyecto de arbolado urbano no tiene ingresos por ventas y sin embargo tiene beneficio económico: el incremento del bienestar de la población, financiado indirectamente con los impuestos y las tasas municipales.</p></div>',
 nota:'Preguntar: ¿puede existir un proyecto que no genere ningún beneficio a la sociedad? ¿Hay proyectos que sólo generan perjuicios? Sirve para instalar que el ítem del beneficio se completa siempre.'},

/* ============================================================ 06 · COMPONENTE NEGATIVA */
{s:'La componente negativa', t:'', tipo:'sep', ac:'var(--coral)',
 html:'<div class="sep"><div class="n">06</div><h1>La componente negativa<br>y su lugar en el tiempo</h1>'+
  '<p class="lead">Qué ítems tenemos y en qué período se registra cada uno.</p></div>',
 nota:''},

{s:'La componente negativa', t:'Qué ítems tiene cada etapa', ac:'var(--coral)',
 html:'<div class="cols">'+
   '<div class="card r"><span class="et">En la inversión</span><h3>Flujos del período 0</h3>'+
    '<ul class="li">'+
     '<li><span class="chip g">dep</span> Bienes de capital depreciables: alambrado, galpón, tractor, motosierra, equipo de medición de gases.</li>'+
     '<li><span class="chip a">no dep</span> Bienes de capital no depreciables: nivelación, desmonte.</li>'+
     '<li><span class="chip v">nominal</span> Activos nominales: capacitación, patentes.</li>'+
     '<li><span class="chip o">circulante</span> Costos operativos adelantados: salarios, materias primas, combustible.</li>'+
    '</ul></div>'+
   '<div class="card o"><span class="et">En la operación</span><h3>Flujos de T1 a Tn</h3>'+
    '<ul class="li">'+
     '<li><span class="chip g">func</span> Costos operativos directos: salarios, materias primas, insumos para la producción.</li>'+
     '<li><span class="chip c">mant</span> Costos de mantenimiento del capital.</li>'+
     '<li><span class="chip r">com</span> Costos de comercialización.</li>'+
    '</ul></div>'+
  '</div>'+
  '<div class="box mt2"><p>Observen con atención las magnitudes y pregúntense: <strong>¿hay coherencia entre el costo de inversión estimado y el nivel de recursos asignados? ¿Es coherente la magnitud de los costos operativos con el proceso productivo descripto?</strong></p></div>',
 nota:''},

{s:'La componente negativa', t:'La convención de fin de período', ac:'var(--coral)',
 html:'<p class="lead">Todo movimiento de dinero dentro de un período se registra <strong>al cierre</strong> de ese período.</p>'+
  '<div class="box info mt2"><span class="et">El ejemplo</span>'+
   '<p>Una acción implica un movimiento de dinero <strong>cada dos meses</strong> y el período considerado es <strong>anual</strong>. Entonces los seis registros bimestrales se ubican todos <strong>al final del año</strong>.</p></div>'+
  '<div class="box warn mt2"><span class="et">Lo que hay que preguntarse de cada acción</span>'+
   '<ul class="li" style="margin-top:calc(var(--u)*.4)">'+
    '<li>¿Las tareas son continuas, periódicas, aperiódicas o discontinuas?</li>'+
    '<li>¿Están concentradas en determinadas épocas del año?</li>'+
    '<li>¿Hay acciones que se realizan en algunos períodos y en otros no?</li>'+
    '<li>¿Algunas se concentran al inicio del período y otras al final?</li>'+
   '</ul></div>'+
  '<p class="sm mt">Todo eso ya lo respondieron en el Formulario 02, en la dimensión temporal de cada acción. Acá se traduce a columnas.</p>',
 nota:'Es una convención, no una verdad. Pero si cada equipo la aplica distinto, los flujos no se pueden comparar.'},

{s:'La componente negativa', t:'Lo que no va en el período 0', ac:'var(--coral)',
 html:'<p class="lead">Las inversiones se concentran mayoritariamente en el período 0. Pero no todas.</p>'+
  '<div class="c3 mt2">'+
   '<div class="card r"><h3>Reposición de bienes de capital</h3>'+
    '<p class="sm mt">Las cintas de goteo duran cinco campañas y el resto del sistema de riego, diez. La reposición va en el período en que ocurre.</p></div>'+
   '<div class="card v"><h3>Capacitaciones de actualización</h3>'+
    '<p class="sm mt">Un módulo de refuerzo cada cuatro años, o una recertificación que exige la autoridad, van en su período, no en el 0.</p></div>'+
   '<div class="card o"><h3>Auditorías y cierres</h3>'+
    '<p class="sm mt">La auditoría ambiental de cierre que la autoridad exige para firmar el acta se registra en el período en que se ejecuta.</p></div>'+
  '</div>'+
  '<div class="box no mt2"><p>Empujar todas las reposiciones al período 0 «para simplificar» cambia el resultado: adelanta gastos que en realidad ocurren años después y que el descuento intertemporal iba a achicar.</p></div>',
 nota:'Es un error frecuente y fácil de corregir. Pedirles que revisen la vida útil de cada bien contra el horizonte.'},

/* ============================================================ 07 · EL HORIZONTE */
{s:'El horizonte', t:'', tipo:'sep', ac:'var(--violeta)',
 html:'<div class="sep"><div class="n">07</div><h1>El horizonte del proyecto</h1>'+
  '<p class="lead">Cuántos períodos vamos a evaluar, y por qué ese número y no otro.</p></div>',
 nota:''},

{s:'El horizonte', t:'No es el fin de la vida del proyecto', ac:'var(--violeta)',
 html:'<p class="lead">El horizonte es el <strong>tiempo fijado para la evaluación posterior</strong>. Lo define el equipo. No es necesariamente el fin de la vida útil de lo que construimos.</p>'+
  '<div data-esq="horizonte"></div>',
 nota:'El dibujo muestra la regla para proyectos privados: primero el recupero, después tres a cinco períodos más. En los públicos manda la vida útil del bien principal y el ciclo del programa que se abastece.'},

{s:'El horizonte', t:'', tipo:'disc', ac:'var(--violeta)',
 html:'<div class="disc">'+
  '<span class="kicker"><i></i>Para discutir en el equipo</span>'+
  '<h1>¿Qué horizonte<br>le ponemos al proyecto?</h1>'+
  '<div class="cols mt2">'+
   '<div><h4>Lo que lo condiciona</h4>'+
    '<ul class="li">'+
     '<li>La <strong>vida útil del bien que manda</strong>: el que se agota primero y sin el cual el proyecto no funciona.</li>'+
     '<li>El <strong>ciclo del programa</strong> que el proyecto abastece, si es público.</li>'+
     '<li>El <strong>recupero de la inversión</strong>, si es privado, más tres a cinco períodos.</li>'+
     '<li>El plazo que fija una <strong>autoridad</strong>, una concesión o un convenio.</li>'+
    '</ul></div>'+
   '<div><h4>Preguntas para el aula</h4>'+
    '<ul class="qq">'+
     '<li>¿Qué bien del proyecto se agota primero, y qué pasa con el flujo cuando se agota?</li>'+
     '<li>Si alargan el horizonte, ¿qué reposiciones nuevas tienen que agregar al flujo?</li>'+
     '<li>¿Por qué un horizonte más largo suele mejorar el VAN, y por qué eso no alcanza para justificarlo?</li>'+
     '<li>En un proyecto público, ¿el horizonte lo define el proyecto o lo define quien paga la operación año a año?</li>'+
     '<li>¿Qué le contestan a alguien que dice que con veinte años el proyecto «da bien»?</li>'+
    '</ul></div>'+
  '</div>'+
  '<div class="box mal mt2"><p>El horizonte se justifica por un argumento técnico verificable. Nunca por el resultado que uno quiere obtener.</p></div>'+
  '</div>',
 nota:'Vale contar que este es el mecanismo con el que se maquillan proyectos en la vida real, y que por eso lo miramos con lupa. En los públicos, además, dejar planteada la pregunta que la Guía deja abierta: si en ese horizonte los beneficios económicos pueden cubrir los costos de inversión, los operativos y el costo de oportunidad social.'},

/* ============================================================ 08 · LA MATRIZ */
{s:'La matriz', t:'', tipo:'sep', ac:'var(--aqua)',
 html:'<div class="sep"><div class="n">08</div><h1>La matriz del flujo de fondos</h1>'+
  '<p class="lead">Sistematizar toda la información financiera en una sola grilla.</p></div>',
 nota:''},

{s:'La matriz', t:'Cómo se arma', ac:'var(--aqua)',
 html:'<p class="lead">Filas de ingresos con su total, filas de egresos con su total, y la fila del <strong>FFN</strong>: la suma algebraica de cada columna.</p>'+
  '<table class="t mt">'+
   '<tr><th>Componentes</th><th class="n">0</th><th class="n">1</th><th class="n">2</th><th class="n">3</th><th class="n">4</th><th class="n">…</th><th class="n">H</th></tr>'+
   '<tr><td class="b">Ingresos</td><td class="n">—</td><td class="n pos">+</td><td class="n pos">+</td><td class="n pos">+</td><td class="n pos">+</td><td class="n pos">+</td><td class="n pos">+</td></tr>'+
   '<tr class="tot"><td>Total</td><td class="n">—</td><td class="n">+</td><td class="n">+</td><td class="n">+</td><td class="n">+</td><td class="n">+</td><td class="n">+</td></tr>'+
   '<tr><td class="b">Egresos de inversión</td><td class="n neg">−</td><td class="n">—</td><td class="n">—</td><td class="n">—</td><td class="n">—</td><td class="n">—</td><td class="n">—</td></tr>'+
   '<tr><td class="b">Egresos de operación</td><td class="n">—</td><td class="n neg">−</td><td class="n neg">−</td><td class="n neg">−</td><td class="n neg">−</td><td class="n neg">−</td><td class="n neg">−</td></tr>'+
   '<tr class="tot"><td>Total</td><td class="n">−</td><td class="n">−</td><td class="n">−</td><td class="n">−</td><td class="n">−</td><td class="n">−</td><td class="n">−</td></tr>'+
   '<tr class="tot"><td>FFN</td><td class="n">=</td><td class="n">=</td><td class="n">=</td><td class="n">=</td><td class="n">=</td><td class="n">=</td><td class="n">=</td></tr>'+
  '</table>'+
  '<div class="cols mt2">'+

{s:'Los indicadores', t:'', tipo:'disc', ac:'var(--verde-l)',

{s:'Tributo y cierre', t:'La categoría tributaria', ac:'var(--celeste)',

<script>

var DIAPOS_PREG = [

{s:'Preguntas para el F03', t:'', tipo:'sep', ac:'var(--verde-l)',

{s:'Preguntas para el F03', t:'Antes de abrir el formulario', k:'Volver al F02', ac:'var(--aqua)',

{s:'Preguntas para el F03', t:'Ponerle precio a la inversión', k:'Ítem B', ac:'var(--verde-l)',

 html:'<div class="cols">'+

  '</div>'+
  '<div class="box mal mt"><p>Y una pregunta incómoda que conviene hacerse antes de que la haga otro: <strong>¿cambiaría la conclusión si el horizonte fuera dos períodos más corto?</strong> Si cambia, el proyecto se sostiene en el horizonte y no en el negocio.</p></div>',
 nota:'La pregunta del final es la que separa un horizonte justificado de un horizonte conveniente. Vale hacerla equipo por equipo.'},

 html:'<p class="lead">Acá no hay respuesta correcta, hay respuesta <strong>argumentada</strong>. Las cuatro preguntas son siempre las mismas.</p>'+

 nota:'Cerrar con el límite. Es la frase que más les cuesta y la que más se les va a pedir en la devolución.'},

{s:'Preguntas para el F03', t:'', tipo:'disc', ac:'var(--celeste)',
 html:'<div class="disc">'+
  '<span class="kicker"><i></i>Cómo usar estas preguntas</span>'+
  '<h1>No son un<br>cuestionario</h1>'+
  '<p class="lead">Ninguna de estas preguntas se contesta en el formulario. Sirven para que el equipo se ponga de acuerdo antes de escribir, que es donde se pierde o se gana la coherencia del trabajo.</p>'+

   '<div><h4>Una forma de trabajarlas</h4>'+
    '<ul class="li">'+
     '<li>Tomar una pantalla por vez y darse unos minutos de discusión.</li>'+

    '</ul></div>'+

 nota:'Cierre del taller. Pedirles que salgan de la clase con dos cosas escritas: qué precios les faltan y qué van a corregir del F02.'}

];
</script>
<script>
"use strict";
/* ===============================================================
   MOTOR DE LA PRESENTACIÓN
   =============================================================== */
var D = DIAPOS_GUIA.concat(DIAPOS_FORM, DIAPOS_PREG);
var KEY = 'fepar2026_guia03';
var S = {i:0, notas:false};

try{
  var o = JSON.parse(localStorage.getItem(KEY) || 'null');
  if(o && typeof o.i === 'number' && o.i >= 0 && o.i < D.length) S.i = o.i;
  if(o && typeof o.notas === 'boolean') S.notas = o.notas;
  var tm = localStorage.getItem(KEY + '_tema');
  if(tm) document.documentElement.dataset.theme = tm;
}catch(e){}
function guardar(){ try{ localStorage.setItem(KEY, JSON.stringify({i:S.i, notas:S.notas})); }catch(e){} }

/* --------------------------------------------------------------- pintar */
function pinta(){
  var d = D[S.i], cont = id('dia');
  document.documentElement.style.setProperty('--ac', d.ac || 'var(--verde-l)');
  document.body.dataset.tipo = d.tipo || '';
  /* las pantallas con demostración llevan más elementos y se compactan */
  cont.className = (d.demo ? 'demo ' : '') + 'entra';
  cont.innerHTML = '';

  if(d.t){
    var cab = E('div'); cab.style.marginBottom = 'calc(var(--u)*1.2)';
    if(d.k) cab.appendChild(E('span','kicker','<i></i>' + esc(d.k)));
    else if(d.s) cab.appendChild(E('span','kicker','<i></i>' + esc(d.s)));
    cab.appendChild(E('h2', null, d.t));
    cont.appendChild(cab);
  }
  var cuerpo = E('div');
  cuerpo.innerHTML = d.html || '';
  cont.appendChild(cuerpo);

  /* los esquemas se dibujan donde el html dejó su marcador */
  var marcas = cuerpo.querySelectorAll('[data-esq]');
  for(var m = 0; m < marcas.length; m++){
    var nombre = marcas[m].getAttribute('data-esq');
    if(!ESQ[nombre]) continue;
    try{ marcas[m].appendChild(ESQ[nombre]()); }
    catch(err){ marcas[m].innerHTML = '<div class="box no"><p>No se pudo dibujar el esquema.</p></div>'; }
  }

  if(d.demo && DEMOS[d.demo]){
    var caja = E('div');
    caja.style.marginTop = 'calc(var(--u)*1.2)';
    cont.appendChild(caja);
    try{ DEMOS[d.demo](caja); }
    catch(err){ caja.innerHTML = '<div class="box no"><p>No se pudo abrir la demostración en este navegador.</p></div>'; }
  }

  id('sec-n').textContent = (d.s || '') + (d.t ? ' · ' + d.t : '');
  id('cont').textContent = (S.i + 1) + ' / ' + D.length;
  id('prog').style.width = ((S.i + 1) / D.length * 100) + '%';
  id('notas-t').textContent = d.nota || 'Sin notas para esta pantalla.';
  id('notas').classList.toggle('on', !!S.notas && !!d.nota);
  cont.scrollTop = 0;
  guardar();
}

/* --------------------------------------------------------------- navegar */
function ir(i){
  if(i < 0 || i >= D.length) return;
  S.i = i; pinta();
}
function sig(){ if(S.i < D.length - 1) ir(S.i + 1); }
function ant(){ if(S.i > 0) ir(S.i - 1); }

/* --------------------------------------------------------------- índice */
function armaIndice(){
  var cont = id('ix'); cont.innerHTML = '';
  var secs = [], mapa = {};
  D.forEach(function(d, i){
    var s = d.s || 'Sin sección';
    if(!mapa[s]){ mapa[s] = []; secs.push(s); }
    mapa[s].push({d:d, i:i});
  });
  secs.forEach(function(s){
    var caja = E('div','ixs');
    caja.appendChild(E('h4', null, esc(s)));
    mapa[s].forEach(function(x){
      var b = E('button', x.i === S.i ? 'on' : '');
      b.type = 'button';
      var rot = x.d.t || (x.d.tipo === 'portada' ? 'Portada' : (x.d.tipo === 'cierre' ? 'Cierre' : 'Apertura de sección'));
      b.innerHTML = '<b>' + (x.i + 1) + '</b>' + esc(rot);
      b.onclick = function(){ id('ov-ix').classList.remove('on'); ir(x.i); };
      caja.appendChild(b);
    });
    cont.appendChild(caja);
  });
}
function abreIndice(){ armaIndice(); id('ov-ix').classList.add('on'); }

/* --------------------------------------------------------------- eventos */
id('b-sig').onclick = sig;
id('b-ant').onclick = ant;
id('b-indice').onclick = function(){
  var o = id('ov-ix');
  if(o.classList.contains('on')) o.classList.remove('on'); else abreIndice();
};
id('b-notas').onclick = function(){
  S.notas = !S.notas; guardar();
  id('notas').classList.toggle('on', S.notas && !!D[S.i].nota);
  if(S.notas && !D[S.i].nota) avisoD('Esta pantalla no tiene notas.');
};
id('b-tema').onclick = function(){
  var r = document.documentElement;
  r.dataset.theme = r.dataset.theme === 'light' ? 'dark' : 'light';
  try{ localStorage.setItem(KEY + '_tema', r.dataset.theme); }catch(e){}
  pinta();
};
id('b-full').onclick = function(){
  if(document.fullscreenElement) document.exitFullscreen();
  else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
};
id('ov-ix').addEventListener('mousedown', function(ev){
  if(ev.target === this) this.classList.remove('on');
});

document.addEventListener('keydown', function(ev){
  var t = ev.target.tagName;
  if(t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') {
    if(ev.key === 'Escape') ev.target.blur();
    return;
  }
  var ix = id('ov-ix').classList.contains('on');
  if(ev.key === 'Escape'){
    if(ix) id('ov-ix').classList.remove('on'); else abreIndice();
    ev.preventDefault(); return;
  }
  if(ix) return;
  switch(ev.key){
    case 'ArrowRight': case 'PageDown': case ' ': case 'Enter':
      ev.preventDefault(); sig(); break;
    case 'ArrowLeft': case 'PageUp': case 'Backspace':
      ev.preventDefault(); ant(); break;
    case 'Home': ev.preventDefault(); ir(0); break;
    case 'End':  ev.preventDefault(); ir(D.length - 1); break;
    case 'i': case 'I': ev.preventDefault(); abreIndice(); break;
    case 'n': case 'N': ev.preventDefault(); id('b-notas').click(); break;
    case 't': case 'T': ev.preventDefault(); id('b-tema').click(); break;
    case 'f': case 'F': ev.preventDefault(); id('b-full').click(); break;
  }
});

/* deslizar en pantallas táctiles */
(function(){
  var x0 = null, y0 = null;
  var esc = id('esc');
  esc.addEventListener('touchstart', function(ev){
    if(ev.touches.length !== 1) return;
    x0 = ev.touches[0].clientX; y0 = ev.touches[0].clientY;
  }, {passive:true});
  esc.addEventListener('touchend', function(ev){
    if(x0 === null) return;
    var tg = ev.target.tagName;
    if(tg === 'INPUT' || tg === 'BUTTON' || tg === 'SELECT'){ x0 = null; return; }
    var t = ev.changedTouches[0];
    var dx = t.clientX - x0, dy = t.clientY - y0;
    if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6){ dx < 0 ? sig() : ant(); }
    x0 = null;
  }, {passive:true});
})();

/* --------------------------------------------------------------- arranque */
pinta();
</script>
</body>
</html>
