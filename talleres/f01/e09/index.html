<!doctype html>
<html lang="es" data-theme="dark" data-rail="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FEPAR 2026 · Escenario 9 — Ochocientas hectáreas fiscales en el borde este de Salta · Taller de Formulario 01</title>
<meta name="description" content="Visor de trabajo del Escenario 9 de FEPAR 2026: presentación del caso y herramientas para desarrollar el Formulario 01.">
<style>
:root{
  --bg:#06110d; --bg2:#0a1a14; --panel:#0e2019; --panel2:#0b1a15;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.19);
  --tx:#eaf5f0; --tx2:#b9cfc6; --tx3:#7f9a90;
  --verde:#00a05a; --verde-l:#22c97f; --aqua:#12b5a0; --celeste:#39b6d8;
  --oro:#eda100; --violeta:#7b6bd6; --coral:#ef6a4b; --ok:#00c06a; --bad:#ef5350;
  --ff:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fh:var(--ff);
  --r:16px; --r-s:12px; --rail:300px;
  --shadow:0 22px 60px -26px rgba(0,0,0,.85);
}
html[data-theme="light"]{
  --bg:#f2f6f4; --bg2:#e8efec; --panel:#fff; --panel2:#f7faf9;
  --line:rgba(16,36,29,.12); --line2:rgba(16,36,29,.24);
  --tx:#10241d; --tx2:#3c554c; --tx3:#6b8279;
  --shadow:0 22px 60px -30px rgba(16,36,29,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ff);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(1100px 700px at 12% -6%, rgba(0,160,90,.16), transparent 60%),
   radial-gradient(900px 560px at 94% 6%, rgba(237,161,0,.11), transparent 60%),
   radial-gradient(1000px 700px at 55% 112%, rgba(123,107,214,.10), transparent 62%)}
html[data-theme="light"] body::before{
  background:
   radial-gradient(1100px 700px at 12% -6%, rgba(0,160,90,.10), transparent 60%),
   radial-gradient(900px 560px at 94% 6%, rgba(237,161,0,.09), transparent 60%)}
::selection{background:rgba(0,160,90,.35)}

/* scrollbars visibles en los dos ejes */
*{scrollbar-width:thin;scrollbar-color:rgba(0,192,106,.7) rgba(255,255,255,.05)}
*::-webkit-scrollbar{width:12px;height:12px}
*::-webkit-scrollbar-track{background:rgba(255,255,255,.05);border-radius:12px}
*::-webkit-scrollbar-thumb{background:rgba(0,192,106,.7);border-radius:12px;
  border:3px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:var(--verde-l);background-clip:padding-box;border:3px solid transparent}
*::-webkit-scrollbar-corner{background:transparent}
html[data-theme="light"] *{scrollbar-color:rgba(0,140,80,.55) rgba(0,0,0,.06)}
html[data-theme="light"] *::-webkit-scrollbar-track{background:rgba(0,0,0,.06)}

/* ===================== ESTRUCTURA ===================== */
#top{position:fixed;top:0;left:var(--rail);right:0;height:4px;z-index:40;background:rgba(255,255,255,.06);
  transition:left .3s cubic-bezier(.22,.9,.28,1)}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--verde),var(--aqua) 45%,var(--oro));
  transition:width .45s cubic-bezier(.22,.9,.28,1)}
#stage{position:fixed;top:4px;right:0;bottom:0;left:var(--rail);z-index:1;
  transition:left .3s cubic-bezier(.22,.9,.28,1)}
.sec{position:absolute;inset:0;display:none;flex-direction:column;gap:clamp(10px,1.4vh,18px);
  padding:clamp(16px,2.6vh,34px) clamp(18px,3.4vw,64px) 78px;overflow:auto;
  opacity:0;transform:translateY(14px)}
.sec.on{display:flex;animation:in .38s cubic-bezier(.22,.9,.28,1) forwards}
@keyframes in{to{opacity:1;transform:none}}
.fill{flex:1;min-height:0}
/* pantallas de trabajo: los paneles conservan su alto natural y la pantalla se desplaza */
.sec.work>*{flex:none!important}
.sec.work .fill{flex:none!important;min-height:0}

/* ===================== HUD ===================== */
#hud{position:fixed;bottom:0;left:var(--rail);right:0;height:58px;z-index:40;display:flex;align-items:center;
  gap:9px;padding:0 clamp(12px,2.4vw,34px);backdrop-filter:blur(8px);
  background:linear-gradient(0deg,rgba(0,0,0,.5),transparent);transition:left .3s cubic-bezier(.22,.9,.28,1)}
html[data-theme="light"] #hud{background:linear-gradient(0deg,rgba(255,255,255,.8),transparent)}
.hud-b{border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--tx2);
  border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:var(--ff);
  transition:.18s;white-space:nowrap}
.hud-b:hover{color:var(--tx);border-color:var(--verde);background:rgba(0,160,90,.14)}
.hud-b.pri{background:var(--verde);border-color:var(--verde);color:#04150e;font-weight:650}
.hud-b.pri:hover{background:var(--verde-l);color:#04150e}
html[data-theme="light"] .hud-b{background:rgba(255,255,255,.85)}
#counter{font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums;margin-left:auto;flex:none}
#saved{font-size:11.5px;color:var(--tx3);flex:none}
#saved.on{color:var(--verde-l)}
#zwrap{display:inline-flex;align-items:center;gap:4px;flex:none}
#zlabel{font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums;min-width:44px;text-align:center;cursor:pointer}

/* ===================== ÍNDICE LATERAL ===================== */
#rail{position:fixed;top:0;left:0;bottom:0;width:var(--rail);z-index:50;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--panel),var(--bg2));border-right:1px solid var(--line)}
#rail.off{display:none}
#rail-h{padding:15px 16px 11px;border-bottom:1px solid var(--line);flex:none}
#rail-h .rt{font-size:14.5px;font-weight:800;line-height:1.2}
#rail-h .rs{font-size:11px;color:var(--tx3);margin-top:3px}
#rail-b{flex:1;overflow:auto;padding:9px 9px 14px}
#rail-f{flex:none;padding:9px 13px 13px;border-top:1px solid var(--line)}
.rg{margin-bottom:5px;border-radius:11px;overflow:hidden;border:1px solid transparent}
.rg.cur{border-color:var(--line2);background:rgba(255,255,255,.035)}
.rg-h{display:flex;align-items:center;gap:9px;padding:8px 9px;cursor:pointer;transition:.16s}
.rg-h:hover{background:rgba(255,255,255,.05)}
.rg-n{flex:none;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:800;border:1px solid var(--line2);color:var(--tx3)}
.rg.cur .rg-n{background:var(--verde);border-color:var(--verde);color:#04150e}
.rg.done .rg-n{border-color:var(--verde);color:var(--verde-l)}
.rg-t{flex:1;min-width:0}
.rg-t b{display:block;font-size:12.5px;color:var(--tx2);font-weight:650;line-height:1.25}
.rg.cur .rg-t b{color:var(--tx)}
.rg-t span{font-size:10.5px;color:var(--tx3)}
.rg-p{height:3px;border-radius:3px;background:rgba(255,255,255,.08);margin:0 9px 7px;overflow:hidden}
.rg-p i{display:block;height:100%;background:linear-gradient(90deg,var(--verde),var(--aqua));border-radius:3px;
  transition:width .4s cubic-bezier(.22,.9,.28,1)}
.rg-l{display:none}
.rg.open .rg-l{display:block;padding:0 6px 6px}
.ri{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:8px;cursor:pointer;
  font-size:11.5px;color:var(--tx3);line-height:1.3;transition:.14s}
.ri:hover{background:rgba(255,255,255,.06);color:var(--tx2)}
.ri.cur{background:rgba(0,160,90,.16);color:var(--tx);font-weight:600;box-shadow:inset 2px 0 0 var(--verde-l)}
.ri .rn{flex:none;width:16px;font-size:10px;opacity:.7;text-align:right}
.ri .rk{flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line2)}
.ri.ok .rk{background:var(--verde);border-color:var(--verde)}
.ri.part .rk{background:var(--oro);border-color:var(--oro)}
#rail-toggle{border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--tx2);
  border-radius:8px;padding:5px 9px;font-size:11px;cursor:pointer;font-family:var(--ff)}

/* ===================== TIPOGRAFÍA ===================== */
h1{font-size:clamp(26px,3.4vw,44px);line-height:1.05;letter-spacing:-.03em;margin:0;font-weight:800}
h2{font-size:clamp(21px,2.5vw,33px);line-height:1.1;letter-spacing:-.025em;margin:0;font-weight:800}
h3{font-size:15px;margin:0;font-weight:700;letter-spacing:-.01em}
h4{font-size:12.5px;margin:0;font-weight:700;color:var(--tx2)}
p{margin:0}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--verde-l);font-weight:700}
.eyebrow::before{content:"";width:24px;height:2px;background:linear-gradient(90deg,var(--verde),transparent);border-radius:2px}
.lead{font-size:clamp(14px,1.15vw,17px);color:var(--tx2);line-height:1.5;max-width:88ch}
.sub{font-size:13px;color:var(--tx2);line-height:1.5}
.tiny{font-size:11.5px;color:var(--tx3);line-height:1.45}
.mono{font-family:ui-monospace,Consolas,monospace}
.g{color:var(--verde-l)} .o{color:var(--oro)} .c{color:var(--coral)}
.hl{background:linear-gradient(180deg,transparent 62%,rgba(237,161,0,.35) 0);padding:0 2px}
.kbd{font-family:ui-monospace,Consolas,monospace;font-size:11px;border:1px solid var(--line2);
  border-radius:5px;padding:1px 5px;color:var(--tx2);background:rgba(255,255,255,.05)}

/* ===================== LAYOUT ===================== */
.row{display:flex;gap:clamp(10px,1.3vw,18px)}
.col{display:flex;flex-direction:column;gap:clamp(9px,1.2vh,16px)}
.grid{display:grid;gap:clamp(10px,1.1vw,16px)}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)} .g5{grid-template-columns:repeat(5,1fr)}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.scrolly{overflow:auto;min-height:0}

/* ===================== COMPONENTES ===================== */
.card{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:var(--r);padding:clamp(12px,1.3vw,20px);position:relative;overflow:auto;
  overflow-wrap:break-word;transition:.22s}
.card>.tag{position:absolute;top:0;left:0;width:100%;height:3px;background:var(--verde);opacity:.85}
.card.oro>.tag{background:var(--oro)} .card.vio>.tag{background:var(--violeta)}
.card.coral>.tag{background:var(--coral)} .card.cel>.tag{background:var(--celeste)}
.card.aqua>.tag{background:var(--aqua)}
.box{border:1px solid var(--line);border-radius:var(--r-s);padding:11px 13px;background:rgba(255,255,255,.035)}
.box.ok{border-color:rgba(0,192,106,.45);background:rgba(0,192,106,.09)}
.box.bad{border-color:rgba(239,83,80,.45);background:rgba(239,83,80,.09)}
.box.warn{border-color:rgba(237,161,0,.45);background:rgba(237,161,0,.09)}
.box.info{border-color:rgba(57,182,216,.45);background:rgba(57,182,216,.09)}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:999px;
  padding:3px 10px;font-size:11.5px;color:var(--tx2)}
.pill.v{border-color:rgba(0,160,90,.5);color:var(--verde-l);background:rgba(0,160,90,.10)}
.pill.o{border-color:rgba(237,161,0,.5);color:var(--oro);background:rgba(237,161,0,.10)}
.pill.p{border-color:rgba(123,107,214,.5);color:var(--violeta);background:rgba(123,107,214,.12)}
.pill.c{border-color:rgba(239,106,75,.5);color:var(--coral);background:rgba(239,106,75,.10)}
.pill.a{border-color:rgba(57,182,216,.5);color:var(--celeste);background:rgba(57,182,216,.10)}
.btn{border:1px solid var(--verde);background:rgba(0,160,90,.16);color:var(--verde-l);
  border-radius:999px;padding:8px 15px;font-size:13px;cursor:pointer;font-family:var(--ff);
  font-weight:600;transition:.18s}
.btn:hover{background:var(--verde-l);color:#04150e}
.btn.ghost{border-color:var(--line2);color:var(--tx2);background:transparent}
.btn.ghost:hover{border-color:var(--oro);color:var(--oro);background:rgba(237,161,0,.1)}
.btn.sm{padding:5px 11px;font-size:12px}
.btn.xs{padding:3px 9px;font-size:11.5px}
.num{font-size:clamp(22px,2.3vw,34px);line-height:1;color:var(--verde-l);font-weight:800}
.hr{height:1px;background:var(--line);margin:2px 0}

/* ===================== FORMULARIO ===================== */
label.fl{display:block;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);
  font-weight:700;margin-bottom:5px}
input.fi,textarea.fa,select.fs{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line2);
  border-radius:10px;color:var(--tx);font-family:var(--ff);font-size:13.5px;padding:9px 11px;
  line-height:1.5;transition:.16s;resize:vertical}
html[data-theme="light"] input.fi,html[data-theme="light"] textarea.fa,html[data-theme="light"] select.fs{background:#fff}
input.fi:focus,textarea.fa:focus,select.fs:focus{outline:none;border-color:var(--verde);
  background:rgba(0,160,90,.08);box-shadow:0 0 0 3px rgba(0,160,90,.14)}
textarea.fa{min-height:88px}
textarea.fa.tall{min-height:150px}
textarea.fa.short{min-height:56px}
select.fs option{background:var(--panel);color:var(--tx)}
html[data-theme="light"] select.fs option{background:#fff;color:#10241d}
.fcount{font-size:10.5px;color:var(--tx3);text-align:right;margin-top:3px;font-variant-numeric:tabular-nums}
.fcount.warn{color:var(--oro)} .fcount.ok{color:var(--verde-l)}
.frow{display:flex;gap:9px;align-items:flex-start}
.frow>*{flex:1;min-width:0}
.fdel{flex:none!important;width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);
  background:rgba(255,255,255,.05);color:var(--tx3);cursor:pointer;font-size:13px;line-height:1}
.fdel:hover{border-color:var(--coral);color:var(--coral)}

/* ===================== TABLAS ===================== */
table.tb{width:100%;border-collapse:collapse;font-size:12.5px}
table.tb th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);
  font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line2);vertical-align:bottom}
table.tb td{padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--tx2)}
table.tb tr:last-child td{border-bottom:none}
table.tb input,table.tb textarea,table.tb select{width:100%;background:transparent;border:none;
  border-bottom:1px dashed var(--line2);color:var(--tx);font-family:var(--ff);font-size:12.5px;
  padding:4px 2px;resize:vertical}
table.tb input:focus,table.tb textarea:focus,table.tb select:focus{outline:none;border-bottom-color:var(--verde)}
table.tb select{border-bottom:1px dashed var(--line2)}
table.tb select option{background:var(--panel);color:var(--tx)}
html[data-theme="light"] table.tb select option{background:#fff;color:#10241d}

/* MML */
table.mml{width:100%;border-collapse:collapse;font-size:12px;min-width:820px}
table.mml th{background:rgba(0,160,90,.14);color:var(--verde-l);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;padding:8px;text-align:left;border:1px solid var(--line2);font-weight:700}
table.mml td{border:1px solid var(--line);padding:5px;vertical-align:top}
table.mml td textarea{width:100%;min-height:66px;background:transparent;border:none;color:var(--tx);
  font-family:var(--ff);font-size:12px;padding:4px;resize:vertical;line-height:1.45}
table.mml td textarea:focus{outline:none;background:rgba(0,160,90,.08);border-radius:6px}
table.mml td.lv{background:rgba(255,255,255,.04);width:15%}
table.mml .lvn{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--verde-l);font-weight:800}

/* árbol */
.tnode{display:flex;align-items:flex-start;gap:7px;border:1px solid var(--line2);border-radius:10px;
  padding:6px 9px;background:rgba(255,255,255,.045);transition:.16s}
.tnode.lv1{border-left:3px solid var(--coral)}
.tnode.lv2{border-left:3px solid var(--oro);margin-left:18px}
.tnode.lv3{border-left:3px solid var(--violeta);margin-left:36px}
.tnode.ef1{border-left:3px solid var(--celeste)}
.tnode.ef2{border-left:3px solid var(--aqua);margin-left:18px}
.tnode input{flex:1;min-width:0;background:transparent;border:none;color:var(--tx);font-size:12.5px;
  font-family:var(--ff);padding:2px}
.tnode input:focus{outline:none}
.tnode .lvb{flex:none;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);
  border:1px solid var(--line2);border-radius:6px;padding:1px 6px;cursor:pointer;background:transparent;
  font-family:var(--ff)}
.tnode .lvb:hover{border-color:var(--verde);color:var(--verde-l)}
.trunk{border:2px solid var(--verde);border-radius:13px;padding:11px 15px;background:rgba(0,160,90,.15)}
.trunk .lb{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--verde-l);font-weight:800}
.trunk .tx{font-size:14px;font-weight:700;line-height:1.35;margin-top:4px}
.mirror{display:grid;grid-template-columns:1fr 34px 1fr;gap:8px;align-items:center}
.mirror .ar{text-align:center;color:var(--verde-l);font-size:16px}

/* semáforo / progreso */
.meter{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--verde),var(--aqua));
  border-radius:6px;transition:width .45s cubic-bezier(.22,.9,.28,1)}
.meter.o i{background:linear-gradient(90deg,var(--oro),var(--coral))}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line2);flex:none}
.dot.ok{background:var(--verde)} .dot.part{background:var(--oro)}
.chk{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border:1px solid var(--line);
  border-radius:10px;background:rgba(255,255,255,.03);cursor:pointer;transition:.16s;font-size:12.5px;
  line-height:1.45;color:var(--tx2)}
.chk:hover{border-color:var(--line2)}
.chk input{margin-top:2px;accent-color:var(--verde);flex:none}
.chk.on{border-color:rgba(0,192,106,.45);background:rgba(0,192,106,.08);color:var(--tx)}

/* ítems del F01 */
.f01nav{display:flex;flex-wrap:wrap;gap:5px}
.f01b{width:33px;height:33px;border-radius:9px;border:1px solid var(--line2);background:rgba(255,255,255,.045);
  color:var(--tx2);font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--ff);position:relative;
  transition:.16s}
.f01b:hover{border-color:var(--verde);color:var(--verde-l)}
.f01b.on{background:var(--verde);border-color:var(--verde);color:#04150e}
.f01b.done::after{content:"";position:absolute;right:3px;bottom:3px;width:6px;height:6px;border-radius:50%;
  background:var(--verde-l)}
.f01b.on.done::after{background:#04150e}
.f01b.s2{border-color:rgba(237,161,0,.45)} .f01b.s2.on{background:var(--oro);border-color:var(--oro)}
.f01b.s3{border-color:rgba(123,107,214,.45)} .f01b.s3.on{background:var(--violeta);border-color:var(--violeta)}
.f01b.s4{border-color:rgba(57,182,216,.45)} .f01b.s4.on{background:var(--celeste);border-color:var(--celeste)}
.tk{list-style:none;padding:0;margin:0}
.tk li{position:relative;padding-left:16px;margin-top:5px;font-size:12.5px;color:var(--tx2);line-height:1.45}
.tk li::before{content:"◆";position:absolute;left:0;top:0;color:var(--verde-l);font-size:8px;line-height:1.9}
.tk.o li::before{color:var(--oro)} .tk.c li::before{color:var(--coral)}

/* esquema svg */
.esq{border:1px solid var(--line);border-radius:var(--r-s);padding:12px;background:rgba(255,255,255,.03);
  overflow:auto}
svg.esq-s{width:100%;height:auto;display:block;min-width:640px}

/* overlays */
.ov{position:fixed;inset:0;z-index:60;background:rgba(3,10,8,.9);backdrop-filter:blur(9px);
  display:none;flex-direction:column;padding:0}
html[data-theme="light"] .ov{background:rgba(240,246,243,.95)}
.ov.on{display:flex;animation:in .22s ease forwards}

.toast{position:fixed;left:50%;bottom:74px;transform:translate(-50%,16px);z-index:70;opacity:0;

/* impresión */

@media print{

var ESC = {"n": 9, "t": "Ochocientas hectáreas fiscales en el borde este de Salta", "lug": "Departamento Capital · predio fiscal, catastro N° 133.745, ~847 ha sobre la RN 9, a 6 km del centro", "ent": "Periurbano · interfaz campo–ciudad", "tags": ["Periurbano", "Espacios públicos", "Restauración", "Agua"], "amb": "Restauración urbana · conservación de ecosistemas · gestión ambiental del territorio", "res": "Deterioro simultáneo de las condiciones de habitabilidad de la población del borde este y de la base natural que la sostiene, sobre el último remanente continuo de vegetación nativa del sector, con una zonificación ya propuesta sobre el predio.", "sit": "En quince años el sector registró dos frentes de avance de signo opuesto: urbanizaciones cerradas por el norte y ocupación informal ladera arriba por el oeste, mientras el ejido agotó su suelo vacante interior. La oferta habitacional formal no alcanza; predominan la autoconstrucción y las tipologías precarias. El sector no dispone de espacios verdes públicos: una única plaza reducida y en pendiente, y una escuela con patio insuficiente. La red de agua se interrumpe en el límite del área consolidada y las cotas superiores se abastecen por camión cisterna; no hay red cloacal ni gas, con vuelco a pozo absorbente sobre el mismo reservorio del que se extrae el agua. Sobre el predio se registran extracción de leña y áridos, pastoreo, quema de pastizales y microbasurales perimetrales. Un estudio de zonificación ambiental con propuesta de master plan ya dividió el catastro en tres zonas —no urbanizable con destino de conservación, urbanizable con restricciones y urbanizable con cambio de uso—: hay una propuesta de destino sobre la mesa, y el equipo tiene que posicionarse frente a ella.", "ev": ["La ciudad registra la mayor tasa de crecimiento poblacional entre las diez más grandes del país; el aglomerado se expandió 4.430 ha, el 91 % residencial, y restan 342 ha de vacíos urbanos (2,32 % de la mancha urbana).", "El inventario forestal describe un bosque joven con 32 especies leñosas nativas —dos con categoría de conservación desfavorable— y 82 especies de aves y 6 de mamíferos.", "El escurrimiento descarga por las alcantarillas del corredor vial, único punto de salida; el cauce receptor está revestido, sin capacidad ociosa, y descarga sobre un sector de riesgo hídrico crítico.", "La cuenca visual se observa desde veinte puntos sobre la ruta, con capacidad de acogida media; la prospección arqueológica no detectó evidencias en superficie.", "Consultada la población sobre un cambio de usos del suelo, una amplia mayoría se manifestó a favor; entre los reparos, la pérdida de áreas verdes, el aumento del escurrimiento y la competencia por el agua.", "La zonificación propuesta reparte las 846,6 ha digitalizadas —el estudio declara 847,97— en 289,8 ha no urbanizables destinadas a conservación, 324,0 ha urbanizables con restricciones y 215,3 ha urbanizables con cambio de uso.", "El visor geoespacial del material ampliado permite recorrer el catastro, las tres zonas propuestas, la RN 9 y el Acceso Norte, con terreno 3D, imágenes históricas y herramientas de medición."], "con": ["Cobertura boscosa sujeta al régimen provincial de bosques nativos, recientemente actualizado.", "Cabecera de cuenca y zona de conducción de un acuífero de escasa dimensión; suelos erosionables; pendientes superiores al 30 % en la mitad alta; zona sísmica.", "Redes de agua, cloaca y gas interrumpidas; una única línea de transporte público.", "Irregularidad dominial en los barrios vecinos; municipios metropolitanos con normativas dispares.", "Oportunidad: mayor superficie continua disponible en el borde de una ciudad sin vacíos urbanos, bajo un único dominio y titularidad pública; existen instrumentos de concesión de uso, APP y financiamiento internacional.", "La zonificación propuesta es un insumo, no una decisión tomada: puede adoptarse, ajustarse o discutirse, siempre con fundamento."], "pre": ["Si no se tomara ninguna decisión sobre este predio, ¿cómo estaría el territorio en diez años y quién estaría pagando ese resultado?", "¿Qué problema justificaría intervenir, sobre quiénes se manifiesta, y cuántas maneras genuinamente distintas de encararlo pueden imaginarse antes de elegir una?", "Si dos alternativas fueran buenas en aspectos distintos —una con mayor retorno económico, otra con mayor conservación de bosque y agua—, ¿con qué criterio decidir y quién debería ejecutarla?", "¿La zonificación propuesta resuelve el problema que identificaron, lo agrava o le es indiferente? ¿Con qué criterio lo sostienen?"], "alc": "La información es deliberadamente incompleta. El equipo debe explicitar y fundamentar los supuestos que adopte, y evaluar la alternativa seleccionada incluyendo las vías de inversión y los beneficios y costos ambientales asociados."};
var F01 = [{"L": "A", "s": 1, "t": "Nombre de fantasía del equipo de trabajo", "cap": "Capítulo 1 · Presentación del equipo y el problema", "pide": "Un nombre que represente las motivaciones del equipo, aporte identidad y permita identificarlo durante toda la cursada.", "como": ["Corto: una sigla, o dos o tres palabras como máximo.", "Preferentemente vinculado a la futura actividad profesional o al ámbito de actuación del proyecto.", "Se elige como si se estuviera iniciando una actividad económica real: el nombre de una empresa es parte de su capital y puede valorarse económicamente.", "Por ahora no hace falta definir el tipo societario: se asume una sociedad de hecho (S.H.)."], "error": "Confundir el nombre del equipo con el nombre del proyecto de inversión. Son dos cosas distintas y el segundo se define recién en el ítem V.", "ej": "La Guía cita consultoras del registro de la Secretaría de Ambiente de Salta como referencia de estilo: Knight Piésold Argentina, PACHA Consultora, EC y asociados, DYNAMIK S.A.S., Ambiental Argentina, URBIS, GT, AUSENCO VECTOR.", "guia": "Guía 01 · «Nombre de fantasía del equipo de trabajo»"}, {"L": "B", "s": 1, "t": "Integrantes del equipo y dedicación al entregable", "cap": "Capítulo 1 · Presentación del equipo y el problema", "pide": "Tabla con apellido y nombre, función en el equipo, perfil y dedicación en horas de cada integrante que trabajó en esta entrega.", "como": ["Identificar el coordinador general; la coordinación puede ser rotativa y removible por mayoría, informando a la cátedra por correo.", "Definir la función o rol de cada integrante: buscar información, procesar datos, redactar informes, completar formularios, consultar expertos.", "Acordar metodología de trabajo (día, frecuencia, dedicación individual, presencial o virtual) y medios de comunicación.", "Declarar sólo horas realmente trabajadas, sin tiempos muertos."], "error": "Incluir a integrantes que no aportaron a la entrega. La Guía es explícita: reconocer a quien ación secundaria sobre el problema asignado.", "Controlar que no se haya confundido una causa o un efecto con el problema central."], "error": "Enunciar el problema como «falta de…». Si la solución se deduce del enunciado, el análisis de alternativas ya está condicionado.", "ej": "Caso guía. Incorrecto: «Falta de riego en las forestaciones del municipio». Correcto: <strong>«Alta mortandad de los plantines nativos plantados en los espacios públicos del municipio»</strong>. · Otro ejemplo de la Guía: incorrecto «Falta de un puente sobre el río Arenales»; correcto «Dificultades de conectividad norte–sur del municipio Capital».", "guia": "Guía 01 · ítem C · «El problema identificado»"}, {"L": "E", "s": 1, "t": "Medición del problema", "cap": "Capítulo 1 · Presentación del equipo y el problema", "pide": "Cómo se mide el problema y el valor estimado del indicador en la situación <strong>sin proyecto</strong>.", "como": ["Construir el indicador respetando el esquema: cantidad o porcentaje + variable + lugar + plazo + medio de verificación.", "Puede ser cuantitativo o cualitativo, y se pueden usar varios indicadores o construir un índice.", "Verificar los criterios SMART: específico, mensurable, alcanzable, relevante y temporal.", "Completar el cuadro «valor del indicador en situación sin proyecto», aunque sea una primera aproximación."], "error": "Dejar el valor de línea de base en blanco o escribir «no se dispone de datos» sin adoptar un supuesto. Si el dato no existe, se asume uno, se numera y se declara la fuente del criterio.", "ej": "Caso guía: «Supervivencia del <strong>38 %</strong> de los plantines nativos <strong>a los 12 meses</strong> de plantados, en los <strong>espacios públicos del municipio</strong>, según el <strong>censo de arbolado 2025</strong>.» El 38 % es el valor sin proyecto.", "guia": "Guía 01 · ítem D · «Medición del problema»"}, {"L": "F", "s": 1, "t": "Contexto de intervención — línea de base", "cap": "Capítulo 1 · Presentación del equipo y el problema", "pide": "La descripción del contexto geográfico, social, económico y ambiental donde el proyecto desarrollará su acción.", "como": ["Recurrir a toda la información secundaria disponible: censos, informes sectoriales, estudios previos, cartografía.", "Responder la pregunta que ordena la sección: ¿qué características del contexto potencian el problema o contribuyen a su solución?", "Se admiten paratextos iconográficos: mapas, imágenes satelitales, fotografías, esquemas.", "Declarar la fuente y el año de cada dato."], "error": "Convertir la línea de base en una monografía geográfica del departamento. Se describe lo que tiene relación con el problema, no todo lo que existe.", "ej": "Escenario 11 (postura de huevos, Cerrillos): entorno rural de transición con la mayor tasa provincial de transformación de suelo rural a urbano, parcelas de tabaco y hortalizas, viviendas abastecidas por perforación y otras granjas en un radio de pocos kilómetros generando las mismas corrientes.", "guia": "Guía 01 · ítem E · «Contexto de intervención del proyecto – línea de base»"}, {"L": "G", "s": 1, "t": "Población destinataria de los resultados", "cap": "Capítulo 1 · Presentación del equipo y el problema", "pide": "Definir y cuantificar la población que recibirá en forma directa los beneficios del proyecto.", "como": ["Distinguir <strong>población potencial</strong> (la afectada por el problema) de <strong>población objetivo</strong> (los beneficiarios directos que el proyecto puede atender realmente).", "Responder: ¿quiénes internalizan el problema? ¿Quiénes son los destinatarios de los bienes y servicios que ofrecerá el proyecto?", "Cuantificar: personas, familias, productores, empresas o instituciones, con fuente.", "Si ambas poblaciones coinciden, decirlo y justificar por qué el proyecto alcanza al 100 % de la potencial."], "error": "Declarar como población objetivo a «toda la comunidad». Si el proyecto no puede atender al 100 % de la población potencial, la objetivo es una fracción y hay que decir cuál.", "ej": "Escenario 9: población potencial, los habitantes del borde este; población objetivo, los aproximadamente 4.000 habitantes de los barrios del extremo oeste con NBI de entre 40 % y 78 %.", "guia": "Guía 01 · ítem F · «Población destinataria» (Aldunate &amp; Córdoba, CEPAL, 2011)"}, {"L": "H", "s": 1, "t": "Análisis de los involucrados", "cap": "Capítulo 1 · Presentación del equipo y el problema", "pide": "Todos los actores vinculados al problema que pueden contribuir a su solución o poner palos en la rueda. Una fila por actor.", "como": ["Completar las cinco columnas: actor, grupo, posición, fuerza e importancia.", "Grupo: pública, privada, sociedad civil, ONG ambiental u otra institución.", "Posición: si influye de manera positiva o negativa sobre el problema y su solución.", "Fuerza e importancia: escala cualitativa (alta–media–baja) o numérica (0 a 1), <strong>la misma para ambas</strong>."], "error": "Listar sólo a los aliados. El análisis sirve precisamente para anticipar a quienes pueden bloquear el proyecto y diseñar estrategias hacia ellos.", "ej": "Comunidad aborigen · Agrupación social · Influye de manera positiva · Fuerza 0,9: el proyecto se desarrolla en propiedad de la comunidad y puede resolver no apoyarlo · Importancia 1: son los principales beneficiarios.", "guia": "Guía 01 · ítem G · «Análisis de los involucrados»"}, {"L": "I", "s": 1, "t": "Dependencia institucional del proyecto", "cap": "Capítulo 1 · Presentación del equipo y el problema", "pide": "La organización u organizaciones de las cuales depende directamente la realización del proyecto.", "como": ["Pensar en habilitaciones, permisos y vinculaciones necesarias para que el proyecto exista.", "Puede tratarse de gobierno municipal, provincial, nacional, organismos internacionales, empresas de bienes o servicios, ONG u organismos financistas.", "Estos actores también deben aparecer en el análisis de involucrados (ítem H): controlá la coherencia entre ambos ít       else { path = 'M'+x1+','+y1+' L'+x1+','+my+' L'+x2+','+my+' L'+x2+','+y2; }
    }
    o += '<path d="'+path+'" fill="none" stroke="'+col+'" stroke-width="1.8" stroke-opacity="0.85"'+
         (a.d?' stroke-dasharray="6 5"':'')+' marker-end="url(#ah-'+(a.c||'g')+')"/>';
    if(a.b){
      o += '<path d="'+ (Math.abs(tc[0]-fc[0])>=Math.abs(tc[1]-fc[1]) ?
            'M'+x2+','+y2+' L'+x1+','+y1 : 'M'+x2+','+y2+' L'+x1+','+y1) +
            '" fill="none" stroke="'+col+'" stroke-width="0" marker-end="url(#ah-'+(a.c||'g')+')"/>';
    }
    if(a.l){
      var lw = a.l.length*5.6+12;
      o += '<rect x="'+(mx-lw/2)+'" y="'+(my-10+(a.ly||0))+'" width="'+lw+'" height="17" rx="8" fill="var(--panel)" stroke="'+col+'" stroke-opacity=".35"/>'+
           '<text class="al" x="'+mx+'" y="'+(my+2+(a.ly||0))+'" text-anchor="middle">'+esc(a.l)+'</text>';
    }
  });
  /* nodos */
  (e.n||[]).forEach(function(n){
    var col = CC(n.c||'g');
    var strong = n.k==='hot';
    o += '<rect x="'+n.x+'" y="'+n.y+'" width="'+n.w+'" height="'+n.h+'" rx="11" fill="'+col+
         '" fill-opacity="'+(strong?0.24:0.12)+'" stroke="'+col+'" stroke-width="'+(strong?2.2:1.4)+'"'+
         (n.dash?' stroke-dasharray="7 5"':'')+'/>';
    var maxc = Math.max(8, Math.floor(n.w/6.6));
    var lines = wrapTxt(n.l, maxc);
    var subl = n.s ? wrapTxt(n.s, Math.max(8, Math.floor(n.w/5.8))) : [];
    var lh = 15, slh = 13;
    var total = lines.length*lh + (subl.length?subl.length*slh+3:0);
    var y0 = n.y + n.h/2 - total/2 + 11;
    lines.forEach(function(L,i){
      o += '<text x="'+(n.x+n.w/2)+'" y="'+(y0+i*lh)+'" text-anchor="middle" font-size="12.5" font-weight="'+(strong?700:600)+'">'+esc(L)+'</text>';
    });
    subl.forEach(function(L,i){
      o += '<text class="ns" x="'+(n.x+n.w/2)+'" y="'+(y0+lines.length*lh+3+i*slh)+'" text-anchor="middle" fill="'+col+'">'+esc(L)+'</text>';
    });
  });
  /* notas libres */
  (e.t||[]).forEach(function(t){
    o += '<text class="al" x="'+t.x+'" y="'+t.y+'"'+(t.anchor?' text-anchor="'+t.anchor+'"':'')+
         (t.c?' fill="'+CC(t.c)+'"':'')+' font-size="'+(t.fs||11.5)+'">'+esc(t.l)+'</text>';
  });
  return o+'</svg>';
}
function miniSVG(arr, c){
  var W=300, H=42, n=arr.length, gap=6, ar=13;
  var bw = (W - (gap+ar)*(n-1))/n;
  var maxc = Math.floor(bw/5.3);
  var o = '<svg class="mini" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
  arr.forEach(function(t,i){
    var x = i*(bw+gap+ar);
    o += '<rect x="'+x+'" y="4" width="'+bw+'" height="34" rx="8" fill="'+CC(c)+'" fill-opacity=".14" stroke="'+CC(c)+'" stroke-opacity=".55" stroke-width="1"/>';
    var lines = wrapTxt(t, maxc);
    if(lines.length>2) lines = [lines[0], lines[1].slice(0, maxc-1)+'…'];
    lines.forEach(function(L,j){
      o += '<text x="'+(x+bw/2)+'" y="'+(lines.length===1?25:19+j*11)+'" text-anchor="middle">'+esc(L)+'</text>';
    });
    if(i<n-1){
      var ax = x+bw+3;
      o += '<path d="M'+ax+',21 L'+(ax+8)+',21" stroke="'+CC(c)+'" stroke-opacity=".75" stroke-width="1.4"/>'+
           '<path d="M'+(ax+5.5)+',17.5 L'+(ax+10)+',21 L'+(ax+5.5)+',24.5 z" fill="'+CC(c)+'" fill-opacity=".85"/>';
    }

}

var D = blank();

function get(p){ var o=D, a=p.split('.'); for(var i=0;i<a.length;i++){ if(o==null) return ''; o=o[a[i]]; } return o==null?'':o; }
function set(p,v){ var o=D, a=p.split('.'); for(var i=0;i<a.length-1;i++){ if(o[a[i]]==null) o[a[i]]={}; o=o[a[i]]; } o[a[a.length-1]]=v; }

var saveT=null, savedEl=null;
function touch(){
  clearTimeout(saveT);

/* =============================================================== UTILIDADES DOM */
function E(tag, cls, html){ var e=document.createElement(tag); if(cls) e.className=cls;
  if(html!=null) e.innerHTML=html; return e; }
function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('on'); }, 2200); }

/* campo enlazado al estado */
function field(path, opts){
  opts = opts || {};
  var wrap = E('div');
  if(opts.label) wrap.appendChild(E('label','fl',opts.label));
  var inp;
  if(opts.type === 'select'){
    inp = E('select','fs');
    (opts.options||[]).forEach(function(o){
      var op=E('option',null,esc(o)); op.value=o; inp.appendChild(op);
    });
  } else if(opts.type === 'input'){
    inp = E('input','fi'); inp.type='text';
  } else {
    inp = E('textarea','fa'+(opts.tall?' tall':'')+(opts.short?' short':''));
  }
  if(opts.ph) inp.placeholder = opts.ph;
  inp.value = get(path);
  inp.dataset.path = path;
  var cnt = null;
  if(opts.min){
    cnt = E('div','fcount');
    var upd = function(){
      var n = inp.value.trim().length;
      cnt.textContent = n + ' / ' + opts.min + ' caracteres sugeridos';
      cnt.className = 'fcount' + (n === 0 ? '' : (n < opts.min ? ' warn' : ' ok'));
    };
    inp._upd = upd;
  }
  inp.addEventListener('input', function(){
    set(path, inp.value);
    if(inp._upd) inp._upd();
    if(opts.on) opts.on(inp.value);
    touch();
  });
  wrap.appendChild(inp);
  if(cnt){ wrap.appendChild(cnt); inp._upd(); }
  if(opts.help) wrap.appendChild(E('p','tiny',opts.help));
  wrap._input = inp;
  return wrap;
}
/* campo suelto dentro de una tabla */
function cell(obj, key, ph, tag){
  var inp = E(tag || 'input');
  if(!tag || tag === 'input') inp.type = 'text';
  inp.value = obj[key] || '';
  if(ph) inp.placeholder = ph;
  inp.addEventListener('input', function(){ obj[key] = inp.value; touch(); });
  return inp;
}
function selCell(obj, key, options){
  var s = E('select');
  options.forEach(function(o){ var op=E('option',null,esc(o)); op.value=o; s.appendChild(op); });
  s.value = obj[key] || '';
  s.addEventListener('change', function(){ obj[key]=s.value; touch(); });
  return s;
}
function btn(txt, cls, fn){ var b=E('button','btn '+(cls||''),txt); b.type='button'; b.onclick=fn; return b; }

/* =============================================================== SECCIONES */
var SECS = [], cur = 0, stage = null;
function addSec(o){ SECS.push(o); return o; }

function buildAll(){
  stage = document.getElementById('stage');
  stage.innerHTML = '';
  SECS.forEach(function(s,i){
    var d = E('section','sec'+(s.work?' work':'')); d.id = 'sec'+i; d.dataset.i = i;
    stage.appendChild(d);
    s.el = d; s.built = false;
  });
  railBuild();
}
function render(i){
  var s = SECS[i];
  s.el.innerHTML = '';
  s.build(s.el);
  s.built = true;
  popArm(s.el);
}
function show(i){
  if(i < 0 || i >= SECS.length) return;
  cur = i;
  SECS.forEach(function(s,k){ s.el.classList.toggle('on', k===i); });
  render(i);
  SECS[i].el.scrollTop = 0;
  document.getElementById('bar').style.width = ((i+1)/SECS.length*100)+'%';
  document.getElementById('counter').textContent = (i+1)+' / '+SECS.length;
  railPaint();
  if(location.hash !== '#'+(i+1)) history.replaceState(null,'','#'+(i+1));
  requestAnimationFrame(fitNow);
}
function next(){ show(Math.min(cur+1, SECS.length-1)); }
function prev(){ show(Math.max(cur-1, 0)); }

/* =============================================================== PROGRESO */
function pctOf(s){
  if(!s.fields) return null;
  var f = s.fields(), n = 0;
  f.forEach(function(v){ if(String(v||'').trim().length > 2) n++; });
  return f.length ? Math.round(n/f.length*100) : 0;
}
function paintProgress(){
  var blocks = {}, all = [], allN = 0;
  SECS.forEach(function(s,i){
    var p = pctOf(s);
    s.pct = p;
    if(p != null){ all.push(p); allN++; }
    var ri = document.querySelector('.ri[data-i="'+i+'"]');
    if(ri){ ri.classList.toggle('ok', p === 100); ri.classList.toggle('part', p != null && p > 0 && p < 100); }
  });
  var tot = allN ? Math.round(all.reduce(function(a,b){return a+b;},0)/allN) : 0;
  var el = document.getElementById('rail-all'); if(el) el.style.width = tot+'%';
  var pe = document.getElementById('rail-pct'); if(pe) pe.textContent = tot;
  BLOCKS.forEach(function(b,bi){
    var ps = SECS.map(function(s,i){ return s.block===bi ? s.pct : null; }).filter(function(x){ return x!=null; });
    var v = ps.length ? Math.round(ps.reduce(function(a,c){return a+c;},0)/ps.length) : 0;
    var bar = document.querySelector('.rg[data-b="'+bi+'"] .rg-p i');
    if(bar) bar.style.width = v+'%';
    var g = document.querySelector('.rg[data-b="'+bi+'"]');
    if(g) g.classList.toggle('done', v === 100);
  });
}

/* =============================================================== ÍNDICE LATERAL */
var BLOCKS = [];

    };

}
function railPaint(){

document.getElementById('b-rail').onclick = railToggle;

function railToggle(){

  document.getElementById('rail-toggle').textContent = off ? '◨ Mostrar índice' : '◧ Ocultar índice';
}

/* =============================================================== AUTOAJUSTE */
var FITMIN = .76, FITMAX = 1.14;
function overflowPx(s){
  var n = Math.max(0, s.scrollHeight - s.clientHeight - 3);
  s.querySelectorAll('.card,.scrolly').forEach(function(e){
    if(e.classList.contains('nofit') || getComputedStyle(e).display === 'none') return;
    var dy = e.scrollHeight - e.clientHeight - 6;
    var dx = e.scrollWidth - e.clientWidth - 14;
    if(dy > 0) n += dy;
    if(dx > 0) n += dx;
  });
  return n;
}
function nofitOver(s){
  var t = false;
  s.querySelectorAll('.nofit').forEach(function(e){
    if(e.scrollHeight > e.clientHeight + 6 || e.scrollWidth > e.clientWidth + 14) t = true; });
  return t;
}
function measureFit(s){
  var z = 1, g = 0;
  s.style.zoom = 1;
  /* pantallas de trabajo (tablas largas, editores): escala fija, se desplazan */
  if(SECS[cur] && SECS[cur].work) return 1;
  var base = overflowPx(s);
  if(base === 0){
    while(z < FITMAX - 1e-6 && g++ < 14 && !nofitOver(s)){
      var nz = Math.min(FITMAX, Math.round((z + .04)*100)/100);
      s.style.zoom = nz;
      if(overflowPx(s) > 0 || nofitOver(s)){ s.style.zoom = z; break; }
      z = nz;
    }
  } else {
    var best = z, bestN = base;
    while(z - .03 > FITMIN - 1e-6 && g++ < 18){
      z = Math.round((z - .03)*100)/100;
      s.style.zoom = z;
      var n = overflowPx(s);
      if(n < bestN){ bestN = n; best = z; }
      if(n === 0) break;
    }
    if(bestN > 0 && bestN > base * .75) best = 1;
    z = best; s.style.zoom = z;
  }
  return z;
}
/* reparte el aire sobrante dentro de cada panel */
function balUndo(e){
  if(!e.dataset.bal) return;
  e.style.paddingTop = '';
  [].forEach.call(e.children, function(c){ if(c.dataset && c.dataset.bal){ c.style.marginTop=''; delete c.dataset.bal; } });
  delete e.dataset.bal;
}
function balance(root){
  root.querySelectorAll('.card').forEach(function(e){
    balUndo(e);
    var cs = getComputedStyle(e);
    if(cs.display === 'none') return;
    var er = e.getBoundingClientRect();
    if(er.height < 130) return;
    var padT = parseFloat(cs.paddingTop), padB = parseFloat(cs.paddingBottom);
    var bot = er.top + padT, kids = [];
    [].forEach.call(e.children, function(c){
      if(c.classList.contains('pop-b') || c.classList.contains('tag')) return;
      var r = c.getBoundingClientRect();
      if(r.height === 0) return;
      kids.push(c); if(r.bottom > bot) bot = r.bottom;
    });
    if(!kids.length) return;
    var gap = (er.bottom - padB - parseFloat(cs.borderBottomWidth)) - bot;
    if(gap < 46) return;
    var extra = Math.min(gap / (kids.length + 1), 60);
    if(extra < 12) return;
    var h0 = e.offsetHeight;
    e.style.paddingTop = (padT + extra) + 'px';
    for(var k = 1; k < kids.length; k++){
      var m = parseFloat(getComputedStyle(kids[k]).marginTop) || 0;
      kids[k].style.marginTop = (m + extra) + 'px';
      kids[k].dataset.bal = '1';
    }
    e.dataset.bal = '1';
    if(e.offsetHeight > h0 + 2) balUndo(e);
  });
}

/* =============================================================== ZOOM */
var ZOOM = 1, FIT = 1;
function applyZoom(){
  document.getElementById('zlabel').textContent = Math.round(ZOOM*100)+'%';
  var s = SECS[cur] && SECS[cur].el;
  if(!s) return;
  if(window.innerWidth <= 760){ s.style.zoom = ''; return; }
  s.style.zoom = FIT * ZOOM;
}
function fitNow(){
  var s = SECS[cur].el, work = !!(SECS[cur] && SECS[cur].work);
  if(window.innerWidth <= 760){ s.style.zoom = ''; if(!work) balance(s); return; }
  FIT = measureFit(s);
  s.style.zoom = FIT * ZOOM;
  if(!work) balance(s);
}
function setZoom(z){ ZOOM = Math.max(.6, Math.min(2.2, Math.round(z*100)/100)); applyZoom(); }
document.getElementById('b-zi').onclick = function(){ setZoom(ZOOM+.1); };
document.getElementById('b-zo').onclick = function(){ setZoom(ZOOM-.1); };
document.getElementById('zlabel').onclick = function(){ setZoom(1); };

/* =============================================================== ABRIR PANEL */
var POP = {node:null, ph:null, z:1};
function popArm(root){
  root.querySelectorAll('.card').forEach(function(e){
    if(e.classList.contains('nopop') || e.querySelector(':scope > .pop-b')) return;
    var b = E('button','pop-b','⤢'); b.type='button';
    b.title = 'Abrir este panel a pantalla completa';
    b.addEventListener('click', function(ev){ ev.stopPropagation(); ev.preventDefault(); popOpen(e); });
    e.appendChild(b);
  });
}
function popOpen(e){
  if(POP.node) return;
  POP.ph = E('div','pop-ph');
  e.parentNode.insertBefore(POP.ph, e);
  POP.node = e; e.classList.add('popped');
  var h = e.querySelector('h2,h3,h4');
  document.getElementById('pop-t').textContent = h ? h.textContent.trim().slice(0,70) : 'Panel ampliado';
  document.getElementById('pop-in').appendChild(e);
  POP.z = 1; popZ(0);
  document.getElementById('pop').classList.add('on');
}
function popClose(){
  if(!POP.node) return;
  POP.node.classList.remove('popped');
  POP.ph.parentNode.insertBefore(POP.node, POP.ph);
  POP.ph.parentNode.removeChild(POP.ph);
  POP.node = null; POP.ph = null;
  document.getElementById('pop').classList.remove('on');
  document.getElementById('pop-in').style.zoom = '';
}
function popZ(d){
  POP.z = Math.max(.6, Math.min(2.4, Math.round((POP.z+d)*100)/100));
  document.getElementById('pop-in').style.zoom = POP.z;
  document.getElementById('pop-z').textContent = Math.round(POP.z*100)+'%';
}
document.getElementById('pop-x').onclick = popClose;
document.getElementById('pop-zi').onclick = function(){ popZ(.1); };
document.getElementById('pop-zo').onclick = function(){ popZ(-.1); };
document.getElementById('pop').addEventListener('mousedown', function(ev){
  if(ev.target.id === 'pop-in' || ev.target.id === 'pop') popClose(); });

/* =============================================================== TEMA Y TECLADO */
document.getElementById('b-th').onclick = function(){
  var h = document.documentElement;
  h.dataset.theme = h.dataset.theme === 'light' ? 'dark' : 'light';
};
document.addEventListener('keydown', function(e){
  var t = e.target.tagName;
  var editing = (t==='INPUT'||t==='TEXTAREA'||t==='SELECT');
  var po = document.getElementById('pop').classList.contains('on');
  if(e.key === 'Escape'){ popClose(); document.getElementById('help').classList.remove('on'); return; }
  if(editing) return;
  if(e.key==='+'||e.key==='='){ e.preventDefault(); po?popZ(.1):setZoom(ZOOM+.1); return; }
  if(e.key==='-'||e.key==='_'){ e.preventDefault(); po?popZ(-.1):setZoom(ZOOM-.1); return; }
  if(e.key==='0'){ e.preventDefault(); if(po){POP.z=1;popZ(0);} else setZoom(1); return; }
  if(po) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); prev(); }
  else if(e.key==='i'||e.key==='I'){ railToggle(); }
  else if(e.key==='t'||e.key==='T'){ document.getElementById('b-th').click(); }
});
document.getElementById('b-next').onclick = next;
document.getElementById('b-prev').onclick = prev;
var rzT=null;
window.addEventListener('resize', function(){ clearTimeout(rzT); rzT=setTimeout(fitNow,220); });
</script>
<script>

/* =============================================================== BLOQUES */
BLOCKS = [
 {t:'El escenario'},
 {t:'El problema'},
 {t:'Los dos árboles'},
 {t:'La estrategia'},
 {t:'MML y supuestos'},
 {t:'El F01 y la entrega'}
];

/* ---------- helpers de contenido ---------- */
function head(el, eyebrow, title, lead){
  var d = E('div');
  d.appendChild(E('span','eyebrow',eyebrow));
  d.appendChild(E('h2',null,title));
  el.appendChild(d);
  if(lead) el.appendChild(E('p','lead',lead));
}
function card(cls, title){
  var c = E('div','card'+(cls?' '+cls:''));
  c.appendChild(E('div','tag'));
  if(title) c.appendChild(E('h3',null,title));
  return c;
}
function listUl(items, cls){
  var u = E('ul','tk'+(cls?' '+cls:''));
  items.forEach(function(x){ u.appendChild(E('li',null,x)); });
  return u;
}
/* lista repetible genérica */
function repeater(arr, cols, mk, addLabel){
  var wrap = E('div','col');
  var box = E('div','col'); box.style.gap = '7px';
  function paint(){
    box.innerHTML = '';
    arr.forEach(function(o,i){
      var r = mk(o, i);
      var del = E('button','fdel','✕'); del.type='button'; del.title='Quitar';
      del.onclick = function(){ arr.splice(i,1); paint(); touch(); };
      r.appendChild(del);
      box.appendChild(r);
    });
  }
  paint();
  wrap.appendChild(box);
  var b = btn('+ '+addLabel, 'ghost sm', function(){ arr.push(cols()); paint(); touch(); });
  b.style.alignSelf = 'flex-start';
  wrap.appendChild(b);
  wrap._paint = paint;
  return wrap;
}
/* tabla editable */
function tableEd(arr, headers, mkRow, blankRow, addLabel){
  var c = E('div','col');
  var sc = E('div','scrolly');
  var t = E('table','tb');
  var th = E('tr');
  headers.forEach(function(h){ th.appendChild(E('th',null,h)); });
  var thead = E('thead'); thead.appendChild(th); t.appendChild(thead);
  var tb = E('tbody'); t.appendChild(tb);
  function paint(){
    tb.innerHTML = '';
    arr.forEach(function(o,i){
      var tr = E('tr');
      mkRow(o, i).forEach(function(node){ var td = E('td'); td.appendChild(node); tr.appendChild(td); });
      var td = E('td'); var del = E('button','fdel','✕'); del.type='button';
      del.onclick = function(){ arr.splice(i,1); paint(); touch(); };
      td.appendChild(del); tr.appendChild(td);
      tb.appendChild(tr);
    });
  }
  paint();
  sc.appendChild(t); c.appendChild(sc);
  var b = btn('+ '+addLabel,'ghost sm', function(){ arr.push(blankRow()); paint(); touch(); });
  b.style.alignSelf = 'flex-start';
  c.appendChild(b);
  return c;
}

  bx2.appendChild(E('p','sub','<strong>Uso responsable de IA.</strong> Está permitida y declarada. Un dato que la IA aportó y nadie verificó es un supuesto: va a la planilla de supuestos, numerado y justificado. Todo lo entregado se defiende oralmente.'));

addSec({block:1, t:'El problema central', build:function(el){

   ['¿Se puede medir? ¿Con qué variable?'],

  ej.appendChild(b1); ej.appendChild(b2);
  right.appendChild(ej);

  el.appendChild(r);
}, fields:function(){ return [D.pc, D.pcv[0], D.pcv[1]]; }});

addSec({block:1, t:'La línea de base', build:function(el){

  var cc = E('div','col'); cc.style.marginTop='9px';

  right.appendChild(ctx);
  r.appendChild(right);
  el.appendChild(r);
  paintLB();
}, fields:function(){ return [D.lb.c,D.lb.v,D.lb.l,D.lb.p,D.lb.mv,D.ctx.amb,D.ctx.soc]; }});

function lbText(){
  var l = D.lb;
  if(!l.c && !l.v) return '';
  return (l.c?l.c+' de ':'') + (l.v||'…') + (l.l?', en '+l.l:'') + (l.p?', '+l.p:'') +
         (l.mv?', según '+l.mv:'') + '.';
}
function paintLB(){
  var o = document.getElementById('lb-out'); if(!o) return;
  var t = lbText();
  o.innerHTML = t ? '<p class="sub" style="font-size:14px">'+esc(t)+'</p>'
                  : '<p class="tiny">Completá los campos y el indicador se arma solo.</p>';
  var names = {c:'cantidad',v:'variable',l:'lugar',p:'plazo',mv:'medio de verificación'};
  var falta = Object.keys(names).filter(function(k){ return !String(D.lb[k]||'').trim(); })
                     .map(function(k){ return names[k]; });
  var m = document.getElementById('lb-miss');
  m.innerHTML = falta.length ? '⚠ Todavía falta: <strong class="o">'+falta.join(' · ')+'</strong>'
                             : '✓ El indicador tiene las cinco piezas.';
}

function checkMML(){
  var o = document.getElementById('mml-out'); if(!o) return;
  var rows = [['fin','Fin'],['prop','Propósito'],['comp','Componente'],['act','Actividad']];
  var html = rows.map(function(r){
    var ind = D.mml[r[0]][1] || '', mv = D.mml[r[0]][2] || '', sup = D.mml[r[0]][3] || '';
    if(!ind.trim()) return '<div class="box" style="margin-bottom:6px"><p class="tiny">'+r[1]+': sin indicador cargado.</p></div>';
    var faltan = [];
    if(!/\d/.test(ind)) faltan.push('cantidad');
    if(ind.trim().length < 40) faltan.push('detalle (variable y lugar)');
    if(!/(año|meses|mes|plazo|primer|semestre|20\d\d|anual)/i.test(ind)) faltan.push('plazo');
    if(!mv.trim()) faltan.push('medio de verificación');
    var extra = (r[0] !== 'fin' && !sup.trim()) ? ' · sin supuesto' : '';
    return '<div class="box '+(faltan.length?'warn':'ok')+'" style="margin-bottom:6px"><p class="tiny">'+
      (faltan.length?'⚠ ':'✓ ')+'<strong>'+r[1]+'</strong>: '+
      (faltan.length ? 'falta '+faltan.join(' · ') : 'el indicador está completo') + extra + '</p></div>';
  }).join('');
  o.innerHTML = html + '<p class="tiny" style="margin-top:6px">Es una revisión mecánica, no reemplaza el criterio: un indicador puede tener las cinco piezas y aun así no medir lo que importa.</p>';
}

  if(i < 0) SECS.push(o); else SECS.splice(i, 0, o);

}
function addSecAfter(title, o){

  if(i < 0) SECS.push(o); else SECS.splice(i+1, 0, o);
  return o;
}

/* ---------------- modelo de la red causal ---------------- */
function sitAll(){ D.sit = D.sit || []; return D.sit; }
function lnkAll(){ D.lnk = D.lnk || []; return D.lnk; }
function sitById(id){ return sitAll().filter(function(s){ return s.id === id; })[0]; }
function newId(){
  var n = 1; while(sitById('s'+n)) n++;
  return 's'+n;
}
function sitText(id){ var s = sitById(id); return s ? (s.t || '(sin texto)') : '?'; }
function objText(id){
  D.sito = D.sito || {};
  return D.sito[id] || '';
}
/* nodo central: el marcado como problema, o el de mayor convergencia */
function centralId(){
  var p = sitAll().filter(function(s){ return s.k === 'p'; })[0];
  return p ? p.id : null;
}
function degrees(){
  var d = {};
  sitAll().forEach(function(s){ d[s.id] = {in:0, out:0}; });
  lnkAll().forEach(function(l){
    if(d[l.a]) d[l.a].out++;
    if(d[l.b]) d[l.b].in++;
  });
  return d;
}
/* niveles: 0 = central · 1,2,3… hacia abajo (causas) · −1,−2… hacia arriba (efectos) */
function levels(){
  var c = centralId(), lv = {};
  if(!c) return lv;
  lv[c] = 0;
  var q = [c], guard = 0;
  while(q.length && guard++ < 400){                    /* causas: quién produce a quién ya alcanzado */
    var cur = q.shift();
    lnkAll().forEach(function(l){
      if(l.b === cur && lv[l.a] === undefined){ lv[l.a] = lv[cur] + 1; q.push(l.a); }
    });
  }
  q = [c]; guard = 0;
  while(q.length && guard++ < 400){                    /* efectos: qué produce lo ya alcanzado */
    var cur2 = q.shift();
    lnkAll().forEach(function(l){
      if(l.a === cur2 && lv[l.b] === undefined){ lv[l.b] = lv[cur2] - 1; q.push(l.b); }
    });
  }
  return lv;
}
function creaCiclo(a, b){                              /* ¿agregar a→b cerraría un círculo? */
  var seen = {}, q = [b], guard = 0;
  while(q.length && guard++ < 400){
    var cur = q.shift();
    if(cur === a) return true;
    if(seen[cur]) continue;
    seen[cur] = 1;
    lnkAll().forEach(function(l){ if(l.a === cur) q.push(l.b); });
  }
  return false;
}

/* ---------------- diagrama SVG de la red ---------------- */
function redSVG(modo){
  var lv = levels(), c = centralId();
  if(!c) return '<p class="tiny">Marcá una situación como <strong>problema central</strong> para ver el diagrama.</p>';
  var byLv = {};
  Object.keys(lv).forEach(function(id){ (byLv[lv[id]] = byLv[lv[id]] || []).push(id); });
  var ks = Object.keys(byLv).map(Number).sort(function(a,b){ return a - b; });  /* efectos arriba, causas abajo */
  var W = 1180, rowH = 92, NH = 58, H = Math.max(170, ks.length * rowH + 34);
  var col = {1:'--coral',2:'--oro',3:'--violeta',0:'--verde'};
  var o = '<svg class="red" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet"><defs>';
  ['--coral','--oro','--violeta','--verde','--celeste'].forEach(function(v,i){
    o += '<marker id="mk'+i+'" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">'+
         '<path d="M0,0 L10,5 L0,10 z" fill="var('+v+')" fill-opacity=".85"/></marker>';
  });
  o += '</defs>';
  var pos = {};
  ks.forEach(function(k, ri){
    var ids = byLv[k], n = ids.length;
    var bw = Math.min(300, (W - 70) / n - 16);
    ids.forEach(function(id, i){
      var x = 35 + i * ((W - 70) / n) + ((W - 70) / n - bw) / 2;
      var y = 17 + ri * rowH;
      pos[id] = {x:x + bw/2, y:y + NH/2, w:bw, h:NH, x0:x, y0:y};
    });
  });
  /* flechas */
  lnkAll().forEach(function(l){
    var A = pos[l.a], B = pos[l.b];
    if(!A || !B) return;
    var cv = lv[l.a] > 0 ? (col[Math.min(3, lv[l.a])] || '--oro') : '--celeste';
    var mi = ['--coral','--oro','--violeta','--verde','--celeste'].indexOf(cv);
    o += '<path d="M'+A.x+','+(A.y0)+' C'+A.x+','+((A.y0+B.y0+NH)/2)+' '+B.x+','+((A.y0+B.y0+NH)/2)+' '+B.x+','+(B.y0+NH)+'" '+
         'fill="none" stroke="var('+cv+')" stroke-opacity=".55" stroke-width="1.6" marker-end="url(#mk'+(mi<0?1:mi)+')"/>';
  });
  /* nodos */
  Object.keys(pos).forEach(function(id){
    var p = pos[id], k = lv[id];
    var cv = k === 0 ? '--verde' : (k > 0 ? (col[Math.min(3,k)] || '--oro') : '--celeste');
    var txt = modo === 'obj' ? (objText(id) || '(sin pasar a positivo)') : sitText(id);
    o += '<g><rect x="'+p.x0+'" y="'+p.y0+'" width="'+p.w+'" height="'+NH+'" rx="10" fill="var('+cv+')" fill-opacity="'+(k===0?'.24':'.12')+'" '+
         'stroke="var('+cv+')" stroke-opacity="'+(k===0?'.95':'.6')+'" stroke-width="'+(k===0?2:1.2)+'"/>';
    var maxc = Math.floor(p.w / 6.2);
    var lines = wrapTxt(txt, maxc).slice(0,3);
    lines.forEach(function(L, j){
      o += '<text class="nl" x="'+p.x+'" y="'+(p.y0 + (lines.length===1?34:(lines.length===2?25:19)) + j*13)+'" text-anchor="middle">'+esc(L)+'</text>';
    });
    o += '</g>';
  });
  return o + '</svg>';
}

/* ---------------- volcado a los árboles ---------------- */
function volcarArbol(){
  var lv = levels(), c = centralId();
  if(!c){ toast('Primero marcá cuál es el problema central.'); return; }
  var cau = [], efe = [];
  Object.keys(lv).forEach(function(id){
    var k = lv[id];
    if(k > 0) cau.push({t:sitText(id), lv:Math.min(3, k), sid:id});
    else if(k < 0) efe.push({t:sitText(id), lv:Math.min(2, -k), sid:id});
  });
  cau.sort(function(a,b){ return a.lv - b.lv; });
  efe.sort(function(a,b){ return a.lv - b.lv; });
  if(cau.length) D.cau = cau;
  if(efe.length) D.efe = efe;
  D.pc = sitText(c);
  touch();
  toast(cau.length + ' causas y ' + efe.length + ' efectos volcados al árbol.');
}
function volcarObjetivos(){
  var lv = levels(), c = centralId();
  if(!c){ toast('Primero marcá cuál es el problema central.'); return; }
  D.sito = D.sito || {};
  var med = [], fin = [];
  Object.keys(lv).forEach(function(id){
    var k = lv[id], t = objText(id) || sitText(id);
    if(k > 0) med.push({t:t, lv:Math.min(3, k), sid:id});
    else if(k < 0) fin.push({t:t, lv:Math.min(2, -k), sid:id});
  });
  med.sort(function(a,b){ return a.lv - b.lv; });
  fin.sort(function(a,b){ return a.lv - b.lv; });
  if(med.length) D.med = med;
  if(fin.length) D.fin = fin;
  if(objText(c)) D.obj = objText(c);
  touch();
  toast(med.length + ' medios y ' + fin.length + ' fines volcados al árbol de objetivos.');
}

/* ---------------- textos derivados de la red ---------------- */
function cadenaTexto(modo){
  var lv = levels(), c = centralId();
  if(!c) return '';
  var T = function(id){ return modo === 'obj' ? (objText(id) || sitText(id)) : sitText(id); };
  var out = [];
  var dn = Object.keys(lv).filter(function(id){ return lv[id] > 0; }).sort(function(a,b){ return lv[a]-lv[b]; });
  var up = Object.keys(lv).filter(function(id){ return lv[id] < 0; }).sort(function(a,b){ return lv[b]-lv[a]; });
  out.push((modo === 'obj' ? 'Objetivo central: ' : 'Problema central: ') + T(c));
  if(dn.length){
    out.push('');
    out.push(modo === 'obj' ? 'Medios, por nivel:' : 'Causas, por nivel:');
    dn.forEach(function(id){ out.push('  · [nivel ' + lv[id] + '] ' + T(id)); });
  }
  if(up.length){
    out.push('');
    out.push(modo === 'obj' ? 'Fines, por nivel:' : 'Efectos, por nivel:');
    up.forEach(function(id){ out.push('  · [nivel ' + (-lv[id]) + '] ' + T(id)); });
  }
  if(lnkAll().length){
    out.push('');
    out.push(modo === 'obj' ? 'Relaciones verificadas en positivo:' : 'Relaciones de causalidad:');
    lnkAll().forEach(function(l){
      out.push('  · ' + T(l.a) + (modo === 'obj' ? ' → permite → ' : ' → produce → ') + T(l.b));
    });
  }
  return out.join('\n');
}

}

    '<p><strong>Equipo:</strong> '+esc(eq)+
    (D.eq.coord? ' · <strong>Coordinación:</strong> '+esc(D.eq.coord) : '')+
    '<br><span style="font-size:9pt;color:#5a6b64">Generado el '+nowStr()+' desde el visor del Escenario '+ESC.n+'</span></p>';

  var caps = {}, order = [];
  F01.forEach(function(it){ if(!caps[it.cap]){ caps[it.cap]=[]; order.push(it.cap); } caps[it.cap].push(it); });
  order.forEach(function(cp){
    h += '<h2>'+esc(cp)+'</h2>';
    caps[cp].forEach(function(it){
      var v = D.f01[it.L] || (SRC[it.L] ? SRC[it.L]() : '') || '';
      h += '<div class="p-i"><h3>'+it.L+' · '+esc(it.t)+'</h3>'+
           '<div class="p-v">'+(String(v).trim()? nl2br(v) : '<em style="color:#8a9a94">— sin completar —</em>')+'</div></div>';
    });
  });

  /* anexos tabulares */
  h += '<h2>Anexo I · Matriz de Marco Lógico</h2>'+
    '<table><tr><th></th><th>Resumen narrativo</th><th>Indicadores</th><th>Medios de verificación</th><th>Supuestos</th></tr>'+
    [['fin','Fin'],['prop','Propósito'],['comp','Componente'],['act','Actividad']].map(function(r){
      var m = D.mml[r[0]];
      return '<tr><th>'+r[1]+'</th>'+[0,1,2,3].map(function(j){ return '<td>'+nl2br(m[j]||'')+'</td>'; }).join('')+'</tr>';
    }).join('')+'</table>';

  h += '<h2>Anexo II · Planilla de supuestos</h2>'+
    '<table><tr><th>N°</th><th>Supuesto</th><th>Justificación</th><th>Probabilidad</th><th>Efecto si no ocurre</th></tr>'+
    (D.sup.filter(function(s){return String(s.t||'').trim();}).map(function(s,i){
      return '<tr><td>S'+(i+1)+'</td><td>'+nl2br(s.t)+'</td><td>'+nl2br(s.j)+'</td><td>'+esc(s.pr)+'</td><td>'+nl2br(s.im)+'</td></tr>';
    }).join('') || '<tr><td colspan="5"><em>Sin supuestos cargados.</em></td></tr>')+'</table>';

  h += '<h2>Anexo III · Análisis de involucrados</h2>'+
    '<table><tr><th>Actor</th><th>Posición</th><th>Fuerza</th><th>Importancia</th><th>Interés</th></tr>'+
    (D.inv.filter(function(a){return String(a.n||'').trim();}).map(function(a){
      return '<tr><td>'+esc(a.n)+'</td><td>'+esc(a.pos)+'</td><td>'+esc(a.fue)+'</td><td>'+esc(a.imp)+'</td><td>'+nl2br(a.int||'')+'</td></tr>';
    }).join('') || '<tr><td colspan="5"><em>Sin actores cargados.</em></td></tr>')+'</table>';

  h += '<h2>Anexo IV · Alternativas evaluadas</h2>'+
    '<table><tr><th>#</th><th>Medio</th><th>Actividad</th><th>A favor</th><th>En contra</th></tr>'+
    (D.alt.filter(function(a){return String(a.med||'').trim()||String(a.act||'').trim();}).map(function(a,i){
      var id = a.id || String.fromCharCode(65+i);
      return '<tr><td>'+esc(id)+(D.altSel===id?' ✔':'')+'</td><td>'+nl2br(a.med)+'</td><td>'+nl2br(a.act)+
             '</td><td>'+nl2br(a.ven)+'</td><td>'+nl2br(a.des)+'</td></tr>';
    }).join('') || '<tr><td colspan="5"><em>Sin alternativas cargadas.</em></td></tr>')+'</table>';

  /* anexo de causalidad */
  var sit = (D.sit || []).filter(function(x){ return String(x.t||'').trim(); });
  if(sit.length){
    var lv = (typeof levels === 'function') ? levels() : {};
    var deg = (typeof degrees === 'function') ? degrees() : {};
    var rolTxt = function(id){
      var k = lv[id];
      if(k === 0) return 'problema central';
      if(k > 0) return 'causa de nivel ' + k;
      if(k < 0) return 'efecto de nivel ' + (-k);
      return 'fuera de la red';
    };
    h += '<h2>Anexo VI · Identificación de causas y análisis de causalidad</h2>'+
      '<table><tr><th>Situación negativa</th><th>Rol en la red</th><th>Recibe</th><th>Produce</th><th>En positivo</th></tr>'+
      sit.map(function(x){
        var d = deg[x.id] || {in:0,out:0};
        return '<tr><td>'+esc(x.t)+'</td><td>'+rolTxt(x.id)+'</td><td>'+d.in+'</td><td>'+d.out+
               '</td><td>'+esc((D.sito||{})[x.id] || '')+'</td></tr>';
      }).join('')+'</table>';
    var lk = D.lnk || [];
    if(lk.length){
      h += '<h3>Relaciones de causalidad verificadas</h3><table><tr><th>Esto…</th><th></th><th>…produce esto</th><th>Se sostiene en positivo</th></tr>'+
        lk.map(function(l){
          var st = (D.lnkok||{})[l.a+'>'+l.b] ? 'sí' : '—';
          return '<tr><td>'+esc(sitText(l.a))+'</td><td style="text-align:center">→</td><td>'+esc(sitText(l.b))+'</td><td style="text-align:center">'+st+'</td></tr>';
        }).join('')+'</table>';
    }
  }

  var ckn = CK.filter(function(_,i){ return D.ck[i]; }).length;
  h += '<h2>Anexo VII · Autocontrol</h2><p>'+ckn+' de '+CK.length+' puntos verificados por el equipo.</p><table>'+
    CK.map(function(q,i){ return '<tr><td style="width:22px">'+(D.ck[i]?'✔':'—')+'</td><td>'+esc(q)+'</td></tr>'; }).join('')+
    '</table>';
  return h;
}

  var css = 'body{font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#111;line-height:1.45}'+
    'h1{font-size:19pt;color:#0e5c3a;margin:0 0 4pt}h2{font-size:13.5pt;color:#0e5c3a;margin:16pt 0 4pt;'+
    'border-bottom:1px solid #cfd8d4;padding-bottom:3pt}h3{font-size:11.5pt;margin:11pt 0 2pt}'+
    '.p-v{white-space:normal;border-left:2px solid #cfd8d4;padding-left:9pt;margin-top:2pt}'+
    'table{border-collapse:collapse;width:100%;font-size:10pt;margin-top:6pt}'+
    'th,td{border:1px solid #b9c6c1;padding:5pt;text-align:left;vertical-align:top}th{background:#eef4f1;color:#0e5c3a}';
  var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'+
    '<head><meta charset="utf-8"><title>F01 · Escenario '+ESC.n+'</title>'+
    '<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View></w:WordDocument></xml><![endif]-->'+
    '<style>@page{size:A4;margin:2cm}'+css+'</style></head><body>'+docBody()+'</body></html>';
  dl('F01_E'+ESC.n+'_'+slug(D.eq.nombre)+'.doc', 'application/msword', '﻿'+html);
  toast('Formulario 01 descargado en Word.');
}
function expJSON(){
  D.ts = nowStr();
  dl('avance_F01_E'+ESC.n+'_'+slug(D.eq.nombre)+'.json', 'application/json', JSON.stringify(D, null, 1));
  toast('Archivo de avance descargado.');
}
document.getElementById('fileIn').addEventListener('change', function(ev){
  var f = ev.target.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var o = JSON.parse(rd.result);
      if(o.esc && o.esc !== ESC.n){
        if(!confirm('Ese archivo de avance es del Escenario '+o.esc+' y este visor es el '+ESC.n+'. ¿Cargarlo igual?')) return;
      }
      merge(o); D.esc = ESC.n;
      touch(); railBuild(); show(cur);
      toast('Avance cargado' + (o.ts ? ' · guardado el '+o.ts : '') + '.');
    }catch(e){ toast('No se pudo leer ese archivo.'); }
  };
  rd.readAsText(f);
  ev.target.value = '';
});
function doPrint(){
  document.getElementById('print').innerHTML = docBody();
  setTimeout(function(){ window.print(); }, 60);
}
document.getElementById('b-word').onclick = expWord;
document.getElementById('b-save').onclick = expJSON;
document.getElementById('b-load').onclick = function(){ document.getElementById('fileIn').click(); };
document.getElementById('b-print').onclick = doPrint;

/* =============================================================== AYUDA */
document.getElementById('help-x').onclick = function(){ document.getElementById('help').classList.remove('on'); };

/* =============================================================== ARRANQUE */
(function boot(){
  var had = loadLocal();
  buildAll();
  var h = parseInt((location.hash||'').replace('#',''), 10);
  show(h >= 1 && h <= SECS.length ? h-1 : 0);
  paintProgress();
  if(had) toast('Retomamos donde habías dejado' + (D.ts ? ' ('+D.ts+')' : '') + '.');
})();
</script>
