<!doctype html>
<html lang="es" data-theme="dark" data-rail="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FEPAR 2026 · Escenario 10 — Laboratorio de causalidad</title>
<meta name="description" content="Laboratorio de análisis causal del Escenario 10 de FEPAR 2026: seis dimensiones, escalas, profundidad y rúbrica para construir árboles de problemas y objetivos profesionales.">
<style>
:root{
  --bg:#06110d; --bg2:#0a1a14; --panel:#0e2019; --panel2:#0b1a15;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.19);
  --tx:#eaf5f0; --tx2:#b9cfc6; --tx3:#7f9a90;
  --verde:#00a05a; --verde-l:#22c97f; --aqua:#12b5a0; --celeste:#39b6d8;
  --oro:#eda100; --violeta:#7b6bd6; --coral:#ef6a4b; --ok:#00c06a; --bad:#ef5350;
  --ff:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fh:var(--ff);
  --r:16px; --r-s:12px; --rail:300px;
  --shadow:0 22px 60px -26px rgba(0,0,0,.85);
}
html[data-theme="light"]{
  --bg:#f2f6f4; --bg2:#e8efec; --panel:#fff; --panel2:#f7faf9;
  --line:rgba(16,36,29,.12); --line2:rgba(16,36,29,.24);
  --tx:#10241d; --tx2:#3c554c; --tx3:#6b8279;
  --shadow:0 22px 60px -30px rgba(16,36,29,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ff);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(1100px 700px at 12% -6%, rgba(0,160,90,.16), transparent 60%),
   radial-gradient(900px 560px at 94% 6%, rgba(237,161,0,.11), transparent 60%),
   radial-gradient(1000px 700px at 55% 112%, rgba(123,107,214,.10), transparent 62%)}
html[data-theme="light"] body::before{
  background:
   radial-gradient(1100px 700px at 12% -6%, rgba(0,160,90,.10), transparent 60%),
   radial-gradient(900px 560px at 94% 6%, rgba(237,161,0,.09), transparent 60%)}
::selection{background:rgba(0,160,90,.35)}

/* scrollbars visibles en los dos ejes */
*{scrollbar-width:thin;scrollbar-color:rgba(0,192,106,.7) rgba(255,255,255,.05)}
*::-webkit-scrollbar{width:12px;height:12px}
*::-webkit-scrollbar-track{background:rgba(255,255,255,.05);border-radius:12px}
*::-webkit-scrollbar-thumb{background:rgba(0,192,106,.7);border-radius:12px;
  border:3px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:var(--verde-l);background-clip:padding-box;border:3px solid transparent}
*::-webkit-scrollbar-corner{background:transparent}
html[data-theme="light"] *{scrollbar-color:rgba(0,140,80,.55) rgba(0,0,0,.06)}
html[data-theme="light"] *::-webkit-scrollbar-track{background:rgba(0,0,0,.06)}

/* ===================== ESTRUCTURA ===================== */
#top{position:fixed;top:0;left:var(--rail);right:0;height:4px;z-index:40;background:rgba(255,255,255,.06);
  transition:left .3s cubic-bezier(.22,.9,.28,1)}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--verde),var(--aqua) 45%,var(--oro));
  transition:width .45s cubic-bezier(.22,.9,.28,1)}
#stage{position:fixed;top:4px;right:0;bottom:0;left:var(--rail);z-index:1;
  transition:left .3s cubic-bezier(.22,.9,.28,1)}
.sec{position:absolute;inset:0;display:none;flex-direction:column;gap:clamp(10px,1.4vh,18px);
  padding:clamp(16px,2.6vh,34px) clamp(18px,3.4vw,64px) 78px;overflow:auto;
  opacity:0;transform:translateY(14px)}
.sec.on{display:flex;animation:in .38s cubic-bezier(.22,.9,.28,1) forwards}
@keyframes in{to{opacity:1;transform:none}}
.fill{flex:1;min-height:0}
/* pantallas de trabajo: los paneles conservan su alto natural y la pantalla se desplaza */
.sec.work>*{flex:none!important}
.sec.work .fill{flex:none!important;min-height:0}

/* ===================== HUD ===================== */
#hud{position:fixed;bottom:0;left:var(--rail);right:0;height:58px;z-index:40;display:flex;align-items:center;
  gap:9px;padding:0 clamp(12px,2.4vw,34px);backdrop-filter:blur(8px);
  background:linear-gradient(0deg,rgba(0,0,0,.5),transparent);transition:left .3s cubic-bezier(.22,.9,.28,1)}
html[data-theme="light"] #hud{background:linear-gradient(0deg,rgba(255,255,255,.8),transparent)}
.hud-b{border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--tx2);
  border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:var(--ff);
  transition:.18s;white-space:nowrap}
.hud-b:hover{color:var(--tx);border-color:var(--verde);background:rgba(0,160,90,.14)}
.hud-b.pri{background:var(--verde);border-color:var(--verde);color:#04150e;font-weight:650}
.hud-b.pri:hover{background:var(--verde-l);color:#04150e}
html[data-theme="light"] .hud-b{background:rgba(255,255,255,.85)}
#counter{font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums;margin-left:auto;flex:none}
#saved{font-size:11.5px;color:var(--tx3);flex:none}
#saved.on{color:var(--verde-l)}
#zwrap{display:inline-flex;align-items:center;gap:4px;flex:none}
#zlabel{font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums;min-width:44px;text-align:center;cursor:pointer}

/* ===================== ÍNDICE LATERAL ===================== */
#rail{position:fixed;top:0;left:0;bottom:0;width:var(--rail);z-index:50;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--panel),var(--bg2));border-right:1px solid var(--line)}
#rail.off{display:none}
#rail-h{padding:15px 16px 11px;border-bottom:1px solid var(--line);flex:none}
#rail-h .rt{font-size:14.5px;font-weight:800;line-height:1.2}
#rail-h .rs{font-size:11px;color:var(--tx3);margin-top:3px}
#rail-b{flex:1;overflow:auto;padding:9px 9px 14px}
#rail-f{flex:none;padding:9px 13px 13px;border-top:1px solid var(--line)}
.rg{margin-bottom:5px;border-radius:11px;overflow:hidden;border:1px solid transparent}
.rg.cur{border-color:var(--line2);background:rgba(255,255,255,.035)}
.rg-h{display:flex;align-items:center;gap:9px;padding:8px 9px;cursor:pointer;transition:.16s}
.rg-h:hover{background:rgba(255,255,255,.05)}
.rg-n{flex:none;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:800;border:1px solid var(--line2);color:var(--tx3)}
.rg.cur .rg-n{background:var(--verde);border-color:var(--verde);color:#04150e}
.rg.done .rg-n{border-color:var(--verde);color:var(--verde-l)}
.rg-t{flex:1;min-width:0}
.rg-t b{display:block;font-size:12.5px;color:var(--tx2);font-weight:650;line-height:1.25}
.rg.cur .rg-t b{color:var(--tx)}
.rg-t span{font-size:10.5px;color:var(--tx3)}
.rg-p{height:3px;border-radius:3px;background:rgba(255,255,255,.08);margin:0 9px 7px;overflow:hidden}
.rg-p i{display:block;height:100%;background:linear-gradient(90deg,var(--verde),var(--aqua));border-radius:3px;
  transition:width .4s cubic-bezier(.22,.9,.28,1)}
.rg-l{display:none}
.rg.open .rg-l{display:block;padding:0 6px 6px}
.ri{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:8px;cursor:pointer;
  font-size:11.5px;color:var(--tx3);line-height:1.3;transition:.14s}
.ri:hover{background:rgba(255,255,255,.06);color:var(--tx2)}
.ri.cur{background:rgba(0,160,90,.16);color:var(--tx);font-weight:600;box-shadow:inset 2px 0 0 var(--verde-l)}
.ri .rn{flex:none;width:16px;font-size:10px;opacity:.7;text-align:right}
.ri .rk{flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line2)}
.ri.ok .rk{background:var(--verde);border-color:var(--verde)}
.ri.part .rk{background:var(--oro);border-color:var(--oro)}
#rail-toggle{border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--tx2);
  border-radius:8px;padding:5px 9px;font-size:11px;cursor:pointer;font-family:var(--ff)}

/* ===================== TIPOGRAFÍA ===================== */
h1{font-size:clamp(26px,3.4vw,44px);line-height:1.05;letter-spacing:-.03em;margin:0;font-weight:800}
h2{font-size:clamp(21px,2.5vw,33px);line-height:1.1;letter-spacing:-.025em;margin:0;font-weight:800}
h3{font-size:15px;margin:0;font-weight:700;letter-spacing:-.01em}
h4{font-size:12.5px;margin:0;font-weight:700;color:var(--tx2)}
p{margin:0}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--verde-l);font-weight:700}
.eyebrow::before{content:"";width:24px;height:2px;background:linear-gradient(90deg,var(--verde),transparent);border-radius:2px}
.lead{font-size:clamp(14px,1.15vw,17px);color:var(--tx2);line-height:1.5;max-width:88ch}
.sub{font-size:13px;color:var(--tx2);line-height:1.5}
.tiny{font-size:11.5px;color:var(--tx3);line-height:1.45}
.mono{font-family:ui-monospace,Consolas,monospace}
.g{color:var(--verde-l)} .o{color:var(--oro)} .c{color:var(--coral)}
.hl{background:linear-gradient(180deg,transparent 62%,rgba(237,161,0,.35) 0);padding:0 2px}
.kbd{font-family:ui-monospace,Consolas,monospace;font-size:11px;border:1px solid var(--line2);
  border-radius:5px;padding:1px 5px;color:var(--tx2);background:rgba(255,255,255,.05)}

/* ===================== LAYOUT ===================== */
.row{display:flex;gap:clamp(10px,1.3vw,18px)}
.col{display:flex;flex-direction:column;gap:clamp(9px,1.2vh,16px)}
.grid{display:grid;gap:clamp(10px,1.1vw,16px)}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)} .g5{grid-template-columns:repeat(5,1fr)}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.scrolly{overflow:auto;min-height:0}

/* ===================== COMPONENTES ===================== */
.card{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:var(--r);padding:clamp(12px,1.3vw,20px);position:relative;overflow:auto;
  overflow-wrap:break-word;transition:.22s}
.card>.tag{position:absolute;top:0;left:0;width:100%;height:3px;background:var(--verde);opacity:.85}
.card.oro>.tag{background:var(--oro)} .card.vio>.tag{background:var(--violeta)}
.card.coral>.tag{background:var(--coral)} .card.cel>.tag{background:var(--celeste)}
.card.aqua>.tag{background:var(--aqua)}
.box{border:1px solid var(--line);border-radius:var(--r-s);padding:11px 13px;background:rgba(255,255,255,.035)}
.box.ok{border-color:rgba(0,192,106,.45);background:rgba(0,192,106,.09)}
.box.bad{border-color:rgba(239,83,80,.45);background:rgba(239,83,80,.09)}
.box.warn{border-color:rgba(237,161,0,.45);background:rgba(237,161,0,.09)}
.box.info{border-color:rgba(57,182,216,.45);background:rgba(57,182,216,.09)}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:999px;
  padding:3px 10px;font-size:11.5px;color:var(--tx2)}
.pill.v{border-color:rgba(0,160,90,.5);color:var(--verde-l);background:rgba(0,160,90,.10)}
.pill.o{border-color:rgba(237,161,0,.5);color:var(--oro);background:rgba(237,161,0,.10)}
.pill.p{border-color:rgba(123,107,214,.5);color:var(--violeta);background:rgba(123,107,214,.12)}
.pill.c{border-color:rgba(239,106,75,.5);color:var(--coral);background:rgba(239,106,75,.10)}
.pill.a{border-color:rgba(57,182,216,.5);color:var(--celeste);background:rgba(57,182,216,.10)}
.btn{border:1px solid var(--verde);background:rgba(0,160,90,.16);color:var(--verde-l);
  border-radius:999px;padding:8px 15px;font-size:13px;cursor:pointer;font-family:var(--ff);
  font-weight:600;transition:.18s}
.btn:hover{background:var(--verde-l);color:#04150e}
.btn.ghost{border-color:var(--line2);color:var(--tx2);background:transparent}
.btn.ghost:hover{border-color:var(--oro);color:var(--oro);background:rgba(237,161,0,.1)}
.btn.sm{padding:5px 11px;font-size:12px}
.btn.xs{padding:3px 9px;font-size:11.5px}
.num{font-size:clamp(22px,2.3vw,34px);line-height:1;color:var(--verde-l);font-weight:800}
.hr{height:1px;background:var(--line);margin:2px 0}

/* ===================== FORMULARIO ===================== */
label.fl{display:block;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);
  font-weight:700;margin-bottom:5px}
input.fi,textarea.fa,select.fs{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line2);
  border-radius:10px;color:var(--tx);font-family:var(--ff);font-size:13.5px;padding:9px 11px;
  line-height:1.5;transition:.16s;resize:vertical}
html[data-theme="light"] input.fi,html[data-theme="light"] textarea.fa,html[data-theme="light"] select.fs{background:#fff}
input.fi:focus,textarea.fa:focus,select.fs:focus{outline:none;border-color:var(--verde);
  background:rgba(0,160,90,.08);box-shadow:0 0 0 3px rgba(0,160,90,.14)}
textarea.fa{min-height:88px}
textarea.fa.tall{min-height:150px}
textarea.fa.short{min-height:56px}
select.fs option{background:var(--panel);color:var(--tx)}
html[data-theme="light"] select.fs option{background:#fff;color:#10241d}
.fcount{font-size:10.5px;color:var(--tx3);text-align:right;margin-top:3px;font-variant-numeric:tabular-nums}
.fcount.warn{color:var(--oro)} .fcount.ok{color:var(--verde-l)}
.frow{display:flex;gap:9px;align-items:flex-start}
.frow>*{flex:1;min-width:0}
.fdel{flex:none!important;width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);
  background:rgba(255,255,255,.05);color:var(--tx3);cursor:pointer;font-size:13px;line-height:1}
.fdel:hover{border-color:var(--coral);color:var(--coral)}

/* ===================== TABLAS ===================== */
table.tb{width:100%;border-collapse:collapse;font-size:12.5px}
table.tb th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);
  font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line2);vertical-align:bottom}
table.tb td{padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--tx2)}
table.tb tr:last-child td{border-bottom:none}
table.tb input,table.tb textarea,table.tb select{width:100%;background:transparent;border:none;
  border-bottom:1px dashed var(--line2);color:var(--tx);font-family:var(--ff);font-size:12.5px;
  padding:4px 2px;resize:vertical}
table.tb input:focus,table.tb textarea:focus,table.tb select:focus{outline:none;border-bottom-color:var(--verde)}
table.tb select{border-bottom:1px dashed var(--line2)}
table.tb select option{background:var(--panel);color:var(--tx)}
html[data-theme="light"] table.tb select option{background:#fff;color:#10241d}

/* MML */
table.mml{width:100%;border-collapse:collapse;font-size:12px;min-width:820px}
table.mml th{background:rgba(0,160,90,.14);color:var(--verde-l);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;padding:8px;text-align:left;border:1px solid var(--line2);font-weight:700}
table.mml td{border:1px solid var(--line);padding:5px;vertical-align:top}
table.mml td textarea{width:100%;min-height:66px;background:transparent;border:none;color:var(--tx);
  font-family:var(--ff);font-size:12px;padding:4px;resize:vertical;line-height:1.45}
table.mml td textarea:focus{outline:none;background:rgba(0,160,90,.08);border-radius:6px}
table.mml td.lv{background:rgba(255,255,255,.04);width:15%}
table.mml .lvn{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--verde-l);font-weight:800}

/* árbol */
.tnode{display:flex;align-items:flex-start;gap:7px;border:1px solid var(--line2);border-radius:10px;
  padding:6px 9px;background:rgba(255,255,255,.045);transition:.16s}
.tnode.lv1{border-left:3px solid var(--coral)}
.tnode.lv2{border-left:3px solid var(--oro);margin-left:18px}
.tnode.lv3{border-left:3px solid var(--violeta);margin-left:36px}
.tnode.ef1{border-left:3px solid var(--celeste)}
.tnode.ef2{border-left:3px solid var(--aqua);margin-left:18px}
.tnode input{flex:1;min-width:0;background:transparent;border:none;color:var(--tx);font-size:12.5px;
  font-family:var(--ff);padding:2px}
.tnode input:focus{outline:none}
.tnode .lvb{flex:none;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);
  border:1px solid var(--line2);border-radius:6px;padding:1px 6px;cursor:pointer;background:transparent;
  font-family:var(--ff)}
.tnode .lvb:hover{border-color:var(--verde);color:var(--verde-l)}
.trunk{border:2px solid var(--verde);border-radius:13px;padding:11px 15px;background:rgba(0,160,90,.15)}
.trunk .lb{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--verde-l);font-weight:800}
.trunk .tx{font-size:14px;font-weight:700;line-height:1.35;margin-top:4px}
.mirror{display:grid;grid-template-columns:1fr 34px 1fr;gap:8px;align-items:center}
.mirror .ar{text-align:center;color:var(--verde-l);font-size:16px}

/* semáforo / progreso */
.meter{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--verde),var(--aqua));
  border-radius:6px;transition:width .45s cubic-bezier(.22,.9,.28,1)}
.meter.o i{background:linear-gradient(90deg,var(--oro),var(--coral))}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line2);flex:none}
.dot.ok{background:var(--verde)} .dot.part{background:var(--oro)}
.chk{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border:1px solid var(--line);
  border-radius:10px;background:rgba(255,255,255,.03);cursor:pointer;transition:.16s;font-size:12.5px;
  line-height:1.45;color:var(--tx2)}
.chk:hover{border-color:var(--line2)}
.chk input{margin-top:2px;accent-color:var(--verde);flex:none}
.chk.on{border-color:rgba(0,192,106,.45);background:rgba(0,192,106,.08);color:var(--tx)}

/* ítems del F01 */
.f01nav{display:flex;flex-wrap:wrap;gap:5px}
.f01b{width:33px;height:33px;border-radius:9px;border:1px solid var(--line2);background:rgba(255,255,255,.045);
  color:var(--tx2);font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--ff);position:relative;
  transition:.16s}
.f01b:hover{border-color:var(--verde);color:var(--verde-l)}
.f01b.on{background:var(--verde);border-color:var(--verde);color:#04150e}
.f01b.done::after{content:"";position:absolute;right:3px;bottom:3px;width:6px;height:6px;border-radius:50%;
  background:var(--verde-l)}
.f01b.on.done::after{background:#04150e}
.f01b.s2{border-color:rgba(237,161,0,.45)} .f01b.s2.on{background:var(--oro);border-color:var(--oro)}
.f01b.s3{border-color:rgba(123,107,214,.45)} .f01b.s3.on{background:var(--violeta);border-color:var(--violeta)}
.f01b.s4{border-color:rgba(57,182,216,.45)} .f01b.s4.on{background:var(--celeste);border-color:var(--celeste)}
.tk{list-style:none;padding:0;margin:0}
.tk li{position:relative;padding-left:16px;margin-top:5px;font-size:12.5px;color:var(--tx2);line-height:1.45}
.tk li::before{content:"◆";position:absolute;left:0;top:0;color:var(--verde-l);font-size:8px;line-height:1.9}
.tk.o li::before{color:var(--oro)} .tk.c li::before{color:var(--coral)}

/* esquema svg */
.esq{border:1px solid var(--line);border-radius:var(--r-s);padding:12px;background:rgba(255,255,255,.03);
  overflow:auto}
svg.esq-s{width:100%;height:auto;display:block;min-width:640px}

/* overlays */
.ov{position:fixed;inset:0;z-index:60;background:rgba(3,10,8,.9);backdrop-filter:blur(9px);
  display:none;flex-direction:column;padding:0}
html[data-theme="light"] .ov{background:rgba(240,246,243,.95)}
.ov.on{display:flex;animation:in .22s ease forwards}

<script>
"use strict";
/* =============================================================== DATOS DEL CASO */
var ESC  = {"n": 10, "t": "Gestión integral de residuos en un establecimiento porcino", "lug": "Departamento Rosario de Lerma · predio rural de ~120 ha del Valle de Lerma", "ent": "Rural de población dispersa", "tags": ["Rural", "Residuos", "Agua", "Producción"], "amb": "Gestión ambiental de proyectos de inversión · economía circular", "res": "Tres corrientes de residuos —líquida, sólida y gaseosa— acopladas entre sí, con observaciones de la autoridad en el expediente de renovación del certificado de aptitud ambiental.", "sit": "El establecimiento opera hace más de una década en ciclo completo, coloca del orden de 160 capones por semana y emplea trece personas. Las corrientes líquidas son los purines originados bajo el piso enrejillado, acumulados en fosas y trasladados a piletas junto con el agua de limpieza. Las sólidas comprenden la fracción separable de deyecciones, la mortandad, las placentas y los residuos de sanidad animal. Las gaseosas incluyen amoníaco y sulfuro de hidrógeno desde fosas y piletas —responsables del olor percibido por el vecindario— y metano de digestión anaerobia espontánea, hoy liberado mientras el establecimiento compra gas para calefacción. Las fosas no drenan por completo; una pileta tiene un talud roto con pérdida al terreno natural; la playa de compostaje opera muy por debajo de su capacidad. En los pozos de monitoreo propios se detectaron coliformes por encima de los valores admisibles.", "ev": ["No se cuantifica el volumen de efluente generado ni se analiza su composición de manera sistemática.", "Los purines presentaron DQO y DBO entre treinta y cuarenta veces los umbrales provinciales, y coliformes fecales tres órdenes de magnitud sobre el límite.", "El consumo se estima en 18 litros por animal y por día más el lavado, de una perforación propia: casi todo lo que ingresa sale como corriente a gestionar.", "La playa de compostaje ocupa 1.080 m², opera al 30 % de su capacidad y no controla temperatura ni rotación de pilas.", "El inventario provincial estima las emisiones del sector porcino en 109.548 t CO₂e/año, con la mayor parte del metano proveniente de la gestión del estiércol.", "No existe cartografía provincial de acuíferos someros ni registro de pozos de agua potable en el área."], "con": ["Las tres corrientes están vinculadas: la solución que se adopte para una modifica el volumen, la composición y el valor de las otras dos.", "La adecuación debe ejecutarse sin detener la producción, con animales en las naves.", "La aplicación agronómica exige superficie, balance de nutrientes y ventanas compatibles con el régimen de lluvias.", "No existe norma provincial que regule la actividad pecuaria intensiva ni protocolo de uso agronómico de purines.", "El metano que hoy se pierde es energía que el establecimiento compra en otra forma; la playa de compostaje es capacidad instalada ociosa."], "pre": ["¿Cuál es el problema central que plantea el escenario y sobre quiénes recae?", "El establecimiento operó una década sin invertir en gestión de residuos: ¿significa eso que no tuvo costo?", "¿Qué aspectos técnicos, ambientales, legales, sociales y económicos habría que analizar desde el punto de vista del titular privado?"], "alc": "La gestión integral admite múltiples alternativas que surgirán del árbol de problemas y objetivos: no hay que centrarse en una tecnología de tratamiento en particular."};
var LAB  = {"foco": "Tres corrientes de residuos —líquida, sólida y gaseosa— acopladas entre sí. Tratar una sola es la trampa clásica: lo que se saca del efluente aparece en el sólido.", "dims": {"amb": ["¿Qué carga tiene cada corriente y a dónde va hoy: suelo, curso de agua, napa, atmósfera?", "¿Las tres corrientes están vinculadas? ¿Lo que se retira de una aparece en otra?", "¿Qué pasa en el Valle de Lerma con la capacidad de asimilación del ambiente receptor?"], "soc": ["¿Quiénes son los vecinos y qué perciben: olor, moscas, agua, ruido?", "¿Hay conflicto declarado, latente, o nadie dijo nada todavía?", "¿Qué pasa con los trabajadores del establecimiento y su exposición?"], "eco": ["¿Qué costo tiene hoy la gestión de los residuos y qué costo tendría hacerlo bien?", "¿Hay valor recuperable en las corrientes: energía, enmienda orgánica, agua de riego?", "¿La escala productiva justifica la inversión, o el problema es de escala?"], "ins": ["¿Qué exige la normativa provincial para efluentes y residuos de esta actividad?", "¿El establecimiento tiene habilitación ambiental y bajo qué condiciones?", "¿Quién controla y con qué frecuencia? ¿La autoridad ya observó algo?"], "tec": ["¿Cómo es el manejo actual de cada corriente, paso por paso?", "¿Qué falla: dimensionamiento, operación, mantenimiento, o directamente no existe el sistema?", "¿Qué tecnologías son viables para la escala real del establecimiento?"], "ter": ["¿Dónde está el establecimiento respecto de los cursos de agua y de los vecinos?", "¿Qué otros usos hay alrededor en el Valle de Lerma?", "¿El efecto se queda en el predio o sale de él? ¿Hasta dónde?"]}, "esp": ["Las instalaciones y cada corriente de residuos", "El predio de ~120 ha", "El entorno inmediato: vecinos, cursos de agua, napa", "El Valle de Lerma como ambiente receptor"], "tmp": ["¿Desde cuándo opera el establecimiento y cómo manejó los residuos hasta ahora?", "¿Cuál es la situación actual de cada corriente?", "Si la producción crece o se mantiene, ¿qué pasa con la carga acumulada?"], "raices": ["El manejo por corriente separada, sin mirar el sistema: cada solución parcial genera el problema siguiente.", "El dimensionamiento original de las instalaciones, pensado para otra escala productiva.", "La ausencia de control efectivo, que hace que el costo de no tratar sea menor que el de tratar."], "trampas": [{"mal": "Falta de una planta de tratamiento de efluentes", "por": "Solución, y además parcial: resuelve una de las tres corrientes e ignora que están acopladas.", "bien": "Las tres corrientes de residuos del establecimiento se disponen sin tratamiento adecuado, afectando suelo, agua y aire del entorno"}, {"mal": "Contaminación del establecimiento porcino", "por": "Sin lugar preciso, sin plazo, sin magnitud y sin decir qué se contamina. No permite construir un indicador.", "bien": "Alta carga orgánica en el efluente vertido al ambiente receptor del predio rural de ~120 ha del Valle de Lerma"}, {"mal": "Los vecinos se quejan por el olor", "por": "Es un efecto, y de los más visibles: por eso se cuela como problema central. El olor es la señal, no la situación a revertir.", "bien": "Las emisiones gaseosas del manejo de residuos superan el nivel de molestia en el entorno inmediato del establecimiento"}]};
var DIMS = [{"k": "amb", "n": "Ambiental", "c": "v", "q": "Qué le pasa al ambiente y qué del ambiente condiciona el problema."}, {"k": "soc", "n": "Social", "c": "a", "q": "Quién sufre el problema, quién lo produce y quién lo sostiene."}, {"k": "eco", "n": "Económica", "c": "o", "q": "Qué costos, precios, márgenes e incentivos están detrás."}, {"k": "ins", "n": "Institucional y normativa", "c": "p", "q": "Quién tiene la responsabilidad, qué norma aplica y quién controla."}, {"k": "tec", "n": "Técnica y operativa", "c": "c", "q": "Qué falla en el diseño, la operación o el mantenimiento."}, {"k": "ter", "n": "Territorial", "c": "aq", "q": "Dónde ocurre, hasta dónde llega y qué cambia según el lugar."}];
var RUB  = [{"t": "Enunciado del problema central", "n1": "Está escrito como falta de una solución o como un juicio.", "n2": "Es una situación negativa, pero le falta lugar, plazo o magnitud.", "n3": "Situación negativa, ubicada, acotada en el tiempo y medida con un indicador."}, {"t": "Amplitud de las causas", "n1": "Todas las causas son de la misma dimensión, casi siempre técnica.", "n2": "Aparecen dos o tres dimensiones, pero desbalanceadas.", "n3": "Al menos cuatro dimensiones representadas, y las ausencias están justificadas."}, {"t": "Profundidad", "n1": "Las causas se quedan en el primer nivel: son síntomas.", "n2": "Hay un segundo nivel, pero las raíces siguen siendo genéricas.", "n3": "Se llega a causas raíz independientes entre sí, accionables o declaradas como supuesto."}, {"t": "Encadenamiento", "n1": "Las causas son una lista, no una cadena: no se sabe qué produce qué.", "n2": "Hay cadena en algunas ramas y en otras no.", "n3": "Toda la red se lee de abajo hacia arriba y cada eslabón resiste el «¿pero por qué?»."}, {"t": "Efectos", "n1": "Un solo efecto, inmediato y de la misma dimensión que el problema.", "n2": "Varios efectos, pero sin encadenar y sin horizonte temporal.", "n3": "Efectos encadenados, en más de una dimensión, con corto, medio y largo plazo distinguidos."}, {"t": "Escala", "n1": "Todo se analiza en una sola escala espacial.", "n2": "Se menciona más de una escala, pero sin consecuencias para el análisis.", "n3": "Se distingue qué causas son del sitio, cuáles del territorio y cuáles estructurales."}, {"t": "Espejo de objetivos", "n1": "El árbol de objetivos no coincide en cantidad de nodos con el de problemas.", "n2": "Coincide en cantidad, pero algunos nodos son la solución y no el estado deseado.", "n3": "Espejo exacto, en positivo y en futuro, y cada relación se sostiene al leerla como «si logro X, entonces Y»."}, {"t": "Trazabilidad", "n1": "No se puede saber de dónde salió cada afirmación.", "n2": "Algunas causas tienen respaldo y otras son supuestos sin declarar.", "n3": "Cada causa remite a una evidencia del escenario o a un supuesto numerado en la planilla."}];

var KEY = 'fepar2026_lab_e' + ESC.n;
var KEY_F01 = 'fepar2026_f01_e' + ESC.n;
function blank(){
  return {
    v:1, esc:ESC.n, ts:'', eq:'',
    nodos:[],          /* {id,t,tipo:'c'|'e',dim,esp,tmp,nivel,evid} */

    rub:[],            /* autoevaluación 0-3 por criterio */

  };
}
var D = blank();
function nodos(){ D.nodos = D.nodos || []; return D.nodos; }
function nodoById(id){ return nodos().filter(function(n){ return n.id === id; })[0]; }
function nuevoId(){ var k = 1; while(nodoById('n'+k)) k++; return 'n'+k; }
function addNodo(o){
  var n = {id:nuevoId(), t:'', tipo:'c', dim:'', esp:'', tmp:'', nivel:1, evid:''};
  Object.keys(o||{}).forEach(function(k){ n[k] = o[k]; });
  nodos().push(n); return n;
}
function delNodo(id){
  D.nodos = nodos().filter(function(n){ return n.id !== id; });
  delete D.porq[id]; delete D.raiz[id];
}
function causas(){ return nodos().filter(function(n){ return n.tipo === 'c'; }); }
function efectos(){ return nodos().filter(function(n){ return n.tipo === 'e'; }); }

function get(p){ var o=D, a=p.split('.'); for(var i=0;i<a.length;i++){ if(o==null) return ''; o=o[a[i]]; } return o==null?'':o; }
function set(p,v){ var o=D, a=p.split('.'); for(var i=0;i<a.length-1;i++){ if(o[a[i]]==null) o[a[i]]={}; o=o[a[i]]; } o[a[a.length-1]]=v; }

var saveT=null, savedEl=null;
function touch(){

  saveT = setTimeout(function(){

  }, 500);
  paintProgress();

/* =============================================================== AUTOAJUSTE */
var FITMIN = .76, FITMAX = 1.14;
function overflowPx(s){
  var n = Math.max(0, s.scrollHeight - s.clientHeight - 3);
  s.querySelectorAll('.card,.scrolly').forEach(function(e){
    if(e.classList.contains('nofit') || getComputedStyle(e).display === 'none') return;
    var dy = e.scrollHeight - e.clientHeight - 6;
    var dx = e.scrollWidth - e.clientWidth - 14;
    if(dy > 0) n += dy;
    if(dx > 0) n += dx;
  });
  return n;
}
function nofitOver(s){
  var t = false;
  s.querySelectorAll('.nofit').forEach(function(e){
    if(e.scrollHeight > e.clientHeight + 6 || e.scrollWidth > e.clientWidth + 14) t = true; });
  return t;
}
function measureFit(s){
  var z = 1, g = 0;
  s.style.zoom = 1;
  /* pantallas de trabajo (tablas largas, editores): escala fija, se desplazan */
  if(SECS[cur] && SECS[cur].work) return 1;
  var base = overflowPx(s);
  if(base === 0){
    while(z < FITMAX - 1e-6 && g++ < 14 && !nofitOver(s)){
      var nz = Math.min(FITMAX, Math.round((z + .04)*100)/100);
      s.style.zoom = nz;
      if(overflowPx(s) > 0 || nofitOver(s)){ s.style.zoom = z; break; }
      z = nz;
    }
  } else {
    var best = z, bestN = base;
    while(z - .03 > FITMIN - 1e-6 && g++ < 18){
      z = Math.round((z - .03)*100)/100;
      s.style.zoom = z;
      var n = overflowPx(s);
      if(n < bestN){ bestN = n; best = z; }
      if(n === 0) break;
    }
    if(bestN > 0 && bestN > base * .75) best = 1;
    z = best; s.style.zoom = z;
  }
  return z;
}
/* reparte el aire sobrante dentro de cada panel */
function balUndo(e){
  if(!e.dataset.bal) return;
  e.style.paddingTop = '';
  [].forEach.call(e.children, function(c){ if(c.dataset && c.dataset.bal){ c.style.marginTop=''; delete c.dataset.bal; } });
  delete e.dataset.bal;
}
function balance(root){
  root.querySelectorAll('.card').forEach(function(e){
    balUndo(e);
    var cs = getComputedStyle(e);
    if(cs.display === 'none') return;
    var er = e.getBoundingClientRect();
    if(er.height < 130) return;
    var padT = parseFloat(cs.paddingTop), padB = parseFloat(cs.paddingBottom);
    var bot = er.top + padT, kids = [];
    [].forEach.call(e.children, function(c){
      if(c.classList.contains('pop-b') || c.classList.contains('tag')) return;
      var r = c.getBoundingClientRect();
      if(r.height === 0) return;
      kids.push(c); if(r.bottom > bot) bot = r.bottom;
    });
    if(!kids.length) return;
    var gap = (er.bottom - padB - parseFloat(cs.borderBottomWidth)) - bot;
    if(gap < 46) return;
    var extra = Math.min(gap / (kids.length + 1), 60);
    if(extra < 12) return;
    var h0 = e.offsetHeight;
    e.style.paddingTop = (padT + extra) + 'px';
    for(var k = 1; k < kids.length; k++){
      var m = parseFloat(getComputedStyle(kids[k]).marginTop) || 0;
      kids[k].style.marginTop = (m + extra) + 'px';
      kids[k].dataset.bal = '1';
    }
    e.dataset.bal = '1';
    if(e.offsetHeight > h0 + 2) balUndo(e);
  });
}

/* =============================================================== ZOOM */
var ZOOM = 1, FIT = 1;
function applyZoom(){

  s.style.zoom = FIT * ZOOM;
}

  var s = SECS[cur].el, work = !!(SECS[cur] && SECS[cur].work);
  if(window.innerWidth <= 760){ s.style.zoom = ''; if(!work) balance(s); return; }
  FIT = measureFit(s);
  s.style.zoom = FIT * ZOOM;
  if(!work) balance(s);
}
function setZoom(z){ ZOOM = Math.max(.6, Math.min(2.2, Math.round(z*100)/100)); applyZoom(); }
document.getElementById('b-zi').onclick = function(){ setZoom(ZOOM+.1); };
document.getElementById('b-zo').onclick = function(){ setZoom(ZOOM-.1); };

/* =============================================================== ABRIR PANEL */
var POP = {node:null, ph:null, z:1};
function popArm(root){
  root.querySelectorAll('.card').forEach(function(e){
    if(e.classList.contains('nopop') || e.querySelector(':scope > .pop-b')) return;
    var b = E('button','pop-b','⤢'); b.type='button';
    b.title = 'Abrir este panel a pantalla completa';
    b.addEventListener('click', function(ev){ ev.stopPropagation(); ev.preventDefault(); popOpen(e); });
    e.appendChild(b);
  });
}
function popOpen(e){
  if(POP.node) return;
  POP.ph = E('div','pop-ph');
  e.parentNode.insertBefore(POP.ph, e);
  POP.node = e; e.classList.add('popped');
  var h = e.querySelector('h2,h3,h4');
  document.getElementById('pop-t').textContent = h ? h.textContent.trim().slice(0,70) : 'Panel ampliado';
  document.getElementById('pop-in').appendChild(e);
  POP.z = 1; popZ(0);
  document.getElementById('pop').classList.add('on');
}
function popClose(){
  if(!POP.node) return;
  POP.node.classList.remove('popped');
  POP.ph.parentNode.insertBefore(POP.node, POP.ph);
  POP.ph.parentNode.removeChild(POP.ph);
  POP.node = null; POP.ph = null;
  document.getElementById('pop').classList.remove('on');
  document.getElementById('pop-in').style.zoom = '';
}
function popZ(d){
  POP.z = Math.max(.6, Math.min(2.4, Math.round((POP.z+d)*100)/100));
  document.getElementById('pop-in').style.zoom = POP.z;
  document.getElementById('pop-z').textContent = Math.round(POP.z*100)+'%';
}
document.getElementById('pop-x').onclick = popClose;
document.getElementById('pop-zi').onclick = function(){ popZ(.1); };
document.getElementById('pop-zo').onclick = function(){ popZ(-.1); };
document.getElementById('pop').addEventListener('mousedown', function(ev){
  if(ev.target.id === 'pop-in' || ev.target.id === 'pop') popClose(); });

/* =============================================================== TEMA Y TECLADO */
document.getElementById('b-th').onclick = function(){
  var h = document.documentElement;
  h.dataset.theme = h.dataset.theme === 'light' ? 'dark' : 'light';
};
document.addEventListener('keydown', function(e){
  var t = e.target.tagName;
  var editing = (t==='INPUT'||t==='TEXTAREA'||t==='SELECT');
  var po = document.getElementById('pop').classList.contains('on');
  if(e.key === 'Escape'){ popClose(); document.getElementById('help').classList.remove('on'); return; }
  if(editing) return;
  if(e.key==='+'||e.key==='='){ e.preventDefault(); po?popZ(.1):setZoom(ZOOM+.1); return; }
  if(e.key==='-'||e.key==='_'){ e.preventDefault(); po?popZ(-.1):setZoom(ZOOM-.1); return; }
  if(e.key==='0'){ e.preventDefault(); if(po){POP.z=1;popZ(0);} else setZoom(1); return; }
  if(po) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); prev(); }
  else if(e.key==='i'||e.key==='I'){ railToggle(); }
  else if(e.key==='t'||e.key==='T'){ document.getElementById('b-th').click(); }
});
document.getElementById('b-next').onclick = next;
document.getElementById('b-prev').onclick = prev;
var rzT=null;
window.addEventListener('resize', function(){ clearTimeout(rzT); rzT=setTimeout(fitNow,220); });

                 .filter(function(x){ return x.v && x.v < 3; });
  var o2 = E('div'); o2.style.marginTop='9px';
  o2.innerHTML = lista.length
    ? lista.map(function(x){ return '<div class="box warn" style="margin-bottom:6px"><p class="tiny"><strong>'+esc(x.t)+'</strong> — para llegar a profesional: '+esc(x.s)+'</p></div>'; }).join('')
    : '<div class="box ok"><p class="tiny">Nada pendiente entre los criterios que ya ubicaste.</p></div>';
  pend.appendChild(o2);
  r.appendChild(pend);
  el.appendChild(r);
}, fields:function(){ return RUB.map(function(_,i){ return D.rub[i] ? 'x' : ''; }); }});
</script>
<script>
"use strict";
/* =============================================================== 9 · LLEVARLO AL F01 */
addSec({block:3, t:'Llevarlo al F01', build:function(el){
  head(el,'Cierre','Llevar el trabajo al Formulario 01',
    'Todo lo que cargaste acá puede pasar al visor del F01 de este escenario, donde se encadenan las causas, se arma el árbol y se completa el formulario.');

  var g = E('div','grid g3');

  var c1 = card(null,'Enviar al visor del F01');
  c1.appendChild(E('p','sub','Carga las causas y los efectos dentro del análisis de causalidad del formulario. <strong>No pisa</strong> lo que el equipo ya tenía: sólo agrega lo que falta.')).style.marginTop='7px';
  var b1 = btn('➜ Enviar al visor del F01','', enviarF01); b1.style.marginTop='11px';
  c1.appendChild(b1);
  var st = E('div'); st.id='send-st'; st.style.marginTop='9px';
  c1.appendChild(st);
  c1.appendChild(E('p','tiny','Funciona en esta misma computadora y este mismo navegador, porque los dos comparten el sitio.')).style.marginTop='8px';
  g.appendChild(c1);

  var c2 = card('oro','Descargar el trabajo');
  c2.appendChild(E('p','sub','Un archivo con todo el laboratorio, para seguir en otra máquina o para pasárselo a un compañero.')).style.marginTop='7px';
  var w = E('div','wrap'); w.style.marginTop='11px';
  w.appendChild(btn('💾 Descargar','ghost', expJSON));
  w.appendChild(btn('📂 Cargar','ghost', function(){ document.getElementById('fileIn').click(); }));
  c2.appendChild(w);
  c2.appendChild(E('p','tiny','Cargar un archivo reemplaza todo lo que haya en pantalla.')).style.marginTop='8px';
  g.appendChild(c2);

  var c3 = card('vio','Imprimir o guardar en PDF');
  c3.appendChild(E('p','sub','El informe del análisis: situaciones por dimensión, escaleras del «pero por qué», cobertura y rúbrica.')).style.marginTop='7px';
  var b3 = btn('🖨 Imprimir / PDF','ghost', doPrint); b3.style.marginTop='11px';
  c3.appendChild(b3);
  g.appendChild(c3);
  el.appendChild(g);

  var r = E('div','row');
  var res = card('cel','Resumen del análisis');
  res.style.flex='1.2';
  var nc = causas().filter(function(n){ return String(n.t||'').trim(); }).length;
  var ne = efectos().filter(function(n){ return String(n.t||'').trim(); }).length;
  var dims = DIMS.filter(function(d){ return nodos().some(function(n){ return n.dim===d.k && String(n.t||'').trim(); }); }).length;
  var raices = Object.keys(D.raiz).filter(function(k){ return D.raiz[k]; }).length;
  var o = E('div'); o.style.marginTop='9px';
  o.innerHTML = '<div class="grid g4" style="gap:12px">'+
   ['<div><div class="num">'+nc+'</div><p class="tiny">causas</p></div>',
    '<div><div class="num" style="color:var(--celeste)">'+ne+'</div><p class="tiny">efectos</p></div>',
    '<div><div class="num o">'+dims+'/6</div><p class="tiny">dimensiones</p></div>',
    '<div><div class="num" style="color:var(--violeta)">'+raices+'</div><p class="tiny">causas raíz</p></div>'
   ].join('')+'</div>';
  res.appendChild(o);
  var bx = E('div','box warn'); bx.style.marginTop='12px';
  bx.appendChild(E('p','sub','<strong>El paso que sigue.</strong> En el visor del F01, cargá los vínculos «esto produce esto otro» entre las situaciones. Recién ahí se ve cuál está en el medio de la red: ese es el problema central, y no el que más te indigna.'));
  res.appendChild(bx);
  r.appendChild(res);

  var nx = card('coral','Antes de cerrar');
  nx.style.flex='.9';
  nx.appendChild(listUl([
    'Cada causa tiene que poder rastrearse hasta una evidencia del escenario.',
    'Lo que no se pudo verificar va a la planilla de supuestos, numerado.',
    'Las causas raíz que el proyecto no puede tocar también son supuestos.',
    'El árbol se defiende oralmente: si nadie del equipo puede explicar un nodo, ese nodo no está terminado.'
  ],'c')).style.marginTop='8px';
  r.appendChild(nx);
  el.appendChild(r);
}});

/* =============================================================== ENVÍO AL F01 */
function enviarF01(){
  var st = document.getElementById('send-st');
  var listos = nodos().filter(function(n){ return String(n.t||'').trim(); });
  if(!listos.length){ toast('Todavía no hay nada para enviar.'); return; }
  var f01, existia = false;
  try{
    var raw = localStorage.getItem(KEY_F01);
    if(raw){ f01 = JSON.parse(raw); existia = true; }
  }catch(e){}
  if(!f01 || typeof f01 !== 'object') f01 = {esc:ESC.n};
  f01.esc = ESC.n;
  f01.sit = Array.isArray(f01.sit) ? f01.sit : [];

  var norm = function(t){ return String(t||'').trim().toLowerCase().replace(/\s+/g,' '); };
  var yaHay = {};
  f01.sit.forEach(function(s){ yaHay[norm(s.t)] = 1; });

  var maxN = 0;
  f01.sit.forEach(function(s){
    var m = /^s(\d+)$/.exec(String(s.id||''));
    if(m) maxN = Math.max(maxN, +m[1]);
  });
  var nuevos = 0;
  listos.forEach(function(n){
    if(yaHay[norm(n.t)]) return;
    maxN++;
    f01.sit.push({id:'s'+maxN, t:n.t.trim(), k:(n.tipo==='e' ? 'e' : 'c')});
    yaHay[norm(n.t)] = 1;
    nuevos++;
  });
  /* el problema central sólo se propone si allá todavía no hay ninguno marcado */
  var hayCentral = f01.sit.some(function(s){ return s.k === 'p'; });
  var pcTxt = String(D.pc||'').trim();
  var pcPuesto = false;
  if(!hayCentral && pcTxt){
    var ya = f01.sit.filter(function(s){ return norm(s.t) === norm(pcTxt); })[0];
    if(ya){ ya.k = 'p'; }
    else { maxN++; f01.sit.push({id:'s'+maxN, t:pcTxt, k:'p'}); nuevos++; }
    pcPuesto = true;
  }
  try{
    localStorage.setItem(KEY_F01, JSON.stringify(f01));
  }catch(e){
    st.innerHTML = '<div class="box bad"><p class="tiny">No se pudo escribir en este navegador. Descargá el trabajo y cargalo a mano en el visor.</p></div>';
    return;
  }
  st.innerHTML = '<div class="box ok"><p class="tiny">✓ <strong>'+nuevos+'</strong> '+
    (nuevos===1?'situación enviada':'situaciones enviadas')+' al visor del F01'+
    (pcPuesto ? ', incluido tu borrador de problema central' : '')+'. '+
    (existia ? 'Lo que ya estaba cargado allá se conservó.' : 'Se creó el trabajo del formulario para este escenario.')+
    '</p><p class="tiny" style="margin-top:6px"><a class="lk" href="../" target="_blank" rel="noopener">Abrir el visor del F01 →</a> y andá a «Análisis de causalidad».</p></div>';
  toast(nuevos + (nuevos===1 ? ' situación enviada al F01.' : ' situaciones enviadas al F01.'));
}

/* =============================================================== SALIDA */
function dl(name, mime, content){
  var b = new Blob([content], {type:mime});
  var u = URL.createObjectURL(b);
  var a = document.createElement('a');
  a.href = u; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); }, 400);
}
function slug(t){
  return String(t||'equipo').normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40) || 'equipo';
}
function docBody(){
  var h = '<h1>Laboratorio de causalidad · FEPAR 2026</h1>'+
    '<p><strong>Escenario '+ESC.n+' — '+esc(ESC.t)+'</strong><br>'+esc(ESC.lug)+'</p>'+
    '<p><strong>Equipo:</strong> '+esc(D.eq || 'sin nombre')+
    '<br><span style="font-size:9pt;color:#5a6b64">Generado el '+nowStr()+'</span></p>';

  if(String(D.pc||'').trim()){
    h += '<h2>Borrador del problema central</h2><div class="p-v">'+esc(D.pc)+'</div>';
  }

  h += '<h2>Situaciones por dimensión</h2><table><tr><th>Dimensión</th><th>Tipo</th><th>Situación</th>'+
       '<th>Escala</th><th>Horizonte</th><th>Raíz</th></tr>';
  var hay = false;
  DIMS.concat([{k:'',n:'Sin dimensión'}]).forEach(function(d){
    nodos().filter(function(n){ return (n.dim||'') === d.k && String(n.t||'').trim(); }).forEach(function(n){
      hay = true;
      h += '<tr><td>'+esc(d.n)+'</td><td>'+(n.tipo==='e'?'efecto':'causa')+'</td><td>'+esc(n.t)+'</td>'+
           '<td>'+esc((n.esp!==''&&n.esp!=null) ? LAB.esp[+n.esp] : '—')+'</td>'+
           '<td>'+((n.tmp!==''&&n.tmp!=null) ? ['Corto','Mediano','Largo'][+n.tmp]+' plazo' : '—')+'</td>'+
           '<td>'+(D.raiz[n.id] ? 'sí' : '—')+'</td></tr>';
    });
  });
  if(!hay) h += '<tr><td colspan="6"><em>Sin situaciones cargadas.</em></td></tr>';
  h += '</table>';

  var esc3 = causas().filter(function(n){ return String(n.t||'').trim() &&
    (D.porq[n.id]||[]).some(function(x){ return String(x||'').trim(); }); });
  if(esc3.length){
    h += '<h2>Escaleras del «pero por qué»</h2>';
    esc3.forEach(function(n){
      h += '<div class="p-i"><h3>'+esc(n.t)+(D.raiz[n.id]?' — causa raíz':'')+'</h3><table>';
      (D.porq[n.id]||[]).forEach(function(x,k){
        if(String(x||'').trim()) h += '<tr><th style="width:24%">Escalón '+(k+1)+'</th><td>'+esc(x)+'</td></tr>';
      });
      h += '</table></div>';
    });
  }

  h += '<h2>Cobertura del análisis</h2><table><tr><th>Dimensión</th><th>Causas</th><th>Efectos</th></tr>';
  DIMS.forEach(function(d){
    var ns = nodos().filter(function(n){ return n.dim===d.k && String(n.t||'').trim(); });
    h += '<tr><td>'+esc(d.n)+'</td><td>'+ns.filter(function(n){return n.tipo==='c';}).length+
         '</td><td>'+ns.filter(function(n){return n.tipo==='e';}).length+'</td></tr>';
  });
  h += '</table>';

  var suma = (D.rub||[]).reduce(function(a,b){ return a+(b||0); }, 0);
  h += '<h2>Autoevaluación con la rúbrica</h2><p>'+suma+' de '+(RUB.length*3)+' puntos.</p><table>'+
    '<tr><th style="width:26%">Criterio</th><th style="width:10%">Nivel</th><th>Estándar profesional</th></tr>'+
    RUB.map(function(r,i){
      return '<tr><td>'+esc(r.t)+'</td><td style="text-align:center">'+((D.rub||[])[i] || '—')+'</td><td>'+esc(r.n3)+'</td></tr>';
    }).join('')+'</table>';
  return h;
}
function expJSON(){
  D.ts = nowStr();
  dl('causalidad_E'+ESC.n+'_'+slug(D.eq)+'.json', 'application/json', JSON.stringify(D, null, 1));
  toast('Trabajo descargado.');
}
document.getElementById('fileIn').addEventListener('change', function(ev){
  var f = ev.target.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var o = JSON.parse(rd.result);
      if(o.esc && o.esc !== ESC.n){
        if(!confirm('Ese archivo es del Escenario '+o.esc+' y este laboratorio es el '+ESC.n+'. ¿Cargarlo igual?')) return;
      }
      merge(o); D.esc = ESC.n;
      touch(); railBuild(); show(cur);
      toast('Trabajo cargado' + (o.ts ? ' · guardado el '+o.ts : '') + '.');
    }catch(e){ toast('No se pudo leer ese archivo.'); }
  };
  rd.readAsText(f);
  ev.target.value = '';
});
function doPrint(){
  document.getElementById('print').innerHTML = docBody();
  setTimeout(function(){ window.print(); }, 60);
}
document.getElementById('b-send').onclick = function(){
  var i = SECS.findIndex(function(s){ return s.t === 'Llevarlo al F01'; });
  if(i >= 0 && cur !== i){ show(i); setTimeout(enviarF01, 350); }
  else enviarF01();
};
document.getElementById('b-save').onclick = expJSON;
document.getElementById('b-load').onclick = function(){ document.getElementById('fileIn').click(); };
document.getElementById('b-print').onclick = doPrint;

/* =============================================================== ARRANQUE */
(function boot(){
  var had = loadLocal();
  buildAll();
  var h = parseInt((location.hash||'').replace('#',''), 10);
  show(h >= 1 && h <= SECS.length ? h-1 : 0);
  paintProgress();
  if(had) toast('Retomamos donde habías dejado' + (D.ts ? ' ('+D.ts+')' : '') + '.');
})();
</script>
