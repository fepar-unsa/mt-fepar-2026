1", "b": "s3"}, {"a": "s1", "b": "s5"}, {"a": "s1", "b": "s6"}, {"a": "s1", "b": "s8"}, {"a": "s3", "b": "s4"}, {"a": "s2", "b": "s7"}, {"a": "s4", "b": "s9"}, {"a": "s8", "b": "s9"}], "obj": {"s1": "El soporte ambiental del que dependen las condiciones de habitabilidad del borde este de la ciudad de Salta —el predio fiscal de unas 800 ha sobre la RN 9, último remanente continuo de vegetación nativa del sector— se conserva y recupera: mantiene su cobertura leñosa, su capacidad de infiltración y de retención del escurrimiento, y cuenta con destino de uso definido y con acceso público para la población que lo rodea.", "s2": "La recarga del acuífero de escasa dimensión que la cabecera de cuenca alimenta se sostiene, con superficie de infiltración conservada en el predio del borde este.", "s3": "El escurrimiento superficial del sector se retiene e infiltra dentro del predio y llega amortiguado a las alcantarillas del corredor vial, dentro de la capacidad del cauce receptor.", "s4": "El sector de riesgo hídrico crítico situado aguas abajo del punto de descarga reduce su exposición a anegamientos y a daños en viviendas e infraestructura.", "s5": "Las poblaciones de las 32 especies leñosas nativas —incluidas las dos con categoría de conservación desfavorable— y el hábitat de las 82 especies de aves y 6 de mamíferos se mantienen y recuperan en el predio.", "s6": "Los hogares del borde este disponen de un ámbito de encuentro y de actividad al aire libre en condiciones seguras, con sombra, menor carga térmica estival y sin exposición al humo de las quemas.", "s7": "La competencia por el agua entre los barrios del sector se atenúa y se reduce la dependencia del abastecimiento por camión cisterna en las cotas superiores.", "s8": "El destino del predio resulta de una decisión de planificación explícita, que preserva el abanico de alternativas técnicamente posibles.", "s9": "Se evita el costo público futuro de reponer por obra las funciones que el predio presta: retención del escurrimiento, ampliación de redes, forestación y adquisición de suelo para espacio verde.", "s10": "El predio fiscal cuenta con destino de uso asignado por acto administrativo y con un organismo que ejerce la administración y el control territorial de las 800 ha.", "s11": "El predio cuenta con información sistematizada —límite catastral, cobertura, suelos, pendientes, hidrología y aptitud por sector— con el detalle necesario para fundamentar su zonificación interna y las restricciones de uso.", "s12": "La planificación urbana del ejido y la gestión del patrimonio natural fiscal se resuelven en un mismo instrumento, con un ámbito metropolitano de decisión sobre el borde y criterios de uso del suelo armonizados entre municipios.", "s13": "La decisión sobre el destino del predio se adopta con criterios de aptitud y de interés público, con la valoración de los servicios ecosistémicos incorporada a la comparación económica.", "s14": "Una guardería territorial y cuadrillas de manejo intervienen de manera regular sobre quemas, extracción, ingreso de ganado y microbasurales perimetrales.", "s15": "La cubierta leñosa joven regenera sobre los suelos erosionables y las pendientes superiores al 30 % de la mitad alta del predio, sin quemas, pastoreo ni extracción.", "s16": "Los hogares de los barrios linderos cubren sus necesidades de energía, materiales y disposición de residuos por fuera del predio, con acceso al servicio de recolección en las cotas superiores.", "s17": "Los hogares de menores ingresos del sector acceden a soluciones habitacionales formales y a lotes con servicios, sin necesidad de ocupar informalmente la ladera.", "s18": "El sector dispone de espacio verde público accesible y suficiente, y la demanda de expansión residencial se orienta a suelo apto previsto por la planificación."}, "f01": {"A": "Nombre propuesto: INTERFAZ · Consultora en Ambiente y Territorio (S.H.). Es un ejemplo de respuesta correcta, no la única válida: cualquier sigla o denominación de dos o tres palabras vinculada a la restauración urbana, al piedemonte o a la gestión del territorio cumple la consigna. Se fundamenta en que el equipo trabaja exactamente sobre una interfaz campo–ciudad, donde el problema se define por la relación entre el tejido urbano y la base natural que lo sostiene, y en que el nombre puede sostenerse como identidad profesional una vez terminada la cursada. Se asume sociedad de hecho, sin definir tipo societario en esta instancia. Advertencia de corrección: este nombre identifica al equipo, no al proyecto; el nombre del proyecto se define recién en el ítem V y no debe adelantarse acá.", "B": "Equipo de cinco integrantes, con coordinación rotativa y removible por mayoría, informada a la cátedra por correo. · Integrante 1 — Coordinación general y control de coherencia entre ítems (integra árbol de problemas, árbol de objetivos, EAP y MML): 26 h. · Integrante 2 — Búsqueda y sistematización de información secundaria (censos, informe de expansión del aglomerado, inventario forestal, estudios hidrológicos y de riesgo hídrico, normativa de bosques nativos): 24 h. · Integrante 3 — Cartografía y paratextos (imágenes satelitales de la serie de quince años, pendientes, cuenca visual, esquemas de los dos árboles): 22 h. · Integrante 4 — Redacción y edición del informe y del Formulario 01: 24 h. · Integrante 5 — Enlace institucional y consulta a expertos (organismo provincial de tierras fiscales, autoridad de bosques nativos, planeamiento municipal, prestadora de agua): 20 h. · Total declarado: 116 h de trabajo efectivo sobre esta entrega. Metodología: dos reuniones semanales, una presencial de dos horas y una virtual de una hora, con repositorio compartido y minuta de acuerdos; comunicación por grupo de mensajería y correo para lo que deja constancia. Se declaran sólo horas efectivamente trabajadas: los integrantes que no aportaron a esta entrega no se consignan.", "C": "El escenario se inscribe simultáneamente en tres de los ámbitos que propone la Guía, y así se declara porque las categorías no son mutuamente excluyentes. · Restauración urbana (ámbito principal): la intervención se produce sobre el borde de una ciudad que agotó su suelo vacante interior y busca recomponer la relación entre el tejido consolidado, la población que lo habita y el soporte natural del piedemonte, incorporando espacio público donde hoy hay una plaza reducida y en pendiente y un patio escolar insuficiente. · Conservación de ecosistemas: el predio es el último remanente continuo de vegetación nativa del sector, alberga 32 especies leñosas nativas —dos con categoría de conservación desfavorable—, 82 especies de aves y 6 de mamíferos, y está sujeto al régimen provincial de bosques nativos. · Producción de servicios ecosistémicos: la razón por la cual el deterioro del predio se traduce en pérdida de habitabilidad es que el predio produce infiltración y recarga del acuífero, retención del escurrimiento en cabecera de cuenca, regulación térmica y calidad de la cuenca visual observada desde veinte puntos sobre la ruta. El énfasis se pone en la restauración urbana porque es el ámbito que obliga a resolver conjuntamente la base natural y la habitabilidad; los otros dos aportan los criterios técnicos con los que se zonifica el predio. Este ítem se cerró después de escribir el D, tal como recomienda la Guía.", "D": "Problema central: el soporte ambiental del que dependen las condiciones de habitabilidad del borde este de la ciudad de Salta —el predio fiscal de unas 800 ha sobre la RN 9, último remanente continuo de vegetación nativa del sector— se degrada progresivamente: pierde cobertura leñosa, infiltración y capacidad de retención del escurrimiento, y sigue sin destino de uso definido ni acceso público. · Identidad: la misma superficie que infiltra, retiene y regula la temperatura es la única disponible para el espacio libre que el sector no tiene; es un problema, no dos. · Ubicación: borde este del ejido de Capital, a 6 km del centro, en cabecera de cuenca. · Tiempo: quince años de avance en dos frentes opuestos, urbanizaciones cerradas por el norte y ocupación informal por el oeste. · Mensurabilidad: cobertura leñosa remanente, superficie quemada o extraída, caudal en el punto único de descarga y m² verdes por habitante. · Magnitud: el aglomerado se expandió 4.430 ha, el 91 % residencial, y restan 342 ha de vacíos (2,32 % de la mancha urbana): el predio más que duplica esa reserva.", "E": "Se construye un índice de tres indicadores, porque el problema tiene tres manifestaciones medibles sobre el mismo objeto. · Indicador 1 (base natural): superficie con cobertura leñosa nativa continua dentro del predio fiscal del borde este, expresada en hectáreas y en porcentaje de las 800 ha, al año 0. Medio de verificación: clasificación supervisada de imágenes satelitales de la serie de quince años más verificación de campo en parcelas permanentes, contrastada con el inventario forestal existente. Valor sin proyecto: el inventario describe un bosque joven con 32 especies leñosas nativas; la superficie exacta remanente y su tendencia anual deben relevarse — se asume, hasta esa verificación, una pérdida neta anual mayor que cero por quema, pastoreo y extracción, dato a confirmar en el F02. · Indicador 2 (función hidrológica): caudal pico descargado por las alcantarillas del corredor vial, único punto de salida, ante el evento de precipitación de diseño, en m³/s, al año 0. Medio de verificación: estudio hidrológico e hidráulico específico con aforo en la alcantarilla de salida y verificación de la capacidad del cauce revestido receptor. Valor sin proyecto: el escenario sólo aporta que el cauce receptor no tiene capacidad ociosa y descarga sobre un sector de riesgo hídrico crítico; el valor numérico debe construirse — se asume que el caudal actual iguala o supera la capacidad del cauce, a verificar en el F02. · Indicador 3 (habitabilidad): superficie de espacio verde público efectivamente accesible por habitante del borde este, en m²/habitante, al año 0. Medio de verificación: relevamiento de espacios verdes del sector cruzado con población por radio censal del último censo. Valor sin proyecto: el escenario documenta que el sector no dispone de espacios verdes públicos más allá de una plaza reducida y en pendiente y una escuela con patio insuficiente, de modo que el valor de línea de base es cercano a cero y muy inferior al recomendado; la cifra exacta se calcula en el F02. · Lo que el escenario ya aporta: la expansión de 4.430 ha con 91 % residencial, las 342 ha de vacíos remanentes equivalentes al 2,32 % de la mancha urbana, el inventario de 32 leñosas, 82 aves y 6 mamíferos, el punto único de descarga y la capacidad de acogida visual media desde veinte puntos de observación. · Lo que hay que relevar: superficie catastral exacta y estado dominial, cartografía de pendientes y suelos, caudales, población por radio censal de los barrios linderos, y el mapa de usos informales actuales dentro del predio.", "F": "Contexto geográfico y territorial: predio fiscal de unas 800 ha en el departamento Capital, sobre la RN 9, a 6 km del centro, en la interfaz campo–ciudad del borde este. La ciudad registra la mayor tasa de crecimiento poblacional entre las diez más grandes del país y su aglomerado se expandió 4.430 ha, con el 91 % de esa expansión de destino residencial; restan 342 ha de vacíos urbanos interiores, el 2,32 % de la mancha urbana. En quince años el sector recibió dos frentes de avance de signo opuesto: urbanizaciones cerradas por el norte y ocupación informal ladera arriba por el oeste. · Contexto ambiental: cabecera de cuenca y zona de conducción de un acuífero de escasa dimensión; suelos erosionables; pendientes superiores al 30 % en la mitad alta; zona sísmica. La cobertura boscosa está sujeta al régimen provincial de bosques nativos, recientemente actualizado. El inventario forestal describe un bosque joven con 32 especies leñosas nativas, dos de ellas con categoría de conservación desfavorable, 82 especies de aves y 6 de mamíferos. El escurrimiento descarga por las alcantarillas del corredor vial, único punto de salida; el cauce receptor está revestido, sin capacidad ociosa, y descarga sobre un sector de riesgo hídrico crítico. La cuenca visual se observa desde veinte puntos sobre la ruta, con capacidad de acogida media, y la prospección arqueológica no detectó evidencias en superficie. Sobre el predio hay procesos activos de degradación: extracción de leña y áridos, pastoreo, quema de pastizales y microbasurales perimetrales. · Contexto social y económico: la oferta habitacional formal no alcanza y predominan la autoconstrucción y las tipologías precarias. La red de agua se interrumpe en el límite del área consolidada y las cotas superiores se abastecen por camión cisterna; no hay red cloacal ni gas, y el vuelco a pozo absorbente se produce sobre el mismo reservorio del que se extrae agua. Hay una única línea de transporte público e irregularidad dominial en los barrios vecinos. Consultada la población sobre un cambio de usos del suelo, una amplia mayoría se manifestó a favor, con reparos referidos a la pérdida de áreas verdes, el aumento del escurrimiento y la competencia por el agua. · Qué del contexto potencia el problema: la presión de expansión sobre un ejido sin vacantes, la pendiente y la erosionabilidad, la ausencia de redes y las normativas metropolitanas dispares. · Qué contribuye a la solución: la titularidad pública y el dominio único sobre la mayor superficie continua disponible en el borde, la existencia de instrumentos de concesión de uso, asociación público-privada y financiamiento internacional, la ausencia de hallazgos arqueológicos que condicionen la obra, y una opinión pública mayoritariamente favorable a un cambio de usos del suelo. Fuentes: escenario asignado por la cátedra; cada dato debe referenciarse en el informe con su fuente y año.", "G": "Población potencial: los habitantes del borde este de la ciudad de Salta afectados por el deterioro del soporte ambiental del sector, es decir, quienes internalizan el problema porque dependen del predio para infiltración y recarga, para la amortiguación del escurrimiento, para la regulación térmica y para el espacio libre de uso público que el sector no tiene. Incluye tanto a los barrios de ocupación informal ladera arriba por el oeste como a las urbanizaciones cerradas del norte y a la población del sector de riesgo hídrico crítico que recibe la descarga aguas abajo. · Población objetivo: los hogares de los barrios del extremo oeste del sector, en las cotas superiores sin red de agua, cloaca ni gas, que son los que hoy extraen leña, áridos y pastura del predio, los que disponen residuos en el perímetro y los que carecen por completo de espacio verde accesible. Al ejemplificar este mismo ítem con este escenario, la Guía toma un orden de magnitud de aproximadamente 4.000 habitantes con NBI de entre 40 % y 78 %; se adopta ese orden de magnitud como supuesto de trabajo y se declara que debe verificarse por radio censal en el F02. · Criterio de recorte: el proyecto no puede atender al 100 % de la población potencial, porque no controla las obras de red ni la política habitacional; se selecciona como objetivo al subconjunto que reúne dos condiciones simultáneas —mayor privación relativa y dependencia directa del predio— porque es el grupo sobre el cual la intervención produce cambio medible y, a la vez, el que hoy ejerce sobre el predio la presión de uso que la intervención debe reconvertir en uso legítimo y regulado. La población de aguas abajo se considera beneficiaria indirecta a través de la amortiguación del escurrimiento.", "H": "Se usa escala numérica de 0 a 1 para fuerza e importancia, la misma para ambas columnas. · Organismo provincial con competencia sobre tierras fiscales — institución pública — posición a favor con reservas, porque un destino de conservación reduce el valor de realización del inmueble — fuerza 1,0: es el titular del dominio y sin su decisión el proyecto no existe — importancia 1,0 — interés: definir un destino que no comprometa el patrimonio provincial. · Municipalidad de Salta, planeamiento urbano y espacios verdes — institución pública — a favor — fuerza 0,8: define zonificación, otorga habilitaciones y debería recibir el mantenimiento del espacio público — importancia 0,9 — interés: incorporar espacio verde en un ejido sin vacantes, sin asumir un costo operativo que no puede sostener. · Autoridad provincial de aplicación del régimen de bosques nativos — institución pública — a favor — fuerza 0,8: la categoría de conservación asignada al predio condiciona qué usos son admisibles — importancia 0,8 — interés: que el ordenamiento actualizado se cumpla y no se tramite una recategorización de conveniencia. · Organizaciones vecinales de los barrios del extremo oeste — sociedad civil — posición dividida: a favor del espacio público y del agua, en contra de cualquier restricción que les quite acceso a leña, pastura y suelo para vivienda — fuerza 0,7: la ocupación de hecho puede consolidarse más rápido que el proyecto — importancia 1,0: son la población objetivo y sin su acuerdo el control territorial no es sostenible — interés: vivienda, servicios y espacio de uso cotidiano. · Desarrolladores inmobiliarios y propietarios de las urbanizaciones cerradas del norte — sector privado — en contra de un destino de conservación y a favor de la habilitación residencial; a favor, en cambio, de un parque que valorice sus lotes — fuerza 0,8: capacidad de lobby y de financiamiento, en una ciudad sin suelo vacante — importancia 0,6 — interés: renta del suelo del borde. · Prestadora del servicio de agua y organismo provincial de recursos hídricos — empresa de servicios e institución pública — a favor — fuerza 0,6 — importancia 0,8 — interés: proteger la zona de recarga del acuífero y evitar que la descarga por el punto único agrave el sector de riesgo hídrico crítico. · Organizaciones ambientalistas y universidad — ONG ambiental e institución académica — a favor — fuerza 0,5: capacidad técnica y de instalación pública del tema, con posibilidad de judicializar un cambio de uso — importancia 0,7 — interés: conservación del último remanente continuo y del hábitat de las 82 especies de aves. · Advertencia de corrección: el listado incluye deliberadamente actores que pueden bloquear el proyecto; un cuadro que sólo enumere aliados está incompleto.", "I": "Titular del proyecto: el organismo provincial con competencia sobre las tierras fiscales, por ser el propietario del inmueble; sin un acto administrativo suyo que asigne destino de uso, ninguna otra decisión es ejecutable. · Figura propuesta: unidad de gestión de carácter interjurisdiccional, creada por convenio entre la provincia y la Municipalidad de Salta, con participación de la autoridad de aplicación de bosques nativos y del organismo de recursos hídricos, y un mecanismo formal de consulta a las organizaciones vecinales de la población objetivo. El escenario indica que existen instrumentos de concesión de uso, asociación público-privada y financiamiento internacional; en esta instancia se identifican como vías posibles de instrumentación, sin optar todavía por una. · Otras dependencias que condicionan la existencia del proyecto: la autoridad provincial de aplicación del régimen de bosques nativos, recientemente actualizado, que define los usos admisibles según la categoría asignada al predio; la autoridad ambiental provincial, para el procedimiento de evaluación de impacto ambiental; el organismo provincial de recursos hídricos, por tratarse de cabecera de cuenca y de zona de conducción de un acuífero; la Municipalidad de Salta, por zonificación, habilitación y eventual mantenimiento del espacio público; la autoridad vial nacional, por los accesos y las alcantarillas del corredor de la RN 9; la autoridad provincial de patrimonio cultural, que debe expedirse aunque la prospección no haya detectado evidencias en superficie; y el organismo financiador, en caso de crédito internacional. · Todos estos actores figuran también en el ítem H, y la coherencia entre ambos ítems es parte de lo que se corrige. · En esta instancia sólo se identifica ante quién habría que tramitar: los convenios, comodatos y autorizaciones corresponden al pasaje de perfil a prefactibilidad.", "J": "Se construye la matriz de cumplimiento legal seleccionando las normas que efectivamente condicionan la ejecución, no un listado exhaustivo de derecho ambiental. Las normas se nombran por su materia; el número, la versión vigente y el texto ordenado deben verificarse antes de citarlos en el informe. · Nacional: Constitución Nacional, artículo sobre ambiente sano; ley nacional de presupuestos mínimos de política ambiental (Ley General del Ambiente), que fija la evaluación de impacto ambiental, la participación ciudadana y el daño ambiental de incidencia colectiva; ley nacional de presupuestos mínimos de protección ambiental de los bosques nativos, que obliga a la provincia a mantener su ordenamiento territorial y regula desmontes y aprovechamientos; ley nacional de presupuestos mínimos para la gestión integral de residuos domiciliarios, aplicable a los microbasurales perimetrales; ley nacional de libre acceso a la información pública ambiental; Acuerdo de Escazú, en materia de acceso a la información, participación y justicia ambiental; normativa nacional sobre uso de la zona de camino y accesos en rutas nacionales, aplicable a los accesos y alcantarillas de la RN 9; normativa nacional de protección del patrimonio arqueológico y paleontológico. · Provincial de Salta: ley provincial de protección del medio ambiente y su régimen de evaluación de impacto ambiental y social; ordenamiento territorial de bosques nativos de la provincia, recientemente actualizado, que es la norma que define qué usos admite la categoría asignada al predio y que debe consultarse en su versión vigente y no en la citada por documentos anteriores; código de aguas provincial, por tratarse de cabecera de cuenca y zona de conducción de un acuífero; régimen provincial de tierras fiscales y de concesión de uso; ley provincial de manejo del fuego y normativa sobre quema de pastizales; ley provincial de áreas protegidas, si se optara por asignar al predio una figura de protección; normativa provincial de patrimonio cultural y arqueológico; normativa provincial de ordenamiento territorial y del área metropolitana. · Municipal: código de planeamiento urbano ambiental de la Municipalidad de Salta, con su zonificación de usos, indicadores urbanísticos y exigencias de cesión de espacio verde; ordenanzas de arbolado y espacios verdes; ordenanzas de higiene urbana y disposición de residuos; ordenanzas de habilitación de obras y de accesos. · Alerta específica de este escenario: el propio escenario advierte que el régimen de bosques nativos fue actualizado y que los municipios metropolitanos aplican normativas dispares; copiar el marco normativo de un documento previo sin verificar vigencia es el error que este ítem busca evitar. No se consignan números de ley ni de decreto que el equipo no haya verificado en el texto oficial.", "K": "Las causas se ordenan por niveles, leyendo de abajo hacia arriba hasta el problema central. · Causa 1 (institucional) — El predio fiscal no tiene acto administrativo que le asigne destino de uso ni organismo con la administración efectivamente a cargo: ninguna repartición ejerce control territorial sobre las 800 ha. Es la raíz que el escenario vuelve inevitable: mientras no se decide, se decide igual, por ocupación de hecho. · Causa 1.1 (técnica) — No existe información sistematizada del predio —límite catastral, cobertura, suelos, pendientes, hidrología y aptitud por sector— con el detalle necesario para fundamentar una zonificación interna o una restricción de uso. Sin información no hay acto administrativo defendible. · Causa 1.2 (institucional) — La planificación urbana del ejido y la gestión del patrimonio natural fiscal se tramitan por circuitos administrativos separados, y los municipios del área metropolitana aplican normativas de uso del suelo dispares sin un ámbito común de decisión sobre el borde. · Causa 1.3 (económica) — En una ciudad que agotó su suelo vacante interior, el valor de expectativa del suelo del borde orienta la decisión de destino hacia el uso residencial rentable y desalienta comprometer el predio a un uso que no genera renta directa. · Causa 1.A (técnica y operativa, derivada de la causa 1) — Ninguna cuadrilla ni guardia territorial interviene sobre las quemas de pastizal, la extracción de leña y áridos, el ingreso de ganado ni los microbasurales perimetrales. · Causa 2 (ambiental, derivada de la 1.A y de la 3) — Las quemas recurrentes, el pastoreo y la extracción impiden la regeneración de la cubierta leñosa joven sobre suelos erosionables con pendientes superiores al 30 % en la mitad alta del predio. · Causa 3 (social) — Los hogares de los barrios linderos obtienen del predio leña, áridos y pastura y disponen allí sus residuos, porque no acceden a gas de red, a materiales de construcción asequibles ni al servicio de recolección en las cotas superiores. · Causa 3.1 (económica) — La oferta habitacional formal no alcanza a los hogares de menores ingresos del sector, que resuelven su vivienda por autoconstrucción y ocupación informal ladera arriba. · Causa 4 (territorial, derivada de la 3.1) — El sector no dispone de espacio verde público —una única plaza reducida y en pendiente y un patio escolar insuficiente— ni de suelo urbano vacante alternativo, de modo que toda la demanda de expansión residencial y de espacio libre recae sobre el predio. · Verificación de derecha a izquierda: la 1.1, la 1.2 y la 1.3 explican por qué no hay acto administrativo (causa 1); la causa 1 explica por qué no hay control territorial (1.A); la 1.A y la 3 explican por qué no regenera la cubierta (causa 2); la 3.1 explica la causa 3 y la causa 4; y las causas 1, 2, 3 y 4 explican, cada una por una vía distinta, la degradación simultánea del soporte y de la habitabilidad.", "L": "Los efectos se ordenan de izquierda a derecha, del problema hacia sus consecuencias. · Efecto 1 (ambiental) — La recarga del acuífero de escasa dimensión que la cabecera de cuenca alimenta disminuye al reducirse la superficie con cubierta y capacidad de infiltración, en un sector cuyas cotas superiores ya se abastecen por camión cisterna. · Efecto 1.1 (económico, derivado del 1) — Se agrava la competencia por el agua entre los barrios del sector y se prolonga la dependencia del abastecimiento por camión cisterna, que es la preocupación que la propia población expresó al ser consultada. · Efecto 2 (técnico) — El escurrimiento superficial del sector aumenta en volumen y velocidad y descarga por las alcantarillas del corredor vial, único punto de salida hacia un cauce receptor revestido y sin capacidad ociosa. · Efecto 2.1 (territorial, derivado del 2) — El sector de riesgo hídrico crítico situado aguas abajo del punto de descarga queda más expuesto a anegamientos y a daños en viviendas e infraestructura durante los eventos de precipitación intensa. · Efecto 3 (ambiental) — Se contraen las poblaciones de las 32 especies leñosas nativas del bosque joven, dos de ellas con categoría de conservación desfavorable, y el hábitat de las 82 especies de aves y 6 de mamíferos registradas en el inventario. · Efecto 4 (social) — Los hogares del borde este quedan sin ámbito de encuentro ni de actividad al aire libre en condiciones seguras: la recreación se traslada a la calzada, a la banquina de la ruta y a los bordes del predio, con mayor carga térmica estival y exposición al humo de las quemas. · Efecto 5 (institucional) — El destino del predio queda determinado por la ocupación de hecho y no por una decisión de planificación, de modo que cada año se reduce el abanico de alternativas técnicamente posibles. · Efecto 6 (económico, derivado del 2.1 y del 5) — Crece el costo público futuro de reponer por obra las funciones que hoy presta el predio: retención del escurrimiento, ampliación de redes, forestación y adquisición de suelo para espacio verde. Es la respuesta a la pregunta orientadora sobre quién paga el resultado de no decidir: lo paga el erario, más caro y más tarde, y lo paga la población de aguas abajo con daño directo. · Verificación de izquierda a derecha: el efecto 1 produce el 1.1; el 2 produce el 2.1; el 2.1 y el 5 producen el 6.", "M": "Lectura encadenada del árbol, de las raíces al follaje. · La provincia es titular de unas 800 ha fiscales sobre las que no pesa ningún acto administrativo que les asigne destino, y ninguna repartición las administra. Esa indefinición tiene tres raíces: no hay información sistematizada del predio con la que fundamentar una restricción de uso; la planificación urbana y la gestión del patrimonio natural fiscal se tramitan por circuitos separados, entre municipios metropolitanos con normativas dispares; y el valor de expectativa del suelo, en una ciudad sin vacantes interiores, empuja la decisión hacia el uso rentable. · De la indefinición se sigue la ausencia de control territorial: nadie interviene sobre quemas, pastoreo, extracción de leña y áridos ni microbasurales. Sin control, y con hogares linderos que dependen del predio para leña, pastura y disposición de residuos porque no tienen gas, materiales asequibles ni recolección, la cubierta leñosa joven no regenera sobre suelos erosionables con pendientes superiores al 30 %. · En paralelo, la oferta habitacional formal no alcanza y empuja la ocupación informal ladera arriba, mientras el sector no tiene ni espacio verde público ni suelo vacante alternativo: toda la demanda de expansión y de espacio libre termina recayendo sobre el mismo predio. · Esas cuatro vías convergen en el tronco: el soporte ambiental del que dependen las condiciones de habitabilidad del borde este se degrada, pierde cobertura, infiltración y capacidad de retención, y sigue sin destino ni acceso público. · Hacia arriba, el tronco se abre en cinco ramas. Baja la recarga del acuífero, y con ella se agrava la competencia por el agua en un sector que ya se abastece por camión cisterna. Aumenta el escurrimiento hacia el punto único de descarga, y el sector de riesgo hídrico crítico de aguas abajo queda más expuesto a anegamientos. Se contrae la biodiversidad del último remanente continuo. La población queda sin espacio de uso cotidiano y la recreación se desplaza a la calzada y a la banquina de la ruta. Y el destino del predio termina fijado por ocupación de hecho, con lo que se pierden alternativas. Las dos últimas ramas se juntan en la copa: cada año que pasa, reponer por obra lo que el predio presta gratis cuesta más caro. · Advertencia metodológica: en esta instancia el árbol es un conjunto de hipótesis de trabajo. Cada vínculo —en particular el que une la pérdida de cobertura con el aumento del caudal pico— debe ponerse a prueba con estudios específicos al pasar a perfil y prefactibilidad.", "N": "Los medios son las causas expresadas como estados alcanzados, con la misma estructura jerárquica y sin verbos de acción. · Medio 1 — El predio fiscal cuenta con destino de uso asignado por acto administrativo y con un organismo que ejerce la administración y el control territorial de las 800 ha. · Medio 1.1 — El predio cuenta con información sistematizada —límite catastral, cobertura, suelos, pendientes, hidrología y aptitud por sector— con el detalle necesario para fundamentar su zonificación interna y las restricciones de uso. · Medio 1.2 — La planificación urbana del ejido y la gestión del patrimonio natural fiscal se resuelven en un mismo instrumento, con un ámbito metropolitano de decisión sobre el borde y criterios de uso del suelo armonizados entre municipios. · Medio 1.3 — La decisión sobre el destino del predio se adopta con criterios de aptitud y de interés público, con la valoración de los servicios ecosistémicos incorporada a la comparación económica. · Medio 1.A — Una guardería territorial y cuadrillas de manejo intervienen de manera regular sobre quemas, extracción, ingreso de ganado y microbasurales perimetrales. · Medio 2 — La cubierta leñosa joven regenera sobre los suelos erosionables y las pendientes superiores al 30 % de la mitad alta del predio, sin quemas, pastoreo ni extracción. · Medio 3 — Los hogares de los barrios linderos cubren sus necesidades de energía, materiales y disposición de residuos por fuera del predio, con acceso al servicio de recolección en las cotas superiores. · Medio 3.1 — Los hogares de menores ingresos del sector acceden a soluciones habitacionales formales y a lotes con servicios, sin necesidad de ocupar informalmente la ladera. · Medio 4 — El sector dispone de espacio verde público accesible y suficiente, y la demanda de expansión residencial se orienta a suelo apto previsto por la planificación. · Medios fuera del alcance del proyecto, declarados explícitamente: el 3.1 (política habitacional y regularización dominial) y el 1.2 en su componente metropolitana (armonización normativa entre municipios) exceden lo que una unidad de gestión de un predio puede resolver; se los mantiene en el árbol porque explican el problema, pero el proyecto no los asume como componentes y sí los incorpora como supuestos de la MML. La extensión de las redes de agua, cloaca y gas queda igualmente fuera del alcance, aunque el proyecto puede reducir la presión sobre el reservorio por la vía de conservar la zona de recarga.", "O": "Los fines son los efectos expresados como situaciones deseadas, conservando el mismo encadenamiento. · Fin 1 — La recarga del acuífero de escasa dimensión que la cabecera de cuenca alimenta se sostiene, con superficie de infiltración conservada en el predio del borde este. · Fin 1.1 (derivado del 1) — La competencia por el agua entre los barrios del sector se atenúa y se reduce la dependencia del abastecimiento por camión cisterna en las cotas superiores. · Fin 2 — El escurrimiento superficial del sector se retiene e infiltra dentro del predio y llega amortiguado a las alcantarillas del corredor vial, dentro de la capacidad del cauce receptor. · Fin 2.1 (derivado del 2) — El sector de riesgo hídrico crítico situado aguas abajo del punto de descarga reduce su exposición a anegamientos y a daños en viviendas e infraestructura. · Fin 3 — Las poblaciones de las 32 especies leñosas nativas, incluidas las dos con categoría de conservación desfavorable, y el hábitat de las 82 especies de aves y 6 de mamíferos se mantienen y recuperan en el predio. · Fin 4 — Los hogares del borde este disponen de un ámbito de encuentro y de actividad al aire libre en condiciones seguras, con sombra, menor carga térmica estival y sin exposición al humo de las quemas. · Fin 5 — El destino del predio resulta de una decisión de planificación explícita, que preserva el abanico de alternativas técnicamente posibles. · Fin 6 (derivado del 2.1 y del 5) — Se evita el costo público futuro de reponer por obra las funciones que el predio presta: retención del escurrimiento, ampliación de redes, forestación y adquisición de suelo para espacio verde. · Los fines 1.1, 2.1 y 6 son los más altos del árbol y son los que alimentan el nivel Fin de la EAP y de la MML. Cada fin tiene su efecto espejo en el ítem L: no hay fines agregados sin efecto correspondiente.", "P": "Problema central: el soporte ambiental del que dependen las condiciones de habitabilidad del borde este de la ciudad de Salta —el predio fiscal de unas 800 ha sobre la RN 9, último remanente continuo de vegetación nativa del sector— se degrada de manera progresiva: pierde cobertura leñosa, capacidad de infiltración y de retención del escurrimiento, y permanece sin destino de uso definido ni acceso público para la población que lo rodea. · Objetivo central, propósito o meta: el soporte ambiental del que dependen las condiciones de habitabilidad del borde este de la ciudad de Salta —el predio fiscal de unas 800 ha sobre la RN 9, último remanente continuo de vegetación nativa del sector— se conserva y recupera: mantiene su cobertura leñosa, su capacidad de infiltración y de retención del escurrimiento, y cuenta con destino de uso definido y con acceso público para la población que lo rodea. · Se conservan el mismo sujeto, las mismas variables y el mismo lugar: sólo cambia el signo. El alcance no se amplía al ejido ni al área metropolitana, aunque las causas lleguen hasta allí. El indicador del propósito es el mismo del ítem E, con el valor meta en lugar del valor de línea de base.", "Q": "El árbol de objetivos reproduce nodo por nodo la estructura del árbol de problemas, con medios abajo, meta en el tronco y fines arriba. · Base: los medios 1.1, 1.2 y 1.3 sostienen el medio 1; el medio 1 habilita el 1.A; el 1.A y el medio 3 sostienen el medio 2; el medio 3.1 sostiene el 3 y el 4; y los medios 1, 2, 3 y 4 confluyen en la meta. · Tronco: el soporte ambiental del borde este se conserva y recupera, con destino definido y acceso público. · Copa: de la meta se desprenden los fines 1, 2, 3, 4 y 5; el fin 1 lleva al 1.1, el 2 al 2.1, y el 2.1 junto con el 5 confluyen en el fin 6. · Medios sobre los que el proyecto puede actuar directamente, marcados en el diagrama: 1, 1.1, 1.A, 2 y 4. · Medios sobre los que el proyecto sólo puede incidir parcialmente: 1.2 y 1.3, mediante la participación en el ámbito metropolitano y la valoración económica de los servicios ecosistémicos. · Medios fuera del alcance, señalados con trama distinta: 3.1 y la porción del 3 que depende de la extensión de redes de gas y del servicio de recolección municipal. · Control de simetría: dieciocho nodos en el árbol de problemas, dieciocho en el de objetivos; ningún medio sin causa espejo y ningún fin sin efecto espejo. Si al dibujarlo apareciera un nodo de más o de menos, corresponde volver al ítem M antes de cerrar el Q.", "R": "Se parte de los medios más bajos del árbol y se pregunta qué habría que hacer para materializarlos. Las actividades dentro de cada estrategia son mutuamente excluyentes. · Estrategia 1 — Medio: el predio cuenta con destino asignado y con administración a cargo. Actividades: (A) plan de manejo y control territorial del predio, con zonificación por aptitud, guardería y clausura de accesos informales, sin obra ni apertura al uso público; (B) transferencia del predio a un esquema de urbanización planificada por asociación público-privada, con cesión de un porcentaje de la superficie para espacio verde. · Estrategia 2 — Medio: la base natural se conserva y las funciones hidrológicas se recuperan. Actividades: (C) reserva natural urbana de acceso restringido, con clausura perimetral y restauración pasiva; (D) parque periurbano de borde con zonificación por aptitud, que combina uso público intensivo en el tercio de menor pendiente y contacto con los barrios, restauración y conservación activa en la mitad alta, y obras de retención e infiltración del escurrimiento. · Estrategia 3 — Medio: los hogares linderos no dependen del predio y el sector dispone de servicios. Actividades: (E) programa de sustitución de leña, extensión del servicio de recolección y provisión de materiales de construcción a los barrios de las cotas superiores; (F) extensión de las redes de agua y cloaca a las cotas superiores. · Actividades descartadas por estar fuera del alcance: la F excede la competencia del titular del proyecto y el ámbito de actuación declarado, y además, ejecutada antes de definir el destino del predio, aceleraría la densificación sobre el borde; la B se descarta por incompatibilidad con la aptitud del sitio y con el régimen de bosques nativos. · Actividad seleccionada: la D, dentro de la estrategia 2. Es la única que interviene sobre el mismo objeto en el que el problema integra base natural y habitabilidad: zonifica las 800 ha según pendiente, suelo y cobertura, abre al uso público el sector de menor pendiente donde el impacto sobre la regeneración es menor y el contacto con los barrios es directo, mantiene la mitad alta —pendientes superiores al 30 %— bajo restauración y control, e incorpora las obras de retención e infiltración que amortiguan la descarga por el punto único de salida. La actividad A no se descarta por incorrecta sino por insuficiente: resuelve el control pero deja intacto el déficit de espacio público, y un control sin uso legítimo del predio es caro de sostener y políticamente frágil. La E se incorpora como línea de trabajo complementaria con la población objetivo, no como alternativa: por sí sola no define el destino del predio.", "S": "Estructura Analítica del Proyecto, de arriba hacia abajo. · Fin: contribuir a que el borde este de la ciudad de Salta sostenga sus condiciones de habitabilidad sobre una base natural conservada, con menor exposición a anegamientos en el sector de riesgo hídrico crítico de aguas abajo, recarga del acuífero sostenida y menor costo público futuro de reposición de funciones. · Propósito: el soporte ambiental del que dependen las condiciones de habitabilidad del borde este —el predio fiscal de unas 800 ha sobre la RN 9— se conserva y recupera, con destino de uso definido y acceso público para la población lindera. · Componentes, todos redactados como productos obtenidos: (1) parque periurbano de borde habilitado al uso público en el sector de menor pendiente, con accesos desde los barrios linderos; (2) sectores de restauración y de conservación del bosque nativo bajo manejo activo, con control de fuego, pastoreo y extracción implementado; (3) sistema de retención e infiltración del escurrimiento en operación dentro del predio; (4) régimen de administración del predio fiscal establecido, con zonificación por aptitud aprobada por acto administrativo y unidad de gestión conformada. · Actividad: ejecución del proyecto de inversión «parque periurbano de borde con restauración del bosque nativo y manejo del escurrimiento», que comprende el relevamiento y la sistematización de la información del predio, la zonificación por aptitud y su tramitación administrativa, el proyecto ejecutivo y la obra del parque y de las obras de retención, la restauración con especies nativas y el plan de manejo del fuego, la conformación de la unidad de gestión y de la guardería territorial, y el programa de uso público y de trabajo con los barrios linderos. · Control de redacción: las cuatro componentes están escritas como estados o productos logrados, no como acciones. «Restaurar el bosque» sería una actividad; «sectores de restauración bajo manejo activo» es la componente.", "T": "Matriz de Marco Lógico, en concordancia estricta con la EAP. · Fin. Resumen narrativo: el borde este de la ciudad de Salta sostiene sus condiciones de habitabilidad sobre una base natural conservada. Indicador: reducción del 30 % del caudal pico descargado por las alcantarillas del corredor vial hacia el cauce receptor revestido, medido en el punto único de salida del predio fiscal del borde este, al quinto año de operación, respecto del valor de línea de base relevado en el F02. Medio de verificación: serie de aforos y registros de nivel en la alcantarilla de salida, a cargo del organismo provincial de recursos hídricos con participación de la unidad de gestión; informe hidrológico anual publicado en el portal de la Municipalidad de Salta. Supuesto: no se habilitan nuevas urbanizaciones ni impermeabilizaciones aguas arriba que incrementen el escurrimiento por encima de lo previsto, y el régimen de precipitaciones no se aparta de la serie histórica considerada. · Propósito. Resumen narrativo: el soporte ambiental del que dependen las condiciones de habitabilidad del borde este se conserva y recupera, con destino de uso definido y acceso público. Indicador: cero hectáreas nuevas ocupadas o desmontadas dentro del predio y superficie con cobertura leñosa nativa igual o mayor a la del inventario forestal de línea de base, en las 800 ha del predio fiscal del borde este, al tercer año de ejecución; y al menos el 60 % de los hogares de los barrios linderos declara usar el parque una vez por mes o más, en el mismo plazo (meta adoptada como supuesto de diseño, a validar en el F02). Medio de verificación: monitoreo satelital anual con verificación de campo en parcelas permanentes, informado a la autoridad provincial de bosques nativos; encuesta anual de uso del espacio público en los barrios linderos, aplicada por la unidad de gestión y archivada en el expediente del proyecto. Supuesto: la autoridad de aplicación mantiene la categoría de conservación del predio en el ordenamiento territorial de bosques nativos y no se sanciona una recategorización que habilite el uso residencial. · Componentes. Resumen narrativo: parque periurbano habilitado, sectores de restauración y conservación bajo manejo activo, sistema de retención e infiltración en operación y régimen de administración establecido. Indicador: superficie de uso público habilitada equivalente al sector de menor pendiente del predio —se asume del orden del 10 % de las 800 ha, a verificar en el F02—, con al menos tres accesos desde los barrios linderos; 100 % del perímetro con control de ingreso de ganado y de extracción; obras de retención dimensionadas para el evento de diseño que fije el estudio hidrológico; acto administrativo de zonificación publicado; todo al segundo año de ejecución. Medio de verificación: actas de recepción de obra y planos conforme a obra; registro de intervenciones de la guardería territorial; boletín oficial de la provincia con el acto administrativo; informes trimestrales de la unidad de gestión. Supuesto: se mantiene la disponibilidad del financiamiento comprometido y no se producen conflictos dominiales que impidan materializar los accesos desde los barrios linderos. · Actividades. Resumen narrativo: relevamiento y sistematización de la información del predio, zonificación y tramitación administrativa, proyecto ejecutivo y obra, restauración y manejo del fuego, conformación de la unidad de gestión y de la guardería, y programa de uso público con los barrios linderos. Indicador: 100 % de las actividades del cronograma del primer bienio ejecutadas y certificadas, con presupuesto ejecutado dentro del ±10 % de lo previsto, en el predio fiscal del borde este, al cierre del segundo año. Medio de verificación: curva de avance físico-financiero de la unidad ejecutora, certificados de obra, rendiciones ante el organismo financiador y expediente administrativo del proyecto. Supuesto: los recursos se transfieren en los plazos previstos y los cambios de gestión municipal o provincial no interrumpen la continuidad de la unidad ejecutora. · Nota de coherencia: ninguno de los supuestos consignados es una tarea del proyecto. Contratar la guardería, dimensionar las obras o hacer la encuesta son actividades y están en la primera columna, no en la cuarta.", "U": "Lógica vertical, narrada de abajo hacia arriba: si se releva y sistematiza la información del predio, se aprueba la zonificación por aptitud, se ejecutan la obra del parque y las obras de retención, se restaura la mitad alta y se conforman la unidad de gestión y la guardería, entonces se obtienen las cuatro componentes: un parque habilitado al uso público, sectores de restauración y conservación bajo manejo activo, un sistema de retención e infiltración en operación y un régimen de administración establecido. Si esas cuatro componentes existen y se sostienen, entonces el soporte ambiental del borde este deja de degradarse, recupera cobertura e infiltración y pasa a tener destino definido y acceso público, que es el propósito. Y si el propósito se cumple, entonces baja el caudal pico que llega al punto único de descarga, se sostiene la recarga del acuífero y la población dispone de espacio de uso cotidiano: el borde este sostiene su habitabilidad sobre una base natural conservada, que es el fin. La cadena se sostiene porque en ningún eslabón se cambia de objeto: se interviene siempre sobre las mismas 800 ha. · Lógica horizontal, fila por fila. En la fila del fin, el indicador de caudal pico es evaluable con aforos en un punto único ya existente —la alcantarilla del corredor vial—, de modo que el medio de verificación es necesario y suficiente, aunque exige instalar el registro que hoy no existe. En la fila del propósito se usan dos indicadores porque el propósito tiene dos caras inseparables: la cobertura leñosa mide la base natural y la frecuencia de uso mide la habitabilidad; con uno solo, la fila no permitiría concluir sobre el logro del objetivo. En la fila de componentes, los medios de verificación son documentos que la propia ejecución genera —actas, planos, boletín oficial— y por lo tanto son verificables por un tercero. En la fila de actividades, la curva de avance físico-financiero permite calcular el indicador sin información adicional. · Lógica zigzag: las actividades más el supuesto de transferencia de recursos en plazo producen las componentes; las componentes más el supuesto de continuidad del financiamiento y de resolución dominial de los accesos producen el propósito; el propósito más el supuesto de que no se recategoriza el predio produce el fin. · Supuesto más frágil: que la autoridad de aplicación mantenga la categoría de conservación del predio y no se sancione una recategorización que habilite el uso residencial. Es el más frágil porque concentra la presión de todos los actores con mayor fuerza relativa del ítem H —el titular del dominio, que ve reducido el valor de realización, y los desarrolladores, que operan en una ciudad sin suelo vacante— y porque su ocurrencia no anula un resultado parcial: lo anula todo, ya que sin el predio no hay proyecto. La estrategia de mitigación no es un supuesto adicional sino una decisión de diseño: apoyar el propósito en un uso público masivo y visible, que crea una constituency que vuelve costoso revertir la decisión.", "V": "«Parque periurbano de borde con restauración del bosque nativo y manejo del escurrimiento en el predio fiscal del este de la ciudad de Salta». · Qué se hace: implantación de un parque periurbano con zonificación por aptitud, restauración de la cubierta nativa y obras de retención e infiltración. · Para qué: para conservar y recuperar el soporte ambiental del que dependen las condiciones de habitabilidad del sector. · Dónde: el predio fiscal de unas 800 ha sobre la RN 9, borde este del ejido de la ciudad de Salta. · Este nombre es distinto del nombre de fantasía del equipo del ítem A y acompañará al proyecto en los formularios F02, F03 y F04. No es un nombre publicitario: dice qué se hace, sobre qué y dónde."}, "eap": {"fin": "Contribuir a que el borde este de la ciudad de Salta sostenga sus condiciones de habitabilidad sobre una base natural conservada: menor exposición a anegamientos en el sector de riesgo hídrico crítico de aguas abajo, recarga del acuífero sostenida y menor costo público futuro de reposición de funciones.", "prop": "El soporte ambiental del que dependen las condiciones de habitabilidad del borde este de la ciudad de Salta —el predio fiscal de unas 800 ha sobre la RN 9— se conserva y recupera, con destino de uso definido y acceso público para la población lindera.", "comp": "(1) Parque periurbano de borde habilitado al uso público en el sector de menor pendiente, con accesos desde los barrios linderos · (2) Sectores de restauración y de conservación del bosque nativo bajo manejo activo, con control de fuego, pastoreo y extracción implementado · (3) Sistema de retención e infiltración del escurrimiento en operación dentro del predio · (4) Régimen de administración del predio fiscal establecido, con zonificación por aptitud aprobada por acto administrativo y unidad de gestión conformada.", "act": "Ejecución del proyecto de inversión «parque periurbano de borde con restauración del bosque nativo y manejo del escurrimiento»: relevamiento y sistematización de la información del predio; zonificación por aptitud y tramitación del acto administrativo de destino; proyecto ejecutivo y obra del parque y de las obras de retención e infiltración; restauración con especies nativas y plan de manejo del fuego; conformación de la unidad de gestión y de la guardería territorial; programa de uso público y de trabajo con los barrios linderos."}, "mml": {"fin": ["El borde este de la ciudad de Salta sostiene sus condiciones de habitabilidad sobre una base natural conservada: menor exposición a anegamientos aguas abajo, recarga del acuífero sostenida y menor costo público futuro de reposición de funciones.", "Reducción del 30 % del caudal pico descargado por las alcantarillas del corredor vial hacia el cauce receptor revestido, medido en el punto único de salida del predio fiscal del borde este de la ciudad de Salta, al quinto año de operación, respecto del valor de línea de base relevado en el F02.", "Serie de aforos y registros de nivel en la alcantarilla de salida, a cargo del organismo provincial de recursos hídricos con participación de la unidad de gestión del predio; informe hidrológico anual publicado en el portal de la Municipalidad de Salta.", "No se habilitan nuevas urbanizaciones ni impermeabilizaciones aguas arriba del predio que incrementen el escurrimiento por encima de lo previsto, y el régimen de precipitaciones no se aparta de la serie histórica considerada."], "prop": ["El soporte ambiental del que dependen las condiciones de habitabilidad del borde este de la ciudad de Salta —el predio fiscal de unas 800 ha sobre la RN 9— se conserva y recupera, con destino de uso definido y acceso público para la población lindera.", "Cero hectáreas nuevas ocupadas o desmontadas dentro del predio y superficie con cobertura leñosa nativa igual o mayor a la del inventario forestal de línea de base, en las 800 ha del predio fiscal del borde este, al tercer año de ejecución · al menos el 60 % de los hogares de los barrios linderos declara usar el parque una vez por mes o más, en el mismo plazo y lugar (meta adoptada como supuesto de diseño, a validar en el F02).", "Monitoreo satelital anual con verificación de campo en parcelas permanentes, informado a la autoridad provincial de aplicación del régimen de bosques nativos; encuesta anual de uso del espacio público en los barrios linderos, aplicada por la unidad de gestión y archivada en el expediente del proyecto.", "La autoridad de aplicación mantiene la categoría de conservación del predio en el ordenamiento territorial de bosques nativos y no se sanciona una recategorización que habilite el uso residencial del predio."], "comp": ["Parque periurbano habilitado al uso público en el sector de menor pendiente; sectores de restauración y conservación bajo manejo activo; sistema de retención e infiltración del escurrimiento en operación; régimen de administración del predio fiscal establecido con zonificación por aptitud aprobada.", "Superficie de uso público habilitada equivalente al sector de menor pendiente del predio —se asume del orden del 10 % de las 800 ha, a verificar en el F02—, con al menos tres accesos desde los barrios linderos; 100 % del perímetro con control de ingreso de ganado y de extracción; obras de retención dimensionadas para el evento de diseño que fije el estudio hidrológico; acto administrativo de zonificación publicado; todo en el predio fiscal del borde este, al segundo año de ejecución.", "Actas de recepción de obra y planos conforme a obra; registro de intervenciones de la guardería territorial; boletín oficial de la provincia con el acto administrativo de destino; informes trimestrales de la unidad de gestión, disponibles en el expediente del proyecto.", "Se mantiene la disponibilidad del financiamiento comprometido y no se producen conflictos dominiales en los barrios linderos que impidan materializar los accesos al parque."], "act": ["Relevamiento y sistematización de la información del predio; zonificación por aptitud y tramitación administrativa del destino; proyecto ejecutivo y obra del parque y de las obras de retención e infiltración; restauración con especies nativas y plan de manejo del fuego; conformación de la unidad de gestión y de la guardería territorial; programa de uso público y de trabajo con los barrios linderos.", "100 % de las actividades del cronograma del primer bienio ejecutadas y certificadas, con presupuesto ejecutado dentro del ±10 % de lo previsto, en el predio fiscal del borde este de la ciudad de Salta, al cierre del segundo año.", "Curva de avance físico-financiero de la unidad ejecutora; certificados de obra; rendiciones ante el organismo financiador; expediente administrativo del proyecto en la mesa de entradas del organismo provincial de tierras fiscales.", "Los recursos se transfieren en los plazos previstos y los cambios de gestión municipal o provincial no interrumpen la continuidad de la unidad ejecutora."]}, "alt": [{"id": "A", "med": "El predio fiscal cuenta con destino de uso asignado por acto administrativo y con un organismo que ejerce la administración y el control territorial de las 800 ha.", "act": "Plan de manejo y control territorial del predio: zonificación por aptitud, guardería, clausura de accesos informales y erradicación de microbasurales, sin obra ni apertura al uso público.", "ven": "Costo de inversión bajo y ejecución rápida; frena la ocupación de hecho y preserva el abanico de alternativas futuras; no requiere estudios hidráulicos ni proyecto ejecutivo de obra.", "des": "No modifica las condiciones de habitabilidad del borde este: la población sigue sin espacio verde accesible y sin razón para defender el predio. El control sin uso legítimo es caro de sostener, genera conflicto con los hogares que hoy extraen leña y pastura, y su continuidad depende de la voluntad política de cada gestión."}, {"id": "B", "med": "El predio fiscal cuenta con destino de uso asignado por acto administrativo y con un organismo que ejerce la administración y el control territorial de las 800 ha.", "act": "Transferencia del predio a un esquema de urbanización planificada por asociación público-privada, con cesión de un porcentaje de la superficie para espacio verde y para equipamiento.", "ven": "Financia su propia ejecución y genera recursos para el erario; aporta suelo con servicios en una ciudad que agotó su vacante interior y donde el 91 % de la expansión reciente fue residencial; ordena un frente que hoy avanza de manera informal.", "des": "Consume el último remanente continuo de vegetación nativa sobre cabecera de cuenca, zona de conducción del acuífero, suelos erosionables y pendientes superiores al 30 % en la mitad alta; incompatible con la cobertura sujeta al régimen provincial de bosques nativos; agrava el escurrimiento hacia un punto único de descarga que ya no tiene capacidad ociosa y que vierte sobre un sector de riesgo hídrico crítico."}, {"id": "C", "med": "La cubierta leñosa regenera y las funciones hidrológicas del predio se conservan.", "act": "Reserva natural urbana de acceso restringido, con clausura perimetral, restauración pasiva y monitoreo de fauna y flora.", "ven": "Máxima protección del bosque joven, de las 32 especies leñosas nativas —dos con conservación desfavorable— y del hábitat de las 82 especies de aves y 6 de mamíferos; conserva íntegra la superficie de infiltración de la cabecera de cuenca; costo de inversión moderado.", "des": "Deja intacto el déficit de espacio público del sector y traslada toda la presión de uso al perímetro, donde se concentran hoy los microbasurales; sin uso social el costo de vigilancia sobre 800 ha es alto y el apoyo político frágil; contradice la expectativa mayoritaria de la población consultada, que se manifestó a favor de un cambio de usos."}, {"id": "D", "med": "El sector dispone de espacio verde público accesible y suficiente sobre una base natural conservada, con el escurrimiento retenido e infiltrado dentro del predio.", "act": "Parque periurbano de borde con zonificación por aptitud: uso público intensivo en el tercio de menor pendiente y de contacto directo con los barrios linderos, restauración y conservación activa en la mitad alta con pendientes superiores al 30 %, y obras de retención e infiltración del escurrimiento distribuidas en el predio.", "ven": "Interviene sobre el único objeto en el que el problema integra base natural y habitabilidad, sin partirlo en dos proyectos; la zonificación por aptitud concentra el uso donde el impacto sobre la regeneración es menor y restringe la mitad alta erosionable; el uso público masivo crea la base social que vuelve costoso revertir la decisión de destino; compatible con la capacidad de acogida visual media de la cuenca observada desde la ruta y con la ausencia de hallazgos arqueológicos en superficie; responde a la vez a los tres reparos que expresó la población consultada —áreas verdes, escurrimiento y agua—.", "des": "Costo de inversión y, sobre todo, de mantenimiento elevado para un municipio; requiere una unidad de gestión interjurisdiccional que hoy no existe y un acuerdo entre provincia y municipio; el uso público mal zonificado o sin control puede agravar la erosión y el riesgo de incendio; exige estudios hidrológicos, de suelos y de pendientes previos que hoy no están disponibles."}, {"id": "E", "med": "Los hogares de los barrios linderos cubren sus necesidades de energía, materiales y disposición de residuos por fuera del predio.", "act": "Programa de sustitución de leña, extensión del servicio de recolección a las cotas superiores y provisión de materiales de construcción a los hogares de los barrios del extremo oeste.", "ven": "Ataca una causa directa y verificable de la degradación —la extracción y el volcado— y actúa sobre la población objetivo con beneficio inmediato; costo relativamente bajo y alta aceptación social.", "des": "No define el destino del predio: la indefinición dominial, la presión inmobiliaria y la ocupación de hecho continúan. Por sí sola no modifica el escurrimiento ni el déficit de espacio verde, y su efecto se revierte apenas se interrumpe el financiamiento del programa. Se conserva como línea complementaria del proyecto, no como alternativa."}, {"id": "F", "med": "El borde este cuenta con infraestructura sanitaria completa y el vuelco domiciliario no compromete el reservorio del que se extrae agua.", "act": "Extensión de las redes de agua y cloaca a las cotas superiores del sector.", "ven": "Elimina el vuelco a pozo absorbente sobre el mismo reservorio del que se extrae agua y suprime la dependencia del camión cisterna; mejora de manera directa las condiciones de habitabilidad.", "des": "Excede la competencia del titular del proyecto y el ámbito de actuación declarado; su costo es de otra escala. Además, ejecutada antes de definir el destino del predio, habilita y acelera la densificación sobre el borde, de modo que agravaría el problema central en lugar de resolverlo. Se descarta por estar fuera del alcance y se declara el criterio."}], "altSel": "D", "altJus": "Los criterios de comparación se fijaron antes de mirar las alternativas, y son cinco: consistencia con la aptitud física del sitio (pendiente, erosionabilidad, condición de cabecera de cuenca y de zona de conducción del acuífero); compatibilidad con el marco normativo vigente, en particular con el régimen provincial de bosques nativos recientemente actualizado; capacidad de atacar simultáneamente las dos manifestaciones del problema central —degradación de la base natural y deterioro de la habitabilidad— sin partirlo en dos proyectos; sostenibilidad del arreglo de gestión y del costo operativo una vez terminada la inversión; y correspondencia con lo que la población consultada expresó, a favor de un cambio de usos pero con reparos por áreas verdes, escurrimiento y competencia por el agua. · Contra esos criterios, B queda descartada de entrada: es la única que tiene retorno económico directo, pero falla en aptitud del sitio y en marco normativo, y agrava el efecto de mayor consecuencia sobre terceros —la descarga sobre el sector de riesgo hídrico crítico—. La pregunta orientadora del escenario plantea justamente el dilema entre mayor retorno económico y mayor conservación de bosque y agua; la respuesta del equipo es que ese dilema no se resuelve por preferencia sino por aptitud: en pendientes superiores al 30 %, sobre suelos erosionables, en cabecera de cuenca y con un único punto de descarga sin capacidad ociosa, la alternativa rentable transfiere su costo a la población de aguas abajo y al erario, y la comparación deja de ser válida si esos costos no se internalizan en la evaluación. · A y C son técnicamente correctas y ambas conservan la base natural, pero fallan en el tercer criterio: resuelven media situación problemática y dejan la otra media exactamente donde estaba, con el agravante de que un predio conservado y cerrado, en un sector sin espacios verdes y con presión habitacional, es un predio que la sociedad no defiende. E y F fallan en el mismo criterio por el lado inverso: mejoran la habitabilidad sin definir el destino del predio, y F además está fuera del alcance. · Se selecciona D porque es la única que cumple los cinco criterios a la vez. Su punto débil es el cuarto —el costo de mantenimiento y la necesidad de una unidad de gestión interjurisdiccional—, y por eso la componente 4 de la EAP es el régimen de administración: sin ella, la obra se degrada en pocos años y el proyecto reproduce el problema que vino a resolver. La ejecución corresponde a un titular público, el organismo provincial de tierras fiscales junto con la Municipalidad de Salta, con financiamiento internacional o esquema de asociación público-privada acotado a la operación de servicios dentro del parque y nunca al destino del suelo, distinción que debe quedar expresa en el F02.", "corr": ["Problema central partido en dos: cualquier enunciado con la forma «deterioro ambiental del predio y falta de espacios verdes para la población» son dos problemas unidos por una conjunción. El árbol resultante se parte también, con dos troncos y causas que no confluyen. Exigir que el enunciado nombre un solo sujeto afectado y que la habitabilidad aparezca como función del soporte, no como problema paralelo.", "Problema central escrito como carencia de la solución: «falta de un parque en el borde este», «ausencia de un plan de manejo», «no hay espacios verdes públicos». En este escenario es el error más probable porque el déficit de espacio verde está explícitamente documentado y se confunde con el problema. La consecuencia es que el ítem R queda vacío: si el problema es la falta del parque, la única alternativa posible es el parque. El error inverso es igual de frecuente: tomar un uso informal visible —volcado de residuos, quema, extracción de leña— como problema central. Son causas de segundo nivel derivadas de que el predio no tiene destino, gestión ni control visible, no el tronco del árbol.", "Escala desbordada: problemas del tipo «crecimiento urbano desordenado del área metropolitana de Salta» o «déficit habitacional de la ciudad». El escenario advierte el riesgo de escribir un problema tan grande que ningún proyecto pueda resolverlo. Verificar que el propósito del ítem P conserve la misma localización que el problema del ítem D y no salte del predio al ejido.", "Árbol con causas de una sola dimensión, casi siempre técnicas o ambientales. En este escenario la raíz principal es institucional —no hay acto administrativo ni organismo a cargo— y hay causas económicas (valor de expectativa del suelo, oferta habitacional insuficiente), sociales (dependencia de los hogares linderos respecto del predio) y territoriales (ejido sin vacante interior). Un árbol sin la dimensión institucional no llegó a la raíz.", "Cifras inventadas con apariencia de dato oficial: superficies exactas del catastro, caudales, población por barrio, presupuestos o metros cuadrados verdes por habitante que no están en el escenario. El escenario declara que la información es deliberadamente incompleta y exige explicitar los supuestos: todo valor no aportado debe figurar como supuesto numerado, con su criterio y con la indicación de verificarlo en el F02.", "Supuestos de la MML que en realidad son tareas del proyecto: «se conforma la unidad de gestión», «se realizan los estudios hidrológicos», «se capacita a los vecinos». Todo eso está bajo control del proyecto y pertenece a la primera columna. El supuesto genuino de este escenario es la no recategorización del predio en el ordenamiento de bosques nativos y la no habilitación de urbanizaciones aguas arriba."]}, "10": {"n": 10, "pc": "Las tres corrientes de residuos del establecimiento porcino —líquida, sólida y gaseosa— se disponen sin tratamiento adecuado y de manera desacoplada entre sí, afectando el suelo, el agua subterránea y el aire del predio rural de unas 120 ha del Valle de Lerma, en el departamento Rosario de Lerma.", "pcjus": "El escenario describe un sistema único con tres salidas acopladas: el purín que se acumula en fosas y piletas, la fracción sólida con mortandad y placentas que debería estabilizarse en la playa de compostaje, y los gases —amoníaco, sulfuro de hidrógeno y metano— que se liberan desde esas mismas fosas y piletas. Cualquier enunciado que tome una sola corriente deja fuera el mecanismo que explica el caso, porque lo que se retira de una reaparece en las otras dos: por eso el problema central tiene que nombrar las tres y el desacople entre ellas. Se descartó «falta de una planta de tratamiento de efluentes» porque enuncia la solución, y una solución parcial, condicionando el análisis de alternativas antes de empezar. Se descartó «contaminación del establecimiento porcino» por no decir qué se contamina, dónde ni con qué magnitud, lo que impide construir un indicador. Se descartó también «los vecinos se quejan por el olor», que es el efecto más visible y por eso se cuela como problema: el olor es la señal de la emisión gaseosa, no la situación a revertir. La formulación adoptada conserva sujeto afectado (el ambiente receptor del predio y de su entorno inmediato), atributo negativo (disposición sin tratamiento adecuado y desacoplada) y localización (predio de unas 120 ha en Rosario de Lerma, Valle de Lerma), y es mensurable en las tres corrientes a la vez.", "objc": "Las tres corrientes de residuos del establecimiento porcino —líquida, sólida y gaseosa— se gestionan de manera integrada y con tratamiento adecuado, preservando el suelo, el agua subterránea y el aire del predio rural de unas 120 ha del Valle de Lerma, en el departamento Rosario de Lerma.", "sit": [{"id": "s1", "t": "Las tres corrientes de residuos del establecimiento porcino —líquida, sólida y gaseosa— se disponen sin tratamiento adecuado y de manera desacoplada entre sí, afectando el suelo, el agua subterránea y el aire del predio rural de unas 120 ha del Valle de Lerma, en el departamento Rosario de Lerma.", "k": "p", "d": "amb"}, {"id": "s2", "t": "El manejo se decide corriente por corriente: cada decisión sobre el efluente, el sólido o el gas se toma sin un balance de masa que muestre cómo modifica el volumen, la composición y el valor de las otras dos.", "k": "c", "d": "tec"}, {"id": "s3", "t": "Las fosas bajo el piso enrejillado no drenan por completo y una de las piletas tiene el talud roto con pérdida al terreno natural: las instalaciones de captación y almacenamiento operan fuera de sus condiciones de diseño.", "k": "c", "d": "tec"}, {"id": "s4", "t": "La playa de compostaje de 1.080 m² opera al 30 % de su capacidad y sin control de temperatura ni rotación de pilas, de modo que la fracción sólida separable, la mortandad y las placentas no completan su estabilización.", "k": "c", "d": "tec"}, {"id": "s5", "t": "La digestión anaerobia del purín ocurre de manera espontánea en fosas y piletas abiertas, sin confinamiento ni captación del biogás que allí se genera.", "k": "c", "d": "tec"}, {"id": "s6", "t": "El predio no tiene superficie afectada a la aplicación agronómica de purines ni un plan de balance de nutrientes con ventanas de aplicación compatibles con el régimen de lluvias, de modo que la corriente líquida no tiene destino final definido dentro de las 120 ha.", "k": "c", "d": "ter"}, {"id": "s7", "t": "El volumen de efluente generado no se cuantifica ni su composición se analiza de manera sistemática, y el agua de bebida —estimada en 18 litros por animal y por día— se mezcla con el agua de lavado y con la deyección sin segregación previa: casi todo lo que ingresa al predio sale como corriente líquida a gestionar, con una carga que se desconoce.", "k": "c", "d": "tec"}, {"id": "s8", "t": "El emplazamiento de fosas, piletas y playa no fue definido sobre una caracterización hidrogeológica del sitio, porque no existe cartografía provincial de acuíferos someros ni registro de pozos de agua potable en el área y el establecimiento tampoco la construyó.", "k": "c", "d": "amb"}, {"id": "s9", "t": "Las trece personas que trabajan en el establecimiento no tienen responsabilidades asignadas ni procedimientos escritos para la operación de fosas, piletas y playa de compostaje: el manejo de los residuos depende de la disponibilidad diaria de cada tarea productiva.", "k": "c", "d": "soc"}, {"id": "s10", "t": "Para el titular, el costo de disponer sin tratar es menor que el de tratar: la carga ambiental no está internalizada en la estructura de costos del establecimiento y la inversión en gestión de residuos no compite con las inversiones en genética, alimento e instalaciones productivas.", "k": "c", "d": "eco"}, {"id": "s11", "t": "No existe norma provincial que regule la actividad pecuaria intensiva ni protocolo de uso agronómico de purines, y el control externo se activa recién en la instancia de renovación del certificado de aptitud ambiental: no hay estándar de referencia ni consecuencia oportuna del incumplimiento.", "k": "c", "d": "ins"}, {"id": "s12", "t": "En los pozos de monitoreo propios del establecimiento se detectan coliformes por encima de los valores admisibles: la napa somera bajo el predio está recibiendo carga fecal.", "k": "e", "d": "amb"}, {"id": "s13", "t": "El agua de consumo del establecimiento y la de las viviendas dispersas del entorno queda sometida a un riesgo sanitario que hoy no puede acotarse, porque no hay registro de pozos ni cartografía de acuíferos someros que permita saber hasta dónde llega la pluma.", "k": "e", "d": "soc"}, {"id": "s14", "t": "Las emisiones de amoníaco y de sulfuro de hidrógeno provenientes de fosas y piletas superan el nivel de molestia en el entorno inmediato del establecimiento.", "k": "e", "d": "amb"}, {"id": "s15", "t": "El vecindario convive de manera sostenida con el olor y la licencia social de operación del establecimiento se deteriora, con un conflicto latente que todavía no se formalizó como denuncia.", "k": "e", "d": "soc"}, {"id": "s16", "t": "Las trece personas que trabajan en el establecimiento están expuestas de manera crónica a amoníaco y sulfuro de hidrógeno en las naves y en el entorno de las fosas.", "k": "e", "d": "soc"}, {"id": "s17", "t": "El metano de la digestión anaerobia espontánea se libera a la atmósfera mientras el establecimiento compra gas para calefacción, y los 1.080 m² de playa de compostaje permanecen mayoritariamente ociosos: el titular sostiene un costo operativo que sus propias corrientes de residuos podrían cubrir.", "k": "e", "d": "eco"}, {"id": "s18", "t": "El expediente de renovación del certificado de aptitud ambiental acumula observaciones de la autoridad y la continuidad de la operación del establecimiento queda sujeta a condicionamientos.", "k": "e", "d": "ins"}], "lnk": [{"a": "s2", "b": "s1"}, {"a": "s3", "b": "s1"}, {"a": "s4", "b": "s1"}, {"a": "s5", "b": "s1"}, {"a": "s6", "b": "s1"}, {"a": "s7", "b": "s2"}, {"a": "s7", "b": "s3"}, {"a": "s7", "b": "s4"}, {"a": "s7", "b": "s6"}, {"a": "s8", "b": "s3"}, {"a": "s9", "b": "s3"}, {"a": "s9", "b": "s4"}, {"a": "s10", "b": "s3"}, {"a": "s10", "b": "s4"}, {"a": "s10", "b": "s5"}, {"a": "s10", "b": "s7"}, {"a": "s10", "b": "s9"}, {"a": "s11", "b": "s10"}, {"a": "s11", "b": "s6"}, {"a": "s11", "b": "s8"}, {"a": "s1", "b": "s12"}, {"a": "s1", "b": "s14"}, {"a": "s1", "b": "s17"}, {"a": "s1", "b": "s18"}, {"a": "s12", "b": "s13"}, {"a": "s12", "b": "s18"}, {"a": "s14", "b": "s15"}, {"a": "s14", "b": "s16"}, {"a": "s15", "b": "s18"}], "obj": {"s1": "Las tres corrientes de residuos del establecimiento porcino —líquida, sólida y gaseosa— se gestionan de manera integrada y con tratamiento adecuado, preservando el suelo, el agua subterránea y el aire del predio rural de unas 120 ha del Valle de Lerma, en el departamento Rosario de Lerma.", "s2": "El manejo de las tres corrientes se decide sobre un balance de masa único, que muestra cómo cada decisión sobre el efluente, el sólido o el gas modifica el volumen, la composición y el valor de las otras dos.", "s3": "Las fosas bajo el piso enrejillado drenan por completo y las piletas conservan su integridad estructural y su impermeabilización: las instalaciones de captación y almacenamiento operan dentro de sus condiciones de diseño.", "s4": "La playa de compostaje de 1.080 m² opera a plena capacidad, con control de temperatura y rotación de pilas, y estabiliza la fracción sólida separable, la mortandad y las placentas.", "s5": "La digestión anaerobia del purín ocurre en un reactor confinado, con captación del biogás generado.", "s6": "El predio cuenta con superficie afectada a la aplicación agronómica de purines y con un plan de balance de nutrientes y ventanas de aplicación compatibles con el régimen de lluvias: la corriente líquida tiene destino final definido dentro de las 120 ha.", "s7": "El volumen de efluente generado se cuantifica y su composición se analiza de manera sistemática, y el agua de bebida se segrega del agua de lavado y de la deyección: la carga real de cada corriente es conocida y las instalaciones se dimensionan contra ella.", "s8": "El emplazamiento de fosas, piletas y playa se define sobre una caracterización hidrogeológica propia del sitio, que incluye profundidad y vulnerabilidad de la napa somera y relevamiento de los pozos del entorno.", "s9": "Las trece personas que trabajan en el establecimiento tienen responsabilidades asignadas y procedimientos escritos para la operación de fosas, piletas, reactor y playa de compostaje.", "s10": "Para el titular, el costo de gestionar correctamente las tres corrientes es menor que el de no hacerlo, porque la energía y la enmienda recuperadas y el riesgo regulatorio evitado están internalizados en la estructura de costos del establecimiento.", "s11": "El establecimiento cuenta con un estándar de referencia exigible —protocolo propio de uso agronómico de purines y condiciones expresas en el certificado de aptitud ambiental— y con un régimen de autocontrol y control externo de frecuencia definida.", "s12": "Los pozos de monitoreo propios del establecimiento registran coliformes dentro de los valores admisibles: la napa somera bajo el predio no recibe carga fecal.", "s13": "El agua de consumo del establecimiento y la de las viviendas dispersas del entorno tiene un riesgo sanitario acotado y verificable, sostenido en el relevamiento de pozos y en la caracterización de la napa somera del área.", "s14": "Las emisiones de amoníaco y de sulfuro de hidrógeno del manejo de residuos se mantienen por debajo del nivel de molestia en el entorno inmediato del establecimiento.", "s15": "El vecindario convive con la operación del establecimiento sin percibir molestia y la licencia social de operación se sostiene.", "s16": "Las trece personas que trabajan en el establecimiento operan con exposición a amoníaco y sulfuro de hidrógeno dentro de los niveles admisibles.", "s17": "El metano generado se captura y sustituye el gas que hoy se compra para calefacción, y los 1.080 m² de playa de compostaje producen en
