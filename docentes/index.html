l material acopiado y cierre y restitución del sector de piletas de contingencia de la Batería Puesto Guardián, en cuatro etapas: caracterización y acuerdo de estándar; segregación y tratamiento biológico en el sector autorizado de residuos peligrosos; transporte y disposición de la fracción no tratable en operador habilitado; cierre de las estructuras y restitución morfológica y edáfica del sector."}, "mml": {"fin": ["Contribuir a la recuperación de la aptitud productiva del suelo y a la eliminación del riesgo sobre el agua subterránea en el sector de piletas de la Batería Puesto Guardián, con el pasivo dado de baja ante la autoridad de aplicación.", "Al menos 4.000 m² del sector de piletas habilitados para uso agropecuario sin restricción, en la Batería Puesto Guardián, departamento Orán, a los 12 meses de emitida el acta de cierre.", "Acta de cierre emitida por la autoridad ambiental provincial y relevamiento predial de superficie en producción, archivados en el legajo ambiental del área y disponibles ante la autoridad.", "El propietario del establecimiento sostiene el uso agropecuario previsto para el sector y no se producen nuevas contingencias hidrocarburíferas en la batería que vuelvan a afectarlo."], "prop": ["Las dos piletas de contingencia de la Batería Puesto Guardián se encuentran sin material acopiado, cerradas y restituidas conforme al estándar acordado con la autoridad, y el sector que ocupan está reincorporado al uso productivo del establecimiento.", "100 % del material acopiado retirado de las dos piletas y 0 estructuras fuera de servicio en el sector, con los parámetros de hidrocarburos totales y de conductividad eléctrica del suelo dentro de los valores del estándar de cierre acordado, en la Batería Puesto Guardián, a los 24 meses de iniciado el proyecto.", "Informe final de remediación con analíticas de laboratorio acreditado y relevamiento topográfico final, aprobado por la autoridad ambiental provincial y archivado en el legajo ambiental del área.", "La autoridad de aplicación aprueba el estándar de cierre acordado en la primera etapa y lo mantiene estable durante toda la ejecución del proyecto."], "comp": ["Sector caracterizado y estándar de cierre acordado; material hidrocarburado tratado y fracción salina no tratable dispuesta en operador habilitado; dos estructuras cerradas y sector restituido morfológica y edáficamente; acuerdo de uso futuro suscripto y antecedentes del sitio sistematizados.", "100 % del volumen caracterizado en la etapa inicial tratado o dispuesto con verificación analítica, y 2 estructuras cerradas y restituidas, en el sector de piletas de la Batería Puesto Guardián, a los 18 meses de iniciado el proyecto.", "Registro de operación del sector autorizado de tratamiento de residuos peligrosos, manifiestos de transporte y certificados de disposición final del operador habilitado, informes de caracterización de laboratorio acreditado y acta de conformidad del propietario sobre el uso futuro del sector.", "El régimen de precipitaciones del período permite sostener la actividad biológica sin anegamientos prolongados del sector, y los operadores habilitados de transporte y disposición mantienen disponibilidad y capacidad para recibir la fracción no tratable."], "act": ["Proyecto de tratamiento biológico in situ del material acopiado y cierre y restitución del sector de piletas de contingencia de la Batería Puesto Guardián, ejecutado en cuatro etapas: caracterización y acuerdo de estándar, segregación y tratamiento, disposición de la fracción no tratable, y cierre y restitución.", "4 etapas ejecutadas con 100 % de avance certificado, en el sector de piletas de la Batería Puesto Guardián, a los 24 meses de iniciado el proyecto.", "Certificados de avance de obra y de servicios, libro ambiental del proyecto y actas de inspección de la autoridad, disponibles en el legajo del área.", "Se mantienen vigentes la autorización provincial del sector de tratamiento de residuos peligrosos dentro de la batería y el acceso al predio otorgado por el propietario del establecimiento."]}, "alt": [{"id": "A", "med": "Criterio de cierre acordado con la autoridad, con parámetros de verificación y uso posterior definidos (medio 2), y monitoreos que cubren el perfil de suelo y el acuífero (medio 1.1).", "act": "Programa de caracterización ambiental del sector de piletas —volumen y tipificación del material por pileta, perfil de suelo bajo la pileta no impermeabilizada y calidad del acuífero somero— y acuerdo del estándar de sitio remediado con la autoridad de aplicación.", "ven": "Costo bajo respecto de cualquier alternativa de tratamiento, plazo corto, y es la única que habilita técnicamente a las demás: sin volumen ni caracterización, ninguna alternativa puede dimensionarse ni costearse. Deja establecido el criterio de finalización que hoy no existe.", "des": "Por sí sola no remueve un solo metro cúbico de material ni cierra ninguna estructura: el pasivo y todos los efectos del árbol permanecen. No puede constituir el proyecto, sino su primera etapa."}, {"id": "B", "med": "Material acopiado con volumen determinado, caracterización y destino de tratamiento definido (medio 1), y estructuras cerradas y sector restituido.", "act": "Tratamiento biológico in situ del material hidrocarburado mediante biopilas o landfarming en el sector de tratamiento de residuos peligrosos ya autorizado dentro de la batería, con segregación y disposición externa de la fracción salina no tratable, seguido del cierre de ambas estructuras y la restitución morfológica y edáfica del sector.", "ven": "Aprovecha una capacidad ya autorizada dentro del predio, lo que reduce costo y tiempo de gestión; minimiza el transporte de residuos peligrosos por caminos rurales y el riesgo asociado; deja el sector sin restricción de uso, que es la condición para la ampliación agropecuaria pretendida; y trata el material en lugar de trasladar el pasivo a un tercero.", "des": "Requiere plazos largos y condiciones climáticas favorables; la fracción salina no se degrada biológicamente y obliga igual a una disposición externa parcial; exige control analítico sostenido y puede generar resistencia en los vecinos por tratarse material dentro del predio."}, {"id": "C", "med": "Material acopiado con destino definido (medio 1) y estructuras cerradas y sector restituido.", "act": "Retiro y disposición externa de la totalidad del material de ambas piletas en operador habilitado, con relleno, restitución morfológica y revegetación del sector.", "ven": "Plazo corto y resultado verificable con manifiestos y certificados; libera el sector rápidamente y no depende de condiciones climáticas ni de la eficiencia de un proceso biológico.", "des": "Costo significativamente mayor; transfiere el pasivo a un tercero y a otro territorio en lugar de tratarlo; genera un tránsito intenso de camiones con residuos peligrosos por caminos rurales del departamento; y desaprovecha la autorización de tratamiento ya obtenida dentro de la batería."}, {"id": "D", "med": "Estructuras cerradas (medio 1.2, material confinado sin contacto con el suelo natural).", "act": "Confinamiento in situ del material mediante encapsulado con barrera basal y cobertura impermeable, con restricción registral de uso sobre el sector y monitoreo posterior de largo plazo.", "ven": "Es la alternativa de menor costo inicial y menor plazo, y elimina el contacto directo del material con el ambiente sin movilizarlo.", "des": "El pasivo permanece físicamente en el sitio y exige control y monitoreo por tiempo indefinido; deja una restricción de uso sobre el sector que es incompatible con la ampliación agropecuaria pretendida por el propietario; y no responde a la exigencia de restauración en su sentido pleno, por lo que difícilmente obtenga acta de cierre sin condicionamientos."}, {"id": "E", "med": "Destino futuro del sector definido y consensuado (medio 3) e información del sitio sistematizada y disponible (medio 3.2).", "act": "Acuerdo de compatibilidad de usos y zonificación interna del establecimiento entre la empresa operadora y el propietario, con expediente público de antecedentes del sitio accesible a la población vecina.", "ven": "Costo muy bajo, resuelve la causa territorial y social del árbol y define el uso posterior que determina el nivel de remediación exigible; mejora la licencia social de cualquier intervención.", "des": "No actúa sobre el material acopiado ni sobre las estructuras, de modo que el problema central persiste íntegro. Es condición de coherencia del proyecto, no un proyecto en sí."}], "altSel": "B", "altJus": "Se selecciona la alternativa B, incorporando la A como primera etapa condicionante y la E como componente de acuerdo y comunicación. Los criterios de comparación aplicados fueron cinco: compatibilidad con el uso futuro pretendido, costo total, plazo, riesgo transferido a terceros y aprovechamiento de las capacidades ya autorizadas en el sitio. Por compatibilidad con el uso futuro, la D queda descartada de entrada: un encapsulado con restricción registral es incompatible con la ampliación de la superficie agrícola que el propietario pretende, que es el fin del árbol de objetivos, y además deja un pasivo bajo control perpetuo. Entre B y C la diferencia decisiva no es el plazo —donde C es superior— sino el costo y el destino del pasivo: C transfiere el material a otro territorio y multiplica el tránsito de residuos peligrosos por caminos rurales, mientras que B trata la fracción hidrocarburada dentro de un sector que la provincia ya autorizó para eso, lo que reduce costo de gestión, riesgo de transporte y tiempo de tramitación. B no es una alternativa pura: reconoce que el agua de formación de alto contenido salino no se degrada biológicamente y prevé disposición externa de esa fracción, de modo que incorpora lo mejor de C donde C es imprescindible. Las alternativas A y E no compiten con B como proyecto, porque ninguna de las dos remueve material ni cierra estructuras; se integran como etapa inicial y como componente. La selección queda condicionada a un resultado de la etapa A: si la caracterización mostrara que la fracción tratable biológicamente es minoritaria frente a la fracción salina, o que el suelo bajo la pileta no impermeabilizada está afectado a profundidades que el tratamiento in situ no alcanza, corresponde volver sobre esta comparación y reevaluar C. Ese condicionamiento se declara expresamente y no se disimula: es el modo honesto de decidir con la información que hoy existe.", "corr": ["Que el problema central sea el descontrol del pozo MdT 14 de 2007 o \"el derrame de petróleo\". Es el error más caro de este escenario: el incidente fue controlado y el sector saneado, de modo que es un hecho del pasado y entra al árbol como causa remota, nunca como problema central. Si el tronco es el accidente, todo el árbol queda mal orientado y las alternativas apuntan a una emergencia que ya terminó.", "Que el problema esté enunciado como \"falta de una planta de tratamiento de suelos\", \"falta de un plan de cierre\" o \"ausencia de remediación\". Además de ser una solución disfrazada de problema, en este caso es prematuro: nadie sabe todavía qué volumen ni qué tipo de material hay que tratar, y el enunciado ya condicionaría el análisis de alternativas.", "Que aparezcan cifras de concentración de hidrocarburos totales, de conductividad eléctrica, de volumen acopiado, de profundidad de napa o de costos con apariencia de dato oficial. El escenario sólo aporta dimensiones geométricas (50 × 30 m con 1,5 a 2,5 m de profundidad, y 50 × 50 × 3,5 m) y la existencia de antecedentes de monitoreo. Todo otro número debe estar declarado como supuesto a verificar en el F02.", "Que el árbol tenga sólo causas técnicas —volumen, tipo de tratamiento, tecnología— y ninguna institucional, territorial, económica o social. Las tres raíces que el caso exige son la habilitación de urgencia de 2007 sin plan de cierre, la ausencia de un criterio de cierre acordado con la autoridad, y la superposición de uso extractivo y agropecuario sobre el mismo predio sin regla de compatibilidad. Un árbol que no las contenga está incompleto.", "Que el alcance se dilate del sector de piletas a \"los pasivos hidrocarburíferos del departamento Orán\" o a \"la contaminación del norte salteño\" al pasar del problema al objetivo central. La meta debe conservar el mismo sujeto, la misma variable y el mismo lugar que el problema.", "Que se declare como supuesto de la MML algo que el proyecto controla —contratar el laboratorio, diseñar las biopilas, ejecutar el cierre— y que en cambio no aparezca el supuesto realmente crítico: que la autoridad apruebe el estándar de cierre y lo mantenga estable. También revisar que la alternativa elegida sea compatible con el uso futuro declarado: si el equipo elige encapsulado con restricción de uso y a la vez sostiene que el propietario ampliará la superficie agrícola, la contradicción invalida la coherencia entre el ítem R y el árbol de objetivos."]}, "3": {"n": 3, "pc": "Los plantines de especies forestales nativas que se plantan en las campañas de forestación de los espacios públicos urbanos y periurbanos de las localidades de la provincia de Salta mueren en alta proporción antes de cumplir doce meses en el sitio definitivo.", "pcjus": "El escenario describe campañas que se repiten periódicamente y que, pese al esfuerzo institucional y comunitario, no consolidan el arbolado nativo que se proponen: el resultado negativo verificable no es la existencia de las campañas sino la muerte temprana de lo plantado. Se descartó formular el problema como «falta de un vivero municipal de especies nativas», porque enuncia una carencia de solución y decide de antemano la alternativa, cuando el análisis muestra que el fracaso también se explica por la época de plantación, la selección de especies y el abandono posterior al acto. Se descartó «falta de riego», que es la respuesta refleja: el riego es apenas uno de los cuidados ausentes y su enunciado como carencia clausura el árbol en un solo nivel. Se consideró seriamente «las campañas no consiguen plantines nativos en tiempo, cantidad y calidad adecuados» —la formulación del resumen del escenario—, pero se la conservó como causa directa de primer nivel y no como problema central, porque describe una falla del abastecimiento y no la situación negativa que el proyecto debe revertir; además dejaría fuera del árbol la raíz del cuidado posterior a la plantación. La formulación adoptada mantiene sujeto afectado (los plantines nativos plantados), atributo negativo (mueren en alta proporción), localización (espacios públicos urbanos y periurbanos de las localidades de la provincia) y horizonte temporal (doce meses), de modo que admite medición y comparación entre campañas.", "objc": "Los plantines de especies forestales nativas que se plantan en las campañas de forestación de los espacios públicos urbanos y periurbanos de las localidades de la provincia de Salta sobreviven en alta proporción los primeros doce meses en el sitio definitivo.", "sit": [{"id": "s1", "t": "Los plantines de especies forestales nativas que se plantan en las campañas de forestación de los espacios públicos urbanos y periurbanos de las localidades de la provincia de Salta mueren en alta proporción antes de cumplir doce meses en el sitio definitivo.", "k": "p", "d": "amb"}, {"id": "s2", "t": "La cobertura arbórea nativa efectivamente lograda por cada campaña resulta muy inferior a la cantidad de ejemplares plantados en plazas, veredas y espacios verdes de las localidades intervenidas.", "k": "e", "d": "amb"}, {"id": "s3", "t": "El déficit de sombra y el disconfort térmico de plazas, veredas y patios institucionales persisten en los sectores urbanos y periurbanos donde ya se realizaron campañas.", "k": "e", "d": "amb"}, {"id": "s4", "t": "Se pierde la inversión pública y comunitaria aplicada a cada campaña: producción del plantín, traslado, hoyado, plantación y jornadas de trabajo voluntario quedan sin resultado.", "k": "e", "d": "eco"}, {"id": "s5", "t": "Los programas municipales y provinciales de arbolado pierden respaldo político y presupuestario para sostener las campañas siguientes.", "k": "e", "d": "ins"}, {"id": "s6", "t": "Las escuelas, organizaciones sociales y vecinos que participaron reducen su participación en las convocatorias siguientes al ver morir lo que plantaron.", "k": "e", "d": "soc"}, {"id": "s7", "t": "Las campañas siguientes reemplazan especies nativas por ornamentales exóticas de prendimiento más seguro, y el arbolado urbano pierde diversidad nativa y adaptación local.", "k": "e", "d": "amb"}, {"id": "s8", "t": "Los plantines nativos llegan a las campañas fuera de la época de plantación, en cantidades insuficientes y con altura, endurecimiento y sistema radicular inadecuados para el sitio definitivo.", "k": "c", "d": "tec"}, {"id": "s9", "t": "Ningún organismo ni persona tiene asignada formalmente la tarea de riego, reposición y cuidado del ejemplar una vez terminado el acto de plantación.", "k": "c", "d": "ins"}, {"id": "s10", "t": "Las especies que se plantan no se corresponden con las condiciones de suelo, agua y microclima de cada sitio, porque las campañas repiten un mismo listado de especies en regiones ecológicas muy distintas de la provincia.", "k": "c", "d": "amb"}, {"id": "s11", "t": "La distribución de ejemplares entre barrios y localidades ignora que la disponibilidad de agua para riego y la accesibilidad logística son muy desiguales dentro de la provincia.", "k": "c", "d": "ter"}, {"id": "s12", "t": "Los vecinos frentistas y las instituciones participantes intervienen sólo el día de la plantación y no incorporan el cuidado posterior del ejemplar a su rutina.", "k": "c", "d": "soc"}, {"id": "s13", "t": "Los viveros que abastecen las campañas producen los plantines nativos sin protocolo escrito de producción, rustificación y control de calidad de salida: cada partida depende del criterio de quien esté a cargo ese año.", "k": "c", "d": "tec"}, {"id": "s14", "t": "Las campañas se programan según la agenda institucional de actos y efemérides y no según el calendario ecológico de plantación de cada región.", "k": "c", "d": "ins"}, {"id": "s15", "t": "La producción de nativas tiene ciclo más largo y demanda irregular que la de ornamentales exóticas, de modo que los viveros comerciales concentran su oferta en estas últimas.", "k": "c", "d": "eco"}, {"id": "s16", "t": "El presupuesto de las campañas financia la compra del plantín y el evento de plantación, pero no la etapa de mantenimiento posterior.", "k": "c", "d": "eco"}, {"id": "s17", "t": "La normativa y los programas de arbolado urbano vigentes no fijan estándares verificables de calidad del plantín ni obligaciones de mantenimiento posterior con responsable identificado.", "k": "c", "d": "ins"}, {"id": "s18", "t": "Cada campaña se planifica sin información sobre la supervivencia obtenida en las anteriores, porque el seguimiento posterior a la plantación no se registra ni se sistematiza por sitio y por especie.", "k": "c", "d": "tec"}], "lnk": [{"a": "s1", "b": "s2"}, {"a": "s2", "b": "s3"}, {"a": "s1", "b": "s4"}, {"a": "s4", "b": "s5"}, {"a": "s1", "b": "s6"}, {"a": "s6", "b": "s5"}, {"a": "s1", "b": "s7"}, {"a": "s5", "b": "s7"}, {"a": "s8", "b": "s1"}, {"a": "s9", "b": "s1"}, {"a": "s10", "b": "s1"}, {"a": "s11", "b": "s1"}, {"a": "s12", "b": "s1"}, {"a": "s13", "b": "s8"}, {"a": "s13", "b": "s10"}, {"a": "s14", "b": "s8"}, {"a": "s14", "b": "s10"}, {"a": "s15", "b": "s8"}, {"a": "s16", "b": "s9"}, {"a": "s16", "b": "s11"}, {"a": "s16", "b": "s12"}, {"a": "s17", "b": "s9"}, {"a": "s17", "b": "s13"}, {"a": "s17", "b": "s16"}, {"a": "s18", "b": "s10"}, {"a": "s18", "b": "s11"}, {"a": "s18", "b": "s13"}, {"a": "s18", "b": "s14"}], "obj": {"s1": "Los plantines de especies forestales nativas que se plantan en las campañas de forestación de los espacios públicos urbanos y periurbanos de las localidades de la provincia de Salta sobreviven en alta proporción los primeros doce meses en el sitio definitivo.", "s2": "La cobertura arbórea nativa efectivamente lograda por cada campaña se aproxima a la cantidad de ejemplares plantados en plazas, veredas y espacios verdes de las localidades intervenidas.", "s3": "Los sectores urbanos y periurbanos donde se realizaron campañas ganan sombra y mejoran el confort térmico de plazas, veredas y patios institucionales.", "s4": "La inversión pública y comunitaria aplicada a cada campaña se aprovecha: el ejemplar producido, trasladado y plantado permanece vivo e incorporado al arbolado.", "s5": "Los programas municipales y provinciales de arbolado conservan y amplían su respaldo político y presupuestario para las campañas siguientes.", "s6": "Las escuelas, organizaciones sociales y vecinos que participaron sostienen o aumentan su participación en las convocatorias siguientes al ver prosperar lo que plantaron.", "s7": "Las campañas siguientes sostienen la proporción de especies nativas y el arbolado urbano conserva su diversidad nativa y su adaptación local.", "s8": "Los plantines nativos llegan a las campañas dentro de la época de plantación, en la cantidad requerida y con altura, endurecimiento y sistema radicular adecuados para el sitio definitivo.", "s9": "La tarea de riego, reposición y cuidado del ejemplar posterior al acto de plantación está formalmente asignada a un organismo y a un responsable identificado.", "s10": "Las especies que se plantan se corresponden con las condiciones de suelo, agua y microclima de cada sitio, con listados diferenciados por región ecológica de la provincia.", "s11": "La distribución de ejemplares entre barrios y localidades contempla la disponibilidad real de agua para riego y la accesibilidad logística de cada sitio.", "s12": "Los vecinos frentistas y las instituciones participantes incorporan el cuidado posterior del ejemplar a su rutina, más allá del día de la plantación.", "s13": "Los viveros que abastecen las campañas producen los plantines nativos con protocolo escrito de producción, rustificación y control de calidad de salida, independiente de quién esté a cargo.", "s14": "Las campañas se programan según el calendario ecológico de plantación de cada región y la agenda institucional de actos se ajusta a ese calendario.", "s15": "La producción de nativas cuenta con demanda previsible y programada, lo que hace sostenible para los viveros mantener una oferta estable de estas especies.", "s16": "El presupuesto de las campañas financia el plantín, el evento de plantación y la etapa de mantenimiento posterior.", "s17": "La normativa y los programas de arbolado urbano fijan estándares verificables de calidad del plantín y obligaciones de mantenimiento posterior con responsable identificado.", "s18": "Cada campaña se planifica con la información de supervivencia obtenida en las anteriores, registrada y sistematizada por sitio y por especie."}, "f01": {"A": "Respuesta modelo: «Yuchán Consultora Ambiental S.H.». El yuchán (Ceiba chodatii) es una especie nativa presente en el arbolado y en el paisaje de buena parte de las localidades salteñas, de modo que el nombre da identidad al equipo y lo vincula con el ámbito de actuación —restauración ecológica y producción de servicios ecosistémicos— y con la actividad profesional que el equipo proyecta. Es corto (dos palabras más la forma societaria), pronunciable y registrable, condiciones que la Guía pide porque el nombre se entiende como capital de una actividad económica real. Por ahora se adopta sociedad de hecho, según indica la Guía para esta instancia. · Aclaración para la corrección: éste es un ejemplo de respuesta válida, no la única. Cualquier sigla o denominación de dos o tres palabras ligada al ámbito de actuación es correcta. Lo que sí debe controlarse es que el nombre del equipo no sea el nombre del proyecto: si en este ítem aparece algo como «Producción de plantines nativos», el equipo confundió A con V.", "B": "Se declara la estructura de roles del equipo, sin nombres reales en esta versión docente. · Integrante 1 · Coordinación general: convoca y ordena las reuniones, distribuye tareas, controla plazos y consolida el entregable; es el enlace con la cátedra. Dedicación estimada 14 horas. · Integrante 2 · Búsqueda y sistematización de información secundaria: releva programas de forestación urbana, ordenanzas de arbolado, oferta de viveros y antecedentes de campañas; arma la matriz de fuentes. Dedicación estimada 12 horas. · Integrante 3 · Análisis y construcción de los árboles: aplica la técnica «¿pero por qué?», ordena causas y efectos por nivel y arma los diagramas de los ítems M y Q. Dedicación estimada 12 horas. · Integrante 4 · Redacción y edición del informe, paratextos y cartografía: escribe, unifica estilo, prepara mapas y esquemas y controla la coherencia entre ítems. Dedicación estimada 10 horas. · Integrante 5 · Enlace institucional y consulta a expertos: gestiona entrevistas con direcciones de espacios verdes, viveros y organizaciones, y sistematiza lo relevado. Dedicación estimada 8 horas. · Metodología acordada: una reunión semanal virtual de 90 minutos más trabajo asincrónico en documento compartido; grupo de mensajería para coordinación diaria y correo para la comunicación con la cátedra. La coordinación es rotativa y removible por mayoría, informando a la cátedra por correo. · Sólo se declaran horas efectivamente trabajadas en esta entrega; no se incluye a quien no aportó.", "C": "Ámbitos de actuación declarados, en orden de énfasis: (1) restauración ecológica, porque el proyecto busca reconstituir cobertura arbórea nativa en espacios públicos urbanos y periurbanos degradados o carentes de vegetación adaptada; (2) producción de servicios ecosistémicos, porque el resultado esperado del arbolado nativo es sombra, regulación térmica, infiltración, hábitat para fauna urbana y mejora del paisaje, tal como lo enuncia el escenario; (3) producción de recursos naturales renovables, ámbito secundario que se declara porque la alternativa seleccionada opera sobre la producción de plantines de especies forestales nativas, es decir, sobre un proceso productivo de base biológica. · La Guía admite expresamente que las categorías no son mutuamente excluyentes, de modo que declarar los tres y explicitar el énfasis es la respuesta correcta. · Nota de método: este ítem se cierra después de escribir el ítem D. Si el equipo lo hubiera resuelto antes de definir el problema, probablemente habría declarado sólo «producción de recursos naturales renovables», suponiendo de entrada que el proyecto es un vivero.", "D": "Los plantines de especies forestales nativas que se plantan en las campañas de forestación de los espacios públicos urbanos y periurbanos de las localidades de la provincia de Salta mueren en alta proporción antes de cumplir doce meses en el sitio definitivo. · Identidad: la unidad afectada es el plantín nativo ya plantado y, con él, el arbolado público y la población que debería usufructuarlo. · Ubicación: plazas, veredas, canteros y predios institucionales de localidades urbanas y periurbanas de la provincia, de condiciones ecológicas y accesibilidad dispares. · Tiempo: actual y recurrente, campaña tras campaña; la ventana crítica son los primeros doce meses, cuando el ejemplar aún depende de riego y protección. · Mensurabilidad: tasa de supervivencia a doce meses, por censo del arbolado. · Magnitud: el escenario advierte que la información disponible no permite dimensionar oferta, demanda ni supervivencia; la línea de base se adopta como supuesto explícito en el ítem E, a verificar en el F02. · Se controló que el enunciado no sea causa ni efecto ni esté escrito como carencia.", "E": "Indicador principal, en situación sin proyecto: «Porcentaje de plantines de especies forestales nativas vivos a los doce meses de plantados, sobre el total de ejemplares nativos plantados en las campañas de forestación de espacios públicos de las localidades relevadas de la provincia de Salta, medido por censo de supervivencia con ficha georreferenciada por ejemplar». · Cantidad + variable + lugar + plazo + medio de verificación: se cumplen los cinco componentes; el medio de verificación es el censo de supervivencia, que hoy no existe como serie y debe construirse con las direcciones de espacios verdes municipales y los viveros que entregaron las partidas. · Valor sin proyecto: el escenario no aporta cifras —consigna expresamente que «la información disponible no permite determinar si la oferta actual satisface la demanda potencial»—, de modo que se adopta Supuesto 1: se asume una supervivencia del orden del 40 % a los doce meses, por analogía con el valor de referencia del caso guía de la asignatura y con lo relatado por los organizadores de campañas. Es una primera aproximación, declarada como supuesto y a verificar en el F02 con relevamiento propio; no se la presenta como dato oficial. · Indicadores complementarios, todos a construir: proporción de partidas entregadas dentro de la ventana de plantación de cada región, sobre el total de partidas de la campaña, por remito de entrega; cantidad de ejemplares nativos solicitados y efectivamente provistos por campaña, por acta de recepción; proporción de sitios plantados con responsable de mantenimiento formalmente asignado, por acto administrativo o acta de compromiso. · Lo que el escenario ya aporta (y no requiere relevamiento nuevo): que las campañas existen y se repiten, que participan escuelas y organizaciones, que la oferta de viveros comerciales privilegia ornamentales exóticas y que las condiciones ambientales varían fuertemente dentro de la provincia. · Lo que hay que relevar: tasa de supervivencia por sitio y por especie, calendario real de entregas frente al calendario ecológico, capacidad instalada de los viveros que producen nativas, y existencia de responsables de mantenimiento designados.", "F": "Contexto geográfico y ambiental: la provincia de Salta contiene regiones ecológicas marcadamente distintas, con regímenes de precipitación, temperatura, suelos y estacionalidad que no admiten un listado único de especies ni un calendario único de plantación; el escenario lo señala como condicionante central. Las localidades donde se ejecutan las campañas son urbanas y periurbanas: suelos compactados o rellenos, superficies impermeabilizadas, radiación reflejada por pavimentos y muros, canteros de dimensión reducida y competencia con infraestructura de servicios. La disponibilidad de agua para riego es variable entre localidades y entre barrios de una misma localidad, y esa variabilidad define en buena medida la supervivencia del ejemplar durante su primer verano. · Contexto social e institucional: las campañas son impulsadas por municipios, instituciones educativas, organizaciones sociales y vecinos, con alta participación en el día de la plantación y baja continuidad posterior. Existen programas públicos y normativa vinculada al arbolado urbano y a la conservación, con grados de aplicación dispares entre municipios. · Contexto económico y productivo: los viveros comerciales ofrecen mayoritariamente ornamentales exóticas; la disponibilidad de nativas es variable y depende de iniciativas puntuales, viveros institucionales o escolares y programas provinciales. Las diferencias de accesibilidad y logística entre localidades encarecen el traslado de plantines y condicionan el tamaño de la partida que se puede mover. · Qué del contexto potencia el problema: heterogeneidad ecológica sin ajuste regional de especies y calendarios; agua desigual; logística costosa; oferta de mercado sesgada a exóticas; campañas organizadas como eventos. · Qué del contexto contribuye a la solución: demanda institucional y social sostenida, red de escuelas y organizaciones dispuesta a participar, existencia de programas públicos de arbolado y de normativa de conservación sobre la cual apoyarse. · Todos los datos del contexto provienen del escenario; cualquier cifra de población, superficie de espacio verde o cobertura arbórea deberá incorporarse en el F02 con fuente y año declarados.", "G": "Población potencial: la población de las localidades urbanas y periurbanas de la provincia que hoy no accede a los servicios ecosistémicos que el arbolado nativo debería prestar —sombra, atenuación térmica, calidad del aire, paisaje— porque las campañas no logran consolidar los ejemplares plantados. Comprende además a los actores que internalizan directamente el fracaso: los municipios que financian las campañas, las escuelas y organizaciones que aportan trabajo y los viveros que producen las partidas. El escenario no aporta cifras poblacionales, de modo que la cuantificación se posterga al F02 con datos censales, indicando aquí el criterio de cálculo: habitantes de las localidades que ejecutan campañas de forestación urbana. · Población objetivo: no es toda la población de la provincia. El proyecto puede atender inicialmente a los habitantes de un conjunto acotado de localidades participantes —se propone del orden de cuatro a seis localidades, seleccionadas para representar las principales regiones ecológicas de la provincia y distintos tamaños de municipio—, junto con los organismos, escuelas y organizaciones que ejecutan allí las campañas. · Criterio de recorte: (1) que el municipio realice campañas de forestación con regularidad, es decir, que el problema efectivamente se manifieste; (2) que exista al menos un vivero —municipal, escolar, de organización o provincial— en condiciones de incorporarse a la red productiva; (3) que el municipio esté dispuesto a firmar el acta de compromiso de mantenimiento posterior; (4) representatividad ecológica, para que el protocolo se valide en condiciones contrastantes y sea replicable. · Beneficiarios directos de los bienes y servicios del proyecto: los organismos y organizaciones que reciben plantines certificados en época; beneficiarios finales: la población usuaria de los espacios públicos arbolados.", "H": "Análisis de involucrados, con escala cualitativa alta–media–baja aplicada por igual a fuerza e importancia. · 1. Municipios (direcciones de espacios verdes y de ambiente) · Institución pública · Posición a favor, con reservas presupuestarias · Fuerza alta: deciden el calendario, el sitio y el presupuesto de cada campaña, y pueden no firmar el compromiso de mantenimiento · Importancia alta: son los receptores de los plantines y los responsables del arbolado · Interés: mostrar resultados de gestión y evitar el costo de reponer. · 2. Autoridad ambiental y forestal provincial · Institución pública · Posición a favor · Fuerza alta: habilita programas, puede aportar material de propagación y estándares · Importancia alta: da escala provincial y continuidad a la red · Interés: cumplir metas de conservación y restauración. · 3. Viveros comerciales · Empresa privada · Posición indiferente, potencialmente en contra si perciben competencia desleal de un vivero público · Fuerza media: controlan buena parte de la oferta actual y su lobby puede condicionar compras públicas · Importancia media: pueden convertirse en proveedores de nativas si la demanda se vuelve previsible · Interés: rentabilidad y rotación de stock. · 4. Escuelas e instituciones educativas · Sociedad civil · Posición a favor · Fuerza media: aportan trabajo, terreno y continuidad pedagógica, y su desánimo desactiva las campañas · Importancia alta: son plantadores, potenciales viveristas escolares y responsables de mantenimiento · Interés: proyecto educativo y apropiación del espacio. · 5. Organizaciones socioambientales y vecinales · Sociedad civil / ONG ambiental · Posición a favor · Fuerza media: capacidad de movilización y de instalación pública del tema · Importancia alta: sostienen el cuidado posterior en el territorio · Interés: mejora ambiental barrial y participación. · 6. Vecinos frentistas · Sociedad civil · Posición mixta: a favor en general, en contra cuando el árbol afecta vereda, cochera o cableado, y son quienes en los hechos riegan o no riegan · Fuerza media: pueden retirar o descuidar el ejemplar · Importancia alta: sin su cuidado no hay supervivencia · Interés: sombra y valor de la propiedad, frente a costo de mantenimiento y roturas. · 7. Empresa prestadora de energía y prestadora de agua · Empresa de servicios · Posición indiferente o en contra según el caso · Fuerza media: la poda de despeje de líneas y las restricciones de riego condicionan la supervivencia y la elección de especies · Importancia media: su criterio define qué se puede plantar bajo cableado y con qué agua se riega · Interés: seguridad del servicio y control de consumo. · Estrategias derivadas: convenio marco con la autoridad provincial y actas con cada municipio; acuerdo técnico con la prestadora eléctrica sobre especies de porte compatible; incorporación de los viveros comerciales como proveedores del protocolo en lugar de competidores; trabajo de apropiación con frentistas y escuelas.", "I": "Titular del proyecto: se propone la autoridad ambiental y forestal de la provincia de Salta como organismo titular, con una unidad ejecutora del proyecto radicada en su estructura y convenios de adhesión con cada municipio participante. La figura es la de un programa provincial con adhesión municipal por convenio, porque el problema atraviesa varias localidades, requiere estándares comunes y ninguna municipalidad por sí sola puede sostener la red de producción ni la homogeneidad del protocolo. · Dependencias directas para que el proyecto exista: (1) la autoridad ambiental y forestal provincial, que aprueba el programa, el protocolo de producción y el estándar de calidad de salida; (2) los municipios participantes, que aportan sitios de plantación, autorizan la intervención en espacio público, asignan el responsable de mantenimiento y firman el acta de compromiso; (3) los titulares de los viveros que se incorporen a la red —municipales, escolares, de organizaciones o privados—, que ceden o afectan instalaciones y personal; (4) la prestadora de agua, para el abastecimiento de riego de vivero y de mantenimiento; (5) la prestadora de energía, para la compatibilización de especies bajo tendido eléctrico; (6) eventualmente, un organismo financiador nacional o de cooperación, si el proyecto requiere financiamiento externo. · Los seis actores figuran también en el ítem H, con la misma caracterización: la coherencia entre ambos ítems es requisito. · En esta instancia sólo se identifican las dependencias. Los convenios, comodatos, cesiones de uso y autorizaciones concretas no se tramitan aquí: se listan para saber ante quién habría que tramitarlos al pasar de idea a perfil y a prefactibilidad.", "J": "Matriz de cumplimiento legal, seleccionando la normativa efectivamente aplicable a la producción de plantines nativos y a la forestación de espacios públicos. Se cita el número sólo cuando se lo verificó; en los demás casos la norma se nombra por su materia y su número se completará en el F02. · Nacional: Ley General del Ambiente 25.675, presupuestos mínimos, principios preventivo y precautorio, evaluación de impacto ambiental y participación ciudadana. · Ley de Presupuestos Mínimos de Protección Ambiental de los Bosques Nativos 26.331, relevante para la obtención de semillas y material de propagación de origen nativo y para las categorías de conservación del ordenamiento territorial. · Régimen nacional de promoción de inversiones en bosques cultivados y su normativa de aplicación, en lo referido a viveros y calidad de material forestal de propagación. · Normativa nacional de sanidad vegetal y de registro de viveros y de material de propagación, aplicable a la habilitación del vivero y al tránsito de plantas. · Régimen nacional de acceso a la información pública ambiental. · Provincial de Salta: Ley 7.070 de Protección del Medio Ambiente, marco general, procedimiento de evaluación de impacto ambiental y autoridad de aplicación. · Ley 7.543 de Ordenamiento Territorial de Bosques Nativos de la provincia, con las actualizaciones de su ordenamiento, a verificar en su texto vigente antes de citarla en el F02. · Normativa provincial de conservación de flora y fauna y de áreas protegidas, en lo relativo a colecta de semillas y de germoplasma de especies nativas. · Normativa provincial de aguas, en lo referido a la fuente y al uso del agua de riego del vivero. · Municipal: ordenanzas de arbolado público de cada municipio participante, que regulan plantación, poda, extracción, especies admitidas y responsabilidad del frentista; código de planeamiento urbano ambiental y normas de espacio público; ordenanzas de habilitación comercial e industrial, para el vivero. · Advertencia de corrección: el escenario menciona la existencia de programas públicos y normativa de arbolado urbano y conservación, pero no los individualiza. Copiar un listado de normas sin verificar vigencia y texto ordenado es error frecuente; varias de las normas citadas fueron modificadas y deben consultarse en su texto actualizado.", "K": "Causas ordenadas por nivel, coherentes con el árbol de los ítems M y con el grafo de situaciones. · Causa 1 · Los plantines nativos llegan a las campañas fuera de la época de plantación, en cantidades insuficientes y con altura, endurecimiento y sistema radicular inadecuados para el sitio definitivo. Es la formulación que el resumen del escenario propone como problema y que aquí se ubica correctamente como causa directa. · Causa 1.1 · Los viveros que abastecen las campañas producen los plantines nativos sin protocolo escrito de producción, rustificación y control de calidad de salida: cada partida depende del criterio de quien esté a cargo ese año. · Causa 1.2 · Las campañas se programan según la agenda institucional de actos y efemérides y no según el calendario ecológico de plantación de cada región. · Causa 1.3 · La producción de nativas tiene ciclo más largo y demanda irregular que la de ornamentales exóticas, de modo que los viveros comerciales concentran su oferta en estas últimas. · Causa 1.1.A · La normativa y los programas de arbolado urbano vigentes no fijan estándares verificables de calidad del plantín. · Causa 1.1.B · Cada campaña se planifica sin información sobre la supervivencia obtenida en las anteriores, porque el seguimiento posterior no se registra ni se sistematiza por sitio y por especie. · Causa 2 · Ningún organismo ni persona tiene asignada formalmente la tarea de riego, reposición y cuidado del ejemplar una vez terminado el acto de plantación. · Causa 2.1 · El presupuesto de las campañas financia la compra del plantín y el evento de plantación, pero no la etapa de mantenimiento posterior. · Causa 2.2 · La normativa y los programas de arbolado no establecen obligaciones de mantenimiento posterior con responsable identificado (misma causa que 1.1.A, actuando sobre otra rama). · Causa 3 · Los vecinos frentistas y las instituciones participantes intervienen sólo el día de la plantación y no incorporan el cuidado posterior del ejemplar a su rutina. Deriva de la causa 2 y de la 2.1: sin responsable formal ni presupuesto, el cuidado queda librado a la voluntad individual. · Causa 4 · Las especies que se plantan no se corresponden con las condiciones de suelo, agua y microclima de cada sitio, porque las campañas repiten un mismo listado de especies en regiones ecológicas muy distintas de la provincia. Deriva de 1.1, 1.2 y 1.1.B. · Causa 5 · La distribución de ejemplares entre barrios y localidades ignora que la disponibilidad de agua para riego y la accesibilidad logística son muy desiguales dentro de la provincia. Deriva de 2.1 y de 1.1.B. · Verificación de derecha a izquierda: la ausencia de estándares normativos y de registro de supervivencia permite que los viveros produzcan sin protocolo; sin protocolo y con la campaña atada a la agenda de actos, el plantín llega fuera de época y débil; un plantín débil, de especie inadecuada y sin riego posterior, muere antes del año. La cadena cierra. · Las tres raíces primarias e independientes entre sí son: la producción sin protocolo escrito, la programación por agenda institucional en lugar de calendario ecológico, y la no asignación formal de la responsabilidad posterior a la plantación.", "L": "Efectos ordenados por nivel, leídos de izquierda a derecha. · Efecto 1 · La cobertura arbórea nativa efectivamente lograda por cada campaña resulta muy inferior a la cantidad de ejemplares plantados en plazas, veredas y espacios verdes de las localidades intervenidas. · Efecto 1.1 · El déficit de sombra y el disconfort térmico de plazas, veredas y patios institucionales persisten en los sectores urbanos y periurbanos donde ya se realizaron campañas, con la consiguiente menor utilización de esos espacios en la temporada cálida. · Efecto 2 · Se pierde la inversión pública y comunitaria aplicada a cada campaña: producción del plantín, traslado, hoyado, plantación y jornadas de trabajo voluntario quedan sin resultado. · Efecto 2.1 · Los programas municipales y provinciales de arbolado pierden respaldo político y presupuestario para sostener las campañas siguientes. · Efecto 3 · Las escuelas, organizaciones sociales y vecinos que participaron reducen su participación en las convocatorias siguientes al ver morir lo que plantaron. El efecto 3 refuerza el 2.1: menos participación y menos resultados visibles debilitan aún más la defensa presupuestaria del programa. · Efecto 4 · Las campañas siguientes reemplazan especies nativas por ornamentales exóticas de prendimiento más seguro, y el arbolado urbano pierde diversidad nativa y adaptación local, con mayor demanda de agua y menor aporte al mantenimiento de los ecosistemas. Deriva del problema central de manera directa y también del efecto 2.1: con menos presupuesto se compra lo más barato y seguro. · Verificación de izquierda a derecha: la mortandad reduce la cobertura lograda; menor cobertura significa menos sombra y peor confort térmico; la mortandad también consume presupuesto sin resultado, lo que erosiona el respaldo del programa; y el desánimo de los participantes acelera esa erosión. Todos los efectos persistirán mientras el problema no se resuelva. · Control de columna: ninguno de estos enunciados explica por qué mueren los plantines; todos describen lo que la mortandad provoca. Ése es el criterio que separa el ítem K del ítem L.", "M": "Lectura encadenada del árbol de problemas. · Raíces profundas: la normativa y los programas de arbolado no fijan estándares verificables de calidad del plantín ni obligaciones de mantenimiento con responsable identificado, y ninguna campaña registra la supervivencia de la anterior por sitio y por especie. Sin estándar y sin registro, nadie está obligado a producir de determinada manera ni puede aprender de lo hecho. · Raíces intermedias: los viveros producen sin protocolo escrito de producción, rustificación y control de calidad; las campañas se programan por la agenda de actos y no por el calendario ecológico; la producción de nativas es económicamente menos atractiva que la de exóticas y el presupuesto de la campaña se agota el día de la plantación. · Causas directas: el plantín llega fuera de época, insuficiente y débil; la especie no corresponde al sitio; la distribución de ejemplares desconoce la desigualdad de agua y logística entre localidades; nadie tiene asignado el cuidado posterior; y los participantes intervienen sólo el día del acto. · Tronco: los plantines de especies forestales nativas plantados en las campañas de los espacios públicos urbanos y periurbanos de las localidades de la provincia de Salta mueren en alta proporción antes de cumplir doce meses. · Ramas: la cobertura arbórea lograda por campaña queda muy por debajo de lo plantado y, en consecuencia, persisten el déficit de sombra y el disconfort térmico; se pierde la inversión pública y comunitaria, lo que erosiona el respaldo político y presupuestario del programa; los participantes se desmotivan y se retiran, reforzando esa erosión; y las campañas terminan reemplazando nativas por exóticas, con pérdida de diversidad. · El diagrama no agrega elementos: ordena los de K y L en un mismo esquema, con las causas hacia abajo y los efectos hacia arriba. · Advertencia metodológica: en esta instancia el árbol es un conjunto de hipótesis de trabajo. Cada vínculo —en particular el peso relativo de la calidad del plantín frente al abandono posterior— deberá ponerse a prueba en el F02 con censo de supervivencia, consulta a viveristas y trabajo participativo con los involucrados.", "N": "Medios, en espejo con las causas del ítem K y con la misma estructura jerárquica. Se enuncian como estados alcanzados, no como acciones. · Medio 1 · Los plantines nativos llegan a las campañas dentro de la época de plantación, en la cantidad requerida y con altura, endurecimiento y sistema radicular adecuados para el sitio definitivo. · Medio 1.1 · Los viveros que abastecen las campañas producen los plantines nativos con protocolo escrito de producción, rustificación y control de calidad de salida, independiente de quién esté a cargo. · Medio 1.2 · Las campañas se programan según el calendario ecológico de plantación de cada región y la agenda institucional de actos se ajusta a ese calendario. · Medio 1.3 · La producción de nativas cuenta con demanda previsible y programada, lo que hace sostenible para los viveros mantener una oferta estable de estas especies. · Medio 1.1.A · La normativa y los programas de arbolado urbano fijan estándares verificables de calidad del plantín y obligaciones de mantenimiento posterior con responsable identificado. · Medio 1.1.B · Cada campaña se planifica con la información de supervivencia obtenida en las anteriores, registrada y sistematizada por sitio y por especie. · Medio 2 · La tarea de riego, reposición y cuidado del ejemplar posterior al acto de plantación está formalmente asignada a un organismo y a un responsable identificado. · Medio 2.1 · El presupuesto de las campañas financia el plantín, el evento de plantación y la etapa de mantenimiento posterior. · Medio 3 · Los vecinos frentistas y las instituciones participantes incorporan el cuidado posterior del ejemplar a su rutina, más allá del día de la plantación. · Medio 4 · Las especies que se plantan se corresponden con las condiciones de suelo, agua y microclima de cada sitio, con listados diferenciados por región ecológica de la provincia. · Medio 5 · La distribución de ejemplares entre barrios y localidades contempla la disponibilidad real de agua para riego y la accesibilidad logística de cada sitio. · Medios fuera del alcance del proyecto, declarados explícitamente: el Medio 1.1.A depende de una decisión normativa provincial y municipal que el proyecto puede impulsar y fundamentar, pero no sancionar; el Medio 1.3 depende del comportamiento de un mercado que el proyecto sólo influye parcialmente al volver previsible la demanda pública; y el Medio 2.1 depende de la asignación presupuestaria de cada municipio. Estos tres medios reaparecen en la MML como supuestos, no como componentes.", "O": "Fines, en espejo con los efectos del ítem L, conservando el mismo encadenamiento. · Fin 1 · La cobertura arbórea nativa efectivamente lograda por cada campaña se aproxima a la cantidad de ejemplares plantados en plazas, veredas y espacios verdes de las localidades intervenidas. · Fin 1.1 · Los sectores urbanos y periurbanos donde se realizaron campañas ganan sombra y mejoran el confort térmico de plazas, veredas y patios institucionales, con mayor uso de esos espacios en la temporada cálida. · Fin 2 · La inversión pública y comunitaria aplicada a cada campaña se aprovecha: el ejemplar producido, trasladado y plantado permanece vivo e incorporado al arbolado. · Fin 2.1 · Los programas municipales y provinciales de arbolado conservan y amplían su respaldo político y presupuestario para las campañas siguientes. · Fin 3 · Las escuelas, organizaciones sociales y vecinos que participaron sostienen o aumentan su participación en las convocatorias siguientes al ver prosperar lo que plantaron. · Fin 4 · Las campañas siguientes sostienen la proporción de especies nativas y el arbolado urbano conserva su diversidad nativa y su adaptación local, con menor requerimiento hídrico y mayor aporte al mantenimiento de los ecosistemas. · Cada fin es el espejo exacto de un efecto del ítem L: hay cuatro efectos primarios y cuatro fines primarios, dos efectos secundarios y dos fines secundarios. No se agregó ningún deseo sin efecto correspondiente. · Los fines más altos —Fin 1.1 y Fin 2.1— son los que alimentan el nivel Fin de la EAP y de la MML.", "P": "Problema central: los plantines de especies forestales nativas que se plantan en las campañas de forestación de los espacios públicos urbanos y periurbanos de las localidades de la provincia de Salta mueren en alta proporción antes de cumplir doce meses en el sitio definitivo. · Objetivo central, propósito o meta: los plantines de especies forestales nativas que se plantan en las campañas de forestación de los espacios públicos urbanos y periurbanos de las localidades de la provincia de Salta sobreviven en alta proporción los primeros doce meses en el sitio definitivo. · Se conservan el mismo sujeto (los plantines nativos plantados en campañas), la misma variable (supervivencia a los doce meses), el mismo lugar (espacios públicos urbanos y periurbanos de las localidades de la provincia) y el mismo plazo. Sólo cambia el signo. · Control de alcance: el problema se localizó en las localidades de la provincia que realizan campañas, no en la provincia entera ni en un solo municipio; la meta mantiene exactamente esa localización. En la MML y en la EAP el alcance se acota además a las localidades participantes del proyecto, tal como se definió la población objetivo en el ítem G, y esa restricción se declara para que no se lea como un cambio de alcance encubierto. · El indicador de este objetivo es el mismo del ítem E, con el signo invertido: porcentaje de plantines nativos vivos a los doce meses de plantados.", "Q": "Árbol de objetivos, con la misma estructura del árbol de problemas: medios abajo, meta en el tronco, fines arriba. · Base: normativa y programas de arbolado con estándares verificables de calidad de plantín y obligaciones de mantenimiento con responsable identificado, y campañas planificadas con la información de supervivencia registrada por sitio y por especie. · Nivel intermedio: viveros que producen con protocolo escrito de producción, rustificación y control de calidad; campañas programadas según el calendario ecológico regional; demanda de nativas previsible y programada; presupuesto de campaña que incluye el mantenimiento posterior. · Medios directos: plantines que llegan en época, en cantidad y con calidad adecuada; especies correspondientes a las condiciones de cada sitio; distribución de ejemplares que contempla agua y logística; responsabilidad del cuidado posterior formalmente asignada; participantes que incorporan el cuidado a su rutina. · Tronco: los plantines nativos plantados en las campañas de los espacios públicos de las localidades de la provincia sobreviven en alta proporción los primeros doce meses. · Fines: la cobertura arbórea lograda se aproxima a lo plantado y mejoran sombra y confort térmico; la inversión pública y comunitaria se aprovecha y los programas conservan respaldo presupuestario; los participantes sostienen su compromiso; y el arbolado conserva su diversidad nativa. · Control de simetría: el árbol de objetivos tiene exactamente los mismos dieciocho nodos que el árbol de problemas —once medios, un objetivo central y seis fines— y las mismas relaciones. No hay ramas de más ni de menos. · Medios sobre los que el proyecto puede actuar directamente, marcados en el diagrama: 1, 1.1, 1.2, 1.1.B, 4 y 5, más una incidencia parcial sobre 2 y 3 a través del acta de compromiso de mantenimiento. Los medios 1.1.A, 1.3 y 2.1 quedan señalados como fuera del control del proyecto.", "R": "Estrategias derivadas del árbol de objetivos, partiendo de los medios más bajos. · Estrategia I · Medio: la tarea de riego y cuidado posterior está formalmente asignada y los participantes la incorporan a su rutina. Actividades mutuamente excluyentes: (A) programa de padrinazgo de árboles con vecinos, escuelas y organizaciones, con acta de compromiso por ejemplar y seguimiento a doce meses; (B) cuadrilla municipal de mantenimiento post-plantación con equipamiento y personal propio. · Estrategia II · Medio: los viveros que abastecen las campañas producen con protocolo escrito, rustificación y control de calidad de salida, y los plantines llegan en época y en cantidad. Actividades mutuamente excluyentes: (C) red provincial de producción calificada de plantines nativos en viveros existentes —municipales, escolares, de organizaciones y privados— operando bajo un protocolo común, con certificación de calidad de salida, programación de entregas por calendario ecológico regional y entrega condicionada a acta de compromiso de mantenimiento; (D) construcción de un vivero provincial nuevo de gran escala, centralizado, para abastecer a todas las localidades. · Estrategia III · Medio: las campañas se planifican con información de supervivencia y según el calendario ecológico. Actividad: (E) sistema provincial de programación de campañas y registro de supervivencia por sitio y por especie. · Estrategia IV · Medio: la normativa fija estándares verificables. Actividad: (F) elaboración y gestión de sanción de un estándar técnico provincial de calidad de plantín nativo y de mantenimiento posterior, con adhesión municipal. · Actividades descartadas por estar fuera del alcance: la (F) depende de una decisión legislativa o reglamentaria ajena al proyecto y su plazo es incierto; se la conserva como acción de incidencia y como supuesto de la MML, no como idea fuerza. La (D) se descarta por escala e inversión, según se detalla en el ítem de justificación de alternativas. · Estrategia y actividad seleccionadas: Estrategia II, actividad (C). El proyecto consiste en poner en funcionamiento una red de viveros existentes que produzcan plantines de especies forestales nativas bajo protocolo escrito, con rustificación y control de calidad de salida, listados de especies diferenciados por región ecológica, entregas programadas dentro de la ventana de plantación de cada región y entrega condicionada a la firma de un acta de compromiso de mantenimiento por parte del municipio o institución receptora. La actividad (E) se incorpora como componente instrumental del mismo proyecto —el registro de supervivencia es lo que permite verificar el indicador—, y la (A) queda como línea complementaria que el proyecto promueve pero no ejecuta, incorporándola al acta de compromiso. · La actividad seleccionada sale directamente de los medios 1, 1.1, 1.2, 1.1.B, 4 y 5 del árbol de objetivos; no aparece de la nada.", "S": "Estructura Analítica del Proyecto, de arriba hacia abajo. · Fin: se contribuye a que los espacios públicos urbanos y periurbanos de las localidades participantes de la provincia de Salta incrementen su cobertura arbórea nativa y mejoren su confort térmico, aprovechando la inversión pública y comunitaria de cada campaña. Toma los fines más altos del árbol de objetivos (1.1 y 2.1). · Propósito: los plantines de especies forestales nativas plantados en las campañas de forestación de los espacios públicos de las localidades participantes sobreviven en alta proporción los primeros doce meses en el sitio definitivo. Es el ítem P, acotado a las localidades participantes según la población objetivo del ítem G. · Componente: plantines de especies forestales nativas producidos bajo protocolo, rustificados, con especie adecuada al sitio y entregados en época, en cantidad y calidad certificadas, a las campañas de las localidades participantes. Está escrito como producto obtenido y no como acción. Componente instrumental asociado: registro de supervivencia por sitio y por especie implementado y en uso para la programación de las campañas siguientes. · Actividad: puesta en funcionamiento de la red provincial de producción calificada de plantines nativos en viveros existentes —relevamiento y selección de viveros, redacción y aprobación del protocolo de producción, rustificación y control de calidad, capacitación del personal, provisión de insumos y mejoras de infraestructura de riego, elaboración de los listados de especies por región ecológica, programación de entregas según calendario ecológico, firma de convenios y actas de compromiso de mantenimiento, e implementación del registro de supervivencia—. · Control del error frecuente: la componente no dice «capacitar a los viveristas» ni «producir plantines»; dice qué producto queda obtenido cuando la actividad se ejecuta.", "T": "Matriz de Marco Lógico, en texto. · FIN · Resumen narrativo: contribuir a incrementar la cobertura arbórea nativa y mejorar el confort térmico de los espacios públicos urbanos y periurbanos de las localidades participantes de la provincia de Salta. Indicador: incremento del 20 % en la cantidad de ejemplares nativos vivos por hectárea de espacio público en las localidades participantes, a los 36 meses de iniciado el proyecto, respecto de la línea de base del año cero (meta preliminar, a validar en el F02). Medio de verificación: relevamiento de arbolado de las direcciones de espacios verdes municipales, con ficha común por sitio; informe anual consolidado por la unidad ejecutora y publicado en el portal de la autoridad ambiental provincial. Supuesto: los municipios sostienen sus campañas anuales de forestación y no reducen la superficie de espacio público disponible para plantación. · PROPÓSITO · Resumen narrativo: los plantines de especies forestales nativas plantados en las campañas de los espacios públicos de las localidades participantes sobreviven en alta proporción los primeros doce meses en el sitio definitivo. Indicador: supervivencia del 75 % de los plantines nativos a los doce meses de plantados, en los espacios públicos de las localidades participantes, medida al cierre de la segunda campaña del proyecto (meta preliminar, a validar en el F02 contra la línea de base del ítem E, asumida en el orden del 40 %). Medio de verificación: censo de supervivencia con ficha georreferenciada por ejemplar, ejecutado por la dirección de espacios verdes de cada municipio con el protocolo común, auditado por muestreo por la unidad ejecutora y volcado a la base de datos pública del proyecto. Supuesto: los municipios e instituciones receptoras cumplen el acta de compromiso de riego y cuidado posterior y mantienen asignado el responsable del mantenimiento. · COMPONENTE · Resumen narrativo: plantines de especies forestales nativas producidos bajo protocolo, rustificados, de especie adecuada al sitio y entregados en época, en cantidad y calidad certificadas, a las campañas de las localidades participantes; y registro de supervivencia por sitio y por especie implementado y en uso. Indicador: el 90 % de los plantines entregados cumple la ficha de calidad de salida —especie, altura, relación parte aérea/raíz, rustificación y sanidad— y se entrega dentro de la ventana de plantación de su región ecológica, en cada campaña anual del proyecto (meta preliminar, a validar en el F02). Medio de verificación: remito de entrega con ficha de calidad firmada por el vivero y por el receptor, registro de lotes del vivero y acta de recepción de cada campaña, archivados en la unidad ejecutora y auditables. Supuesto: los viveros participantes mantienen la provisión de agua de riego y el personal capacitado durante todo el ciclo de producción. · ACTIVIDAD · Resumen narrativo: puesta en funcionamiento de la red provincial de producción calificada de plantines nativos en viveros existentes, con protocolo aprobado, listados de especies por región ecológica, programación de entregas por calendario ecológico, actas de compromiso de mantenimiento y sistema de registro de supervivencia. Indicador: seis viveros existentes de la provincia operando con el protocolo aprobado y cuatro localidades con acta de compromiso firmada, a los dieciocho meses de iniciado el proyecto (meta preliminar, a validar en el F02). Medio de verificación: protocolo aprobado por acto administrativo de la autoridad ambiental provincial; convenios y actas firmadas; informes trimestrales de avance y planillas de capacitación con firma de asistencia, en el legajo del proyecto. Supuesto: los municipios y organizaciones titulares de los viveros mantienen los convenios y no discontinúan la cesión de instalaciones ni el personal afectado.", "U": "Lógica vertical, narrada de abajo hacia arriba: si ponemos en funcionamiento la red de viveros existentes con un protocolo escrito de producción, rustificación y control de calidad, con listados de especies por región ecológica y entregas programadas según el calendario ecológico, entonces obtendremos plantines nativos certificados, de especie adecuada al sitio y entregados en época; si esos plantines llegan así a las campañas y los municipios cumplen el acta de compromiso de riego y cuidado posterior, entonces los plantines sobrevivirán en alta proporción los primeros doce meses; y si sobreviven, entonces la cobertura arbórea nativa lograda por cada campaña se aproximará a lo plantado, mejorarán la sombra y el confort térmico de los espacios públicos y se aprovechará la inversión pública y comunitaria. La cadena se sostiene sin saltos: entre cada nivel media un supuesto explícito y no una intuición. · Lógica horizontal, fila por fila. Actividad: el indicador cuenta viveros operando con protocolo y actas firmadas; el protocolo aprobado, los convenios y las planillas de capacitación son necesarios y suficientes para calcularlo, y ese conteo permite afirmar que la red está en funcionamiento. Componente: el indicador mide cumplimiento de ficha de calidad y entrega en ventana; el remito con ficha firmada y el acta de recepción alcanzan para computarlo y son la evidencia natural del producto. Propósito: el indicador es supervivencia a doce meses; el censo con ficha georreferenciada por ejemplar es necesario —hoy no existe y debe construirse— y suficiente, y la supervivencia es la medida directa del objetivo central. Fin: el indicador es la cantidad de ejemplares nativos vivos por hectárea de espacio público; el relevamiento de arbolado municipal con ficha común lo provee, aunque exige homogeneizar criterios entre municipios, y expresa razonablemente la contribución del proyecto sin atribuirle la totalidad del cambio. · Lógica zigzag: actividad más el supuesto de continuidad de convenios y cesión de instalaciones permite el componente; componente más el supuesto de cumplimiento del acta de mantenimiento por parte de los receptores permite el propósito; propósito más el supuesto de continuidad de las campañas municipales permite el fin. · Supuesto más frágil: el cumplimiento del acta de compromiso de riego y cuidado posterior por parte de los municipios e instituciones receptoras. Es frágil porque el análisis de causas mostró que ésa es precisamente una de las tres raíces del problema —la responsabilidad posterior no está asignada— y porque el proyecto no controla el presupuesto municipal de mantenimiento. El proyecto mitiga el riesgo con tres decisiones que sí están bajo su control: condicionar la entrega de los plantines a la firma del acta, verificar el cumplimiento mediante el censo de supervivencia y publicar los resultados por localidad, y priorizar en las campañas siguientes a las localidades que cumplieron. Aun así, el supuesto sigue siendo externo y debe monitorearse desde el primer año. · Un supuesto mal escrito sería «el equipo del proyecto capacita a los viveristas»: eso es una actividad bajo control del proyecto, no un factor externo.", "V": "Nombre del proyecto: «Producción calificada de plantines de especies forestales nativas para la reducción de la mortandad en las campañas de forestación de espacios públicos de las localidades de la provincia de Salta». · Qué se hace: producción calificada de plantines de especies forestales nativas, en red de viveros existentes y bajo protocolo. · Para qué: reducir la mortandad temprana de lo plantado en las campañas de forestación. · Dónde: espacios públicos de las localidades participantes de la provincia de Salta. · Es representativo de la alternativa seleccionada en el ítem R y de la componente de la EAP, y es distinto del nombre de fantasía del equipo del ítem A. Acompañará al equipo en los formularios F02, F03 y F04. · Error a controlar: si el equipo escribe aquí «Alta mortandad de plantines nativos» puso el nombre del problema; si escribe «Salta más verde» puso un nombre publicitario que no dice qué se va a hacer."}, "eap": {"fin": "Se contribuye a que los espacios públicos urbanos y periurbanos de las localidades participantes de la provincia de Salta incrementen su cobertura arbórea nativa y mejoren su confort térmico, aprovechando la inversión pública y comunitaria aplicada en cada campaña de forestación.", "prop": "Los plantines de especies forestales nativas plantados en las campañas de forestación de los espacios públicos de las localidades participantes sobreviven en alta proporción los primeros doce meses en el sitio definitivo.", "comp": "Plantines de especies forestales nativas producidos bajo protocolo, rustificados, de especie adecuada al sitio y entregados en época, en cantidad y calidad certificadas, a las campañas de las localidades participantes; registro de supervivencia por sitio y por especie implementado y en uso para la programación de las campañas siguientes.", "act": "Puesta en funcionamiento de la red provincial de producción calificada de plantines de especies forestales nativas en viveros existentes: selección de viveros, aprobación del protocolo de producción, rustificación y control de calidad de salida, capacitación del personal, mejoras de infraestructura de riego, elaboración de listados de especies por región ecológica, programación de entregas según el calendario ecológico, firma de convenios y actas de compromiso de mantenimiento e implementación del registro de supervivencia."}, "mml": {"fin": ["Contribuir a incrementar la cobertura arbórea nativa y mejorar el confort térmico de los espacios públicos urbanos y periurbanos de las localidades participantes de la provincia de Salta.", "Incremento del 20 % en la cantidad de ejemplares nativos vivos por hectárea de espacio público en las localidades participantes, a los 36 meses de iniciado el proyecto, respecto de la línea de base del año cero (meta preliminar, a validar en el F02).", "Relevamiento de arbolado de las direcciones de espacios verdes municipales con ficha común por sitio; informe anual consolidado por la unidad ejecutora y publicado en el portal de la autoridad ambiental provincial.", "Los municipios sostienen sus campañas anuales de forestación y no reducen la superficie de espacio público disponible para plantación."], "prop": ["Los plantines de especies forestales nativas plantados en las campañas de los espacios públicos de las localidades participantes sobreviven en alta proporción los primeros doce meses en el sitio definitivo.", "Supervivencia del 75 % de los plantines nativos a los 12 meses de plantados, en los espacios públicos de las localidades participantes, medida al cierre de la segunda campaña del proyecto (meta preliminar, a validar en el F02 contra la línea de base asumida en el orden del 40 % en el ítem E).", "Censo de supervivencia con ficha georreferenciada por ejemplar, ejecutado por la dirección de espacios verdes de cada municipio con protocolo común, auditado por muestreo por la unidad ejecutora y volcado a la base de datos pública del proyecto.", "Los municipios e instituciones receptoras cumplen el acta de compromiso de riego y cuidado posterior y mantienen asignado el responsable del mantenimiento."], "comp": ["Plantines de especies forestales nativas producidos bajo protocolo, rustificados, de especie adecuada al sitio y entregados en época, en cantidad y calidad certificadas, a las campañas de las localidades participantes; registro de supervivencia implementado y en uso.", "El 90 % de los plantines entregados cumple la ficha de calidad de salida (especie, altura, relación parte aérea/raíz, rustificación y sanidad) y se entrega dentro de la ventana de plantación de su región ecológica, en cada campaña anual del proyecto (meta preliminar, a validar en el F02).", "Remito de entrega con ficha de calidad firmada por el vivero y por el receptor, registro de lotes del vivero y acta de recepción de cada campaña, archivados en la unidad ejecutora y auditables.", "Los viveros participantes mantienen la provisión de agua de riego y el personal capacitado durante todo el ciclo de producción."], "act": ["Puesta en funcionamiento de la red provincial de producción calificada de plantines nativos en viveros existentes, con protocolo aprobado, listados de especies por región ecológica, programación de entregas por calendario ecológico, actas de compromiso de mantenimiento y sistema de registro de supervivencia.", "6 viveros existentes de la provincia operando con el protocolo aprobado y 4 localidades con acta de compromiso firmada, a los 18 meses de iniciado el proyecto (meta preliminar, a validar en el F02).", "Protocolo aprobado por acto administrativo de la autoridad ambiental provincial; convenios y actas firmadas; informes trimestrales de avance y planillas de capacitación con firma de asistencia, en el legajo del proyecto.", "Los municipios y organizaciones titulares de los viveros mantienen los convenios y no discontinúan la cesión de instalaciones ni el personal afectado."]}, "alt": [{"id": "A", "med": "Medio 2 y Medio 3: la tarea de riego y cuidado posterior está formalmente asignada y los participantes la incorporan a su rutina.", "act": "Programa de padrinazgo de árboles con vecinos, escuelas y organizaciones, con acta de compromiso por ejemplar, capacitación breve de padrinos y seguimiento a doce meses.", "ven": "Costo muy bajo; aprovecha la participación social que el escenario ya registra; ataca la raíz de la responsabilidad posterior; genera apropiación del espacio público y es replicable en varias localidades sin infraestructura nueva.", "des": "Depende de la continuidad de una voluntad social que hoy se agota el día del acto; no corrige el origen del problema —el plantín llega débil y fuera de época—; exige coordinación municipal permanente y su cobertura es despareja entre barrios con distinto tejido asociativo."}, {"id": "B", "med": "Medio 2: la tarea de riego, reposición y cuidado posterior está formalmente asignada a un organismo y a un responsable identificado.", "act": "Conformación de una cuadrilla municipal de mantenimiento post-plantación, con personal, camión cisterna y herramientas propias.", "ven": "Asegura el riego con independencia del voluntariado; profesionaliza la tarea; permite reposición sistemática y registro confiable de lo hecho.", "des": "Costo operativo permanente que el presupuesto de campaña hoy no cubre; requiere ampliar planta municipal y flota, poco viable en municipios pequeños; no corrige la calidad ni la época del plantín; y su sostenibilidad depende de cada gestión municipal."}, {"id": "C", "med": "Medios 1, 1.1, 1.2, 1.1.B, 4 y 5: plantines producidos con protocolo, entregados en época, con especie adecuada al sitio y distribución que contempla agua y logística.", "act": "Red provincial de producción calificada de plantines de especies forestales nativas en viveros existentes (municipales, escolares, de organizaciones y privados), operando bajo un protocolo común de producción, rustificación y control de calidad de salida, con listados de especies por región ecológica, programación de entregas según calendario ecológico, entrega condicionada a acta de compromiso de mantenimiento y registro de supervivencia por sitio y por especie.", "ven": "Ataca simultáneamente dos de las tres raíces detectadas —producción sin protocolo y programación por agenda institucional— y actúa sobre la tercera por vía contractual, al condicionar la entrega al compromiso de mantenimiento; usa capacidad instalada existente, con inversión moderada y distribuida; genera el registro de supervivencia que hoy no existe y sin el cual no se puede medir nada; se inscribe de lleno en el ámbito de actuación del escenario y ordena la demanda pública, lo que vuelve previsible la producción de nativas.", "des": "Requiere coordinación interinstitucional entre la provincia, varios municipios y titulares de viveros heterogéneos; el ciclo de producción hace que los primeros resultados de supervivencia recién se midan en la segunda campaña; su efecto sobre el propósito depende de que los receptores cumplan el acta de mantenimiento, que es el supuesto más frágil de la matriz."}, {"id": "D", "med": "Medio 1.1: los viveros producen plantines nativos con protocolo escrito, rustificación y control de calidad de salida.", "act": "Construcción y puesta en marcha de un vivero provincial nuevo de gran escala, centralizado, destinado a abastecer de nativas a todas las localidades de la provincia.", "ven": "Máximo control sobre el protocolo y la calidad de salida; capacidad instalada propia y permanente; escala suficiente para atender una demanda creciente y para conservar germoplasma.", "des": "Inversión inicial y costo fijo elevados; plazo de maduración de dos a tres campañas antes de producir en régimen; concentra la producción en un punto de una provincia con regiones ecológicas y logística muy dispares, lo que agrava el problema de traslado y de adecuación regional de especies; puede leerse como competencia desleal por los viveros privados; y es la alternativa que el análisis del problema advirtió no elegir de antemano."}, {"id": "E", "med": "Medios 1.2 y 1.1.B: campañas programadas según el calendario ecológico y planificadas con la información de supervivencia de las campañas anteriores.", "act": "Sistema provincial de programación de campañas y registro de supervivencia por sitio y por especie, con plataforma de carga y ficha común para los municipios.", "ven": "Costo bajo; corrige la época de plantación y produce la información que hoy no existe; habilita la comparación entre localidades y el aprendizaje entre campañas.", "des": "Por sí solo no mejora la calidad del plantín ni asegura el riego posterior: mediría mejor un problema que seguiría ocurriendo; requiere acuerdos intermunicipales de carga de datos y sostenimiento de la plataforma."}, {"id": "F", "med": "Medio 1.1.A: la normativa y los programas fijan estándares verificables de calidad del plantín y obligaciones de mantenimiento con responsable identificado.", "act": "Elaboración y gestión de sanción de un estándar técnico provincial de calidad de plantín nativo y de mantenimiento post-plantación, con adhesión municipal por ordenanza.", "ven": "Efecto sistémico y permanente sobre todas las campañas de la provincia; costo directo bajo; ordena el mercado y da respaldo jurídico a la exigencia de calidad.", "des": "El plazo y el resultado dependen de decisiones legislativas y reglamentarias fuera del control del proyecto; no produce un solo plantín ni riega ninguno; sin capacidad instalada que lo cumpla, el estándar queda sin aplicación."}], "altSel": "C", "altJus": "Se seleccionó la Estrategia II con la actividad C. Los criterios de comparación fueron cinco: cobertura de las raíces detectadas en el árbol de problemas, pertinencia respecto del ámbito de actuación declarado, relación entre inversión requerida y capacidad instalada disponible, sostenibilidad más allá de una gestión y factibilidad de medición del resultado. · Cobertura de raíces: la alternativa C ataca directamente dos de las tres raíces primarias —producción sin protocolo escrito
