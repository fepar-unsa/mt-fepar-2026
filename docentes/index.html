ino, lo que provoca que la demanda no esté calculada por sector ni por uso pese al inventario exhaustivo de artefactos, lo que provoca que la instalación sanitaria se resuelva con una sola cisterna y una sola red bajo el criterio de que toda el agua debe ser potable.\n\nEn paralelo, por la rama de contexto: el régimen marcadamente estacional del sitio encarece almacenar entre estaciones y el marco normativo se satisface conduciendo el pluvial fuera del predio, lo que provoca que la infraestructura pluvial se resuelva íntegramente para evacuar, sin ningún punto de retención, y refuerza la decisión de una única red.\n\nPor la tercera rama: la ausencia de un puesto responsable del desempeño hídrico, la falta de personal cuantificado y formado y la invisibilidad del costo del agua provocan que los usos sustituibles —riego, limpieza, lavado de blancos, purga de piscina— se operen sin protocolo ni criterio de reposición.\n\nTronco. Esas tres ramas convergen en el problema central: el establecimiento resuelve toda su demanda con una única fuente y una única calidad, destina agua potable de un pozo sobre un acuífero con depresión regional a usos que no la requieren y conduce fuera del predio, por diseño, la totalidad de la lluvia que cae sobre sus 13.045,03 m².\n\nRamas. Ese estado provoca, hacia arriba, que el establecimiento pague permanentemente el bombeo y la conducción de un volumen evitable y desplace el pozo hacia escalones donde la eficiencia cae del 68 % al 44 %; que el riego y el baldeo se cubran con agua de pozo justo en los cinco meses secos de menor recarga; que una fracción evitable de la extracción se sume a la extracción agregada sobre un acuífero que ya tiene depresión regional; que la concesión se tramite por un caudal mayor que el necesario y sin cálculo que lo respalde; y que el desempeño hídrico no pueda acreditarse ante la certificación voluntaria ni ante el mercado. Los efectos sobre el acuífero y sobre la concesión provocan, a su vez, que la seguridad de abastecimiento del propio establecimiento y la de los demás usuarios del sector queden atadas a un recurso en descenso.\n\nAdvertencia de método. En esta instancia el árbol es un conjunto de hipótesis de trabajo. Tres de sus nudos descansan en supuestos que deben ponerse a prueba en el F02: que la fracción sustituible sea del orden del 19 % de la demanda, que la superficie de captación de cubierta sea la que resulta del FOS y no los 9.650 m² de superficie cubierta, y que la estructura de operación futura no prevea por sí sola un responsable del agua.", "N": "Los medios son las causas en positivo, con la misma estructura jerárquica y el mismo número de niveles. Se escriben como estados alcanzados, no como acciones: no «mejorar la medición» sino «consumo medido por sector».\n\nMedio 1 (de la causa 1) — La instalación sanitaria del establecimiento distribuye dos calidades de agua por redes separadas y señalizadas: la potable del pozo hacia duchas, lavabos, cocina y lavandería, y la de lluvia tratada hacia descargas de inodoro, riego y limpieza. Dentro del alcance del proyecto.\n· Medio 1.1 (de la causa 1.1) — Demanda de agua calculada por sector y por uso, con la fracción sustituible identificada y con ese cálculo respaldando el dimensionamiento de reservas y el caudal solicitado en la concesión. Dentro del alcance.\n·· Medio 1.1.A (de la causa 1.1.A) — Consumo de agua medido de manera desagregada —macromedición en el pozo, submedición de cocina, lavandería, riego, piscina y habitaciones, registro de horas de bomba— con serie mensual comparable con la ocupación. Dentro del alcance.\n··· Medio 1.1.A.1 (de la causa 1.1.A.1) — Costo del agua conocido por metro cúbico e imputado a cada sector, incluyendo energía de bombeo, conducción, tratamiento y mantenimiento. Dentro del alcance, como producto de gestión.\n··· Medio 1.1.A.2 (de la causa 1.1.A.2) — Responsabilidad sobre el desempeño hídrico asignada por escrito a un puesto de la estructura de operación, con metas, tablero y reporte a la dirección. Dentro del alcance, con la salvedad de que su permanencia después de la inauguración depende de la organización que opere el hotel.\n···· Medio 1.1.A.1.a (de la causa 1.1.A.1.a) — Provisión independiente administrada por el propietario con medición, registro y estándar de uso propios, declarados periódicamente ante la autoridad provincial de recursos hídricos. Fuera del alcance en su parte estructural: el proyecto no puede extender el radio servido por la prestadora ni crear un tercero que facture. Lo que sí puede es que el establecimiento se autoimponga el estándar que nadie le impone, y ese es exactamente el contenido del medio 1.1.A.\n· Medio 1.2 (de la causa 1.2) — Volumen de reserva dimensionado para el régimen estacional del sitio, que traslada agua de la estación húmeda a la seca y se destina prioritariamente a los usos de demanda continua, sin comprometer la cisterna de consumo diario. Dentro del alcance. Aclaración: el régimen de lluvias no se modifica —eso está fuera del alcance de cualquier proyecto—; lo que el proyecto modifica es la capacidad de trasladar agua entre estaciones.\n· Medio 1.3 (de la causa 1.3) — Aprovechamiento del agua de lluvia y diferenciación de fuentes por calidad de uso acreditados ante las autoridades municipal, ambiental y de recursos hídricos e incorporados a la documentación de habilitación. Parcialmente fuera del alcance: el proyecto no puede dictar la norma que hoy no existe, pero sí puede incorporar la exigencia a su propio expediente y ofrecer el caso como antecedente.\n\nMedio 2 (de la causa 2) — Infraestructura pluvial del predio que conduce el escurrimiento hacia puntos de retención antes de derivar el excedente al canal perimetral, con bajadas de cubierta llegando a un punto de captación propio, con desvío de primeras aguas y filtrado. Dentro del alcance, y ejecutable a costo marginal mientras la obra de movimiento de suelos y calzadas no esté hecha.\n\nMedio 3 (de la causa 3) — Usos cubiertos con agua no potable operados con protocolo escrito y criterio de reposición: riego programado por balance hídrico y con corte por lluvia, y limpieza de grandes superficies, lavado de blancos y purga de piscina con frecuencia, volumen previsto y registro. Dentro del alcance.\n· Medio 3.1 — Coincide con el medio 1.1.A.2.\n· Medio 3.2 (de la causa 3.2) — Personal de operación cuantificado y formado para convivir con dos redes de distinta calidad, puntos de agua no potable señalizados de manera inequívoca y huésped informado por los canales que el establecimiento ya tiene instalados. Dentro del alcance en cuanto al diseño, el material y la primera capacitación; su repetición anual depende de la operación.\n· Medio 3.3 — Coincide con el medio 1.1.A.1.\n\nLimitaciones declaradas del equipo y del proyecto: no se modifica el régimen de precipitación, no se modifica el estado del acuífero por acción de un solo establecimiento, no se dicta normativa municipal ni provincial y no se garantiza la conducta de la organización que opere el hotel una vez inaugurado. Los tres primeros son contexto; el cuarto es el supuesto más frágil de la matriz y por eso el proyecto invierte en dejarlo lo más atado posible —puesto asignado, protocolo escrito, señalización física y tablero— antes de la inauguración.", "O": "Los fines son los efectos expresados como situaciones deseadas, conservando el mismo encadenamiento. Hay seis, uno por efecto, sin agregados.\n\nFin 1 (del efecto 1) — El establecimiento evita el bombeo y la conducción desde el pozo del volumen sustituido y opera la perforación en escalones de caudal bajos, donde la eficiencia se mantiene en el orden del 68 % y el costo energético del metro cúbico es el menor de la curva del ensayo.\n\nFin 2 (del efecto 2) — El riego de los espacios verdes y el baldeo de las playas y calles internas se cubren durante la estación seca con la reserva de agua de lluvia acumulada en la estación húmeda, y no con extracción del pozo en el período de menor recarga.\n\nFin 3 (del efecto 3) — El volumen que el establecimiento extrae del pozo se limita a los usos que efectivamente requieren calidad potable, y su aporte a la extracción agregada sobre el acuífero de abanico aluvial disminuye en la medida de la fracción sustituida.\n\nFin 4 (del efecto 4, deriva de los fines 3 y 5) — La seguridad de abastecimiento del establecimiento y la de los demás usuarios de perforaciones del sector mejora, porque cada metro cúbico de lluvia aprovechado es demanda que deja de ejercerse sobre el mismo recurso en un sector en fuerte expansión.\n\nFin 5 (del efecto 5) — El pedido de concesión de agua subterránea se sostiene sobre una demanda calculada por uso y ya descontada de la fracción que cubre el agua de lluvia, de modo que el caudal solicitado y el consumo efectivo son consistentes entre sí.\n\nFin 6 (del efecto 6) — El desempeño hídrico del establecimiento se acredita ante la certificación voluntaria de hotelería sustentable y ante huéspedes, operadores turísticos y organizadores de eventos, con medición propia y con una fracción declarada y verificable de la demanda cubierta con agua de lluvia.\n\nLos fines 3 y 4 son los más altos del árbol y son los que alimentan el nivel de Fin de la EAP y de la MML: la moderación de la presión de extracción sobre un acuífero con depresión regional y la seguridad de abastecimiento en un sector en expansión. Los fines 1, 5 y 6 son los que sostienen el interés del titular y, por lo tanto, la viabilidad de la decisión de inversión: conviene tenerlos a la vista al escribir el ítem R.", "P": "Problema central: El establecimiento hotelero proyectado en el piedemonte del departamento Capital, a 7,5 km del centro, resuelve toda su demanda de agua con una única fuente y una única calidad, de modo que desde su puesta en operación destinará agua de calidad potable extraída de un pozo sobre un acuífero con depresión regional a usos que no requieren esa calidad —descarga de inodoros, riego, limpieza y lavado—, mientras la totalidad de la lluvia que cae sobre los 13.045,03 m² del predio se conduce fuera por diseño.\n\nObjetivo central, propósito o meta: El establecimiento hotelero proyectado en el piedemonte del departamento Capital, a 7,5 km del centro, resuelve su demanda de agua con fuentes y calidades diferenciadas según el uso, de modo que desde su puesta en operación cubre con agua de lluvia captada en el propio predio los usos que no requieren calidad potable —descarga de inodoros, riego, limpieza y lavado— y reserva el agua del pozo para los usos que sí la exigen.\n\nControl de la transformación: se conserva el mismo sujeto —el establecimiento hotelero proyectado—, el mismo lugar —el piedemonte del departamento Capital, a 7,5 km del centro—, el mismo momento —desde la puesta en operación— y la misma variable —el destino del agua según la calidad que cada uso requiere—. Sólo cambia el signo. No se amplió el alcance al acuífero ni al sector: eso pertenece al nivel de Fin. No se lo redujo a una obra: el propósito no dice «cisterna construida», dice qué estado alcanza el establecimiento, y esa formulación deja abiertas todas las alternativas del ítem R, incluida la reducción de demanda y el reúso de aguas grises.\n\nEl indicador de este propósito es el mismo del ítem E, con el signo invertido: la fracción de la demanda de usos que no requieren calidad potable cubierta con agua de lluvia captada en el predio, que pasa de 0 % en la situación sin proyecto a la meta que fija la matriz.", "Q": "El árbol de objetivos conserva exactamente la estructura del árbol de problemas: dieciocho tarjetas, medios abajo, meta en el tronco, fines arriba, sin ramas de más ni de menos.\n\nLectura de abajo hacia arriba. Un establecimiento que administra su propia provisión asume el estándar de medición que nadie le impone, lo que permite conocer el costo del metro cúbico e imputarlo por sector y contar con un responsable del desempeño hídrico; eso permite medir el consumo de manera desagregada y construir la serie; con esa serie la demanda queda calculada por sector y por uso y la fracción sustituible identificada; con ese cálculo la instalación se resuelve con dos redes separadas y señalizadas y con un volumen de reserva dimensionado para el régimen estacional del sitio. En paralelo, la infraestructura pluvial conduce el escurrimiento hacia puntos de retención en lugar de expulsarlo, y los usos sustituibles se operan con protocolo escrito, con personal formado y con señalización inequívoca. Todo ello permite que el establecimiento resuelva su demanda con fuentes y calidades diferenciadas según el uso, lo que a su vez permite evitar el bombeo del volumen sustituido y operar el pozo en su escalón eficiente, cubrir el riego de la estación seca con la reserva acumulada en la húmeda, limitar la extracción a los usos que requieren calidad potable, sostener el pedido de concesión sobre una demanda calculada y acreditar el desempeño hídrico ante la certificación y el mercado; y de esos dos últimos se sigue una mayor seguridad de abastecimiento para el propio establecimiento y para los demás usuarios de perforaciones del sector.\n\nMedios sobre los que el proyecto puede actuar, marcados visualmente en el diagrama: 1, 1.1, 1.1.A, 1.1.A.1, 1.1.A.2, 1.2, 2, 3 y 3.2. Medios fuera del alcance o sólo parcialmente alcanzables, marcados con trama distinta: 1.1.A.1.a —extensión del radio servido por la prestadora o creación de un tercero que facture— y 1.3 —dictado de normativa que exija aprovechamiento pluvial y diferenciación por calidad de uso—. Ese marcado no es decorativo: es lo que después separa los componentes de la matriz de los supuestos.\n\nVerificación de simetría exigida por la Guía: cada nodo del árbol de objetivos tiene su contraparte en el de problemas y viceversa. Antes de dar por cerrado este ítem se volvió sobre el M, porque una definición incorrecta del árbol de problemas determina inevitablemente una definición incorrecta del de objetivos.", "R": "Las estrategias salen de los medios más bajos del árbol de objetivos. Se plantean tres, y dentro de la primera las actividades son mutuamente excluyentes entre sí.\n\nEstrategia I — Fuente y calidad del agua. Medios 1, 1.2 y 2: instalación que distribuye dos calidades por redes separadas, reserva dimensionada para el régimen estacional e infraestructura pluvial con puntos de retención. Actividades posibles, mutuamente excluyentes:\n· A. Reducción de la demanda sin nueva fuente: artefactos de máxima eficiencia por sobre los ya previstos —inodoros 4/2 L, duchas nebulizadoras de 4 a 5 L/min, aireadores— más protocolos de reúso de blancos, lavado a carga completa y riego por balance hídrico.\n· B. Aprovechamiento pluvial restringido a usos exteriores: cisterna enterrada en el punto bajo al que ya converge el escurrimiento, alimentada por superficies exteriores y por la cubierta del basamento, conectada a la red de riego y a los puntos de baldeo. Sin segunda red interna.\n· C. Aprovechamiento pluvial de cubiertas con red interna separada de agua no potable: captación en las cubiertas, desvío de primeras aguas, filtrado, reserva y una segunda red que alimenta las descargas de inodoro de las 109 habitaciones y de los baños comunes, más riego y baldeo.\n· D. Reúso de aguas grises: tratamiento de los efluentes de duchas y lavabos y su derivación a las descargas de inodoro, con fuente disponible todo el año y sin desfasaje estacional.\n\nEstrategia II — Información y medición. Medios 1.1, 1.1.A y 1.1.A.1: demanda calculada por sector y por uso, consumo medido de manera desagregada y costo del metro cúbico imputado. Actividades: macromedición en el pozo y submedición por sector con registro mensual; tablero de consumo específico por pernoctación; estudio de demanda por artefacto contrastado con la medición durante el primer año.\n\nEstrategia III — Operación y personas. Medios 3, 3.2 y 1.1.A.2: usos sustituibles operados con protocolo, personal formado, señalización inequívoca y responsable del desempeño hídrico designado. Actividades: manual de operación y mantenimiento del sistema de agua; plan de capacitación inicial y anual; señalización normalizada de los puntos de agua no potable; designación por escrito del puesto responsable con metas y reporte.\n\nActividades descartadas por estar fuera del alcance, con su criterio: gestionar la extensión del radio servido por la prestadora —excede al titular y depende de un plan de expansión de servicios—; promover una ordenanza que exija aprovechamiento pluvial en el municipio —es incidencia normativa, no proyecto de inversión de un establecimiento, aunque el caso puede ofrecerse como antecedente—; y cualquier actividad de manejo del acuífero a escala regional, que corresponde a la autoridad de recursos hídricos.\n\nSelección. Se selecciona la Estrategia I, actividad C, integrada con las estrategias II y III, y esa integración es lo que en el ítem de alternativas se identifica como opción E. La integración no mezcla actividades mutuamente excluyentes: las estrategias II y III no son otras maneras de conseguir el mismo medio, son capas complementarias sin las cuales la actividad C no rinde lo previsto. El propio caso lo dice con todas las letras: un sistema construido no rinde por sí solo. La actividad A no se descarta, se absorbe como paso previo, porque conviene reducir la demanda antes de dimensionar la reserva —cada litro que no se consume es un litro que no hay que almacenar— y porque el ahorro por artefacto es más barato por metro cúbico que el ahorro por captación; pero por sí sola no resuelve el problema central, ya que deja intacta la calidad del agua destinada a usos que no la requieren.\n\nMomento de ejecución, que es la decisión más determinante de todo el proyecto: la actividad se incorpora al proyecto ejecutivo y se ejecuta dentro de la primera de las tres etapas de ocho meses de la obra. La segunda red, las bajadas de cubierta, el desvío de primeras aguas y el volumen de reserva enterrado cuestan una fracción si se ejecutan con las instalaciones abiertas y el suelo movido, y cuestan un múltiplo si se ejecutan sobre un edificio terminado y en operación. Esa ventana es un activo del caso y se agota sola.", "S": "Estructura Analítica del Proyecto, en sus cuatro niveles jerárquicos.\n\nFIN — Menor presión de extracción sobre el acuífero de abanico aluvial que abastece al sector suburbano en expansión del departamento Capital, y mayor seguridad de abastecimiento para el establecimiento y para los demás usuarios de perforaciones del sector, con la operación del pozo sostenida en su escalón de mayor eficiencia. Proviene de los fines 3, 4 y 1 del árbol de objetivos.\n\nPROPÓSITO — El establecimiento hotelero proyectado en el piedemonte del departamento Capital, a 7,5 km del centro, resuelve su demanda de agua con fuentes y calidades diferenciadas según el uso, de modo que desde su puesta en operación cubre con agua de lluvia captada en el propio predio los usos que no requieren calidad potable —descarga de inodoros, riego, limpieza y lavado— y reserva el agua del pozo para los usos que sí la exigen. Es el ítem P sin modificaciones.\n\nCOMPONENTES — Se enuncian como productos obtenidos, no como acciones.\n· Componente 1: Sistema de captación, tratamiento y reserva de agua de lluvia en servicio, con captación en cubiertas, desvío de primeras aguas, filtrado, reserva dimensionada para el régimen estacional del sitio y puntos de retención del escurrimiento exterior.\n· Componente 2: Red interna de agua no potable ejecutada, separada, señalizada y ensayada contra conexiones cruzadas, alimentando las descargas de inodoro de las 109 habitaciones y de los baños comunes, los puntos de riego y los puntos de baldeo.\n· Componente 3: Sistema de medición y registro del agua implantado, con macromedición en el pozo, submedición por sector, registro de horas de bomba y tablero de consumo específico por pernoctación.\n· Componente 4: Capacidad de operación instalada, con manual de operación y mantenimiento aplicado, personal formado, señalización en uso y responsabilidad sobre el desempeño hídrico asignada por escrito a un puesto de la estructura.\n\nACTIVIDAD — El proyecto de inversión a desarrollar, cuyo resultado son las componentes: incorporación al proyecto ejecutivo y ejecución, dentro de la primera etapa de la obra, de un sistema de aprovechamiento de agua de lluvia con red interna de agua no potable, medición desagregada y capacidad de operación instalada. Comprende: estudio de demanda por sector y fracción sustituible; dimensionamiento de superficie de captación y volumen de reserva con balance mensual; adecuación del proyecto ejecutivo de instalaciones sanitarias y de pluviales; provisión y montaje de captación, filtrado, reserva, bombeo y segunda red; instalación de medidores; ensayos de estanqueidad y de ausencia de conexiones cruzadas; elaboración del manual de operación y mantenimiento; señalización; capacitación inicial del personal; y designación del puesto responsable con su tablero.\n\nControl del error típico: ninguna componente está escrita como acción. No dice «capacitar al personal» sino «capacidad de operación instalada»; no dice «medir el agua» sino «sistema de medición y registro implantado». Las acciones están todas en el nivel de actividad, que es donde corresponden.", "T": "Matriz de Marco Lógico, en texto legible, en plena concordancia con la EAP.\n\nFIN. Resumen narrativo: contribuir a moderar la presión de extracción sobre el acuífero de abanico aluvial que abastece al sector suburbano en expansión del departamento Capital y a sostener la seguridad de abastecimiento del establecimiento y de los demás usuarios de perforaciones del sector. Indicador: el consumo específico del establecimiento no supera los 435 L de agua subterránea por pernoctación en el tercer año calendario completo de operación, contra los 500 L por pernoctación que resultan de la demanda proyectada sin proyecto, y el volumen anual declarado ante la autoridad provincial de recursos hídricos se mantiene por debajo del caudal concesionado en cada uno de esos tres años; ambos valores deben recalcularse en el F02 sobre la demanda relevada, porque descansan en los supuestos S1 a S3 del ítem E. Medio de verificación: declaración jurada anual de extracción presentada ante la autoridad provincial de recursos hídricos, registro de la macromedición del pozo y planilla mensual de ocupación de la administración del establecimiento, archivados en el legajo hídrico del establecimiento. Supuesto: la autoridad provincial de recursos hídricos otorga la concesión y sostiene el control de las extracciones del sector; el resto de los usuarios del acuífero no incrementa su extracción a un ritmo que anule el efecto agregado.\n\nPROPÓSITO. Resumen narrativo: el establecimiento resuelve su demanda de agua con fuentes y calidades diferenciadas según el uso, cubriendo con agua de lluvia captada en el predio los usos que no requieren calidad potable y reservando el agua del pozo para los que sí la exigen. Indicador: el 70 % del volumen anual destinado a usos que no requieren calidad potable —descarga de inodoros, riego y baldeo—, esto es unos 2.860 de los 4.100 m³/año estimados, se cubre con agua de lluvia captada en el predio, en el establecimiento, durante el tercer año calendario completo de operación; valor en situación sin proyecto: 0 %. Medio de verificación: caudalímetro totalizador de la red de agua no potable y submedición por sector, con lectura mensual asentada en la planilla de seguimiento hídrico y consolidada en el informe anual del responsable del desempeño hídrico. Supuesto: la precipitación del período se mantiene dentro del rango de la serie 1991–2020 y la ocupación del establecimiento alcanza los niveles previstos en su plan de negocios; ninguna de las dos cosas está bajo control del proyecto.\n\nCOMPONENTES. Resumen narrativo: sistema de captación, tratamiento y reserva en servicio; red interna de agua no potable ejecutada, señalizada y ensayada; sistema de medición y registro implantado; capacidad de operación instalada. Indicador: al momento de la habilitación del establecimiento, el 100 % de los inodoros de las 109 habitaciones y de los 22 baños comunes y el 100 % de los puntos de riego y de baldeo están conectados a la red de agua no potable; la reserva de agua de lluvia está ejecutada por el volumen que determine el dimensionamiento aprobado en el F02 —del orden de 200 m³ según la estimación preliminar—; hay medidores instalados en el pozo y en los cinco sectores definidos; y el manual de operación está aprobado, el personal de operación capacitado y el puesto responsable designado por escrito. Medio de verificación: acta de recepción de obra de las instalaciones sanitarias y pluviales con planos conforme a obra; protocolo de ensayo de estanqueidad y de ausencia de conexiones cruzadas firmado por la dirección de obra; certificado de calibración de los medidores; y legajo con el manual aprobado, las planillas de asistencia a la capacitación y la designación del responsable. Supuesto: el cronograma general de obra no sufre alteraciones que obliguen a reprogramar la primera etapa, y la autoridad municipal y sanitaria admite la red separada de agua no potable con la señalización y los ensayos propuestos.\n\nACTIVIDAD. Resumen narrativo: incorporación al proyecto ejecutivo y ejecución, dentro de la primera etapa de ocho meses de la obra, del sistema de aprovechamiento de agua de lluvia con red de agua no potable, medición desagregada y capacidad de operación instalada. Indicador: el estudio de demanda, el balance mensual de dimensionamiento y la adecuación del proyecto ejecutivo de instalaciones sanitarias y pluviales están aprobados por la dirección de obra dentro de los primeros cuatro meses de la primera etapa, y el 100 % de la partida presupuestaria del componente está comprometida antes del cierre de esa etapa. Medio de verificación: expediente técnico del proyecto ejecutivo con la memoria de cálculo y sus supuestos numerados, actas de la dirección de obra y estado de ejecución presupuestaria del contrato. Supuesto: el titular del emprendimiento mantiene la disponibilidad financiera prevista y los proveedores de equipos de filtrado, medición y bombeo cumplen los plazos de entrega en el mercado local.\n\nNota sobre los supuestos: ninguno de los cuatro es una tarea del proyecto. No figura como supuesto «se firma el contrato», «se capacita al personal» ni «se instalan los medidores», porque son actividades planificadas y presupuestadas dentro de la matriz.", "U": "Lógica vertical, narrada de abajo hacia arriba. Si incorporamos al proyecto ejecutivo y ejecutamos dentro de la primera etapa de obra el sistema de captación, la segunda red, los medidores y el paquete de operación, entonces el establecimiento tendrá en servicio un sistema de agua de lluvia, una red de agua no potable señalizada y ensayada, medición desagregada por sector y personal formado con un responsable designado. Si esas cuatro componentes están, entonces el establecimiento podrá resolver su demanda con fuentes y calidades diferenciadas y cubrir con lluvia los usos que no requieren calidad potable. Y si eso ocurre, entonces se extraerá del acuífero sólo el agua que los usos potables exigen, el pozo trabajará más tiempo en su escalón eficiente, y el establecimiento y los demás usuarios de perforaciones del sector verán aliviada, en la medida de esa fracción, la presión sobre un recurso que ya tiene depresión regional. La cadena se sostiene, con una condición explícita: el salto de componentes a propósito no lo dan los caños, lo dan los caños más los procedimientos. Por eso las componentes 3 y 4 no son accesorias — sin medición no hay indicador de propósito, y sin protocolo ni responsable el riego vuelve a programarse por calendario y el ahorro se evapora después de la inauguración.\n\nLógica horizontal, fila por fila. Fin: el indicador es el consumo específico por pernoctación y el cumplimiento del caudal concesionado; los medios de verificación —declaración anual ante la autoridad de recursos hídricos, macromedición del pozo y planilla de ocupación— son necesarios y suficientes, porque el cociente requiere exactamente esos dos términos, y ambos registros son construibles por el propio proyecto. Propósito: el indicador es la fracción de la demanda no potable cubierta con lluvia; exige conocer numerador y denominador, y por eso los medios de verificación son el totalizador de la red de agua no potable y la submedición por sector, que la componente 3 instala. Aquí está el punto más delicado de toda la matriz: el indicador del propósito no puede calcularse si la componente 3 no se ejecuta, de modo que un recorte presupuestario que sacrifique los medidores no sólo empeora la operación, deja el proyecto sin forma de demostrar que funcionó. Componentes: los indicadores son de ejecución física y verificables por acta de recepción, protocolo de ensayo y legajo, todos documentos que la obra genera de todos modos. Actividad: el indicador es de avance documental y presupuestario, verificable en el expediente técnico y en el estado de ejecución del contrato.\n\nLógica zigzag. Actividad más su supuesto —disponibilidad financiera y cumplimiento de proveedores— permite alcanzar las componentes. Componentes más su supuesto —cronograma de obra sin reprogramación de la primera etapa y aprobación municipal y sanitaria de la red separada— permiten alcanzar el propósito. Propósito más su supuesto —régimen de lluvias dentro del rango de la serie y ocupación conforme al plan de negocios— permite alcanzar el fin. Fin más su supuesto —control de las extracciones del sector por la autoridad y no crecimiento descontrolado del resto de los usuarios— permite sostener la contribución en el tiempo.\n\nEl supuesto más frágil. No es el climático: la serie 1991–2020 es larga, el desvío de un año se compensa con la reserva y el proyecto está dimensionado sobre un valor conservador. Tampoco es el financiero, porque la partida es marginal dentro de una obra de 24 meses. El supuesto más frágil es el que la matriz sólo puede enunciar y no controlar: que la organización que opere el hotel —que puede no ser la misma que hoy proyecta, porque la operación hotelera suele darse en gestión— mantenga vigente el puesto responsable del desempeño hídrico, la rutina de mantenimiento de filtros y canaletas y la lectura mensual de los medidores. Todo el rendimiento del sistema se juega ahí. El proyecto hace lo único que puede hacer al respecto: dejar la responsabilidad asignada por escrito antes de la inauguración, dejar el manual aprobado y el personal capacitado, dejar la señalización física instalada —que es la barrera que no depende de que alguien se acuerde— y dejar el compromiso de medición incorporado a las obligaciones de la concesión ante la autoridad provincial, que es un tercero con capacidad de exigirlo. Un segundo supuesto casi tan frágil, propio de este caso: que la autoridad municipal y sanitaria admita la red interna de agua no potable en un edificio de uso público. Conviene consultarlo antes del F02, porque una respuesta negativa desplazaría el proyecto hacia la alternativa restringida a usos exteriores.", "V": "Nombre del proyecto: «Sistema de aprovechamiento de agua de lluvia y red de agua no potable para la sustitución de agua subterránea en usos que no requieren calidad potable, en un establecimiento hotelero del piedemonte del departamento Capital, Salta».\n\nEstá construido con las tres piezas que pide la Guía: qué se hace —sistema de aprovechamiento de agua de lluvia y red de agua no potable—, para qué —sustituir agua subterránea en los usos que no requieren calidad potable—, y dónde —un establecimiento hotelero del piedemonte del departamento Capital—. Es representativo de la alternativa seleccionada y no del problema, y no es un nombre publicitario: dice qué se va a construir y con qué finalidad.\n\nVersión corta de uso interno, para el F02, el F03 y el F04: «Proyecto Dos Aguas — aprovechamiento pluvial y red de agua no potable en establecimiento hotelero del piedemonte».\n\nNo debe confundirse con el nombre de fantasía del equipo del ítem A: aquél identifica a la consultora que formula, éste identifica al proyecto de inversión formulado, y acompañará al equipo en los formularios siguientes."}, "eap": {"fin": "Menor presión de extracción sobre el acuífero de abanico aluvial que abastece al sector suburbano en expansión del departamento Capital, y mayor seguridad de abastecimiento para el establecimiento y para los demás usuarios de perforaciones del sector, con la operación del pozo sostenida en su escalón de mayor eficiencia.", "prop": "El establecimiento hotelero proyectado en el piedemonte del departamento Capital, a 7,5 km del centro, resuelve su demanda de agua con fuentes y calidades diferenciadas según el uso, de modo que desde su puesta en operación cubre con agua de lluvia captada en el propio predio los usos que no requieren calidad potable —descarga de inodoros, riego, limpieza y lavado— y reserva el agua del pozo para los usos que sí la exigen.", "comp": "Cuatro productos obtenidos: sistema de captación, tratamiento y reserva de agua de lluvia en servicio, con desvío de primeras aguas, filtrado, reserva dimensionada para el régimen estacional del sitio y puntos de retención del escurrimiento exterior; red interna de agua no potable ejecutada, separada, señalizada y ensayada contra conexiones cruzadas, alimentando las descargas de inodoro de las 109 habitaciones y de los 22 baños comunes, los puntos de riego y los puntos de baldeo; sistema de medición y registro del agua implantado, con macromedición en el pozo, submedición por sector, registro de horas de bomba y tablero de consumo específico por pernoctación; y capacidad de operación instalada, con manual de operación y mantenimiento aplicado, personal formado, señalización en uso y responsabilidad sobre el desempeño hídrico asignada por escrito a un puesto de la estructura.", "act": "Incorporación al proyecto ejecutivo y ejecución, dentro de la primera de las tres etapas de ocho meses de la obra, del sistema de aprovechamiento de agua de lluvia con red interna de agua no potable, medición desagregada y capacidad de operación instalada: estudio de demanda por sector y fracción sustituible; dimensionamiento de superficie de captación y volumen de reserva con balance mensual sobre la serie 1991–2020; adecuación del proyecto ejecutivo de instalaciones sanitarias y de pluviales; provisión y montaje de captación, desvío de primeras aguas, filtrado, reserva, bombeo y segunda red; instalación y calibración de medidores; ensayos de estanqueidad y de ausencia de conexiones cruzadas; elaboración del manual de operación y mantenimiento; señalización normalizada; capacitación inicial del personal; y designación por escrito del puesto responsable del desempeño hídrico con su tablero de seguimiento."}, "mml": {"fin": ["Contribuir a moderar la presión de extracción sobre el acuífero de abanico aluvial que abastece al sector suburbano en expansión del departamento Capital y a sostener la seguridad de abastecimiento del establecimiento y de los demás usuarios de perforaciones del sector, con la operación del pozo sostenida en su escalón de mayor eficiencia.", "El consumo específico del establecimiento no supera los 435 L de agua subterránea por pernoctación en el tercer año calendario completo de operación, contra los 500 L por pernoctación de la demanda proyectada sin proyecto, y el volumen anual declarado ante la autoridad provincial de recursos hídricos se mantiene por debajo del caudal concesionado en cada uno de los tres primeros años. Ambos valores descansan en los supuestos S1 a S3 del ítem E y deben recalcularse en el F02 sobre la demanda relevada.", "Declaración jurada anual de extracción presentada ante la autoridad provincial de recursos hídricos, registro mensual de la macromedición del pozo y planilla de ocupación de la administración del establecimiento, archivados en el legajo hídrico del establecimiento y disponibles para la auditoría de la certificación voluntaria.", "La autoridad provincial de recursos hídricos otorga la concesión y sostiene el control de las extracciones del sector; el resto de los usuarios del acuífero no incrementa su extracción a un ritmo que anule el efecto agregado de la sustitución."], "prop": ["El establecimiento hotelero proyectado en el piedemonte del departamento Capital, a 7,5 km del centro, resuelve su demanda de agua con fuentes y calidades diferenciadas según el uso, de modo que desde su puesta en operación cubre con agua de lluvia captada en el propio predio los usos que no requieren calidad potable y reserva el agua del pozo para los usos que sí la exigen.", "El 70 % del volumen anual destinado a usos que no requieren calidad potable —descarga de inodoros, riego de espacios verdes y baldeo de playas y calles internas—, esto es unos 2.860 de los 4.100 m³/año estimados, se cubre con agua de lluvia captada en el predio, en el establecimiento hotelero del piedemonte del departamento Capital, durante el tercer año calendario completo de operación. Valor en situación sin proyecto: 0 %, equivalente a 4.087 m³/año cubiertos con agua del pozo.", "Caudalímetro totalizador de la red de agua no potable y submedición de cocina, lavandería, riego, piscina y habitaciones, con lectura mensual asentada en la planilla de seguimiento hídrico y consolidada en el informe anual del responsable del desempeño hídrico del establecimiento.", "La precipitación del período se mantiene dentro del rango de la serie 1991–2020 de la estación de referencia y la ocupación del establecimiento alcanza los niveles previstos en su plan de negocios."], "comp": ["Sistema de captación, tratamiento y reserva de agua de lluvia en servicio; red interna de agua no potable ejecutada, señalizada y ensayada; sistema de medición y registro del agua implantado; y capacidad de operación instalada.", "Al momento de la habilitación del establecimiento: el 100 % de los inodoros de las 109 habitaciones y de los 22 baños comunes y el 100 % de los puntos de riego y de baldeo están conectados a la red de agua no potable; la reserva de agua de lluvia está ejecutada por el volumen que determine el dimensionamiento aprobado en el F02, del orden de 200 m³ según la estimación preliminar; hay medidores instalados y calibrados en el pozo y en los cinco sectores definidos; y el manual de operación está aprobado, el personal de operación capacitado y el puesto responsable designado por escrito.", "Acta de recepción de obra de las instalaciones sanitarias y pluviales con planos conforme a obra; protocolo de ensayo de estanqueidad y de ausencia de conexiones cruzadas firmado por la dirección de obra; certificados de calibración de los medidores; y legajo con el manual aprobado, las planillas de asistencia a la capacitación y el acto de designación del responsable.", "El cronograma general de obra no sufre alteraciones que obliguen a reprogramar la primera etapa, y la autoridad municipal y sanitaria admite la red interna separada de agua no potable con la señalización y los ensayos propuestos."], "act": ["Incorporación al proyecto ejecutivo y ejecución, dentro de la primera etapa de ocho meses de la obra, del sistema de aprovechamiento de agua de lluvia con red interna de agua no potable, medición desagregada y capacidad de operación instalada.", "El estudio de demanda por sector, el balance mensual de dimensionamiento y la adecuación del proyecto ejecutivo de instalaciones sanitarias y pluviales están aprobados por la dirección de obra dentro de los primeros cuatro meses de la primera etapa, y el 100 % de la partida presupuestaria del componente está comprometida antes del cierre de esa etapa.", "Expediente técnico del proyecto ejecutivo, con la memoria de cálculo y su planilla de supuestos numerados anexada; actas de la dirección de obra; y estado de ejecución presupuestaria del contrato emitido por la administración del emprendimiento.", "El titular del emprendimiento mantiene la disponibilidad financiera prevista para la primera etapa y los proveedores de equipos de filtrado, medición y bombeo cumplen los plazos de entrega del mercado local."]}, "alt": [{"id": "A", "med": "Medios 1.1, 3 y 3.2 en su versión mínima — Demanda reducida y usos operados con criterio, sin incorporar una segunda fuente.", "act": "Reducción de la demanda sin nueva fuente: artefactos por encima de los ya previstos —inodoros de 4/2 L en lugar de 6/3, duchas nebulizadoras de 4 a 5 L/min, aireadores en toda la grifería— más protocolos de reúso de blancos, lavado a carga completa, purga controlada de la piscina de 180 m² y riego programado por balance hídrico con corte por lluvia.", "ven": "Es la alternativa más barata por metro cúbico ahorrado y la de menor complejidad técnica e institucional; no requiere obra civil ni segunda red, no agrega riesgo sanitario y puede implementarse incluso con la obra avanzada; reduce simultáneamente el consumo de agua y el de energía de bombeo, y es condición previa razonable de cualquier otra alternativa, porque cada litro que no se consume es un litro que no hay que captar ni almacenar.", "des": "No resuelve el problema central: deja intacta la calidad del agua destinada a usos que no la requieren, de modo que el propósito no se alcanza aunque la alternativa funcione bien. Su margen es además acotado, porque el proyecto ya prevé inodoros de doble pulsador 6/3 L y griferías de cierre automático en todos los lavabos: el equipamiento eficiente ya está, y el margen que queda está en la calidad del agua y no en el volumen. Depende por completo de la conducta de operación, que es el eslabón más frágil del caso."}, {"id": "B", "med": "Medios 1, 1.2 y 2 en su versión exterior — Reserva alimentada por el escurrimiento del predio y usos exteriores cubiertos con agua no potable.", "act": "Aprovechamiento pluvial restringido a usos exteriores: cisterna enterrada en el punto bajo al que ya converge el escurrimiento, alimentada por la cubierta del basamento y por las superficies exteriores, con filtrado de mallas y sedimentación, conectada a la red de riego existente —que ya cuenta con bombeo, filtro de anillas y red de PVC y polietileno— y a los puntos de baldeo de las playas y calles.", "ven": "Aprovecha una instalación que ya existe y que el proyecto no tiene que repetir; no requiere segunda red interna ni ingresar al edificio, lo que elimina el riesgo de conexión cruzada y la necesidad de aprobación sanitaria de una red de agua no potable en áreas de uso público; el punto de captación coincide con el punto bajo que el plano de escurrimiento ya identifica; la calidad exigida es la menor de toda la tabla de usos; es la alternativa de menor costo de las que sustituyen fuente.", "des": "Ataca el uso peor acompasado con la oferta: el riego demanda unos 1.950 m³ concentrados entre abril y octubre, período en el que las cubiertas producen del orden de 296 m³, de modo que cubrirlo exigiría trasladar unos 1.650 m³ desde la estación húmeda, treinta veces la cisterna proyectada de 55.000 L. Capta de las superficies de peor calidad —playas de estacionamiento y calzadas—, con carga de hidrocarburos y sedimentos que obliga a desvío de primeras aguas y sedimentación reforzada; y deja fuera el uso continuo que mejor se acompasa con una reserva acotada, la descarga de inodoros."}, {"id": "C", "med": "Medios 1, 1.2 y 2 en su versión completa — Dos calidades de agua distribuidas por redes separadas y reserva dimensionada para el régimen estacional.", "act": "Aprovechamiento pluvial de cubiertas con red interna separada de agua no potable: captación en las cubiertas del volumen principal y del basamento, desvío de primeras aguas, filtrado y desinfección residual, reserva enterrada, y una segunda red señalizada que alimenta las descargas de inodoro de las 109 habitaciones y de los 22 baños comunes, más los puntos de riego y de baldeo.", "ven": "Ataca el uso de demanda continua —la descarga de inodoros, del orden de 967 m³/año, sumada a la limpieza suman unos 1.487 m³/año, es decir unos 124 m³ mensuales—, que es el que mejor se acompasa con una reserva de tamaño razonable y el que permite el mayor volumen sustituido por metro cúbico de reserva construida; capta de la superficie más limpia y de mayor coeficiente de escorrentía; y es la única alternativa que modifica de raíz la causa 1, porque construye la segunda red que la instalación proyectada no tiene.", "des": "Requiere una segunda red interna en un edificio de uso público, con todo lo que eso implica: aprobación de la autoridad sanitaria y municipal, señalización normalizada, ensayo de ausencia de conexiones cruzadas y riesgo permanente de uso indebido si el personal no está formado. Es más cara que la B y sólo es viable a costo razonable si se ejecuta con las instalaciones abiertas, es decir dentro de la primera etapa de obra. Por sí sola —sin medición, protocolos ni responsable— reproduce el error que el propio caso señala: un sistema construido que nadie sostiene."}, {"id": "D", "med": "Medio 1 en su versión de fuente alternativa — Usos que no requieren calidad potable cubiertos con una fuente interna disponible todo el año.", "act": "Reúso de aguas grises: tratamiento de los efluentes de las 109 duchas y de los lavabos de habitaciones y baños comunes, y derivación del agua tratada a las descargas de inodoro, con la misma red separada y señalizada.", "ven": "Es la única alternativa sin desfasaje estacional: la oferta se produce el mismo día que la demanda y en proporción a la ocupación, de modo que el volumen de reserva necesario es mínimo y el rendimiento no depende del régimen de lluvias ni del riesgo de un año seco; su oferta escala automáticamente con la ocupación, que es justamente lo que ninguna captación pluvial hace.", "des": "Exige una planta de tratamiento con operación permanente, control microbiológico y un régimen de mantenimiento muy superior al de un filtro de mallas, en un establecimiento donde hoy nadie tiene asignada la responsabilidad sobre el agua; el marco normativo de reúso de efluentes domiciliarios dentro de edificios es más exigente y menos definido que el de captación pluvial; requiere además una tercera red de recolección separada de grises, lo que multiplica el trabajo de instalación; y no aprovecha el recurso que este caso pone sobre la mesa, la lluvia que hoy sale del predio. Se conserva como alternativa de contraste y como opción a evaluar en el F02 si la autoridad sanitaria rechazara la captación pluvial para uso interno."}, {"id": "E", "med": "Medios 1, 1.1, 1.1.A, 1.1.A.1, 1.1.A.2, 1.2, 2, 3 y 3.2 — Cobertura simultánea de las cuatro capas del caso: infraestructura, medición y registro, procedimientos y mantenimiento, y capacitación y responsabilidad asignada.", "act": "Sistema integral ejecutado dentro de la primera etapa de obra: la actividad C —captación en cubiertas, desvío de primeras aguas, filtrado, reserva dimensionada por balance mensual y segunda red señalizada hacia descargas de inodoro, riego y baldeo— dimensionada sobre un estudio de demanda por sector y fracción sustituible, e incorporando como paso previo las medidas de reducción de demanda de la actividad A; más macromedición en el pozo y submedición por sector con tablero de consumo por pernoctación; más manual de operación y mantenimiento, señalización normalizada, capacitación inicial y anual del personal y designación por escrito del puesto responsable del desempeño hídrico.", "ven": "Es la única alternativa que cubre las cuatro capas que el caso identifica y las tres raíces del problema: la decisión de diseño tomada en el plano, la ausencia de medición que vuelve invisible el costo, y la ausencia de procedimientos y de responsable que hace que un sistema construido no rinda. Reduce la demanda antes de dimensionar la reserva, con lo que la obra resulta menor y más barata que en la alternativa C aislada. Produce el dato con el que se calcula su propio indicador de propósito, y ese dato sirve además para sostener el pedido de concesión, para la certificación voluntaria y para cualquier decisión posterior sobre el agua. Ejecutada en la primera de las tres etapas de ocho meses, aprovecha la única ventana en la que la segunda red y la reserva enterrada cuestan una fracción de lo que costarían después.", "des": "Es la de mayor inversión inicial y la que más exige de la organización: agrega tareas de mantenimiento —limpieza de canaletas y filtros antes de la temporada húmeda, purga del desvío de primeras aguas, lectura mensual de medidores— a una estructura de operación que hoy no está siquiera cuantificada, y su rendimiento depende de que ese esfuerzo se sostenga después de la inauguración. Obliga a decidir con datos que hoy no existen —ocupación, dotación real, coeficientes de escorrentía— y por lo tanto a dimensionar sobre supuestos que el F02 deberá cerrar. Y requiere una decisión temprana del titular, cuando la obra todavía no empezó y el beneficio todavía no se ve."}], "altSel": "E", "altJus": "Los criterios se fijaron antes de comparar y salen del propio árbol: (1) cuántas de las tres raíces ataca la alternativa —la decisión de diseño de fuente y calidad única, la invisibilidad del costo por ausencia de medición, y la ausencia de procedimientos y de responsable—; (2) grado de acople entre la oferta pluvial y la demanda que se pretende sustituir, es decir cuánto volumen se sustituye por metro cúbico de reserva construida, que es la traducción operativa del desfasaje estacional; (3) volumen anual efectivamente sustituido sobre los 4.087 m³/año estimados; (4) costo de ejecución según el momento en que se decide, dentro o fuera de la ventana de la primera etapa de obra; (5) exigencia sanitaria y normativa, y riesgo de rechazo de la autoridad; (6) dependencia del esfuerzo de operación posterior a la inauguración; (7) capacidad de producir el dato que verifica su propio resultado.\n\nContra esos criterios. La alternativa A es la mejor en los criterios 4 y 5 y la peor en el 1 y el 3: no alcanza el propósito, porque no cambia la calidad del agua destinada a usos que no la requieren, y su margen está acotado de antemano por un equipamiento sanitario que ya es eficiente. No se descarta: se absorbe como paso previo de la seleccionada, porque reducir la demanda antes de dimensionar abarata la reserva. La alternativa B es sólida en los criterios 4 y 5 —no ingresa al edificio, no necesita aprobación de red interna— pero falla en el criterio 2, que es el decisivo de este caso: destina la lluvia al riego, el uso peor acompasado con la oferta, cuando la propia serie muestra que el 80 % de la precipitación cae entre diciembre y marzo y que los cinco meses de mayo a septiembre suman 22,9 mm. Cubrir el riego de la estación seca exigiría trasladar unos 1.650 m³ entre estaciones, treinta veces la cisterna proyectada: el almacenamiento que hace falta es de otro orden de magnitud, y almacenar cuesta. La alternativa D es la mejor en el criterio 2 —oferta y demanda coinciden en el tiempo y escalan con la ocupación— y merece quedar en carpeta, pero es la peor en los criterios 5 y 6, exige una planta con operación permanente en un establecimiento donde nadie responde todavía por el agua, y deja sin aprovechar el recurso que este caso pone sobre la mesa. La alternativa C es la mejor en el criterio 2 entre las pluviales, porque dirige la lluvia hacia la descarga de inodoros, una demanda continua de unos 124 m³ mensuales que una reserva acotada puede acompañar durante buena parte del año; pero por sí sola falla en los criterios 1, 6 y 7, y reproduce exactamente el error que la fuente advierte: un sistema construido que nadie mide, opera ni sostiene.\n\nSe selecciona la alternativa E. Tres razones. Primera: es la única que cubre las cuatro capas del caso, y la propia documentación demuestra que las tres capas no constructivas no son adorno — sin medición no hay indicador de propósito y el proyecto no puede probar que funcionó; sin procedimientos el riego vuelve a programarse por calendario; sin un puesto responsable la operación del sistema depende de que alguien se acuerde. Segunda: resuelve el desfasaje estacional por la vía correcta, que no es agrandar el tanque hasta cubrir el riego de la seca sino priorizar los usos de demanda continua y dimensionar la reserva por balance mensual, dejando el riego como destino del excedente de la temporada húmeda. Tercera, y decisiva en este caso: el proyecto todavía no se construyó. La obra son 24 meses en tres etapas de ocho, y la segunda red, las bajadas de cubierta, el desvío de primeras aguas y la reserva enterrada se ejecutan a costo marginal mientras las instalaciones están abiertas y el suelo movido, y a costo múltiple sobre un edificio terminado y en operación. Esa ventana no se puede recuperar y se agota sola: por eso la alternativa seleccionada es también una decisión sobre el momento, no sólo sobre la técnica.\n\nSe declara como supuesto a verificar en el F02 que la autoridad sanitaria y municipal admita la red interna de agua no potable en un edificio de uso público. Si esa consulta resultara negativa, la decisión debe revisarse desplazando el proyecto hacia la alternativa B ampliada con la capa de medición, procedimientos y responsable, y ese punto de revisión queda explícitamente previsto en el diseño. También se declara que el dimensionamiento definitivo de la reserva —del orden de 200 m³ en la estimación preliminar— depende del balance mensual con la demanda relevada, y que el orden de prioridad entre usos sustituibles puede cambiar si el relevamiento confirmara 5.000 m² de espacios verdes en lugar de 2.600 m².", "corr": ["Problema central escrito como carencia de la solución: «falta un sistema de captación de agua de lluvia», «el establecimiento no cuenta con cisterna pluvial», «ausencia de infraestructura de aprovechamiento». Es la trampa mayor de este escenario, porque la solución es además el título del escenario y el equipo cree estar repitiendo la consigna. Si el problema es ese, el ítem R queda cerrado antes de empezar y desaparecen del análisis la reducción de demanda, el reúso de aguas grises y la captación restringida a usos exteriores. Señal complementaria: si el problema central nombra una obra, revisar el ítem R, donde casi seguro aparece una sola alternativa con variantes de tamaño.", "Árbol sostenido en un anegamiento: «el predio se inunda», «el canal no da abasto», «el escurrimiento sobrecarga el desagüe». La propia fuente lo desmiente al consignar que el canal de desagüe existente no presenta problemáticas de manejo. Un árbol refutado por su propia documentación no se corrige con más causas: hay que rehacerlo. El proyecto tiene que sostenerse en el ahorro de agua y de energía y en el estado del acuífero, no en el control de inundaciones.", "Todas las causas en la capa de infraestructura. Si el ítem K sólo contiene «no hay cisterna», «no hay filtros», «no hay segunda red», el equipo está suponiendo que un sistema construido rinde solo. Contar las causas por capa es la verificación que el propio caso pide: tiene que haber causas de medición y registro —sin ellas no hay con qué escribir el indicador del ítem E—, de procedimientos y mantenimiento, y de capacitación y responsabilidad asignada. Corolario que conviene mirar en la matriz: si la capacitación y la comunicación no aparecen con actividad, costo y plazo, quedaron como una intención al final del documento y el propósito depende de un supuesto que nadie declaró.", "Contradicciones de la fuente no detectadas o resueltas sin decir cómo. Las principales son 5.000 m² de espacios verdes en la distribución de superficies contra 2.600 m² en las fichas de riego —una diferencia que mueve la demanda sustituible en unos 2.400 m³/año, es decir el 59 %—, la suma de superficies declaradas que da 20.500 m² sobre un predio de 13.045,03 m², que revela que los 9.650 m² son superficie cubierta en cuatro niveles y no proyección de cubierta captante, los 4 lavarropas contra 3 de la ficha de energía y las 12 duchas de baños de servicio contra 2 lavabos e inodoros. Un equipo que las detecta, elige un valor y explicita el criterio hizo el trabajo de formulación; uno que promedia, uno que usa alternativamente uno y otro valor en distintos ítems y uno que ni se entera, no. Detectarlas debe puntuar a favor de manera explícita.", "Dimensionamiento que ignora el desfasaje estacional. Se reconoce en dos formas: cálculos hechos sobre la precipitación media anual —737,2 mm o la isohieta de 750 a 800 mm— sin balance mensual, y sistemas dirigidos al riego como uso principal sin advertir que el riego demanda en los cinco meses que suman 22,9 mm mientras el 80 % de la lluvia cae entre diciembre y marzo. La pregunta de control es simple: ¿cuántos metros cúbicos de reserva supone el equipo, y por qué ese número y no otro? Si no hay respuesta, no hay dimensionamiento sino deseo.", "Cifras con apariencia de dato oficial que la fuente no aporta. El cuaderno declara expresamente qué falta: tasa de ocupación, personas por habitación, dotaciones a adoptar, coeficientes de escorrentía, evapotranspiración y precios. Todo valor de esa lista debe aparecer numerado como supuesto, con su criterio y su fuente de referencia, y remitido al F02. Un consumo de «X litros por huésped» presentado como dato del establecimiento, o una eficiencia de captación citada sin origen, es una invención con formato de dato. Lo mismo vale para la escala del efecto sobre el acuífero: se puede afirmar que la extracción se suma a una depresión regional ya documentada, no cuantificar cuánto desciende el nivel por causa de este establecimiento.", "Supuestos de la MML que son tareas del proyecto —«se instalan los medidores», «se capacita al personal», «se firma el contrato»— y ausencia del supuesto que verdaderamente sostiene la matriz: que la organización que opere el hotel, que puede no ser la misma que hoy proyecta, mantenga el puesto responsable del desempeño hídrico, la rutina de mantenimiento y la lectura de medidores después de la inauguración. Si ese riesgo no aparece en el ítem U como el más frágil, el equipo no entendió dónde se juega el rendimiento del sistema. Señal asociada: propósito enunciado como obra terminada —«sistema construido»— en lugar de estado alcanzado por el establecimiento.", "Pérdida del anonimato o cambio de escala. El material es académico y está anonimizado: cualquier mención del nombre del establecimiento, de sus titulares, de los profesionales intervinientes o de una ubicación más precisa que la del enunciado es una falta de método, no un detalle. Y en sentido inverso, un problema central formulado como «escasez hídrica en el departamento Capital» o «sobreexplotación del acuífero del valle» cambia de escala: ningún proyecto de un edificio puede modificarlo, y el ámbito declarado en el ítem C deja de corresponderse con el problema del ítem D."]}, "9": {"n": 9, "pc": "El soporte ambiental del que dependen las condiciones de habitabilidad del borde este de la ciudad de Salta —el predio fiscal identificado como catastro N° 133.745, de 846,6 ha sobre la RN 9, último remanente continuo de vegetación nativa del sector— se degrada de manera progresiva: pierde cobertura leñosa, capacidad de infiltración y de retención del escurrimiento, y su destino de uso permanece sin decisión que lo asigne —hay una zonificación propuesta, no adoptada— ni acceso público para la población que lo rodea.", "pcjus": "El escenario presenta dos deterioros que ocurren a la vez, y la tentación es escribirlos como dos problemas unidos por una conjunción; el enunciado adoptado los integra en una sola situación porque el predio es, materialmente, el mismo objeto en los dos casos: es la superficie que infiltra y recarga el acuífero del que el sector se abastece, la que retiene el escurrimiento que hoy descarga por un punto único, la que modera la temperatura del borde y la única disponible para el espacio verde público que el sector no tiene. La habitabilidad no es un segundo problema pegado al primero: es la función de ese soporte, y por eso el sujeto afectado del enunciado es el soporte ambiental caracterizado por aquello de lo que depende, ahora con identificación catastral precisa —parcela N° 133.745— y con una superficie de referencia elegida y declarada, 846,6 ha digitalizadas, frente a las 847,97 ha que consigna la memoria del estudio. Se descartó «falta de un parque en el borde este» porque incorpora la solución al enunciado y clausura el análisis de alternativas antes de empezar, y «avance de la urbanización» porque es un proceso de contexto, no una situación localizada y mensurable. Se descartó también «la gente tira basura en el predio», que es un uso informal derivado de que el predio no tiene destino, gestión ni control visible, y que por lo tanto pertenece al árbol como causa y como efecto, no como tronco. La formulación que más riesgo tenía de desplazar al problema central es la que introduce el material ampliado: enunciar el problema como «el predio no está zonificado» o «la zonificación propuesta no se aplica». Se descartó porque convierte una propuesta técnica en el diagnóstico y reemplaza el árbol propio por un plano ajeno: la zonificación es un insumo de calidad sobre el que el proyecto debe pronunciarse, no la situación negativa a revertir. Lo que sí entra al enunciado, como atributo del problema y no como su definición, es que el destino del predio sigue sin decisión: hay estudio y propuesta, no acto administrativo, y mientras no se decide se decide igual, por ocupación de hecho. Por último se descartó reducir el problema a «pérdida de cobertura vegetal nativa», formulación correcta pero incompleta: deja fuera a la población afectada y conduce a una alternativa de conservación estricta que no resuelve el déficit de espacio público que el mismo escenario documenta.", "objc": "El soporte ambiental del que dependen las condiciones de habitabilidad del borde este de la ciudad de Salta —el predio fiscal identificado como catastro N° 133.745, de 846,6 ha sobre la RN 9, último remanente continuo de vegetación nativa del sector— se conserva y recupera: mantiene su cobertura leñosa, su capacidad de infiltración y de retención del escurrimiento, y cuenta con destino de uso resuelto por decisión fundada sobre la zonificación propuesta y con acceso público para la población que lo rodea.", "sit": [{"id": "s1", "k": "p", "d": "ter", "t": "El soporte ambiental del que dependen las condiciones de habitabilidad del borde este de la ciudad de Salta —el predio fiscal identificado como catastro N° 133.745, de 846,6 ha sobre la RN 9, último remanente continuo de vegetación nativa del sector— se degrada de manera progresiva: pierde cobertura leñosa, capacidad de infiltración y de retención del escurrimiento, y su destino de uso permanece sin decisión que lo asigne —hay una zonificación propuesta, no adoptada— ni acceso público para la población que lo rodea."}, {"id": "s2", "k": "e", "d": "amb", "t": "La recarga del acuífero de escasa dimensión que la cabecera de cuenca alimenta disminuye al reducirse la superficie con cubierta y capacidad de infiltración —incluidas las 289,8 ha que la propuesta destina a conservación y que hoy no cuentan con protección efectiva—, en un sector cuyas cotas superiores ya se abastecen por camión cisterna."}, {"id": "s3", "k": "e", "d": "tec", "t": "El escurrimiento superficial generado en las 846,6 ha del predio aumenta en volumen y velocidad y descarga por las alcantarillas del corredor vial, único punto de salida hacia un cauce receptor revestido y sin capacidad ociosa."}, {"id": "s4", "k": "e", "d": "ter", "t": "El sector de riesgo hídrico crítico situado aguas abajo del punto de descarga queda más expuesto a anegamientos y a daños en viviendas e infraestructura durante los eventos de precipitación intensa."}, {"id": "s5", "k": "e", "d": "amb", "t": "Se contraen las poblaciones de las 32 especies leñosas nativas del bosque joven —dos de ellas con categoría de conservación desfavorable— y el hábitat de las 82 especies de aves y 6 de mamíferos registradas en el inventario."}, {"id": "s6", "k": "e", "d": "soc", "t": "Los hogares del borde este quedan sin ámbito de encuentro ni de actividad al aire libre en condiciones seguras: la recreación se traslada a la calzada, a la banquina de la ruta y a los bordes del predio, con mayor carga térmica estival y exposición al humo de las quemas."}, {"id": "s7", "k": "e", "d": "eco", "t": "Se agrava la competencia por el agua entre los barrios del sector y se prolonga la dependencia del abastecimiento por camión cisterna en las cotas superiores."}, {"id": "s8", "k": "e", "d": "ins", "t": "El destino del predio queda determinado por la ocupación de hecho y no por una decisión de planificación: la única propuesta formulada —el reparto en 289,8 ha no urbanizables de conservación, 324,0 ha urbanizables con restricciones y 215,3 ha urbanizables con cambio de uso— permanece sin acto administrativo que la adopte, la ajuste o la rechace, de modo que cada año se reduce el abanico de alternativas técnicamente posibles."}, {"id": "s9", "k": "e", "d": "eco", "t": "Crece el costo público futuro de reponer por obra las funciones que hoy presta el predio: retención del escurrimiento, ampliación de redes, forestación y adquisición de suelo para espacio verde."}, {"id": "s10", "k": "c", "d": "ins", "t": "El predio fiscal catastro N° 133.745 no tiene acto administrativo que le asigne destino de uso ni organismo con la administración efectivamente a cargo: existe un estudio de zonificación ambiental con propuesta de master plan, pero ninguna repartición se expidió sobre esa propuesta ni ejerce control territorial sobre las 846,6 ha."}, {"id": "s11", "k": "c", "d": "tec", "t": "La información disponible sobre el predio se agota en un estudio de zonificación de uso académico, en POSGAR 2007 Faja 3, que no reemplaza la cartografía catastral oficial: la superficie difiere según la fuente —846,6 ha digitalizadas frente a 847,97 ha declaradas— y las tres zonas propuestas suman 829,1 ha, de modo que ninguna restricción de uso puede fundarse todavía en cartografía oponible a terceros."}, {"id": "s12", "k": "c", "d": "ins", "t": "La planificación urbana del ejido y la gestión del patrimonio natural fiscal se tramitan por circuitos administrativos separados, y los municipios del área metropolitana aplican normativas de uso del suelo dispares sin un ámbito común de decisión sobre el borde."}, {"id": "s13", "k": "c", "d": "eco", "t": "En una ciudad que agotó su suelo vacante interior, el valor de expectativa del suelo del borde —concentrado en las 215,3 ha que la propuesta califica como urbanizables con cambio de uso— orienta la decisión de destino hacia el uso residencial rentable y desalienta comprometer el predio a un uso que no genera renta directa."}, {"id": "s14", "k": "c", "d": "tec", "t": "Ninguna cuadrilla ni guardia territorial interviene sobre las quemas de pastizal, la extracción de leña y áridos, el ingreso de ganado ni los microbasurales perimetrales, en ninguno de los tres sectores que la propuesta distingue."}, {"id": "s15", "k": "c", "d": "amb", "t": "Las quemas recurrentes, el pastoreo y la extracción impiden la regeneración de la cubierta leñosa joven sobre suelos erosionables con pendientes superiores al 30 % en la mitad alta del predio."}, {"id": "s16", "k": "c", "d": "soc", "t": "Los hogares de los barrios linderos obtienen del predio leña, áridos y pastura y disponen allí sus residuos, porque no acceden a gas de red, a materiales de construcción asequibles ni al servicio de recolección en las cotas superiores."}, {"id": "s17", "k": "c", "d": "eco", "t": "La oferta habitacional formal no alcanza a los hogares de menores ingresos del sector, que resuelven su vivienda por autoconstrucción y ocupación informal ladera arriba."}, {"id": "s18", "k": "c", "d": "ter", "t": "El sector no dispone de espacio verde público —una única plaza reducida y en pendiente y un patio escolar insuficiente— ni de suelo urbano vacante alternativo, de modo que toda la demanda de expansión residencial y de espacio libre recae sobre el predio."}], "lnk": [{"a": "s11", "b": "s10"}, {"a": "s12", "b": "s10"}, {"a": "s13", "b": "s10"}, {"a": "s10", "b": "s14"}, {"a": "s14", "b": "s15"}, {"a": "s16", "b": "s15"}, {"a": "s17", "b": "s16"}, {"a": "s17", "b": "s18"}, {"a": "s10", "b": "s1"}, {"a": "s15", "b": "s1"}, {"a": "s16", "b": "s1"}, {"a": "s18", "b": "s1"}, {"a": "s1", "b": "s2"}, {"a": "s1", "b": "s3"}, {"a": "s1", "b": "s5"}, {"a": "s1", "b": "s6"}, {"a": "s1", "b": "s8"}, {"a": "s3", "b": "s4"}, {"a": "s2", "b": "s7"}, {"a": "s4", "b": "s9"}, {"a": "s8", "b": "s9"}], "obj": {"s1": "El soporte ambiental del que dependen las condiciones de habitabilidad del borde este de la ciudad de Salta —el predio fiscal identificado como catastro N° 133.745, de 846,6 ha sobre la RN 9, último remanente continuo de vegetación nativa del sector— se conserva y recupera: mantiene su cobertura leñosa, su capacidad de infiltración y de retención del escurrimiento, y cuenta con destino de uso resuelto por decisión fundada sobre la zonificación propuesta y con acceso público para la población que lo rodea.", "s2": "La recarga del acuífero de escasa dimensión que la cabecera de cuenca alimenta se sostiene, con la superficie de infiltración del predio conservada, empezando por las 289,8 ha de mayor valor de conservación.", "s3": "El escurrimiento superficial generado en las 846,6 ha se retiene e infiltra dentro del predio y llega amortiguado a las alcantarillas del corredor vial, dentro de la capacidad del cauce receptor.", "s4": "El sector de riesgo hídrico crítico situado aguas abajo del punto de descarga reduce su exposición a anegamientos y a daños en viviendas e infraestructura.", "s5": "Las poblaciones de las 32 especies leñosas nativas —incluidas las dos con categoría de conservación desfavorable— y el hábitat de las 82 especies de aves y 6 de mamíferos se mantienen y recuperan en el predio.", "s6": "Los hogares del borde este disponen de un ámbito de encuentro y de actividad al aire libre en condiciones seguras, con sombra, menor carga térmica estival y sin exposición al humo de las quemas.", "s7": "La competencia por el agua entre los barrios del sector se atenúa y se reduce la dependencia del abastecimiento por camión cisterna en las cotas superiores.", "s8": "El destino del predio resulta de una decisión de planificación explícita, que se pronuncia de manera fundada sobre el reparto propuesto —289,8 ha de conservación, 324,0 ha con restricciones y 215,3 ha de cambio de uso— y preserva el abanico de alternativas técnicamente posibles.", "s9": "Se evita el costo público futuro de reponer por obra las funciones que el predio presta: retención del escurrimiento, ampliación de redes, forestación y adquisición de suelo para espacio verde.", "s10": "El predio fiscal catastro N° 133.745 cuenta con destino de uso asignado por acto administrativo, adoptado a partir de la zonificación propuesta y de su evaluación, y con un organismo que ejerce la administración y el control territorial de las 846,6 ha.", "s11": "El predio cuenta con información sistematizada y oponible —superficie catastral conciliada con la digitalizada, límite parcelario, cobertura, suelos, pendientes, hidrología y aptitud por sector— con el detalle necesario para fundamentar su zonificación interna y las restricciones de uso.", "s12": "La planificación urbana del ejido y la gestión del patrimonio natural fiscal se resuelven en un mismo instrumento, con un ámbito metropolitano de decisión sobre el borde y criterios de uso del suelo armonizados entre municipios.", "s13": "La decisión sobre el destino del predio, y en particular sobre las 215,3 ha calificadas como urbanizables, se adopta con criterios de aptitud y de interés público, con la valoración de los servicios ecosistémicos incorporada a la comparación económica.", "s14": "Una guardería territorial y cuadrillas de manejo intervienen de manera regular sobre quemas, extracción, ingreso de ganado y microbasurales perimetrales, en los tres sectores de la zonificación adoptada.", "s15": "La cubierta leñosa joven regenera sobre los suelos erosionables y las pendientes superiores al 30 % de la mitad alta del predio, sin quemas, pastoreo ni extracción.", "s16": "Los hogares de los barrios linderos cubren sus necesidades de energía, materiales y disposición de residuos por fuera del predio, con acceso al servicio de recolección en las cotas superiores.", "s17": "Los hogares de menores ingresos del sector acceden a soluciones habitacionales formales y a lotes con servicios, sin necesidad de ocupar informalmente la ladera.", "s18": "El sector dispone de espacio verde público accesible y suficiente, y la demanda de expansión residencial se orienta a suelo apto previsto por la planificación."}, "f01": {"A": "Nombre propuesto: INTERFAZ · Consultora en Ambiente y Territorio (S.H.). Es un ejemplo de respuesta correcta, no la única válida: cualquier sigla o denominación de dos o tres palabras vinculada a la restauración urbana, al piedemonte o a la gestión del territorio cumple la consigna. Se fundamenta en que el equipo trabaja exactamente sobre una interfaz campo–ciudad, donde el problema se define por la relación entre el tejido urbano y la base natural que lo sostiene, y en que el nombre puede sostenerse como identidad profesional una vez terminada la cursada. Se asume sociedad de hecho, sin definir tipo societario en esta instancia. Advertencia de corrección: este nombre identifica al equipo, no al proyecto; el nombre del proyecto se define recién en el ítem V y no debe adelantarse acá.", "B": "Equipo de cinco integrantes, con coordinación rotativa y removible por mayoría, informada a la cátedra por correo. · Integrante 1 — Coordinación general y control de coherencia entre ítems (integra árbol de problemas, árbol de objetivos, EAP y MML): 26 h. · Integrante 2 — Búsqueda y sistematización de información secundaria (censos, informe de expansión del aglomerado, inventario forestal, estudio de zonificación ambiental y propuesta de master plan, estudios hidrológicos y de riesgo hídrico, normativa de bosques nativos): 24 h. · Integrante 3 — Cartografía, visor geoespacial y paratextos: descarga y control de las capas KML y GeoJSON del visor publicado, verificación de las superficies por zona, lectura del terreno 3D y de las imágenes históricas, mediciones sobre el visor, y esquemas de los dos árboles: 28 h. · Integrante 4 — Redacción y edición del informe y del Formulario 01: 24 h. · Integrante 5 — Enlace institucional y consulta a expertos (organismo provincial de tierras fiscales, catastro provincial, autoridad de bosques nativos, planeamiento municipal, prestadora de agua): 20 h. · Total declarado: 122 h de trabajo efectivo sobre esta entrega. Metodología: dos reuniones semanales, una presencial de dos horas y una virtual de una hora, con repositorio compartido y minuta de acuerdos; comunicación por grupo de mensajería y correo para lo que deja constancia. Se declaran sólo horas efectivamente trabajadas: los integrantes que no aportaron a esta entrega no se consignan.", "C": "El escenario se inscribe simultáneamente en tres de los ámbitos que propone la Guía, y así se declara porque las categorías no son mutuamente excluyentes. · Restauración urbana (ámbito principal): la intervención se produce sobre el borde de una ciudad que agotó su suelo vacante interior y busca recomponer la relación entre el tejido consolidado, la población que lo habita y el soporte natural del piedemonte, incorporando espacio público donde hoy hay una plaza reducida y en pendiente y un patio escolar insuficiente. · Conservación de ecosistemas: el predio es el último remanente continuo de vegetación nativa del sector, alberga 32 especies leñosas nativas —dos con categoría de conservación desfavorable—, 82 especies de aves y 6 de mamíferos, está sujeto al régimen provincial de bosques nativos, y la propuesta de zonificación ya reserva 289,8 ha con destino de conservación. · Producción de servicios ecosistémicos: la razón por la cual el deterioro del predio se traduce en pérdida de habitabilidad es que el predio produce infiltración y recarga del acuífero, retención del escurrimiento en cabecera de cuenca, regulación térmica y calidad de la cuenca visual observada desde veinte puntos sobre la ruta. · El enunciado del escenario rotula el ámbito como restauración urbana, conservación de ecosistemas y gestión ambiental del territorio; esta tercera denominación se traduce, en el listado de la Guía, en la producción de servicios ecosistémicos y en la decisión de destino del suelo, que es lo que la zonificación propuesta pone sobre la mesa. El énfasis se pone en la restauración urbana porque es el ámbito que obliga a resolver conjuntamente la base natural y la habitabilidad; los otros dos aportan los criterios técnicos con los que se evalúa y se ajusta el reparto de superficies propuesto. Este ítem se cerró después de escribir el D, tal como recomienda la Guía.", "D": "Problema central: el soporte ambiental del que dependen las condiciones de habitabilidad del borde este de Salta —predio fiscal catastro N° 133.745, 846,6 ha sobre la RN 9, último remanente continuo de vegetación nativa— se degrada progresivamente y su destino sigue sin decisión que lo asigne: hay zonificación propuesta, no adoptada, sin acceso público. · Identidad: la superficie que infiltra, retiene el escurrimiento y regula la temperatura es la única disponible para el espacio libre que falta; es un problema, no dos. · Ubicación: borde este del ejido de Capital, en cabecera de cuenca. · Tiempo: quince años de dos frentes opuestos, urbanización cerrada por el norte y ocupación informal por el oeste. · Mensurabilidad: cobertura leñosa, caudal en el punto único de descarga y m² verdes por habitante, medibles ahora por zona (289,8 / 324,0 / 215,3 ha). · Magnitud: el aglomerado se expandió 4.430 ha, 91 % residencial, y restan 342 ha de vacíos: el predio más que duplica esa reserva. · El diagnóstico es el deterioro en curso, no la zonificación: es un insumo frente al cual posicionarse.", "E": "Se construye un índice de tres indicadores, porque el problema tiene tres manifestaciones medibles sobre el mismo objeto, y las tres pueden ahora desagregarse por zona. · Criterio previo sobre la superficie de referencia, que corresponde dejar asentado: el material aporta dos valores para la misma parcela, 846,6 ha digitalizadas y 847,97 ha declaradas en el estudio. Se adopta 846,6 ha como superficie de trabajo, por tres razones: proviene del polígono digitalizado, que es reproducible y remensurable a partir del KML y del GeoJSON que el visor permite descargar; es el valor más conservador de los dos; y la diferencia entre ambos, 1,37 ha, equivale al 0,16 % de la parcela, por debajo de la precisión de la que depende cualquier decisión de este perfil. Se deja constancia de que la cartografía del visor está en POSGAR 2007 Faja 3, es de uso académico y no reemplaza la cartografía catastral oficial: la superficie definitiva es la que surja del registro del catastro N° 133.745, a solicitar en el F02. Se deja constancia además de que las tres zonas propuestas suman 829,1 ha y no cierran contra ninguno de los dos totales: quedan 17,5 ha sin asignar respecto de la superficie digitalizada, y el origen de ese residuo —posiblemente la traza de la RN 9 y del Acceso Norte, que el visor incorpora como capas de referencia— es un supuesto a verificar en el F02, no un dato. · Indicador 1 (base natural): superficie con cobertura leñosa nativa continua dentro del predio fiscal catastro N° 133.745, expresada en hectáreas y en porcentaje de las
