apítulo 2 · El árbol de problemas", "pide": "El diagrama de síntesis que integra causas, problema central y efectos en un mismo esquema.", "como": ["Ubicar el problema central en el tronco, las causas hacia abajo y los efectos hacia arriba.", "Usar la información de los ítems K y L: el árbol no agrega elementos nuevos, los ordena.", "Revisar la secuencia lógica ascendente causas → problema → efectos.", "Repetir el procedimiento las veces que haga falta hasta que todo el equipo acuerde la secuencia."], "error": "Dibujar el árbol antes de completar las tablas. El diagrama es la síntesis del análisis, no un sustituto del análisis.", "ej": "En esta instancia el árbol es un conjunto de <strong>hipótesis de trabajo</strong>. Al avanzar a perfil, prefactibilidad y factibilidad, cada componente deberá ponerse a prueba con estudios específicos, consulta a expertos y trabajo participativo con los involucrados.", "guia": "Guía 01 · ítem L · «Construyendo el árbol de problema»"}, {"L": "N", "s": 3, "t": "Medios — raíces del árbol de objetivos", "cap": "Capítulo 3 · El árbol de objetivos", "pide": "Los medios, expresando de manera positiva las causas identificadas en el árbol de problemas.", "como": ["Transformar cada causa en su condición positiva equivalente, respetando la misma estructura jerárquica.", "Mantener el paralelismo: si hay cuatro niveles de causas, hay cuatro niveles de medios.", "Identificar los medios que quedan <strong>fuera del alcance del proyecto</strong> y decirlo explícitamente.", "Analizar las limitaciones del equipo y del proyecto antes de avanzar."], "error": "Reescribir la causa agregando «mejorar» o «promover». El medio es un estado alcanzado, no una acción: «calles con mantenimiento adecuado», no «mejorar el mantenimiento de las calles».", "ej": "Causa «nadie tiene asignada la tarea de riego» → medio «responsable del riego posterior asignado». Causa «el vivero no rustifica los plantines» → medio «el vivero rustifica los plantines antes de entregarlos».", "guia": "Guía 01 · ítem M · «Medios (raíces del árbol)»"}, {"L": "O", "s": 3, "t": "Fines — ramas del árbol de objetivos", "cap": "Capítulo 3 · El árbol de objetivos", "pide": "Los fines, expresando como situaciones positivas o deseadas los efectos del árbol de problemas.", "como": ["Transformar cada efecto en la situación deseada equivalente.", "Conservar el encadenamiento: los fines de segundo nivel derivan de los de primer nivel.", "Los fines más altos del árbol son los que después alimentarán el nivel «Fin» de la EAP y de la MML."], "error": "Inventar fines que no son el espejo de ningún efecto. Si aparece un fin sin efecto correspondiente, o falta un efecto en el ítem L o sobra un deseo en el ítem O.", "ej": "Efecto «pérdida de la inversión municipal de cada campaña» → fin «aprovechamiento de la inversión municipal de cada campaña». Efecto «más calor y menos sombra en veredas» → fin «mayor sombra y mejor confort térmico en veredas».", "guia": "Guía 01 · ítem N · «Fines (ramas del árbol)»"}, {"L": "P", "s": 3, "t": "Objetivo central, propósito o meta", "cap": "Capítulo 3 · El árbol de objetivos", "pide": "La meta, expresando de manera positiva el problema central.", "como": ["Completar el cuadro con el problema central arriba y el propósito o meta debajo.", "Mantener la misma variable, el mismo lugar y el mismo sujeto: sólo cambia el signo.", "Este enunciado será el propósito de la EAP y de la MML, y su indicador será el mismo del ítem E."], "error": "Cambiar el alcance al transformar. Si el problema estaba localizado en un barrio, la meta no puede estar localizada en toda la ciudad.", "ej": "«Alta mortandad de los plantines nativos plantados en los espacios públicos del municipio» → «Baja mortandad de los plantines nativos plantados en los espacios públicos del municipio». · «Demanda insatisfecha de proteína de pescado de río» → «Demanda satisfecha de proteína de pescado de río».", "guia": "Guía 01 · ítem O · «Objetivo central o propósito del proyecto (meta)»"}, {"L": "Q", "s": 3, "t": "Construyendo el árbol de objetivos", "cap": "Capítulo 3 · El árbol de objetivos", "pide": "El diagrama de síntesis que integra medios, meta y fines.", "como": ["Ordenar el diagrama con la misma estructura del árbol de problemas: medios abajo, meta en el tronco, fines arriba.", "Controlar que cada nodo del árbol de objetivos tenga su contraparte en el árbol de problemas.", "Marcar visualmente los medios sobre los que el proyecto podría actuar."], "error": "Que el árbol de objetivos tenga más o menos ramas que el de problemas. La asimetría es la señal de que algo se perdió o se agregó por el camino.", "ej": "Una incorrecta definición del árbol de problemas determina inevitablemente una incorrecta definición del árbol de objetivos: por eso conviene volver sobre el ítem M antes de dar por cerrado el Q.", "guia": "Guía 01 · ítem P · «Construyendo el árbol de objetivos»"}, {"L": "R", "s": 4, "t": "Selección de la estrategia y la actividad", "cap": "Capítulo 4 · La idea del proyecto", "pide": "Las estrategias que surgen del árbol de objetivos, la actividad seleccionada y la descripción de ambas.", "como": ["Partir de los medios <strong>más bajos</strong> del árbol y preguntarse qué hay que hacer para materializarlos.", "Agregar tantas tablas de estrategias como el equipo considere, en concordancia con el árbol de objetivos.", "Para cada estrategia, listar las actividades (proyectos) que contribuyen a lograr el medio; deben ser <strong>mutuamente excluyentes</strong>.", "Identificar y descartar las actividades fuera del alcance, documentando el criterio.", "Seleccionar una estrategia y, dentro de ella, la actividad que será la idea fuerza del proyecto."], "error": "Que la actividad elegida no salga del árbol de objetivos. Si aparece de la nada, o el árbol está incompleto o la decisión ya estaba tomada de antemano.", "ej": "Caso guía · Estrategia B · Medio: cuidados posteriores a la plantación asegurados · Actividades: (1) programa de padrinazgo de árboles con vecinos e instituciones, (2) cuadrilla municipal de mantenimiento post-plantación. Se selecciona la primera y se escribe por qué se descarta la segunda.", "guia": "Guía 01 · ítem Q · «Selección de la estrategia y la actividad (proyecto)»"}, {"L": "S", "s": 4, "t": "Estructura Analítica del Proyecto (EAP)", "cap": "Capítulo 4 · La idea del proyecto", "pide": "El esquema del proyecto con sus cuatro niveles jerárquicos: actividad, componente, objetivo central y fin.", "como": ["Fin: tomar los niveles superiores del árbol de objetivos.", "Propósito: el problema central transformado en condición positiva (el ítem P).", "Componente: el medio expresado en términos de <strong>producto obtenido</strong>.", "Actividad: el proyecto de inversión a desarrollar, cuyo resultado es la componente."], "error": "Escribir la componente como una acción. «Capacitar a los vecinos» es una actividad; «adecuadas capacitaciones viales logradas» es la componente.", "ej": "Medio «cuidados posteriores a la plantación asegurados» → Componente «mantenimiento post-plantación implementado». · Medio «implementación de un programa de reciclaje» → Componente «programa de reciclaje implementado».", "guia": "Guía 01 · ítem R · «Estructura Analítica del Proyecto (EAP)»"}, {"L": "T", "s": 4, "t": "Matriz de Marco Lógico", "cap": "Capítulo 4 · La idea del proyecto", "pide": "La MML completa: resumen narrativo de objetivos, indicadores, medios de verificación y supuestos, para los cuatro niveles.", "como": ["Primera columna: el resumen narrativo, en plena concordancia con la EAP.", "Indicadores: uno por nivel, respetando la ecuación cantidad + variable + lugar + plazo + medio de verificación, y los criterios SMART o C4 de CEPAL.", "Medios de verificación: de dónde y cómo se obtiene la información, y dónde queda disponible.", "Supuestos: factores externos, fuera del control del proyecto, cuya no ocurrencia pone en riesgo el nivel siguiente."], "error": "Escribir como supuesto algo que el proyecto sí controla. Si la decisión está dentro del proyecto, no es un supuesto: es una tarea que hay que planificar.", "ej": "Indicador del propósito: «Supervivencia del 85 % de los plantines a los 12 meses de plantados, en los espacios públicos del municipio, según el relevamiento anual de la Dirección de Espacios Verdes». Supuesto asociado: «El vivero sostiene la provisión de plantines nativos en cantidad y calidad».", "guia": "Guía 01 · ítem S · «Matriz de Marco Lógico»"}, {"L": "U", "s": 4, "t": "Las lógicas dentro de la MML", "cap": "Capítulo 4 · La idea del proyecto", "pide": "La verificación de las lógicas vertical, horizontal y zigzag, con un resumen narrativo para cada una.", "como": ["<strong>Vertical:</strong> narrar de abajo hacia arriba la cadena actividad → componente → propósito → fin, y comprobar que se sostiene.", "<strong>Horizontal:</strong> preguntar, fila por fila, si los medios de verificación son necesarios y suficientes para calcular el indicador y si el indicador permite evaluar el logro del objetivo.", "<strong>Zigzag:</strong> comprobar que cada nivel, sumado a los supuestos del nivel inferior, permite alcanzar el nivel superior.", "Si alguna lógica no cierra, reformular los niveles y volver a verificar."], "error": "Declarar que las lógicas se cumplen sin escribir el resumen narrativo. El ítem pide el relato, porque es en el relato donde aparecen los saltos lógicos.", "ej": "«Si implementamos el programa de padrinazgo aseguraremos el mantenimiento posterior a la plantación, lo que bajará la mortandad de los plantines nativos y aumentará la cobertura arbórea y el confort térmico de los espacios públicos.»", "guia": "Guía 01 · ítem T · «Cumplimiento de las lógicas dentro de la MML»"}, {"L": "V", "s": 4, "t": "Nombre del proyecto", "cap": "Capítulo 4 · La idea del proyecto", "pide": "El nombre sintético del proyecto que se desarrollará para resolver el problema.", "como": ["Tomar como base la EAP: el nombre debe ser representativo de la alternativa seleccionada.", "Construirlo con tres piezas: qué se hace + para qué + dónde.", "Este nombre acompañará al equipo en los formularios F02, F03 y F04."], "error": "Poner el nombre del problema en lugar del nombre del proyecto, o un nombre publicitario que no dice qué se va a hacer.", "ej": "«Programa de padrinazgo de árboles para la reducción de la mortandad de plantines nativos en los espacios públicos del municipio.»", "guia": "Guía 01 · ítem U · «Nombre del proyecto»"}];     /* los 22 ítems con la ayuda de la Guía */
var DIMS = [{"k": "amb", "n": "Ambiental", "c": "v", "q": "Qué le pasa al ambiente y qué del ambiente condiciona el problema."}, {"k": "soc", "n": "Social", "c": "a", "q": "Quién sufre el problema, quién lo produce y quién lo sostiene."}, {"k": "eco", "n": "Económica", "c": "o", "q": "Qué costos, precios, márgenes e incentivos están detrás."}, {"k": "ins", "n": "Institucional y normativa", "c": "p", "q": "Quién tiene la responsabilidad, qué norma aplica y quién controla."}, {"k": "tec", "n": "Técnica y operativa", "c": "c", "q": "Qué falla en el diseño, la operación o el mantenimiento."}, {"k": "ter", "n": "Territorial", "c": "aq", "q": "Dónde ocurre, hasta dónde llega y qué cambia según el lugar."}];    /* las seis dimensiones del laboratorio */

/* =============================================================== UTILIDADES */
function E(tag, cls, html){ var e=document.createElement(tag); if(cls) e.className=cls;
  if(html!=null) e.innerHTML=html; return e; }
function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function nl2br(t){ return esc(t).replace(/\n/g,'<br>'); }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('on'); }, 2400); }
function btn(txt, cls, fn){ var b=E('button','btn '+(cls||''),txt); b.type='button'; b.onclick=fn; return b; }
function nowStr(){
  var d=new Date(), z=function(n){return (n<10?'0':'')+n;};
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes());
}
function head(el, eyebrow, title, lead){
  var d = E('div');
  d.appendChild(E('span','eyebrow',eyebrow));
  d.appendChild(E('h2',null,title));
  el.appendChild(d);
  if(lead) el.appendChild(E('p','lead',lead));
}
function card(cls, title){
  var c = E('div','card'+(cls?' '+cls:''));
  c.appendChild(E('div','tag'));
  if(title) c.appendChild(E('h3',null,title));
  return c;
}
function listUl(items, cls){
  var u = E('ul','tk'+(cls?' '+cls:''));
  items.forEach(function(x){ u.appendChild(E('li',null,x)); });
  return u;
}
function dimOf(k){ return DIMS.filter(function(d){ return d.k===k; })[0] || {n:'sin dimensión',c:''}; }
function pillDim(k){ var d = dimOf(k); return '<span class="pill '+(d.c||'')+'">'+esc(d.n)+'</span>'; }
function prosa(txt){
  var p = E('div','prosa');
  p.textContent = String(txt||'');
  return p;
}
function wrapTxt(t, max){
  var w = String(t||'').split(/\s+/), out = [], cur = '';
  w.forEach(function(x){
    if(!cur){ cur = x; return; }
    if((cur+' '+x).length <= max) cur += ' ' + x;
    else { out.push(cur); cur = x; }
  });
  if(cur) out.push(cur);
  return out.length ? out : [''];
}

function centralId(){ var p = S.sit.filter(function(s){ return s.k==='p'; })[0]; return p ? p.id : null; }
function levels(){

/* diagrama de la red · modo 'prob' u 'obj' */
function redSVG(modo){
  var lv = levels(), c = centralId();
  if(!c) return '<p class="tiny">Sin problema central definido.</p>';
  var byLv = {};
  Object.keys(lv).forEach(function(id){ (byLv[lv[id]] = byLv[lv[id]] || []).push(id); });
  var ks = Object.keys(byLv).map(Number).sort(function(a,b){ return a-b; });
  var W = 1240, rowH = 104, NH = 66, H = Math.max(180, ks.length*rowH + 40);
  var col = {1:'--coral',2:'--oro',3:'--violeta',0:'--verde'};
  var colO = {1:'--aqua',2:'--verde-l',3:'--celeste',0:'--verde'};
  var pal = ['--coral','--oro','--violeta','--verde','--celeste','--aqua','--verde-l'];
  var o = '<svg class="red" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet"><defs>';
  pal.forEach(function(v,i){
    o += '<marker id="dk'+i+'" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">'+
         '<path d="M0,0 L10,5 L0,10 z" fill="var('+v+')" fill-opacity=".85"/></marker>';
  });
  o += '</defs>';
  var pos = {};
  ks.forEach(function(k, ri){
    var ids = byLv[k], n = ids.length;
    var bw = Math.min(330, (W-70)/n - 16);
    ids.forEach(function(id, i){
      var x = 35 + i*((W-70)/n) + ((W-70)/n - bw)/2;
      var y = 18 + ri*rowH;
      pos[id] = {x:x+bw/2, y:y+NH/2, w:bw, x0:x, y0:y};
    });
  });
  S.lnk.forEach(function(l){
    var A = pos[l.a], B = pos[l.b];
    if(!A || !B) return;
    var cv = (modo==='obj')
      ? (lv[l.a] > 0 ? (colO[Math.min(3,lv[l.a])] || '--aqua') : '--verde-l')
      : (lv[l.a] > 0 ? (col[Math.min(3,lv[l.a])] || '--oro') : '--celeste');
    var mi = Math.max(0, pal.indexOf(cv));
    o += '<path d="M'+A.x+','+A.y0+' C'+A.x+','+((A.y0+B.y0+NH)/2)+' '+B.x+','+((A.y0+B.y0+NH)/2)+' '+B.x+','+(B.y0+NH)+'" '+
         'fill="none" stroke="var('+cv+')" stroke-opacity=".5" stroke-width="1.6" marker-end="url(#dk'+mi+')"/>';
  });
  Object.keys(pos).forEach(function(id){
    var p = pos[id], k = lv[id];
    var cv = (modo==='obj')
      ? (k===0 ? '--verde' : (k>0 ? (colO[Math.min(3,k)] || '--aqua') : '--verde-l'))
      : (k===0 ? '--verde' : (k>0 ? (col[Math.min(3,k)] || '--oro') : '--celeste'));
    var txt = modo==='obj' ? objText(id) : sitText(id);
    o += '<g><title>'+esc(txt)+'</title>'+
         '<rect x="'+p.x0+'" y="'+p.y0+'" width="'+p.w+'" height="'+NH+'" rx="10" fill="var('+cv+')" fill-opacity="'+(k===0?'.24':'.12')+'" '+
         'stroke="var('+cv+')" stroke-opacity="'+(k===0?'.95':'.6')+'" stroke-width="'+(k===0?2:1.2)+'"/>';
    var lines = wrapTxt(txt, Math.floor(p.w/6.1)).slice(0,4);
    lines.forEach(function(L,j){
      var top = lines.length===1?39:(lines.length===2?29:(lines.length===3?24:19));
      o += '<text class="nl" x="'+p.x+'" y="'+(p.y0+top+j*13)+'" text-anchor="middle">'+esc(L)+'</text>';
    });

/* =============================================================== AUTOAJUSTE */
var FITMIN = .76, FITMAX = 1.14;
function overflowPx(s){
  var n = Math.max(0, s.scrollHeight - s.clientHeight - 3);
  s.querySelectorAll('.card,.scrolly').forEach(function(e){
    if(e.classList.contains('nofit') || getComputedStyle(e).display === 'none') return;
    var dy = e.scrollHeight - e.clientHeight - 6;
    var dx = e.scrollWidth - e.clientWidth - 14;
    if(dy > 0) n += dy;
    if(dx > 0) n += dx;
  });
  return n;
}
function nofitOver(s){
  var t = false;
  s.querySelectorAll('.nofit').forEach(function(e){
    if(e.scrollHeight > e.clientHeight + 6 || e.scrollWidth > e.clientWidth + 14) t = true; });
  return t;
}
function measureFit(s){
  var z = 1, g = 0;
  s.style.zoom = 1;
  if(SECS[cur] && SECS[cur].work) return 1;
  var base = overflowPx(s);
  if(base === 0){
    while(z < FITMAX - 1e-6 && g++ < 14 && !nofitOver(s)){
      var nz = Math.min(FITMAX, Math.round((z + .04)*100)/100);
      s.style.zoom = nz;
      if(overflowPx(s) > 0 || nofitOver(s)){ s.style.zoom = z; break; }
      z = nz;
    }
  } else {
    var best = z, bestN = base;
    while(z - .03 > FITMIN - 1e-6 && g++ < 18){
      z = Math.round((z - .03)*100)/100;
      s.style.zoom = z;
      var n = overflowPx(s);
      if(n < bestN){ bestN = n; best = z; }
      if(n === 0) break;
    }
    if(bestN > 0 && bestN > base * .75) best = 1;
    z = best; s.style.zoom = z;
  }
  return z;
}
function balUndo(e){
  if(!e.dataset.bal) return;
  e.style.paddingTop = '';
  [].forEach.call(e.children, function(c){ if(c.dataset && c.dataset.bal){ c.style.marginTop=''; delete c.dataset.bal; } });
  delete e.dataset.bal;
}
function balance(root){
  root.querySelectorAll('.card').forEach(function(e){
    balUndo(e);
    var cs = getComputedStyle(e);
    if(cs.display === 'none') return;
    var er = e.getBoundingClientRect();
    if(er.height < 130) return;
    var padT = parseFloat(cs.paddingTop), padB = parseFloat(cs.paddingBottom);
    var bot = er.top + padT, kids = [];
    [].forEach.call(e.children, function(c){
      if(c.classList.contains('pop-b') || c.classList.contains('tag')) return;
      var r = c.getBoundingClientRect();
      if(r.height === 0) return;
      kids.push(c); if(r.bottom > bot) bot = r.bottom;
    });
    if(!kids.length) return;
    var gap = (er.bottom - padB - parseFloat(cs.borderBottomWidth)) - bot;
    if(gap < 46) return;
    var extra = Math.min(gap/(kids.length+1), 60);
    if(extra < 12) return;
    var h0 = e.offsetHeight;
    e.style.paddingTop = (padT+extra)+'px';
    for(var k = 1; k < kids.length; k++){
      var m = parseFloat(getComputedStyle(kids[k]).marginTop) || 0;
      kids[k].style.marginTop = (m+extra)+'px';
      kids[k].dataset.bal = '1';
    }
    e.dataset.bal = '1';
    if(e.offsetHeight > h0 + 2) balUndo(e);
  });
}

/* =============================================================== ZOOM */
var ZOOM = 1, FIT = 1;
function applyZoom(){
  document.getElementById('zlabel').textContent = Math.round(ZOOM*100)+'%';
  var s = SECS[cur] && SECS[cur].el;
  if(!s) return;
  if(window.innerWidth <= 760){ s.style.zoom = ''; return; }
  s.style.zoom = FIT * ZOOM;
}
function fitNow(){
  var s = SECS[cur].el, work = !!SECS[cur].work;
  if(window.innerWidth <= 760){ s.style.zoom = ''; if(!work) balance(s); return; }
  FIT = measureFit(s);
  s.style.zoom = FIT * ZOOM;
  if(!work) balance(s);
}
function setZoom(z){ ZOOM = Math.max(.6, Math.min(2.2, Math.round(z*100)/100)); applyZoom(); }
document.getElementById('b-zi').onclick = function(){ setZoom(ZOOM+.1); };

/* =============================================================== ABRIR PANEL */
var POP = {node:null, ph:null, z:1};
function popArm(root){
  root.querySelectorAll('.card').forEach(function(e){
    if(e.classList.contains('nopop') || e.querySelector(':scope > .pop-b')) return;
    var b = E('button','pop-b','⤢'); b.type='button';
    b.title = 'Abrir este panel a pantalla completa';
    b.addEventListener('click', function(ev){ ev.stopPropagation(); ev.preventDefault(); popOpen(e); });
    e.appendChild(b);
  });
}
function popOpen(e){
  if(POP.node) return;
  POP.ph = E('div','pop-ph');
  e.parentNode.insertBefore(POP.ph, e);
  POP.node = e; e.classList.add('popped');
  var h = e.querySelector('h2,h3,h4');
  document.getElementById('pop-t').textContent = h ? h.textContent.trim().slice(0,70) : 'Panel ampliado';
  document.getElementById('pop-in').appendChild(e);
  POP.z = 1; popZ(0);
  document.getElementById('pop').classList.add('on');
}
function popClose(){
  if(!POP.node) return;
  POP.node.classList.remove('popped');
  POP.ph.parentNode.insertBefore(POP.node, POP.ph);
  POP.ph.parentNode.removeChild(POP.ph);
  POP.node = null; POP.ph = null;
  document.getElementById('pop').classList.remove('on');
  document.getElementById('pop-in').style.zoom = '';
}
function popZ(d){
  POP.z = Math.max(.6, Math.min(2.4, Math.round((POP.z+d)*100)/100));
  document.getElementById('pop-in').style.zoom = POP.z;
  document.getElementById('pop-z').textContent = Math.round(POP.z*100)+'%';
}
document.getElementById('pop-x').onclick = popClose;
document.getElementById('pop-zi').onclick = function(){ popZ(.1); };
document.getElementById('pop-zo').onclick = function(){ popZ(-.1); };
document.getElementById('pop').addEventListener('mousedown', function(ev){
  if(ev.target.id === 'pop-in' || ev.target.id === 'pop') popClose(); });

/* =============================================================== TEMA Y TECLADO */
document.getElementById('b-th').onclick = function(){
  var h = document.documentElement;
  h.dataset.theme = h.dataset.theme === 'light' ? 'dark' : 'light';
};
document.addEventListener('keydown', function(e){
  var t = e.target.tagName;
  if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT') return;
  var po = document.getElementById('pop').classList.contains('on');
  if(e.key === 'Escape'){ popClose(); return; }
  if(e.key==='+'||e.key==='='){ e.preventDefault(); po?popZ(.1):setZoom(ZOOM+.1); return; }
  if(e.key==='-'||e.key==='_'){ e.preventDefault(); po?popZ(-.1):setZoom(ZOOM-.1); return; }
  if(e.key==='0'){ e.preventDefault(); if(po){POP.z=1;popZ(0);} else setZoom(1); return; }
  if(po) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); prev(); }
  else if(e.key==='i'||e.key==='I'){ railToggle(); }
  else if(e.key==='t'||e.key==='T'){ document.getElementById('b-th').click(); }
});
document.getElementById('b-next').onclick = next;
document.getElementById('b-prev').onclick = prev;
var rzT=null;
window.addEventListener('resize', function(){ clearTimeout(rzT); rzT=setTimeout(fitNow,220); });

<script>
"use strict";
/* =============================================================== LECTURA DEL AVANCE DEL EQUIPO */
function avJoin(arr, f){
  return (arr||[]).map(f).filter(function(x){ return String(x||'').trim(); }).join('\n');
}
function avLB(){
  var l = (AV && AV.lb) || {};
  var p = [];
  if(l.c) p.push('Cantidad: '+l.c);
  if(l.v) p.push('Variable: '+l.v);
  if(l.l) p.push('Lugar: '+l.l);
  if(l.p) p.push('Plazo: '+l.p);
  if(l.mv) p.push('Medio de verificación: '+l.mv);
  return p.join('\n');
}
function avCadena(modo){
  if(!AV) return '';
  var sit = AV.sit || [], lnk = AV.lnk || [];
  if(!sit.length) return '';
  var byId = {}; sit.forEach(function(s){ byId[s.id] = s; });
  var T = function(id){
    var s = byId[id];
    if(!s) return '?';
    return modo==='obj' ? ((AV.sito||{})[id] || s.t) : s.t;
  };
  var c = (sit.filter(function(s){ return s.k==='p'; })[0]||{}).id;
  var out = [];
  if(c) out.push((modo==='obj'?'Objetivo central: ':'Problema central: ')+T(c));
  lnk.forEach(function(l){ out.push('· '+T(l.a)+(modo==='obj'?' → permite → ':' → produce → ')+T(l.b)); });
  return out.join('\n');
}
var AVSRC = {
 A:function(){ return (AV.eq||{}).nombre || ''; },
 B:function(){ return avJoin(AV.ints, function(p){
      return p.ap ? '· '+p.ap+(p.fun?' — '+p.fun:'')+(p.perf?' ('+p.perf+')':'')+(p.hs?' — '+p.hs+' h':'') : ''; })
      + ((AV.eq||{}).coord ? '\nCoordinación general: '+AV.eq.coord : ''); },
 C:function(){ return AV.amb || ''; },
 D:function(){ return AV.pc || ''; },
 E:function(){ return avLB(); },
 F:function(){ var c = AV.ctx||{}; return [c.amb, c.soc].filter(Boolean).join('\n\n'); },
 G:function(){ var c = AV.ctx||{};
      return (c.pobP? 'Población potencial: '+c.pobP : '') + (c.pobO? '\nPoblación objetivo: '+c.pobO : ''); },
 H:function(){ return avJoin(AV.inv, function(a){
      return a.n ? '· '+a.n+' — posición: '+(a.pos||'?')+' · fuerza: '+(a.fue||'?')+' · importancia: '+(a.imp||'?')+(a.int?' — '+a.int:'') : ''; }); },
 I:function(){ return (AV.ctx||{}).dep || ''; },
 J:function(){ return (AV.ctx||{}).norm || ''; },
 K:function(){ return avJoin(AV.cau, function(c){ return c.t ? '· [nivel '+(c.lv||1)+'] '+c.t : ''; }); },
 L:function(){ return avJoin(AV.efe, function(c){ return c.t ? '· [nivel '+(c.lv||1)+'] '+c.t : ''; }); },
 M:function(){ return AV.arM || avCadena('prob'); },
 N:function(){ return avJoin(AV.med, function(c){ return c.t ? '· [nivel '+(c.lv||1)+'] '+c.t : ''; }); },
 O:function(){ return avJoin(AV.fin, function(c){ return c.t ? '· '+c.t : ''; }); },
 P:function(){ return AV.obj || ''; },
 Q:function(){ return AV.arQ || avCadena('obj'); },
 R:function(){ var a = (AV.alt||[]).filter(function(x,i){ return (x.id||String.fromCharCode(65+i)) === AV.altSel; })[0];
      return (a ? 'Estrategia elegida ('+a.id+'): '+(a.med||'')+'\nActividad: '+(a.act||'')+'\n\n' : '') + (AV.altJus||''); },
 S:function(){ var e = AV.eap||{};
      return 'Fin: '+(e.fin||'—')+'\nPropósito: '+(e.prop||'—')+'\nComponente: '+(e.comp||'—')+'\nActividad: '+(e.act||'—'); },
 T:function(){ var m = AV.mml||{};
      return [['fin','Fin'],['prop','Propósito'],['comp','Componente'],['act','Actividad']].map(function(r){
        var v = m[r[0]] || [];
        return r[1]+'\n  Resumen: '+(v[0]||'—')+'\n  Indicador: '+(v[1]||'—')+
               '\n  Medio de verificación: '+(v[2]||'—')+'\n  Supuesto: '+(v[3]||'—'); }).join('\n\n'); },
 U:function(){ return AV.mmlU || ''; },
 V:function(){ return (AV.f01||{}).V || ''; }
};
function avText(L){
  if(!AV) return '';
  var t = (AV.f01||{})[L];
  if(String(t||'').trim()) return t;
  try{ return AVSRC[L] ? (AVSRC[L]() || '') : ''; }catch(e){ return ''; }
}
function estadoItem(t){
  var n = String(t||'').trim().length;
  if(n === 0) return {cls:'bad', txt:'sin completar', k:0};
  if(n < 120)  return {cls:'warn', txt:'muy breve ('+n+' caracteres)', k:1};
  return {cls:'ok', txt:n+' caracteres', k:2};
}

/* ---------- chequeos estructurales sobre el avance ---------- */
var RX_CARENCIA = /\b(falta|faltan|ausencia|carencia|escasez|inexisten|no\s+(existe|hay|se\s+cuenta|dispone))\b/i;
var RX_PLAZO = /(a[ñn]o|mes(es)?|semestre|trimestre|d[ií]as|20\d\d|plazo|al cabo|hacia el)/i;
var RX_NUM = /\d/;
function chequeos(){
  var out = [];
  var pc = String(AV.pc || '').trim();
  out.push({t:'El problema central está redactado', ok:pc.length > 30,
    d: pc ? '«'+pc.slice(0,140)+(pc.length>140?'…':'')+'»' : 'El ítem D está vacío.'});
  out.push({t:'No está enunciado como carencia', ok:!!pc && !RX_CARENCIA.test(pc),
    d: RX_CARENCIA.test(pc) ? 'Aparece una fórmula del tipo «falta / no existe / escasez»: el problema quedó escrito como la ausencia de una solución.' : 'No aparecen fórmulas del tipo «falta de…».'});
  var cau = (AV.cau||[]).filter(function(c){ return String(c.t||'').trim(); });
  var efe = (AV.efe||[]).filter(function(c){ return String(c.t||'').trim(); });
  out.push({t:'Al menos seis causas', ok:cau.length >= 6, d:cau.length+' causas cargadas (el modelo tiene '+S.sit.filter(function(s){return s.k==='c';}).length+').'});
  out.push({t:'Causas en más de un nivel', ok:(new Set(cau.map(function(c){ return c.lv||1; }))).size > 1,
    d:'Si todas las causas son de nivel 1, el equipo no preguntó «¿y por qué pasa eso?».'});
  out.push({t:'Al menos tres efectos', ok:efe.length >= 3, d:efe.length+' efectos cargados (el modelo tiene '+S.sit.filter(function(s){return s.k==='e';}).length+').'});
  var med = (AV.med||[]).filter(function(c){ return String(c.t||'').trim(); });
  out.push({t:'El árbol de objetivos refleja el de problemas', ok:med.length >= Math.max(3, Math.floor(cau.length*.6)),
    d:med.length+' medios frente a '+cau.length+' causas. Cada causa debería tener su medio o un descarte explícito.'});
  var mml = AV.mml || {}, llenas = 0;
  [['fin'],['prop'],['comp'],['act']].forEach(function(r){
    var v = mml[r[0]] || [];
    [0,1,2,3].forEach(function(j){ if(String(v[j]||'').trim()) llenas++; });
  });
  out.push({t:'Matriz de Marco Lógico completa', ok:llenas === 16, d:llenas+' de 16 celdas con contenido.'});
  var inds = [['fin'],['prop'],['comp'],['act']].map(function(r){ return String((mml[r[0]]||[])[1]||''); }).filter(function(x){ return x.trim(); });
  var conPlazo = inds.filter(function(x){ return RX_PLAZO.test(x) && RX_NUM.test(x); }).length;
  out.push({t:'Indicadores con cantidad y plazo', ok:inds.length > 0 && conPlazo === inds.length,
    d:conPlazo+' de '+inds.length+' indicadores incluyen un número y una referencia temporal.'});
  var sup = (AV.sup||[]).filter(function(s){ return String(s.t||'').trim(); });
  out.push({t:'Planilla de supuestos iniciada', ok:sup.length >= 3, d:sup.length+' supuestos declarados.'});
  var inv = (AV.inv||[]).filter(function(a){ return String(a.n||'').trim(); });
  out.push({t:'Análisis de involucrados con cuatro actores o más', ok:inv.length >= 4, d:inv.length+' actores cargados.'});
  var sit = (AV.sit||[]).filter(function(s){ return String(s.t||'').trim(); });
  out.push({t:'Usó el análisis de causalidad', ok:sit.length >= 6 && (AV.lnk||[]).length >= 5,
    d:sit.length+' situaciones y '+((AV.lnk||[]).length)+' relaciones en la red causal.'});
  return out;
}

/* =============================================================== IMPRESIÓN */
function printBody(){
  var lv = levels();
  var h = '<h1>Guía docente · Formulario 01</h1>'+
    '<p><strong>Escenario '+N+' — '+esc(ESC.t)+'</strong><br>'+esc(ESC.lug)+'</p>'+
    '<p style="font-size:9pt;color:#5a6b64">FEPAR 2026 · material de cátedra · generado el '+nowStr()+'</p>';
  h += '<h2>Problema central</h2><p><strong>'+esc(S.pc)+'</strong></p><p>'+nl2br(S.pcjus)+'</p>';
  h += '<h2>Árbol de problemas</h2>';
  var ef = porNivel(-1), ca = porNivel(1);
  Object.keys(ef).map(Number).sort(function(a,b){ return b-a; }).forEach(function(k){
    h += '<h3>Efectos · nivel '+k+'</h3><ul>'+ef[k].map(function(id){ return '<li>'+esc(sitText(id))+'</li>'; }).join('')+'</ul>';
  });
  Object.keys(ca).map(Number).sort(function(a,b){ return a-b; }).forEach(function(k){
    h += '<h3>Causas · nivel '+k+'</h3><ul>'+ca[k].map(function(id){
      var s = sitById(id);
      return '<li>'+esc(sitText(id))+(s&&s.d?' <em>('+esc(dimOf(s.d).n)+')</em>':'')+'</li>'; }).join('')+'</ul>';
  });
  h += '<h3>Relaciones de causalidad</h3><table><tr><th>Esto…</th><th>…produce esto</th></tr>'+
    S.lnk.map(function(l){ return '<tr><td>'+esc(sitText(l.a))+'</td><td>'+esc(sitText(l.b))+'</td></tr>'; }).join('')+'</table>';
  h += '<h2>Árbol de objetivos</h2><p><strong>Objetivo central: </strong>'+esc(S.objc)+'</p>';
  Object.keys(ef).map(Number).sort(function(a,b){ return b-a; }).forEach(function(k){
    h += '<h3>Fines · nivel '+k+'</h3><ul>'+ef[k].map(function(id){ return '<li>'+esc(objText(id))+'</li>'; }).join('')+'</ul>';
  });
  Object.keys(ca).map(Number).sort(function(a,b){ return a-b; }).forEach(function(k){
    h += '<h3>Medios · nivel '+k+'</h3><ul>'+ca[k].map(function(id){ return '<li>'+esc(objText(id))+'</li>'; }).join('')+'</ul>';
  });
  h += '<h2>Alternativas</h2><table><tr><th>#</th><th>Medio</th><th>Actividad</th><th>A favor</th><th>En contra</th></tr>'+
    (S.alt||[]).map(function(a){
      return '<tr><td>'+esc(a.id)+(a.id===S.altSel?' ✔':'')+'</td><td>'+esc(a.med)+'</td><td>'+esc(a.act)+
             '</td><td>'+esc(a.ven)+'</td><td>'+esc(a.des)+'</td></tr>'; }).join('')+'</table>'+
    '<p>'+nl2br(S.altJus)+'</p>';
  var caps = {}, order = [];
  F01.forEach(function(it){ if(!caps[it.cap]){ caps[it.cap]=[]; order.push(it.cap); } caps[it.cap].push(it); });
  h += '<h2>Respuestas modelo del Formulario 01</h2>';
  order.forEach(function(cp){
    h += '<h3>'+esc(cp)+'</h3>';
    caps[cp].forEach(function(it){
      h += '<div class="p-i"><h4>'+it.L+' · '+esc(it.t)+'</h4><div class="p-v">'+nl2br(S.f01[it.L]||'')+'</div></div>';
    });
  });
  h += '<h2>Estructura Analítica del Proyecto</h2><table>'+
    [['Fin','fin'],['Propósito','prop'],['Componente','comp'],['Actividad','act']].map(function(p){
      return '<tr><th>'+p[0]+'</th><td>'+esc(S.eap[p[1]]||'')+'</td></tr>'; }).join('')+'</table>';
  h += '<h2>Matriz de Marco Lógico</h2><table><tr><th></th><th>Resumen narrativo</th><th>Indicadores</th><th>Medios de verificación</th><th>Supuestos</th></tr>'+
    [['fin','Fin'],['prop','Propósito'],['comp','Componente'],['act','Actividad']].map(function(r){
      var m = S.mml[r[0]]||[];
      return '<tr><th>'+r[1]+'</th>'+[0,1,2,3].map(function(j){ return '<td>'+esc(m[j]||'')+'</td>'; }).join('')+'</tr>';
    }).join('')+'</table>';
  h += '<h2>Señales de corrección</h2><ul>'+(S.corr||[]).map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>';
  if(AV){
    var ch = chequeos();
    h += '<h2>Corrección del equipo '+esc((AV.eq||{}).nombre||'sin nombre')+'</h2>'+
      '<table><tr><th>Chequeo</th><th>Resultado</th><th>Detalle</th></tr>'+
      ch.map(function(x){ return '<tr><td>'+esc(x.t)+'</td><td>'+(x.ok?'cumple':'revisar')+'</td><td>'+esc(x.d)+'</td></tr>'; }).join('')+'</table>'+
      '<table><tr><th>Ítem</th><th>Estado</th></tr>'+
      F01.map(function(it){ var st = estadoItem(avText(it.L));
        return '<tr><td>'+it.L+' · '+esc(it.t)+'</td><td>'+st.txt+'</td></tr>'; }).join('')+'</table>';
  }
  return h;
}

  setTimeout(function(){ window.print(); }, 60);

document.getElementById('b-print').onclick = doPrint;

/* =============================================================== CARGA DEL AVANCE */
document.getElementById('b-load').onclick = function(){ document.getElementById('fileIn').click(); };
document.getElementById('fileIn').addEventListener('change', function(ev){
  var f = ev.target.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var o = JSON.parse(rd.result);
      if(!o || typeof o !== 'object'){ toast('Ese archivo no es un avance del Formulario 01.'); return; }
      AV = o;
      var si = SECS.findIndex(function(s){ return s.t === 'Comparar con el avance del equipo'; });
      if(o.esc && o.esc !== N && SOL[String(o.esc)]){
        if(confirm('Ese avance es del Escenario '+o.esc+' y la guía está en el '+N+'. ¿Cambiar al Escenario '+o.esc+'?')){
          setEsc(o.esc, false);
          si = SECS.findIndex(function(s){ return s.t === 'Comparar con el avance del equipo'; });
        }
      }
      if(si >= 0) show(si); else render(cur);
      toast('Avance de «'+((o.eq||{}).nombre || 'equipo sin nombre')+'» cargado.');
    }catch(e){ toast('No se pudo leer ese archivo.'); }
  };
  rd.readAsText(f);
  ev.target.value = '';
});

/* =============================================================== ARRANQUE */
(function boot(){
  var n = SC[0].n;
  var m = (location.hash||'').replace('#','').split('-');
  var hn = parseInt(m[0], 10), hs = parseInt(m[1], 10);
  if(hn && SOL[String(hn)]) n = hn;
  else { try{ var st = JSON.parse(localStorage.getItem(KEY)||'{}'); if(st.n && SOL[String(st.n)]) n = st.n; }catch(e){} }
  N = n; ESC = SC.filter(function(x){ return x.n===n; })[0]; S = SOL[String(n)];
  scPaint();
  buildAll();
  show(hs >= 1 && hs <= SECS.length ? hs-1 : 0);
})();
</script>
