 "t": "Las tres corrientes de residuos del establecimiento porcino —líquida, sólida y gaseosa— se disponen sin tratamiento adecuado y de manera desacoplada entre sí, afectando el suelo, el agua subterránea y el aire del predio rural de unas 120 ha del Valle de Lerma, en el departamento Rosario de Lerma.", "k": "p", "d": "amb"}, {"id": "s2", "t": "El manejo se decide corriente por corriente: cada decisión sobre el efluente, el sólido o el gas se toma sin un balance de masa que muestre cómo modifica el volumen, la composición y el valor de las otras dos.", "k": "c", "d": "tec"}, {"id": "s3", "t": "Las fosas bajo el piso enrejillado no drenan por completo y una de las piletas tiene el talud roto con pérdida al terreno natural: las instalaciones de captación y almacenamiento operan fuera de sus condiciones de diseño.", "k": "c", "d": "tec"}, {"id": "s4", "t": "La playa de compostaje de 1.080 m² opera al 30 % de su capacidad y sin control de temperatura ni rotación de pilas, de modo que la fracción sólida separable, la mortandad y las placentas no completan su estabilización.", "k": "c", "d": "tec"}, {"id": "s5", "t": "La digestión anaerobia del purín ocurre de manera espontánea en fosas y piletas abiertas, sin confinamiento ni captación del biogás que allí se genera.", "k": "c", "d": "tec"}, {"id": "s6", "t": "El predio no tiene superficie afectada a la aplicación agronómica de purines ni un plan de balance de nutrientes con ventanas de aplicación compatibles con el régimen de lluvias, de modo que la corriente líquida no tiene destino final definido dentro de las 120 ha.", "k": "c", "d": "ter"}, {"id": "s7", "t": "El volumen de efluente generado no se cuantifica ni su composición se analiza de manera sistemática, y el agua de bebida —estimada en 18 litros por animal y por día— se mezcla con el agua de lavado y con la deyección sin segregación previa: casi todo lo que ingresa al predio sale como corriente líquida a gestionar, con una carga que se desconoce.", "k": "c", "d": "tec"}, {"id": "s8", "t": "El emplazamiento de fosas, piletas y playa no fue definido sobre una caracterización hidrogeológica del sitio, porque no existe cartografía provincial de acuíferos someros ni registro de pozos de agua potable en el área y el establecimiento tampoco la construyó.", "k": "c", "d": "amb"}, {"id": "s9", "t": "Las trece personas que trabajan en el establecimiento no tienen responsabilidades asignadas ni procedimientos escritos para la operación de fosas, piletas y playa de compostaje: el manejo de los residuos depende de la disponibilidad diaria de cada tarea productiva.", "k": "c", "d": "soc"}, {"id": "s10", "t": "Para el titular, el costo de disponer sin tratar es menor que el de tratar: la carga ambiental no está internalizada en la estructura de costos del establecimiento y la inversión en gestión de residuos no compite con las inversiones en genética, alimento e instalaciones productivas.", "k": "c", "d": "eco"}, {"id": "s11", "t": "No existe norma provincial que regule la actividad pecuaria intensiva ni protocolo de uso agronómico de purines, y el control externo se activa recién en la instancia de renovación del certificado de aptitud ambiental: no hay estándar de referencia ni consecuencia oportuna del incumplimiento.", "k": "c", "d": "ins"}, {"id": "s12", "t": "En los pozos de monitoreo propios del establecimiento se detectan coliformes por encima de los valores admisibles: la napa somera bajo el predio está recibiendo carga fecal.", "k": "e", "d": "amb"}, {"id": "s13", "t": "El agua de consumo del establecimiento y la de las viviendas dispersas del entorno queda sometida a un riesgo sanitario que hoy no puede acotarse, porque no hay registro de pozos ni cartografía de acuíferos someros que permita saber hasta dónde llega la pluma.", "k": "e", "d": "soc"}, {"id": "s14", "t": "Las emisiones de amoníaco y de sulfuro de hidrógeno provenientes de fosas y piletas superan el nivel de molestia en el entorno inmediato del establecimiento.", "k": "e", "d": "amb"}, {"id": "s15", "t": "El vecindario convive de manera sostenida con el olor y la licencia social de operación del establecimiento se deteriora, con un conflicto latente que todavía no se formalizó como denuncia.", "k": "e", "d": "soc"}, {"id": "s16", "t": "Las trece personas que trabajan en el establecimiento están expuestas de manera crónica a amoníaco y sulfuro de hidrógeno en las naves y en el entorno de las fosas.", "k": "e", "d": "soc"}, {"id": "s17", "t": "El metano de la digestión anaerobia espontánea se libera a la atmósfera mientras el establecimiento compra gas para calefacción, y los 1.080 m² de playa de compostaje permanecen mayoritariamente ociosos: el titular sostiene un costo operativo que sus propias corrientes de residuos podrían cubrir.", "k": "e", "d": "eco"}, {"id": "s18", "t": "El expediente de renovación del certificado de aptitud ambiental acumula observaciones de la autoridad y la continuidad de la operación del establecimiento queda sujeta a condicionamientos.", "k": "e", "d": "ins"}], "lnk": [{"a": "s2", "b": "s1"}, {"a": "s3", "b": "s1"}, {"a": "s4", "b": "s1"}, {"a": "s5", "b": "s1"}, {"a": "s6", "b": "s1"}, {"a": "s7", "b": "s2"}, {"a": "s7", "b": "s3"}, {"a": "s7", "b": "s4"}, {"a": "s7", "b": "s6"}, {"a": "s8", "b": "s3"}, {"a": "s9", "b": "s3"}, {"a": "s9", "b": "s4"}, {"a": "s10", "b": "s3"}, {"a": "s10", "b": "s4"}, {"a": "s10", "b": "s5"}, {"a": "s10", "b": "s7"}, {"a": "s10", "b": "s9"}, {"a": "s11", "b": "s10"}, {"a": "s11", "b": "s6"}, {"a": "s11", "b": "s8"}, {"a": "s1", "b": "s12"}, {"a": "s1", "b": "s14"}, {"a": "s1", "b": "s17"}, {"a": "s1", "b": "s18"}, {"a": "s12", "b": "s13"}, {"a": "s12", "b": "s18"}, {"a": "s14", "b": "s15"}, {"a": "s14", "b": "s16"}, {"a": "s15", "b": "s18"}], "obj": {"s1": "Las tres corrientes de residuos del establecimiento porcino —líquida, sólida y gaseosa— se gestionan de manera integrada y con tratamiento adecuado, preservando el suelo, el agua subterránea y el aire del predio rural de unas 120 ha del Valle de Lerma, en el departamento Rosario de Lerma.", "s2": "El manejo de las tres corrientes se decide sobre un balance de masa único, que muestra cómo cada decisión sobre el efluente, el sólido o el gas modifica el volumen, la composición y el valor de las otras dos.", "s3": "Las fosas bajo el piso enrejillado drenan por completo y las piletas conservan su integridad estructural y su impermeabilización: las instalaciones de captación y almacenamiento operan dentro de sus condiciones de diseño.", "s4": "La playa de compostaje de 1.080 m² opera a plena capacidad, con control de temperatura y rotación de pilas, y estabiliza la fracción sólida separable, la mortandad y las placentas.", "s5": "La digestión anaerobia del purín ocurre en un reactor confinado, con captación del biogás generado.", "s6": "El predio cuenta con superficie afectada a la aplicación agronómica de purines y con un plan de balance de nutrientes y ventanas de aplicación compatibles con el régimen de lluvias: la corriente líquida tiene destino final definido dentro de las 120 ha.", "s7": "El volumen de efluente generado se cuantifica y su composición se analiza de manera sistemática, y el agua de bebida se segrega del agua de lavado y de la deyección: la carga real de cada corriente es conocida y las instalaciones se dimensionan contra ella.", "s8": "El emplazamiento de fosas, piletas y playa se define sobre una caracterización hidrogeológica propia del sitio, que incluye profundidad y vulnerabilidad de la napa somera y relevamiento de los pozos del entorno.", "s9": "Las trece personas que trabajan en el establecimiento tienen responsabilidades asignadas y procedimientos escritos para la operación de fosas, piletas, reactor y playa de compostaje.", "s10": "Para el titular, el costo de gestionar correctamente las tres corrientes es menor que el de no hacerlo, porque la energía y la enmienda recuperadas y el riesgo regulatorio evitado están internalizados en la estructura de costos del establecimiento.", "s11": "El establecimiento cuenta con un estándar de referencia exigible —protocolo propio de uso agronómico de purines y condiciones expresas en el certificado de aptitud ambiental— y con un régimen de autocontrol y control externo de frecuencia definida.", "s12": "Los pozos de monitoreo propios del establecimiento registran coliformes dentro de los valores admisibles: la napa somera bajo el predio no recibe carga fecal.", "s13": "El agua de consumo del establecimiento y la de las viviendas dispersas del entorno tiene un riesgo sanitario acotado y verificable, sostenido en el relevamiento de pozos y en la caracterización de la napa somera del área.", "s14": "Las emisiones de amoníaco y de sulfuro de hidrógeno del manejo de residuos se mantienen por debajo del nivel de molestia en el entorno inmediato del establecimiento.", "s15": "El vecindario convive con la operación del establecimiento sin percibir molestia y la licencia social de operación se sostiene.", "s16": "Las trece personas que trabajan en el establecimiento operan con exposición a amoníaco y sulfuro de hidrógeno dentro de los niveles admisibles.", "s17": "El metano generado se captura y sustituye el gas que hoy se compra para calefacción, y los 1.080 m² de playa de compostaje producen enmienda orgánica: las corrientes de residuos financian parte de su propia gestión.", "s18": "El expediente de renovación del certificado de aptitud ambiental se resuelve sin observaciones pendientes y la continuidad de la operación del establecimiento queda asegurada."}, "f01": {"A": "Propuesta de ejemplo, no la única respuesta válida: CICLO SUR (S.H.). · Por qué: el nombre remite al cierre de ciclos de materia y energía —el eje del ámbito de actuación declarado en el ítem C— y ubica al equipo en el noroeste argentino, donde se prevé la actividad profesional. Es corto, pronunciable, sirve como marca de un estudio de consultoría ambiental y no describe ningún proyecto en particular, de modo que acompaña al equipo aunque cambie el escenario. · Advertencia de corrección: este nombre es el del equipo, no el del proyecto. El nombre del proyecto se define recién en el ítem V y es otro. Se asume sociedad de hecho, sin definir tipo societario en esta instancia.", "B": "Estructura de roles para esta entrega, sin nombres reales (Integrante 1 a Integrante 5): · Integrante 1 — Coordinación general: convoca las reuniones, consolida el formulario, controla coherencia entre árboles, EAP y MML, y es el enlace con la cátedra. La coordinación es rotativa y removible por mayoría, informando por correo. Dedicación estimada 22 h. · Integrante 2 — Relevamiento técnico de las tres corrientes: sistematiza lo que el escenario aporta sobre purines, fracción sólida y emisiones gaseosas, y arma el esquema de balance de masa preliminar. 20 h. · Integrante 3 — Marco institucional y normativo: construye la matriz de cumplimiento legal e identifica las autoridades de aplicación (ítems I y J). 18 h. · Integrante 4 — Dimensión económica: costos evitados, valor recuperable de cada corriente y criterios de comparación de alternativas (ítem R). 18 h. · Integrante 5 — Redacción, edición y paratextos: croquis del predio, esquema de flujos y diagramación de los árboles. 20 h. · Metodología acordada: dos reuniones semanales, una presencial y una virtual, repositorio compartido de documentos y un canal de mensajería para la coordinación diaria. Total declarado: 98 h efectivamente trabajadas; no se computan tiempos muertos ni se incluye a quien no aportó a esta entrega.", "C": "Ámbito de actuación declarado: gestión ambiental de proyectos de inversión y economía circular. Se declaran los dos porque las categorías de la Guía no son mutuamente excluyentes y el caso los requiere a ambos. · Gestión ambiental de proyectos de inversión: el titular es un privado que produce carne porcina; la intervención no crea una nueva actividad sino que adecua ambientalmente una que ya opera hace más de una década, en el marco del expediente de renovación de su certificado de aptitud ambiental y sin detener la producción. La decisión se toma con criterios de inversión: monto, plazo de recupero y riesgo regulatorio. · Economía circular: el escenario indica que el metano que hoy se pierde es energía que el establecimiento compra en otra forma y que la playa de compostaje es capacidad instalada ociosa; el purín, además, contiene nutrientes con valor agronómico. Las tres corrientes admiten valorización dentro del propio predio. · Subsidiariamente el caso también se inscribe en gestión de residuos, pero el énfasis está puesto en los dos ámbitos declarados: el proyecto no se agota en disponer bien los residuos, sino en convertirlos en insumos del mismo establecimiento. · Nota de método: este ítem se cerró después de redactar el D, tal como recomienda la Guía.", "D": "«Las tres corrientes de residuos del establecimiento porcino —líquida, sólida y gaseosa— se disponen sin tratamiento adecuado y de manera desacoplada entre sí, afectando el suelo, el agua subterránea y el aire del predio rural de unas 120 ha del Valle de Lerma, en Rosario de Lerma.» · Identidad: el ambiente receptor del predio —suelo, napa somera y atmósfera— y con él el titular, sus trece trabajadores y los vecinos dispersos. · Ubicación: predio rural de unas 120 ha en Rosario de Lerma. · Tiempo: actual, acumulada en más de una década de operación en ciclo completo. · Mensurabilidad: carga de cada corriente —DQO, DBO y coliformes del purín, sólido estabilizado, metano liberado— y calidad de la napa en los pozos propios. · Magnitud: DQO y DBO de treinta a cuarenta veces los umbrales provinciales, coliformes fecales tres órdenes de magnitud sobre el límite y detección por encima de lo admisible en los pozos de monitoreo. · No se enuncia como «falta de planta de tratamiento»: presupone la solución y es parcial, porque lo que se retira del líquido reaparece en el sólido y en el gas.", "E": "Se propone un índice de tres indicadores, uno por corriente, más un indicador de resultado sobre el receptor. · Indicador 1 (corriente líquida): porcentaje de reducción de la DQO del purín entre el ingreso y la salida del sistema, en el establecimiento, medido trimestralmente. Valor sin proyecto: 0 % de reducción; el purín se dispone tal cual, con DQO y DBO entre treinta y cuarenta veces los umbrales provinciales. Medio de verificación: protocolos de laboratorio habilitado sobre muestras de fosa y de pileta, archivados en el legajo ambiental del establecimiento. · Indicador 2 (corriente sólida): porcentaje de utilización de la playa de compostaje de 1.080 m², en el establecimiento, medido mensualmente. Valor sin proyecto: 30 %, sin control de temperatura ni rotación de pilas. Medio de verificación: planilla de carga de pilas y registro de temperatura (a crear). · Indicador 3 (corriente gaseosa): porcentaje del biogás generado que se capta y se usa, en el establecimiento, medido mensualmente. Valor sin proyecto: 0 %; la digestión anaerobia es espontánea y el metano se libera mientras se compra gas para calefacción. Medio de verificación: medidor de caudal de biogás y comprobantes de compra de gas (a instalar y sistematizar). · Indicador 4 (receptor): número de pozos de monitoreo propios con coliformes por encima de los valores admisibles, en el predio, medido trimestralmente. Valor sin proyecto: los pozos propios registran detecciones por encima de lo admisible; la cantidad exacta de pozos y la serie histórica deben relevarse (se asume una red de tres pozos, a verificar en el F02). · Lo que el escenario ya aporta: cargas del purín, uso de la playa, consumo de 18 litros por animal y por día, superficie de la playa y el hecho de las detecciones en pozos. · Lo que hay que relevar: caudal real de efluente y su variación estacional, masa de sólido y de mortandad por semana, generación potencial de biogás, profundidad y dirección de flujo de la napa somera, y censo de pozos del entorno. Ninguno de estos valores se inventa: se declara el supuesto y se verifica en el F02.", "F": "Contexto geográfico y productivo: predio rural de unas 120 ha en el departamento Rosario de Lerma, Valle de Lerma, entorno rural de población dispersa. El establecimiento opera hace más de una década en ciclo completo, coloca del orden de 160 capones por semana y emplea trece personas; es, por escala, una explotación pecuaria intensiva inserta en una matriz agropecuaria de valle. · Dimensión ambiental: el agua proviene de una perforación propia y el consumo se estima en 18 litros por animal y por día más el lavado, de modo que casi todo lo que ingresa sale como corriente a gestionar. El receptor crítico es la napa somera, sobre la que no existe cartografía provincial de acuíferos ni registro de pozos de agua potable en el área: la vulnerabilidad del recurso es desconocida y esa ignorancia es parte del contexto que potencia el problema. El régimen de lluvias del valle es estacional y condiciona las ventanas de aplicación agronómica de purines. En materia de aire, el inventario provincial estima las emisiones del sector porcino en 109.548 t CO₂e/año, con la mayor parte del metano proveniente de la gestión del estiércol. · Dimensión socioeconómica: población rural dispersa en el entorno inmediato, que percibe el olor y que se asume abastecida por perforaciones propias (a verificar en el F02, dado que no hay registro de pozos). El establecimiento es fuente de trabajo para trece personas y su continuidad depende de la renovación del certificado de aptitud ambiental. · Qué del contexto potencia el problema: el vacío normativo provincial en pecuaria intensiva, la ausencia de información hidrogeológica y el hecho de que la ventana de control sea episódica. · Qué del contexto contribuye a la solución: hay capacidad instalada ociosa (1.080 m² de playa de compostaje), superficie propia disponible dentro de las 120 ha para aplicación agronómica y una demanda energética interna que el biogás puede sustituir. · Fuentes: escenario asignado (situación, evidencias y condicionantes); todo dato adicional debe citarse con fuente y año.", "G": "Población potencial: quienes internalizan hoy el problema. Comprende al titular del establecimiento como responsable patrimonial y regulatorio; a las trece personas que allí trabajan, expuestas de manera crónica a amoníaco y sulfuro de hidrógeno; y a los hogares rurales dispersos del entorno inmediato que perciben el olor y que se abastecen de agua subterránea del mismo acuífero somero. La cantidad de hogares no está en el escenario y no se inventa: se asume, como primera aproximación, el conjunto de viviendas ubicadas dentro de un radio de 1.000 m del perímetro del predio, a censar en el F02 junto con el relevamiento de pozos. · Población objetivo: el proyecto es de titularidad privada y actúa dentro del predio, por lo que puede atender de manera directa y completa a una parte de la población potencial y sólo indirecta al resto. Se define como población objetivo al establecimiento como unidad —el titular y las trece personas que operan las instalaciones, destinatarios directos de los procedimientos, de la capacitación y de la mejora de las condiciones de trabajo— y a los hogares del entorno inmediato alcanzados por la reducción de olor y por la protección de la napa. · Criterio de recorte: se excluye del alcance a los usuarios del acuífero fuera del entorno inmediato, porque el proyecto no puede garantizar la calidad de un recurso sometido a otras fuentes de carga; y se excluye al resto de los productores porcinos del valle, aunque el caso sea replicable, porque el proyecto no tiene mandato ni recursos para intervenir en predios de terceros. · No corresponde declarar «toda la comunidad de Rosario de Lerma»: sería un enunciado que el proyecto no puede sostener.", "H": "Escala numérica 0 a 1, la misma para fuerza e importancia. · 1. Titular del establecimiento porcino — privada — a favor (es quien decide y financia; pero su posición es condicionada: sólo sostiene el proyecto si el análisis económico cierra) — fuerza 1,0 — importancia 1,0 — interés: conservar el certificado de aptitud ambiental, evitar sanciones y capturar el valor de las corrientes. · 2. Trabajadores del establecimiento (13 personas) — privada — a favor — fuerza 0,4 (pueden facilitar o resistir el cambio de rutinas operativas) — importancia 0,8 — interés: reducir su exposición y conservar el empleo. · 3. Vecinos rurales del entorno inmediato — sociedad civil — en contra de la situación actual y a favor de la intervención, con desconfianza inicial — fuerza 0,6 (pueden formalizar la denuncia que hoy está latente y activar el control) — importancia 0,9 — interés: eliminar el olor y asegurar la calidad del agua de sus pozos. · 4. Autoridad ambiental provincial de Salta — pública — a favor con exigencia; hoy influye negativamente sobre la situación por la baja frecuencia de control — fuerza 0,9 (renueva o condiciona el certificado de aptitud ambiental) — importancia 0,9 — interés: cerrar las observaciones del expediente. · 5. Autoridad provincial del agua — pública — a favor — fuerza 0,7 (permiso de uso de la perforación y régimen de vertidos) — importancia 0,7 — interés: proteger el acuífero somero del Valle de Lerma. · 6. Municipio de Rosario de Lerma — pública — indiferente hasta que aparece el reclamo vecinal — fuerza 0,4 (habilitación y uso del suelo) — importancia 0,5 — interés: evitar el conflicto en su ejido rural. · 7. Proveedores de tecnología y entidad financiera — privada — a favor por interés comercial — fuerza 0,5 (condicionan plazos y costo del capital) — importancia 0,6 — interés: colocar equipamiento y crédito. · Estrategia hacia los actores adversos o indiferentes: al vecindario, información anticipada y un canal de reclamos con respuesta; al municipio, presentación del proyecto antes de la obra; a la autoridad ambiental, un plan de adecuación con hitos verificables incorporado al expediente.", "I": "Titular del proyecto: el propio establecimiento porcino, bajo la figura de la persona —humana o jurídica— que hoy es titular del certificado de aptitud ambiental y de la habilitación de la explotación. Es un proyecto de inversión privada de adecuación ambiental, no un programa público: la decisión, el financiamiento y la operación quedan del lado del titular, y por eso el análisis económico del F02 se hace con su tasa de descuento y con sus costos evitados. · Dependencias institucionales para que el proyecto exista: (a) la autoridad ambiental provincial de Salta, que otorga y renueva el certificado de aptitud ambiental y ante la cual se presenta el estudio ambiental de la adecuación; (b) la autoridad provincial del agua, por el permiso de uso de la perforación y por el régimen aplicable a vertidos y a la aplicación de efluentes al suelo; (c) el organismo nacional de sanidad animal, por el registro del establecimiento y por el destino de la mortandad, las placentas y los residuos de sanidad animal; (d) el municipio de Rosario de Lerma, por la habilitación y por el uso del suelo rural donde se emplace la obra; (e) la distribuidora de energía, sólo si el uso del biogás incluyera generación eléctrica con inyección o con conexión en paralelo; (f) la entidad financiera o el programa de crédito que eventualmente aporte el capital. · Todos estos actores figuran también en el ítem H, con la excepción del organismo de sanidad animal, que se incorpora allí si el equipo amplía la tabla. · En esta instancia sólo se identifican: no corresponde iniciar gestiones ni firmar acuerdos, que llegan al pasar de perfil a prefactibilidad.", "J": "Matriz de cumplimiento legal, por materia. Cuando no se tiene certeza del número, la norma se nombra por su materia; no se consignan números de ley ni de decreto de memoria. · Nacional: Constitución Nacional, artículo 41 (derecho a un ambiente sano y deber de recomponer). Ley general del ambiente, de presupuestos mínimos: evaluación de impacto ambiental, seguro ambiental y daño ambiental de incidencia colectiva. Régimen de presupuestos mínimos para la gestión de aguas. Régimen nacional de residuos peligrosos, aplicable a los residuos de sanidad animal —envases de medicamentos veterinarios, agujas y descartes— y eventualmente a barros con determinadas características. Normativa del organismo nacional de sanidad animal sobre registro de establecimientos porcinos, movimiento de animales y destino de mortandad, placentas y subproductos no comestibles de origen animal. · Provincial (Salta): ley provincial de protección del medio ambiente y su reglamentación, régimen de evaluación de impacto ambiental y certificado de aptitud ambiental —marco directo del expediente de renovación en curso—. Código de aguas de la provincia y su reglamentación sobre uso del recurso, perforaciones y vertido de efluentes, con los límites de DQO, DBO y coliformes que el escenario toma como referencia. Régimen provincial de adhesión a residuos peligrosos. Normativa provincial de ordenamiento territorial y de uso del suelo rural. · Municipal (Rosario de Lerma): ordenanzas de habilitación de actividades productivas, de uso del suelo y de control de molestias —olores, ruidos y vectores— en el ejido municipal. · Vacío normativo relevante, que es a la vez un condicionante del escenario: no existe norma provincial que regule específicamente la actividad pecuaria intensiva ni protocolo de uso agronómico de purines. Consecuencia práctica: el estándar de referencia del proyecto debe construirse combinando los límites generales de vertido, la normativa de sanidad animal y buenas prácticas reconocidas, y proponerse a la autoridad como compromiso incorporado al certificado. Escribir que existe una norma provincial de porcinos sería un error de hecho. · Todas las normas citadas deben verificarse en su texto ordenado y vigencia antes de la entrega.", "K": "Causas ordenadas por nivel, leídas de la raíz hacia el tronco. · Causa 1 (técnica): el manejo se decide corriente por corriente, sin balance de masa que vincule líquido, sólido y gas; cada solución parcial genera el problema siguiente. · Causa 2 (técnica): las fosas bajo el piso enrejillado no drenan por completo y una pileta tiene el talud roto con pérdida al terreno natural. · Causa 3 (técnica): la playa de compostaje de 1.080 m² opera al 30 % de su capacidad, sin control de temperatura ni rotación de pilas. · Causa 4 (técnica): la digestión anaerobia ocurre de manera espontánea en fosas y piletas abiertas, sin confinamiento ni captación del biogás. · Causa 5 (territorial): el predio no tiene superficie afectada a la aplicación agronómica ni plan de balance de nutrientes con ventanas compatibles con el régimen de lluvias; la corriente líquida no tiene destino final dentro de las 120 ha. · Causa 1.1 / 2.1 / 3.1 / 5.1 (técnica): no se cuantifica el volumen de efluente ni se analiza su composición de manera sistemática, y el agua de bebida (18 l/animal/día) se mezcla con la de lavado y con la deyección sin segregación previa; se opera sin conocer la carga y ninguna instalación puede dimensionarse contra ella. · Causa 2.2 (ambiental): el emplazamiento de las instalaciones de acumulación no se definió sobre una caracterización hidrogeológica del sitio, porque no existe cartografía provincial de acuíferos someros ni registro de pozos y el establecimiento tampoco la construyó. · Causa 2.3 / 3.2 (social): las trece personas del establecimiento no tienen responsabilidades asignadas ni procedimientos escritos para operar fosas, piletas y playa. · Causa 2.4 / 3.3 / 4.1 (económica): para el titular, el costo de disponer sin tratar es menor que el de tratar; la carga ambiental no está internalizada y la inversión en residuos no compite con la inversión productiva. Esta causa también explica por qué no se mide (causa 1.1) y por qué no hay procedimientos (causa 2.3). · Causa raíz (institucional): no existe norma provincial que regule la actividad pecuaria intensiva ni protocolo de uso agronómico de purines, y el control externo se activa recién en la renovación del certificado; sin estándar exigible ni consecuencia oportuna, no hay señal que corrija el cálculo económico anterior, no hay a quién exigirle la información hidrogeológica y no hay marco para la aplicación agronómica. · Verificación de derecha a izquierda: el vacío normativo y el control episódico sostienen el cálculo económico; ese cálculo explica que no se mida, que no se asignen responsabilidades y que no se invierta en mantener las instalaciones; sin medición, sin mantenimiento, sin operación de la playa, sin captación de biogás y sin destino agronómico, las tres corrientes se disponen sin tratamiento y de manera desacoplada. · Se evita el error de quedarse en el primer nivel: las causas 1 a 5 son operativas y visibles, pero las alternativas útiles aparecen recién en los niveles siguientes.", "L": "Efectos ordenados del tronco hacia las ramas. · Efecto 1 (ambiental): en los pozos de monitoreo propios se detectan coliformes por encima de los valores admisibles; la napa somera bajo el predio recibe carga fecal, tanto por la pérdida del talud roto como por la infiltración desde fosas que no drenan. · Efecto 1.1 (social): el agua de consumo del establecimiento y la de las viviendas dispersas del entorno queda sometida a un riesgo sanitario que hoy no puede acotarse, porque no hay registro de pozos ni cartografía de acuíferos que permita saber hasta dónde llega la afectación. · Efecto 2 (ambiental): las emisiones de amoníaco y de sulfuro de hidrógeno desde fosas y piletas superan el nivel de molestia en el entorno inmediato. · Efecto 2.1 (social): el vecindario convive de manera sostenida con el olor y la licencia social de operación se deteriora; el conflicto está latente y todavía no se formalizó como denuncia. · Efecto 2.2 (social): las trece personas que trabajan en el establecimiento están expuestas de manera crónica a amoníaco y sulfuro de hidrógeno en las naves y en el entorno de las fosas. · Efecto 3 (económico): el metano de la digestión anaerobia espontánea se libera a la atmósfera mientras el establecimiento compra gas para calefacción, y los 1.080 m² de playa permanecen mayoritariamente ociosos; el titular sostiene un costo operativo que sus propias corrientes podrían cubrir, y aporta a las emisiones del sector porcino provincial, estimadas en 109.548 t CO₂e/año con la mayor parte del metano proveniente de la gestión del estiércol. Este efecto es la respuesta a la pregunta orientadora del escenario: operar una década sin invertir en gestión de residuos no fue gratis, sino un costo pagado en energía comprada, capacidad ociosa, nutrientes perdidos y riesgo acumulado. · Efecto 4 (institucional): el expediente de renovación del certificado de aptitud ambiental acumula observaciones de la autoridad y la continuidad de la operación queda sujeta a condicionamientos. Este efecto se refuerza por el efecto 1 —las detecciones en los pozos son evidencia en el expediente— y por el efecto 2.1, porque un reclamo vecinal formalizado activa el control. · Verificación de izquierda a derecha: el efecto 1 produce el 1.1; el efecto 2 produce el 2.1 y el 2.2; los efectos 1 y 2.1 alimentan el efecto 4.", "M": "Lectura encadenada del árbol, de las raíces a las ramas. · En la base está el vacío institucional: no hay norma provincial de pecuaria intensiva ni protocolo de uso agronómico de purines, y el control externo aparece sólo cuando vence el certificado. Sin estándar exigible ni consecuencia oportuna, para el titular resulta más barato disponer que tratar, y la inversión en gestión de residuos queda siempre detrás de la inversión productiva. De ese cálculo se desprenden tres cosas: no se mide el efluente ni se lo segrega del agua de bebida y de lavado, no se asignan responsabilidades ni procedimientos entre las trece personas del establecimiento, y no se mantienen ni se completan las instalaciones. El mismo vacío explica que nadie haya exigido la caracterización hidrogeológica del sitio —tampoco existe cartografía provincial de acuíferos someros— y que la corriente líquida no tenga un destino agronómico reglado dentro de las 120 ha. · En el nivel siguiente aparecen las fallas operativas: fosas que no drenan por completo, una pileta con el talud roto que pierde al terreno natural, una playa de compostaje de 1.080 m² al 30 % de su capacidad y sin control de proceso, y una digestión anaerobia que ocurre igual, pero espontánea y abierta, sin captar el biogás. Sobre todo eso se apoya la causa que da unidad al caso: cada corriente se maneja por separado, sin balance de masa, de modo que lo que se retira de una reaparece en las otras dos. · En el tronco: las tres corrientes se disponen sin tratamiento adecuado y desacopladas, afectando suelo, agua subterránea y aire del predio y de su entorno. · Hacia arriba, las ramas se abren en tres direcciones. Por el agua: carga fecal en la napa somera, detectada ya en los pozos propios, y un riesgo sanitario sobre el agua de consumo del establecimiento y de las viviendas vecinas que no puede acotarse por falta de información. Por el aire: amoníaco y sulfuro de hidrógeno por encima del nivel de molestia, con deterioro de la licencia social y exposición crónica de los trabajadores. Por la economía del establecimiento: metano liberado mientras se compra gas y capacidad instalada ociosa. Las tres ramas convergen en el efecto que hoy obliga a actuar: las observaciones de la autoridad en el expediente de renovación y el condicionamiento de la continuidad productiva. · El árbol es, en esta instancia, un conjunto de hipótesis de trabajo: el balance de masa, la caracterización de la napa y el censo de pozos deben ponerse a prueba en el F02.", "N": "Medios, en espejo con el ítem K y con la misma jerarquía. Se enuncian como estados alcanzados, no como acciones. · Medio raíz (institucional): el establecimiento cuenta con un estándar de referencia exigible —protocolo propio de uso agronómico de purines y condiciones expresas incorporadas al certificado de aptitud ambiental— y con un régimen de autocontrol y control externo de frecuencia definida. · Medio (económico): el costo de gestionar correctamente las tres corrientes es menor que el de no hacerlo para el titular, porque la energía y la enmienda recuperadas y el riesgo regulatorio evitado están internalizados en su estructura de costos. · Medio (técnico): el volumen de efluente se cuantifica y su composición se analiza de manera sistemática, y el agua de bebida se segrega de la de lavado y de la deyección, de modo que la carga real es conocida y las instalaciones se dimensionan contra ella. · Medio (ambiental): el emplazamiento se define sobre una caracterización hidrogeológica propia, con profundidad y vulnerabilidad de la napa somera y relevamiento de pozos del entorno. · Medio (social): las trece personas del establecimiento tienen responsabilidades asignadas y procedimientos escritos para operar fosas, piletas, reactor y playa. · Medio (técnico): las fosas drenan por completo y las piletas conservan su integridad estructural y su impermeabilización. · Medio (técnico): la playa de compostaje de 1.080 m² opera a plena capacidad, con control de temperatura y rotación de pilas, y estabiliza fracción sólida, mortandad y placentas. · Medio (técnico): la digestión anaerobia del purín ocurre en un reactor confinado, con captación del biogás. · Medio (territorial): el predio tiene superficie afectada a la aplicación agronómica y un plan de balance de nutrientes con ventanas compatibles con el régimen de lluvias. · Medio (técnico, de síntesis): el manejo de las tres corrientes se decide sobre un balance de masa único que muestra cómo cada decisión modifica el volumen, la composición y el valor de las otras dos. · Medios fuera del alcance del proyecto, declarados explícitamente: la sanción de una norma provincial de pecuaria intensiva y la elaboración de cartografía provincial de acuíferos someros no dependen del titular. El proyecto los sustituye por equivalentes bajo su control: un protocolo propio comprometido ante la autoridad, y un estudio hidrogeológico de sitio con censo de pozos en el entorno inmediato. Esa sustitución debe quedar escrita, porque de lo contrario el árbol de objetivos promete lo que el proyecto no puede entregar.", "O": "Fines, en espejo con el ítem L. · Fin 1: los pozos de monitoreo propios registran coliformes dentro de los valores admisibles; la napa somera bajo el predio no recibe carga fecal. · Fin 1.1: el agua de consumo del establecimiento y la de las viviendas dispersas del entorno tiene un riesgo sanitario acotado y verificable, sostenido en el relevamiento de pozos y en la caracterización de la napa. · Fin 2: las emisiones de amoníaco y de sulfuro de hidrógeno se mantienen por debajo del nivel de molestia en el entorno inmediato. · Fin 2.1: el vecindario convive con la operación sin percibir molestia y la licencia social se sostiene. · Fin 2.2: las trece personas que trabajan en el establecimiento operan con exposición dentro de los niveles admisibles. · Fin 3: el metano generado se captura y sustituye el gas que hoy se compra para calefacción, y la playa de compostaje produce enmienda orgánica; las corrientes de residuos financian parte de su propia gestión y se reduce el aporte del establecimiento a las emisiones del sector. · Fin 4: el expediente de renovación del certificado de aptitud ambiental se resuelve sin observaciones pendientes y la continuidad de la operación queda asegurada. · Control de simetría: hay exactamente un fin por cada efecto del ítem L, con el mismo encadenamiento. No se agregaron fines sin efecto correspondiente ni quedaron efectos sin fin.", "P": "Problema central: «Las tres corrientes de residuos del establecimiento porcino —líquida, sólida y gaseosa— se disponen sin tratamiento adecuado y de manera desacoplada entre sí, afectando el suelo, el agua subterránea y el aire del predio rural de unas 120 ha del Valle de Lerma, en el departamento Rosario de Lerma.» · Objetivo central, propósito o meta: «Las tres corrientes de residuos del establecimiento porcino —líquida, sólida y gaseosa— se gestionan de manera integrada y con tratamiento adecuado, preservando el suelo, el agua subterránea y el aire del predio rural de unas 120 ha del Valle de Lerma, en el departamento Rosario de Lerma.» · Se conservan el mismo sujeto (las tres corrientes del establecimiento), la misma variable (modo de disposición y tratamiento), el mismo alcance espacial (el predio de unas 120 ha y su entorno inmediato) y el mismo indicador del ítem E. Sólo cambia el signo. No se amplió el alcance al Valle de Lerma ni al sector porcino provincial: el proyecto es de un titular privado y actúa sobre su propio predio.", "Q": "El árbol de objetivos reproduce nodo por nodo el árbol de problemas, con la meta en el tronco, los medios abajo y los fines arriba, y con la misma cantidad de ramas: dieciocho nodos y las mismas relaciones. · Abajo: estándar de referencia exigible y régimen de control definido (institucional) sostienen el cálculo económico favorable a la gestión correcta; ese cálculo permite que se mida y se segregue el agua, que se asignen responsabilidades y procedimientos, y que se invierta en mantener y completar las instalaciones. La caracterización hidrogeológica propia condiciona el emplazamiento y la impermeabilización de fosas y piletas; el plan de aplicación agronómica sobre superficie afectada le da destino a la corriente líquida. · Nivel intermedio: fosas que drenan y piletas íntegras, playa de compostaje a plena capacidad con control de proceso, reactor anaerobio confinado con captación de biogás y un balance de masa único que integra las tres decisiones. · Tronco: las tres corrientes gestionadas de manera integrada y con tratamiento adecuado. · Arriba: napa sin carga fecal y riesgo sanitario acotado; emisiones por debajo del nivel de molestia, con licencia social sostenida y exposición laboral admisible; metano capturado que sustituye gas comprado y enmienda producida; y, como fin superior, expediente de renovación resuelto sin observaciones y continuidad productiva asegurada. · Medios sobre los que el proyecto puede actuar directamente (se marcan en el diagrama): medición y segregación, integridad de fosas y piletas, operación de la playa, reactor con captación de biogás, plan agronómico, procedimientos y responsabilidades del personal, caracterización hidrogeológica de sitio y protocolo propio comprometido ante la autoridad. · Medios fuera del alcance: la norma provincial de pecuaria intensiva, la cartografía provincial de acuíferos y la frecuencia del control externo. Se declaran como tales y se trasladan a la columna de supuestos de la MML.", "R": "Las estrategias se obtienen preguntando, para cada medio bajo del árbol de objetivos, qué habría que hacer para materializarlo. Dentro de cada estrategia las actividades son mutuamente excluyentes. · Estrategia A — Medio: corriente líquida con carga orgánica reducida antes de su disposición. Actividad A1: planta de tratamiento aerobio del efluente (lagunas aireadas) con descarga a cuerpo receptor. Actividad A2: laguna anaerobia abierta seguida de facultativa. Se analiza A1 como representante de la estrategia. · Estrategia B — Medio: las tres corrientes se gestionan como un sistema único con balance de masa. Actividad B1: sistema integrado de separación de sólidos, biodigestión anaerobia del purín con captación y uso energético del biogás, compostaje de la fracción sólida y del digestato en la playa existente, y aplicación agronómica reglada del efluente digerido sobre superficie del propio predio. Actividad B2: el mismo esquema pero con tercerización del compostaje fuera del predio; se descarta por no existir operador habilitado ni protocolo provincial. · Estrategia C — Medio: fracción sólida estabilizada. Actividad C1: rehabilitación y operación a plena capacidad de la playa de compostaje con control de temperatura y rotación, únicamente. · Estrategia D — Medio: emisiones gaseosas por debajo del nivel de molestia. Actividad D1: cobertura de fosas y piletas con geomembrana y quema del biogás en antorcha. · Estrategia E — Medio: disposición final asegurada. Actividad E1: contratación de un tercero para retiro y disposición de purines y sólidos fuera del predio. Se descarta por estar fuera del alcance verificable: no hay operador habilitado ni marco provincial que lo respalde, y transfiere el pasivo sin resolverlo. · Actividad seleccionada: B1. Es la única que responde al condicionante central del escenario —las tres corrientes están vinculadas y la solución de una modifica volumen, composición y valor de las otras dos—, usa capacidad instalada ociosa (los 1.080 m² de playa), convierte el metano hoy liberado en el gas que el establecimiento compra, deja el efluente digerido en condiciones de aplicación agronómica dentro de las 120 ha y admite ejecución por etapas con los animales en las naves, sin detener la producción. · Descripción de la actividad seleccionada: separación mecánica de sólidos a la salida de las fosas; biodigestor anaerobio dimensionado sobre el caudal real medido, con captación de biogás y uso térmico en la calefacción de las naves; compostaje de la fracción sólida separada, del digestato, de la mortandad y de las placentas en la playa existente, con control de temperatura y rotación; almacenamiento del efluente digerido y aplicación agronómica según plan de balance de nutrientes y ventanas compatibles con el régimen de lluvias; reparación e impermeabilización de fosas y piletas, incluida la pileta con el talud roto; instrumentación de medición de caudal, biogás y calidad; y procedimientos escritos con responsabilidades asignadas entre las trece personas del establecimiento.", "S": "Estructura Analítica del Proyecto, de abajo hacia arriba. · Actividad (el proyecto de inversión): ejecución del sistema integrado de gestión de las tres corrientes de residuos del establecimiento —medición de línea de base, ingeniería, obra por etapas con producción en marcha, capacitación del personal y puesta en marcha—. · Componente (producto obtenido, no acción): sistema integrado de gestión de las tres corrientes implementado y operando: separación de sólidos, biodigestión con captación y uso del biogás, compostaje a plena capacidad con control de proceso, aplicación agronómica reglada del efluente digerido y fosas y piletas estancas. · Propósito u objetivo central: las tres corrientes de residuos del establecimiento porcino —líquida, sólida y gaseosa— se gestionan de manera integrada y con tratamiento adecuado, preservando el suelo, el agua subterránea y el aire del predio rural de unas 120 ha del Valle de Lerma, en el departamento Rosario de Lerma. · Fin: se reduce la presión de la producción porcina sobre el agua subterránea, el suelo y el aire del entorno del establecimiento y se asegura la continuidad de la operación con el certificado de aptitud ambiental renovado sin observaciones. · Control de redacción: la componente está escrita como estado alcanzado —«sistema implementado y operando»—, no como «implementar el sistema», que es la actividad.", "T": "Matriz de Marco Lógico, en texto. · FIN — Resumen narrativo: se reduce la presión de la producción porcina sobre el agua subterránea, el suelo y el aire del entorno del establecimiento y se asegura la continuidad de la operación. Indicador: al mes 36 de la puesta en marcha, el 100 % de los muestreos trimestrales de los pozos de monitoreo del predio de Rosario de Lerma arroja coliformes dentro de los valores admisibles y se registran cero episodios de pérdida al terreno natural en los últimos doce meses. Medio de verificación: protocolos de laboratorio habilitado y libro de registro ambiental del establecimiento, incorporados al expediente del certificado de aptitud ambiental ante la autoridad ambiental provincial. Supuesto: no se incorporan al área nuevas fuentes de carga fecal —otras explotaciones intensivas o efluentes domiciliarios— que alteren la calidad de la napa somera con independencia del proyecto. · PROPÓSITO — Resumen narrativo: las tres corrientes de residuos del establecimiento se gestionan de manera integrada y con tratamiento adecuado en el predio de unas 120 ha de Rosario de Lerma. Indicador: a los 24 meses de iniciado el proyecto, el 100 % del purín generado ingresa al sistema integrado y la DQO del efluente de salida se reduce al menos un 80 % respecto del valor de línea de base medido en el propio establecimiento, con el 100 % del biogás generado captado y el uso de la playa de compostaje por encima del 80 % de su capacidad de 1.080 m². Medio de verificación: registro mensual de caudal en el ingreso al biodigestor, analíticas trimestrales de DQO, DBO y coliformes por laboratorio habilitado, medidor de caudal de biogás y planillas de carga y temperatura de pilas, todo archivado en el legajo ambiental del establecimiento. Supuesto: la producción se mantiene en el orden de 160 capones semanales; una expansión no acompañada de readecuación del sistema modificaría el balance de masa sobre el que se dimensionó. · COMPONENTE — Resumen narrativo: sistema integrado de gestión de las tres corrientes implementado y operando. Indicador: a los 18 meses de iniciado el proyecto, biodigestor con capacidad para el 100 % del purín diario en operación, separador de sólidos instalado, fosas y piletas reparadas e impermeabilizadas con ensayo de estanqueidad aprobado, playa de compostaje operativa con registro diario de temperatura y rotación, y plan de aplicación agronómica con superficie afectada presentado ante la autoridad. Medio de verificación: acta de recepción de obra firmada por el titular y la dirección técnica, ensayos de estanqueidad, planillas diarias de operación y constancia de presentación del plan agronómico. Supuesto: los proveedores de equipamiento sostienen los plazos de entrega e instalación y no se producen restricciones de acceso a los componentes importados del sistema. · ACTIVIDAD — Resumen narrativo: ejecución del proyecto de inversión, desde la medición de línea de base hasta la puesta en marcha, por etapas y sin detener la producción. Indicador: en 18 meses, el 100 % de las etapas del cronograma ejecutadas dentro del presupuesto aprobado por el titular, con las trece personas del establecimiento capacitadas en los procedimientos de operación de cada corriente. Medio de verificación: certificados de avance de obra, comprobantes de inversión del establecimiento y registros de capacitación firmados por los participantes. Supuesto: el titular sostiene el financiamiento comprometido y las autoridades provincial y municipal otorgan los permisos de obra en plazos que permiten trabajar con los animales en las naves.", "U": "Lógica vertical, de abajo hacia arriba: si el titular ejecuta la inversión por etapas —midiendo primero la carga real de cada corriente, reparando fosas y piletas, instalando el separador y el biodigestor, poniendo la playa de compostaje a trabajar con control de proceso y capacitando a las trece personas—, entonces obtendrá un sistema integrado implementado y operando; si ese sistema opera, las tres corrientes se gestionarán de manera integrada y con tratamiento adecuado; y si eso ocurre, la napa dejará de recibir carga fecal, el olor bajará del nivel de molestia, el metano sustituirá al gas comprado y el expediente de renovación se resolverá sin observaciones, con la continuidad de la operación asegurada. La cadena se sostiene porque cada nivel produce el insumo del siguiente y porque el proyecto no promete resultados fuera del predio. · Lógica horizontal, fila por fila: en el fin, el indicador de coliformes en los pozos propios se calcula íntegramente con protocolos de laboratorio y el libro de registro, que son necesarios y suficientes; la limitación es que la red de pozos debe ampliarse y georreferenciarse en el F02. En el propósito, la reducción de DQO exige dos puntos de muestreo —ingreso y salida— y una línea de base que hoy no existe: sin esa medición previa el indicador no es calculable, por eso la primera etapa de la actividad es medir. En la componente, el ensayo de estanqueidad y las planillas de operación permiten verificar el producto sin ambigüedad. En la actividad, los certificados de avance y los comprobantes de inversión son la fuente natural para un proyecto de titularidad privada. · Lógica zigzag: la actividad más sus supuestos —financiamiento sostenido y permisos de obra compatibles con la producción en marcha— alcanza la componente; la componente más su supuesto —plazos de provisión del equipamiento— alcanza el propósito; el propósito más su supuesto —producción estable en el orden de 160 capones semanales— alcanza el fin. · Supuesto más frágil: el que sostiene el paso del propósito al fin, es decir, que ninguna otra fuente de carga altere la napa somera. Es frágil porque no existe cartografía provincial de acuíferos someros ni registro de pozos en el área: el proyecto puede mejorar su propio efluente y aun así encontrar coliformes en los pozos por causas ajenas, y no tendría cómo demostrarlo. Medida de mitigación dentro del alcance: incorporar al proyecto el estudio hidrogeológico de sitio con censo de pozos del entorno inmediato y un pozo aguas arriba como blanco de referencia, de modo que el indicador del fin sea atribuible. El segundo supuesto más frágil es la estabilidad de la escala productiva: el crecimiento del plantel es una decisión del propio titular, de modo que conviene explicitar en el diseño un margen de capacidad y una cláusula de readecuación, para que el supuesto no termine siendo una tarea disfrazada.", "V": "«Implementación de un sistema integrado de tratamiento y valorización de las corrientes líquida, sólida y gaseosa de residuos del establecimiento porcino de Rosario de Lerma, Valle de Lerma, Salta.» · Qué se hace: implementación de un sistema integrado de tratamiento y valorización. · Sobre qué: las tres corrientes de residuos del establecimiento porcino. · Dónde: predio rural de unas 120 ha en el departamento Rosario de Lerma, Valle de Lerma, provincia de Salta. · El nombre es distinto del nombre de fantasía del equipo (ítem A) y no repite el enunciado del problema: dice qué se va a hacer, sobre qué y en qué lugar, y acompañará al proyecto en los formularios F02, F03 y F04."}, "eap": {"fin": "Se reduce la presión de la producción porcina sobre el agua subterránea, el suelo y el aire del entorno del establecimiento y se asegura la continuidad de la operación con el certificado de aptitud ambiental renovado sin observaciones.", "prop": "Las tres corrientes de residuos del establecimiento porcino —líquida, sólida y gaseosa— se gestionan de manera integrada y con tratamiento adecuado, preservando el suelo, el agua subterránea y el aire del predio rural de unas 120 ha del Valle de Lerma, en el departamento Rosario de Lerma.", "comp": "Sistema integrado de gestión de las tres corrientes implementado y operando: separación de sólidos, biodigestión con captación y uso del biogás, compostaje a plena capacidad con control de proceso, aplicación agronómica reglada del efluente digerido y fosas y piletas estancas.", "act": "Ejecución del proyecto de inversión para el sistema integrado: medición de línea de base de las tres corrientes, ingeniería, obra por etapas con producción en marcha, capacitación del personal y puesta en marcha."}, "mml": {"fin": ["Se reduce la presión de la producción porcina sobre el agua subterránea, el suelo y el aire del entorno del establecimiento y se asegura la continuidad de la operación.", "Al mes 36 de la puesta en marcha, el 100 % de los muestreos trimestrales de los pozos de monitoreo del predio de Rosario de Lerma arroja coliformes dentro de los valores admisibles y se registran cero episodios de pérdida al terreno natural en los últimos doce meses.", "Protocolos de laboratorio habilitado y libro de registro ambiental del establecimiento, incorporados al expediente del certificado de aptitud ambiental ante la autoridad ambiental provincial.", "No se incorporan al área nuevas fuentes de carga fecal —otras explotaciones intensivas o efluentes domiciliarios— que alteren la calidad de la napa somera con independencia del proyecto."], "prop": ["Las tres corrientes de residuos del establecimiento porcino —líquida, sólida y gaseosa— se gestionan de manera integrada y con tratamiento adecuado en el predio de unas 120 ha de Rosario de Lerma.", "A los 24 meses de iniciado el proyecto, el 100 % del purín generado ingresa al sistema integrado y la DQO del efluente de salida se reduce al menos un 80 % respecto del valor de línea de base medido en el propio establecimiento, con el 100 % del biogás generado captado y la playa de compostaje operando por encima del 80 % de sus 1.080 m².", "Registro mensual de caudal en el ingreso al biodigestor, analíticas trimestrales de DQO, DBO y coliformes por laboratorio habilitado, medidor de caudal de biogás y planillas de carga y temperatura de pilas, archivados en el legajo ambiental del establecimiento.", "La producción se mantiene en el orden de 160 capones semanales; una expansión del plantel no acompañada de readecuación modificaría el balance de masa sobre el que se dimensionó el sistema."], "comp": ["Sistema integrado de gestión de las tres corrientes implementado y operando en el establecimiento.", "A los 18 meses de iniciado el proyecto, biodigestor con capacidad para el 100 % del purín diario en operación, separador de sólidos instalado, fosas y piletas reparadas e impermeabilizadas con ensayo de estanqueidad aprobado, playa de compostaje operativa con registro diario de temperatura y rotación, y plan de aplicación agronómica con superficie afectada presentado ante la autoridad.", "Acta de recepción de obra firmada por el titular y la dirección técnica, informes de ensayo de estanqueidad, planillas diarias de operación y constancia de presentación del plan de aplicación agronómica.", "Los proveedores de equipamiento sostienen los plazos de entrega e instalación y no se producen restricciones de acceso a los componentes importados del sistema."], "act": ["Ejecución del proyecto de inversión, desde la medición de línea de base de las tres corrientes hasta la puesta en marcha, por etapas y sin detener la producción.", "En 18 meses, el 100 % de las etapas del cronograma ejecutadas dentro del presupuesto aprobado por el titular, con las trece personas del establecimiento capacitadas en los procedimientos de operación de cada corriente.", "Certificados de avance de obra, comprobantes de inversión del establecimiento y registros de capacitación firmados por los participantes.", "El titular sostiene el financiamiento comprometido y las autoridades provincial y municipal otorgan los permisos de obra en plazos que permiten trabajar con los animales en las naves."]}, "alt": [{"id": "A", "med": "Corriente líquida con carga orgánica reducida antes de su disposición.", "act": "Planta de tratamiento aerobio del efluente porcino (lagunas aireadas) con descarga a cuerpo receptor, sin intervenir la corriente sólida ni la gaseosa.", "ven": "Tecnología conocida y de proyecto sencillo; ataca directamente el parámetro observado por la autoridad (DQO, DBO y coliformes del purín) y admite obra por etapas sin detener la producción.", "des": "Resuelve una sola de las tres corrientes y desplaza el problema: el barro generado engrosa la corriente sólida sobre una playa que ya no se opera bien, la aireación consume energía que el establecimiento hoy compra y el metano se sigue liberando. Alto costo operativo sin ningún ingreso ni ahorro asociado."}, {"id": "B", "med": "Las tres corrientes se gestionan como un sistema único, con balance de masa, y cada una tiene destino y valorización definidos.", "act": "Sistema integrado: separación mecánica de sólidos, biodigestión anaerobia del purín con captación y uso térmico del biogás, compostaje de la fracción sólida, del digestato, de la mortandad y de las placentas en la playa existente, y aplicación agronómica reglada del efluente digerido sobre superficie del propio predio, con reparación e impermeabilización de fosas y piletas.", "ven": "Es la única alternativa que responde al acoplamiento de las tres corrientes; usa los 1.080 m² de playa hoy ociosos; sustituye el gas que el establecimiento compra para calefacción; reduce simultáneamente carga orgánica, olor y metano; deja el efluente en condiciones de aplicación agronómica dentro de las 120 ha; y admite ejecución por etapas con los animales en las naves.", "des": "Es la de mayor inversión inicial y la que más exige en operación: requiere medición previa de caudal y composición, personal capacitado, superficie afectada con balance de nutrientes y ventanas de aplicación compatibles con el régimen de lluvias. Si el balance de masa está mal hecho, el sistema queda subdimensionado."}, {"id": "C", "med": "Fracción sólida estabilizada.", "act": "Rehabilitación y operación a plena capacidad de la playa de compostaje de 1.080 m², con control de temperatura y rotación de pilas, únicamente.", "ven": "Inversión baja sobre capacidad instalada existente, ejecución rápida y mejora verificable en el manejo de mortandad y placentas.", "des": "Deja intactas las corrientes líquida y gaseosa, que son las que hoy contaminan la napa y generan el olor observado. Al aumentar la producción de compost crece la demanda de material estructurante y de mano de obra, sin resolver el purín ni el metano: es una mejora parcial que no cierra el expediente de renovación."}, {"id": "D", "med": "Emisiones gaseosas por debajo del nivel de molestia en el entorno inmediato.", "act": "Cobertura de fosas y piletas con geomembrana y quema del biogás captado en antorcha.", "ven": "Corta rápidamente el olor y la emisión de metano con inversión moderada; es la respuesta más veloz al conflicto vecinal latente y a la observación por emisiones.", "des": "Quema un recurso energético que el establecimiento está comprando en otra forma, de modo que suma costo sin ahorro. No reduce la carga orgánica del líquido acumulado bajo la cobertura ni resuelve la fracción sólida, y las pérdidas al terreno natural por el talud roto continúan."}, {"id": "E", "med": "Disposición final de las corrientes asegurada fuera del predio.", "act": "Contratación de un tercero para el retiro y la disposición de purines y de la fracción sólida fuera del establecimiento.", "ven": "No exige inversión de capital ni capacidad operativa propia y libera al titular de la gestión diaria.", "des": "Costo recurrente elevado y creciente con la escala; no existe operador habilitado ni protocolo provincial de uso agronómico de purines que respalde el destino, de modo que transfiere el pasivo sin resolverlo y mantiene la responsabilidad del generador. Pierde todo el valor recuperable —energía, enmienda y nutrientes— y no elimina el olor en fosas y piletas."}], "altSel": "B", "altJus": "Se comparan las cinco alternativas con cinco criterios, definidos desde la perspectiva del titular privado: (1) cobertura de las tres corrientes acopladas, (2) uso de la capacidad instalada existente, (3) efecto sobre el resultado económico del establecimiento, (4) capacidad de cerrar las observaciones del expediente de renovación, y (5) ejecutabilidad sin detener la producción. · La alternativa A cubre una sola corriente y desplaza carga hacia la sólida; C cubre sólo la sólida; D cubre sólo la gaseosa y destruye el valor energético al quemarlo en antorcha; E no cubre ninguna en sentido estricto, porque traslada el residuo sin tratamiento y sin marco que lo respalde. Sólo B satisface el primer criterio, que es el que define el escenario: las tres corrientes están vinculadas y la solución que se adopte para una modifica el volumen, la composición y el valor de las otras dos. · En el segundo criterio, B es la única que pone a trabajar los 1.080 m² de playa que hoy operan al 30 %. En el tercero, B convierte dos costos en ahorro —el gas comprado para calefacción y la compra de fertilizante o enmienda— mientras que A y D sólo agregan costo operativo y E lo agrega de manera recurrente; ésa es la respuesta concreta a la pregunta del escenario sobre si operar sin invertir tuvo costo. En el cuarto, B es la única que responde de manera simultánea a las tres materias observadas (efluente, residuos sólidos y emisiones). En el quinto, las cuatro alternativas son ejecutables por etapas, pero B lo es con la condición de empezar por la medición y la reparación de fosas y piletas, lo que además ordena el resto de la obra. · Se elige B. Su desventaja principal —mayor inversión inicial y exigencia operativa— se atiende con un cronograma por etapas donde las primeras (medición, reparación del talud roto e impermeabilización, puesta en régimen de la playa) tienen costo bajo y resultado inmediato en el expediente, y las de mayor inversión (separador y biodigestor) se ejecutan una vez conocido el caudal real. Las alternativas descartadas no se pierden: A, C y D quedan documentadas como componentes parciales que B incorpora reordenados dentro de un mismo balance de masa.", "corr": ["Problema central enunciado como carencia o como solución: «falta de una planta de tratamiento de efluentes», «no hay biodigestor», «escasez de infraestructura de saneamiento». Si el enunciado ya nombra la tecnología, el análisis de alternativas del ítem R está condicionado de antemano y hay que devolver el trabajo al ítem D.", "Árbol que trata una sola corriente, casi siempre la líquida, o que trata las tres pero sin ningún vínculo entre ellas. Señal concreta: no aparece en ninguna parte la idea de balance de masa ni la observación de que lo que se retira de una corriente reaparece en otra. Es la trampa central del escenario.", "El olor vecinal colocado como problema central en lugar de efecto. Es el síntoma más visible y por eso se cuela; si está en el tronco, faltan en las ramas la napa, el metano y el expediente de renovación.", "Perspectiva institucional equivocada: el proyecto redactado como programa público municipal o provincial, con el municipio como titular, cuando el escenario plantea la mirada del titular privado. Señales: el titular no figura entre los involucrados o figura como actor secundario, el financiamiento se supone estatal, y no aparece ningún criterio económico propio del establecimiento (costo evitado, ahorro de gas, valor de la enmienda).", "Datos inventados con apariencia de fuente oficial, en dos variantes. Cifras: cantidad de vecinos, caudal diario de efluente, población de Rosario de Lerma, superficie necesaria para aplicación agronómica o rendimiento de biogás; el escenario sólo aporta 160 capones semanales, 13 personas, 18 litros por animal y por día, 1.080 m² al 30 %, DQO y DBO de treinta a cuarenta veces el umbral, coliformes tres órdenes de magnitud sobre el límite y 109.548 t CO₂e/año del sector, y todo lo demás debe declararse como supuesto a verificar en el F02. Normas: números de ley o de decreto provinciales atribuidos a la regulación de la actividad pecuaria intensiva o al uso agronómico de purines, cuando el escenario dice expresamente que esa norma no existe; citarla es un error de hecho y además borra una de las causas raíz del árbol.", "Supuestos de la MML que en realidad son tareas del proyecto: «se capacita al personal», «se repara la pileta», «se mide el caudal». Todo eso está bajo control del titular y pertenece a la columna de actividades; el supuesto tiene que ser externo (fuentes de carga ajenas sobre la napa, plazos de provisión, permisos, estabilidad de la escala productiva)."]}};     /* solucionario docente por escenario */
var F01  = [{"L": "A", "s": 1, "t": "Nombre de fantasía del equipo de trabajo", "cap": "Capítulo 1 · Presentación del equipo y el problema", "pide": "Un nombre que represente las motivaciones del equipo, aporte identidad y permita identificarlo durante toda la cursada.", "como": ["Corto: una sigla, o dos o tres palabras como máximo.", "Preferentemente vinculado a la futura actividad profesional o al ámbito de actuación del proyecto.", "Se elige como si se estuviera iniciando una actividad económica real: el nombre de una empresa es parte de su capital y puede valorarse económicamente.", "Por ahora no hace falta definir el tipo societario: se asume una sociedad de hecho (S.H.)."], "error": "Confundir el nombre del equipo con el nombre del proyecto de inversión. Son dos cosas distintas y el segundo se define recién en el ítem V.", "ej": "La Guía cita consultoras del registro de la Secretaría de Ambiente de Salta como referencia de estilo: Knight Piésold Argentina, PACHA Consultora, EC y asociados, DYNAMIK S.A.S., Ambiental Argentina, URBIS, GT, AUSENCO VECTOR.", "guia": "Guía 01 · «Nombre de fantasía del equipo de trabajo»"}, {"L": "B", "s": 1, "t": "Integrantes del equipo y dedicación al entregable", "cap": "Capítulo 1 · Presentación del equipo y el problema", "pide": "Tabla con apellido y nombre, función en el equipo, perfil y dedicación en horas de cada integrante que trabajó en esta entrega.", "como": ["Identificar el coordinador general; la coordinación puede ser rotativa y removible por mayoría, informando a la cátedra por correo.", "Definir la función o rol de cada integrante: buscar información, procesar datos, redactar informes, completar formularios, consultar expertos.", "Acordar metodología de trabajo (día, frecuencia, dedicación individual, presencial o virtual) y medios de comunicación.", "Declarar sólo horas realmente trabajadas, sin tiempos muertos."], "error": "Incluir a integrantes que no aportaron a la entrega. La Guía es explícita: reconocer a quien no trabajó desincentiva a los que sí lo hicieron.", "ej": "Coordinación general · Búsqueda y sistematización de información secundaria · Redacción y edición del informe · Cartografía y paratextos · Enlace institucional y consultas a expertos.", "guia": "Guía 01 · ítem A · «Integrantes del equipo de trabajo y dedicación al entregable»"}, {"L": "C", "s": 1, "t": "Ámbito de actuación", "cap": "Capítulo 1 · Presentación del equipo y el problema", "pide": "El eje temático en el que se inscribe la situación problemática asignada al equipo.", "como": ["Elegir entre los ámbitos que propone la Guía: saneamiento ambiental, producción de recursos naturales renovables, gestión de residuos, gestión de espacios recreativos, restauración ecológica, producción de servicios ecosistémicos, conservación de ecosistemas o especies, restauración urbana, economía circular, gestión ambiental de proyectos de inversión, ecoeficiencia.", "Las categorías no son mutuamente excluyentes: un proyecto puede quedar representado en más de una.", "Justificar brevemente por qué el escenario cae en ese ámbito."], "error": "Elegir el ámbito antes de tener claro el problema. Conviene volver sobre este ítem después de escribir el D.", "ej": "Escenario 4 (residuos de poda urbana) puede inscribirse simultáneamente en <strong>gestión de residuos</strong> y en <strong>economía circular</strong>; declarar ambos y explicar el énfasis elegido es una respuesta correcta.", "guia": "Guía 01 · ítem B · «Ámbito de actuación»"}, {"L": "D", "s": 1, "t": "El problema identificado", "cap": "Capítulo 1 · Presentación del equipo y el problema", "pide": "La descripción de la situación conflictiva que constituye el tema central de la intervención, usando como mínimo los cinco criterios.", "como": ["Enunciarlo como una <strong>situación negativa que debe ser revertida</strong>, en una sola oración.", "Describirlo respondiendo identidad, ubicación, tiempo, mensurabilidad y magnitud.", "Darle dimensión espacial y revisar información secundaria sobre el problema asignado.", "Controlar que no se haya confundido una causa o un efecto con el problema central."], "error": "Enunciar el problema como «falta de…». Si la solución se deduce del enunciado, el análisis de alternativas ya está condicionado.", "ej": "Caso guía. Incorrecto: «Falta de riego en las forestaciones del municipio». Correcto: <strong>«Alta mortandad de los plantines nativos plantados en los espacios públicos del municipio»</strong>. · Otro ejemplo de la Guía: incorrecto «Falta de un puente sobre el río Arenales»; correcto «Dificultades de conectividad norte–sur del municipio Capital».", "guia": "Guía 01 · ítem C · «El problema identificado»"}, {"L": "E", "s": 1, "t": "Medición del problema", "cap": "Capítulo 1 · Presentación del equipo y el problema", "pide": "Cómo se mide el problema y el valor estimado del indicador en la situación <strong>sin proyecto</strong>.", "como": ["Construir el indicador respetando el esquema: cantidad o porcentaje + variable + lugar + plazo + medio de verificación.", "Puede ser cuantitativo o cualitativo, y se pueden usar varios indicadores o construir un índice.", "Verificar los criterios SMART: específico, mensurable, alcanzable, relevante y temporal.", "Completar el cuadro «valor del indicador en situación sin proyecto», aunque sea una primera aproximación."], "error": "Dejar el valor de línea de base en blanco o escribir «no se dispone de datos» sin adoptar un supuesto. Si el dato no existe, se asume uno, se numera y se declara la fuente del criterio.", "ej": "Caso guía: «Supervivencia del <strong>38 %</strong> de los plantines nativos <strong>a los 12 meses</strong> de plantados, en los <strong>espacios públicos del municipio</strong>, según el <strong>censo de arbolado 2025</strong>.» El 38 % es el valor sin proyecto.", "guia": "Guía 01 · ítem D · «Medición del problema»"}, {"L": "F", "s": 1, "t": "Contexto de intervención — línea de base", "cap": "Capítulo 1 · Presentación del equipo y el problema", "pide": "La descripción del contexto geográfico, social, económico y ambiental donde el proyecto desarrollará su acción.", "como": ["Recurrir a toda la información secundaria disponible: censos, informes sectoriales, estudios previos, cartografía.", "Responder la pregunta que ordena la sección: ¿qué características del contexto potencian el problema o contribuyen a su solución?", "Se admiten paratextos iconográficos: mapas, imágenes satelitales, fotografías, esquemas.", "Declarar la fuente y el año de cada dato."], "error": "Convertir la línea de base en una monografía geográfica del departamento. Se describe lo que tiene relación con el problema, no todo lo que existe.", "ej": "Escenario 11 (postura de huevos, Cerrillos): entorno rural de transición con la mayor tasa provincial de transformación de suelo rural a urbano, parcelas de tabaco y hortalizas, viviendas abastecidas por perforación y otras granjas en un radio de pocos kilómetros generando las mismas corrientes.", "guia": "Guía 01 · ítem E · «Contexto de intervención del proyecto – línea de base»"}, {"L": "G", "s": 1, "t": "Población destinataria de los resultados", "cap": "Capítulo 1 · Presentación del equipo y el problema", "pide": "Definir y cuantificar la población que recibirá en forma directa los beneficios del proyecto.", "como": ["Distinguir <strong>población potencial</strong> (la afectada por el problema) de <strong>población objetivo</strong> (los beneficiarios directos que el proyecto puede atender realmente).", "Responder: ¿quiénes internalizan el problema? ¿Quiénes son los destinatarios de los bienes y servicios que ofrecerá el proyecto?", "Cuantificar: personas, familias, productores, empresas o instituciones, con fuente.", "Si ambas poblaciones coinciden, decirlo y justificar por qué el proyecto alcanza al 100 % de la potencial."], "error": "Declarar como población objetivo a «toda la comunidad». Si el proyecto no puede atender al 100 % de la población potencial, la objetivo es una fracción y hay que decir cuál.", "ej": "Escenario 9: población potencial, los habitantes del borde este; población objetivo, los aproximadamente 4.000 habitantes de los barrios del extremo oeste con NBI de entre 40 % y 78 %.", "guia": "Guía 01 · ítem F · «Población destinataria» (Aldunate &amp; Córdoba, CEPAL, 2011)"}, {"L": "H", "s": 1, "t": "Análisis de los involucrados", "cap": "Capítulo 1 · Presentación del equipo y el problema", "pide": "Todos los actores vinculados al problema que pueden contribuir a su solución o poner palos en la rueda. Una fila por actor.", "como": ["Completar las cinco columnas: actor, grupo, posición, fuerza e importancia.", "Grupo: pública, privada, sociedad civil, ONG ambiental u otra institución.", "Posición: si influye de manera positiva o negativa sobre el problema y su solución.", "Fuerza e importancia: escala cualitativa (alta–media–baja) o numérica (0 a 1), <strong>la misma para ambas</strong>."], "error": "Listar sólo a los aliados. El análisis sirve precisamente para anticipar a quienes pueden bloquear el proyecto y diseñar estrategias hacia ellos.", "ej": "Comunidad aborigen · Agrupación social · Influye de manera positiva · Fuerza 0,9: el proyecto se desarrolla en propiedad de la comunidad y puede resolver no apoyarlo · Importancia 1: son los principales beneficiarios.", "guia": "Guía 01 · ítem G · «Análisis de los involucrados»"}, {"L": "I", "s": 1, "t": "Dependencia institucional del proyecto", "cap": "Capítulo 1 · Presentación del equipo y el problema", "pide": "La organización u organizaciones de las cuales depende directamente la realización del proyecto.", "como": ["Pensar en habilitaciones, permisos y vinculaciones necesarias para que el proyecto exista.", "Puede tratarse de gobierno municipal, provincial, nacional, organismos internacionales, empresas de bienes o servicios, ONG u organismos financistas.", "Estos actores también deben aparecer en el análisis de involucrados (ítem H): controlá la coherencia entre ambos ítems.", "En esta instancia sólo se identifican; los acuerdos, comodatos y autorizaciones llegan al pasar de perfil a prefactibilidad."], "error": "Anticipar gestiones. Todavía no hay que tramitar nada: hay que saber ante quién habría que tramitarlo.", "ej": "Un proyecto sobre residuos sólidos urbanos en la ciudad de Salta depende de la Municipalidad y de la empresa prestadora del servicio; uno de energía solar involucra a la Secretaría de Minería provincial; uno de restauración urbana en Vaqueros requiere autorización municipal.", "guia": "Guía 01 · ítem H · «Dependencia institucional del proyecto»"}, {"L": "J", "s": 1, "t": "Marco normativo de referencia", "cap": "Capítulo 1 · Presentación del equipo y el problema", "pide": "El relevamiento de las leyes y normativas que dan marco legal a la idea proyectual.", "como": ["Construir la <strong>matriz de cumplimiento legal</strong>: toda la normativa que el proyecto debe cumplir durante todas sus etapas.", "Seleccionar las que el equipo considere más importantes para ejecutar el proyecto, no un listado exhaustivo del derecho ambiental.", "Incluir convenios marco, leyes nacionales y provinciales, decretos, resoluciones y ordenanzas municipales.", "Verificar vigencia y texto ordenado de cada norma citada."], "error": "Copiar la normativa del escenario sin verificar. Varios escenarios advierten que el marco citado es anterior a modificaciones recientes.", "ej": "Escenario 9: el ordenamiento territorial de bosques nativos fue actualizado recientemente y el código de planeamiento urbano ambiental convive con normativas municipales dispares dentro del área metropolitana.", "guia": "Guía 01 · ítem I · «Marco normativo de referencia»"}, {"L": "K", "s": 2, "t": "Causas — raíces del árbol", "cap": "Capítulo 2 · El árbol de problemas", "pide": "Identificar y describir brevemente las causas primarias, secundarias y sucesivas que determinan el problema central.", "como": ["Preguntarse: ¿qué es lo que origina el problema identificado?", "Aplicar la técnica «¿pero por qué?» hasta llegar a causas primarias e independientes entre sí.", "Ordenarlas jerárquicamente en la tabla: causa 1 → causa 1.1 → causa 1.1.A → causa 1.1.A.1.", "Verificar la coherencia leyendo de derecha a izquierda: ¿la causa 1.1.A genera la 1.1? ¿La 1.1 produce la causa 1? ¿La causa 1 produce el problema?"], "error": "Quedarse en el primer nivel. Cuantas más raíces se detecten, más cerca se está de las soluciones posibles; con causas superficiales sólo salen alternativas superficiales.", "ej": "Caso guía: alta mortandad de plantines → el plantín no recibe cuidados después de plantado → nadie tiene asignada la tarea de riego → la campaña termina el día de la plantación → el programa municipal no prevé etapa de mantenimiento.", "guia": "Guía 01 · ítem J · «Causas (raíces del árbol)»"}, {"L": "L", "s": 2, "t": "Efectos — ramas del árbol", "cap": "Capítulo 2 · El árbol de problemas", "pide": "Identificar y describir los efectos que derivan del problema central, de manera ordenada, interrelacionada y jerárquica.", "como": ["Preguntarse: ¿qué cosas negativas se asocian al problema y persistirán mientras no se lo resuelva?", "Ordenarlos de izquierda a derecha: efecto 1 → efecto 1.1 → efecto 1.1.A.", "Puede haber más de un efecto secundario vinculado a un efecto primario.", "Verificar la coherencia leyendo de izquierda a derecha: ¿el efecto 1 produce el efecto 1.1?"], "error": "Confundir efectos con causas por escribirlos en la columna equivocada. El sentido de lectura del árbol es lo que distingue una tabla de la otra.", "ej": "Caso guía: alta mortandad de plantines → menor cobertura arbórea lograda por campaña → más calor y menos sombra en veredas y plazas → menor uso de los espacios públicos en verano. En paralelo: pérdida de la inversión municipal → reducción del presupuesto de las campañas siguientes.", "guia": "Guía 01 · ítem K · «Efectos (ramas del árbol)»"}, {"L": "M", "s": 2, "t": "Construyendo el árbol de problemas", "cap": "C
