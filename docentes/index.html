na de la demanda. Medidas de mitigación previstas dentro del diseño, que no eliminan el riesgo pero lo acotan: escalonar el volumen contratado por temporada en lugar de comprometerlo de una vez; sostener demandas alternativas —campañas urbanas, obras viales, planes de manejo, compensaciones— que puedan absorber material si la restauración se demora; y elegir una alternativa con baja inversión hundida, que es una de las razones de descartar el vivero propio de gran escala.\nSe verifica también que ningún supuesto sea una tarea del proyecto: firmar los contratos, elaborar los protocolos y montar el circuito de semilla son actividades y figuran como tales; lo que quedó en la columna de supuestos son decisiones de terceros —aprobación del programa, aceptación de los viveros, régimen presupuestario, ejecución de la plantación—.", "V": "Nombre del proyecto: «Sistema de abastecimiento programado de plantines de especies nativas de procedencia local para la restauración del predio fiscal del borde este y las campañas de forestación urbana del área metropolitana de Salta».\nSe construye con las tres piezas que pide la Guía: qué se hace —abastecimiento programado de plantines nativos de procedencia local—, para qué —para que la restauración proyectada y las campañas urbanas puedan ejecutar sus plantaciones— y dónde —predio fiscal del borde este y área metropolitana de Salta—. Es representativo de la alternativa seleccionada, porque nombra el sistema de abastecimiento y no un vivero, que es sólo una de las piezas posibles de ese sistema.\nEste nombre no es el del equipo, que es «Semilla Norte S.H.» (ítem A), ni el enunciado del problema, y acompañará al equipo en los formularios F02, F03 y F04. Una versión abreviada admisible para uso corriente es «Abastecimiento programado de nativas — borde este de Salta»."}, "eap": {"fin": "Las superficies plantadas con especies nativas en el predio fiscal del borde este y en los espacios públicos de la ciudad de Salta alcanzan cobertura establecida, la inversión de cada campaña se aprovecha, las pendientes superiores al 30 % de la mitad alta del predio reducen su exposición a la erosión y las especies leñosas en categoría de conservación desfavorable se incorporan a las plantaciones.", "prop": "La restauración proyectada sobre el predio fiscal de unas 800 hectáreas del borde este de la ciudad de Salta y las campañas de forestación urbana del área metropolitana se abastecen de plantines de especies nativas de procedencia local en las especies, las cantidades, la calidad y las fechas que sus plantaciones requieren.", "comp": "Sistema de abastecimiento programado de plantines nativos de procedencia local en funcionamiento: demanda dimensionada por especie y por año, contratos plurianuales de provisión vigentes con viveros comerciales reconvertidos y convenios con viveros comunitarios, escolares e institucionales, unidad de semilla y protocolos de producción y de recepción aplicados, y calendario de entregas ajustado a la ventana de plantación.", "act": "Proyecto de inversión para la puesta en marcha del sistema de abastecimiento: estudio de demanda por especie y por año, relevamiento de capacidad instalada de vivero y de su fracción reconvertible, identificación de rodales semilleros y montaje del circuito de colecta y trazabilidad, elaboración y adopción de los protocolos de producción por especie y del acta de recepción, licitación y firma de los contratos plurianuales de provisión, convenios y formación con viveros comunitarios, escolares e institucionales, y organización de la logística de entrega y del acopio intermedio."}, "mml": {"fin": ["Contribuir a que la restauración del predio fiscal del borde este y la forestación urbana del área metropolitana de Salta alcancen cobertura nativa establecida, con menor exposición a la erosión en las laderas de la mitad alta del predio y aprovechamiento de la inversión comprometida en cada campaña.", "80 % de los plantines nativos entregados por el sistema y plantados en el predio fiscal del borde este y en los espacios públicos de la ciudad de Salta sobreviven a los doce meses de plantados, medido al cabo de la tercera temporada de operación (valor a verificar en el F02).", "Relevamiento anual de supervivencia con parcelas fijas de control en los sectores plantados, a cargo del programa de restauración y de las áreas municipales de espacios verdes, con informe público y serie comparable entre temporadas.", "El programa de restauración y los municipios ejecutan la plantación dentro de la ventana de lluvias y sostienen el riego y el mantenimiento posterior, tareas que están fuera del alcance de este proyecto."], "prop": ["La restauración proyectada sobre el predio fiscal de unas 800 hectáreas del borde este de la ciudad de Salta y las campañas de forestación urbana del área metropolitana se abastecen de plantines de especies nativas de procedencia local en las especies, las cantidades, la calidad y las fechas que sus plantaciones requieren.", "90 % de los plantines requeridos por el plan anual de plantación se entregan conformes —especie prevista para el sector, procedencia local acreditada, tamaño y grado de rustificación pactados y entrega dentro de la ventana de plantación— en el predio fiscal del borde este y en las campañas urbanas adheridas, durante la tercera temporada de operación (línea de base asumida: 0 % de entrega programada conforme, porque hoy no existe plan anual ni pedido por especie; ambos valores a verificar en el F02).", "Registro de entregas de la unidad técnica del proyecto, integrado por las actas de recepción por lote firmadas en el sitio de entrega por el receptor y el proveedor, consolidado por temporada y publicado en el informe anual de la unidad ejecutora.", "El programa de restauración del predio fiscal del borde este se aprueba y se ejecuta en los plazos previstos y mantiene vigente su plan anual de plantación; los municipios sostienen sus campañas de forestación urbana."], "comp": ["Sistema de abastecimiento programado de plantines nativos de procedencia local en funcionamiento, con demanda dimensionada, provisión contratada, semilla trazable y protocolos aplicados.", "Contratos plurianuales y convenios de provisión vigentes que cubren el 100 % de las especies y al menos el 80 % del volumen del plan anual de plantación, firmados al menos dieciocho meses antes de la temporada a la que abastecen, para el predio fiscal del borde este y las campañas urbanas adheridas.", "Expediente de contratación y registro de convenios de la unidad ejecutora, con el calendario de entregas por especie y por temporada anexado, y verificación cruzada con el registro de rodales semilleros y de lotes trazados.", "Los viveros de la región cuentan con capacidad reconvertible y aceptan las condiciones técnicas y de plazo del contrato; el régimen provincial de contrataciones y de administración financiera admite compromisos que exceden el ejercicio anual."], "act": ["Puesta en marcha del sistema: estudio de demanda por especie y por año, relevamiento de capacidad instalada de vivero, circuito de semilla de procedencia local, protocolos de producción y recepción, contratación plurianual, convenios comunitarios y logística de entrega.", "Estudio de demanda por especie y por año y relevamiento de capacidad instalada de vivero concluidos, validados por el programa de restauración y por los municipios adheridos y publicados dentro de los primeros nueve meses de ejecución, con el 100 % del presupuesto de esa etapa ejecutado.", "Informes técnicos aprobados por acto administrativo de la unidad ejecutora, disponibles en el sitio oficial del organismo, y estado de ejecución presupuestaria del período emitido por el área de administración.", "Las reparticiones provinciales y municipales y los viveros de la región aportan la información requerida en tiempo y forma, y se mantiene la asignación presupuestaria de la etapa de formulación."]}, "alt": [{"id": "A", "med": "Medios 1, 1.1, 1.1.B y 1.1.C — Producción de nativas programada en los viveros de la región, sostenida por un compromiso de compra anterior a la siembra.", "act": "Reconversión de capacidad ociosa de los viveros existentes mediante contrato plurianual de provisión, con especificaciones técnicas por especie, anticipo, precio de referencia y penalidades por incumplimiento de fecha.", "ven": "No requiere inversión en infraestructura nueva y usa capacidad que ya existe; ataca de manera directa la raíz del compromiso de compra; es la de menor inversión hundida si el programa de restauración se demora, porque el riesgo se distribuye entre proveedores privados y se escalona por temporada; puede estar operativa en un solo ciclo administrativo.", "des": "Su viabilidad depende de un dato que hoy nadie tiene —cuánta capacidad instalada existe y qué fracción es reconvertible— y de que el régimen de contrataciones admita el compromiso plurianual; deja sin resolver la procedencia local de la semilla y las especies de multiplicación exigente, que ningún vivero comercial va a producir por su cuenta; concentra la provisión en pocos actores privados."}, {"id": "B", "med": "Medios 1, 2 y 3 — Producción programada, decisión anticipada de producción y protocolos por especie bajo control directo del titular.", "act": "Vivero propio del programa de restauración, dimensionado para el volumen de las 800 hectáreas, con producción, semilla y protocolos bajo administración pública.", "ven": "Control total sobre especie, procedencia, calidad y fecha, incluidas las especies de multiplicación exigente y las dos en categoría de conservación desfavorable; permite decidir la producción con la anticipación que exige el ciclo de vivero sin depender de la voluntad de terceros; deja capacidad instalada permanente en el sector público.", "des": "Es la alternativa de mayor inversión y la que más riesgo asume si el programa de restauración no se aprueba: queda una instalación construida, un plantel contratado y un stock sin destino; exige personal técnico estable, agua de riego —de disponibilidad variable en el sector— y un costo operativo anual que compite con el propio presupuesto de restauración; ignora la capacidad instalada que quizás exista y esté ociosa; el tiempo hasta la primera entrega es el más largo, porque hay que construir antes de sembrar."}, {"id": "C", "med": "Medios 1.2, 3 y 4 — Capacidades de producción difundidas, protocolos aplicados y circuito de semilla de procedencia local.", "act": "Red de viveros comunitarios, escolares e institucionales con los barrios linderos al predio, con formación, provisión de semilla acreditada, protocolo común y compra asegurada por convenio.", "ven": "Vincula a la población del borde este con la restauración de su propio entorno y crea capacidades y trabajo donde hoy no los hay; acorta la distancia entre producción y sitio de plantación, lo que resuelve la causa territorial; inversión baja y distribuida; sostiene el cuidado posterior por proximidad y pertenencia.", "des": "No alcanza la escala de decenas de miles de ejemplares en las primeras temporadas ni garantiza homogeneidad de calidad sin acompañamiento técnico intensivo; su continuidad depende de la permanencia de personas y de ciclos escolares; el tiempo de maduración de la red excede la primera temporada de plantación de la restauración."}, {"id": "D", "med": "Medios 1, 1.1, 1.1.A, 1.1.B, 1.1.C, 1.2, 2, 3, 4 y 5 — Cobertura simultánea de la rama económico-institucional y de la rama técnica y social del árbol de objetivos.", "act": "Esquema mixto segmentado por especie: contrato plurianual de provisión con viveros comerciales reconvertidos para el grueso del volumen y las especies de producción sencilla; convenio con la red de viveros comunitarios, escolares e institucionales de los barrios linderos para especies de multiplicación sencilla y volúmenes menores; y una unidad pública de semilla, protocolos y recepción —rodales semilleros identificados, colecta trazable, protocolo por especie, acta de recepción— que abastece y controla a ambos y produce por sí misma las especies exigentes y las dos en categoría de conservación desfavorable.", "ven": "Es la única que cubre las tres raíces del árbol a la vez: dimensiona la demanda, la convierte en compromiso de compra y resuelve el desfase temporal con una decisión anticipada escalonada; segmenta el riesgo, porque el volumen grande se contrata sin inversión hundida y sólo la producción de especies críticas queda a cargo del sector público, en escala pequeña; el activo que crea el proyecto —la unidad de semilla y los protocolos— es un bien público que sirve a cualquier proveedor futuro y no se pierde si un vivero se retira; incorpora a los barrios linderos sin depender de ellos para la escala.", "des": "Exige coordinar tres tipos de proveedor con reglas distintas y una capacidad de gestión que la unidad ejecutora todavía no tiene; su costo de administración es mayor que el de una única modalidad; requiere que la unidad de semilla esté operativa antes que los contratos, lo que agrega un paso previo al calendario."}, {"id": "E", "med": "Medio 1 en su versión mínima — Disponibilidad de plantines en la fecha requerida, sin condición de origen.", "act": "Compra de plantines nativos a viveros de fuera de la región, con entrega puesta en el sitio de plantación.", "ven": "Resuelve cantidad y fecha en el plazo más corto y con la menor complejidad institucional; no requiere inversión ni desarrollo de capacidades locales; sirve como alternativa de contraste, porque muestra que el problema no es la disponibilidad física de plantines sino la disponibilidad de plantines adecuados.", "des": "Rompe la exigencia de procedencia local y de trazabilidad de la semilla que la restauración impone, con riesgo de baja adaptación al sitio, de contaminación genética del remanente nativo y de introducción de patógenos; no deja capacidad instalada ni empleo en la región; el costo de flete y el estrés de traslado castigan la calidad de entrega; convierte una demanda sostenida en renta para otra región y deja el problema intacto para la temporada siguiente."}], "altSel": "D", "altJus": "Los criterios de comparación se fijaron antes de comparar, derivados del propio árbol: (1) cuántas de las tres raíces ataca la alternativa —desfase temporal, compromiso de compra y demanda no dimensionada—; (2) cumplimiento de la exigencia de procedencia local y de las especies que el sitio requiere, incluidas las dos en categoría de conservación desfavorable; (3) tiempo hasta la primera entrega conforme, medido contra el ciclo de uno a dos años de vivero y la ventana de lluvias; (4) inversión hundida y reversibilidad si el programa de restauración no se aprueba, que es el riesgo externo central; (5) capacidad instalada y capacidades sociales que quedan en la región; (6) exigencia de gestión sobre la unidad ejecutora.\nContra esos criterios: la alternativa E queda descartada en el criterio 2, que es una condición técnica de la restauración y no una preferencia —un plantín nativo de otra procedencia no es sustituto del que el sitio requiere—, y además no modifica ninguna raíz. La alternativa B es la más fuerte en el criterio 2 pero la peor en los criterios 3 y 4: construir antes de sembrar alarga el plazo justamente en el escenario donde el plazo es el problema, y deja al sector público con toda la inversión hundida si el programa se demora. La alternativa C es la mejor en el criterio 5 y buena en la causa territorial, pero no alcanza la escala de decenas de miles de ejemplares en las primeras temporadas, que es lo que la restauración necesita. La alternativa A es sólida en los criterios 1, 3 y 4, pero deja sin resolver la procedencia de la semilla y las especies exigentes, y descansa por completo en un supuesto todavía no verificado sobre la capacidad instalada.\nSe selecciona la alternativa D porque es la única que cubre las tres raíces simultáneamente y porque su arquitectura reparte el riesgo del modo que este escenario exige: el volumen grande se compromete por contrato, sin inversión hundida, y lo único que el sector público produce por sí mismo es la fracción pequeña y crítica que ningún privado va a producir. El activo que el proyecto crea —los rodales semilleros identificados, la colecta trazable, los protocolos por especie y el acta de recepción— es un bien público que conserva su valor aunque cambien los proveedores e incluso aunque la restauración se demore, lo que la vuelve la alternativa más robusta frente al supuesto más frágil de la MML. Se asume, y se declara como supuesto a verificar en el F02, que existe capacidad de vivero reconvertible en la región y que el régimen de contrataciones admite el compromiso plurianual: si el relevamiento de la primera etapa desmintiera lo primero, la decisión debería revisarse desplazando volumen hacia las alternativas B y C, y ese punto de revisión queda explícitamente previsto en el diseño.", "corr": ["Problema central escrito como carencia de la solución: «falta un vivero de especies nativas», «no existe un vivero de nativas en Salta», «escasez de infraestructura de producción». Es la trampa principal de este escenario: elige la alternativa antes de analizar y clausura el ítem R. El árbol tiene que arrancar desde la demanda que no se abastece, no desde el vivero que no existe. Señal complementaria: si el problema central menciona un vivero, revisar también el ítem R, donde seguramente aparece una sola alternativa.", "Problema central que culpa a un actor: «los viveros no quieren producir nativas», «los viveros sólo piensan en la ganancia». Confunde una respuesta económica racional —producir sin comprador es asumir dos años de riesgo— con mala voluntad, y borra del árbol la causa que realmente explica la conducta: la ausencia de compromiso de compra anterior a la siembra.", "«Alta mortandad de plantines» colocada como problema central. Va en la dirección correcta pero es un efecto, y sin lugar ni plazo no se puede medir. La versión correcta, y su lugar en el árbol, es «baja supervivencia de los plantines nativos plantados en el sector, medida a los doce meses de la plantación», como efecto de segundo nivel.", "Producir plantines presentado como fin del proyecto y no como medio. Si el objetivo central del árbol de objetivos es «producir plantines nativos» en lugar de «la demanda de restauración queda abastecida», el equipo invirtió la estructura: la producción es una de varias maneras de abastecer, y comprar, reconvertir capacidad ociosa o articular una red comunitaria son otras. En el ítem R deben aparecer alternativas genuinamente distintas entre sí, no variantes de tamaño del mismo vivero.", "Fusión con el escenario de las 800 hectáreas. El predio fiscal del borde este es el destinatario del material vegetal y sus datos pueden citarse —32 especies leñosas nativas inventariadas, dos con categoría de conservación desfavorable, pendientes superiores al 30 % en la mitad alta, suelos erosionables—, pero si dentro del alcance aparecen la ejecución de la restauración, la obra del parque o la gestión del predio, el equipo cambió de proyecto. Señal de alarma en la EAP: componentes de plantación, riego o mantenimiento en el predio.", "Cifras con apariencia de dato oficial que el escenario no aporta: cantidad de plantines por especie y por año, capacidad instalada de vivero, número de viveros de la región, superficie a plantar por temporada, costo unitario del plantín. El escenario declara expresamente que esa información no existe: ése es el estado de cosas que el proyecto viene a revertir y, mientras tanto, todo número debe ir numerado como supuesto y remitido al F02.", "Supuestos de la MML que en realidad son tareas del proyecto —«se firman los contratos», «se elabora el protocolo», «se releva la demanda»— y ausencia del supuesto que verdaderamente sostiene toda la matriz: que el programa de restauración se apruebe y se ejecute en los plazos previstos. Si ese riesgo externo no aparece en el ítem U como el más frágil, el equipo no entendió dónde está parado el proyecto."]}, "6": {"n": 6, "pc": "El establecimiento hotelero proyectado en el piedemonte del departamento Capital, a 7,5 km del centro, resuelve toda su demanda de agua con una única fuente y una única calidad, de modo que desde su puesta en operación destinará agua de calidad potable extraída de un pozo sobre un acuífero con depresión regional a usos que no requieren esa calidad —descarga de inodoros, riego, limpieza y lavado—, mientras la totalidad de la lluvia que cae sobre los 13.045,03 m² del predio se conduce fuera por diseño.", "pcjus": "El problema se formula sobre lo que efectivamente ocurre y no sobre lo que falta: hay una decisión de diseño ya tomada y documentada —una sola fuente, una sola calidad, una sola cisterna de 55.000 L y una sola red aguas abajo— que pone agua apta para consumo humano, extraída de un acuífero cuyos niveles dinámicos ya generaron una depresión regional que modificó las direcciones de flujo originales, en usos que admiten agua de menor calidad, y que al mismo tiempo conduce fuera del predio, por pendientes, cordón cuneta, badenes y canal perimetral, el único volumen de agua que el sitio produce por sí mismo. Se descartó «falta un sistema de captación de agua de lluvia», que es la trampa mayor de este escenario porque es la solución convertida en problema y además es el título del escenario: si se la adopta, el ítem R queda resuelto antes de empezar y desaparecen del análisis la reducción de demanda, el reúso de aguas grises y la captación restringida a usos exteriores. Se descartó «el predio sufre anegamientos que el sistema vendría a resolver», porque la propia fuente lo desmiente al consignar que el canal de desagüe existente no presenta problemáticas de manejo: un árbol sostenido en una inundación inexistente queda refutado por su documentación. Se descartó «no hay conciencia ambiental sobre el uso del agua», que traslada al usuario una decisión de diseño y de gestión, no se puede medir ni localizar y sirve a lo sumo como causa de segundo nivel. Se descartó también «escasez hídrica en el departamento Capital», demasiado grande para el ámbito del ítem C y fuera del alcance de un edificio, y «alto consumo de agua y elevado costo operativo de bombeo», que une con una «y» dos enunciados donde el segundo es efecto del primero. La cláusula final sobre la lluvia conducida fuera no agrega un segundo problema: nombra el recurso disponible en el sitio que la misma decisión de diseño descarta, y es lo que vuelve mensurable y accionable al primero.", "objc": "El establecimiento hotelero proyectado en el piedemonte del departamento Capital, a 7,5 km del centro, resuelve su demanda de agua con fuentes y calidades diferenciadas según el uso, de modo que desde su puesta en operación cubre con agua de lluvia captada en el propio predio los usos que no requieren calidad potable —descarga de inodoros, riego, limpieza y lavado— y reserva el agua del pozo para los usos que sí la exigen.", "sit": [{"id": "s1", "k": "p", "d": "amb", "t": "El establecimiento hotelero proyectado en el piedemonte del departamento Capital, a 7,5 km del centro, resuelve toda su demanda de agua con una única fuente y una única calidad, de modo que desde su puesta en operación destinará agua de calidad potable extraída de un pozo sobre un acuífero con depresión regional a usos que no requieren esa calidad —descarga de inodoros, riego, limpieza y lavado—, mientras la totalidad de la lluvia que cae sobre los 13.045,03 m² del predio se conduce fuera por diseño."}, {"id": "s2", "k": "e", "d": "amb", "t": "Una fracción evitable del volumen que el establecimiento extrae del pozo —la que corresponde a usos que no requieren calidad potable— se suma a la extracción agregada de las perforaciones en explotación sobre un acuífero de abanico aluvial de vulnerabilidad media, cuyos niveles dinámicos ya generaron una depresión regional que modificó las direcciones de flujo originales."}, {"id": "s3", "k": "e", "d": "ter", "t": "La seguridad de abastecimiento del establecimiento y la de los demás usuarios que se abastecen de perforaciones propias en un sector suburbano en fuerte expansión quedan atadas a un mismo recurso en descenso, con el agravante de que el predio se ubica fuera de la zona de conducción del acuífero, en las proximidades del límite norte de los niveles productivos."}, {"id": "s4", "k": "e", "d": "eco", "t": "El establecimiento paga de manera permanente el bombeo y la conducción desde el pozo situado a 200 m de un volumen que podría no extraer, y desplaza la operación del pozo hacia escalones de caudal más altos, donde la eficiencia cae del 68,01 % al 44,33 %, la depresión se multiplica por 4,5 y cada metro cúbico adicional cuesta desproporcionadamente más energía que el anterior."}, {"id": "s5", "k": "e", "d": "amb", "t": "El riego de los espacios verdes y el baldeo de las playas y calles internas se cubren íntegramente con agua del pozo durante la estación seca —cinco meses consecutivos que suman 22,9 mm entre mayo y septiembre—, es decir en el período de menor recarga del acuífero y de mayor demanda simultánea de los demás usuarios del sector."}, {"id": "s6", "k": "e", "d": "ins", "t": "El pedido de concesión de agua subterránea que tramita ante la autoridad provincial se sostiene sobre una demanda mayor que la estrictamente necesaria y sin cálculo de consumo que la respalde, con riesgo de que el caudal que finalmente se autorice resulte menor que el consumo efectivo del establecimiento."}, {"id": "s7", "k": "e", "d": "soc", "t": "El desempeño hídrico del establecimiento no puede acreditarse ante la certificación voluntaria de hotelería sustentable que tramita, ni ante los huéspedes, operadores turísticos y organizadores de eventos que la consideran al elegir, porque en el capítulo del agua no hay ni medición propia ni sustitución de fuente que exhibir."}, {"id": "s8", "k": "c", "d": "tec", "t": "La instalación sanitaria proyectada resuelve todo el edificio con una sola cisterna de 55.000 L alimentada por el pozo y una única red aguas abajo, dimensionada bajo el criterio de que toda el agua que circula por el establecimiento debe ser potable."}, {"id": "s9", "k": "c", "d": "tec", "t": "Toda la infraestructura pluvial del predio —pendientes generales, cordón cuneta, badenes, colectores y el canal perimetral que cruza la avenida y descarga en el río 800 m al norte— está resuelta con un único objetivo, evacuar el agua fuera del predio en el menor tiempo posible, y no incorpora ningún punto de retención en los sectores donde el escurrimiento converge."}, {"id": "s10", "k": "c", "d": "tec", "t": "Los usos que podrían cubrirse con agua no potable se operan sin criterio de reposición ni protocolo escrito: el riego automatizado se comanda desde un computador eléctrico sin frecuencias ni horarios definidos y sin referencia al balance hídrico, y la limpieza de grandes superficies, el lavado de blancos y la purga y reposición de la piscina de 180 m² no tienen volumen previsto ni contabilizado."}, {"id": "s11", "k": "c", "d": "tec", "t": "La demanda de agua del establecimiento no está calculada por sector ni por uso: el estudio inventaría 109 lavabos, 109 inodoros, 109 duchas, los artefactos de 22 baños comunes, 4 lavarropas y 654 luminarias, pero no consigna una sola estimación de consumo de agua, de modo que la cisterna de 55.000 L y el pedido de concesión se dimensionaron sin ese cálculo."}, {"id": "s12", "k": "c", "d": "eco", "t": "No hay medición desagregada del consumo por sector ni serie histórica que permita saber cuánta agua se usa en cada destino: el proyecto prevé una acometida única para cocina, lavandería, riego y habitaciones, sin macromedición en el pozo, sin submedición por sector y sin registro de horas de bomba."}, {"id": "s13", "k": "c", "d": "eco", "t": "El agua no tiene precio por metro cúbico dentro del establecimiento: proviene de un pozo propio y no de una factura, su costo real queda diluido en la factura eléctrica y no se imputa a ningún sector, de modo que ninguna área de la organización dispone del dato ni del incentivo económico con el cual justificar una reducción."}, {"id": "s14", "k": "c", "d": "ins", "t": "La documentación del proyecto no asigna a ningún puesto de la estructura de operación la responsabilidad sobre el desempeño hídrico del establecimiento: ni el seguimiento del consumo, ni la operación y el mantenimiento de las instalaciones de agua, ni el cumplimiento de metas de uso."}, {"id": "s15", "k": "c", "d": "soc", "t": "El personal de operación no está cuantificado ni tiene previsto un plan de formación, y el proyecto no contempla señalización diferenciada de los puntos de agua no potable ni comunicación al huésped, pese a que las habitaciones ya cuentan con tarjeta magnética de energización, es decir con un canal instalado de conducta del usuario."}, {"id": "s16", "k": "c", "d": "amb", "t": "El régimen de precipitación del sitio es marcadamente estacional —197 mm en enero y el 80 % del total anual concentrado entre diciembre y marzo, contra 22,9 mm en los cinco meses de mayo a septiembre—, de modo que aprovechar la lluvia en el propio predio exige almacenar entre estaciones un volumen muy superior a la única reserva prevista, la cisterna de 55.000 L, que además está comprometida con la demanda diaria del edificio."}, {"id": "s17", "k": "c", "d": "ins", "t": "El marco al que el proyecto se somete —visado municipal de planos, certificado de uso conforme, estudio de impacto ambiental presentado y trámite de concesión de agua subterránea— se satisface conduciendo el pluvial fuera del predio y no exige acreditar aprovechamiento del agua de lluvia ni diferenciación de fuentes según la calidad que cada uso requiere."}, {"id": "s18", "k": "c", "d": "ter", "t": "El predio está fuera del radio servido por la prestadora y la factibilidad se otorgó para un sistema de provisión independiente, a proyectar, ejecutar y administrar por el propietario, de modo que ningún tercero mide, factura, controla ni fija estándares de uso sobre el agua que el establecimiento consume."}], "lnk": [{"a": "s1", "b": "s2"}, {"a": "s1", "b": "s4"}, {"a": "s1", "b": "s5"}, {"a": "s1", "b": "s6"}, {"a": "s1", "b": "s7"}, {"a": "s5", "b": "s2"}, {"a": "s2", "b": "s3"}, {"a": "s6", "b": "s3"}, {"a": "s8", "b": "s1"}, {"a": "s9", "b": "s1"}, {"a": "s10", "b": "s1"}, {"a": "s11", "b": "s8"}, {"a": "s16", "b": "s8"}, {"a": "s16", "b": "s9"}, {"a": "s17", "b": "s8"}, {"a": "s17", "b": "s9"}, {"a": "s12", "b": "s11"}, {"a": "s14", "b": "s12"}, {"a": "s14", "b": "s10"}, {"a": "s15", "b": "s10"}, {"a": "s13", "b": "s12"}, {"a": "s13", "b": "s10"}, {"a": "s18", "b": "s13"}, {"a": "s18", "b": "s12"}], "obj": {"s1": "El establecimiento hotelero proyectado en el piedemonte del departamento Capital, a 7,5 km del centro, resuelve su demanda de agua con fuentes y calidades diferenciadas según el uso, de modo que desde su puesta en operación cubre con agua de lluvia captada en el propio predio los usos que no requieren calidad potable —descarga de inodoros, riego, limpieza y lavado— y reserva el agua del pozo para los usos que sí la exigen.", "s2": "El volumen que el establecimiento extrae del pozo se limita a los usos que efectivamente requieren calidad potable, y su aporte a la extracción agregada sobre el acuífero de abanico aluvial disminuye en la medida de la fracción sustituida por agua de lluvia.", "s3": "La seguridad de abastecimiento del establecimiento y la de los demás usuarios de perforaciones del sector mejora, porque cada metro cúbico de lluvia aprovechado es demanda que deja de ejercerse sobre el mismo recurso en un sector en fuerte expansión.", "s4": "El establecimiento evita el bombeo y la conducción desde el pozo del volumen sustituido y opera la perforación en escalones de caudal bajos, donde la eficiencia se mantiene en el orden del 68 % y el costo energético del metro cúbico es el menor de la curva del ensayo.", "s5": "El riego de los espacios verdes y el baldeo de las playas y calles internas se cubren durante la estación seca con la reserva de agua de lluvia acumulada en la estación húmeda, y no con extracción del pozo en el período de menor recarga del acuífero.", "s6": "El pedido de concesión de agua subterránea se sostiene sobre una demanda calculada por uso y ya descontada de la fracción que cubre el agua de lluvia, de modo que el caudal solicitado y el consumo efectivo del establecimiento son consistentes entre sí.", "s7": "El desempeño hídrico del establecimiento se acredita ante la certificación voluntaria de hotelería sustentable y ante huéspedes, operadores turísticos y organizadores de eventos, con medición propia y con una fracción declarada y verificable de la demanda cubierta con agua de lluvia.", "s8": "La instalación sanitaria del establecimiento distribuye dos calidades de agua por redes separadas y señalizadas: la potable del pozo hacia duchas, lavabos, cocina y lavandería, y la de lluvia tratada hacia descargas de inodoro, riego y limpieza.", "s9": "La infraestructura pluvial del predio conduce el escurrimiento hacia puntos de retención antes de derivar el excedente al canal perimetral, y las bajadas de cubierta llegan a un punto de captación propio, con desvío de primeras aguas y filtrado.", "s10": "Los usos cubiertos con agua no potable se operan con protocolo escrito y criterio de reposición: el riego se programa por balance hídrico y con corte por lluvia, y la limpieza de grandes superficies, el lavado de blancos y la purga de la piscina tienen frecuencia, volumen previsto y registro.", "s11": "La demanda de agua del establecimiento está calculada por sector y por uso, con la fracción sustituible identificada, y ese cálculo respalda el dimensionamiento de las reservas y el caudal solicitado en la concesión.", "s12": "El establecimiento mide el consumo de agua de manera desagregada —macromedición en el pozo, submedición de cocina, lavandería, riego, piscina y habitaciones y registro de horas de bomba— y construye una serie mensual comparable con la ocupación.", "s13": "El agua tiene un costo conocido por metro cúbico dentro del establecimiento —energía de bombeo, conducción, tratamiento y mantenimiento— imputado a cada sector, de modo que cada área dispone del dato y del incentivo para reducir su consumo.", "s14": "Un puesto de la estructura de operación tiene asignada por escrito la responsabilidad sobre el desempeño hídrico del establecimiento, con metas, tablero de seguimiento y reporte periódico a la dirección.", "s15": "El personal de operación está cuantificado y formado para convivir con dos redes de distinta calidad, los puntos de agua no potable están señalizados de manera inequívoca y el huésped recibe la comunicación del sistema por los canales que el establecimiento ya tiene instalados.", "s16": "El establecimiento cuenta con un volumen de reserva dimensionado para el régimen estacional del sitio, que traslada agua de la estación húmeda a la seca y se destina prioritariamente a los usos de demanda continua, sin comprometer la cisterna de consumo diario.", "s17": "El proyecto acredita ante las autoridades municipal, ambiental y de recursos hídricos el aprovechamiento del agua de lluvia y la diferenciación de fuentes según la calidad requerida por cada uso, e incorpora esas condiciones a su documentación de habilitación.", "s18": "El establecimiento asume, en su carácter de administrador de un sistema de provisión independiente, la medición, el registro y el estándar de uso del agua que consume, y los declara periódicamente ante la autoridad provincial de recursos hídricos."}, "f01": {"A": "Propuesta de ejemplo, no la única respuesta válida: DOS AGUAS · Consultora Ambiental (S.H.).\n\nEl nombre es corto, se pronuncia entero y admite sigla en la papelería. Dice en dos palabras lo que el equipo hace: separar el agua según la calidad que cada uso exige, que es exactamente la idea que ordena todo el trabajo. Además tiene una segunda lectura de oficio —el techo a dos aguas—, que remite a la superficie de captación con la que se trabaja. Se elige como si se estuviera iniciando una actividad profesional real, en el estilo de las consultoras inscriptas en el registro provincial de consultores ambientales, y por ahora se asume sociedad de hecho. Advertencia de método: este es el nombre del equipo, no el del proyecto; el nombre del proyecto se define recién en el ítem V y es otro.", "B": "Se declara la estructura de roles y la dedicación real de la entrega, sin tiempos muertos y sin incluir a quien no trabajó. Se usan denominaciones genéricas porque este es el solucionario docente; el equipo consigna apellido y nombre.\n\n· Integrante 1 — Coordinación general y redacción final. Convoca, distribuye tareas, controla plazos, consolida el formulario y firma la comunicación con la cátedra. 24 h.\n· Integrante 2 — Análisis de la documentación técnica del caso: memoria de instalaciones, planos de agua y pluviales, fichas por sector, ensayo de bombeo. Es quien detecta y documenta las discrepancias de la fuente. 22 h.\n· Integrante 3 — Cálculos e indicadores: población servida, demanda por método de dotación y por artefacto, fracción sustituible, oferta pluvial mensual y planilla de supuestos. 26 h.\n· Integrante 4 — Marco normativo, involucrados y dependencia institucional; consultas a la autoridad de recursos hídricos y al área municipal de obras privadas. 18 h.\n· Integrante 5 — Árboles de problemas y objetivos, EAP y MML; cartografía, esquemas y paratextos. 20 h.\n\nTotal declarado: 110 h. Metodología acordada: una reunión presencial semanal de dos horas más trabajo asincrónico sobre documento compartido; repositorio único de fuentes con la cita de cada dato; canal de mensajería para consultas rápidas. La coordinación es rotativa y removible por mayoría, informando a la cátedra por correo. Regla interna adoptada: ningún número entra al informe sin fuente o sin número de supuesto.", "C": "Ámbito principal: ecoeficiencia. Ámbitos complementarios que se declaran porque el escenario los toca de manera efectiva: saneamiento ambiental y gestión ambiental de proyectos de inversión. Las categorías de la Guía no son mutuamente excluyentes y este caso queda representado en más de una.\n\nEcoeficiencia es el énfasis elegido: el proyecto no agrega un servicio que hoy no existe, sino que produce el mismo servicio hotelero —109 habitaciones, restaurante, piscina de 180 m², lavandería, sala de conferencias para 300 personas— con menor consumo de un recurso natural crítico, sustituyendo una fuente subterránea de calidad potable por otra disponible en el sitio para los usos que no requieren esa calidad. La unidad de medida del proyecto es la relación entre servicio prestado y recurso consumido: metros cúbicos de agua subterránea por pernoctación.\n\nSaneamiento ambiental corresponde porque la intervención opera sobre el ciclo del agua del predio en sus dos extremos —la provisión desde el pozo y el manejo del escurrimiento pluvial hacia el canal perimetral— y porque una red de agua no potable dentro de un edificio de uso público es, antes que nada, una cuestión sanitaria: exige separación física, señalización, prevención de conexiones cruzadas y control de calidad por uso.\n\nGestión ambiental de proyectos de inversión corresponde por el momento en que se interviene: el establecimiento no está construido y tiene estudio de impacto ambiental presentado, visado municipal de planos y una obra de 24 meses en tres etapas de ocho por delante. El proyecto se inserta en el proyecto ejecutivo de otro proyecto de inversión, y esa condición cambia el costo, el plazo y el modo de decidir.\n\nNota de método: este ítem se cerró después de escribir el D. Elegir el ámbito antes de tener claro el problema conduce a inscribirlo en «gestión de residuos» o en «conservación» por asociación temática y no por la naturaleza de la intervención.", "D": "El establecimiento hotelero proyectado en el piedemonte del departamento Capital, a 7,5 km del centro, resuelve toda su demanda de agua con una única fuente y una única calidad, de modo que desde su puesta en operación destinará agua de calidad potable extraída de un pozo sobre un acuífero con depresión regional a usos que no requieren esa calidad —descarga de inodoros, riego, limpieza y lavado—, mientras la totalidad de la lluvia que cae sobre los 13.045,03 m² del predio se conduce fuera por diseño.\n\nCumple los cinco criterios. Identidad: agua potable puesta en usos que no la requieren, un estado negativo, no la ausencia de una obra. Localización: el predio del piedemonte, fuera del radio servido por la prestadora. Tiempo: desde la puesta en operación, con pico en la estación seca. Medición: m³/año de agua de pozo en usos que admiten agua no potable, y su porcentaje sobre la demanda total. Magnitud: del orden de 4.100 m³/año, cerca del 19 % de la demanda estimada en el ítem E. Es un solo problema —la cláusula sobre la lluvia nombra el recurso que la misma decisión descarta— y es modificable, porque la decisión se toma en el proyecto ejecutivo, dentro de una obra de 24 meses en tres etapas.", "E": "Indicador adoptado, en situación sin proyecto:\n\n«El 100 % de la demanda de usos que no requieren calidad potable —descarga de inodoros, riego de espacios verdes y baldeo de playas y calles internas—, del orden de 4.100 m³/año equivalentes al 19 % de la demanda total estimada del establecimiento, se cubre con agua de calidad potable extraída del pozo, en el establecimiento hotelero del piedemonte del departamento Capital, durante el primer año calendario completo de operación, verificado por la macromedición del pozo y la submedición por sector que el propio proyecto instala, y estimado hasta entonces por el cálculo de demanda del F02.»\n\nValor sin proyecto: 100 % (≈ 4.100 m³/año). Indicador complementario: consumo específico de 500 L de agua subterránea por pernoctación, valor de diseño.\n\nQué aporta el escenario y qué hay que relevar. El escenario aporta superficies, inventario de artefactos, tipologías de habitación, capacidad del pozo por escalón, serie de precipitación 1991–2020 y volumen de cisterna. No aporta —y el cuaderno lo declara expresamente— tasa de ocupación, personas por habitación, dotaciones a adoptar, coeficientes de escorrentía, evapotranspiración ni precios. Todo eso se asume acá con número de supuesto y se verifica en el F02.\n\nCadena de cálculo. (1) Población servida: 109 habitaciones × 0,60 de ocupación media anual [S1] × 1,8 personas por habitación ocupada [S2] = 117,7 personas/día = 42.968 pernoctaciones/año. No se computan aquí los asistentes a eventos —aforo 300— ni los cubiertos del restaurante ni la dotación de personal, que se cuentan aparte y con su propia unidad; sumarlos como «personas» es el error de unidades más frecuente. (2) Demanda total, método por dotación: 42.968 × 500 L/huésped·día ÷ 1.000 = 21.484 m³/año, es decir 58,9 m³/día. La dotación hotelera de 500 L es un valor de diseño que prorratea áreas comunes, cocina y lavandería: se usa para verificar capacidades, y para el flujo de fondos del F02 deberá adoptarse un valor de operación, menor, explicitando cuál se usa en cada caso [S3]. Contraste con la fuente: 58,9 m³/día es el 49 % de los 120 m³/día del primer escalón del ensayo de bombeo, de modo que la demanda media cabe en el escalón eficiente, pero los picos de fin de semana con sala de conferencias ocupada desplazan la operación hacia el segundo y el tercero, donde la eficiencia cae del 68,01 % al 44,33 %. (3) Fracción sustituible, método por artefacto y por superficie: descarga de inodoros, 5 descargas por persona y día [S4] × 4,5 L de volumen medio con doble pulsador 6/3 L = 967 m³/año; riego, 2.600 m² × 5 L/m²·día × 200 días efectivos [S5] = 2.600 m³/año; baldeo de 5.000 m² de playas y calles, 2 L/m²·día con frecuencia semanal [S6] = 520 m³/año. Total 4.087 m³/año, esto es 19,0 % de la demanda total de diseño. Sobre una dotación de operación menor, la misma fracción sustituible pesaría bastante más de 19 %: por eso el indicador se expresa en volumen y en porcentaje a la vez.\n\nCon qué valor se trabaja y por qué, en las contradicciones de la fuente. (a) Espacios verdes, 5.000 m² en la distribución de superficies contra 2.600 m² en las fichas de riego y paisajismo. Se adopta 2.600 m² para la demanda de riego, por dos razones: es el dato de la ficha sectorial, que es la que describe la superficie efectivamente parquizada y regada con criterio 20 % plantación / 80 % césped, y es el valor conservador para dimensionar la sustitución, de modo que si el relevamiento del F02 confirmara 5.000 m² el proyecto mejora y no empeora. Se deja constancia de la magnitud del desvío: con 5.000 m² el riego sería de 5.000 m³/año y la fracción sustituible saltaría de 4.087 a 6.487 m³/año, un 59 % más. La discrepancia no es un detalle de redacción: cambia el dimensionamiento del almacenamiento. (b) Superficie de captación. La suma de superficies declaradas —9.650 de cubierta, 850 de expansiones, 1.500 de estacionamientos, 3.500 de calles internas y 5.000 de verde— da 20.500 m² sobre un predio de 13.045,03 m². La inconsistencia se resuelve leyendo el indicador urbanístico: los 9.650 m² son superficie cubierta computada en cuatro niveles y no proyección de cubierta; con FOS 0,30 sobre 13.045,03 m² la proyección disponible como superficie de captación de techo es del orden de 3.900 m², repartida entre la cubierta del volumen principal y la del basamento. Se trabaja con 3.900 m² y se declara el criterio [S7]; usar los 9.650 m² sobrestimaría la oferta en dos veces y media. (c) Lavarropas, 4 en la ficha de lavandería y 3 en la de energía: se adopta 4 por ser el dato del sector que describe el proceso. (d) Duchas de baños de servicio, 12 contra 2 lavabos e inodoros: se marca como dato a verificar y no se usa en el cálculo.\n\nOferta pluvial, para contrastar con la demanda sustituible. Serie 1991–2020 de la estación de referencia a 5,5 km: 737,2 mm anuales sumados por cálculo propio a partir de la serie mensual. El estudio ubica el sitio en la franja de isohietas de 750 a 800 mm por efecto orográfico. Se trabaja con 737,2 mm por ser el dato medido y el más conservador, y se deja anotado que la isohieta daría entre 2 % y 9 % más [S8]. Con 3.900 m² de cubierta y coeficiente de escorrentía 0,85 [S9]: 2.452 m³/año, de los cuales 1.959 m³ caen entre diciembre y marzo y sólo 296 m³ entre abril y octubre. Las superficies exteriores —1.500 m² de estacionamiento y 3.500 m² de calles— aportarían otros 2.580 m³/año con coeficiente 0,70, con calidad inferior y necesidad de captarlos en los puntos bajos a los que ya converge el escurrimiento.\n\nLa restricción que ordena todo el proyecto. El riego de la estación seca demanda del orden de 1.950 m³ concentrados entre abril y octubre, período en el que las cubiertas producen 296 m³: cubrir ese uso al 100 % con lluvia exigiría trasladar unos 1.650 m³ desde la estación húmeda, treinta veces la cisterna proyectada de 55.000 L. En cambio los usos de demanda continua —descarga de inodoros y limpieza, 1.487 m³/año, unos 124 m³/mes— se acompasan mucho mejor con una reserva acotada. El dimensionamiento óptimo no es el que cubre el 100 % de un uso estacional sino el que maximiza el volumen sustituido por metro cúbico de reserva construida; ese cálculo es materia del F02, pero la conclusión que ya ordena el F01 es que la prioridad de sustitución son los usos continuos y no el riego.\n\nSupuestos declarados, todos a verificar en el F02: S1 ocupación media anual 0,60; S2 1,8 personas por habitación ocupada; S3 dotación de diseño 500 L/huésped·día del anexo de referencia; S4 5 descargas por persona y día; S5 200 días efectivos de riego y 5 L/m²·día; S6 baldeo semanal a 2 L/m²·día; S7 3.900 m² de proyección de cubierta derivados del FOS 0,30; S8 737,2 mm anuales de la estación de referencia; S9 coeficientes de escorrentía 0,85 en cubierta y 0,70 en superficies exteriores. Ninguno de estos valores figura en la documentación del caso y ninguno debe presentarse como dato del establecimiento.", "F": "El contexto se describe sólo en lo que tiene relación con el problema; no es una monografía del departamento.\n\nMedio físico y clima. Piedemonte del cordón serrano occidental del departamento Capital, provincia de Salta, a unos 7,5 km del centro de la ciudad, sobre un predio de 13.045,03 m² desmembrado de un conjunto de 20.736,95 m². Franja de isohietas de 750 a 800 mm anuales según el estudio; la estación de referencia situada a 5,5 km registra 737,2 mm anuales en la serie 1991–2020, con 63 días de lluvia mayor a 1 mm. El régimen es marcadamente estacional: 197 mm en enero, 147 en febrero, 138 en diciembre y 107 en marzo —el 80 % del total anual entre diciembre y marzo— contra 22,9 mm sumados en los cinco meses de mayo a septiembre, con mínimo de 2,3 mm en agosto. Temperatura media anual 16,9 °C, con medias máximas de 28,4 °C en diciembre y humedad relativa que baja al 55,8 % en septiembre: el pico de demanda de riego coincide con el mínimo de oferta pluvial. El estudio no consigna heliofanía, evaporación ni evapotranspiración de referencia, de modo que la demanda de riego deberá estimarse con datos de otra fuente. Los suelos del sitio son limosos y, según el propio estudio, se planchan y encostran aun con lluvias no muy intensas, lo que reduce la infiltración y aumenta el escurrimiento superficial: dato relevante tanto para la oferta captable como para el mantenimiento de canaletas y filtros antes de la temporada húmeda.\n\nRecurso hídrico subterráneo. Acuífero de abanico aluvial recargado desde la subcuenca del río que baja del cordón serrano occidental, con dirección de flujo hacia el este abriéndose en abanico y gradiente de 1,25 % a 0,2 % de norte a sur. El predio se ubica fuera de la zona de conducción, en las proximidades del límite norte de los niveles productivos. Agua bicarbonatada cálcico-magnésica, apta para consumo humano, de baja mineralización, con sólidos disueltos totales entre 140 y 492 mg/L. Vulnerabilidad media en el sector según el mapa provincial de vulnerabilidad de acuíferos. Las cuencas aportantes disponen del orden de 248 hm³/año de recursos hídricos superficiales. El dato decisivo del contexto es el estado del recurso: los niveles dinámicos de las perforaciones en explotación han generado una depresión regional que modificó las direcciones de flujo originales, que hoy convergen hacia la ciudad. El pozo del caso, ubicado a 200 m del predio y vinculado por cañería de PVC clase 6, tiene nivel estático de 47,65 m y un ensayo de bombeo en tres escalones: 5,00 / 8,80 / 13,40 m³/h, con niveles dinámicos de 52,21 / 59,21 / 68,16 m, depresiones de 4,56 / 11,56 / 20,51 m, eficiencias de 68,01 / 54,71 / 44,33 % y caudales equivalentes de 120,00 / 211,20 / 320,40 m³/día. Filtros de acero galvanizado de 1 mm y prefiltro de grava de 2 a 4 mm.\n\nContexto urbano y de servicios. Zona suburbana en fuerte expansión, zonificada como Área Comercial 2 por recategorización desde Residencial 3 mediante ordenanza de excepción, con FOS 0,30 sobre un máximo de 0,50, FOT 0,70 sobre 2,00, altura máxima 12 m y retiros de 6 / 6 / 3 m. El predio es frentista a un nudo vial y está fuera del radio servido por la prestadora de agua y saneamiento, que otorgó factibilidad para un sistema de provisión independiente cuya administración le es ajena. El nexo cloacal está aprobado dentro de un proyecto de redes colectoras que incorpora 1.292 lotes, cifra que mide por sí sola la velocidad de urbanización del sector y la presión futura sobre la misma fuente. Hay red de gas natural —horno de cocina y climatización de la piscina— y factibilidad eléctrica otorgada, con paneles fotovoltaicos en azotea para autoconsumo, sin cantidad ni potencia declaradas. El escurrimiento pluvial del predio se resuelve con pendientes generales, calzadas de adoquín con flecha de 7 cm, pendientes del 2 % en calzada y 4 % en vereda, cordón cuneta de 0,70 m y badenes, y un canal que bordea los límites sur y este, cruza la avenida por alcantarilla y descarga en el río 800 m al norte. El estudio consigna que ese canal no presenta problemáticas de manejo.\n\nContexto socioeconómico y del proyecto de inversión. El establecimiento está proyectado con visado municipal de planos, certificado de uso conforme y estudio de impacto ambiental y social presentado; la concesión de agua subterránea está en trámite ante la autoridad provincial de recursos hídricos. La obra se ejecuta en 24 meses y tres etapas de ocho, con unas 200 personas en el pico de obra, y el establecimiento cursa una asesoría para aplicar a una certificación voluntaria de hotelería sustentable. El programa comprende 109 habitaciones —66 doble queen, 28 king, 11 suites, 3 familiares y 3 adaptadas, con 36 conectables—, sala de conferencias modulable para 300 personas, restaurante y bar de uso propio y externo, piscina exterior climatizada de 180 m², gimnasio, spa con saunas seco y húmedo, lavandería propia, locales comerciales y coworking, y 100 plazas de estacionamiento. El equipamiento sanitario ya es eficiente: inodoros de doble pulsador 6/3 L y griferías de cierre automático en todos los lavabos, dato que acota el margen de ahorro por reemplazo de artefactos y desplaza el margen hacia la calidad del agua utilizada.\n\nQué del contexto potencia el problema y qué contribuye a su solución. Lo potencian la depresión regional del acuífero, la expansión acelerada del sector sobre la misma fuente, la estacionalidad extrema de la precipitación, la ausencia de un tercero que mida y facture el agua, y la existencia de una infraestructura pluvial ya diseñada para evacuar. Contribuyen a la solución la obra no iniciada y su ventana de 24 meses, la existencia previa de red de riego con bombeo y filtro de anillas, la disponibilidad de un subsuelo con salas de máquinas donde alojar equipos, los puntos bajos identificables en el plano de escurrimiento, la certificación voluntaria en trámite y el hecho de que la propia documentación del pozo demuestre, con números, el costo creciente de cada metro cúbico adicional.", "G": "Población potencial. Es la que internaliza el problema, y tiene dos capas de distinto alcance. Capa interna: los usuarios del establecimiento, que se cuentan con unidades distintas y no se suman entre sí — huéspedes, del orden de 42.968 pernoctaciones al año bajo los supuestos S1 y S2 del ítem E; asistentes a eventos de la sala de conferencias, con aforo de 300 personas y frecuencia no declarada en la fuente; comensales del restaurante y bar, de uso propio y externo, sin cifra en la documentación; y el personal de operación, no cuantificado en el estudio, que sí puede estimarse en el F02 a partir de la relación habitual de empleados por habitación. Capa externa: los usuarios del acuífero de abanico aluvial en el sector suburbano en expansión, que se abastecen de perforaciones propias y comparten un recurso con depresión regional ya declarada. Esta segunda capa no puede cuantificarse con la documentación del caso —haría falta el registro de perforaciones de la autoridad provincial de recursos hídricos, que existe y es consultable— y por eso se declara identificada pero no cuantificada, sin inventarle un número.\n\nPoblación objetivo. Los beneficiarios directos del proyecto son la unidad de gestión del establecimiento y quienes operan y usan sus instalaciones: el titular del emprendimiento como administrador de un sistema de provisión independiente, el personal de operación que convivirá con dos redes de distinta calidad, y los huéspedes y asistentes a eventos que usan los artefactos alimentados con agua no potable. El proyecto los alcanza al 100 %, porque la intervención es sobre la instalación misma y no sobre una conducta voluntaria: quien usa el edificio recibe el servicio por el solo hecho de usarlo.\n\nCriterio de recorte. La población objetivo no es «toda la comunidad» ni «los habitantes del sector». Los usuarios del acuífero son población potencial de los efectos —el beneficio que reciben es la fracción de extracción evitada, que es real pero indirecta, difusa y no atribuible individualmente— y por eso quedan fuera de la población objetivo, aunque sí entran en el nivel de Fin de la matriz. Incorporarlos como destinatarios directos obligaría a un proyecto de escala de acuífero, que excede el ámbito declarado en el ítem C y el alcance de un establecimiento. Del mismo modo, la comparación entre el volumen sustituido por este establecimiento y la extracción agregada del sector es un dato de contexto para justificar la urgencia, no una medida del alcance del proyecto.\n\nAdvertencia de coherencia: todas las cifras de población de este ítem descansan en los supuestos S1 y S2 y deben recalcularse en el F02 con la ocupación proyectada del plan de negocios y con el factor de ocupación por tipología —66 doble queen, 28 king, 11 suites, 3 familiares y 3 adaptadas no alojan la misma cantidad de personas—, criterio que el equipo debe definir y justificar.", "H": "Siete actores, con posición sobre el problema y su solución, y fuerza e importancia en la misma escala cualitativa alta–media–baja.\n\n1. Titular del emprendimiento hotelero — Empresa privada — Posición: a favor con reservas. Fuerza alta: decide la inversión, el cronograma de obra y la estructura de operación; sin su decisión no hay proyecto. Importancia alta: es el titular del sistema de provisión independiente y quien capitaliza el ahorro de energía de bombeo y el argumento de la certificación. La reserva es económica y de plazo: el sistema compite por partida dentro de una obra de 24 meses y su beneficio se percibe recién en operación.\n\n2. Autoridad provincial de recursos hídricos — Institución pública — Posición: a favor. Fuerza alta: tiene en trámite la concesión de agua subterránea y puede fijar condiciones, caudales y obligaciones de medición y declaración. Importancia alta: es el único actor con jurisdicción sobre el estado del acuífero y sobre la depresión regional, y el destinatario natural de la información que el proyecto produce.\n\n3. Municipalidad de la Capital — áreas de obras privadas, planeamiento y ambiente — Institución pública — Posición: indiferente hoy, potencialmente a favor. Fuerza alta: visa los planos, otorga el certificado de uso conforme y habilita; puede aprobar o rechazar una red interna separada y su señalización. Importancia media: su marco actual se satisface con conducir el pluvial fuera del predio, de modo que no impulsa el proyecto, pero puede volverlo condición o antecedente de futuras exigencias en el sector.\n\n4. Prestadora de agua y saneamiento — Empresa de servicios — Posición: indiferente. Fuerza media: otorgó la factibilidad para un sistema independiente cuya administración le es ajena y aprobó el nexo cloacal del proyecto de 1.292 lotes, pero no provee ni factura el agua de este predio. Importancia media: no controla el consumo, aunque su normativa técnica de instalaciones sanitarias es la referencia para admitir una red de agua no potable dentro de un edificio de uso público.\n\n5. Proyectistas de instalaciones y empresa constructora — Empresa privada — Posición: en contra por omisión. Fuerza alta: el diseño de una sola cisterna y una sola red está tomado, y toda modificación implica rehacer documentación, recotizar y reprogramar; su resistencia es la que crece mes a mes a medida que avanza la obra. Importancia alta: son quienes materialmente pueden incorporar la doble red mientras las instalaciones no estén hechas. Estrategia hacia ellos: intervenir en la etapa 1 de las tres de ocho meses, cuando el cambio es de proyecto ejecutivo y no de demolición.\n\n6. Estructura de operación del establecimiento — gerencia, mantenimiento, ama de llaves, jardinería — Otra institución privada — Posición: indiferente hoy, decisiva después. Fuerza media: no participa de la decisión de inversión pero determina si el sistema rinde; una purga mal hecha, un filtro sin limpiar o un riego por calendario anulan el ahorro previsto. Importancia alta: son la población objetivo directa de la capacitación y del puesto responsable del desempeño hídrico. Nota: hoy este actor no existe todavía, y ese es justamente el argumento para dejar previstos el puesto, el protocolo y el presupuesto de formación antes de la inauguración.\n\n7. Organismo de la certificación voluntaria de hotelería sustentable — Otra institución — Posición: a favor. Fuerza baja: no puede obligar a nada. Importancia media: convierte el desempeño hídrico en un activo comercial verificable y aporta el estándar y la auditoría externa que el establecimiento no tiene por vía regulatoria.\n\nActor a monitorear, sin fuerza formal pero con capacidad de bloqueo reputacional: los vecinos y demás usuarios de perforaciones del sector en expansión, hoy no organizados en torno a este tema. Su posición se volvería activa si la depresión regional afectara sus propios pozos, y en ese escenario el establecimiento que puede exhibir medición y sustitución está en una posición distinta del que no puede.", "I": "Titular del proyecto: el propietario del establecimiento hotelero, en su carácter de persona jurídica privada. La figura es la de un componente de inversión incorporado al proyecto ejecutivo de la obra principal, no la de un proyecto autónomo: se financia, se licita y se ejecuta dentro del mismo contrato de obra de 24 meses en tres etapas, y su unidad ejecutora es la dirección de obra del emprendimiento. Esta definición no es una formalidad — determina que el proyecto no requiera constituir estructura propia, que su cronograma esté subordinado al de la obra y que la decisión relevante sea la de la etapa 1.\n\nOrganizaciones de las que depende directamente su realización, todas ellas presentes también en el ítem H:\n\n· Autoridad provincial de recursos hídricos. De ella depende la concesión de agua subterránea, hoy en trámite, y es ante ella que se declara el caudal de extracción. Es también la autoridad competente en materia de uso y aprovechamiento de las aguas, incluida el agua de lluvia captada en predio privado, cuestión que debe consultarse antes de dimensionar.\n\n· Municipalidad de la Capital, áreas de obras privadas, planeamiento urbano y ambiente. De ella dependen el visado de planos —que deberá reflejar la doble red y las obras de captación y reserva—, el certificado de uso conforme ya otorgado y la habilitación comercial posterior. Es también la autoridad sobre los desagües pluviales y sobre el canal perimetral que recibe el escurrimiento.\n\n· Autoridad ambiental provincial. El estudio de impacto ambiental y social está presentado; toda modificación relevante del proyecto de instalaciones debe reflejarse en ese expediente y en su eventual declaración de impacto ambiental.\n\n· Prestadora de agua y saneamiento. No provee el agua, pero su normativa técnica de instalaciones sanitarias domiciliarias es la referencia de admisibilidad para una red interna de agua no potable en un edificio de uso público, y aprobó el nexo cloacal al que descarga el establecimiento.\n\n· Autoridad sanitaria provincial o municipal, según competencia, en lo relativo a calidad de agua por tipo de uso, prevención de conexiones cruzadas y control microbiológico del agua de aspersión en áreas de uso público.\n\n· Organismo de la certificación voluntaria de hotelería sustentable, en trámite de asesoría, cuyo estándar fija exigencias de medición, capacitación y comunicación que el proyecto puede adoptar como marco de referencia.\n\nEn esta instancia sólo se identifican las dependencias. Los acuerdos, autorizaciones y consultas formales corresponden al paso de perfil a prefactibilidad; anticipar gestiones ahora sería trabajar sobre un diseño que todavía puede cambiar.", "J": "Se construye la matriz de cumplimiento legal por materia, no un listado exhaustivo de derecho ambiental. Cuando no hay certeza sobre el número exacto de una norma se la nombra por su materia; el equipo debe verificar vigencia y texto ordenado de cada una antes de citarla con número, y controlar que el marco citado en la documentación del caso no sea anterior a modificaciones recientes.\n\nNivel nacional. Ley general del ambiente, de presupuestos mínimos, en cuanto a evaluación de impacto ambiental, principios de prevención y uso racional de los recursos naturales. Régimen de presupuestos mínimos para la gestión y protección de las aguas, en particular los criterios de uso equitativo, racional y sostenible y la protección de las aguas subterráneas. Código Civil y Comercial de la Nación, en lo relativo al dominio público de las aguas subterráneas, al derecho de uso del titular del inmueble y a los límites del dominio en materia de escurrimiento de aguas pluviales entre fundos. Código Alimentario Argentino, en cuanto define los parámetros del agua apta para consumo humano, referencia necesaria para separar por calidad los usos del establecimiento. Régimen de higiene y seguridad en el trabajo, aplicable a la provisión de agua potable al personal y a la señalización de puntos de agua no apta.\n\nNivel provincial (Salta). Código de Aguas de la provincia y su reglamentación: régimen de concesiones y permisos de uso de agua subterránea, obligaciones del concesionario, registro de perforaciones y declaración de caudales. Es la norma central del caso, porque la concesión está en trámite y porque de ella surgen las obligaciones de medición y declaración que el proyecto puede convertir en indicador. Ley provincial de protección del medio ambiente y su procedimiento de evaluación de impacto ambiental y social, bajo la cual se presentó el estudio del emprendimiento. Normativa de la autoridad provincial de recursos hídricos sobre construcción de perforaciones, ensayos de bombeo y vuelco de efluentes a cuerpos receptores. Normativa provincial sobre residuos y efluentes en lo aplicable a la trampa de grasa de cocina y a los barros de filtrado de la piscina. Régimen de habilitación de establecimientos turísticos y hoteleros de la autoridad provincial de turismo, que fija categorización y condiciones de servicio.\n\nNivel municipal (Capital). Código de planeamiento urbano ambiental de la ciudad, del que surgen la zonificación Área Comercial 2, los indicadores FOS, FOT, altura y retiros y las condiciones de la ordenanza de excepción que recategorizó el predio. Ordenanza de edificación y reglamento de instalaciones sanitarias domiciliarias, que rigen la aprobación de la instalación interna y —cuestión decisiva para este proyecto— la admisibilidad de una segunda red de agua no potable, su material, su color, su señalización y la prevención de conexiones cruzadas. Ordenanza de desagües pluviales y de obras de escurrimiento, aplicable al canal perimetral, al cordón cuneta y a los badenes, y al eventual punto de retención. Ordenanza de habilitación comercial y de seguridad contra incendio, esta última relevante porque la reserva contra incendio —electrobomba de 85 m³/h a 8,2 kg/cm², motobomba de igual capacidad y jockey de 5 m³/h— es agua inmovilizada que no puede confundirse con la reserva de servicio.\n\nNormas técnicas de referencia, no obligatorias pero exigibles por contrato o por certificación. Normas IRAM sobre instalaciones sanitarias, materiales de cañería y señalización de fluidos; normas de referencia internacionales sobre sistemas de aprovechamiento de agua de lluvia en edificios, en cuanto a desvío de primeras aguas, filtrado, materiales y separación de redes; y el estándar de la certificación voluntaria de hotelería sustentable en trámite, que el proyecto adopta como marco de metas y de auditoría.\n\nObservación para la corrección: ninguna de las normas relevadas obliga hoy al establecimiento a captar agua de lluvia ni a diferenciar fuentes por calidad de uso. Ese vacío es, precisamente, la causa s17 del árbol, y explica por qué el proyecto debe sostenerse en el ahorro de energía, en la seguridad de abastecimiento y en la certificación voluntaria, y no en una exigencia legal que no existe.", "K": "Las causas se ordenan por nivel y se cubren las cuatro capas que el caso exige —infraestructura, medición y registro, procedimientos y mantenimiento, capacitación y responsabilidad asignada—, no sólo la de obra. Cada causa lleva al final la evidencia que la sostiene; donde no hay evidencia se dice que es hipótesis a verificar.\n\nCausa 1 (s8, técnica, primer nivel) — La instalación sanitaria proyectada resuelve todo el edificio con una sola cisterna de 55.000 L alimentada por el pozo y una única red aguas abajo, dimensionada bajo el criterio de que toda el agua que circula por el establecimiento debe ser potable. Evidencia: memoria de instalación sanitaria y ficha del sistema de agua para uso doméstico, que declaran cisterna única, cuatro bombas presurizadoras de 3,5 HP y 38 m³/h y el criterio de abastecer conforme a la cantidad de habitaciones ocupadas.\n· Causa 1.1 (s11, técnica, segundo nivel) — La demanda de agua no está calculada por sector ni por uso. Evidencia: el estudio inventaría 109 lavabos, 109 inodoros, 109 duchas, los artefactos de 22 baños comunes, 4 lavarropas y 654 luminarias, y no consigna una sola estimación de consumo de agua; la cisterna y el pedido de concesión se dimensionaron sin ese cálculo.\n·· Causa 1.1.A (s12, económica, tercer nivel) — No hay medición desagregada del consumo por sector ni serie histórica que permita saber cuánta agua se usa en cada destino: acometida única para cocina, lavandería, riego y habitaciones, sin macromedición en el pozo, sin submedición y sin registro de horas de bomba. Evidencia: el proyecto de instalaciones no prevé instrumentos de medición; la tabla de consumos de energía del estudio existe como título pero está vacía de datos utilizables.\n··· Causa 1.1.A.1 (s13, económica, cuarto nivel) — El agua no tiene precio por metro cúbico dentro del establecimiento: proviene de pozo propio y no de factura, su costo queda diluido en la factura eléctrica y no se imputa a ningún sector. Evidencia: ficha de la fuente de agua y factibilidad para sistema independiente; no existe factura de agua.\n··· Causa 1.1.A.2 (s14, institucional, cuarto nivel) — Ningún puesto de la estructura de operación tiene asignada la responsabilidad sobre el desempeño hídrico. Evidencia: la documentación describe administración, depósitos y valijero sin atribuir esa función a nadie; hipótesis a confirmar con el organigrama de operación cuando exista.\n···· Causa 1.1.A.1.a (s18, territorial, quinto nivel, fuera del alcance del proyecto) — El predio está fuera del radio servido por la prestadora y la factibilidad se otorgó para un sistema de provisión independiente administrado por el propietario: ningún tercero mide, factura, controla ni fija estándares de uso. Evidencia: factibilidad de la prestadora citada en el estudio.\n· Causa 1.2 (s16, ambiental, segundo nivel, parcialmente fuera del alcance) — El régimen de precipitación es marcadamente estacional —197 mm en enero, 80 % del total anual entre diciembre y marzo, 22,9 mm entre mayo y septiembre—, de modo que aprovechar la lluvia exige almacenar entre estaciones un volumen muy superior a la única reserva prevista, que además está comprometida con la demanda diaria. Evidencia: serie 1991–2020 de la estación de referencia a 5,5 km y memoria de instalación sanitaria.\n· Causa 1.3 (s17, institucional, tercer nivel, fuera del alcance) — El marco al que el proyecto se somete se satisface conduciendo el pluvial fuera del predio y no exige aprovechamiento de agua de lluvia ni diferenciación de fuentes por calidad de uso. Evidencia: relevamiento normativo del ítem J y el propio expediente de visado, uso conforme y estudio de impacto ambiental aprobados con el diseño actual.\n\nCausa 2 (s9, técnica, primer nivel) — Toda la infraestructura pluvial del predio está resuelta con un único objetivo, evacuar el agua fuera del predio en el menor tiempo posible, y no incorpora ningún punto de retención donde el escurrimiento converge. Evidencia: plano de dirección del escurrimiento con cotas de 1.222 a 1.225 m, detalle de calzada con flecha de 7 cm y pendientes de 2 % y 4 %, cordón cuneta de 0,70 m, badenes y canal perimetral que cruza la avenida y descarga en el río 800 m al norte. Sus causas de nivel superior son las mismas 1.2 y 1.3: el desfasaje estacional que encarece almacenar y un marco normativo que premia evacuar.\n\nCausa 3 (s10, técnica, primer nivel) — Los usos que podrían cubrirse con agua no potable se operan sin criterio de reposición ni protocolo escrito: riego automatizado sin frecuencias, horarios ni referencia al balance hídrico, y limpieza de grandes superficies, lavado de blancos y purga y reposición de la piscina de 180 m² sin volumen previsto ni contabilizado. Evidencia: ficha de espacios verdes —riego comandado desde computador eléctrico, sin frecuencias declaradas—, ficha de lavandería y ficha de piscina.\n· Causa 3.1 (s14, institucional, segundo nivel) — La misma causa 1.1.A.2: nadie responde por el desempeño hídrico, de modo que nadie escribe, aplica ni audita esos procedimientos.\n· Causa 3.2 (s15, social, segundo nivel) — El personal de operación no está cuantificado ni tiene previsto un plan de formación, y el proyecto no contempla señalización diferenciada de puntos de agua no potable ni comunicación al huésped, pese a que las habitaciones ya cuentan con tarjeta magnética de energización, es decir con un canal instalado de conducta del usuario. Evidencia: el estudio cuantifica 200 personas en el pico de obra y no cuantifica la dotación de operación; no hay plan de capacitación en la documentación.\n· Causa 3.3 (s13, económica, tercer nivel) — La misma causa 1.1.A.1: sin costo visible por metro cúbico no hay criterio económico con el cual fijar una frecuencia de riego, una carga de lavarropas o una purga de piscina.\n\nControl de coherencia leyendo de derecha a izquierda. ¿La causa 1.1.A.1 —agua sin precio— genera la 1.1.A —ausencia de medición—? Sí: no se mide lo que no se paga. ¿La 1.1.A genera la 1.1 —demanda no calculada—? Sí: sin instrumento ni serie no hay dato con el cual calcular por sector. ¿La 1.1 genera la 1 —una sola red y una sola calidad—? Sí: quien no distingue la demanda por uso no tiene motivo para separar la instalación. ¿La causa 1 produce el problema central? Sí, de manera directa e inmediata: con una sola red, cada litro que llega a un inodoro es potable por construcción.\n\nRecuento por capa, que es la verificación que el propio caso pide: capa 1 infraestructura, causas 1 y 2; capa 2 medición y registro, causas 1.1, 1.1.A y 1.1.A.1; capa 3 procedimientos y mantenimiento, causa 3; capa 4 capacitación y responsabilidad, causas 1.1.A.2 y 3.2. Las causas 1.2, 1.3 y 1.1.A.1.a son condiciones de contexto que el proyecto no modifica y se marcan como tales en el ítem N.", "L": "Los efectos se ordenan de izquierda a derecha, del problema hacia sus consecuencias. Son seis, deliberadamente repartidos entre lo privado y lo que excede el cerco del establecimiento, porque son los efectos —y no las causas— los que justifican por qué vale la pena invertir.\n\nEfecto 1 (s4, económico, directo) — El establecimiento paga de manera permanente el bombeo y la conducción desde el pozo situado a 200 m de un volumen que podría no extraer, y desplaza la operación de la perforación hacia escalones de caudal más altos. Es el efecto que la propia documentación permite cuantificar mejor: al pasar de 5,00 a 13,40 m³/h la eficiencia cae de 68,01 % a 44,33 %, la depresión pasa de 4,56 a 20,51 m —se multiplica por 4,5— y el caudal específico cae de 1,10 a 0,65 m³/h/m. Traducido: cada metro cúbico adicional exige levantar el agua desde más profundidad con menos eficiencia, de modo que el costo energético del metro cúbico marginal crece más rápido que el volumen. Con una demanda media estimada de 58,9 m³/día, el establecimiento opera cerca del primer escalón en promedio pero se corre al segundo y al tercero en los picos de fin de semana con sala de conferencias ocupada, que es cuando el agua sale más cara.\n\nEfecto 2 (s5, ambiental, directo) — El riego de los espacios verdes y el baldeo de las playas y calles internas se cubren íntegramente con agua del pozo durante la estación seca, cinco meses consecutivos que suman 22,9 mm entre mayo y septiembre. La coincidencia es doblemente desfavorable: es el período de menor recarga del acuífero y también aquel en que los demás usuarios del sector riegan y consumen más.\n\nEfecto 3 (s2, ambiental, indirecto, deriva del problema y se agrava por el efecto 2) — Una fracción evitable del volumen extraído se suma a la extracción agregada de las perforaciones en explotación sobre un acuífero de abanico aluvial de vulnerabilidad media, cuyos niveles dinámicos ya generaron una depresión regional que modificó las direcciones de flujo originales, hoy convergentes hacia la ciudad. Este es el efecto que sale del cerco del predio: la externalidad no es el consumo del hotel, sino la porción de ese consumo que no necesitaba ser agua de acuífero.\n\nEfecto 4 (s3, territorial, de segundo orden, deriva de los efectos 3 y 6) — La seguridad de abastecimiento del propio establecimiento y la de los demás usuarios de perforaciones del sector quedan atadas a un mismo recurso en descenso, con el agravante de que el predio se ubica fuera de la zona de conducción del acuífero, en las proximidades del límite norte de los niveles productivos. Si el rendimiento del pozo cayera, se comprometería la totalidad de los servicios del hotel: no hay fuente alternativa, porque el predio está fuera del radio servido por la prestadora.\n\nEfecto 5 (s6, institucional, directo) — El pedido de concesión de agua subterránea en trámite se sostiene sobre una demanda mayor que la estrictamente necesaria y sin cálculo de consumo que la respalde, con riesgo de que el caudal autorizado resulte menor que el consumo efectivo. Un caudal concesionado corto obligaría después a limitar servicios, a pedir ampliación o a operar en infracción.\n\nEfecto 6 (s7, social, directo) — El desempeño hídrico del establecimiento no puede acreditarse ante la certificación voluntaria de hotelería sustentable que tramita, ni ante huéspedes, operadores turísticos y organizadores de eventos que la consideran al elegir, porque en el capítulo del agua no hay ni medición propia ni sustitución de fuente que exhibir. En un mercado donde la certificación es un argumento de venta, la ausencia de dato es una desventaja competitiva.\n\nQué efecto no se declara y por qué. No se declara ningún efecto de anegamiento, inundación o sobrecarga del canal: el estudio consigna expresamente que el canal de desagüe existente no presenta problemáticas de manejo, y un efecto que la propia fuente desmiente debilita todo el árbol. Tampoco se declara mayor carga sobre el nexo cloacal compartido con el proyecto de 1.292 lotes como efecto de este problema: sustituir la fuente de la descarga de inodoros no cambia el volumen de efluente, de modo que ese dato es contexto —y una razón adicional para medir— pero no consecuencia del problema central.", "M": "Lectura encadenada del árbol, de abajo hacia arriba. El diagrama del ítem M no agrega ni quita ninguna tarjeta respecto de los ítems K y L: son dieciocho, una central, once causas y seis efectos.\n\nRaíces. El predio está fuera del radio servido por la prestadora y su abastecimiento es un sistema independiente administrado por el propietario, lo que provoca que ningún tercero mida, facture ni fije estándares sobre el agua consumida, lo que provoca que el agua no tenga precio por metro cúbico dentro del establecimiento y que su costo quede diluido en la factura eléctrica, lo que provoca —junto con la ausencia de un puesto responsable del desempeño hídrico— que no se prevea medición desagregada por sector ni serie que permita saber cuánta agua se usa en cada dest
