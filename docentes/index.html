res habilitados mantienen disponibilidad y capacidad para la fracción no tratable. · Actividad · Resumen narrativo: proyecto de tratamiento biológico in situ del material acopiado y cierre y restitución del sector de piletas de contingencia de la Batería Puesto Guardián. Indicador: 4 etapas ejecutadas —caracterización y acuerdo de estándar, segregación y tratamiento, disposición de la fracción no tratable, cierre y restitución— con 100 % de avance certificado, a los 24 meses de iniciado el proyecto. Medio de verificación: certificados de avance de obra y servicios y libro ambiental del proyecto, disponibles en el legajo del área y ante la autoridad. Supuesto: se mantienen vigentes la autorización provincial del sector de tratamiento de residuos peligrosos dentro de la batería y el acceso al predio otorgado por el propietario. · Ningún supuesto declara como externo algo que el proyecto controla: la contratación de laboratorios, el diseño de las biopilas y la ejecución del cierre son tareas planificadas, no supuestos.", "U": "Lógica vertical, leída de abajo hacia arriba: si se ejecuta el proyecto de tratamiento biológico in situ y cierre —caracterizando primero el material y el suelo y acordando el estándar con la autoridad—, entonces se obtienen las componentes: el sector caracterizado con estándar acordado, el material hidrocarburado tratado y la fracción salina dispuesta en operador habilitado, las dos estructuras cerradas y el sector restituido, y el acuerdo de uso futuro suscripto. Si esas componentes se obtienen y se cumple el supuesto de que la ventana climática permite sostener el tratamiento biológico y hay operador disponible para la fracción no tratable, entonces se alcanza el propósito: piletas sin material acopiado, cerradas y restituidas conforme al estándar, con el sector reincorporado al uso productivo. Si el propósito se alcanza y la autoridad mantiene estable el estándar acordado, entonces se logra el fin: superficie habilitada para uso agropecuario sin restricción, riesgo sobre el agua subterránea eliminado y pasivo dado de baja. · Lógica horizontal, fila por fila: en el fin, el acta de cierre y el relevamiento predial son necesarios y suficientes para verificar la superficie habilitada, porque el acta es el único documento que levanta la restricción y el relevamiento mide la superficie efectivamente incorporada. En el propósito, el informe final con analíticas de laboratorio acreditado permite calcular tanto la remoción del material como el cumplimiento de los parámetros de suelo; su suficiencia depende de que el estándar de cierre haya quedado escrito con parámetros y valores concretos, lo que es precisamente la primera componente. En las componentes, el registro de tratamiento, los manifiestos y los certificados de disposición final documentan íntegramente el flujo del material y permiten cerrar el balance de masa entre lo caracterizado y lo tratado o dispuesto. En la actividad, los certificados de avance y el libro ambiental son la fuente habitual de este tipo de obra y ya existen en la operación, de modo que no hay que construir un sistema de información nuevo. · Lógica zigzag: cada nivel más los supuestos del nivel inferior alcanza el nivel superior, y la cadena se verificó en los cuatro escalones. · Supuesto más frágil: que la autoridad apruebe el estándar de cierre y lo mantenga estable durante la ejecución. Es el más frágil por tres razones: el criterio de sitio remediado no está definido hoy, la autorización vigente del sector de tratamiento regula la operación pero no la finalización, y un cambio de criterio en mitad del proyecto —por ejemplo, exigir valores compatibles con uso agrícola irrestricto en lugar de uso agropecuario con condiciones— modifica el volumen a tratar, el plazo y el costo, y puede invalidar la alternativa seleccionada frente a la disposición externa total. La medida de mitigación es acordar el estándar por escrito como primera componente, antes de movilizar equipos, y no como resultado a negociar durante la ejecución.", "V": "Proyecto de tratamiento biológico in situ del material hidrocarburado y cierre y restitución del sector de piletas de contingencia de la Batería Puesto Guardián, departamento Orán, para su reincorporación al uso agropecuario. · Qué se hace: tratamiento biológico in situ del material acopiado y cierre y restitución de las estructuras. · Para qué: reincorporar el sector al uso agropecuario y dar de baja el pasivo. · Dónde: sector de piletas de la Batería Puesto Guardián, área Puesto Guardián, departamento Orán, Salta. · El nombre es representativo de la alternativa seleccionada en el ítem R, es distinto del nombre de fantasía del equipo del ítem A y no repite el enunciado del problema; acompañará al equipo en los formularios F02, F03 y F04. Si en el F02 la caracterización mostrara que la fracción tratable biológicamente es minoritaria, el nombre debe revisarse junto con la alternativa: el nombre sigue a la decisión técnica y no al revés."}, "eap": {"fin": "Sector de piletas de la Batería Puesto Guardián restituido y disponible para el uso agropecuario acordado, con el riesgo de afectación del suelo profundo y del agua subterránea eliminado y el pasivo dado de baja ante la autoridad de aplicación.", "prop": "Las dos piletas de contingencia de la Batería Puesto Guardián, departamento Orán, se encuentran sin material acopiado, cerradas y restituidas conforme al estándar acordado con la autoridad, y el sector que ocupan está reincorporado al uso productivo del establecimiento.", "comp": "1) Sector de piletas caracterizado y estándar de cierre acordado con la autoridad. 2) Material hidrocarburado tratado hasta el estándar acordado y fracción salina no tratable dispuesta en operador habilitado. 3) Estructuras cerradas y sector restituido morfológica y edáficamente. 4) Acuerdo de uso futuro suscripto con el propietario y antecedentes del sitio sistematizados y disponibles.", "act": "Proyecto de tratamiento biológico in situ del material acopiado y cierre y restitución del sector de piletas de contingencia de la Batería Puesto Guardián, en cuatro etapas: caracterización y acuerdo de estándar; segregación y tratamiento biológico en el sector autorizado de residuos peligrosos; transporte y disposición de la fracción no tratable en operador habilitado; cierre de las estructuras y restitución morfológica y edáfica del sector."}, "mml": {"fin": ["Contribuir a la recuperación de la aptitud productiva del suelo y a la eliminación del riesgo sobre el agua subterránea en el sector de piletas de la Batería Puesto Guardián, con el pasivo dado de baja ante la autoridad de aplicación.", "Al menos 4.000 m² del sector de piletas habilitados para uso agropecuario sin restricción, en la Batería Puesto Guardián, departamento Orán, a los 12 meses de emitida el acta de cierre.", "Acta de cierre emitida por la autoridad ambiental provincial y relevamiento predial de superficie en producción, archivados en el legajo ambiental del área y disponibles ante la autoridad.", "El propietario del establecimiento sostiene el uso agropecuario previsto para el sector y no se producen nuevas contingencias hidrocarburíferas en la batería que vuelvan a afectarlo."], "prop": ["Las dos piletas de contingencia de la Batería Puesto Guardián se encuentran sin material acopiado, cerradas y restituidas conforme al estándar acordado con la autoridad, y el sector que ocupan está reincorporado al uso productivo del establecimiento.", "100 % del material acopiado retirado de las dos piletas y 0 estructuras fuera de servicio en el sector, con los parámetros de hidrocarburos totales y de conductividad eléctrica del suelo dentro de los valores del estándar de cierre acordado, en la Batería Puesto Guardián, a los 24 meses de iniciado el proyecto.", "Informe final de remediación con analíticas de laboratorio acreditado y relevamiento topográfico final, aprobado por la autoridad ambiental provincial y archivado en el legajo ambiental del área.", "La autoridad de aplicación aprueba el estándar de cierre acordado en la primera etapa y lo mantiene estable durante toda la ejecución del proyecto."], "comp": ["Sector caracterizado y estándar de cierre acordado; material hidrocarburado tratado y fracción salina no tratable dispuesta en operador habilitado; dos estructuras cerradas y sector restituido morfológica y edáficamente; acuerdo de uso futuro suscripto y antecedentes del sitio sistematizados.", "100 % del volumen caracterizado en la etapa inicial tratado o dispuesto con verificación analítica, y 2 estructuras cerradas y restituidas, en el sector de piletas de la Batería Puesto Guardián, a los 18 meses de iniciado el proyecto.", "Registro de operación del sector autorizado de tratamiento de residuos peligrosos, manifiestos de transporte y certificados de disposición final del operador habilitado, informes de caracterización de laboratorio acreditado y acta de conformidad del propietario sobre el uso futuro del sector.", "El régimen de precipitaciones del período permite sostener la actividad biológica sin anegamientos prolongados del sector, y los operadores habilitados de transporte y disposición mantienen disponibilidad y capacidad para recibir la fracción no tratable."], "act": ["Proyecto de tratamiento biológico in situ del material acopiado y cierre y restitución del sector de piletas de contingencia de la Batería Puesto Guardián, ejecutado en cuatro etapas: caracterización y acuerdo de estándar, segregación y tratamiento, disposición de la fracción no tratable, y cierre y restitución.", "4 etapas ejecutadas con 100 % de avance certificado, en el sector de piletas de la Batería Puesto Guardián, a los 24 meses de iniciado el proyecto.", "Certificados de avance de obra y de servicios, libro ambiental del proyecto y actas de inspección de la autoridad, disponibles en el legajo del área.", "Se mantienen vigentes la autorización provincial del sector de tratamiento de residuos peligrosos dentro de la batería y el acceso al predio otorgado por el propietario del establecimiento."]}, "alt": [{"id": "A", "med": "Criterio de cierre acordado con la autoridad, con parámetros de verificación y uso posterior definidos (medio 2), y monitoreos que cubren el perfil de suelo y el acuífero (medio 1.1).", "act": "Programa de caracterización ambiental del sector de piletas —volumen y tipificación del material por pileta, perfil de suelo bajo la pileta no impermeabilizada y calidad del acuífero somero— y acuerdo del estándar de sitio remediado con la autoridad de aplicación.", "ven": "Costo bajo respecto de cualquier alternativa de tratamiento, plazo corto, y es la única que habilita técnicamente a las demás: sin volumen ni caracterización, ninguna alternativa puede dimensionarse ni costearse. Deja establecido el criterio de finalización que hoy no existe.", "des": "Por sí sola no remueve un solo metro cúbico de material ni cierra ninguna estructura: el pasivo y todos los efectos del árbol permanecen. No puede constituir el proyecto, sino su primera etapa."}, {"id": "B", "med": "Material acopiado con volumen determinado, caracterización y destino de tratamiento definido (medio 1), y estructuras cerradas y sector restituido.", "act": "Tratamiento biológico in situ del material hidrocarburado mediante biopilas o landfarming en el sector de tratamiento de residuos peligrosos ya autorizado dentro de la batería, con segregación y disposición externa de la fracción salina no tratable, seguido del cierre de ambas estructuras y la restitución morfológica y edáfica del sector.", "ven": "Aprovecha una capacidad ya autorizada dentro del predio, lo que reduce costo y tiempo de gestión; minimiza el transporte de residuos peligrosos por caminos rurales y el riesgo asociado; deja el sector sin restricción de uso, que es la condición para la ampliación agropecuaria pretendida; y trata el material en lugar de trasladar el pasivo a un tercero.", "des": "Requiere plazos largos y condiciones climáticas favorables; la fracción salina no se degrada biológicamente y obliga igual a una disposición externa parcial; exige control analítico sostenido y puede generar resistencia en los vecinos por tratarse material dentro del predio."}, {"id": "C", "med": "Material acopiado con destino definido (medio 1) y estructuras cerradas y sector restituido.", "act": "Retiro y disposición externa de la totalidad del material de ambas piletas en operador habilitado, con relleno, restitución morfológica y revegetación del sector.", "ven": "Plazo corto y resultado verificable con manifiestos y certificados; libera el sector rápidamente y no depende de condiciones climáticas ni de la eficiencia de un proceso biológico.", "des": "Costo significativamente mayor; transfiere el pasivo a un tercero y a otro territorio en lugar de tratarlo; genera un tránsito intenso de camiones con residuos peligrosos por caminos rurales del departamento; y desaprovecha la autorización de tratamiento ya obtenida dentro de la batería."}, {"id": "D", "med": "Estructuras cerradas (medio 1.2, material confinado sin contacto con el suelo natural).", "act": "Confinamiento in situ del material mediante encapsulado con barrera basal y cobertura impermeable, con restricción registral de uso sobre el sector y monitoreo posterior de largo plazo.", "ven": "Es la alternativa de menor costo inicial y menor plazo, y elimina el contacto directo del material con el ambiente sin movilizarlo.", "des": "El pasivo permanece físicamente en el sitio y exige control y monitoreo por tiempo indefinido; deja una restricción de uso sobre el sector que es incompatible con la ampliación agropecuaria pretendida por el propietario; y no responde a la exigencia de restauración en su sentido pleno, por lo que difícilmente obtenga acta de cierre sin condicionamientos."}, {"id": "E", "med": "Destino futuro del sector definido y consensuado (medio 3) e información del sitio sistematizada y disponible (medio 3.2).", "act": "Acuerdo de compatibilidad de usos y zonificación interna del establecimiento entre la empresa operadora y el propietario, con expediente público de antecedentes del sitio accesible a la población vecina.", "ven": "Costo muy bajo, resuelve la causa territorial y social del árbol y define el uso posterior que determina el nivel de remediación exigible; mejora la licencia social de cualquier intervención.", "des": "No actúa sobre el material acopiado ni sobre las estructuras, de modo que el problema central persiste íntegro. Es condición de coherencia del proyecto, no un proyecto en sí."}], "altSel": "B", "altJus": "Se selecciona la alternativa B, incorporando la A como primera etapa condicionante y la E como componente de acuerdo y comunicación. Los criterios de comparación aplicados fueron cinco: compatibilidad con el uso futuro pretendido, costo total, plazo, riesgo transferido a terceros y aprovechamiento de las capacidades ya autorizadas en el sitio. Por compatibilidad con el uso futuro, la D queda descartada de entrada: un encapsulado con restricción registral es incompatible con la ampliación de la superficie agrícola que el propietario pretende, que es el fin del árbol de objetivos, y además deja un pasivo bajo control perpetuo. Entre B y C la diferencia decisiva no es el plazo —donde C es superior— sino el costo y el destino del pasivo: C transfiere el material a otro territorio y multiplica el tránsito de residuos peligrosos por caminos rurales, mientras que B trata la fracción hidrocarburada dentro de un sector que la provincia ya autorizó para eso, lo que reduce costo de gestión, riesgo de transporte y tiempo de tramitación. B no es una alternativa pura: reconoce que el agua de formación de alto contenido salino no se degrada biológicamente y prevé disposición externa de esa fracción, de modo que incorpora lo mejor de C donde C es imprescindible. Las alternativas A y E no compiten con B como proyecto, porque ninguna de las dos remueve material ni cierra estructuras; se integran como etapa inicial y como componente. La selección queda condicionada a un resultado de la etapa A: si la caracterización mostrara que la fracción tratable biológicamente es minoritaria frente a la fracción salina, o que el suelo bajo la pileta no impermeabilizada está afectado a profundidades que el tratamiento in situ no alcanza, corresponde volver sobre esta comparación y reevaluar C. Ese condicionamiento se declara expresamente y no se disimula: es el modo honesto de decidir con la información que hoy existe.", "corr": ["Que el problema central sea el descontrol del pozo MdT 14 de 2007 o \"el derrame de petróleo\". Es el error más caro de este escenario: el incidente fue controlado y el sector saneado, de modo que es un hecho del pasado y entra al árbol como causa remota, nunca como problema central. Si el tronco es el accidente, todo el árbol queda mal orientado y las alternativas apuntan a una emergencia que ya terminó.", "Que el problema esté enunciado como \"falta de una planta de tratamiento de suelos\", \"falta de un plan de cierre\" o \"ausencia de remediación\". Además de ser una solución disfrazada de problema, en este caso es prematuro: nadie sabe todavía qué volumen ni qué tipo de material hay que tratar, y el enunciado ya condicionaría el análisis de alternativas.", "Que aparezcan cifras de concentración de hidrocarburos totales, de conductividad eléctrica, de volumen acopiado, de profundidad de napa o de costos con apariencia de dato oficial. El escenario sólo aporta dimensiones geométricas (50 × 30 m con 1,5 a 2,5 m de profundidad, y 50 × 50 × 3,5 m) y la existencia de antecedentes de monitoreo. Todo otro número debe estar declarado como supuesto a verificar en el F02.", "Que el árbol tenga sólo causas técnicas —volumen, tipo de tratamiento, tecnología— y ninguna institucional, territorial, económica o social. Las tres raíces que el caso exige son la habilitación de urgencia de 2007 sin plan de cierre, la ausencia de un criterio de cierre acordado con la autoridad, y la superposición de uso extractivo y agropecuario sobre el mismo predio sin regla de compatibilidad. Un árbol que no las contenga está incompleto.", "Que el alcance se dilate del sector de piletas a \"los pasivos hidrocarburíferos del departamento Orán\" o a \"la contaminación del norte salteño\" al pasar del problema al objetivo central. La meta debe conservar el mismo sujeto, la misma variable y el mismo lugar que el problema.", "Que se declare como supuesto de la MML algo que el proyecto controla —contratar el laboratorio, diseñar las biopilas, ejecutar el cierre— y que en cambio no aparezca el supuesto realmente crítico: que la autoridad apruebe el estándar de cierre y lo mantenga estable. También revisar que la alternativa elegida sea compatible con el uso futuro declarado: si el equipo elige encapsulado con restricción de uso y a la vez sostiene que el propietario ampliará la superficie agrícola, la contradicción invalida la coherencia entre el ítem R y el árbol de objetivos."]}, "3": {"n": 3, "pc": "La restauración proyectada sobre el predio fiscal de unas 800 hectáreas del borde este de la ciudad de Salta y, en menor volumen, las campañas de forestación urbana del área metropolitana no logran abastecerse de plantines de especies nativas de procedencia local en las especies, las cantidades, la calidad y las fechas que sus plantaciones requieren.", "pcjus": "El escenario describe una demanda existente y verificable —una restauración proyectada sobre unas 800 hectáreas que necesita material vegetal nativo de procedencia local en cantidades del orden de decenas de miles de ejemplares y con calendario atado a la temporada de lluvias, más una demanda urbana continua de bajo volumen— frente a la cual el abastecimiento no se produce en las especies, cantidades, calidad ni fechas requeridas: la situación negativa existente está del lado de la demanda que no se abastece, y por eso el problema se formula sobre los programas y campañas afectados y no sobre la oferta. Se descartó «falta un vivero de especies nativas», que es la formulación que aparece primero, porque enuncia como problema la alternativa que alguien ya eligió: si se la adopta, el ítem R queda resuelto de antemano y desaparecen del análisis la reconversión de capacidad ociosa, la red comunitaria, la contratación plurianual y la compra extrarregional. Se descartó «los viveros no producen nativas» porque le atribuye a un actor una conducta que el propio árbol explica como respuesta racional a la falta de compromiso de compra: es causa de primer nivel, no problema central. Se descartó «alta mortandad de plantines», que es un efecto de segundo nivel y además carece de lugar y plazo de medición, y se descartó «no hay información sobre la demanda de plantines», que es la raíz informativa del árbol y no la situación que se quiere revertir. Finalmente se evitó desplazar el problema hacia el predio de destino —«el bosque nativo del borde este se degrada»—, porque ése es el problema del proyecto de restauración, del que este equipo es proveedor y no ejecutor.", "objc": "La restauración proyectada sobre el predio fiscal de unas 800 hectáreas del borde este de la ciudad de Salta y las campañas de forestación urbana del área metropolitana se abastecen de plantines de especies nativas de procedencia local en las especies, las cantidades, la calidad y las fechas que sus plantaciones requieren.", "sit": [{"id": "s1", "t": "La restauración proyectada sobre el predio fiscal de unas 800 hectáreas del borde este de la ciudad de Salta y, en menor volumen, las campañas de forestación urbana del área metropolitana no logran abastecerse de plantines de especies nativas de procedencia local en las especies, las cantidades, la calidad y las fechas que sus plantaciones requieren.", "k": "p", "d": "ter"}, {"id": "s2", "t": "Las plantaciones se ejecutan con el material vegetal que esté disponible en el momento de plantar —ornamentales exóticas, o nativas de especie inadecuada al sitio y de procedencia desconocida— en lugar del que el sitio de destino requiere.", "k": "e", "d": "amb"}, {"id": "s3", "t": "Baja supervivencia de los plantines nativos plantados en las laderas y los sectores de uso público del predio fiscal del borde este y en los espacios públicos de la ciudad, medida a los doce meses de la plantación.", "k": "e", "d": "amb"}, {"id": "s4", "t": "Las tareas de enriquecimiento del bosque nativo y de estabilización de laderas se posponen o se ejecutan de manera parcial, y las pendientes superiores al 30 % de la mitad alta del predio siguen expuestas a erosión sobre suelos erosionables.", "k": "e", "d": "ter"}, {"id": "s5", "t": "Se pierde la inversión pública y comunitaria comprometida en cada campaña de plantación —traslado, apertura de hoyos, jornales, tutores y protección— y se debilita el respaldo presupuestario de las campañas siguientes.", "k": "e", "d": "eco"}, {"id": "s6", "t": "Las especies leñosas nativas de multiplicación más exigente, entre ellas las dos con categoría de conservación desfavorable inventariadas en el predio, quedan fuera de las plantaciones porque no se producen ni se ofrecen comercialmente.", "k": "e", "d": "amb"}, {"id": "s7", "t": "Las instituciones educativas, las organizaciones sociales y los vecinos que participan de las plantaciones pierden continuidad y confianza en las convocatorias, al ver morir lo que plantaron en campañas anteriores.", "k": "e", "d": "soc"}, {"id": "s8", "t": "La demanda de plantines nativos no está dimensionada por especie ni por año: ni el programa de restauración ni las campañas urbanas cuentan con un cálculo de cuántos ejemplares de cada especie necesitan, para qué sector y en qué fecha.", "k": "c", "d": "ins"}, {"id": "s9", "t": "Ningún comprador se obliga a adquirir plantines antes de la siembra, de modo que ningún productor asume los uno a dos años de producción y el riesgo de escala que exige un pedido de decenas de miles de ejemplares.", "k": "c", "d": "eco"}, {"id": "s10", "t": "La producción de los viveros de la región está orientada a ornamentales exóticas y la oferta de nativas es variable, de bajo volumen y no está programada contra ningún calendario de plantación.", "k": "c", "d": "eco"}, {"id": "s11", "t": "El ciclo de producción del plantín nativo —de uno a dos años de vivero más rustificación— es más largo que el horizonte con que se deciden y se financian las plantaciones, y no existe ninguna decisión anticipada de producción que cubra ese desfase.", "k": "c", "d": "tec"}, {"id": "s12", "t": "No hay protocolos escritos de producción por especie —colecta, tratamiento de semilla, sustrato, tiempos de vivero, rustificación y tamaño de entrega— ni criterios verificables de recepción del plantín en el sitio de plantación.", "k": "c", "d": "tec"}, {"id": "s13", "t": "La procedencia local de la semilla no tiene circuito: no hay rodales semilleros identificados en el bosque del sector, ni calendario de colecta, ni registro que vincule cada lote de plantines con su origen.", "k": "c", "d": "amb"}, {"id": "s14", "t": "La capacidad instalada de vivero de la región, su nivel de uso y la fracción de esa capacidad que podría reconvertirse a la producción de nativas no están relevadas.", "k": "c", "d": "tec"}, {"id": "s15", "t": "Los instrumentos disponibles —convenios interinstitucionales, compra pública, contratos plurianuales de provisión y los programas de bosques nativos y de arbolado urbano— no se aplican a comprometer material vegetal nativo con más de un ejercicio de anticipación.", "k": "c", "d": "ins"}, {"id": "s16", "t": "El presupuesto de las campañas y de los programas se decide y se ejecuta por ejercicio anual, y ninguna repartición se obliga por una entrega que se concreta dos temporadas después.", "k": "c", "d": "eco"}, {"id": "s17", "t": "Las capacidades de producción de nativas —colecta, tratamiento de semilla, propagación y manejo de vivero— están concentradas en pocas personas y no hay formación sistemática ni organización de los viveros comunitarios e institucionales de los barrios linderos y las escuelas.", "k": "c", "d": "soc"}, {"id": "s18", "t": "Los viveros con alguna oferta de nativas están dispersos y alejados de los sitios de plantación, sin logística de traslado ni puntos de acopio intermedios previstos para concentrar entregas dentro de la ventana de lluvias.", "k": "c", "d": "ter"}], "lnk": [{"a": "s1", "b": "s2"}, {"a": "s1", "b": "s4"}, {"a": "s2", "b": "s3"}, {"a": "s2", "b": "s6"}, {"a": "s3", "b": "s4"}, {"a": "s3", "b": "s5"}, {"a": "s3", "b": "s7"}, {"a": "s5", "b": "s7"}, {"a": "s10", "b": "s1"}, {"a": "s11", "b": "s1"}, {"a": "s12", "b": "s1"}, {"a": "s13", "b": "s1"}, {"a": "s18", "b": "s1"}, {"a": "s9", "b": "s10"}, {"a": "s17", "b": "s10"}, {"a": "s8", "b": "s9"}, {"a": "s14", "b": "s9"}, {"a": "s15", "b": "s9"}, {"a": "s16", "b": "s15"}, {"a": "s16", "b": "s11"}, {"a": "s8", "b": "s11"}, {"a": "s17", "b": "s12"}, {"a": "s17", "b": "s13"}, {"a": "s14", "b": "s18"}], "obj": {"s1": "La restauración proyectada sobre el predio fiscal de unas 800 hectáreas del borde este de la ciudad de Salta y las campañas de forestación urbana del área metropolitana se abastecen de plantines de especies nativas de procedencia local en las especies, las cantidades, la calidad y las fechas que sus plantaciones requieren.", "s2": "Las plantaciones se ejecutan con el material vegetal que el sitio de destino requiere: especie adecuada al sitio, procedencia local acreditada y tamaño de entrega definido.", "s3": "Alta supervivencia de los plantines nativos plantados en las laderas y los sectores de uso público del predio fiscal del borde este y en los espacios públicos de la ciudad, medida a los doce meses de la plantación.", "s4": "Las tareas de enriquecimiento del bosque nativo y de estabilización de laderas se ejecutan en los plazos previstos y las pendientes superiores al 30 % de la mitad alta del predio reducen su exposición a la erosión.", "s5": "La inversión pública y comunitaria comprometida en cada campaña de plantación se aprovecha en cobertura efectivamente establecida y sostiene el respaldo presupuestario de las campañas siguientes.", "s6": "Las especies leñosas nativas de multiplicación más exigente, entre ellas las dos con categoría de conservación desfavorable inventariadas en el predio, se incorporan a las plantaciones porque se producen y se ofrecen de manera regular.", "s7": "Las instituciones educativas, las organizaciones sociales y los vecinos sostienen su participación en las plantaciones y confían en las convocatorias, porque ven prosperar lo que plantaron.", "s8": "La demanda de plantines nativos está dimensionada por especie y por año, con la cantidad de ejemplares de cada especie, el sector de destino y la fecha de entrega definidos para el programa de restauración y para las campañas urbanas.", "s9": "Un comprador se obliga a adquirir plantines antes de la siembra, de modo que el productor puede asumir los uno a dos años de producción y la escala que exige un pedido de decenas de miles de ejemplares.", "s10": "Los viveros de la región destinan parte de su producción a especies nativas, con volumen sostenido y programado contra el calendario de plantación.", "s11": "Existe una decisión anticipada de producción que cubre el desfase entre el ciclo de uno a dos años de vivero y el horizonte con que se deciden y se financian las plantaciones.", "s12": "Hay protocolos escritos de producción por especie —colecta, tratamiento de semilla, sustrato, tiempos de vivero, rustificación y tamaño de entrega— y criterios verificables de recepción del plantín en el sitio de plantación.", "s13": "La procedencia local de la semilla tiene circuito: rodales semilleros identificados en el bosque del sector, calendario de colecta y registro que vincula cada lote de plantines con su origen.", "s14": "La capacidad instalada de vivero de la región, su nivel de uso y la fracción reconvertible a la producción de nativas están relevadas y actualizadas.", "s15": "Los instrumentos disponibles —convenios interinstitucionales, compra pública, contratos plurianuales de provisión y los programas de bosques nativos y de arbolado urbano— se aplican a comprometer material vegetal nativo con más de un ejercicio de anticipación.", "s16": "El presupuesto de las campañas y de los programas admite compromisos que exceden el ejercicio anual, de modo que una repartición puede obligarse por una entrega que se concreta dos temporadas después.", "s17": "Las capacidades de producción de nativas están difundidas mediante formación sistemática y los viveros comunitarios e institucionales de los barrios linderos y las escuelas están organizados para producir.", "s18": "Los viveros proveedores cuentan con logística de traslado y puntos de acopio intermedios que permiten concentrar las entregas en los sitios de plantación dentro de la ventana de lluvias."}, "f01": {"A": "Propuesta de ejemplo: «Semilla Norte S.H.». El nombre toma la unidad con la que trabaja el proyecto —la semilla de procedencia local, de la que depende todo lo que viene después— y la región de actuación; es corto, pronunciable, admite uso comercial posterior y se elige como si se estuviera iniciando una actividad económica real, según el criterio de la Guía. Se declara sociedad de hecho, sin definir todavía tipo societario, con coordinación general rotativa y removible por mayoría.\nEs un ejemplo de respuesta válida y no la única: también cumplen la consigna «Raíz Local», «Monte y Ciudad» o una sigla del equipo, siempre que sean breves, se vinculen al ámbito de restauración ecológica y no describan el proyecto.\nControl de corrección: el nombre del equipo no es el nombre del proyecto de inversión, que recién se define en el ítem V. Si el equipo escribe acá «Proyecto de producción de plantines nativos», confundió los dos ítems.", "B": "Estructura de roles esperable para una entrega de este escenario, con cinco integrantes y sin nombres reales (se usan «Integrante 1» a «Integrante 5»); la tabla del formulario lleva apellido y nombre, función, perfil y horas efectivamente trabajadas.\n· Integrante 1 · Coordinación general · Ordena el calendario de trabajo, consolida el formulario, controla la coherencia entre árbol, EAP y MML, y comunica a la cátedra los cambios de coordinación · 22 h.\n· Integrante 2 · Relevamiento de la demanda · Entrevistas y pedidos de información al organismo que conduce el programa de restauración del predio fiscal y a las áreas municipales de espacios verdes y arbolado urbano, para reconstruir cuántos plantines y de qué especies se necesitarían · 20 h.\n· Integrante 3 · Relevamiento de la oferta · Contacto con viveros de la región, con viveros institucionales y comunitarios y con organismos técnicos, para estimar capacidad instalada, especies producidas y disposición a reconvertir · 20 h.\n· Integrante 4 · Marco normativo e instrumentos · Bosques nativos, arbolado urbano, semillas y trazabilidad, y régimen de contrataciones y compromisos plurianuales · 16 h.\n· Integrante 5 · Redacción, cartografía y paratextos · Edición del informe, esquema del árbol y del árbol de objetivos, ubicación del predio de destino y de los viveros relevados · 18 h.\nMetodología acordada: dos reuniones semanales, una presencial y una virtual, con repositorio compartido de documentos y un canal de mensajería para consultas. Total declarado: 96 h de trabajo efectivo, sin tiempos muertos. Se incluye únicamente a quien aportó a esta entrega.", "C": "Ámbito de actuación declarado: restauración ecológica y producción de servicios ecosistémicos, tal como lo propone el escenario. Las categorías de la Guía no son mutuamente excluyentes y este proyecto queda representado en más de una, de modo que se declaran ambas y se explicita el énfasis.\n· Restauración ecológica: la razón de ser del proyecto es que una restauración concreta —el enriquecimiento del bosque nativo, la estabilización de laderas y la forestación de los sectores de uso público del predio fiscal del borde este— pueda ejecutarse. El proyecto no restaura: hace posible la restauración de otro, y esa es su ubicación exacta dentro del ámbito.\n· Producción de servicios ecosistémicos: la cobertura nativa que se establezca aporta regulación del escurrimiento en una cabecera de cuenca de suelos erosionables, sombra y confort térmico en los sectores de uso público y hábitat para la fauna del remanente.\n· Se declara además, en segundo plano, producción de recursos naturales renovables, porque el bien que el proyecto pone a disposición es material vegetal producido con semilla de procedencia local.\nEste ítem se revisó después de escribir el D, como recomienda la Guía: recién con el problema central formulado desde la demanda quedó claro que el ámbito dominante es la restauración y no la producción.", "D": "Problema: la restauración proyectada sobre el predio fiscal de unas 800 hectáreas del borde este de la ciudad de Salta y, en menor volumen, las campañas de forestación urbana del área metropolitana no logran abastecerse de plantines de especies nativas de procedencia local en las especies, las cantidades, la calidad y las fechas que sus plantaciones requieren.\nIdentidad: los afectados son los programas y campañas que necesitan material vegetal nativo: la restauración del predio, demandante principal, y las campañas urbanas, de volumen menor y continuo. Ubicación: borde este de Salta y área metropolitana. Tiempo: situación presente, que se agrava al acercarse la plantación. Mensurabilidad: proporción de los plantines requeridos por el plan anual entregados en la especie, procedencia, tamaño y ventana especificados. Magnitud: el escenario no la aporta y advierte que no hay información de demanda por especie ni de capacidad de vivero; la línea de base se asume en el ítem E.\nNo está escrito como «falta de…»: no afirma que falte un vivero, sino que una demanda existente no se abastece.", "E": "Indicador principal (propósito): porcentaje de los plantines requeridos por el plan anual de plantación que se entregan conformes —especie prevista para el sector, procedencia local acreditada, tamaño y estado de rustificación pactados y entrega dentro de la ventana de plantación—, en el predio fiscal del borde este y en las campañas urbanas adheridas, por temporada. Medio de verificación: acta de recepción por lote firmada en el sitio de entrega, consolidada en el registro de entregas de la unidad técnica del proyecto; hoy ese registro no existe y el proyecto lo crea.\nValor en situación sin proyecto: no se dispone del dato y el escenario declara expresamente que no existe información sobre volumen de demanda por especie ni sobre capacidad instalada de vivero. Se adopta el supuesto 1: la entrega conforme y programada es hoy nula, porque no hay plan anual de plantación contra el cual medirla ni pedido formulado por especie; lo que existe es compra oportunista de lo que haya en góndola. Valor asumido: 0 % de entrega programada conforme (a verificar en el F02).\nIndicadores complementarios, con su valor sin proyecto asumido y declarado:\n· Cobertura de especies: de las 32 especies leñosas nativas inventariadas en el predio, se asume que menos de un tercio tiene oferta comercial regular en los viveros de la región, y que las dos con categoría de conservación desfavorable no tienen oferta (supuesto 2, a verificar en el F02 mediante el relevamiento de viveros).\n· Supervivencia: porcentaje de plantines nativos vivos a los doce meses de plantados en las laderas y los sectores de uso público del predio y en los espacios públicos de la ciudad, según relevamiento anual con parcelas fijas de control. Sin línea de base disponible: se asume un valor bajo, del orden del que registran las campañas urbanas de la región, y se lo declara supuesto 3 (a verificar en el F02).\n· Anticipación: meses de anticipación entre el pedido formal de plantines y la fecha de plantación, frente a los doce a veinticuatro meses que exige el ciclo de vivero. Valor sin proyecto asumido: menos de un ciclo, es decir, el pedido llega cuando la producción ya no puede iniciarse.\nLos tres indicadores cumplen el esquema cantidad + variable + lugar + plazo + medio de verificación y los criterios SMART. Se distingue con precisión lo que aporta el escenario —las 32 especies, las dos de conservación desfavorable, la superficie del predio, el ciclo de uno a dos años de vivero, la ventana atada a las lluvias— de lo que hay que relevar, que es todo lo cuantitativo de demanda y de oferta.", "F": "Contexto geográfico y ambiental. El destino principal del material vegetal es un predio fiscal de unas 800 hectáreas sobre el borde este de la ciudad de Salta, último remanente continuo de vegetación nativa del sector, con 32 especies leñosas nativas inventariadas, dos de ellas con categoría de conservación desfavorable. Su mitad alta presenta pendientes superiores al 30 %, suelos erosionables y disponibilidad variable de agua para riego, condiciones que determinan qué especies pueden plantarse en cada sector y con qué tamaño y grado de rustificación. La ventana de plantación está atada al régimen de lluvias: fuera de esa ventana la supervivencia cae, de modo que el calendario de entrega no es un detalle logístico sino una condición de eficacia. La cobertura boscosa del sector está sujeta al régimen provincial de bosques nativos, actualizado recientemente, lo que condiciona tanto la colecta de semilla como las tareas de enriquecimiento.\nContexto social y económico. El área metropolitana de Salta sostiene una demanda continua y de bajo volumen de plantines, alimentada por las campañas municipales de forestación urbana, las instituciones educativas y las organizaciones sociales, con presupuesto que se decide y se ejecuta por ejercicio anual. Del lado de la oferta, los viveros de la región producen sobre todo ornamentales exóticas: es una respuesta económica racional, porque son las que tienen comprador seguro y ciclo corto, mientras que una nativa inmoviliza uno a dos años de vivero sin comprador comprometido. Los barrios linderos al predio, con población de bajos ingresos y trayectoria de trabajo comunitario, son a la vez vecinos del sitio de destino y capacidad social disponible para producir y cuidar.\nContexto institucional. Existen programas públicos vinculados a bosques nativos y a arbolado urbano, e instrumentos de convenio y de compra pública que hoy no se utilizan con este fin. La conducción del programa de restauración del predio no está todavía formalizada y su aprobación es una decisión pendiente.\nQué del contexto potencia el problema: el desfase entre el ciclo biológico del plantín y el ciclo presupuestario anual, la exigencia de procedencia local que angosta la oferta sustituible y la inexistencia de información cuantitativa de demanda y de oferta. Qué del contexto contribuye a la solución: la titularidad pública única del predio de destino, la existencia de instrumentos legales y programas ya vigentes, la capacidad instalada de vivero de la región cuya magnitud aún se desconoce y el tejido comunitario y escolar que ya participa de las plantaciones.\nCada dato de esta línea de base proviene del escenario y del inventario forestal del predio; los valores cuantitativos que el proyecto necesite y el escenario no aporte se declaran como supuestos numerados y se verifican en el F02.", "G": "Población potencial: el conjunto de programas, campañas y organizaciones que necesitan plantines de especies nativas de procedencia local en el área metropolitana de Salta y no consiguen abastecerse. La integran el programa de restauración del predio fiscal del borde este —demandante principal por volumen, del orden de decenas de miles de ejemplares—, las campañas de forestación urbana de la Municipalidad de Salta y de los municipios linderos, las instituciones educativas y las organizaciones sociales que plantan cada año, y otras demandas de nativas de la provincia todavía no relevadas (obras viales, compensaciones, planes de manejo). Su cuantificación exacta es, precisamente, el objeto de la primera actividad del proyecto: hoy no existe.\nPoblación objetivo: el programa de restauración del predio fiscal del borde este, en tanto adhiera al calendario de plantación y firme el pedido por especie y por año, y las campañas de forestación urbana de los municipios e instituciones que suscriban ese mismo calendario. El recorte se hace por dos criterios explícitos: que el demandante formule su pedido con la anticipación que exige el ciclo de vivero, y que el destino de la plantación esté dentro de la región de procedencia de la semilla que el proyecto puede acreditar. Quien no cumpla ambos criterios queda fuera del alcance, aunque forme parte de la población potencial.\nBeneficiarios directos de la componente: los viveros de la región que reconviertan capacidad a nativas bajo contrato, y los viveros comunitarios e institucionales de los barrios linderos y las escuelas que se incorporen a la red de producción, que reciben protocolo, semilla acreditada, formación y compra asegurada.\nBeneficiarios finales: la población del borde este de la ciudad, que recibe los servicios ecosistémicos de la superficie efectivamente restaurada. El proyecto no puede atribuirse ese beneficio como resultado propio, porque depende de que el programa de restauración se apruebe y se ejecute; por eso aparece en el nivel Fin de la MML y no en el propósito.\nNo se declara como población objetivo «toda la comunidad»: el proyecto atiende a los demandantes que se comprometen, no a la totalidad de la población potencial, y esa fracción se cuantifica al cerrar el estudio de demanda.", "H": "Se usa escala numérica de 0 a 1 para fuerza e importancia, la misma para ambas columnas.\n· Organismo público que conduce el programa de restauración del predio fiscal del borde este (unidad ejecutora provincial o municipal a definir) · Institución pública · Posición a favor · Fuerza 0,9 (es quien puede firmar el pedido por especie y por año y comprometer la compra; sin él no hay proyecto) · Importancia 1,0 (es el destinatario principal del material vegetal) · Interés: disponer de plantines en la fecha y con la calidad que exige su plan de plantación.\n· Municipalidad de Salta y municipios del área metropolitana, áreas de espacios verdes y arbolado urbano · Institución pública · Posición a favor con reservas · Fuerza 0,7 (aportan demanda continua, sitios de plantación y personal, pero deciden por ejercicio anual y pueden no sostener el compromiso) · Importancia 0,8 · Interés: previsibilidad de la provisión y menor mortandad en sus campañas.\n· Viveros comerciales de la región · Sector privado · Posición indiferente en el punto de partida, potencialmente a favor · Fuerza 0,9 (son la capacidad instalada que el proyecto necesita reconvertir; si no aceptan el contrato, la alternativa elegida no se sostiene) · Importancia 0,9 · Interés: comprador cierto, precio que cubra los dos años de inmovilización y pago en plazo. Estrategia hacia este actor: contrato plurianual con anticipo y precio de referencia, no exhortación.\n· Autoridad provincial de ambiente y de bosques nativos · Institución pública · Posición a favor · Fuerza 0,7 (autoriza la colecta de semilla en bosque nativo, controla la trazabilidad y administra los programas que podrían financiar la provisión) · Importancia 0,7 · Interés: trazabilidad de la semilla, conservación de las especies en categoría desfavorable y aplicación efectiva de sus programas.\n· Uniones vecinales de los barrios linderos, instituciones educativas y organizaciones sociales · Sociedad civil · Posición a favor · Fuerza 0,5 (aportan trabajo, viveros escolares y cuidado posterior; su retiro no frena el proyecto pero lo empobrece) · Importancia 0,7 · Interés: participación reconocida, formación y trabajo remunerado en la producción.\n· Áreas de hacienda, presupuesto y contrataciones de la jurisdicción titular · Institución pública · Posición reticente, en los hechos en contra · Fuerza 0,8 (de ellas depende que exista un compromiso que exceda el ejercicio anual; su negativa desarma el núcleo de la alternativa) · Importancia 0,6 · Interés: no comprometer ejercicios futuros ni asumir riesgo de sobreprecio. Estrategia: instrumentar el compromiso con la figura que la normativa provincial admita y escalonar las entregas.\n· Proveedores de plantines de fuera de la región y viveros de ornamentales exóticas · Sector privado · Posición en contra · Fuerza 0,4 (pueden ofrecer entrega inmediata y precio menor en una licitación que no exija procedencia, y desplazar al proveedor local) · Importancia 0,5 · Interés: conservar la venta. Estrategia: que el pliego incorpore procedencia y trazabilidad como requisito técnico, no como preferencia.\nEl listado incluye deliberadamente un actor en contra, uno reticente y uno indiferente en el punto de partida: el análisis sirve para anticipar bloqueos, no para enumerar aliados.", "I": "El proyecto depende directamente de tres niveles institucionales, que también figuran en el ítem H.\n· Titular del proyecto: la unidad ejecutora del programa de restauración del predio fiscal del borde este, o el organismo provincial de ambiente si aquella no está constituida, bajo figura de convenio interinstitucional con los municipios del área metropolitana que adhieran al calendario de plantación. Se propone esa figura y no un organismo aislado porque el compromiso de compra plurianual, que es el corazón del proyecto, requiere una jurisdicción con capacidad de contratar y otra con demanda continua.\n· Autoridad provincial de aplicación en bosques nativos: de ella dependen la autorización de colecta de semilla en bosque nativo, la identificación de rodales semilleros y la eventual afectación de fondos de los programas vigentes.\n· Autoridad nacional en materia de semillas y fiscalización de material de propagación, y organismos técnicos y académicos de la región (universidad, organismos de investigación agropecuaria y forestal), de los que dependen la inscripción y el respaldo técnico de los protocolos de producción y de la trazabilidad.\nSe agregan, como dependencias operativas: la administración del predio fiscal, para el acceso a los rodales semilleros y a los sectores de plantación; las áreas de hacienda y contrataciones, para el instrumento de compromiso plurianual; y las áreas municipales de espacios verdes, para el calendario de las campañas urbanas.\nEn esta instancia sólo se identifica ante quién habría que gestionar cada permiso, convenio o autorización. Los acuerdos, comodatos y habilitaciones se tramitan al pasar de perfil a prefactibilidad, y no corresponde anticiparlos.", "J": "Matriz de cumplimiento legal, acotada a las normas que el proyecto debe cumplir en sus etapas y no a un listado del derecho ambiental. Se verifica en cada caso texto ordenado y modificatorias; cuando no hay certeza sobre el número, la norma se nombra por su materia.\n· Nacional · Ley General del Ambiente (Ley 25.675), presupuestos mínimos, principios de prevención y de progresividad: encuadra la evaluación del proyecto y su articulación con la restauración de destino.\n· Nacional · Ley de presupuestos mínimos de protección ambiental de los bosques nativos (Ley 26.331) y su fondo: aplica a la colecta de semilla y a las tareas de enriquecimiento en el bosque del predio, y es una vía posible de financiamiento de la provisión.\n· Nacional · Régimen de semillas y creaciones fitogenéticas (Ley 20.247) y la reglamentación del organismo nacional de semillas sobre identificación, rotulado y fiscalización del material de propagación: es la norma que da sustento a la trazabilidad de la procedencia, que en este proyecto es un requisito técnico central.\n· Nacional · Régimen de promoción de inversiones en bosques cultivados, en lo que resulte aplicable a la producción de plantines y a la habilitación de viveros.\n· Provincial de Salta · Ley de protección del medio ambiente de la provincia (Ley 7.070) y su procedimiento de evaluación de impacto ambiental y social, en lo aplicable a la instalación o ampliación de viveros y a las obras asociadas.\n· Provincial de Salta · Ley de ordenamiento territorial de bosques nativos (Ley 7.543) y su cartografía, recientemente actualizada: define categorías de conservación y condiciona la colecta y el enriquecimiento. La actualización debe verificarse antes de citarla.\n· Provincial de Salta · Normativa de flora y de especies en categoría de conservación desfavorable, aplicable a la colecta y multiplicación de las dos especies inventariadas en esa condición.\n· Provincial de Salta · Régimen de contrataciones de la Administración provincial y normativa de administración financiera en materia de compromisos que exceden el ejercicio: es la norma que habilita —o impide— el contrato plurianual de provisión, y por eso su verificación temprana es determinante para la alternativa elegida.\n· Municipal · Ordenanzas de arbolado urbano y de espacios verdes de la Municipalidad de Salta y de los municipios del área metropolitana, que fijan especies admitidas, época de plantación y responsabilidades de mantenimiento; conviven normativas dispares entre municipios del área, lo que obliga a armonizar el calendario y las especificaciones del material.\n· Municipal · Ordenanzas de habilitación comercial aplicables a los viveros proveedores.\nNo se citan números de norma de los que el equipo no tenga certeza: la Guía advierte que el marco normativo del escenario puede ser anterior a modificaciones recientes.", "K": "Las causas se leen de derecha a izquierda: cada nivel inferior genera el inmediato superior y el primer nivel produce el problema central. Una misma causa alimenta más de una rama, y eso se declara.\nCausa 1 · La producción de los viveros de la región está orientada a ornamentales exóticas y la oferta de nativas es variable, de bajo volumen y no programada contra ningún calendario de plantación (dimensión económica). Es lo que hace que, en la fecha de plantar, no haya material.\n· Causa 1.1 · Ningún comprador se obliga a adquirir plantines antes de la siembra, de modo que ningún productor asume uno a dos años de producción y el riesgo de escala. No es mala voluntad del vivero: producir sin comprador es asumir dos años de riesgo, y la respuesta racional es producir exóticas.\n· · Causa 1.1.A · La demanda de plantines nativos no está dimensionada por especie ni por año: nadie sabe cuántos ejemplares de cada especie, para qué sector y en qué fecha. Sin ese número no hay contrato que firmar ni escala de vivero que planificar (dimensión institucional).\n· · Causa 1.1.B · La capacidad instalada de vivero de la región, su nivel de uso y la fracción reconvertible a nativas no están relevadas (dimensión técnica). El proyecto no sabe con quién podría contratar.\n· · Causa 1.1.C · Los instrumentos disponibles —convenios, compra pública, contratos plurianuales y los programas de bosques nativos y arbolado urbano— no se aplican a comprometer material vegetal con más de un ejercicio de anticipación (dimensión institucional).\n· · · Causa 1.1.C.1 · El presupuesto de campañas y programas se decide y se ejecuta por ejercicio anual y ninguna repartición se obliga por una entrega que se concreta dos temporadas después (dimensión económica).\n· Causa 1.2 · Las capacidades de producción de nativas están concentradas en pocas personas, sin formación sistemática ni organización de los viveros comunitarios, institucionales y escolares de los barrios linderos (dimensión social). Aun con contrato, la base productiva capaz de responder es angosta.\nCausa 2 · El ciclo de producción del plantín nativo —uno a dos años de vivero más rustificación— es más largo que el horizonte con que se deciden y se financian las plantaciones, y no existe ninguna decisión anticipada de producción que cubra ese desfase (dimensión técnica). Es la causa que vuelve inútil reaccionar cuando el programa ya está aprobado.\n· Causa 2.1 · La anualidad presupuestaria (misma causa 1.1.C.1): la decisión y el dinero llegan en el mismo ejercicio en que se quiere plantar.\n· Causa 2.2 · La demanda no dimensionada (misma causa 1.1.A): no se puede anticipar una producción cuyo destino no está cuantificado.\nCausa 3 · No hay protocolos escritos de producción por especie —colecta, tratamiento de semilla, sustrato, tiempos de vivero, rustificación, tamaño de entrega— ni criterios verificables de recepción del plantín (dimensión técnica). Sin protocolo, «calidad» y «fecha» no son especificables ni exigibles, aunque haya plantines.\n· Causa 3.1 · Capacidades concentradas y sin sistematizar (misma causa 1.2).\nCausa 4 · La procedencia local de la semilla no tiene circuito: no hay rodales semilleros identificados en el bosque del sector, ni calendario de colecta, ni registro que vincule cada lote con su origen (dimensión ambiental). Por eso un plantín nativo disponible puede igualmente no servir para este sitio.\n· Causa 4.1 · Capacidades concentradas y sin sistematizar (misma causa 1.2), que es también lo que impide sostener la colecta.\nCausa 5 · Los viveros con alguna oferta de nativas están dispersos y alejados de los sitios de plantación, sin logística de traslado ni acopio intermedio para concentrar entregas dentro de la ventana de lluvias (dimensión territorial).\n· Causa 5.1 · Capacidad instalada no relevada (misma causa 1.1.B): sin conocer dónde está la capacidad, no hay logística que diseñar.\nSe aplicó la técnica del «¿pero por qué?» hasta llegar a tres causas primarias e independientes entre sí, que son las que la cátedra espera encontrar: el desfase temporal entre decidir restaurar y poder plantar, la ausencia de un compromiso de compra anterior a la siembra y la demanda nunca dimensionada por especie y por año. Las causas cubren seis dimensiones: económica, institucional, técnica, social, ambiental y territorial.", "L": "Los efectos se leen de izquierda a derecha: el problema central produce el efecto de primer nivel y éste los sucesivos.\nEfecto 1 · Las plantaciones se ejecutan con el material vegetal que esté disponible en el momento de plantar —ornamentales exóticas, o nativas de especie inadecuada al sitio y de procedencia desconocida— en lugar del que el sitio requiere. Es la respuesta previsible de quien tiene fecha de plantación y no tiene el material que pidió.\n· Efecto 1.1 · Baja supervivencia de los plantines nativos plantados en las laderas y los sectores de uso público del predio y en los espacios públicos de la ciudad, medida a los doce meses de la plantación.\n· · Efecto 1.1.A · Se pierde la inversión pública y comunitaria de cada campaña —traslado, apertura de hoyos, jornales, tutores y protección— y se debilita el respaldo presupuestario de las campañas siguientes.\n· · Efecto 1.1.B · Las instituciones educativas, las organizaciones sociales y los vecinos pierden continuidad y confianza en las convocatorias, al ver morir lo que plantaron. Este efecto llega por dos caminos: por la mortandad directa y por el debilitamiento presupuestario del efecto 1.1.A.\n· Efecto 1.2 · Las especies leñosas nativas de multiplicación más exigente, entre ellas las dos con categoría de conservación desfavorable inventariadas en el predio, quedan fuera de las plantaciones porque no se producen ni se ofrecen comercialmente: se restaura con las especies fáciles y se pierde precisamente la diversidad que justificaba restaurar.\nEfecto 2 · Las tareas de enriquecimiento del bosque nativo y de estabilización de laderas se posponen o se ejecutan de manera parcial, y las pendientes superiores al 30 % de la mitad alta del predio siguen expuestas a erosión sobre suelos erosionables. Este efecto deriva directamente del problema —no se planta lo que había que plantar— y se agrava por la baja supervivencia del efecto 1.1.\nControl de corrección: ninguno de estos enunciados es una causa escrita en la columna equivocada. La baja supervivencia, que muchos equipos colocan como problema central, aparece acá como efecto de segundo nivel y con lugar y plazo de medición, tal como corresponde.", "M": "Lectura encadenada del árbol, de abajo hacia arriba.\nEn la base hay tres raíces independientes. La primera es informativa e institucional: nadie dimensionó cuántos plantines de cada especie y para qué fecha necesitan la restauración del predio y las campañas urbanas. La segunda es económica e institucional: el presupuesto se decide por ejercicio anual y los instrumentos de convenio, compra pública y contrato plurianual no se usan para comprometer material vegetal con más de un ejercicio de anticipación. La tercera es social y técnica: las capacidades de producción de nativas están concentradas en pocas personas, sin formación sistemática ni organización de los viveros comunitarios, escolares e institucionales.\nDe la primera y la segunda se sigue que ningún comprador se obliga antes de la siembra, y de ahí que ningún vivero asuma uno a dos años de inmovilización: la producción regional se orienta a ornamentales exóticas y la oferta de nativas queda variable y no programada. Las mismas dos raíces producen, por otro camino, el desfase temporal: cuando el programa de restauración se apruebe y tenga fondos, el plantín que se necesitaba ya tendría que estar sembrado. De la tercera raíz se siguen la ausencia de protocolos por especie y de criterios de recepción, y la inexistencia de un circuito de semilla de procedencia local con rodales identificados y trazabilidad. A esas cuatro causas directas se suma una quinta, territorial: los viveros con alguna oferta están dispersos y sin logística para concentrar entregas en la ventana de lluvias.\nEn el tronco, el problema central: la restauración proyectada sobre las 800 hectáreas del borde este y las campañas de forestación urbana no logran abastecerse de plantines nativos de procedencia local en las especies, cantidades, calidad y fechas que requieren.\nHacia arriba, las ramas. Quien tiene fecha de plantación y no tiene el material planta con lo que hay, y eso baja la supervivencia a los doce meses; la baja supervivencia hace perder la inversión de cada campaña, debilita el presupuesto de las siguientes y desalienta a las escuelas, las organizaciones y los vecinos que plantaron. Por otra rama, las especies de multiplicación exigente —incluidas las dos de conservación desfavorable— quedan directamente afuera. Y el problema, por sí mismo y agravado por la mortandad, posterga el enriquecimiento del bosque y la estabilización de laderas, de modo que las pendientes de más del 30 % de la mitad alta siguen expuestas a erosión.\nEl árbol es, en esta instancia, un conjunto de hipótesis de trabajo: cada vínculo deberá ponerse a prueba en el F02 con el estudio de demanda, el relevamiento de viveros y la consulta a los organismos técnicos.", "N": "Medios, con la misma estructura jerárquica de las causas y redactados como estados alcanzados, no como acciones.\nMedio 1 · Los viveros de la región destinan parte de su producción a especies nativas, con volumen sostenido y programado contra el calendario de plantación.\n· Medio 1.1 · Un comprador se obliga a adquirir plantines antes de la siembra y el productor puede asumir el ciclo de uno a dos años y la escala requerida.\n· · Medio 1.1.A · La demanda de plantines nativos está dimensionada por especie y por año, con cantidad, sector de destino y fecha de entrega.\n· · Medio 1.1.B · La capacidad instalada de vivero de la región, su nivel de uso y su fracción reconvertible están relevados y actualizados.\n· · Medio 1.1.C · Los instrumentos de convenio, compra pública, contrato plurianual y los programas de bosques nativos y arbolado urbano se aplican a comprometer material vegetal con más de un ejercicio de anticipación.\n· · · Medio 1.1.C.1 · El presupuesto de campañas y programas admite compromisos que exceden el ejercicio anual.\n· Medio 1.2 · Las capacidades de producción de nativas están difundidas mediante formación sistemática y los viveros comunitarios, escolares e institucionales de los barrios linderos están organizados para producir.\nMedio 2 · Existe una decisión anticipada de producción que cubre el desfase entre el ciclo de vivero y el horizonte con que se deciden y se financian las plantaciones.\nMedio 3 · Hay protocolos escritos de producción por especie —colecta, tratamiento de semilla, sustrato, tiempos de vivero, rustificación y tamaño de entrega— y criterios verificables de recepción del plantín en el sitio de plantación.\nMedio 4 · La procedencia local de la semilla tiene circuito: rodales semilleros identificados, calendario de colecta y registro que vincula cada lote de plantines con su origen.\nMedio 5 · Los viveros proveedores cuentan con logística de traslado y acopio intermedio que permite concentrar entregas dentro de la ventana de lluvias.\nMedios fuera del alcance del proyecto, declarados explícitamente: el medio 1.1.C.1 —que el régimen presupuestario admita compromisos plurianuales— excede al equipo y a cualquier unidad ejecutora del proyecto: es una decisión de política financiera provincial y por eso reaparece como supuesto en la MML, no como componente. También queda fuera del alcance la ejecución de la restauración misma —apertura de hoyos, plantación, riego y mantenimiento posterior en el predio—, que es responsabilidad del programa de restauración y no de este proyecto, aunque de ella dependa el Fin.\nControl de corrección: ningún medio está escrito como «mejorar», «promover» o «fortalecer». Cada uno enuncia una situación alcanzada y verificable.", "O": "Fines, espejo exacto de los efectos del ítem L.\nFin 1 · Las plantaciones se ejecutan con el material vegetal que el sitio requiere: especie adecuada al sector, procedencia local acreditada y tamaño y rustificación pactados.\n· Fin 1.1 · Alta supervivencia de los plantines nativos plantados en las laderas y los sectores de uso público del predio y en los espacios públicos de la ciudad, medida a los doce meses.\n· · Fin 1.1.A · La inversión pública y comunitaria de cada campaña se aprovecha en cobertura efectivamente establecida y sostiene el respaldo presupuestario de las campañas siguientes.\n· · Fin 1.1.B · Las instituciones educativas, las organizaciones sociales y los vecinos sostienen su participación y su confianza en las convocatorias.\n· Fin 1.2 · Las especies de multiplicación más exigente, incluidas las dos con categoría de conservación desfavorable, se incorporan a las plantaciones.\nFin 2 · Las tareas de enriquecimiento del bosque nativo y de estabilización de laderas se ejecutan en los plazos previstos y las pendientes superiores al 30 % de la mitad alta reducen su exposición a la erosión.\nLos fines más altos —Fin 1.1.A, Fin 1.1.B y Fin 2— alimentan el nivel Fin de la EAP y de la MML. No se agregó ningún fin sin efecto correspondiente en el ítem L.", "P": "Problema central: la restauración proyectada sobre el predio fiscal de unas 800 hectáreas del borde este de la ciudad de Salta y, en menor volumen, las campañas de forestación urbana del área metropolitana no logran abastecerse de plantines de especies nativas de procedencia local en las especies, las cantidades, la calidad y las fechas que sus plantaciones requieren.\nObjetivo central, propósito o meta: la restauración proyectada sobre el predio fiscal de unas 800 hectáreas del borde este de la ciudad de Salta y las campañas de forestación urbana del área metropolitana se abastecen de plantines de especies nativas de procedencia local en las especies, las cantidades, la calidad y las fechas que sus plantaciones requieren.\nSe conservan el mismo sujeto —los programas y campañas demandantes—, la misma variable —el abastecimiento conforme en especie, cantidad, calidad y fecha— y el mismo lugar —el predio fiscal del borde este y el área metropolitana de Salta—: sólo cambia el signo. El indicador de este propósito es el mismo del ítem E, la proporción de plantines requeridos que se entregan conformes y dentro de la ventana de plantación.\nControl de corrección: la meta no se amplió a «toda la provincia» ni se desplazó a «restaurar las 800 hectáreas». Restaurar es el fin al que este proyecto contribuye; abastecer es lo que este proyecto se compromete a lograr.", "Q": "El árbol de objetivos reproduce nodo por nodo el árbol de problemas: cinco medios directos bajo la meta, con la rama económico-institucional descendiendo por el compromiso de compra hasta la demanda dimensionada, la capacidad relevada, los instrumentos aplicados y el presupuesto plurianual; la rama social y técnica descendiendo por las capacidades difundidas hasta los protocolos y el circuito de semilla; y la rama territorial de la logística de entrega. En el tronco, la meta del ítem P. Hacia arriba, los fines del ítem O en el mismo encadenamiento que los efectos.\nMedios sobre los que el proyecto puede actuar, marcados en el diagrama: la demanda dimensionada por especie y por año (1.1.A), la capacidad de vivero relevada (1.1.B), la aplicación efectiva de los instrumentos de compromiso (1.1.C), el compromiso de compra anterior a la siembra (1.1), la producción de nativas programada en los viveros (1), la decisión anticipada de producción (2), los protocolos y criterios de recepción (3), el circuito de semilla de procedencia local (4), la formación y organización de viveros comunitarios (1.2) y la logística de entrega (5).\nMedios fuera del alcance, marcados con otro trazo: la reforma del régimen presupuestario que admita compromisos plurianuales (1.1.C.1) —el proyecto usa los instrumentos que hoy existan, no crea instrumentos nuevos— y la ejecución de la restauración en el predio, que corresponde al programa de restauración.\nControl de simetría: el árbol de objetivos tiene exactamente los mismos dieciocho nodos que el de problemas, ni uno más ni uno menos. Antes de cerrar este ítem se volvió sobre el M, como recomienda la Guía.", "R": "Del árbol de objetivos surgen dos estrategias posibles y, dentro de la que se selecciona, cinco actividades mutuamente excluyentes.\nEstrategia I · Actuar sobre la demanda y su compromiso · Medios 1.1.A, 1.1.B, 1.1.C y 1.1 · Consiste en dimensionar la demanda por especie y por año, relevar la capacidad de vivero disponible y convertir esa demanda en un compromiso de compra anterior a la siembra. Es la estrategia que ataca las tres raíces del árbol.\nEstrategia II · Actuar sobre la capacidad técnica y la calidad · Medios 1.2, 3, 4 y 5 · Consiste en protocolos por especie, circuito de semilla con rodales y trazabilidad, formación de productores y logística de entrega. Por sí sola mejora lo que se produce, pero no consigue que alguien produzca a escala: sin compromiso de compra, un protocolo excelente se aplica a un volumen insuficiente. Se la incorpora como complemento dentro de la estrategia seleccionada, no como estrategia autónoma.\nSe selecciona la Estrategia I. Dentro de ella, las actividades consideradas —cinco maneras genuinamente distintas de abastecer la misma demanda— son las que se detallan y comparan en el análisis de alternativas: (A) reconversión de capacidad ociosa de viveros existentes mediante contrato plurianual de provisión; (B) vivero propio del programa de restauración; (C) red de viveros comunitarios e institucionales con los barrios linderos y las escuelas; (D) esquema mixto segmentado por especie, con contrato plurianual para el grueso del volumen, red comunitaria para las especies de multiplicación sencilla y una unidad pública de semilla y protocolos que sostiene a ambos; (E) compra de plantines fuera de la región.\nLa actividad seleccionada es la (D). Se descarta expresamente la lectura de que «construir un vivero» sea la respuesta obligada: es una de las cinco opciones, es la más intensiva en inversión y es la que más riesgo asume si el programa de restauración no se aprueba.\nActividades identificadas y descartadas por estar fuera del alcance, con su criterio: la ejecución de la restauración del predio —plantación, riego, mantenimiento y reposición— y la obra del parque y la gestión del predio fiscal, porque corresponden al programa de restauración y no a este proyecto, que se agota en la entrega conforme del material vegetal; y la modificación del régimen presupuestario provincial para admitir compromisos plurianuales, porque es una decisión de política financiera que el proyecto no controla y que, por lo tanto, se traslada a los supuestos de la MML.\nDescripción de la actividad seleccionada: sistema de abastecimiento programado de plantines nativos, integrado por un estudio de demanda por especie y por año acordado con el programa de restauración y con los municipios; un relevamiento de capacidad instalada de vivero y de su fracción reconvertible; un contrato plurianual de provisión con los viveros que acepten reconvertir capacidad, con especificaciones técnicas por especie y penalidades por incumplimiento de fecha; un convenio con viveros comunitarios, escolares e institucionales de los barrios linderos para las especies de multiplicación sencilla, con formación y compra asegurada; y una unidad técnica de semilla y calidad —rodales semilleros identificados, colecta trazable, protocolos por especie y acta de recepción en sitio— que es el activo público que el proyecto crea y del que dependen todos los proveedores.", "S": "Estructura Analítica del Proyecto, de arriba hacia abajo.\nFin · Las superficies del predio fiscal del borde este y de los espacios públicos de la ciudad plantadas con especies nativas alcanzan cobertura establecida, la inversión de cada campaña se aprovecha, las pendientes de la mitad alta reducen su exposición a la erosión y las especies en categoría de conservación desfavorable se incorporan a las plantaciones.\nPropósito · La restauración proyectada sobre el predio fiscal de unas 800 hectáreas del borde este de la ciudad de Salta y las campañas de forestación urbana del área metropolitana se abastecen de plantines de especies nativas de procedencia local en las especies, las cantidades, la calidad y las fechas que sus plantaciones requieren.\nComponente · Sistema de abastecimiento programado de plantines nativos de procedencia local en funcionamiento: demanda dimensionada por especie y por año, contratos plurianuales de provisión vigentes con viveros comerciales reconvertidos y convenios con viveros comunitarios e institucionales, unidad de semilla y protocolos de producción y de recepción aplicados, y calendario de entregas ajustado a la ventana de plantación.\nActividad · Proyecto de inversión para la puesta en marcha de ese sistema: estudio de demanda por especie y por año; relevamiento de capacidad instalada de vivero y de su fracción reconvertible; identificación de rodales semilleros y montaje del circuito de colecta y trazabilidad; elaboración y adopción de los protocolos de producción por especie y del acta de recepción; licitación y firma de los contratos plurianuales de provisión; convenios y formación con los viveros comunitarios, escolares e institucionales; y organización de la logística de entrega y del acopio intermedio.\nControl de corrección: la componente está redactada como producto obtenido —«sistema en funcionamiento»— y no como acción. «Firmar contratos» o «capacitar productores» son actividades, no componentes.", "T": "Matriz de Marco Lógico, en concordancia con la EAP del ítem S. Los valores numéricos que el escenario no aporta se declaran como supuestos a verificar en el F02.\nFIN · Resumen narrativo: contribuir a que la restauración del predio fiscal del borde este y la forestación urbana del área metropolitana alcancen cobertura nativa establecida, con menor erosión en las laderas y aprovechamiento de la inversión de cada campaña · Indicador: 80 % de los plantines nativos entregados por el sistema y plantados en el predio y en los espacios públicos de la ciudad sobreviven a los doce meses de plantados, al cabo de la tercera temporada de operación · Medio de verificación: relevamiento anual de supervivencia con parcelas fijas de control, a cargo del programa de restauración y de las áreas municipales de espacios verdes, con informe público · Supuesto: el programa de restauración y los municipios ejecutan la plantación en la ventana prevista y sostienen el riego y el mantenimiento posterior, que están fuera del alcance de este proyecto.\nPROPÓSITO · Resumen narrativo: la restauración proyectada sobre el predio fiscal de unas 800 hectáreas del borde este y las campañas de forestación urbana del área metropolitana se abastecen de plantines nativos de procedencia local en las especies, las cantidades, la calidad y las fechas que requieren · Indicador: 90 % de los plantines requeridos por el plan anual de plantación se entregan conformes —especie prevista para el sector, procedencia local acreditada, tamaño y rustificación pactados y entrega dentro de la ventana de plantación— en el predio fiscal del borde este y en las campañas urbanas adheridas, durante la tercera temporada de operación (línea de base asumida: 0 % de entrega programada conforme; ambos valores a verificar en el F02) · Medio de verificación: registro de entregas de la unidad técnica del proyecto, integrado por las actas de recepción por lote firmadas en el sitio de entrega, con publicación anual · Supuesto: el programa de restauración del predio fiscal se aprueba y se ejecuta en los plazos previstos y mantiene vigente su plan anual de plantación.\nCOMPONENTE · Resumen narrativo: sistema de abastecimiento programado de plantines nativos de procedencia local en funcionamiento · Indicador: contratos plurianuales y convenios de provisión vigentes que cubran el 100 % de las especies y al menos el 80 % del volumen del plan anual de plantación, firmados al menos dieciocho meses antes de la temporada de plantación a la que abastecen, para el predio fiscal del borde este y las campañas urbanas adheridas · Medio de verificación: expediente de contratación y registro de convenios de la unidad ejecutora, con el calendario de entregas anexo · Supuesto: los viveros de la región cuentan con capacidad reconvertible y aceptan las condiciones técnicas y de plazo del contrato; el régimen de contrataciones provincial admite el compromiso plurianual.\nACTIVIDAD · Resumen narrativo: puesta en marcha del sistema —estudio de demanda, relevamiento de oferta, circuito de semilla, protocolos, contratación, convenios comunitarios y logística— · Indicador: estudio de demanda por especie y por año y relevamiento de capacidad instalada de vivero concluidos, validados por el programa de restauración y por los municipios adheridos y publicados dentro de los primeros nueve meses de ejecución, con el 100 % del presupuesto de esa etapa ejecutado · Medio de verificación: informes técnicos aprobados por acto administrativo de la unidad ejecutora y ejecución presupuestaria del período · Supuesto: las reparticiones y los viveros aportan la información requerida y se mantiene la asignación presupuestaria de la etapa de formulación.", "U": "Lógica vertical, de abajo hacia arriba. Si dimensionamos la demanda por especie y por año, relevamos la capacidad de vivero disponible, montamos el circuito de semilla de procedencia local con sus protocolos y firmamos contratos plurianuales y convenios con los viveros comerciales y comunitarios, entonces tendremos en funcionamiento un sistema de abastecimiento programado; si ese sistema funciona y el programa de restauración se aprueba y ejecuta en plazo, entonces la restauración del predio y las campañas urbanas recibirán los plantines que necesitan en la especie, la cantidad, la calidad y la fecha que requieren; y si los reciben y se plantan en la ventana correcta con el mantenimiento a cargo del programa, entonces la cobertura nativa quedará establecida, las laderas de más del 30 % reducirán su exposición a la erosión, las especies de conservación desfavorable volverán al terreno y la inversión de cada campaña dejará de perderse.\nLógica horizontal, fila por fila. En la actividad, el indicador es el estudio de demanda y el relevamiento de oferta concluidos y validados: el acto administrativo que los aprueba y la ejecución presupuestaria son necesarios y suficientes para verificarlo. En la componente, el indicador son los contratos y convenios vigentes con cobertura de especies y volumen y con anticipación mínima de dieciocho meses: el expediente de contratación lo prueba de manera directa y la anticipación es justamente lo que distingue un contrato útil de uno tardío. En el propósito, el indicador es el porcentaje de entrega conforme: el registro de entregas se construye con actas de recepción firmadas en el sitio, es información que hoy no existe y que el proyecto genera como parte de su operación, y permite discriminar por especie, por lote y por fecha. En el fin, el indicador es la supervivencia a doce meses: el relevamiento con parcelas fijas es la fuente adecuada, aunque su ejecución dependa del programa de restauración y de los municipios, lo que se refleja en el supuesto de esa fila.\nLógica zigzag. La actividad más el supuesto de que las reparticiones aportan información permite alcanzar la componente; la componente más el supuesto de que los viveros aceptan reconvertir capacidad y de que el régimen de contrataciones admite el compromiso plurianual permite alcanzar el propósito; el propósito más el supuesto de que la plantación y el mantenimiento se ejecutan en tiempo permite alcanzar el fin.\nSupuesto más frágil: que el programa de restauración del predio fiscal del borde este se apruebe y se ejecute en los plazos previstos. Es el riesgo externo central del proyecto y su lógica es incómoda por construcción: hay que producir antes de que la decisión esté tomada, porque el plantín tarda uno a dos años y la decisión se toma en meses. Si el programa no se aprueba, el proyecto queda con material vegetal producido y sin destino principal, y su propósito se cumple sólo en la fracción urba
