<!doctype html>
<html lang="es" data-theme="dark" data-rail="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FEPAR 2026 · Guía docente del Formulario 01</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Material de cátedra FEPAR 2026: solucionario del Formulario 01 de los seis escenarios, con árbol de problemas, árbol de objetivos y respuestas de referencia.">
<style>
:root{
  --bg:#06110d; --bg2:#0a1a14; --panel:#0e2019; --panel2:#0b1a15;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.19);
  --tx:#eaf5f0; --tx2:#b9cfc6; --tx3:#7f9a90;
  --verde:#00a05a; --verde-l:#22c97f; --aqua:#12b5a0; --celeste:#39b6d8;
  --oro:#eda100; --violeta:#7b6bd6; --coral:#ef6a4b; --ok:#00c06a; --bad:#ef5350;
  --ff:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fh:var(--ff);
  --r:16px; --r-s:12px; --rail:300px;
  --shadow:0 22px 60px -26px rgba(0,0,0,.85);
}
html[data-theme="light"]{
  --bg:#f2f6f4; --bg2:#e8efec; --panel:#fff; --panel2:#f7faf9;
  --line:rgba(16,36,29,.12); --line2:rgba(16,36,29,.24);
  --tx:#10241d; --tx2:#3c554c; --tx3:#6b8279;
  --shadow:0 22px 60px -30px rgba(16,36,29,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ff);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(1100px 700px at 12% -6%, rgba(0,160,90,.16), transparent 60%),
   radial-gradient(900px 560px at 94% 6%, rgba(237,161,0,.11), transparent 60%),
   radial-gradient(1000px 700px at 55% 112%, rgba(123,107,214,.10), transparent 62%)}
html[data-theme="light"] body::before{
  background:
   radial-gradient(1100px 700px at 12% -6%, rgba(0,160,90,.10), transparent 60%),
   radial-gradient(900px 560px at 94% 6%, rgba(237,161,0,.09), transparent 60%)}
::selection{background:rgba(0,160,90,.35)}

/* scrollbars visibles en los dos ejes */
*{scrollbar-width:thin;scrollbar-color:rgba(0,192,106,.7) rgba(255,255,255,.05)}
*::-webkit-scrollbar{width:12px;height:12px}
*::-webkit-scrollbar-track{background:rgba(255,255,255,.05);border-radius:12px}
*::-webkit-scrollbar-thumb{background:rgba(0,192,106,.7);border-radius:12px;
  border:3px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:var(--verde-l);background-clip:padding-box;border:3px solid transparent}
*::-webkit-scrollbar-corner{background:transparent}
html[data-theme="light"] *{scrollbar-color:rgba(0,140,80,.55) rgba(0,0,0,.06)}
html[data-theme="light"] *::-webkit-scrollbar-track{background:rgba(0,0,0,.06)}

/* ===================== ESTRUCTURA ===================== */
#top{position:fixed;top:0;left:var(--rail);right:0;height:4px;z-index:40;background:rgba(255,255,255,.06);
  transition:left .3s cubic-bezier(.22,.9,.28,1)}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--verde),var(--aqua) 45%,var(--oro));
  transition:width .45s cubic-bezier(.22,.9,.28,1)}
#stage{position:fixed;top:4px;right:0;bottom:0;left:var(--rail);z-index:1;
  transition:left .3s cubic-bezier(.22,.9,.28,1)}
.sec{position:absolute;inset:0;display:none;flex-direction:column;gap:clamp(10px,1.4vh,18px);
  padding:clamp(16px,2.6vh,34px) clamp(18px,3.4vw,64px) 78px;overflow:auto;
  opacity:0;transform:translateY(14px)}
.sec.on{display:flex;animation:in .38s cubic-bezier(.22,.9,.28,1) forwards}
@keyframes in{to{opacity:1;transform:none}}
.fill{flex:1;min-height:0}
/* pantallas de trabajo: los paneles conservan su alto natural y la pantalla se desplaza */
.sec.work>*{flex:none!important}
.sec.work .fill{flex:none!important;min-height:0}

/* ===================== HUD ===================== */
#hud{position:fixed;bottom:0;left:var(--rail);right:0;height:58px;z-index:40;display:flex;align-items:center;
  gap:9px;padding:0 clamp(12px,2.4vw,34px);backdrop-filter:blur(8px);
  background:linear-gradient(0deg,rgba(0,0,0,.5),transparent);transition:left .3s cubic-bezier(.22,.9,.28,1)}
html[data-theme="light"] #hud{background:linear-gradient(0deg,rgba(255,255,255,.8),transparent)}
.hud-b{border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--tx2);
  border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:var(--ff);
  transition:.18s;white-space:nowrap}
.hud-b:hover{color:var(--tx);border-color:var(--verde);background:rgba(0,160,90,.14)}
.hud-b.pri{background:var(--verde);border-color:var(--verde);color:#04150e;font-weight:650}
.hud-b.pri:hover{background:var(--verde-l);color:#04150e}
html[data-theme="light"] .hud-b{background:rgba(255,255,255,.85)}
#counter{font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums;margin-left:auto;flex:none}
#saved{font-size:11.5px;color:var(--tx3);flex:none}
#saved.on{color:var(--verde-l)}
#zwrap{display:inline-flex;align-items:center;gap:4px;flex:none}
#zlabel{font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums;min-width:44px;text-align:center;cursor:pointer}

/* ===================== ÍNDICE LATERAL ===================== */
#rail{position:fixed;top:0;left:0;bottom:0;width:var(--rail);z-index:50;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--panel),var(--bg2));border-right:1px solid var(--line)}
#rail.off{display:none}
#rail-h{padding:15px 16px 11px;border-bottom:1px solid var(--line);flex:none}
#rail-h .rt{font-size:14.5px;font-weight:800;line-height:1.2}
#rail-h .rs{font-size:11px;color:var(--tx3);margin-top:3px}
#rail-b{flex:1;overflow:auto;padding:9px 9px 14px}
#rail-f{flex:none;padding:9px 13px 13px;border-top:1px solid var(--line)}
.rg{margin-bottom:5px;border-radius:11px;overflow:hidden;border:1px solid transparent}
.rg.cur{border-color:var(--line2);background:rgba(255,255,255,.035)}
.rg-h{display:flex;align-items:center;gap:9px;padding:8px 9px;cursor:pointer;transition:.16s}
.rg-h:hover{background:rgba(255,255,255,.05)}
.rg-n{flex:none;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:800;border:1px solid var(--line2);color:var(--tx3)}
.rg.cur .rg-n{background:var(--verde);border-color:var(--verde);color:#04150e}
.rg.done .rg-n{border-color:var(--verde);color:var(--verde-l)}
.rg-t{flex:1;min-width:0}
.rg-t b{display:block;font-size:12.5px;color:var(--tx2);font-weight:650;line-height:1.25}
.rg.cur .rg-t b{color:var(--tx)}
.rg-t span{font-size:10.5px;color:var(--tx3)}
.rg-p{height:3px;border-radius:3px;background:rgba(255,255,255,.08);margin:0 9px 7px;overflow:hidden}
.rg-p i{display:block;height:100%;background:linear-gradient(90deg,var(--verde),var(--aqua));border-radius:3px;
  transition:width .4s cubic-bezier(.22,.9,.28,1)}
.rg-l{display:none}
.rg.open .rg-l{display:block;padding:0 6px 6px}
.ri{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:8px;cursor:pointer;
  font-size:11.5px;color:var(--tx3);line-height:1.3;transition:.14s}
.ri:hover{background:rgba(255,255,255,.06);color:var(--tx2)}
.ri.cur{background:rgba(0,160,90,.16);color:var(--tx);font-weight:600;box-shadow:inset 2px 0 0 var(--verde-l)}
.ri .rn{flex:none;width:16px;font-size:10px;opacity:.7;text-align:right}
.ri .rk{flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line2)}
.ri.ok .rk{background:var(--verde);border-color:var(--verde)}
.ri.part .rk{background:var(--oro);border-color:var(--oro)}
#rail-toggle{border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--tx2);
  border-radius:8px;padding:5px 9px;font-size:11px;cursor:pointer;font-family:var(--ff)}

/* ===================== TIPOGRAFÍA ===================== */
h1{font-size:clamp(26px,3.4vw,44px);line-height:1.05;letter-spacing:-.03em;margin:0;font-weight:800}
h2{font-size:clamp(21px,2.5vw,33px);line-height:1.1;letter-spacing:-.025em;margin:0;font-weight:800}
h3{font-size:15px;margin:0;font-weight:700;letter-spacing:-.01em}
h4{font-size:12.5px;margin:0;font-weight:700;color:var(--tx2)}
p{margin:0}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--verde-l);font-weight:700}
.eyebrow::before{content:"";width:24px;height:2px;background:linear-gradient(90deg,var(--verde),transparent);border-radius:2px}
.lead{font-size:clamp(14px,1.15vw,17px);color:var(--tx2);line-height:1.5;max-width:88ch}
.sub{font-size:13px;color:var(--tx2);line-height:1.5}
.tiny{font-size:11.5px;color:var(--tx3);line-height:1.45}
.mono{font-family:ui-monospace,Consolas,monospace}
.g{color:var(--verde-l)} .o{color:var(--oro)} .c{color:var(--coral)}
.hl{background:linear-gradient(180deg,transparent 62%,rgba(237,161,0,.35) 0);padding:0 2px}
.kbd{font-family:ui-monospace,Consolas,monospace;font-size:11px;border:1px solid var(--line2);
  border-radius:5px;padding:1px 5px;color:var(--tx2);background:rgba(255,255,255,.05)}

/* ===================== LAYOUT ===================== */
.row{display:flex;gap:clamp(10px,1.3vw,18px)}
.col{display:flex;flex-direction:column;gap:clamp(9px,1.2vh,16px)}
.grid{display:grid;gap:clamp(10px,1.1vw,16px)}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)} .g5{grid-template-columns:repeat(5,1fr)}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.scrolly{overflow:auto;min-height:0}

/* ===================== COMPONENTES ===================== */
.card{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:var(--r);padding:clamp(12px,1.3vw,20px);position:relative;overflow:auto;
  overflow-wrap:break-word;transition:.22s}
.card>.tag{position:absolute;top:0;left:0;width:100%;height:3px;background:var(--verde);opacity:.85}
.card.oro>.tag{background:var(--oro)} .card.vio>.tag{background:var(--violeta)}
.card.coral>.tag{background:var(--coral)} .card.cel>.tag{background:var(--celeste)}
.card.aqua>.tag{background:var(--aqua)}
.box{border:1px solid var(--line);border-radius:var(--r-s);padding:11px 13px;background:rgba(255,255,255,.035)}
.box.ok{border-color:rgba(0,192,106,.45);background:rgba(0,192,106,.09)}
.box.bad{border-color:rgba(239,83,80,.45);background:rgba(239,83,80,.09)}
.box.warn{border-color:rgba(237,161,0,.45);background:rgba(237,161,0,.09)}
.box.info{border-color:rgba(57,182,216,.45);background:rgba(57,182,216,.09)}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:999px;
  padding:3px 10px;font-size:11.5px;color:var(--tx2)}
.pill.v{border-color:rgba(0,160,90,.5);color:var(--verde-l);background:rgba(0,160,90,.10)}
.pill.o{border-color:rgba(237,161,0,.5);color:var(--oro);background:rgba(237,161,0,.10)}
.pill.p{border-color:rgba(123,107,214,.5);color:var(--violeta);background:rgba(123,107,214,.12)}
.pill.c{border-color:rgba(239,106,75,.5);color:var(--coral);background:rgba(239,106,75,.10)}
.pill.a{border-color:rgba(57,182,216,.5);color:var(--celeste);background:rgba(57,182,216,.10)}
.btn{border:1px solid var(--verde);background:rgba(0,160,90,.16);color:var(--verde-l);
  border-radius:999px;padding:8px 15px;font-size:13px;cursor:pointer;font-family:var(--ff);
  font-weight:600;transition:.18s}
.btn:hover{background:var(--verde-l);color:#04150e}
.btn.ghost{border-color:var(--line2);color:var(--tx2);background:transparent}
.btn.ghost:hover{border-color:var(--oro);color:var(--oro);background:rgba(237,161,0,.1)}
.btn.sm{padding:5px 11px;font-size:12px}
.btn.xs{padding:3px 9px;font-size:11.5px}
.num{font-size:clamp(22px,2.3vw,34px);line-height:1;color:var(--verde-l);font-weight:800}
.hr{height:1px;background:var(--line);margin:2px 0}

/* ===================== FORMULARIO ===================== */
label.fl{display:block;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);
  font-weight:700;margin-bottom:5px}
input.fi,textarea.fa,select.fs{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line2);
  border-radius:10px;color:var(--tx);font-family:var(--ff);font-size:13.5px;padding:9px 11px;
  line-height:1.5;transition:.16s;resize:vertical}
html[data-theme="light"] input.fi,html[data-theme="light"] textarea.fa,html[data-theme="light"] select.fs{background:#fff}
input.fi:focus,textarea.fa:focus,select.fs:focus{outline:none;border-color:var(--verde);
  background:rgba(0,160,90,.08);box-shadow:0 0 0 3px rgba(0,160,90,.14)}
textarea.fa{min-height:88px}
textarea.fa.tall{min-height:150px}
textarea.fa.short{min-height:56px}
select.fs option{background:var(--panel);color:var(--tx)}
html[data-theme="light"] select.fs option{background:#fff;color:#10241d}
.fcount{font-size:10.5px;color:var(--tx3);text-align:right;margin-top:3px;font-variant-numeric:tabular-nums}
.fcount.warn{color:var(--oro)} .fcount.ok{color:var(--verde-l)}
.frow{display:flex;gap:9px;align-items:flex-start}
.frow>*{flex:1;min-width:0}
.fdel{flex:none!important;width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);
  background:rgba(255,255,255,.05);color:var(--tx3);cursor:pointer;font-size:13px;line-height:1}
.fdel:hover{border-color:var(--coral);color:var(--coral)}

/* ===================== TABLAS ===================== */
table.tb{width:100%;border-collapse:collapse;font-size:12.5px}
table.tb th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);
  font-weight:700;padding:7px 9px;border-bottom:1px solid var(--line2);vertical-align:bottom}
table.tb td{padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--tx2)}
table.tb tr:last-child td{border-bottom:none}
table.tb input,table.tb textarea,table.tb select{width:100%;background:transparent;border:none;
  border-bottom:1px dashed var(--line2);color:var(--tx);font-family:var(--ff);font-size:12.5px;
  padding:4px 2px;resize:vertical}
table.tb input:focus,table.tb textarea:focus,table.tb select:focus{outline:none;border-bottom-color:var(--verde)}
table.tb select{border-bottom:1px dashed var(--line2)}
table.tb select option{background:var(--panel);color:var(--tx)}
html[data-theme="light"] table.tb select option{background:#fff;color:#10241d}

/* MML */
table.mml{width:100%;border-collapse:collapse;font-size:12px;min-width:820px}
table.mml th{background:rgba(0,160,90,.14);color:var(--verde-l);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;padding:8px;text-align:left;border:1px solid var(--line2);font-weight:700}
table.mml td{border:1px solid var(--line);padding:5px;vertical-align:top}
table.mml td textarea{width:100%;min-height:66px;background:transparent;border:none;color:var(--tx);
  font-family:var(--ff);font-size:12px;padding:4px;resize:vertical;line-height:1.45}
table.mml td textarea:focus{outline:none;background:rgba(0,160,90,.08);border-radius:6px}
table.mml td.lv{background:rgba(255,255,255,.04);width:15%}
table.mml .lvn{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--verde-l);font-weight:800}

/* árbol */
.tnode{display:flex;align-items:flex-start;gap:7px;border:1px solid var(--line2);border-radius:10px;
  padding:6px 9px;background:rgba(255,255,255,.045);transition:.16s}
.tnode.lv1{border-left:3px solid var(--coral)}
.tnode.lv2{border-left:3px solid var(--oro);margin-left:18px}
.tnode.lv3{border-left:3px solid var(--violeta);margin-left:36px}
.tnode.ef1{border-left:3px solid var(--celeste)}
.tnode.ef2{border-left:3px solid var(--aqua);margin-left:18px}
.tnode input{flex:1;min-width:0;background:transparent;border:none;color:var(--tx);font-size:12.5px;
  font-family:var(--ff);padding:2px}
.tnode input:focus{outline:none}
.tnode .lvb{flex:none;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);
  border:1px solid var(--line2);border-radius:6px;padding:1px 6px;cursor:pointer;background:transparent;
  font-family:var(--ff)}
.tnode .lvb:hover{border-color:var(--verde);color:var(--verde-l)}
.trunk{border:2px solid var(--verde);border-radius:13px;padding:11px 15px;background:rgba(0,160,90,.15)}
.trunk .lb{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--verde-l);font-weight:800}
.trunk .tx{font-size:14px;font-weight:700;line-height:1.35;margin-top:4px}
.mirror{display:grid;grid-template-columns:1fr 34px 1fr;gap:8px;align-items:center}
.mirror .ar{text-align:center;color:var(--verde-l);font-size:16px}

/* semáforo / progreso */
.meter{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--verde),var(--aqua));
  border-radius:6px;transition:width .45s cubic-bezier(.22,.9,.28,1)}
.meter.o i{background:linear-gradient(90deg,var(--oro),var(--coral))}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line2);flex:none}
.dot.ok{background:var(--verde)} .dot.part{background:var(--oro)}
.chk{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border:1px solid var(--line);
  border-radius:10px;background:rgba(255,255,255,.03);cursor:pointer;transition:.16s;font-size:12.5px;
  line-height:1.45;color:var(--tx2)}
.chk:hover{border-color:var(--line2)}
.chk input{margin-top:2px;accent-color:var(--verde);flex:none}
.chk.on{border-color:rgba(0,192,106,.45);background:rgba(0,192,106,.08);color:var(--tx)}

/* ítems del F01 */
.f01nav{display:flex;flex-wrap:wrap;gap:5px}
.f01b{width:33px;height:33px;border-radius:9px;border:1px solid var(--line2);background:rgba(255,255,255,.045);
  color:var(--tx2);font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--ff);position:relative;
  transition:.16s}
.f01b:hover{border-color:var(--verde);color:var(--verde-l)}
.f01b.on{background:var(--verde);border-color:var(--verde);color:#04150e}
.f01b.done::after{content:"";position:absolute;right:3px;bottom:3px;width:6px;height:6px;border-radius:50%;
  background:var(--verde-l)}
.f01b.on.done::after{background:#04150e}
.f01b.s2{border-color:rgba(237,161,0,.45)} .f01b.s2.on{background:var(--oro);border-color:var(--oro)}
.f01b.s3{border-color:rgba(123,107,214,.45)} .f01b.s3.on{background:var(--violeta);border-color:var(--violeta)}
.f01b.s4{border-color:rgba(57,182,216,.45)} .f01b.s4.on{background:var(--celeste);border-color:var(--celeste)}
.tk{list-style:none;padding:0;margin:0}
.tk li{position:relative;padding-left:16px;margin-top:5px;font-size:12.5px;color:var(--tx2);line-height:1.45}
.tk li::before{content:"◆";position:absolute;left:0;top:0;color:var(--verde-l);font-size:8px;line-height:1.9}
.tk.o li::before{color:var(--oro)} .tk.c li::before{color:var(--coral)}

/* esquema svg */
.esq{border:1px solid var(--line);border-radius:var(--r-s);padding:12px;background:rgba(255,255,255,.03);
  overflow:auto}
svg.esq-s{width:100%;height:auto;display:block;min-width:640px}

/* overlays */
.ov{position:fixed;inset:0;z-index:60;background:rgba(3,10,8,.9);backdrop-filter:blur(9px);
  display:none;flex-direction:column;padding:0}
html[data-theme="light"] .ov{background:rgba(240,246,243,.95)}
.ov.on{display:flex;animation:in .22s ease forwards}

<script>
"use strict";
/* =============================================================== DATOS */
var SC   = [{"n": 1, "t": "Producción de esponjas vegetales (Luffa cylindrica)", "lug": "Localidades urbanas y periurbanas de la provincia de Salta", "ent": "Urbano y periurbano", "tags": ["Urbano", "Producción", "Economía circular"], "amb": "Economía circular · producción de recursos naturales renovables", "res": "Productos de higiene y limpieza fabricados con plásticos de un solo uso, frente a una demanda creciente de alternativas biodegradables cuya oferta local es discontinua.", "sit": "Esponjas sintéticas, cepillos y elementos similares se fabrican con materiales plásticos o derivados del petróleo y tienen vida útil corta. Comercios especializados, ferias de emprendedores y consumidores manifiestan preferencia creciente por productos naturales y biodegradables, pero la disponibilidad local es variable en oferta, continuidad de abastecimiento y accesibilidad. La Luffa cylindrica es una cucurbitácea anual cuyo fruto seco desarrolla una red de fibras naturales aplicable a esponjas de baño y de vajilla, limpieza doméstica, cosmética natural y artesanías.", "ev": ["Se incrementaron las ferias de productos sustentables y los espacios para emprendedores en distintas localidades.", "Comercios de productos naturales incorporan progresivamente artículos reutilizables y biodegradables.", "Campañas de educación ambiental promueven la reducción del plástico de un solo uso.", "No se dispone de información que permita determinar si la oferta actual satisface la demanda potencial ni cuál sería la escala adecuada."], "con": ["Condiciones agroclimáticas diferentes según la región de la provincia.", "Existencia de pequeños productores y emprendimientos familiares con experiencia agrícola.", "Necesidad de desarrollar canales de comercialización y distribución.", "Disponibilidad variable de infraestructura de producción, procesamiento y almacenamiento."], "pre": ["¿Existe oportunidad para una iniciativa productiva vinculada a productos sustentables que responda a la situación planteada?", "¿Qué información habría que relevar para evaluar la viabilidad técnica, comercial, ambiental y económica?"], "alc": "La producción de esponja vegetal es <strong>una</strong> de las muchas alternativas que pueden surgir del árbol de problemas y objetivos: el equipo no debe necesariamente centrarse en ese recurso."}, {"n": 2, "t": "Restauración de sitios contaminados con hidrocarburos", "lug": "Área Puesto Guardián, departamento Orán", "ent": "Rural · área hidrocarburífera", "tags": ["Rural", "Restauración", "Residuos"], "amb": "Gestión ambiental de proyectos de inversión · restauración ecológica", "res": "Dos piletas de contingencia fuera de servicio desde el incidente del pozo MdT 14 (2007). La autoridad exige el cierre y la restauración; el propietario quiere ampliar la superficie agrícola.", "sit": "En 2007 se produjo el descontrol del pozo MdT 14, con emanación de petróleo y agua de formación de alto contenido salino. La empresa implementó un manejo de fluidos en tres etapas: separación de fases líquido/sólido en piletas, separación en piletas API con inyección de parte del agua en pozos sumideros, y acopio temporal del hidrocarburo en dos piletas en la Batería Puesto Guardián —una habilitada en la contingencia sin impermeabilizar, de 50 × 30 m y 1,5 a 2,5 m de profundidad, y otra construida por orden de la autoridad, impermeabilizada, de 50 × 50 × 3,5 m. El pozo fue controlado y el sector saneado; hoy la autoridad solicita el cierre y restauración del sector de piletas.", "ev": ["Las piletas se construyeron para una contingencia y no son instalaciones permanentes del proceso productivo.", "Ambas estructuras permanecen fuera de servicio.", "Hay información histórica del incidente, de los trabajos ejecutados y de las dimensiones generales de las piletas.", "Existen antecedentes de monitoreos ambientales en distintas etapas posteriores a la contingencia.", "El propietario pretende ampliar la superficie agropecuaria una vez finalizada la remediación."], "con": ["La empresa gestionó las autorizaciones provinciales para habilitar un sector de tratamiento de residuos peligrosos dentro de la batería.", "El establecimiento desarrolla hoy actividades agrícolas y ganaderas que coexisten con la infraestructura hidrocarburífera."], "pre": ["¿Cuál es el problema principal que plantea el escenario?", "¿Qué información adicional habría que relevar antes de definir una alternativa de intervención?", "¿Qué criterios deberían considerarse para determinar el destino futuro del sector intervenido?"], "alc": "La información presentada es sólo el punto de partida: el equipo debe identificar la información faltante, definir el problema central y fundamentar la alternativa seleccionada."}, {"n": 3, "t": "Producción de especies forestales nativas", "lug": "Distintas localidades de la provincia de Salta", "ent": "Urbano y periurbano", "tags": ["Urbano", "Producción", "Restauración"], "amb": "Restauración ecológica · producción de servicios ecosistémicos", "res": "Las campañas de forestación urbana no consiguen plantines nativos en tiempo, cantidad y calidad adecuados, mientras crece la demanda institucional y social de infraestructura verde.", "sit": "Diversos municipios, instituciones educativas, organizaciones sociales y vecinos impulsan iniciativas de forestación para mejorar la calidad ambiental, incrementar la cobertura vegetal y conservar la biodiversidad. Las especies nativas son especialmente valiosas por su adaptación local, su menor requerimiento hídrico y su aporte al mantenimiento de los ecosistemas. Sin embargo, en distintas oportunidades se registraron dificultades para acceder a plantines nativos en cantidades suficientes y con características adecuadas.", "ev": ["Municipios desarrollan periódicamente campañas de forestación urbana.", "Instituciones educativas y organizaciones sociales participan de actividades de plantación.", "Los viveros comerciales ofrecen sobre todo ornamentales exóticas; la disponibilidad de nativas es variable.", "La provincia presenta regiones con condiciones ambientales muy diferentes, lo que influye en la selección de especies.", "La información disponible no permite determinar si la oferta actual satisface la demanda potencial."], "con": ["Diversidad de condiciones climáticas y ecológicas dentro de la provincia.", "Disponibilidad variable de agua para riego.", "Diferencias de accesibilidad y logística entre localidades.", "Programas públicos y normativa vinculada al arbolado urbano y la conservación."], "pre": ["¿Existe una necesidad insatisfecha vinculada con la provisión de especies arbóreas nativas?", "¿Qué información habría que relevar para comprender la magnitud de la demanda?"], "alc": "Se ajusta a las exigencias académicas de la asignatura; el equipo define el problema central y fundamenta la propuesta con las herramientas del cursado."}, {"n": 6, "t": "Aprovechamiento del agua de lluvia en edificios e instituciones", "lug": "Departamento Capital · el equipo selecciona un edificio o institución", "ent": "Urbano", "tags": ["Urbano", "Agua", "Ecoeficiencia"], "amb": "Ecoeficiencia · saneamiento ambiental", "res": "Se consume agua potable en usos que no la requieren, mientras la escorrentía de cubiertas se conduce al desagüe pluvial sin aprovechamiento.", "sit": "En numerosos edificios públicos, instituciones educativas, establecimientos deportivos e instalaciones comunitarias se utilizan volúmenes importantes de agua potable para riego de espacios verdes, limpieza de instalaciones o alimentación de sistemas sanitarios. Al mismo tiempo, durante la temporada de lluvias se generan volúmenes importantes de escorrentía desde cubiertas y superficies impermeables que en la mayoría de los casos se conducen directamente al sistema de desagües sin ningún tipo de aprovechamiento.", "ev": ["Diversas instituciones poseen superficies de cubierta con potencial de captación.", "Existen antecedentes nacionales e internacionales de sistemas de captación aplicados en edificios.", "Hay tecnologías disponibles en el mercado para captación, almacenamiento y utilización.", "No se dispone de información sobre la factibilidad técnica, económica y ambiental en los distintos edificios del departamento."], "con": ["Régimen de precipitaciones del Valle de Lerma, con marcada estacionalidad.", "Diversidad de usos y consumos de agua según el tipo de edificio.", "Tecnologías de almacenamiento, conducción y tratamiento adaptables a distintas escalas.", "Necesidad de considerar aspectos técnicos, sanitarios, económicos, ambientales y normativos."], "pre": ["¿Existe oportunidad de optimizar el uso del agua aprovechando las precipitaciones en el edificio seleccionado?", "¿Qué información habría que relevar para evaluar la viabilidad técnica, económica, ambiental e institucional?"], "alc": "Cada equipo selecciona un edificio o institución del departamento Capital como objeto de estudio."}, {"n": 9, "t": "Ochocientas hectáreas fiscales en el borde este de Salta", "lug": "Departamento Capital · predio fiscal de ~800 ha sobre la RN 9, a 6 km del centro", "ent": "Periurbano · interfaz campo–ciudad", "tags": ["Periurbano", "Espacios públicos", "Restauración", "Agua"], "amb": "Restauración urbana · conservación de ecosistemas · gestión ambiental del territorio", "res": "Deterioro simultáneo de las condiciones de habitabilidad de la población del borde este y de la base natural que la sostiene, sobre el último remanente continuo de vegetación nativa del sector.", "sit": "En quince años el sector registró dos frentes de avance de signo opuesto: urbanizaciones cerradas por el norte y ocupación informal ladera arriba por el oeste, mientras el ejido agotó su suelo vacante interior. La oferta habitacional formal no alcanza; predominan la autoconstrucción y las tipologías precarias. El sector no dispone de espacios verdes públicos: una única plaza reducida y en pendiente, y una escuela con patio insuficiente. La red de agua se interrumpe en el límite del área consolidada y las cotas superiores se abastecen por camión cisterna; no hay red cloacal ni gas, con vuelco a pozo absorbente sobre el mismo reservorio del que se extrae el agua. Sobre el predio se registran extracción de leña y áridos, pastoreo, quema de pastizales y microbasurales perimetrales.", "ev": ["La ciudad registra la mayor tasa de crecimiento poblacional entre las diez más grandes del país; el aglomerado se expandió 4.430 ha, el 91 % residencial, y restan 342 ha de vacíos urbanos (2,32 % de la mancha urbana).", "El inventario forestal describe un bosque joven con 32 especies leñosas nativas —dos con categoría de conservación desfavorable— y 82 especies de aves y 6 de mamíferos.", "El escurrimiento descarga por las alcantarillas del corredor vial, único punto de salida; el cauce receptor está revestido, sin capacidad ociosa, y descarga sobre un sector de riesgo hídrico crítico.", "La cuenca visual se observa desde veinte puntos sobre la ruta, con capacidad de acogida media; la prospección arqueológica no detectó evidencias en superficie.", "Consultada la población sobre un cambio de usos del suelo, una amplia mayoría se manifestó a favor; entre los reparos, la pérdida de áreas verdes, el aumento del escurrimiento y la competencia por el agua."], "con": ["Cobertura boscosa sujeta al régimen provincial de bosques nativos, recientemente actualizado.", "Cabecera de cuenca y zona de conducción de un acuífero de escasa dimensión; suelos erosionables; pendientes superiores al 30 % en la mitad alta; zona sísmica.", "Redes de agua, cloaca y gas interrumpidas; una única línea de transporte público.", "Irregularidad dominial en los barrios vecinos; municipios metropolitanos con normativas dispares.", "Oportunidad: mayor superficie continua disponible en el borde de una ciudad sin vacíos urbanos, bajo un único dominio y titularidad pública; existen instrumentos de concesión de uso, APP y financiamiento internacional."], "pre": ["Si no se tomara ninguna decisión sobre este predio, ¿cómo estaría el territorio en diez años y quién estaría pagando ese resultado?", "¿Qué problema justificaría intervenir, sobre quiénes se manifiesta, y cuántas maneras genuinamente distintas de encararlo pueden imaginarse antes de elegir una?", "Si dos alternativas fueran buenas en aspectos distintos —una con mayor retorno económico, otra con mayor conservación de bosque y agua—, ¿con qué criterio decidir y quién debería ejecutarla?"], "alc": "La información es deliberadamente incompleta. El equipo debe explicitar y fundamentar los supuestos que adopte, y evaluar la alternativa seleccionada incluyendo las vías de inversión y los beneficios y costos ambientales asociados."}, {"n": 10, "t": "Gestión integral de residuos en un establecimiento porcino", "lug": "Departamento Rosario de Lerma · predio rural de ~120 ha del Valle de Lerma", "ent": "Rural de población dispersa", "tags": ["Rural", "Residuos", "Agua", "Producción"], "amb": "Gestión ambiental de proyectos de inversión · economía circular", "res": "Tres corrientes de residuos —líquida, sólida y gaseosa— acopladas entre sí, con observaciones de la autoridad en el expediente de renovación del certificado de aptitud ambiental.", "sit": "El establecimiento opera hace más de una década en ciclo completo, coloca del orden de 160 capones por semana y emplea trece personas. Las corrientes líquidas son los purines originados bajo el piso enrejillado, acumulados en fosas y trasladados a piletas junto con el agua de limpieza. Las sólidas comprenden la fracción separable de deyecciones, la mortandad, las placentas y los residuos de sanidad animal. Las gaseosas incluyen amoníaco y sulfuro de hidrógeno desde fosas y piletas —responsables del olor percibido por el vecindario— y metano de digestión anaerobia espontánea, hoy liberado mientras el establecimiento compra gas para calefacción. Las fosas no drenan por completo; una pileta tiene un talud roto con pérdida al terreno natural; la playa de compostaje opera muy por debajo de su capacidad. En los pozos de monitoreo propios se detectaron coliformes por encima de los valores admisibles.", "ev": ["No se cuantifica el volumen de efluente generado ni se analiza su composición de manera sistemática.", "Los purines presentaron DQO y DBO entre treinta y cuarenta veces los umbrales provinciales, y coliformes fecales tres órdenes de magnitud sobre el límite.", "El consumo se estima en 18 litros por animal y por día más el lavado, de una perforación propia: casi todo lo que ingresa sale como corriente a gestionar.", "La playa de compostaje ocupa 1.080 m², opera al 30 % de su capacidad y no controla temperatura ni rotación de pilas.", "El inventario provincial estima las emisiones del sector porcino en 109.548 t CO₂e/año, con la mayor parte del metano proveniente de la gestión del estiércol.", "No existe cartografía provincial de acuíferos someros ni registro de pozos de agua potable en el área."], "con": ["Las tres corrientes están vinculadas: la solución que se adopte para una modifica el volumen, la composición y el valor de las otras dos.", "La adecuación debe ejecutarse sin detener la producción, con animales en las naves.", "La aplicación agronómica exige superficie, balance de nutrientes y ventanas compatibles con el régimen de lluvias.", "No existe norma provincial que regule la actividad pecuaria intensiva ni protocolo de uso agronómico de purines.", "El metano que hoy se pierde es energía que el establecimiento compra en otra forma; la playa de compostaje es capacidad instalada ociosa."], "pre": ["¿Cuál es el problema central que plantea el escenario y sobre quiénes recae?", "El establecimiento operó una década sin invertir en gestión de residuos: ¿significa eso que no tuvo costo?", "¿Qué aspectos técnicos, ambientales, legales, sociales y económicos habría que analizar desde el punto de vista del titular privado?"], "alc": "La gestión integral admite múltiples alternativas que surgirán del árbol de problemas y objetivos: no hay que centrarse en una tecnología de tratamiento en particular."}];      /* los seis escenarios */
var SOL  = {"1": {"n": 1, "pc": "La oferta local de esponjas vegetales de Luffa cylindrica abastece en forma discontinua e irregular a los comercios especializados, las ferias de emprendedores y los consumidores de las localidades urbanas y periurbanas de la provincia de Salta.", "pcjus": "El escenario describe una demanda creciente y verificable —más ferias de productos sustentables, más comercios que incorporan artículos reutilizables, campañas de reducción del plástico de un solo uso— frente a una oferta cuya continuidad y accesibilidad son variables; la situación negativa existente es esa discontinuidad del abastecimiento, no la carencia de un equipamiento determinado. Se descartó «falta de una planta procesadora de luffa en la provincia» porque enuncia como problema la solución que alguien ya eligió: si se la adopta, el análisis de alternativas queda cerrado antes de abrir el árbol y desaparecen del análisis la comercialización, la habilitación y la información de demanda. Se descartó «la gente no tiene conciencia ambiental» porque es un juicio sobre las personas, no una situación verificable ni mensurable, y traslada al consumidor un problema que el propio escenario ubica en la oferta. Se descartó también «falta de financiamiento para los emprendedores», que aparece en el árbol como causa de segundo nivel del corte productivo entre cosechas y no como problema central. Finalmente se descartó «existe demanda insatisfecha de productos biodegradables», porque el escenario advierte de manera explícita que no se dispone de información que permita determinar si la oferta actual satisface la demanda potencial: afirmar la insatisfacción como problema central sería dar por probado justamente lo que hay que relevar.", "objc": "La oferta local de esponjas vegetales de Luffa cylindrica abastece en forma continua y regular a los comercios especializados, las ferias de emprendedores y los consumidores de las localidades urbanas y periurbanas de la provincia de Salta.", "sit": [{"id": "s1", "t": "La oferta local de esponjas vegetales de Luffa cylindrica abastece en forma discontinua e irregular a los comercios especializados, las ferias de emprendedores y los consumidores de las localidades urbanas y periurbanas de la provincia de Salta.", "k": "p", "d": "eco"}, {"id": "s2", "t": "Los comercios especializados y las ferias discontinúan la compra de esponjas vegetales y reasignan ese espacio de venta a productos sintéticos o de origen externo a la provincia.", "k": "e", "d": "eco"}, {"id": "s3", "t": "Los consumidores que declaran preferencia por alternativas biodegradables sostienen la compra de esponjas plásticas de un solo uso por ser el producto efectivamente disponible.", "k": "e", "d": "soc"}, {"id": "s4", "t": "Se mantiene la generación de residuos plásticos de vida útil corta y baja degradabilidad en las localidades urbanas y periurbanas de la provincia.", "k": "e", "d": "amb"}, {"id": "s5", "t": "Los emprendimientos familiares no consolidan ingresos estables con la actividad y la conservan como ingreso marginal o la abandonan entre temporadas.", "k": "e", "d": "eco"}, {"id": "s6", "t": "Se pierde la experiencia productiva acumulada en el cultivo y el procesamiento de la fibra, y las campañas de educación ambiental quedan sin producto local que las respalde.", "k": "e", "d": "soc"}, {"id": "s7", "t": "El acondicionamiento poscosecha del fruto —lavado, secado, blanqueo, corte y empaque— se resuelve de manera artesanal y sin criterios comunes, con calidad heterogénea entre productores.", "k": "c", "d": "tec"}, {"id": "s8", "t": "Los emprendimientos interrumpen la producción entre cosechas porque no disponen de capital de trabajo para sostener el secado, el acopio y el empaque fuera de la temporada de fruto.", "k": "c", "d": "eco"}, {"id": "s9", "t": "La cadena de comercialización se rearma en cada temporada mediante acuerdos informales, sin compromisos de entrega ni programación de volúmenes entre productores y comercios.", "k": "c", "d": "eco"}, {"id": "s10", "t": "Los productores desconocen qué habilitación y qué requisitos debe cumplir un artículo de higiene personal y doméstica para ingresar de manera regular al circuito comercial formal.", "k": "c", "d": "ins"}, {"id": "s11", "t": "Las parcelas en producción están dispersas y distantes de las localidades donde se concentran las ferias y los comercios que compran, con costos de flete que la escala actual no absorbe.", "k": "c", "d": "ter"}, {"id": "s12", "t": "La demanda provincial de esponjas vegetales no está dimensionada: no se conoce el volumen anual, la calidad ni la estacionalidad que requieren los comercios y las ferias.", "k": "c", "d": "eco"}, {"id": "s13", "t": "La capacidad instalada de secado y almacenamiento de los emprendimientos no permite conservar la fibra en condiciones adecuadas durante todo el año.", "k": "c", "d": "tec"}, {"id": "s14", "t": "Los productores familiares conducen el cultivo y el procesamiento con conocimientos transmitidos de manera informal, sin asistencia técnica sistematizada ni protocolos escritos.", "k": "c", "d": "soc"}, {"id": "s15", "t": "El cultivo se conduce sin planificación del riego ni manejo del suelo, con rendimientos y calidad de fibra muy variables entre campañas y entre predios.", "k": "c", "d": "amb"}, {"id": "s16", "t": "Los programas públicos de asistencia técnica y financiamiento a emprendedores no alcanzan a los productores de la actividad, que desconocen sus requisitos, ventanillas y plazos.", "k": "c", "d": "ins"}, {"id": "s17", "t": "Las regiones provinciales con aptitud agroclimática para el cultivo no están identificadas y cada productor define la localización por ensayo y error.", "k": "c", "d": "ter"}], "lnk": [{"a": "s7", "b": "s1"}, {"a": "s8", "b": "s1"}, {"a": "s9", "b": "s1"}, {"a": "s10", "b": "s1"}, {"a": "s11", "b": "s9"}, {"a": "s12", "b": "s9"}, {"a": "s12", "b": "s8"}, {"a": "s13", "b": "s7"}, {"a": "s13", "b": "s8"}, {"a": "s14", "b": "s7"}, {"a": "s15", "b": "s7"}, {"a": "s16", "b": "s8"}, {"a": "s16", "b": "s14"}, {"a": "s17", "b": "s15"}, {"a": "s17", "b": "s11"}, {"a": "s1", "b": "s2"}, {"a": "s2", "b": "s3"}, {"a": "s3", "b": "s4"}, {"a": "s1", "b": "s5"}, {"a": "s5", "b": "s6"}], "obj": {"s1": "La oferta local de esponjas vegetales de Luffa cylindrica abastece en forma continua y regular a los comercios especializados, las ferias de emprendedores y los consumidores de las localidades urbanas y periurbanas de la provincia de Salta.", "s2": "Los comercios especializados y las ferias sostienen la compra de esponjas vegetales y mantienen el espacio de venta asignado al producto local.", "s3": "Los consumidores que prefieren alternativas biodegradables encuentran el producto disponible y sustituyen efectivamente la esponja plástica de un solo uso.", "s4": "Se reduce la generación de residuos plásticos de vida útil corta y baja degradabilidad en las localidades urbanas y periurbanas de la provincia.", "s5": "Los emprendimientos familiares consolidan ingresos estables con la actividad y la sostienen entre temporadas.", "s6": "Se conserva y se transmite la experiencia productiva en el cultivo y el procesamiento de la fibra, y las campañas de educación ambiental cuentan con producto local que las respalda.", "s7": "El acondicionamiento poscosecha del fruto se realiza con criterios comunes y calidad homogénea entre productores.", "s8": "Los emprendimientos sostienen la producción entre cosechas con capital de trabajo suficiente para el secado, el acopio y el empaque.", "s9": "La cadena de comercialización opera con acuerdos formales de entrega y programación de volúmenes entre productores y comercios.", "s10": "Los productores conocen y cumplen los requisitos de habilitación exigidos a un artículo de higiene personal y doméstica para su comercialización formal.", "s11": "La producción dispersa se articula en puntos de concentración accesibles desde las localidades donde están las ferias y los comercios, con costos de flete absorbidos por la escala agregada.", "s12": "La demanda provincial de esponjas vegetales está dimensionada en volumen, calidad y estacionalidad, y la información se actualiza periódicamente.", "s13": "La capacidad de secado y almacenamiento disponible permite conservar la fibra en condiciones adecuadas durante todo el año.", "s14": "Los productores familiares conducen el cultivo y el procesamiento con asistencia técnica sistematizada y protocolos escritos.", "s15": "El cultivo se conduce con planificación del riego y manejo del suelo, con rendimientos y calidad de fibra estables entre campañas.", "s16": "Los programas públicos de asistencia técnica y financiamiento a emprendedores llegan a los productores de la actividad, que conocen sus requisitos, ventanillas y plazos.", "s17": "Las regiones provinciales con aptitud agroclimática para el cultivo están identificadas y los productores deciden la localización con esa información."}, "f01": {"A": "Propuesta de ejemplo: «Fibra Norte S.H.». El nombre reúne la materia prima con la que trabaja el proyecto —la fibra vegetal— y el territorio de actuación, es corto, pronunciable y admite uso comercial posterior, en línea con el criterio de la Guía de elegirlo como si se iniciara una actividad económica real. Se declara sociedad de hecho, sin definir todavía tipo societario.\nEs un ejemplo de respuesta válida y no la única: también cumplen la consigna nombres como «Luffa Salta», «Esponja Viva» o una sigla del equipo, siempre que sean breves, se vinculen al ámbito de actuación y no describan el proyecto.\nControl de corrección: este nombre no es el nombre del proyecto de inversión, que recién se define en el ítem V. Si el equipo escribe acá algo del tipo «Proyecto de producción de esponjas vegetales», confundió los dos ítems.", "B": "Estructura de roles esperable para un equipo de cinco integrantes, sin nombres reales:\n· Integrante 1 — Coordinación general y consolidación del formulario. Perfil: estudiante avanzado con experiencia en gestión de equipos. Dedicación: 16 h.\n· Integrante 2 — Búsqueda y sistematización de información secundaria (ferias, comercios, normativa de habilitación, antecedentes de cultivo de Luffa). Perfil: manejo de fuentes oficiales y bases estadísticas. Dedicación: 14 h.\n· Integrante 3 — Construcción del árbol de problemas y del árbol de objetivos, y control de coherencia causa/efecto. Perfil: analítico, formación en marco lógico. Dedicación: 14 h.\n· Integrante 4 — Redacción, edición y paratextos (mapa de localización, esquema de la cadena, tablas). Perfil: redacción técnica y cartografía básica. Dedicación: 12 h.\n· Integrante 5 — Enlace institucional: consultas a productores, feriantes y áreas municipales; registro de entrevistas. Perfil: comunicación y trabajo de campo. Dedicación: 12 h.\nTotal declarado: 68 h efectivamente trabajadas en esta entrega. Metodología acordada: una reunión presencial semanal de dos horas más trabajo asincrónico en documento compartido; comunicación por grupo de mensajería y correo para la cátedra. La coordinación es rotativa y removible por mayoría, informando el cambio a la cátedra por correo.\nSólo se declaran horas efectivamente trabajadas y sólo integran la tabla quienes aportaron a esta entrega.", "C": "Ámbito declarado: economía circular y producción de recursos naturales renovables. El escenario los presenta juntos y ambos corresponden, porque las categorías de la Guía no son mutuamente excluyentes.\n· Producción de recursos naturales renovables: el núcleo del proyecto es la producción agrícola de una cucurbitácea anual (Luffa cylindrica) y el procesamiento de su fruto seco para obtener fibra, es decir, la generación de un bien a partir de un recurso biológico renovable en ciclo anual.\n· Economía circular: el producto resultante sustituye artículos de higiene y limpieza fabricados con plásticos de un solo uso y derivados del petróleo, de vida útil corta, por un bien biodegradable y compostable al final de su vida útil; el residuo del procesamiento (semillas, cáscara, fibra descartada) admite reincorporación como semilla, compost o subproducto.\nÉnfasis elegido: producción de recursos naturales renovables, porque el problema central se ubica en el eslabón de oferta —la continuidad y la regularidad del abastecimiento— y no en la gestión del residuo plástico, que en este árbol es un efecto y no el problema.\nEste ítem se completó después de redactar el D, tal como recomienda la Guía: el ámbito se elige una vez que el problema está definido.", "D": "Problema identificado: la oferta local de esponjas vegetales de Luffa cylindrica abastece en forma discontinua e irregular a los comercios especializados, las ferias de emprendedores y los consumidores de las localidades urbanas y periurbanas de la provincia de Salta.\nIdentidad: el sujeto afectado es el circuito local de abastecimiento de productos de higiene biodegradables —productores, comercios y ferias— y el consumidor que no encuentra el producto. Ubicación: localidades urbanas y periurbanas de Salta. Tiempo: situación presente y persistente, que se agudiza mientras crecen las ferias sustentables. Mensurabilidad: continuidad del abastecimiento, medida en semanas del año con producto en góndola y en pedidos cumplidos en volumen y plazo. Magnitud: el escenario no aporta el valor y advierte que no hay información sobre demanda potencial; la línea de base se construye en el ítem E.\nSe verificó que no es causa ni efecto del árbol y que no está escrito como «falta de…»: no afirma la ausencia de una planta ni de financiamiento, sino un desempeño deficiente del abastecimiento existente.", "E": "Indicador principal (situación sin proyecto): proporción de semanas del año con esponja vegetal de producción local disponible en los comercios especializados y ferias relevados de las localidades urbanas y periurbanas de Salta, medida durante doce meses, según el registro de disponibilidad en góndola a construir por el proyecto.\nValor de línea de base: el escenario no aporta la cifra. Se asume, como primera aproximación y a modo de supuesto numerado, disponibilidad en el orden del 30 % de las semanas del año, concentrada en el período posterior a la cosecha (se asume ese valor a partir del carácter anual del cultivo y de la ausencia de capacidad de secado y acopio descrita en el escenario; a verificar en el F02). No se deja el casillero en blanco ni se escribe «no se dispone de datos».\nIndicadores complementarios:\n· Porcentaje de pedidos de comercios entregados en volumen y plazo acordados, por temporada, en el conjunto de emprendimientos relevados, según planillas de pedido y entrega a construir. Supuesto de partida: inferior al 50 % (a verificar en el F02).\n· Cantidad de emprendimientos que sostienen entregas al menos una vez por mes durante doce meses consecutivos, en las localidades del área de intervención, según registro de la asociación de productores o de las ferias municipales. Supuesto de partida: muy pocos, del orden de uno a tres (a verificar en el F02).\n· Rechazo por calidad no conforme (fibra manchada, con hongos o de calibre dispar) sobre el total entregado, por temporada, según acta de recepción del comercio.\nLo que el escenario ya aporta: el crecimiento de ferias y espacios para emprendedores, la incorporación progresiva de artículos reutilizables en comercios de productos naturales, las campañas de reducción del plástico de un solo uso y la constancia explícita de que no hay información sobre demanda potencial ni sobre escala adecuada. Lo que hay que relevar: censo de comercios y ferias que venden o venderían el producto, volumen y calidad demandados por cada uno, estacionalidad de la demanda, cantidad y localización de productores en actividad, capacidad instalada de secado y acopio, y precios comparados con el sustituto sintético e importado.\nControl SMART: el indicador principal es específico (disponibilidad en góndola), mensurable (registro semanal), alcanzable (el proyecto puede incidir sobre secado, acopio y programación de entregas), relevante (mide exactamente la continuidad, que es el atributo negativo del problema) y temporal (ventana de doce meses).", "F": "Contexto geográfico y territorial: el proyecto se localiza en las localidades urbanas y periurbanas de la provincia de Salta, con producción agrícola en las áreas periurbanas y rurales próximas. El escenario señala condiciones agroclimáticas diferentes según la región de la provincia, de modo que la aptitud para un cultivo estival anual como Luffa cylindrica no es homogénea: hay valles y zonas de menor riesgo de heladas tempranas donde el fruto alcanza madurez y secado en planta, y regiones donde no. Esa heterogeneidad, sumada a la distancia entre las zonas aptas y las localidades donde están las ferias y los comercios, es una característica del contexto que potencia el problema, porque encarece la logística y fragmenta la oferta.\nContexto social y económico: existen pequeños productores y emprendimientos familiares con experiencia agrícola previa, que son la base productiva sobre la que el proyecto se apoya; su lógica es de escala pequeña, mano de obra familiar y capital de trabajo escaso. Del lado de la demanda, se incrementaron las ferias de productos sustentables y los espacios para emprendedores en distintas localidades, y los comercios de productos naturales incorporan progresivamente artículos reutilizables y biodegradables; las campañas de educación ambiental que promueven la reducción del plástico de un solo uso operan como impulsor de esa demanda. Todo esto contribuye a la solución. En contra juegan la disponibilidad variable de infraestructura de producción, procesamiento y almacenamiento y la necesidad —explícita en el escenario— de desarrollar canales de comercialización y distribución.\nContexto ambiental: el producto sustituido —esponjas sintéticas, cepillos y elementos similares de plástico o derivados del petróleo— tiene vida útil corta y termina en el flujo de residuos sólidos urbanos, con degradación muy lenta y aporte a la fracción de microplásticos. Del lado del producto sustituto, el cultivo es una cucurbitácea anual que requiere agua en el período estival y suelo bien drenado, y el procesamiento (lavado, eventual blanqueo, secado) genera efluentes y residuos vegetales que deben ser considerados para no trasladar el problema ambiental de un lado a otro.\nVacíos de información: no se dispone de datos publicados sobre superficie sembrada, cantidad de productores, volumen comercializado ni precios del producto en la provincia. Todo dato de esta sección que no provenga del escenario se declara como supuesto y se verifica en el F02; se evita convertir la línea de base en una descripción geográfica general del territorio.", "G": "Población potencial (la afectada por el problema): el conjunto de actores del circuito local de esponjas vegetales en las localidades urbanas y periurbanas de la provincia de Salta. La integran tres subconjuntos: los pequeños productores y emprendimientos familiares con experiencia agrícola que producen o podrían producir el fruto; los comercios de productos naturales, dietéticas, ferias de emprendedores y espacios de venta sustentable que quieren ofrecer el producto y no consiguen abastecimiento regular; y los consumidores que manifiestan preferencia por productos naturales y biodegradables y no los encuentran de manera continua. El escenario no aporta la cuantificación de ninguno de los tres, y expresamente advierte que no hay información sobre demanda potencial: el censo de comercios, ferias y productores es una tarea del F02.\nPoblación objetivo (los beneficiarios directos que el proyecto puede atender): un subconjunto acotado de la potencial, definido por tres criterios de recorte. Criterio territorial: emprendimientos localizados dentro del radio de acopio del centro asociativo, de modo que el flete sea absorbible por la escala agregada. Criterio de actividad: productores con experiencia agrícola previa y al menos una campaña realizada, y comercios y ferias con venta activa de artículos reutilizables. Criterio de escala del proyecto: capacidad de procesamiento y acopio del centro en su primer ciclo.\nCuantificación: se asume una población objetivo del orden de 15 a 25 unidades productivas familiares y de 20 a 40 puntos de venta entre comercios y puestos de feria en el primer ciclo de operación (supuesto adoptado por capacidad esperable de un centro asociativo de escala familiar; a verificar en el F02 con el censo de productores y el relevamiento de comercios).\nNo se declara como población objetivo «toda la comunidad»: el proyecto no puede atender al total de la población potencial en su primer ciclo, y la fracción alcanzada es la que se explicita arriba. Los consumidores son beneficiarios indirectos, no destinatarios directos de los bienes y servicios que el proyecto entrega.", "H": "Se usa escala numérica de 0 a 1 para fuerza e importancia, la misma para ambas columnas.\n· Productores y emprendimientos familiares de Luffa · Sector privado, agricultura familiar · Posición a favor · Fuerza 0,8 (sin su adhesión no hay materia prima ni asociativismo posible; pueden retirarse del esquema si el precio de referencia no los convence) · Importancia 1,0 (son beneficiarios directos y el sujeto de la componente) · Interés: precio estable, cobro en plazo corto y colocación asegurada.\n· Comercios especializados y dietéticas · Sector privado, comercio minorista · Posición a favor · Fuerza 0,7 (deciden la asignación de espacio de venta y son quienes firman los compromisos de entrega) · Importancia 0,8 · Interés: abastecimiento regular, calidad homogénea y precio competitivo frente al sustituto importado.\n· Organizadores de ferias de emprendedores y espacios de venta sustentable · Sociedad civil / gestión municipal · Posición a favor · Fuerza 0,5 · Importancia 0,7 · Interés: sostener la diversidad de oferta local y la continuidad de los puestos.\n· Municipios de las localidades de intervención (áreas de producción, bromatología y habilitaciones comerciales) · Institución pública · Posición a favor pero con reservas · Fuerza 0,8 (habilitan el establecimiento de procesamiento y el uso del espacio de feria; pueden demorar la puesta en marcha) · Importancia 0,7 · Interés: cumplimiento de requisitos de habilitación y trazabilidad del producto.\n· Autoridad provincial de ambiente y de desarrollo productivo / agricultura familiar · Institución pública · Posición a favor · Fuerza 0,7 (aporta asistencia técnica y eventual financiamiento, y su ausencia deja el proyecto sin apoyo institucional) · Importancia 0,6 · Interés: fortalecimiento de la agricultura familiar y reducción del plástico de un solo uso.\n· Importadores y distribuidores mayoristas de esponjas sintéticas y de esponjas vegetales importadas · Sector privado · Posición en contra · Fuerza 0,6 (pueden bajar precio, ofrecer bonificaciones por volumen o exclusividad de góndola y desplazar al producto local) · Importancia 0,5 · Interés: conservar participación de mercado. Estrategia hacia este actor: diferenciar por origen local, trazabilidad y acuerdo de entrega, no competir sólo por precio.\n· Consumidores de las localidades urbanas y periurbanas · Sociedad civil · Posición indiferente en el punto de partida (declaran preferencia pero compran lo disponible) · Fuerza 0,4 · Importancia 0,6 · Interés: precio, desempeño del producto y disponibilidad efectiva. Estrategia: información en punto de venta e instrucciones de uso y compostado.\nEl listado incluye deliberadamente un actor con posición contraria y uno indiferente: el análisis sirve para anticipar bloqueos, no para enumerar aliados.", "I": "El titular del proyecto sería una asociación de productores de esponja vegetal constituida a tal efecto —cooperativa de trabajo o asociación civil de productores de la agricultura familiar—, que es la figura coherente con una componente asociativa de acopio y comercialización y con la escala de los emprendimientos familiares descriptos en el escenario. Mientras esa figura no esté constituida, el titular transitorio puede ser el municipio de la localidad sede del centro, a través de su área de desarrollo productivo, bajo convenio con los productores.\nOrganizaciones de las que depende directamente la realización del proyecto:\n· Municipio de la localidad sede: habilitación comercial e industrial del establecimiento de procesamiento y acopio, habilitación bromatológica municipal cuando corresponda, y autorización de uso del espacio en ferias.\n· Autoridad provincial de ambiente: encuadre ambiental del emprendimiento y, si corresponde por escala, certificado de aptitud ambiental del establecimiento.\n· Autoridad provincial de desarrollo productivo y de agricultura familiar: registro del emprendimiento familiar, asistencia técnica y acceso a líneas de financiamiento.\n· Autoridad nacional competente en productos de higiene personal y domisanitarios: inscripción o encuadre del producto según su clasificación, requisito para la venta regular en comercio formal.\n· Organismo nacional de semillas: encuadre de la provisión y multiplicación de semilla del cultivo.\n· Eventual organismo financista (banca pública de desarrollo, programa provincial o nacional de apoyo a emprendedores, cooperación internacional): financiamiento de la inversión en secado y acopio.\nEn esta instancia sólo se identifica ante quién habría que tramitar cada cosa. No se anticipan gestiones: los convenios, comodatos y autorizaciones corresponden al pasaje de perfil a prefactibilidad. Todos estos actores figuran también en el ítem H, y esa correspondencia fue verificada.", "J": "Matriz de cumplimiento legal, con las normas seleccionadas por su relevancia para ejecutar el proyecto y no como listado exhaustivo del derecho ambiental. Cuando no hay certeza sobre el número exacto de una norma, se la nombra por su materia y se verifica su vigencia y texto ordenado antes del F02.\nNivel nacional:\n· Ley General del Ambiente N° 25.675: presupuestos mínimos, principios de prevención y precaución, evaluación de impacto ambiental y seguro ambiental. Aplica al establecimiento de procesamiento.\n· Régimen nacional de habilitación, registro y rotulado de productos de higiene personal, cosméticos y domisanitarios, y sus resoluciones reglamentarias: define bajo qué categoría se inscribe la esponja vegetal y qué requisitos de rotulado y trazabilidad debe cumplir para su venta formal. Es el requisito que la causa s10 del árbol identifica como desconocido por los productores.\n· Régimen nacional de semillas y creaciones fitogenéticas: identidad, calidad y comercio de la semilla del cultivo.\n· Régimen nacional de agricultura familiar, campesina e indígena: registro del emprendimiento y acceso a instrumentos de apoyo.\n· Régimen nacional de gestión de envases y de reducción de plásticos de un solo uso, en la medida en que se encuentre vigente o en tratamiento: eventual impulsor de la demanda del producto sustituto. Debe verificarse su estado parlamentario antes de citarlo como norma aplicable.\n· Legislación laboral y de higiene y seguridad en el trabajo aplicable al personal del centro de procesamiento.\nNivel provincial (Salta):\n· Ley de Protección del Medio Ambiente de la Provincia de Salta N° 7.070 y su reglamentación: encuadre ambiental del establecimiento, certificado de aptitud ambiental, gestión de efluentes del lavado y de residuos del procesamiento.\n· Normativa provincial de uso del agua y de derecho de riego: la fuente y el permiso de uso del agua para el cultivo y para el lavado de la fibra.\n· Normativa provincial de sanidad y calidad agroalimentaria y de promoción de la agricultura familiar.\n· Normativa provincial de promoción industrial y de apoyo a micro, pequeñas y medianas empresas, para el encuadre de eventuales beneficios.\nNivel municipal:\n· Ordenanzas de habilitación comercial e industrial y de zonificación de usos del suelo de la localidad sede del centro de procesamiento.\n· Ordenanzas de bromatología e inspección de establecimientos.\n· Ordenanzas de regulación de ferias y espacios de venta de emprendedores.\n· Ordenanzas de gestión de residuos sólidos urbanos y, donde existan, de restricción de plásticos de un solo uso.\nAdvertencia de corrección: el escenario no cita normativa, de modo que este relevamiento es propio del equipo; no debe copiarse marco normativo de otro escenario ni citarse números de ley de memoria.", "K": "Las causas se ordenan por nivel y se leen de abajo hacia arriba: cada causa de nivel inferior genera la del nivel superior, y las de primer nivel producen el problema central.\nCausa 1 (técnica/operativa) — El acondicionamiento poscosecha del fruto (lavado, secado, blanqueo, corte y empaque) se resuelve de manera artesanal y sin criterios comunes, con calidad heterogénea entre productores. El comercio que recibe partidas dispares interrumpe la compra.\n· Causa 1.1 (técnica) — La capacidad instalada de secado y almacenamiento de los emprendimientos no permite conservar la fibra en condiciones adecuadas durante todo el año.\n· Causa 1.2 (social) — Los productores familiares conducen el cultivo y el procesamiento con conocimientos transmitidos de manera informal, sin asistencia técnica sistematizada ni protocolos escritos.\n·· Causa 1.2.A (institucional) — Los programas públicos de asistencia técnica y financiamiento a emprendedores no alcanzan a los productores de la actividad, que desconocen sus requisitos, ventanillas y plazos.\n· Causa 1.3 (ambiental) — El cultivo se conduce sin planificación del riego ni manejo del suelo, con rendimientos y calidad de fibra muy variables entre campañas y entre predios.\n·· Causa 1.3.A (territorial) — Las regiones provinciales con aptitud agroclimática para el cultivo no están identificadas y cada productor define la localización por ensayo y error.\nCausa 2 (económica) — Los emprendimientos interrumpen la producción entre cosechas porque no disponen de capital de trabajo para sostener el secado, el acopio y el empaque fuera de la temporada de fruto. Es una causa de segundo orden y no la raíz: aparece cuando el negocio todavía no está dimensionado.\n· Causa 2.1 (técnica) — La misma insuficiencia de secado y almacenamiento de la causa 1.1, que obliga a vender todo en cosecha o a perder producto.\n· Causa 2.2 (económica) — La demanda provincial no está dimensionada, de modo que no puede calcularse cuánto capital de trabajo se necesita ni justificarlo ante un financista.\n· Causa 2.3 (institucional) — Los programas públicos de financiamiento no llegan a estos productores (causa 1.2.A).\nCausa 3 (económica) — La cadena de comercialización se rearma en cada temporada mediante acuerdos informales, sin compromisos de entrega ni programación de volúmenes entre productores y comercios.\n· Causa 3.1 (territorial) — Las parcelas en producción están dispersas y distantes de las localidades donde se concentran las ferias y los comercios, con costos de flete que la escala actual no absorbe.\n·· Causa 3.1.A (territorial) — Falta de identificación de las zonas aptas (causa 1.3.A), que dispersa la localización de la producción.\n· Causa 3.2 (económica) — La demanda provincial de esponjas vegetales no está dimensionada: no se conoce volumen anual, calidad ni estacionalidad requeridos (causa 2.2). Es la raíz que el escenario señala de manera explícita al decir que no hay información para determinar si la oferta satisface la demanda potencial ni cuál sería la escala adecuada.\nCausa 4 (institucional/normativa) — Los productores desconocen qué habilitación y qué requisitos debe cumplir un artículo de higiene personal y doméstica para ingresar de manera regular al circuito comercial formal, de modo que la venta queda confinada a ferias y canales informales y se corta cuando el comercio exige documentación.\nVerificación de derecha a izquierda: la falta de identificación de zonas aptas genera manejo agronómico por ensayo y error, que genera fibra de calidad dispar, que genera acondicionamiento heterogéneo, que produce la discontinuidad del abastecimiento. La ausencia de dimensionamiento de la demanda genera a la vez la informalidad comercial y la imposibilidad de calcular el capital de trabajo, que producen el corte de la oferta entre cosechas.", "L": "Los efectos se leen de izquierda a derecha, del problema hacia arriba.\nEfecto 1 (económico) — Los comercios especializados y las ferias discontinúan la compra de esponjas vegetales y reasignan ese espacio de venta a productos sintéticos o de origen externo a la provincia. Un espacio de góndola perdido no se recupera en la temporada siguiente sin un compromiso de entrega.\n· Efecto 1.1 (social) — Los consumidores que declaran preferencia por alternativas biodegradables sostienen la compra de esponjas plásticas de un solo uso, porque compran el producto efectivamente disponible y no el que dicen preferir.\n·· Efecto 1.1.A (ambiental) — Se mantiene la generación de residuos plásticos de vida útil corta y baja degradabilidad en las localidades urbanas y periurbanas de la provincia, con el consiguiente aporte al flujo de residuos sólidos urbanos.\nEfecto 2 (económico) — Los emprendimientos familiares no consolidan ingresos estables con la actividad y la conservan como ingreso marginal o la abandonan entre temporadas.\n· Efecto 2.1 (social) — Se pierde la experiencia productiva acumulada en el cultivo y el procesamiento de la fibra, y las campañas de educación ambiental quedan sin producto local que las respalde, lo que debilita el mensaje de sustitución del plástico que esas campañas promueven.\nVerificación de izquierda a derecha: la discontinuidad de la oferta hace que el comercio deje de comprar; que el comercio deje de comprar hace que el consumidor siga comprando plástico; que el consumidor siga comprando plástico mantiene el flujo de residuos. En paralelo, la discontinuidad impide consolidar el ingreso del productor, y el abandono de la actividad disipa el saber acumulado. Ninguno de estos enunciados explica por qué ocurre el problema: todos describen lo que el problema provoca, y por eso están en la columna de efectos y no en la de causas.", "M": "Lectura encadenada del árbol, con el problema central en el tronco, las causas hacia abajo y los efectos hacia arriba. El diagrama no agrega elementos: ordena los de los ítems K y L.\nDesde la raíz: como las regiones con aptitud agroclimática no están identificadas, cada productor localiza el cultivo por ensayo y error; esa decisión sin información deriva en un manejo del riego y del suelo sin planificación, con rendimientos y calidad de fibra variables entre campañas, y además dispersa las parcelas lejos de las localidades donde están las ferias y los comercios. La calidad dispar del fruto, sumada a una capacidad de secado y almacenamiento insuficiente y a la ausencia de asistencia técnica sistematizada —que a su vez se explica porque los programas públicos de apoyo no llegan a estos productores—, produce un acondicionamiento poscosecha artesanal y heterogéneo. Por otro camino, el hecho de que la demanda provincial no esté dimensionada impide calcular el capital de trabajo necesario y, junto con la insuficiencia de secado y acopio y con la no llegada de los programas de financiamiento, hace que la producción se interrumpa entre cosechas; ese mismo desconocimiento de la demanda, junto con la dispersión territorial y los costos de flete, sostiene una comercialización informal que se rearma cada temporada. A esto se agrega el desconocimiento de los requisitos de habilitación del producto, que cierra el acceso regular al comercio formal.\nEn el tronco: las cuatro causas de primer nivel —acondicionamiento heterogéneo, interrupción de la producción entre cosechas, comercialización informal y desconocimiento de la habilitación— convergen en el problema central: la oferta local de esponjas vegetales abastece en forma discontinua e irregular a los comercios, ferias y consumidores de las localidades urbanas y periurbanas de Salta.\nHacia arriba: la discontinuidad hace que los comercios y ferias dejen de comprar y reasignen el espacio de venta; en consecuencia, los consumidores que preferirían el producto biodegradable siguen comprando esponjas plásticas, y se mantiene la generación de residuos plásticos de vida útil corta. En una segunda rama, la discontinuidad impide que los emprendimientos consoliden ingresos estables, lo que lleva al abandono de la actividad y a la pérdida de la experiencia productiva acumulada, dejando además sin respaldo material a las campañas de educación ambiental.\nEste árbol es, en esta instancia, un conjunto de hipótesis de trabajo: cada relación causal deberá ponerse a prueba en el F02 con relevamiento de campo, consulta a productores y comercios y trabajo participativo con los involucrados.", "N": "Los medios son las causas expresadas como estados alcanzados, no como acciones, respetando la misma jerarquía del ítem K.\nMedio 1 — Acondicionamiento poscosecha del fruto realizado con criterios comunes y calidad homogénea entre productores.\n· Medio 1.1 — Capacidad de secado y almacenamiento suficiente para conservar la fibra en condiciones adecuadas durante todo el año.\n· Medio 1.2 — Productores familiares con asistencia técnica sistematizada y protocolos escritos de cultivo y procesamiento.\n·· Medio 1.2.A — Programas públicos de asistencia técnica y financiamiento efectivamente accesibles para los productores de la actividad.\n· Medio 1.3 — Cultivo conducido con planificación del riego y manejo del suelo, con rendimientos y calidad estables entre campañas.\n·· Medio 1.3.A — Regiones provinciales con aptitud agroclimática para el cultivo identificadas y disponibles como información para decidir la localización.\nMedio 2 — Producción sostenida entre cosechas, con capital de trabajo suficiente para el secado, el acopio y el empaque.\n· Medio 2.1 — Capacidad de secado y acopio suficiente (medio 1.1).\n· Medio 2.2 — Demanda provincial dimensionada en volumen, calidad y estacionalidad.\n· Medio 2.3 — Programas públicos de financiamiento accesibles (medio 1.2.A).\nMedio 3 — Cadena de comercialización operando con acuerdos formales de entrega y programación de volúmenes entre productores y comercios.\n· Medio 3.1 — Producción articulada en puntos de concentración accesibles desde las localidades de venta, con costos de flete absorbidos por la escala agregada.\n·· Medio 3.1.A — Zonas aptas identificadas (medio 1.3.A).\n· Medio 3.2 — Demanda provincial dimensionada (medio 2.2).\nMedio 4 — Requisitos de habilitación del producto de higiene conocidos y cumplidos por los productores.\nMedios fuera del alcance del proyecto, declarados de manera explícita: el medio 1.2.A y el 2.3 —que los programas públicos provinciales y nacionales lleguen efectivamente a estos productores— dependen de decisiones de política pública ajenas al proyecto; el proyecto puede facilitar el acceso y acompañar las presentaciones, pero no puede garantizar la asignación. El medio 1.3.A, la zonificación agroclimática provincial, excede la escala y el presupuesto de una iniciativa de base asociativa y corresponde a un organismo provincial de ciencia y técnica o de desarrollo productivo; el proyecto puede aportar datos de campo y usar la información existente. Ambos se retoman como supuestos en la MML. La estructura jerárquica del árbol de objetivos es la misma que la del árbol de problemas: cuatro medios de primer nivel y tres niveles de profundidad, en espejo exacto.", "O": "Los fines son los efectos expresados como situaciones deseadas, con el mismo encadenamiento del ítem L.\nFin 1 — Los comercios especializados y las ferias sostienen la compra de esponjas vegetales y mantienen el espacio de venta asignado al producto local.\n· Fin 1.1 — Los consumidores que prefieren alternativas biodegradables encuentran el producto disponible y sustituyen efectivamente la esponja plástica de un solo uso.\n·· Fin 1.1.A — Se reduce la generación de residuos plásticos de vida útil corta y baja degradabilidad en las localidades urbanas y periurbanas de la provincia.\nFin 2 — Los emprendimientos familiares consolidan ingresos estables con la actividad y la sostienen entre temporadas.\n· Fin 2.1 — Se conserva y se transmite la experiencia productiva en el cultivo y el procesamiento de la fibra, y las campañas de educación ambiental cuentan con producto local que las respalda.\nCada fin es el espejo de un efecto y no hay ningún fin sin efecto correspondiente: cinco efectos, cinco fines. Los fines más altos del árbol —el 1.1.A (reducción del descarte plástico) y el 2.1 (permanencia de la capacidad productiva local)— son los que alimentan el nivel Fin de la EAP y de la MML.", "P": "Problema central: la oferta local de esponjas vegetales de Luffa cylindrica abastece en forma discontinua e irregular a los comercios especializados, las ferias de emprendedores y los consumidores de las localidades urbanas y periurbanas de la provincia de Salta.\nObjetivo central, propósito o meta: la oferta local de esponjas vegetales de Luffa cylindrica abastece en forma continua y regular a los comercios especializados, las ferias de emprendedores y los consumidores de las localidades urbanas y periurbanas de la provincia de Salta.\nSe conservan el mismo sujeto (la oferta local de esponjas vegetales), la misma variable (continuidad y regularidad del abastecimiento) y el mismo alcance territorial (localidades urbanas y periurbanas de la provincia de Salta): sólo cambia el signo. No se amplió el alcance a toda la provincia ni se lo redujo a una localidad, y no se introdujo ninguna solución en el enunciado. El indicador de este propósito es el mismo del ítem E —proporción de semanas del año con producto local disponible en los comercios y ferias relevados—, con el valor con proyecto en lugar del valor sin proyecto.", "Q": "El árbol de objetivos reproduce la estructura del árbol de problemas con los signos invertidos: medios abajo, meta en el tronco, fines arriba, con la misma cantidad de nodos y las mismas relaciones (17 nodos y 20 vínculos en ambos árboles).\nLectura desde abajo: si las regiones con aptitud agroclimática están identificadas, los productores deciden la localización con información y conducen el cultivo con planificación del riego y manejo del suelo, con rendimientos y calidad estables; esa misma información permite además articular la producción en puntos de concentración accesibles. Con fibra de calidad estable, capacidad de secado y acopio suficiente y asistencia técnica sistematizada, el acondicionamiento poscosecha se realiza con criterios comunes y calidad homogénea. Con la demanda dimensionada y con capital de trabajo, la producción se sostiene entre cosechas; con la demanda dimensionada y la producción concentrada, la comercialización opera con acuerdos formales de entrega. Con los requisitos de habilitación conocidos y cumplidos, el producto accede de manera regular al comercio formal. Los cuatro medios de primer nivel producen la meta: oferta local que abastece en forma continua y regular. Hacia arriba, los comercios sostienen la compra, los consumidores sustituyen efectivamente el plástico, se reduce la generación de residuos plásticos, los emprendimientos consolidan ingresos y se conserva la experiencia productiva local.\nMedios sobre los que el proyecto puede actuar, marcados como tales en el diagrama: 1 (acondicionamiento homogéneo), 1.1 (secado y acopio), 1.2 (asistencia técnica y protocolos), 2 (producción sostenida entre cosechas), 2.2 (demanda dimensionada), 3 (comercialización con acuerdos formales), 3.1 (concentración de la producción) y 4 (habilitación cumplida). Quedan fuera del alcance directo los medios 1.2.A, 1.3.A y 2.3, ya declarados en el ítem N y trasladados a la columna de supuestos de la MML.\nSe verificó nodo por nodo la correspondencia entre ambos árboles: no hay ningún medio o fin sin su causa o efecto de origen, ni ning
