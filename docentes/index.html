y programación por agenda institucional en lugar de calendario ecológico— e incide sobre la tercera, la responsabilidad posterior a la plantación, al condicionar la entrega de los plantines a la firma de un acta de compromiso de mantenimiento con responsable identificado. Ninguna otra alternativa cubre más de una raíz. · Pertinencia: el escenario se titula producción de especies forestales nativas y su ámbito es restauración ecológica y producción de servicios ecosistémicos; C opera exactamente sobre ese eje sin reducir el problema a un evento de plantación. · Inversión y capacidad instalada: C utiliza viveros que ya existen —municipales, escolares, de organizaciones y privados— y concentra el gasto en protocolo, capacitación, insumos y mejoras de riego, con inversión moderada y distribuida. Por eso se descartó D, el vivero provincial nuevo de gran escala: multiplica la inversión inicial y el costo fijo, demora dos o tres campañas en producir en régimen y centraliza la producción en una provincia cuya heterogeneidad ecológica y logística es precisamente uno de los condicionantes del problema. Además, D es la alternativa que el análisis advirtió no elegir de antemano, porque presupone que el problema es de volumen de producción cuando también es de calidad, de época y de mantenimiento. · Sostenibilidad: C deja instalado un protocolo escrito y un registro de supervivencia que sobreviven al cambio de gestión, a diferencia de B, la cuadrilla municipal, cuyo costo operativo permanente y dependencia de la planta de personal la vuelven frágil en municipios pequeños y no corrige el origen del plantín débil. · Medición: C incorpora el registro de supervivencia por sitio y por especie, sin el cual el indicador del propósito no puede calcularse. La alternativa E aporta sólo ese registro y la programación por calendario: es necesaria pero insuficiente, porque mediría con precisión un fracaso que seguiría ocurriendo; por eso se la absorbió como componente instrumental de C en lugar de mantenerla como proyecto separado. · La alternativa A, el padrinazgo, resultó la más económica y la de mayor valor social, y ataca la raíz de mayor peso aparente. No se la eligió como idea fuerza porque no corrige el origen del problema —un plantín débil, de especie inadecuada y entregado fuera de época muere aunque lo rieguen— y porque depende de una voluntad social que el propio escenario muestra concentrada en el día del acto. Se la conserva como línea complementaria promovida desde el acta de compromiso, de modo que las alternativas no compiten: C produce la condición material y A puede aportar el cuidado. · La alternativa F se descartó como actividad principal por estar fuera del alcance del proyecto; se la mantiene como acción de incidencia y reaparece en la MML como supuesto.", "corr": ["Problema central escrito como carencia: «falta de un vivero de nativas», «falta de riego», «escasez de plantines nativos». Cualquiera de estas formulaciones decide la alternativa antes de analizar y clausura el árbol. Verificar que el enunciado tenga sujeto afectado, atributo negativo, localización y plazo.", "Árbol con causas exclusivamente técnicas: sólo el plantín, el riego y el vivero. Debe haber causas económicas (el presupuesto se agota el día del acto; las nativas rinden menos que las exóticas), institucionales (nadie tiene asignado el cuidado; no hay estándar de calidad), sociales (participación de un solo día) y territoriales (agua y logística desiguales entre localidades).", "Cifras inventadas con apariencia de dato oficial: porcentajes de supervivencia, cantidad de plantines por campaña, superficie de espacio verde o población atendida presentados como si provinieran de un censo o de una estadística provincial. El escenario dice expresamente que la información disponible no permite dimensionar la oferta ni la demanda; todo valor de línea de base debe estar declarado como supuesto numerado, con criterio de adopción y remisión al F02.", "Confusión entre causa y efecto en la baja cobertura arbórea: varios equipos escriben «poca cobertura arbórea» como causa de la mortandad cuando es su efecto. Controlar el sentido de lectura del árbol.", "Objetivo central con alcance cambiado: el problema se localizó en las localidades de la provincia que realizan campañas y la meta aparece luego referida a «toda la provincia» o a un solo municipio. Lo mismo con la población objetivo declarada como «toda la comunidad».", "Supuestos de la MML que en realidad son tareas del proyecto: «se capacita a los viveristas», «se elabora el protocolo», «se firman los convenios». El supuesto debe ser externo; en este escenario el supuesto genuino y más frágil es el cumplimiento del compromiso de riego y cuidado posterior por parte de los municipios e instituciones receptoras.", "Alternativa seleccionada que no sale del árbol de objetivos, o nombre del proyecto que repite el nombre de fantasía del equipo (ítem A) o el enunciado del problema en lugar de decir qué se hace, para qué y dónde."]}, "6": {"n": 6, "pc": "El establecimiento seleccionado del departamento Capital abastece con agua potable de red la totalidad de sus usos que no requieren esa calidad —riego de espacios verdes, limpieza de superficies y descarga sanitaria—, mientras la escorrentía de sus cubiertas se conduce íntegramente al desagüe pluvial sin aprovechamiento.", "pcjus": "El problema central es la situación negativa que hoy existe y se verifica en el edificio: una única fuente potable atiende usos de distinta exigencia de calidad y, al mismo tiempo, un recurso disponible en el propio predio se descarta. Se descartó «falta de un sistema de captación de agua de lluvia» porque enuncia la solución —y encima la solución que da título al escenario—, con lo cual el análisis de alternativas quedaría condicionado antes de empezar. Se descartó «escasez de agua» porque es un enunciado general, sin sujeto, lugar, plazo ni magnitud, y probablemente falso a la escala de un edificio conectado a la red. Se descartó «no hay conciencia sobre el uso del agua» porque traslada al usuario una decisión que es de diseño edilicio e institucional, y porque no es medible ni accionable por un proyecto de inversión. La formulación adoptada conserva las dos caras del escenario —consumo potable en usos que no lo requieren y escorrentía desaprovechada— y las mantiene medibles en volumen anual, que es lo que permitirá construir la línea de base del ítem E.", "objc": "El establecimiento seleccionado del departamento Capital abastece con agua de lluvia captada en sus cubiertas los usos que no requieren calidad potable —riego de espacios verdes, limpieza de superficies y descarga sanitaria—, y aprovecha la escorrentía de sus cubiertas en lugar de conducirla íntegramente al desagüe pluvial.", "sit": [{"id": "s1", "t": "El establecimiento seleccionado del departamento Capital abastece con agua potable de red la totalidad de sus usos que no requieren esa calidad —riego de espacios verdes, limpieza de superficies y descarga sanitaria—, mientras la escorrentía de sus cubiertas se conduce íntegramente al desagüe pluvial sin aprovechamiento.", "k": "p", "d": "amb"}, {"id": "s2", "t": "La instalación hidráulica del establecimiento está resuelta con una única red de agua potable que alimenta indistintamente los artefactos sanitarios, las canillas de servicio y las tomas de riego del predio, sin separación por calidad de agua.", "k": "c", "d": "tec"}, {"id": "s3", "t": "Las cubiertas del establecimiento descargan por canaletas y bajadas conectadas directamente al colector pluvial, sin cisterna, tanque de acumulación ni derivación intermedia que permita retener el agua caída.", "k": "c", "d": "tec"}, {"id": "s4", "t": "El personal de maestranza y mantenimiento riega los espacios verdes y lava las superficies exteriores con manguera conectada a la red potable, sin procedimiento escrito ni criterio de dosificación, por ser la única toma disponible en el predio.", "k": "c", "d": "soc"}, {"id": "s5", "t": "La administración del establecimiento no gestiona el gasto en agua como una partida propia: la factura llega consolidada, sin apertura por uso, y el consumo se paga sin análisis.", "k": "c", "d": "eco"}, {"id": "s6", "t": "La normativa municipal de edificación y de desagües pluviales aplicable en el departamento Capital trata la escorrentía de cubiertas como un efluente a evacuar y no exige ni incentiva su retención o reúso en obras nuevas ni en refacciones de edificios institucionales.", "k": "c", "d": "ins"}, {"id": "s7", "t": "Ningún área del establecimiento tiene asignada formalmente la función de gestionar el agua: mantenimiento resuelve incidencias y administración paga facturas, y entre ambas nadie audita el destino del consumo.", "k": "c", "d": "ins"}, {"id": "s8", "t": "El agua de red se abona bajo una modalidad institucional que no discrimina por calidad ni por destino del consumo, de modo que destinar agua potable al riego no tiene para el establecimiento un costo diferencial frente a cualquier otro uso.", "k": "c", "d": "eco"}, {"id": "s9", "t": "La adecuación de las instalaciones —cisterna, conducción separada y filtrado— exige una inversión inicial que compite en el presupuesto anual del establecimiento con los gastos corrientes de funcionamiento y queda postergada ejercicio tras ejercicio.", "k": "c", "d": "eco"}, {"id": "s10", "t": "Las decisiones sobre las instalaciones del establecimiento se toman sin información relevada sobre la superficie efectiva de captación, el estado de las cubiertas, el volumen de escorrentía aprovechable ni la demanda de agua discriminada por uso.", "k": "c", "d": "tec"}, {"id": "s11", "t": "El régimen de precipitaciones del Valle de Lerma concentra las lluvias en el semestre cálido, de modo que la oferta de escorrentía y la demanda de riego del predio no coinciden en el tiempo y todo aprovechamiento exige almacenamiento estacional.", "k": "c", "d": "amb"}, {"id": "s12", "t": "El predio descarga su escorrentía sobre un colector pluvial de barrio que ya recibe el aporte de un sector densificado, lo que consolida en el establecimiento el criterio de evacuar rápidamente el agua de lluvia en lugar de retenerla en el origen.", "k": "c", "d": "ter"}, {"id": "s13", "t": "Se extrae, potabiliza y distribuye hacia el establecimiento un volumen de agua mayor que el requerido por los usos que efectivamente necesitan calidad potable, con la consiguiente presión evitable sobre la fuente que abastece al departamento Capital.", "k": "e", "d": "amb"}, {"id": "s14", "t": "El establecimiento sostiene un gasto anual en agua de red superior al que corresponderían sus usos de calidad potable, financiado con recursos públicos.", "k": "e", "d": "eco"}, {"id": "s15", "t": "La totalidad de la escorrentía de las cubiertas ingresa al colector pluvial durante los eventos de lluvia intensa y aporta al pico de caudal del sector, en un área con superficie impermeabilizada creciente.", "k": "e", "d": "ter"}, {"id": "s16", "t": "La comunidad de usuarios convive con instalaciones que contradicen el discurso de uso eficiente del agua que la propia institución sostiene, y la eficiencia hídrica no se incorpora a las prácticas cotidianas del edificio.", "k": "e", "d": "soc"}, {"id": "s17", "t": "No se genera evidencia local sobre el desempeño técnico, económico y sanitario del aprovechamiento pluvial en edificios institucionales del departamento Capital, y la decisión se sigue postergando en el resto de los establecimientos en igual situación.", "k": "e", "d": "ins"}, {"id": "s18", "t": "Los recursos que el establecimiento destina a pagar agua potable para usos que no requieren esa calidad no quedan disponibles para el mantenimiento del predio y de sus instalaciones.", "k": "e", "d": "eco"}], "lnk": [{"a": "s2", "b": "s1"}, {"a": "s3", "b": "s1"}, {"a": "s4", "b": "s1"}, {"a": "s5", "b": "s1"}, {"a": "s6", "b": "s2"}, {"a": "s6", "b": "s3"}, {"a": "s7", "b": "s4"}, {"a": "s7", "b": "s5"}, {"a": "s8", "b": "s5"}, {"a": "s9", "b": "s2"}, {"a": "s9", "b": "s3"}, {"a": "s10", "b": "s9"}, {"a": "s10", "b": "s5"}, {"a": "s11", "b": "s9"}, {"a": "s11", "b": "s3"}, {"a": "s12", "b": "s3"}, {"a": "s1", "b": "s13"}, {"a": "s1", "b": "s14"}, {"a": "s1", "b": "s15"}, {"a": "s1", "b": "s16"}, {"a": "s1", "b": "s17"}, {"a": "s14", "b": "s18"}], "obj": {"s1": "El establecimiento seleccionado del departamento Capital abastece con agua de lluvia captada en sus cubiertas los usos que no requieren calidad potable —riego de espacios verdes, limpieza de superficies y descarga sanitaria—, y aprovecha la escorrentía de sus cubiertas en lugar de conducirla íntegramente al desagüe pluvial.", "s2": "El establecimiento cuenta con la instalación hidráulica separada por calidad de agua: una red potable para consumo humano e higiene personal y una red secundaria no potable para riego, limpieza y descarga sanitaria.", "s3": "Las cubiertas del establecimiento descargan a un sistema de conducción con derivación, filtrado y almacenamiento que retiene el agua caída antes de cualquier vertido al colector pluvial.", "s4": "El personal de maestranza y mantenimiento riega y limpia con agua no potable del propio predio, siguiendo un procedimiento escrito con criterios de dosificación y de temporada.", "s5": "La administración del establecimiento gestiona el gasto en agua como partida propia, con el consumo abierto por uso y analizado periódicamente.", "s6": "La normativa municipal de edificación y de desagües pluviales del departamento Capital reconoce la escorrentía de cubiertas como recurso aprovechable y exige o incentiva su retención y reúso en edificios institucionales.", "s7": "El establecimiento tiene formalmente asignada la función de gestión del agua en un área responsable, que audita el destino del consumo y responde por su desempeño.", "s8": "El régimen de pago del agua del establecimiento discrimina por destino del consumo, de modo que el uso de agua potable en actividades que no la requieren tiene un costo diferencial visible.", "s9": "El establecimiento dispone de financiamiento específico para la adecuación de sus instalaciones hídricas, diferenciado de la partida de gastos corrientes de funcionamiento.", "s10": "Las decisiones sobre las instalaciones del establecimiento se toman con información relevada sobre superficie efectiva de captación, estado de las cubiertas, volumen de escorrentía aprovechable y demanda de agua por uso.", "s11": "La estacionalidad de las precipitaciones del Valle de Lerma está incorporada al diseño de las instalaciones del establecimiento, mediante un almacenamiento dimensionado para sostener la demanda entre eventos de lluvia.", "s12": "El establecimiento aplica el criterio de retención en el origen de la escorrentía de su predio, y el colector pluvial de barrio recibe sólo el excedente que el sistema no logra almacenar.", "s13": "El volumen de agua extraído, potabilizado y distribuido hacia el establecimiento se ajusta a los usos que efectivamente requieren calidad potable, y disminuye la presión evitable sobre la fuente que abastece al departamento Capital.", "s14": "El gasto anual del establecimiento en agua de red se ajusta al volumen de sus usos de calidad potable.", "s15": "La escorrentía de las cubiertas se retiene en el predio durante los eventos de lluvia intensa y el aporte del establecimiento al pico de caudal del colector del sector disminuye.", "s16": "La comunidad de usuarios convive con instalaciones coherentes con el discurso de uso eficiente del agua de la institución, y la eficiencia hídrica se incorpora a las prácticas cotidianas del edificio.", "s17": "Se dispone de evidencia local sobre el desempeño técnico, económico y sanitario del aprovechamiento pluvial en edificios institucionales del departamento Capital, y otros establecimientos en igual situación cuentan con base para decidir.", "s18": "Los recursos liberados del pago de agua potable para usos que no requieren esa calidad quedan disponibles para el mantenimiento del predio y de sus instalaciones."}, "f01": {"A": "Se propone PLUVIA S.H. como nombre de fantasía del equipo. Es un ejemplo de respuesta correcta, no la única válida: cualquier sigla o expresión de dos o tres palabras vinculada al agua, la ecoeficiencia o la ingeniería ambiental cumple la consigna, y la cátedra evalúa la coherencia con el ámbito de actuación, no la ocurrencia. Fundamento del ejemplo: es corto y pronunciable, remite en forma directa al recurso sobre el que trabaja el equipo, no queda atado a un único escenario (sirve para toda la cursada y para futuros trabajos de la firma) y responde al estilo de las consultoras inscriptas en el registro de la Secretaría de Ambiente de Salta que la Guía toma como referencia. Se asume sociedad de hecho, sin definir tipo societario en esta instancia.\nControl de error frecuente: PLUVIA S.H. es quien formula; el proyecto formulado tiene otro nombre y se define recién en el ítem V. Si en el ítem A aparece algo del tipo «Proyecto de captación de agua de lluvia», el equipo confundió el nombre del equipo con el del proyecto de inversión.", "B": "Se declara la estructura de roles, no nombres de personas reales. Equipo de cinco integrantes, con coordinación rotativa por entregable, removible por mayoría e informada a la cátedra por correo.\nIntegrante 1 · Coordinación general del entregable, control de coherencia entre ítems y edición final · Perfil: estudiante avanzado de Ingeniería en Recursos Naturales y Medio Ambiente · 22 h.\nIntegrante 2 · Relevamiento en el establecimiento seleccionado: cubiertas, instalación sanitaria, tomas de riego, espacio disponible para almacenamiento · 20 h.\nIntegrante 3 · Búsqueda y sistematización de información secundaria: régimen de precipitaciones, antecedentes de sistemas de captación, marco normativo · 18 h.\nIntegrante 4 · Construcción del árbol de problemas, del árbol de objetivos y de la MML; redacción de los capítulos 2 a 4 · 20 h.\nIntegrante 5 · Cartografía y paratextos (imagen satelital del predio, esquema de instalaciones, gráfico de precipitación mensual) y enlace institucional para gestionar la visita y las consultas · 16 h.\nTotal declarado: 96 h efectivas.\nMetodología acordada: una reunión semanal de dos horas (una presencial en el establecimiento durante la etapa de relevamiento, el resto virtual), repositorio compartido de documentos y grupo de mensajería para coordinación diaria. Se declaran sólo horas efectivamente trabajadas: la Guía es explícita en que reconocer a quien no trabajó desincentiva a quienes sí lo hicieron.", "C": "Ámbito principal: ecoeficiencia. Ámbito secundario declarado: saneamiento ambiental. Las categorías de la Guía no son mutuamente excluyentes y este escenario queda representado en ambas.\nPor qué ecoeficiencia como eje principal: el proyecto no crea un servicio inexistente ni remedia un pasivo, sino que reduce el consumo de un insumo de alta calidad y alto costo de producción (agua potabilizada) para obtener el mismo servicio (riego, limpieza, descarga), sustituyéndolo por un recurso disponible en el propio predio. Es exactamente la lógica de hacer más con menos insumo ambiental por unidad de servicio prestado.\nPor qué también saneamiento ambiental: la intervención opera sobre las instalaciones sanitarias y sobre el manejo de la escorrentía urbana del predio, con exigencias de calidad de agua por uso, de prevención de conexiones cruzadas con la red potable y de control de vectores en el almacenamiento; todo ello es materia sanitaria y no puede resolverse sólo con criterio de eficiencia.\nSe deja constancia de que este ítem se cerró después de escribir el ítem D, como recomienda la Guía: el ámbito se define a partir del problema y no al revés.", "D": "Problema identificado: «El establecimiento seleccionado del departamento Capital abastece con agua potable de red la totalidad de sus usos que no requieren esa calidad —riego, limpieza y descarga sanitaria—, mientras la escorrentía de sus cubiertas se conduce íntegramente al desagüe pluvial sin aprovechamiento.»\nIdentidad: el sujeto afectado es el establecimiento y su comunidad de usuarios, que reciben agua potabilizada para tareas que no exigen esa calidad. Ubicación: el predio y las instalaciones del establecimiento, departamento Capital, Valle de Lerma. Tiempo: situación permanente, verificable todo el año, agravada en la temporada de lluvias, cuando además se descarta el volumen captable. Mensurabilidad: se expresa en dos volúmenes anuales —agua de red destinada a usos sin exigencia de potabilidad y escorrentía de cubiertas derivada al pluvial—, calculables con submedición y relevamiento. Magnitud: a cuantificar en el ítem E, con supuesto declarado porque el escenario no aporta cifras.\nNo es «falta de un sistema de captación», que enuncia la solución y condiciona las alternativas, ni «escasez de agua», enunciado sin sujeto, lugar ni plazo.", "E": "Se construyen dos indicadores complementarios, ambos con la ecuación cantidad + variable + lugar + plazo + medio de verificación.\nIndicador 1 · consumo evitable: porcentaje del volumen anual de agua potable de red facturado al establecimiento que se destina a riego de espacios verdes, limpieza de superficies y descarga sanitaria, en el establecimiento seleccionado del departamento Capital, medido sobre doce meses corridos · Medio de verificación: facturación anual de la prestadora, submedición a instalar en las tomas de riego y limpieza, y planilla mensual de registro de la administración.\nIndicador 2 · escorrentía desaprovechada: volumen anual de escorrentía de cubiertas derivado al colector pluvial, en metros cúbicos por año, en el predio del establecimiento, para un año hidrológico completo · Medio de verificación: relevamiento planialtimétrico de cubiertas (superficie y coeficiente de escurrimiento) y serie de precipitación mensual de la estación meteorológica de referencia del Valle de Lerma.\nLo que el escenario ya aporta: que existen superficies de cubierta con potencial de captación, que hay tecnología disponible en el mercado, que hay antecedentes nacionales e internacionales, y que la escorrentía se conduce hoy sin ningún aprovechamiento. También aporta un dato negativo relevante: no se dispone de información sobre factibilidad técnica, económica y ambiental en los edificios del departamento.\nLo que hay que relevar: superficie efectiva de cubierta y su estado, consumo total facturado y su apertura por uso, demanda de riego y limpieza por temporada, espacio físico disponible para el almacenamiento y calidad de agua exigida por cada uso.\nValor en situación sin proyecto: el escenario no aporta cifras. Para no dejar el cuadro en blanco se adopta un supuesto explícito: se asume que entre el 30 % y el 50 % del volumen anual facturado corresponde a usos que no requieren calidad potable, y que el 100 % de la escorrentía de cubiertas se deriva hoy al pluvial (a verificar en el F02 con submedición y relevamiento). El criterio del supuesto es la composición de usos esperable en un edificio institucional con espacios verdes y sector deportivo; el valor puntual que finalmente se adopte deberá numerarse y fundamentarse.", "F": "Se describe sólo el contexto que tiene relación con el problema, no una monografía del departamento.\nContexto geográfico y ambiental: el establecimiento se localiza en el departamento Capital, dentro del Valle de Lerma. El rasgo del contexto que gobierna el problema es el régimen de precipitaciones, marcadamente estacional, con concentración en el semestre cálido y un período seco prolongado que coincide con la mayor demanda de riego del predio. Esa asincronía es la que obliga a almacenar y no sólo a captar. No se consignan aquí valores de precipitación: deben tomarse de la serie de la estación meteorológica de referencia del valle (Servicio Meteorológico Nacional y autoridad provincial de recursos hídricos), declarando fuente y año, e incorporarse al F02. El agua potable del área proviene de fuentes superficiales y subterráneas del propio valle, con captación, tratamiento y distribución a cargo de la prestadora provincial del servicio.\nContexto socioeconómico y territorial: sector urbano en expansión, con incorporación sostenida de conexiones domiciliarias sobre la misma red y aumento de la superficie impermeabilizada del entorno, lo que carga el colector pluvial al que descarga el predio. El establecimiento es un consumidor institucional de tamaño medio, con demanda concentrada en el ciclo lectivo y uso adicional del sector deportivo en contraturno y fines de semana; su gasto en agua se financia con recursos públicos.\nQué del contexto potencia el problema: la estacionalidad de las lluvias, el crecimiento de la demanda sobre la misma fuente, un régimen de pago que no discrimina por destino del consumo y una normativa municipal que trata la escorrentía como efluente a evacuar.\nQué contribuye a su solución: superficie de cubierta disponible y en general accesible en edificios institucionales, tecnologías de captación, almacenamiento y tratamiento disponibles en el mercado local, antecedentes documentados de aplicación en edificios, y una comunidad educativa con capacidad de apropiarse del proyecto y de sostener su operación.\nParatextos sugeridos: imagen satelital del predio con delimitación de cubiertas y superficies verdes, esquema unifilar de la instalación sanitaria existente y gráfico de precipitación media mensual del valle.", "G": "Población potencial: los usuarios de los edificios públicos, instituciones educativas, establecimientos deportivos e instalaciones comunitarias del departamento Capital que se encuentran en la misma situación —consumo potable en usos que no lo requieren y escorrentía de cubiertas derivada al pluvial—. El escenario afirma que la situación es común a numerosos edificios, pero no la cuantifica; su magnitud exige un relevamiento del parque edilicio institucional del departamento, que se propone realizar en el F02.\nPoblación objetivo: la comunidad del establecimiento seleccionado, es decir alumnos, docentes, personal no docente, personal de maestranza y mantenimiento, y usuarios del sector deportivo en contraturno y fines de semana. A los efectos del dimensionamiento se asume del orden de 600 a 900 personas usuarias diarias durante el ciclo lectivo (a verificar con la matrícula y la planta de personal del establecimiento en el F02).\nCriterio de recorte: el proyecto interviene físicamente sobre un único edificio, porque el sistema de captación es una obra sobre instalaciones existentes y su alcance está limitado por la superficie de cubierta y por el presupuesto de una etapa piloto. La población objetivo es por lo tanto una fracción de la potencial, y esa fracción es deliberada: el caso se selecciona para producir evidencia local replicable.\nQuiénes internalizan el problema: la administración del establecimiento (que paga la factura), el personal de maestranza (que ejecuta el riego y la limpieza), la comunidad de usuarios (que recibe el servicio) y, en un plano más amplio, el conjunto de usuarios de la red que comparte la fuente. No corresponde declarar como población objetivo a toda la comunidad del departamento: ese beneficio de escala es un fin del árbol de objetivos, no un producto de este proyecto.", "H": "Escala cualitativa alta / media / baja, la misma para fuerza e importancia.\n1 · Dirección del establecimiento · Institución pública · Posición: a favor · Fuerza alta (autoriza el ingreso, la obra y la operación; puede bloquear el proyecto por sí sola) · Importancia alta (es la contraparte operativa) · Interés: reducir el gasto en servicios y disponer de una instalación demostrativa para la enseñanza.\n2 · Organismo provincial del que depende el edificio (ministerio o secretaría con competencia en infraestructura del sector) · Institución pública · Posición: a favor con reservas · Fuerza alta (aprueba la intervención sobre el inmueble y financia) · Importancia alta (es el titular del proyecto) · Interés: replicabilidad y costo por metro cúbico sustituido; su reserva típica es el mantenimiento posterior.\n3 · Empresa prestadora del servicio de agua potable y cloacas · Empresa de servicios · Posición: indiferente a levemente en contra · Fuerza media (fija las condiciones de la conexión y prohíbe la interconexión entre la red no potable y la red potable) · Importancia alta (su aval técnico es condición de la obra) · Interés: preservar la seguridad sanitaria de la red; percibe una reducción marginal de facturación.\n4 · Municipalidad de la ciudad de Salta, áreas de obras privadas y de ambiente · Institución pública · Posición: a favor · Fuerza media (habilita la obra y controla el desagüe pluvial) · Importancia media (su intervención es de habilitación y control) · Interés: reducir el aporte al colector pluvial y contar con un antecedente para una futura exigencia normativa.\n5 · Comunidad educativa: alumnos, docentes y asociación cooperadora · Sociedad civil · Posición: a favor · Fuerza media (puede aportar trabajo, difusión y una parte del financiamiento, y su rechazo restaría legitimidad) · Importancia alta (son los destinatarios directos y los futuros usuarios del sistema) · Interés: uso pedagógico del sistema y mejora de los espacios verdes.\n6 · Personal de maestranza y mantenimiento · Actor interno · Posición: indiferente, con riesgo de pasar a en contra · Fuerza media (de su operación cotidiana depende que el sistema funcione o quede fuera de servicio) · Importancia alta (son quienes operan el sistema) · Interés: no incrementar la carga de trabajo; requiere capacitación y procedimientos claros.\n7 · Autoridad provincial de recursos hídricos y autoridad sanitaria · Institución pública · Posición: a favor con condicionamientos · Fuerza media (define exigencias de calidad de agua por uso) · Importancia media · Interés: evitar riesgos sanitarios por uso de agua no potable en usos indebidos.\nSe incluyen deliberadamente los actores que pueden frenar el proyecto (3 y 6): el análisis sirve para anticiparlos y diseñar estrategias hacia ellos, no para enumerar aliados.", "I": "Titular del proyecto: el organismo provincial del que depende el inmueble, con competencia sobre la infraestructura del establecimiento. Es quien tiene la titularidad del bien sobre el que se hace la obra, la capacidad de afectar partidas presupuestarias y la posibilidad de replicar el sistema en otros edificios de su cartera. Figura propuesta: proyecto de inversión en infraestructura edilicia, ejecutado por el organismo titular con una unidad ejecutora conformada con la dirección del establecimiento, bajo la modalidad de obra menor o de refacción sobre inmueble propio. Se admite como alternativa la figura de convenio de asistencia técnica entre el organismo titular y la universidad, con la cooperadora escolar como cofinanciadora de una parte del equipamiento.\nOrganizaciones de las que depende directamente la realización del proyecto:\n· Organismo provincial titular del inmueble: aprobación de la intervención y financiamiento.\n· Dirección del establecimiento: autorización de acceso, disponibilidad de espacio para el almacenamiento y compromiso de operación.\n· Municipalidad de la ciudad de Salta: permiso de obra y conformidad respecto de la modificación del régimen de descarga al colector pluvial.\n· Empresa prestadora del servicio de agua potable: conformidad técnica sobre la instalación, con la condición expresa de independencia física entre la red no potable y la red potable.\n· Autoridad sanitaria y autoridad provincial de recursos hídricos: requisitos de calidad de agua según uso.\nTodos estos actores figuran también en el ítem H, con la misma caracterización. En esta instancia sólo se identifican: los acuerdos, comodatos y autorizaciones se tramitan al pasar de perfil a prefactibilidad, y no corresponde anticipar gestiones.", "J": "Se construye la matriz de cumplimiento legal con las normas que el proyecto debe cumplir en sus etapas de diseño, obra y operación, seleccionando las relevantes y no un listado exhaustivo de derecho ambiental. Se cita por número sólo aquello de lo que se tiene certeza; el resto se nombra por materia. El equipo debe verificar vigencia y texto ordenado de cada norma antes de la entrega, porque varias fueron modificadas.\nNacional: Constitución Nacional, artículo 41 (derecho a un ambiente sano y deber de preservación) · Ley General del Ambiente 25.675 (presupuestos mínimos, principios de prevención y de uso racional de los recursos) · Ley de Gestión Ambiental de Aguas 25.688 (presupuestos mínimos para la preservación y el uso racional de las aguas) · Ley de Régimen de Libre Acceso a la Información Pública Ambiental 25.831 · Código Alimentario Argentino, capítulo sobre agua de bebida, como referencia de la calidad que el agua de lluvia no alcanza y que fija el límite de los usos admisibles.\nProvincial (Salta): Ley de Protección del Medio Ambiente 7.070 y su reglamentación (procedimiento de evaluación de impacto ambiental y categorización de la actividad) · Código de Aguas de la Provincia de Salta, Ley 7.017 (dominio y uso de las aguas, competencias de la autoridad de aplicación) · normativa provincial de seguridad e higiene edilicia y de habilitación de establecimientos, por materia.\nMunicipal (ciudad de Salta): código de edificación y reglamento de instalaciones sanitarias domiciliarias, por materia; ordenanza de desagües pluviales y de escurrimiento superficial, por materia; ordenanza de habilitación de obra y de conservación de espacios verdes, por materia. Estas cuatro se nombran sin número porque son las que el equipo debe relevar en el digesto municipal, y precisamente su contenido es una de las causas del árbol: hoy tratan la escorrentía como efluente a evacuar.\nTécnica no legal pero exigible: normas IRAM aplicables a tanques de almacenamiento de agua, cañerías y señalización de agua no apta para consumo humano; reglamento de la prestadora sobre prohibición de interconexión entre fuente propia y red pública.", "K": "Las causas se ordenan por nivel, leyendo de abajo hacia arriba, y cubren seis dimensiones (técnica, social, económica, institucional, ambiental y territorial). La verificación se hace leyendo de derecha a izquierda: ¿la causa de segundo nivel genera la de primer nivel?, ¿la de primer nivel produce el problema central?\nCausas de primer nivel, directas sobre el problema central:\nCausa 1 (técnica) · La instalación hidráulica está resuelta con una única red potable que alimenta indistintamente artefactos sanitarios, canillas de servicio y tomas de riego, sin separación por calidad de agua.\nCausa 2 (técnica) · Las cubiertas descargan por canaletas y bajadas conectadas directamente al colector pluvial, sin cisterna, tanque ni derivación intermedia.\nCausa 3 (social) · El personal de maestranza riega y lava con manguera conectada a la red potable, sin procedimiento escrito ni criterio de dosificación, porque es la única toma disponible.\nCausa 4 (económica) · La administración no gestiona el gasto en agua como partida propia: la factura llega consolidada, sin apertura por uso, y se paga sin análisis.\nCausas de segundo nivel:\nCausa 1.1 y 2.1 (institucional) · La normativa municipal de edificación y desagües pluviales trata la escorrentía de cubiertas como efluente a evacuar y no exige ni incentiva retención ni reúso en edificios institucionales. Mientras no se pida, nadie lo hace.\nCausa 1.2 y 2.2 (económica) · La adecuación de las instalaciones exige una inversión inicial que compite con los gastos corrientes de funcionamiento en el presupuesto anual y queda postergada ejercicio tras ejercicio.\nCausa 2.3 (ambiental) · El régimen de precipitaciones del Valle de Lerma es marcadamente estacional: oferta de escorrentía y demanda de riego no coinciden en el tiempo, de modo que cualquier aprovechamiento exige almacenamiento y no sólo captación.\nCausa 2.4 (territorial) · El predio descarga sobre un colector pluvial de barrio que ya recibe el aporte de un sector densificado, lo que consolida el criterio de evacuar rápido en lugar de retener en el origen.\nCausa 3.1 y 4.1 (institucional) · Ningún área tiene asignada formalmente la función de gestionar el agua: mantenimiento resuelve incidencias, administración paga facturas y nadie audita el destino del consumo.\nCausa 4.2 (económica) · El agua se abona bajo una modalidad institucional que no discrimina por calidad ni por destino, de modo que regar con agua potable no tiene costo diferencial.\nCausa de tercer nivel:\nCausa 1.2.A y 2.3.A (técnica) · Las decisiones sobre las instalaciones se toman sin información relevada sobre superficie efectiva de captación, estado de las cubiertas, volumen aprovechable ni demanda por uso; sin ese dato no se puede dimensionar el sistema ni presupuestarlo, y por eso la inversión nunca llega a formularse ni el gasto se abre por uso.\nObservación de método: la técnica del «¿pero por qué?» se detuvo en tres niveles porque en ese punto las causas dejan de depender del establecimiento (norma municipal, régimen de precipitaciones, régimen tarifario) y se vuelven condiciones de contorno.", "L": "Los efectos se ordenan de izquierda a derecha, del problema hacia sus consecuencias, y se verifican leyendo en ese mismo sentido: ¿el efecto 1 produce el efecto 1.1?\nEfectos de primer nivel:\nEfecto 1 (ambiental) · Se extrae, potabiliza y distribuye hacia el establecimiento un volumen de agua mayor que el requerido por los usos que efectivamente necesitan calidad potable, con presión evitable sobre la fuente que abastece al departamento Capital.\nEfecto 2 (económico) · El establecimiento sostiene un gasto anual en agua de red superior al que corresponderían sus usos de calidad potable, financiado con recursos públicos.\nEfecto 3 (territorial) · La totalidad de la escorrentía de cubiertas ingresa al colector pluvial durante los eventos de lluvia intensa y aporta al pico de caudal del sector, en un área con superficie impermeabilizada creciente.\nEfecto 4 (social) · La comunidad de usuarios convive con instalaciones que contradicen el discurso de uso eficiente del agua que la propia institución sostiene, y la eficiencia hídrica no se incorpora a las prácticas cotidianas del edificio.\nEfecto 5 (institucional) · No se genera evidencia local sobre el desempeño técnico, económico y sanitario del aprovechamiento pluvial en edificios institucionales del departamento Capital, y la decisión se sigue postergando en el resto de los establecimientos en igual situación.\nEfecto de segundo nivel:\nEfecto 2.1 (económico) · Los recursos que el establecimiento destina a pagar agua potable para usos que no requieren esa calidad no quedan disponibles para el mantenimiento del predio y de sus instalaciones, con lo que el deterioro edilicio se acumula.\nControl de error frecuente: ninguno de estos enunciados explica por qué ocurre el problema, todos describen lo que el problema provoca. El régimen tarifario que no discrimina por uso, por ejemplo, no está aquí: es causa, porque explica por qué la situación se sostiene, aunque comparta la dimensión económica con el efecto 2.", "M": "Lectura encadenada del árbol, de las raíces al tronco y del tronco a las ramas. El diagrama no agrega elementos: ordena los ítems K y L.\nRaíces: las decisiones sobre las instalaciones se toman sin información relevada sobre cubiertas, escorrentía aprovechable y demanda por uso; sin esa información no se puede dimensionar ni presupuestar la adecuación, de modo que la inversión inicial compite con los gastos corrientes y queda postergada, y el gasto en agua nunca se abre por uso. A eso se suma que la normativa municipal trata la escorrentía como efluente a evacuar, que el régimen de pago no discrimina por destino del consumo, que la estacionalidad del Valle de Lerma obliga a almacenar y no sólo a captar, que el colector de un sector densificado consolida el criterio de evacuación rápida, y que ningún área tiene asignada la función de gestionar el agua.\nDe esas raíces surgen las cuatro causas directas: la instalación sigue siendo una única red potable sin separación por calidad; las cubiertas siguen descargando directamente al pluvial; la maestranza riega y limpia con la única toma disponible, que es potable; y la administración paga una factura consolidada que no analiza.\nTronco: el establecimiento abastece con agua potable de red la totalidad de sus usos que no requieren esa calidad, mientras la escorrentía de sus cubiertas se conduce íntegramente al desagüe pluvial sin aprovechamiento.\nRamas: de ahí se sigue la sobreextracción y potabilización de un volumen evitable, con presión sobre la fuente del departamento Capital; un gasto anual en agua superior al necesario, que resta recursos al mantenimiento del predio; el aporte íntegro de la escorrentía al pico de caudal del colector del sector; la incoherencia entre las instalaciones y el discurso ambiental de la institución; y la ausencia de evidencia local, que perpetúa la postergación de la decisión en el resto de los edificios institucionales.\nEn esta instancia el árbol es un conjunto de hipótesis de trabajo. Cada nodo deberá ponerse a prueba con relevamiento propio, consulta a expertos y trabajo con los involucrados al pasar a perfil y prefactibilidad.", "N": "Los medios son las causas del ítem K expresadas como estados alcanzados, no como acciones. Se respeta el mismo número de niveles.\nMedios de primer nivel:\nMedio 1 · El establecimiento cuenta con instalación hidráulica separada por calidad de agua: red potable para consumo humano e higiene personal y red secundaria no potable para riego, limpieza y descarga sanitaria.\nMedio 2 · Las cubiertas descargan a un sistema de conducción con derivación, filtrado y almacenamiento que retiene el agua caída antes de todo vertido al colector pluvial.\nMedio 3 · El personal de maestranza riega y limpia con agua no potable del propio predio, con procedimiento escrito y criterios de dosificación y de temporada.\nMedio 4 · La administración gestiona el gasto en agua como partida propia, con el consumo abierto por uso y analizado periódicamente.\nMedios de segundo nivel:\nMedio 1.1 y 2.1 · La normativa municipal reconoce la escorrentía de cubiertas como recurso aprovechable y exige o incentiva su retención y reúso en edificios institucionales.\nMedio 1.2 y 2.2 · El establecimiento dispone de financiamiento específico para la adecuación de sus instalaciones hídricas, diferenciado de los gastos corrientes.\nMedio 2.3 · La estacionalidad del Valle de Lerma está incorporada al diseño mediante un almacenamiento dimensionado para sostener la demanda entre eventos de lluvia.\nMedio 2.4 · El establecimiento aplica el criterio de retención en el origen y el colector de barrio recibe sólo el excedente.\nMedio 3.1 y 4.1 · La función de gestión del agua está formalmente asignada a un área responsable que audita el destino del consumo.\nMedio 4.2 · El régimen de pago discrimina por destino del consumo y el uso de agua potable en actividades que no la requieren tiene un costo diferencial visible.\nMedio de tercer nivel:\nMedio 1.2.A y 2.3.A · Las decisiones sobre las instalaciones se toman con información relevada sobre superficie efectiva de captación, estado de cubiertas, volumen aprovechable y demanda por uso.\nMedios que quedan fuera del alcance del proyecto, declarados explícitamente: el Medio 1.1 (reforma de la normativa municipal) y el Medio 4.2 (cambio del régimen tarifario) dependen de decisiones del Concejo Deliberante y del ente regulador, exceden la capacidad de un proyecto de inversión sobre un edificio y tienen plazos ajenos a los del proyecto. Se los conserva en el árbol porque explican la persistencia del problema y porque el proyecto puede aportarles insumos (evidencia local), pero no se los adopta como estrategia. El Medio 1 (separación completa de la red interna, incluida la descarga sanitaria) está dentro del alcance conceptual pero excede el presupuesto de una primera etapa y se difiere, según se justifica en el ítem R.", "O": "Los fines son los efectos del ítem L expresados como situaciones deseadas, con el mismo encadenamiento. No se agrega ningún fin que no tenga su efecto correspondiente.\nFines de primer nivel:\nFin 1 · El volumen de agua extraído, potabilizado y distribuido hacia el establecimiento se ajusta a los usos que efectivamente requieren calidad potable, y disminuye la presión evitable sobre la fuente que abastece al departamento Capital.\nFin 2 · El gasto anual del establecimiento en agua de red se ajusta al volumen de sus usos de calidad potable.\nFin 3 · La escorrentía de las cubiertas se retiene en el predio durante los eventos de lluvia intensa y disminuye el aporte del establecimiento al pico de caudal del colector del sector.\nFin 4 · La comunidad de usuarios convive con instalaciones coherentes con el discurso de uso eficiente del agua de la institución, y la eficiencia hídrica se incorpora a las prácticas cotidianas del edificio.\nFin 5 · Se dispone de evidencia local sobre el desempeño técnico, económico y sanitario del aprovechamiento pluvial en edificios institucionales del departamento Capital, y otros establecimientos en igual situación cuentan con base para decidir.\nFin de segundo nivel:\nFin 2.1 · Los recursos liberados del pago de agua potable para usos que no requieren esa calidad quedan disponibles para el mantenimiento del predio y de sus instalaciones.\nLos fines más altos —Fin 1, Fin 3 y Fin 5— son los que alimentan el nivel Fin de la EAP y de la MML.", "P": "Problema central: «El establecimiento seleccionado del departamento Capital abastece con agua potable de red la totalidad de sus usos que no requieren esa calidad —riego de espacios verdes, limpieza de superficies y descarga sanitaria—, mientras la escorrentía de sus cubiertas se conduce íntegramente al desagüe pluvial sin aprovechamiento.»\nObjetivo central, propósito o meta: «El establecimiento seleccionado del departamento Capital abastece con agua de lluvia captada en sus cubiertas los usos que no requieren calidad potable —riego de espacios verdes, limpieza de superficies y descarga sanitaria—, y aprovecha la escorrentía de sus cubiertas en lugar de conducirla íntegramente al desagüe pluvial.»\nSe conservan el mismo sujeto (el establecimiento seleccionado), el mismo lugar (departamento Capital), la misma variable (volumen de agua de red destinado a usos sin exigencia de potabilidad y volumen de escorrentía derivado al pluvial) y el mismo alcance espacial: sólo cambia el signo. No se amplió la meta al conjunto de los edificios del departamento, porque el problema se enunció en un único establecimiento; el beneficio de escala es un fin, no el propósito.\nEl indicador de este propósito es el mismo del ítem E, con su valor deseado en situación con proyecto.", "Q": "El árbol de objetivos es el espejo exacto del árbol de problemas: medios abajo, meta en el tronco, fines arriba, con la misma cantidad de nodos y la misma estructura de niveles. Cada medio de los ítems N tiene su causa correspondiente en K, y cada fin del ítem O tiene su efecto correspondiente en L; no hay ramas de más ni de menos.\nLectura ascendente: si las decisiones se toman con información relevada sobre cubiertas, escorrentía aprovechable y demanda por uso, es posible dimensionar y presupuestar la adecuación y abrir el gasto por uso; con financiamiento específico, con la estacionalidad incorporada al diseño mediante almacenamiento, con la función de gestión del agua asignada y con el criterio de retención en el origen adoptado, el establecimiento llega a tener una red secundaria no potable, cubiertas que descargan a un sistema con almacenamiento, una maestranza que riega con agua del predio bajo procedimiento y una administración que analiza su consumo. Con eso el establecimiento abastece con agua de lluvia los usos que no requieren calidad potable, y de ahí se siguen los fines: menor volumen potabilizado y menor presión sobre la fuente, menor gasto y más recursos para mantenimiento, menor aporte al pico del colector, coherencia entre instalaciones y discurso institucional, y evidencia local disponible para otros edificios.\nMedios sobre los que el proyecto puede actuar, marcados en el diagrama: Medio 2, Medio 2.3, Medio 3, Medio 4, Medio 3.1/4.1 y Medio 1.2.A/2.3.A. Medios fuera del alcance, señalados con trazo punteado: Medio 1.1 (normativa municipal) y Medio 4.2 (régimen tarifario). Medio diferido a una segunda etapa: Medio 1 (separación completa de la red interna, incluida la descarga sanitaria).", "R": "Las estrategias surgen de los medios más bajos del árbol de objetivos y sus actividades son mutuamente excluyentes dentro de cada estrategia.\nEstrategia A · Medio: instalación hidráulica separada por calidad de agua (Medio 1). Actividad: ejecución de una red interna secundaria de agua no potable, alimentada por cisterna, que abastezca los artefactos sanitarios del edificio principal además del riego y la limpieza. A favor: sustituye el mayor volumen posible y ataca el medio de mayor jerarquía. En contra: exige intervenir la instalación existente en un edificio en funcionamiento, duplicar cañerías, señalizar y proteger contra conexiones cruzadas, y obtener aval sanitario y de la prestadora; la inversión y el plazo exceden lo abordable en una primera etapa.\nEstrategia B · Medio: escorrentía de cubiertas captada, almacenada y utilizada (Medios 2 y 2.3). Actividad: sistema de captación, almacenamiento con dimensionamiento estacional, filtrado y distribución del agua de lluvia de cubiertas, destinado al riego de espacios verdes y a la limpieza de superficies exteriores, con submedición y monitoreo de desempeño. A favor: no interfiere con la red interna potable, no requiere calidad de agua de bebida para los usos previstos, es acotada en costo y plazo, es medible y es directamente replicable en otros edificios. En contra: la estacionalidad obliga a un almacenamiento significativo y deja demanda residual a cubrir con red durante el período seco prolongado.\nEstrategia C · Medio: gestión del agua con responsable asignado y consumo abierto por uso (Medios 3.1/4.1 y 4). Actividad: programa de auditoría hídrica, submedición y procedimientos de riego y limpieza. A favor: costo bajo, resultados rápidos. En contra: no sustituye la fuente ni aprovecha la escorrentía, con lo cual no ataca el núcleo del problema central.\nEstrategia D · Medio: normativa municipal que exige retención y reúso (Medio 1.1). Actividad: elaboración y promoción de un proyecto de ordenanza de retención y aprovechamiento pluvial en edificios institucionales. A favor: efecto de escala sobre toda la población potencial. En contra: fuera del alcance del equipo y del titular del proyecto, con plazos políticos propios y sin efecto sobre el establecimiento en el horizonte del proyecto.\nActividades descartadas por estar fuera del alcance: la Estrategia D íntegra, por corresponder a otro nivel de decisión; y la sustitución del régimen tarifario, por depender del ente regulador. El criterio de descarte se documenta y no se oculta: son medios reales del árbol que el proyecto no puede materializar.\nEstrategia y actividad seleccionadas: Estrategia B. La actividad seleccionada es la idea fuerza del proyecto y da lugar a la componente del ítem S. La Estrategia C no se adopta como proyecto autónomo, pero sus instrumentos de medición se incorporan como sistema de monitoreo y medio de verificación de B; la Estrategia A se difiere a una segunda etapa cuya viabilidad quedará informada por los resultados de la primera.", "S": "Estructura Analítica del Proyecto, de arriba hacia abajo.\nFin: contribuir a reducir la presión evitable sobre la fuente de agua potable que abastece al departamento Capital y el aporte de escorrentía de cubiertas de edificios institucionales al colector pluvial del sector, generando evidencia local sobre el desempeño del aprovechamiento pluvial. (Tomado de los Fines 1, 3 y 5 del ítem O.)\nPropósito u objetivo central: el establecimiento seleccionado del departamento Capital abastece con agua de lluvia captada en sus cubiertas los usos que no requieren calidad potable, y aprovecha la escorrentía en lugar de conducirla íntegramente al desagüe pluvial. (Ítem P.)\nComponente, expresada como producto obtenido: sistema de captación, almacenamiento y distribución de agua de lluvia de cubiertas en operación en el establecimiento, con submedición instalada y personal capacitado para operarlo. Se redacta como estado logrado y no como acción: no es «instalar el sistema», es «sistema en operación».\nActividad: proyecto de inversión para el diseño, la construcción, la puesta en marcha y la capacitación operativa del sistema de captación y aprovechamiento de agua de lluvia de cubiertas del establecimiento, incluyendo el relevamiento previo de cubiertas y demanda, el dimensionamiento estacional del almacenamiento, la ejecución de la obra, la instalación de la submedición y el protocolo de operación y mantenimiento.", "T": "Matriz de Marco Lógico en texto, cuatro niveles y cuatro columnas.\nFIN · Resumen narrativo: contribuir a reducir la presión evitable sobre la fuente de agua potable del departamento Capital y el aporte de escorrentía de cubiertas de edificios institucionales al colector pluvial, con evidencia local disponible. · Indicador: al menos tres edificios institucionales del departamento Capital formulan o ejecutan un sistema de aprovechamiento pluvial dentro de los cinco años posteriores a la puesta en operación del caso, tomando su documentación técnica como referencia. · Medio de verificación: registro de proyectos del organismo provincial titular y de la Municipalidad de Salta, e informe de difusión de resultados publicado por el titular. · Supuesto: las políticas provinciales y municipales de eficiencia hídrica se sostienen y el organismo titular difunde los resultados del caso.\nPROPÓSITO · Resumen narrativo: el establecimiento seleccionado del departamento Capital abastece con agua de lluvia captada en sus cubiertas los usos que no requieren calidad potable y aprovecha la escorrentía de sus cubiertas. · Indicador: reducción del 40 % del volumen anual de agua potable de red destinado a riego de espacios verdes y limpieza de superficies exteriores en el establecimiento, al término del segundo año de operación, respecto de la línea de base del año cero (el valor porcentual se ajustará en el F02 con el dimensionamiento definitivo y la serie de precipitación adoptada). · Medio de verificación: registros de la submedición instalada en las tomas de riego y limpieza, planilla mensual de la administración y facturación de la prestadora, archivados en el legajo del proyecto en el establecimiento y en el organismo titular. · Supuesto: el régimen de precipitaciones del período no se aparta significativamente de la serie histórica del Valle de Lerma y la autoridad sanitaria no dispone restricciones al uso de agua de lluvia en los destinos previstos.\nCOMPONENTE · Resumen narrativo: sistema de captación, almacenamiento y distribución de agua de lluvia de cubiertas en operación, con submedición instalada y personal capacitado. · Indicador: un sistema en operación al mes 12 del proyecto, con la superficie de cubierta conectada y el volumen de almacenamiento que resulten del dimensionamiento (a definir en el F02 y a expresar en metros cuadrados y metros cúbicos), y con el 100 % del personal de maestranza capacitado en su operación. · Medio de verificación: acta de recepción de obra, planos conforme a obra, protocolo de puesta en marcha y registro de asistencia a la capacitación, en el legajo técnico del organismo titular. · Supuesto: el establecimiento conserva el destino de uso del predio y no se ejecutan obras que alteren o inutilicen las cubiertas comprometidas.\nACTIVIDAD · Resumen narrativo: diseño, contratación, construcción, instalación de submedición, puesta en marcha y capacitación operativa del sistema. · Indicador: 100 % de las etapas previstas ejecutadas dentro de los 12 meses y del presupuesto aprobado, según certificados de avance. · Medio de verificación: certificados de avance de obra, órdenes de compra y rendiciones de la unidad ejecutora. · Supuesto: el financiamiento aprobado se transfiere en los plazos previstos y la variación de precios de materiales no altera sustantivamente el presupuesto.", "U": "Lógica vertical, narrada de abajo hacia arriba: si se ejecuta el proyecto de diseño, obra, submedición y capacitación, y se cumple el supuesto de que el financiamiento llega en plazo, se obtiene el sistema de captación y aprovechamiento en operación con personal capacitado. Si el sistema opera y se cumple el supuesto de que las cubiertas comprometidas se conservan, el establecimiento pasa a abastecer con agua de lluvia sus usos que no requieren calidad potable. Si eso ocurre y se cumple el supuesto de que la precipitación del período no se aparta de la serie histórica, disminuyen el volumen potabilizado destinado a esos usos, el gasto en agua y el aporte al pico del colector, y queda documentado el desempeño del sistema. Si además el titular difunde esos resultados, se contribuye al fin: menor presión sobre la fuente del departamento Capital y evidencia local que habilita la réplica.\nLógica horizontal, fila por fila: en el propósito, el indicador es el volumen de agua de red destinado a riego y limpieza, y los medios de verificación —submedición en esas tomas, planilla mensual y facturación— son necesarios y suficientes para calcularlo, porque la submedición aporta el numerador y la facturación el control del total; sin la submedición el indicador no sería calculable, y por eso instalarla forma parte de la componente y no es un supuesto. En la componente, el acta de recepción, los planos conforme a obra y el registro de capacitación permiten verificar sin ambigüedad el estado logrado. En la actividad, los certificados de avance y las rendiciones son la fuente natural de la ejecución física y financiera. En el fin, el registro de proyectos del organismo titular y de la Municipalidad es una fuente que existe o puede construirse, aunque exige un compromiso explícito de seguimiento posterior al cierre del proyecto: es la fila horizontalmente más débil de la matriz.\nLógica zigzag: cada nivel sumado a los supuestos del nivel inferior permite alcanzar el nivel superior. Actividad más financiamiento en plazo da componente; componente más conservación de las cubiertas da propósito; propósito más comportamiento normal de la precipitación y ausencia de restricción sanitaria da fin.\nSupuesto más frágil: el del propósito, referido al régimen de precipitaciones. Es el único que puede invalidar el resultado sin que nada haya fallado en la ejecución, porque la oferta del sistema depende íntegramente de una variable ambiental estacional y de alta variabilidad interanual en el Valle de Lerma. Su mitigación no es un supuesto adicional sino una decisión de diseño: dimensionar el almacenamiento con una serie de precipitación suficientemente larga, adoptar un año seco de referencia y expresar el indicador del propósito como promedio de dos años de operación en lugar de un solo ciclo. El supuesto del componente relativo al mantenimiento del sistema, en cambio, no debe escribirse como supuesto: la operación y el mantenimiento están dentro del control del proyecto y por eso figuran como capacitación y protocolo dentro de la componente.", "V": "Nombre del proyecto: «Sistema de captación y aprovechamiento de agua de lluvia de cubiertas para la sustitución de agua potable en riego y limpieza de un establecimiento institucional del departamento Capital, Salta».\nSe construye con las tres piezas que pide la Guía: qué se hace (sistema de captación y aprovechamiento de agua de lluvia de cubiertas), para qué (sustituir agua potable de red en riego de espacios verdes y limpieza de superficies) y dónde (establecimiento institucional del departamento Capital, provincia de Salta). Es representativo de la alternativa seleccionada en el ítem R y de la componente de la EAP, y no repite el enunciado del problema.\nSi se requiere una versión corta para los formularios F02 a F04: «Aprovechamiento pluvial para riego y limpieza · establecimiento institucional, departamento Capital».\nEste nombre es distinto del nombre de fantasía del equipo (ítem A, PLUVIA S.H.): uno identifica a quien formula, el otro a lo formulado."}, "eap": {"fin": "Contribuir a reducir la presión evitable sobre la fuente de agua potable que abastece al departamento Capital y el aporte de escorrentía de cubiertas de edificios institucionales al colector pluvial del sector, generando evidencia local sobre el desempeño del aprovechamiento pluvial.", "prop": "El establecimiento seleccionado del departamento Capital abastece con agua de lluvia captada en sus cubiertas los usos que no requieren calidad potable, y aprovecha la escorrentía de sus cubiertas en lugar de conducirla íntegramente al desagüe pluvial.", "comp": "Sistema de captación, almacenamiento y distribución de agua de lluvia de cubiertas en operación en el establecimiento, con submedición instalada y personal de maestranza capacitado para operarlo.", "act": "Proyecto de inversión para el relevamiento, diseño, dimensionamiento estacional, construcción, instalación de submedición, puesta en marcha y capacitación operativa del sistema de captación y aprovechamiento de agua de lluvia de cubiertas del establecimiento."}, "mml": {"fin": ["Contribuir a reducir la presión evitable sobre la fuente de agua potable que abastece al departamento Capital y el aporte de escorrentía de cubiertas de edificios institucionales al colector pluvial, con evidencia local disponible sobre el desempeño del aprovechamiento pluvial.", "Al menos tres edificios institucionales del departamento Capital formulan o ejecutan un sistema de aprovechamiento pluvial dentro de los cinco años posteriores a la puesta en operación del caso, tomando su documentación técnica como referencia.", "Registro de proyectos del organismo provincial titular y de la Municipalidad de Salta, e informe de difusión de resultados publicado por el titular al cierre del segundo año de operación.", "Las políticas provinciales y municipales de eficiencia hídrica se sostienen en el período y el organismo titular difunde los resultados del caso."], "prop": ["El establecimiento seleccionado del departamento Capital abastece con agua de lluvia captada en sus cubiertas los usos que no requieren calidad potable y aprovecha la escorrentía de sus cubiertas en lugar de conducirla íntegramente al desagüe pluvial.", "Reducción del 40 % del volumen anual de agua potable de red destinado a riego de espacios verdes y limpieza de superficies exteriores en el establecimiento, al término del segundo año de operación, respecto de la línea de base del año cero (el porcentaje se ajustará en el F02 con el dimensionamiento definitivo y la serie de precipitación adoptada).", "Registros de la submedición instalada en las tomas de riego y limpieza, planilla mensual de consumo de la administración y facturación de la prestadora, archivados en el legajo del proyecto en el establecimiento y en el organismo titular.", "El régimen de precipitaciones del período no se aparta significativamente de la serie histórica del Valle de Lerma y la autoridad sanitaria no dispone restricciones al uso de agua de lluvia en los destinos previstos."], "comp": ["Sistema de captación, almacenamiento y distribución de agua de lluvia de cubiertas en operación, con submedición instalada y personal de maestranza capacitado.", "Un sistema en operación al mes 12 del proyecto, con la superficie de cubierta conectada y el volumen de almacenamiento resultantes del dimensionamiento (valores en metros cuadrados y metros cúbicos a definir en el F02), y con el 100 % del personal de maestranza capacitado en su operación y mantenimiento.", "Acta de recepción de obra, planos conforme a obra, protocolo de puesta en marcha y registro de asistencia a la capacitación, en el legajo técnico del organismo provincial titular.", "El establecimiento conserva el destino de uso del predio y no se ejecutan obras que alteren o inutilicen las cubiertas comprometidas."], "act": ["Relevamiento de cubiertas y demanda, diseño y dimensionamiento estacional, contratación, construcción, instalación de la submedición, puesta en marcha y capacitación operativa del sistema.", "100 % de las etapas previstas ejecutadas dentro de los 12 meses de plazo y del presupuesto aprobado, según certificados de avance del proyecto en el establecimiento.", "Certificados de avance de obra, órdenes de compra y rendiciones de cuentas de la unidad ejecutora, disponibles en el expediente del organismo titular.", "El financiamiento aprobado se transfiere en los plazos previstos y la variación de precios de materiales no altera sustantivamente el presupuesto aprobado."]}, "alt": [{"id": "A", "med": "Medio 1 · Instalación hidráulica del establecimiento separada por calidad de agua", "act": "Ejecución de una red interna secundaria de agua no potable, alimentada por cisterna, que abastezca los artefactos sanitarios del edificio principal además del riego y la limpieza exterior", "ven": "Sustituye el mayor volumen posible de agua potable y ataca el medio de mayor jerarquía del árbol; resuelve la causa de fondo, que es la instalación única sin diferenciación por calidad", "des": "Exige intervenir la instalación existente en un edificio en funcionamiento, duplicar cañerías, señalizar y proteger contra conexiones cruzadas, y obtener aval de la autoridad sanitaria y de la prestadora; la inversión y el plazo exceden lo abordable en una primera etapa"}, {"id": "B", "med": "Medios 2 y 2.3 · Escorrentía de cubiertas captada, almacenada con dimensionamiento estacional y utilizada en el predio", "act": "Sistema de captación, almacenamiento, filtrado y distribución del agua de lluvia de cubiertas destinado al riego de espacios verdes y a la limpieza de superficies exteriores, con submedición y monitoreo de desempeño", "ven": "No interfiere con la red interna potable ni exige calidad de agua de bebida para los usos previstos; costo y plazo acotados; resultado medible con submedición; directamente replicable en otros edificios institucionales y generador de la evidencia local que hoy no existe", "des": "La marcada estacionalidad del Valle de Lerma obliga a un almacenamiento significativo y deja demanda residual a cubrir con red durante el período seco; requiere espacio físico en el predio y mantenimiento periódico de filtros y cisterna"}, {"id": "C", "med": "Medios 4 y 3.1/4.1 · Consumo abierto por uso, analizado periódicamente, con función de gestión del agua asignada", "act": "Programa de auditoría hídrica del establecimiento: submedición por uso, designación del área responsable y procedimientos escritos de riego y limpieza", "ven": "Costo bajo, plazo corto, no requiere obra ni habilitaciones, y produce de inmediato la información que hoy falta para decidir", "des": "No sustituye la fuente ni aprovecha la escorrentía de cubiertas, de modo que no ataca el núcleo del problema central: reduce el consumo marginal pero deja intacta la situación de abastecer con potable usos que no la requieren"}, {"id": "D", "med": "Medio 1.1 · Normativa municipal que reconoce la escorrentía de cubiertas como recurso y exige su retención y reúso", "act": "Elaboración y promoción de un proyecto de ordenanza de retención y aprovechamiento pluvial en edificios institucionales del departamento Capital", "ven": "Efecto de escala sobre toda la población potencial y ataque a la raíz institucional: mientras no se exija, nadie lo hace", "des": "Fuera del alcance del equipo y del titular del proyecto; depende de tiempos y mayorías del Concejo Deliberante; no produce ningún efecto sobre el establecimiento dentro del horizonte del proyecto y carece de evidencia local en que apoyarse"}], "altSel": "B", "altJus": "Se comparan las cuatro alternativas con cinco criterios declarados: gobernabilidad (que el titular del proyecto pueda decidir y ejecutar), jerarquía del medio atacado en el árbol de objetivos, viabilidad sanitaria y de habilitaciones, relación entre inversión y volumen sustituido, y replicabilidad y capacidad de generar evidencia local. La alternativa D se descarta por gobernabilidad: es un medio real del árbol, pero corresponde a otro nivel de decisión y su plazo es ajeno al proyecto; se la conserva documentada porque los resultados de B son precisamente el insumo que una futura ordenanza necesita. La alternativa C se descarta como proyecto autónomo por jerarquía del medio: mejora la gestión del consumo pero no aprovecha la escorrentía, de modo que el problema central seguiría existiendo aun con C plenamente lograda; sus instrumentos —submedición y procedimientos— se incorporan como parte de la componente de B y como medio de verificación de su indicador, con lo que se preserva la exclusión mutua entre alternativas. La alternativa A es la de mayor jerarquía y la que sustituiría el mayor volumen, pero cae por viabilidad y por relación inversión-resultado en una primera etapa: intervenir la instalación sanitaria de un edificio en funcionamiento, con doble cañería, señalización y protección contra conexiones cruzadas, exige aval sanitario y de la prestadora, y multiplica el costo sin que exista todavía evidencia local de desempeño; se la difiere a una segunda etapa que quedará informada por los resultados de B. Se selecciona B porque combina gobernabilidad plena del titular, ataque directo al segundo término del problema central (la escorrentía desaprovechada), exigencia sanitaria compatible con los usos previstos, costo y plazo abordables en un perfil, y capacidad de producir el dato que el propio escenario señala como ausente. Se asume explícitamente su límite: por la estacionalidad del valle, B no sustituye la totalidad del consumo no potable, y por eso el indicador del propósito se fija en una reducción parcial y no en el 100 %.", "corr": ["Problema central escrito como «falta de un sistema de captación de agua de lluvia» o cualquier variante de ausencia de solución. Es la trampa mayor de este escenario porque el título del escenario ya nombra la solución: si el enunciado del problema contiene la palabra sistema, captación o cisterna, el árbol entero se construyó al revés y el análisis de alternativas del ítem R quedó decidido de antemano.", "Problema central formulado como «escasez de agua» (sin sujeto, lugar, plazo ni magnitud, y probablemente falso para un edificio conectado a la red) o como «falta de conciencia ambiental de los usuarios» (traslada al usuario una decisión de diseño e institucional y no es accionable por un proyecto de inversión).", "Árbol de problemas con causas exclusivamente técnicas —canaletas, tanques, bombas, filtros— y sin las dimensiones institucional (la normativa municipal que trata la escorrentía como efluente y la ausencia de responsable del agua), económica (régimen de pago que no discrimina por destino, inversión postergada frente a gastos corrientes) ni ambiental (estacionalidad del Valle de Lerma). Un árbol así sólo puede producir alternativas de ferretería.", "El equipo analiza únicamente el techo y olvida el sistema que hoy da agua al edificio: no aparece de dónde sale el agua potable, quién la paga, con qué tarifa, ni qué calidad exige cada uso. Señal concreta: en el ítem E hay un indicador de escorrentía captable y ninguno de consumo por uso.", "Cifras de precipitación, superficie de cubierta, consumo anual o costo del agua presentadas como dato firme sin fuente, cuando el escenario no aporta ninguna cifra. La respuesta correcta declara el supuesto, lo numera y explicita el criterio, y remite su verificación al F02.", "Errores de forma de la EAP y la MML que en este escenario son sistemáticos: componente redactada como acción («instalar el sistema de captación») en lugar de producto («sistema en operación»); supuestos que son tareas del propio proyecto («que se realice el mantenimiento de los filtros», «que el personal se capacite»), cuando el supuesto verdaderamente externo es el régimen de precipitaciones; y nombre del proyecto (ítem V) igual al nombre de fantasía del equipo (ítem A) o copiado del título del escenario."]}, "9": {"n": 9, "pc": "El soporte ambiental del que dependen las condiciones de habitabilidad del borde este de la ciudad de Salta —el predio fiscal de unas 800 ha sobre la RN 9, último remanente continuo de vegetación nativa del sector— se degrada de manera progresiva: pierde cobertura leñosa, capacidad de infiltración y de retención del escurrimiento, y permanece sin destino de uso definido ni acceso público para la población que lo rodea.", "pcjus": "El escenario presenta dos deterioros que ocurren a la vez, y la tentación es escribirlos como dos problemas unidos por una conjunción; el enunciado adoptado los integra en una sola situación porque el predio es, materialmente, el mismo objeto en los dos casos: es la superficie que infiltra y recarga el acuífero del que el sector se abastece, la que retiene el escurrimiento que hoy descarga por un punto único, la que modera la temperatura del borde y la única disponible para el espacio verde público que el sector no tiene. La habitabilidad no es un segundo problema pegado al primero: es la función de ese soporte, y por eso el sujeto afectado del enunciado es el soporte ambiental caracterizado por aquello de lo que depende. Se descartó «falta de un parque en el borde este» porque incorpora la solución al enunciado y clausura el análisis de alternativas antes de empezar, y «avance de la urbanización» porque es un proceso de contexto, no una situación localizada y mensurable. También se descartó «la gente tira basura en el predio», que es un uso informal derivado de que el predio no tiene destino, gestión ni control visible, y por lo tanto pertenece al árbol como causa y como efecto, no como tronco. Por último se descartó reducir el problema a «pérdida de cobertura vegetal nativa», formulación correcta pero incompleta: deja fuera a la población afectada y conduce a una alternativa de conservación estricta que no resuelve el déficit de espacio público que el mismo escenario documenta.", "objc": "El soporte ambiental del que dependen las condiciones de habitabilidad del borde este de la ciudad de Salta —el predio fiscal de unas 800 ha sobre la RN 9, último remanente continuo de vegetación nativa del sector— se conserva y recupera: mantiene su cobertura leñosa, su capacidad de infiltración y de retención del escurrimiento, y cuenta con destino de uso definido y con acceso público para la población que lo rodea.", "sit": [{"id": "s1", "t": "El soporte ambiental del que dependen las condiciones de habitabilidad del borde este de la ciudad de Salta —el predio fiscal de unas 800 ha sobre la RN 9, último remanente continuo de vegetación nativa del sector— se degrada de manera progresiva: pierde cobertura leñosa, capacidad de infiltración y de retención del escurrimiento, y permanece sin destino de uso definido ni acceso público para la población que lo rodea.", "k": "p", "d": "ter"}, {"id": "s2", "t": "La recarga del acuífero de escasa dimensión que la cabecera de cuenca alimenta disminuye al reducirse la superficie con cubierta y capacidad de infiltración, en un sector cuyas cotas superiores ya se abastecen por camión cisterna.", "k": "e", "d": "amb"}, {"id": "s3", "t": "El escurrimiento superficial del sector aumenta en volumen y velocidad y descarga por las alcantarillas del corredor vial, único punto de salida hacia un cauce receptor revestido y sin capacidad ociosa.", "k": "e", "d": "tec"}, {"id": "s4", "t": "El sector de riesgo hídrico crítico situado aguas abajo del punto de descarga queda más expuesto a anegamientos y a daños en viviendas e infraestructura durante los eventos de precipitación intensa.", "k": "e", "d": "ter"}, {"id": "s5", "t": "Se contraen las poblaciones de las 32 especies leñosas nativas del bosque joven —dos de ellas con categoría de conservación desfavorable— y el hábitat de las 82 especies de aves y 6 de mamíferos registradas en el inventario.", "k": "e", "d": "amb"}, {"id": "s6", "t": "Los hogares del borde este quedan sin ámbito de encuentro ni de actividad al aire libre en condiciones seguras: la recreación se traslada a la calzada, a la banquina de la ruta y a los bordes del predio, con mayor carga térmica estival y exposición al humo de las quemas.", "k": "e", "d": "soc"}, {"id": "s7", "t": "Se agrava la competencia por el agua entre los barrios del sector y se prolonga la dependencia del abastecimiento por camión cisterna en las cotas superiores.", "k": "e", "d": "eco"}, {"id": "s8", "t": "El destino del predio queda determinado por la ocupación de hecho y no por una decisión de planificación, de modo que cada año se reduce el abanico de alternativas técnicamente posibles.", "k": "e", "d": "ins"}, {"id": "s9", "t": "Crece el costo público futuro de reponer por obra las funciones que hoy presta el predio: retención del escurrimiento, ampliación de redes, forestación y adquisición de suelo para espacio verde.", "k": "e", "d": "eco"}, {"id": "s10", "t": "El predio fiscal no tiene acto administrativo que le asigne destino de uso ni organismo con la administración efectivamente a cargo: ninguna repartición ejerce control territorial sobre las 800 ha.", "k": "c", "d": "ins"}, {"id": "s11", "t": "No existe información sistematizada del predio —límite catastral, cobertura, suelos, pendientes, hidrología y aptitud por sector— con el detalle necesario para fundamentar una zonificación interna o una restricción de uso.", "k": "c", "d": "tec"}, {"id": "s12", "t": "La planificación urbana del ejido y la gestión del patrimonio natural fiscal se tramitan por circuitos administrativos separados, y los municipios del área metropolitana aplican normativas de uso del suelo dispares sin un ámbito común de decisión sobre el borde.", "k": "c", "d": "ins"}, {"id": "s13", "t": "En una ciudad que agotó su suelo vacante interior, el valor de expectativa del suelo del borde orienta la decisión de destino hacia el uso residencial rentable y desalienta comprometer el predio a un uso que no genera renta directa.", "k": "c", "d": "eco"}, {"id": "s14", "t": "Ninguna cuadrilla ni guardia territorial interviene sobre las quemas de pastizal, la extracción de leña y áridos, el ingreso de ganado ni los microbasurales perimetrales.", "k": "c", "d": "tec"}, {"id": "s15", "t": "Las quemas recurrentes, el pastoreo y la extracción impiden la regeneración de la cubierta leñosa joven sobre suelos erosionables con pendientes superiores al 30 % en la mitad alta del predio.", "k": "c", "d": "amb"}, {"id": "s16", "t": "Los hogares de los barrios linderos obtienen del predio leña, áridos y pastura y disponen allí sus residuos, porque no acceden a gas de red, a materiales de construcción asequibles ni al servicio de recolección en las cotas superiores.", "k": "c", "d": "soc"}, {"id": "s17", "t": "La oferta habitacional formal no alcanza a los hogares de menores ingresos del sector, que resuelven su vivienda por autoconstrucción y ocupación informal ladera arriba.", "k": "c", "d": "eco"}, {"id": "s18", "t": "El sector no dispone de espacio verde público —una única plaza reducida y en pendiente y un patio escolar insuficiente— ni de suelo urbano vacante alternativo, de modo que toda la demanda de expansión residencial y de espacio libre recae sobre el predio.", "k": "c", "d": "ter"}], "lnk": [{"a": "s11", "b": "s10"}, {"a": "s12", "b": "s10"}, {"a": "s13", "b": "s10"}, {"a": "s10", "b": "s14"}, {"a": "s14", "b": "s15"}, {"a": "s16", "b": "s15"}, {"a": "s17", "b": "s16"}, {"a": "s17", "b": "s18"}, {"a": "s10", "b": "s1"}, {"a": "s15", "b": "s1"}, {"a": "s16", "b": "s1"}, {"a": "s18", "b": "s1"}, {"a": "s1", "b": "s2"}, {"a": "s
