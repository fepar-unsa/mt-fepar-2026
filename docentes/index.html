una causa o efecto sin su espejo.", "R": "Se parte de los medios más bajos del árbol y se pregunta qué hay que hacer para materializarlos. Las actividades dentro de cada estrategia son mutuamente excluyentes.\nEstrategia A — Medio 1.2: productores con asistencia técnica sistematizada y protocolos escritos. Actividades: (A1) programa provincial de asistencia técnica y capacitación en cultivo, cosecha y procesamiento de Luffa cylindrica, con manual de buenas prácticas; (A2) escuela de campo entre pares, con productores referentes. Se descarta A2 por sí sola: mejora el saber pero no resuelve el corte del abastecimiento, porque no aporta capacidad de secado, acopio ni compromiso comercial.\nEstrategia B — Medios 1, 1.1, 2, 3 y 3.1 simultáneamente: acondicionamiento homogéneo, capacidad de secado y acopio, producción sostenida entre cosechas y comercialización con acuerdos formales. Actividades: (B1) centro asociativo de acondicionamiento, acopio y comercialización de esponja vegetal, con protocolo único de calidad y programación anual de entregas; (B2) provisión de equipos individuales de secado a cada emprendimiento por separado. Se descarta B2: replica la inversión en cada predio, no agrega la oferta, no resuelve la informalidad comercial y deja intacta la dispersión territorial.\nEstrategia C — Medio 2.2: demanda provincial dimensionada. Actividades: (C1) estudio de mercado y sistema de información de demanda de productos de higiene biodegradables en la provincia; (C2) encuesta puntual a consumidores en ferias. Se descarta C2 por insuficiente. C1 no se descarta como contenido: se incorpora como estudio previo dentro de la formulación (F02), porque es un insumo del proyecto y no un proyecto en sí mismo —por sí solo no modifica la continuidad de la oferta.\nEstrategia D — Medio 4: requisitos de habilitación conocidos y cumplidos. Actividades: (D1) ventanilla de acompañamiento para el registro y la habilitación de productos de higiene de origen vegetal; (D2) contratación individual de asesoramiento por productor. Se descarta D2 por costo unitario. D1 se incorpora como línea de trabajo dentro de la estrategia seleccionada, no como proyecto autónomo.\nEstrategia E — Medio 1.3.A: zonas aptas identificadas. Actividad: (E1) zonificación agroclimática provincial del cultivo. Se descarta por estar fuera del alcance: excede la escala, el presupuesto y las competencias de una iniciativa asociativa de base y corresponde a un organismo provincial. Pasa a la columna de supuestos.\nEstrategia y actividad seleccionadas: Estrategia B, actividad B1 — centro asociativo de acondicionamiento, acopio y comercialización de esponja vegetal. Es la única alternativa que ataca simultáneamente los tres cuellos de botella que el laboratorio identifica como raíces —continuidad de escala y secado, capital de trabajo y cadena de comercialización— y la única que produce un cambio verificable en el indicador del propósito. Las líneas A1 y D1 se incorporan como componentes complementarios del mismo proyecto, y C1 como estudio previo obligatorio del F02.\nDescripción de la actividad seleccionada: instalación y puesta en marcha de un establecimiento asociativo con área de recepción, lavado, secado, corte, empaque y depósito climatizado; adopción de un protocolo de calidad común y de un sistema de trazabilidad por lote; acopio programado que permite entregar todo el año; contratos o compromisos anuales de entrega con comercios y ferias; y acompañamiento a los productores en la habilitación del producto.\nTodas las alternativas evaluadas provienen de medios explícitos del árbol de objetivos: ninguna aparece de la nada.", "S": "Fin: reducción del consumo y del descarte de esponjas plásticas de un solo uso y permanencia de la capacidad productiva local de esponja vegetal en las localidades urbanas y periurbanas de la provincia de Salta.\nPropósito (objetivo central): la oferta local de esponjas vegetales de Luffa cylindrica abastece en forma continua y regular a los comercios especializados, las ferias de emprendedores y los consumidores de las localidades urbanas y periurbanas de la provincia de Salta.\nComponente (medio expresado como producto obtenido): centro asociativo de acondicionamiento, acopio y comercialización de esponja vegetal en funcionamiento, con protocolo único de calidad aplicado, capacidad de acopio para el ciclo anual completo y compromisos de entrega vigentes con comercios y ferias. Componentes complementarios: productores capacitados con protocolo escrito de cultivo y procesamiento adoptado, y producto habilitado para su comercialización formal.\nActividad (el proyecto de inversión a desarrollar, cuyo resultado es la componente): proyecto de inversión para la instalación y puesta en marcha del centro asociativo de acondicionamiento, acopio y comercialización de esponja vegetal, que comprende el estudio de demanda provincial, la constitución de la figura asociativa, la obra y el equipamiento de lavado, secado, corte, empaque y depósito, la elaboración y adopción del protocolo de calidad, la capacitación de los productores, la tramitación de la habilitación del producto y la formalización de los acuerdos de entrega.\nControl de corrección: la componente está escrita como estado alcanzado —«centro en funcionamiento», «productores capacitados», «producto habilitado»—, no como acción. «Instalar el centro» o «capacitar a los productores» son actividades, no componentes.", "T": "Nivel Fin. Resumen narrativo: se reduce el consumo y el descarte de esponjas plásticas de un solo uso y se conserva la capacidad productiva local de esponja vegetal en las localidades urbanas y periurbanas de Salta. Indicador: reducción del 15 % en las unidades de esponja sintética vendidas en los comercios especializados adheridos de las localidades de intervención, a los 36 meses de puesta en marcha del centro, respecto de la línea de base (meta asumida a falta de dato en el escenario; a verificar y ajustar en el F02 con el estudio de demanda). Medio de verificación: registro anual de ventas por rubro aportado por los comercios adheridos bajo convenio de confidencialidad, consolidado en el informe de seguimiento del proyecto y archivado en la asociación titular. Supuesto: se mantienen las campañas de educación ambiental y las políticas de reducción del plástico de un solo uso que sostienen la demanda de alternativas biodegradables, y no se produce un ingreso masivo de esponja vegetal importada a precio por debajo del costo local.\nNivel Propósito. Resumen narrativo: la oferta local de esponjas vegetales de Luffa cylindrica abastece en forma continua y regular a los comercios especializados, las ferias y los consumidores de las localidades urbanas y periurbanas de Salta. Indicador: 85 % de las semanas del año con esponja vegetal de producción local disponible en los comercios y puestos de feria adheridos de las localidades de intervención, medido durante los 12 meses posteriores a la puesta en marcha (línea de base asumida: 30 %; ambos valores a verificar en el F02). Medio de verificación: registro semanal de disponibilidad en góndola, con planilla firmada por el responsable de cada punto de venta, consolidado mensualmente por la asociación titular. Supuesto: los comercios y ferias sostienen el espacio de venta asignado al producto local y no lo reasignan durante el período de puesta en marcha; las condiciones climáticas de la temporada no provocan una pérdida extraordinaria de cosecha.\nNivel Componente. Resumen narrativo: centro asociativo de acondicionamiento, acopio y comercialización en funcionamiento, con protocolo de calidad aplicado, productores capacitados y producto habilitado. Indicador: el centro procesa y acopia el volumen equivalente a 12 meses de entregas programadas y opera con al menos 15 emprendimientos y 20 puntos de venta bajo compromiso anual de entrega, en las localidades de intervención, al cierre del primer año de operación (valores asumidos por capacidad esperable; a verificar en el F02). Medio de verificación: libro de recepción y despacho por lote del centro, actas de los compromisos de entrega firmados, certificado de habilitación del establecimiento y constancia de inscripción del producto, todo archivado en la sede de la asociación. Supuesto: los organismos municipales y provinciales otorgan las habilitaciones del establecimiento y del producto en los plazos previstos; los productores mantienen la adhesión al esquema asociativo.\nNivel Actividad. Resumen narrativo: ejecución del proyecto de inversión —estudio de demanda, constitución de la figura asociativa, obra y equipamiento de lavado, secado, corte, empaque y depósito, elaboración del protocolo, capacitación, tramitación de habilitaciones y formalización de acuerdos—. Indicador: 100 % de las obras y adquisiciones previstas ejecutadas y rendidas dentro de los 12 meses de iniciada la ejecución, en la localidad sede, con desvío presupuestario no mayor al 10 % (metas asumidas de gestión; el monto se determina en el F03). Medio de verificación: certificados de avance de obra, actas de recepción de equipos, rendiciones financieras y comprobantes de compra auditados por el organismo financista, archivados en el expediente del proyecto. Supuesto: se concreta el desembolso del financiamiento en los plazos comprometidos y se dispone del predio con dominio o cesión de uso resuelta.", "U": "Lógica vertical (de abajo hacia arriba). Si se ejecuta el proyecto de inversión —estudio de demanda, figura asociativa constituida, obra y equipamiento de lavado, secado, corte, empaque y depósito, protocolo de calidad, capacitación, habilitaciones y acuerdos de entrega—, entonces se obtiene la componente: un centro asociativo en funcionamiento, con protocolo aplicado, productores capacitados y producto habilitado. Si el centro funciona con esas condiciones, entonces la fibra deja de depender de la capacidad individual de cada predio, se acopia y se entrega en forma programada durante todo el año, y se alcanza el propósito: la oferta local abastece de manera continua y regular a comercios, ferias y consumidores de las localidades urbanas y periurbanas de Salta. Si la oferta es continua, entonces los comercios sostienen el espacio de venta, los consumidores encuentran efectivamente la alternativa que declaran preferir y los productores consolidan ingreso, con lo cual se contribuye al fin: menor consumo y descarte de esponjas plásticas de un solo uso y permanencia de la capacidad productiva local. La cadena se sostiene y no presenta saltos: cada nivel es condición del siguiente y ninguno introduce un elemento ajeno al árbol de objetivos.\nLógica horizontal (fila por fila). Fin: el indicador de unidades de esponja sintética vendidas en los comercios adheridos es adecuado pero indirecto, y el registro de ventas por rubro es necesario y suficiente para calcularlo sólo si los comercios aceptan aportarlo; por eso el convenio de confidencialidad es parte del diseño y no un accesorio. Propósito: la proporción de semanas con producto disponible se calcula íntegramente con el registro semanal de góndola, que es una fuente que el proyecto puede construir y sostener; el indicador mide exactamente el atributo del problema —la continuidad—, de modo que su cumplimiento equivale al logro del objetivo. Componente: el libro de recepción y despacho por lote, las actas de compromiso y las constancias de habilitación permiten verificar tanto el volumen procesado como la existencia efectiva de los acuerdos; son fuentes internas del proyecto, auditables. Actividad: los certificados de avance, las actas de recepción y las rendiciones son los medios habituales y suficientes para el indicador de ejecución física y financiera.\nLógica zigzag. Actividad más el supuesto de desembolso en plazo y predio disponible permiten llegar a la componente. Componente más el supuesto de que las habilitaciones se otorgan en plazo y de que los productores mantienen la adhesión permiten llegar al propósito. Propósito más el supuesto de que los comercios sostienen el espacio de venta y de que no hay pérdida extraordinaria de cosecha permiten llegar al fin. Ningún supuesto enunciado es una tarea del proyecto: la constitución de la asociación, la compra de equipos, la capacitación y la tramitación de las habilitaciones están dentro del proyecto y por eso figuran como actividades, no como supuestos.\nSupuesto más frágil: «los comercios y ferias sostienen el espacio de venta asignado al producto local y no lo reasignan durante la puesta en marcha». Es el más frágil por tres razones: el efecto 1 del árbol muestra que esa reasignación ya está ocurriendo; el actor con posición contraria identificado en el ítem H —los distribuidores de esponjas sintéticas e importadas— tiene fuerza y capacidad de disputar la góndola por precio y bonificación; y el proyecto no controla la decisión comercial minorista. Medida de mitigación prevista en el diseño, no en los supuestos: formalizar compromisos anuales de entrega con volumen y precio de referencia antes de poner en marcha el centro, de modo de convertir un supuesto en una condición contractual verificable.", "V": "Nombre del proyecto: «Instalación de un centro asociativo de acondicionamiento, acopio y comercialización de esponja vegetal de Luffa cylindrica para el abastecimiento continuo de comercios y ferias de las localidades urbanas y periurbanas de la provincia de Salta».\nSe construye con las tres piezas que pide la Guía: qué se hace (instalación de un centro asociativo de acondicionamiento, acopio y comercialización), para qué (abastecimiento continuo de comercios y ferias) y dónde (localidades urbanas y periurbanas de la provincia de Salta). Es representativo de la alternativa seleccionada en el ítem R y de la componente de la EAP.\nNombre corto de uso interno, para los formularios F02, F03 y F04: «Centro Asociativo de Esponja Vegetal — Salta».\nControl de corrección: este nombre es distinto del nombre de fantasía del equipo del ítem A («Fibra Norte S.H.») y no es el enunciado del problema. Tampoco es un nombre publicitario: dice qué se va a hacer, para qué y dónde."}, "eap": {"fin": "Reducción del consumo y del descarte de esponjas plásticas de un solo uso y permanencia de la capacidad productiva local de esponja vegetal en las localidades urbanas y periurbanas de la provincia de Salta.", "prop": "La oferta local de esponjas vegetales de Luffa cylindrica abastece en forma continua y regular a los comercios especializados, las ferias de emprendedores y los consumidores de las localidades urbanas y periurbanas de la provincia de Salta.", "comp": "Centro asociativo de acondicionamiento, acopio y comercialización de esponja vegetal en funcionamiento, con protocolo único de calidad aplicado, capacidad de acopio para el ciclo anual completo, productores capacitados y producto habilitado para su comercialización formal.", "act": "Proyecto de inversión para la instalación y puesta en marcha del centro asociativo: estudio de demanda provincial, constitución de la figura asociativa, obra y equipamiento de lavado, secado, corte, empaque y depósito, elaboración y adopción del protocolo de calidad, capacitación de productores, tramitación de las habilitaciones del establecimiento y del producto, y formalización de los compromisos anuales de entrega con comercios y ferias."}, "mml": {"fin": ["Se reduce el consumo y el descarte de esponjas plásticas de un solo uso y se conserva la capacidad productiva local de esponja vegetal en las localidades urbanas y periurbanas de la provincia de Salta.", "Reducción del 15 % en las unidades de esponja sintética vendidas en los comercios especializados adheridos de las localidades de intervención, a los 36 meses de puesta en marcha del centro, respecto de la línea de base (meta asumida: el escenario no aporta el dato; a verificar y ajustar en el F02).", "Registro anual de ventas por rubro aportado por los comercios adheridos bajo convenio de confidencialidad, consolidado en el informe anual de seguimiento y archivado en la sede de la asociación titular.", "Se mantienen las campañas de educación ambiental y las políticas de reducción del plástico de un solo uso que sostienen la demanda de alternativas biodegradables, y no se produce un ingreso masivo de esponja vegetal importada a precio inferior al costo local."], "prop": ["La oferta local de esponjas vegetales de Luffa cylindrica abastece en forma continua y regular a los comercios especializados, las ferias de emprendedores y los consumidores de las localidades urbanas y periurbanas de la provincia de Salta.", "85 % de las semanas del año con esponja vegetal de producción local disponible en los comercios y puestos de feria adheridos de las localidades de intervención, medido durante los 12 meses posteriores a la puesta en marcha del centro (línea de base asumida: 30 % de las semanas; ambos valores a verificar en el F02).", "Registro semanal de disponibilidad en góndola, con planilla firmada por el responsable de cada punto de venta adherido, consolidado mensualmente por la asociación titular y publicado en su informe de gestión.", "Los comercios y ferias sostienen el espacio de venta asignado al producto local durante el período de puesta en marcha y no lo reasignan a productos sustitutos; las condiciones climáticas de la temporada no provocan una pérdida extraordinaria de cosecha."], "comp": ["Centro asociativo de acondicionamiento, acopio y comercialización en funcionamiento, con protocolo único de calidad aplicado, productores capacitados y producto habilitado para su comercialización formal.", "El centro procesa y acopia el volumen equivalente a 12 meses de entregas programadas y opera con al menos 15 emprendimientos proveedores y 20 puntos de venta bajo compromiso anual de entrega, en las localidades de intervención, al cierre del primer año de operación (cantidades asumidas por capacidad esperable de un centro de escala familiar; a verificar en el F02).", "Libro de recepción y despacho por lote del centro, actas de los compromisos anuales de entrega firmados por cada punto de venta, certificado de habilitación del establecimiento y constancia de inscripción del producto, archivados en la sede de la asociación titular.", "Los organismos municipales y provinciales otorgan las habilitaciones del establecimiento y la inscripción del producto en los plazos previstos, y los productores mantienen la adhesión al esquema asociativo durante el primer ciclo."], "act": ["Ejecución del proyecto de inversión: estudio de demanda provincial, constitución de la figura asociativa, obra y equipamiento de lavado, secado, corte, empaque y depósito, elaboración y adopción del protocolo de calidad, capacitación de productores, tramitación de habilitaciones y formalización de los acuerdos de entrega.", "100 % de las obras y adquisiciones previstas ejecutadas y rendidas dentro de los 12 meses de iniciada la ejecución, en la localidad sede del centro, con un desvío presupuestario no mayor al 10 % (metas de gestión asumidas; el monto de la inversión se determina en el F03).", "Certificados de avance de obra, actas de recepción de equipos, rendiciones financieras y comprobantes de compra auditados por el organismo financista, archivados en el expediente del proyecto y en la sede de la asociación.", "Se concreta el desembolso del financiamiento en los plazos comprometidos y se dispone del predio para la sede del centro con dominio o cesión de uso resuelta antes del inicio de la obra."]}, "alt": [{"id": "A", "med": "Medio 1.2 — Productores familiares con asistencia técnica sistematizada y protocolos escritos de cultivo y procesamiento.", "act": "Programa de asistencia técnica y capacitación en cultivo, cosecha y procesamiento de Luffa cylindrica, con manual de buenas prácticas y seguimiento por campaña.", "ven": "Costo de inversión bajo, ejecución rápida, apoyado en la experiencia agrícola previa que el escenario reconoce en los productores; mejora la homogeneidad de la calidad, que es una de las causas de primer nivel.", "des": "No agrega capacidad de secado ni de acopio, de modo que la oferta sigue cortándose entre cosechas; no formaliza la comercialización ni resuelve la habilitación del producto. Por sí sola no modifica el indicador del propósito."}, {"id": "B", "med": "Medios 1, 1.1, 2, 3 y 3.1 — Acondicionamiento homogéneo, capacidad de secado y acopio, producción sostenida entre cosechas y comercialización con acuerdos formales de entrega.", "act": "Centro asociativo de acondicionamiento, acopio y comercialización de esponja vegetal, con protocolo único de calidad, trazabilidad por lote, acopio para el ciclo anual completo y compromisos anuales de entrega con comercios y ferias.", "ven": "Ataca simultáneamente las tres raíces que el análisis identifica —escala y secado, capital de trabajo entre cosechas y cadena de comercialización—; agrega la oferta dispersa y la vuelve programable; produce un cambio directo y verificable en el indicador del propósito; permite absorber el flete por escala y da respaldo formal frente al comercio.", "des": "Es la alternativa de mayor inversión inicial y la que más depende de que el esquema asociativo se sostenga; requiere habilitación del establecimiento y una gestión operativa permanente; si la demanda relevada resultara menor a la esperada, el centro quedaría subutilizado."}, {"id": "C", "med": "Medio 2.2 — Demanda provincial dimensionada en volumen, calidad y estacionalidad.", "act": "Estudio de mercado y sistema de información permanente de demanda de productos de higiene biodegradables en la provincia.", "ven": "Resuelve el vacío de información que el propio escenario declara y que condiciona el dimensionamiento de cualquier otra alternativa; costo bajo y plazo corto.", "des": "No es un proyecto de inversión sino un insumo: por sí solo no modifica la continuidad de la oferta ni el indicador del propósito. Se incorpora como estudio previo obligatorio dentro del F02 de la alternativa seleccionada."}, {"id": "D", "med": "Medio 4 — Requisitos de habilitación del producto de higiene conocidos y cumplidos por los productores.", "act": "Ventanilla de acompañamiento técnico y administrativo para el registro y la habilitación de productos de higiene de origen vegetal.", "ven": "Levanta una barrera concreta de acceso al comercio formal con inversión mínima y beneficia a todos los productores del rubro, no sólo a los del proyecto.", "des": "Resuelve una sola causa de primer nivel: aun con el producto habilitado, la oferta sigue siendo estacional y sin acuerdos de entrega. Se incorpora como línea de trabajo dentro de la alternativa B."}, {"id": "E", "med": "Medio 1.3.A — Regiones provinciales con aptitud agroclimática para el cultivo identificadas.", "act": "Zonificación agroclimática provincial para el cultivo de Luffa cylindrica, con ensayos de comportamiento por región.", "ven": "Ataca la raíz más profunda del árbol y sirve a toda la actividad provincial, más allá de este proyecto; el escenario señala expresamente que las condiciones agroclimáticas difieren según la región.", "des": "Está fuera del alcance del equipo y del proyecto por escala, presupuesto, competencia institucional y plazo de maduración: corresponde a un organismo provincial de ciencia y técnica o de desarrollo productivo. Se descarta como actividad y pasa a la columna de supuestos."}], "altSel": "B", "altJus": "Se seleccionó la alternativa B —centro asociativo de acondicionamiento, acopio y comercialización— aplicando cuatro criterios declarados de antemano: (1) cobertura de causas, es decir, cuántas causas de primer y segundo nivel del árbol ataca la alternativa; (2) efecto directo sobre el indicador del propósito, la continuidad del abastecimiento; (3) alcance del equipo y del proyecto, descartando lo que corresponde a otra escala institucional; y (4) sostenibilidad de la operación una vez terminada la inversión. Comparación: la A cubre una sola causa (acondicionamiento heterogéneo) y no toca la discontinuidad entre cosechas; la C cubre la causa raíz de información pero es un insumo y no un proyecto, porque después de conocer la demanda la oferta seguiría cortándose; la D cubre la causa institucional pero deja intactas la estacionalidad y la informalidad comercial; la E ataca la raíz territorial más profunda pero está fuera del alcance por escala y competencia, y por eso se traslada a supuestos. La B es la única que interviene a la vez sobre el secado y el acopio (causas 1.1 y 2.1), sobre el capital de trabajo entre cosechas (causa 2), sobre la comercialización informal (causa 3) y sobre la dispersión territorial (causa 3.1) mediante la concentración de la oferta, y la única cuyo producto es directamente medible con el indicador del propósito. Sus dos desventajas —mayor inversión inicial y dependencia del sostenimiento del esquema asociativo— se administran incorporando la C como estudio previo obligatorio del F02, que dimensiona el centro antes de invertir, y la A y la D como componentes complementarias del mismo proyecto. Se deja constancia de que las alternativas evaluadas son mutuamente excluyentes en tanto proyectos de inversión, y de que la selección quedará sujeta a revisión si el estudio de demanda arroja un volumen que no justifique la escala del centro.", "corr": ["Problema central escrito como carencia de equipamiento: «falta de una planta procesadora de luffa», «no existe una fábrica de esponjas vegetales en Salta» o «escasez de infraestructura de secado». Es la trampa principal de este escenario: convierte la solución elegida en problema y cierra el análisis de alternativas antes de empezar.", "Problema central desplazado al consumidor: «la gente no tiene conciencia ambiental», «los consumidores no eligen productos sustentables». Es un juicio sobre las personas, no una situación verificable, y traslada al comprador un problema que el escenario ubica en la oferta. En este árbol el comportamiento del consumidor es un efecto (s3), no una causa.", "«Falta de financiamiento» colocada como causa de primer nivel o como problema central. En este árbol es de segundo orden: aparece porque la demanda no está dimensionada y porque los programas públicos no llegan. Si el equipo la pone en la raíz, no llegó al fondo con la técnica del «¿pero por qué?».", "Cifras con apariencia de dato oficial que el escenario no aporta: toneladas producidas, cantidad exacta de comercios o de productores, superficie sembrada, participación de mercado. El escenario dice expresamente que no se dispone de información sobre demanda potencial ni escala adecuada; todo número debe estar declarado como supuesto y remitido al F02.", "Árbol con causas exclusivamente técnicas o agronómicas (semilla, riego, secado) sin dimensión económica, institucional ni territorial. Faltarían las causas de comercialización, habilitación del producto y dispersión de las parcelas, que son las que explican por qué la oferta se corta.", "Confusión entre el nombre de fantasía del equipo (ítem A) y el nombre del proyecto (ítem V), y componente de la EAP redactada como acción («instalar el centro», «capacitar productores») en lugar de estado alcanzado; junto con supuestos de la MML que en realidad son tareas del proyecto, como «se construye el centro» o «se capacita a los productores»."]}, "2": {"n": 2, "pc": "Dos piletas de contingencia fuera de servicio desde 2007 mantienen acopiados hidrocarburo y agua de formación de alto contenido salino en la Batería Puesto Guardián, departamento Orán, lo que sostiene un pasivo ambiental que impide el cierre del sector exigido por la autoridad y lo mantiene fuera de uso productivo.", "pcjus": "El problema central es lo que hay hoy en el predio, no lo que ocurrió en 2007. El descontrol del pozo MdT 14 fue controlado y el sector saneado, de modo que el incidente entra al árbol como causa remota y no como problema: si se lo enunciara como problema central, el proyecto quedaría orientado a un hecho ya cerrado y sin sujeto afectado presente. También se descartó \"contaminación con hidrocarburos\", porque no identifica sujeto, ubicación, tiempo ni magnitud y serviría igual para cualquier área hidrocarburífera del país, y se descartó \"falta de una planta de tratamiento de suelos\", que es una solución disfrazada de problema y además prematura, porque todavía no se conocen el volumen ni el tipo de material a tratar. La formulación adoptada nombra el sujeto afectado (las dos piletas y el sector que ocupan dentro de la Batería Puesto Guardián), el atributo negativo (permanencia de material acopiado y de estructuras fuera de servicio que impiden el cierre) y la localización, y es mensurable con datos que el escenario ya aporta: dos estructuras, 1.500 m² y 2.500 m² de superficie, fuera de servicio desde 2007. Además deja abiertas todas las alternativas de intervención —tratamiento in situ, disposición externa, encapsulado— en lugar de condicionar la respuesta desde el enunciado.", "objc": "Las dos piletas de contingencia de la Batería Puesto Guardián, departamento Orán, se encuentran sin material acopiado, cerradas y restituidas conforme al estándar acordado con la autoridad, y el sector que ocupan está reincorporado al uso productivo del establecimiento.", "sit": [{"id": "s1", "t": "Dos piletas de contingencia fuera de servicio desde 2007 mantienen acopiados hidrocarburo y agua de formación de alto contenido salino en la Batería Puesto Guardián, departamento Orán, lo que sostiene un pasivo ambiental que impide el cierre del sector exigido por la autoridad y lo mantiene fuera de uso productivo.", "k": "p", "d": "amb"}, {"id": "s2", "t": "Alrededor de 4.000 m² del establecimiento —los 1.500 m² de la pileta habilitada en la contingencia y los 2.500 m² de la pileta impermeabilizada— más su entorno inmediato de resguardo permanecen sustraídos a todo uso productivo.", "k": "e", "d": "ter"}, {"id": "s3", "t": "La ampliación de la superficie agrícola que pretende el propietario permanece postergada por tiempo indefinido, con capital inmovilizado en un sector que no genera renta ni puede transferirse.", "k": "e", "d": "eco"}, {"id": "s4", "t": "Persiste el riesgo de infiltración de hidrocarburo y de sales hacia el suelo profundo y el agua subterránea, por debajo de la pileta habilitada en la contingencia que no cuenta con barrera de impermeabilización.", "k": "e", "d": "amb"}, {"id": "s5", "t": "El suelo del entorno inmediato de las piletas se degrada progresivamente por salinización y pérdida de cobertura vegetal, con reducción de su aptitud agrícola.", "k": "e", "d": "amb"}, {"id": "s6", "t": "La exigencia de cierre y restauración formulada por la autoridad de aplicación permanece incumplida, con exposición del operador a observaciones, emplazamientos y sanciones y con el sector registrado como pasivo abierto.", "k": "e", "d": "ins"}, {"id": "s7", "t": "Se deteriora la confianza entre la empresa operadora, el propietario del establecimiento y la población vecina, que asocia el sector a la contingencia de 2007 y desconoce su estado actual.", "k": "e", "d": "soc"}, {"id": "s8", "t": "El material acopiado en ambas piletas no tiene volumen determinado, caracterización analítica actualizada ni destino de tratamiento definido.", "k": "c", "d": "tec"}, {"id": "s9", "t": "No existe un criterio de cierre acordado con la autoridad de aplicación que establezca qué se entiende por sector remediado, con qué parámetros se verifica y para qué uso posterior.", "k": "c", "d": "ins"}, {"id": "s10", "t": "El destino futuro del sector una vez intervenido no está definido ni consensuado entre la empresa operadora y el propietario del establecimiento.", "k": "c", "d": "ter"}, {"id": "s11", "t": "El cierre del sector de piletas no cuenta con una previsión económica asignada ni con un responsable de financiamiento establecido dentro de la operación.", "k": "c", "d": "eco"}, {"id": "s12", "t": "Los monitoreos ambientales realizados después de la contingencia se concentraron en la superficie saneada y no alcanzaron el perfil de suelo por debajo de las piletas ni el acuífero subyacente.", "k": "c", "d": "tec"}, {"id": "s13", "t": "La pileta habilitada durante la contingencia mantiene el hidrocarburo y el agua de formación en contacto directo con el suelo natural, sin membrana ni barrera de impermeabilización.", "k": "c", "d": "amb"}, {"id": "s14", "t": "La habilitación de esa pileta se resolvió en 2007 bajo el régimen de urgencia de la contingencia, como instalación provisoria y sin un plan de cierre asociado desde su origen.", "k": "c", "d": "ins"}, {"id": "s15", "t": "La autorización provincial del sector de tratamiento de residuos peligrosos dentro de la batería regula condiciones de operación pero no fija estándares de finalización ni de restitución del sitio.", "k": "c", "d": "ins"}, {"id": "s16", "t": "El establecimiento superpone en el mismo predio la actividad hidrocarburífera y la agropecuaria sin una regla de compatibilidad de usos acordada entre las partes.", "k": "c", "d": "ter"}, {"id": "s17", "t": "La información sobre el estado actual del sitio —antecedentes del incidente, trabajos ejecutados y monitoreos posteriores— está dispersa y no fue sistematizada ni puesta a disposición del propietario y de los vecinos.", "k": "c", "d": "soc"}, {"id": "s18", "t": "El costo de no intervenir —sanciones, restricción de uso, depreciación de la superficie afectada y eventual remediación diferida más onerosa— no está estimado ni contabilizado como pasivo.", "k": "c", "d": "eco"}], "lnk": [{"a": "s8", "b": "s1"}, {"a": "s9", "b": "s1"}, {"a": "s10", "b": "s1"}, {"a": "s11", "b": "s1"}, {"a": "s12", "b": "s8"}, {"a": "s13", "b": "s8"}, {"a": "s12", "b": "s9"}, {"a": "s14", "b": "s13"}, {"a": "s14", "b": "s9"}, {"a": "s15", "b": "s9"}, {"a": "s16", "b": "s10"}, {"a": "s17", "b": "s10"}, {"a": "s18", "b": "s11"}, {"a": "s1", "b": "s2"}, {"a": "s1", "b": "s4"}, {"a": "s1", "b": "s6"}, {"a": "s1", "b": "s7"}, {"a": "s2", "b": "s3"}, {"a": "s4", "b": "s5"}, {"a": "s5", "b": "s3"}], "obj": {"s1": "Las dos piletas de contingencia de la Batería Puesto Guardián, departamento Orán, se encuentran sin material acopiado, cerradas y restituidas conforme al estándar acordado con la autoridad, y el sector que ocupan está reincorporado al uso productivo del establecimiento.", "s2": "Los aproximadamente 4.000 m² ocupados por las piletas y su entorno inmediato están restituidos y disponibles para el uso productivo definido para el sector.", "s3": "La ampliación de la superficie agrícola prevista por el propietario se concreta en los plazos acordados, con el capital del sector reincorporado a la producción.", "s4": "El riesgo de infiltración de hidrocarburo y de sales hacia el suelo profundo y el agua subterránea está eliminado en todo el sector de piletas.", "s5": "El suelo del entorno inmediato de las piletas recupera su condición salina y su cobertura vegetal, con aptitud agrícola verificada.", "s6": "La exigencia de cierre y restauración de la autoridad de aplicación está cumplida y el sector cuenta con acta de cierre y baja del pasivo.", "s7": "La empresa operadora, el propietario del establecimiento y la población vecina sostienen una relación de confianza basada en información verificable sobre el estado del sitio.", "s8": "El material acopiado en ambas piletas tiene volumen determinado, caracterización analítica actualizada y destino de tratamiento definido.", "s9": "Existe un criterio de cierre acordado con la autoridad de aplicación, con parámetros de verificación y uso posterior definidos para el sector.", "s10": "El destino futuro del sector intervenido está definido y consensuado entre la empresa operadora y el propietario del establecimiento.", "s11": "El cierre del sector de piletas cuenta con previsión económica asignada y responsable de financiamiento establecido dentro de la operación.", "s12": "Los monitoreos ambientales cubren el perfil de suelo por debajo de las piletas y el acuífero subyacente, además de la superficie ya saneada.", "s13": "El hidrocarburo y el agua de formación remanentes están confinados sin contacto con el suelo natural hasta su tratamiento o disposición.", "s14": "Las instalaciones provisorias habilitadas en contingencia cuentan con un plan de cierre asociado desde su habilitación.", "s15": "La autorización provincial del sector de tratamiento de residuos peligrosos incorpora estándares de finalización y de restitución del sitio.", "s16": "El establecimiento cuenta con una regla de compatibilidad de usos acordada entre la actividad hidrocarburífera y la agropecuaria dentro del mismo predio.", "s17": "La información sobre el estado del sitio está sistematizada y disponible para el propietario y los vecinos.", "s18": "El costo de no intervenir está estimado y contabilizado como pasivo, y opera como criterio para priorizar el cierre."}, "f01": {"A": "Nombre propuesto: REMEDIA NOA S.H. · La combinación remite a la actividad profesional que el equipo proyecta —remediación y restauración de sitios afectados por la actividad extractiva— y al territorio donde la ejerce, el noroeste argentino; es corto, pronunciable y se sostiene como marca durante toda la cursada y en los formularios siguientes. Se declara como sociedad de hecho, según indica la Guía para esta instancia. Es un ejemplo de respuesta válida y no la única: cualquier denominación breve, vinculada al ámbito de actuación y distinta del nombre del proyecto del ítem V cumple la consigna. El error a evitar es adelantar acá el nombre del proyecto, que recién se define en el ítem V.", "B": "Se espera una tabla con cinco integrantes, apellido y nombre, función, perfil y horas efectivamente trabajadas en esta entrega. Estructura de roles sugerida: Integrante 1, coordinación general y control de coherencia entre ítems, con la coordinación declarada rotativa y removible por mayoría con aviso a la cátedra por correo; Integrante 2, búsqueda y sistematización de información secundaria sobre pasivos hidrocarburíferos, monitoreos posteriores a contingencias y antecedentes del área Puesto Guardián; Integrante 3, análisis técnico de alternativas de tratamiento y construcción de indicadores; Integrante 4, marco normativo, análisis de involucrados y enlace institucional para consultas a expertos; Integrante 5, redacción, edición, cartografía y paratextos. Carga horaria esperable para este entregable: entre 18 y 25 horas por integrante, con reuniones semanales de dos horas —una presencial y una virtual— y trabajo asincrónico sobre un documento compartido. Se declaran sólo horas realmente trabajadas: incluir a quien no aportó desincentiva a quienes sí lo hicieron y la Guía lo señala expresamente.", "C": "Ámbito principal declarado, siguiendo el escenario: gestión ambiental de proyectos de inversión · restauración ecológica. Se declaran ambos porque las categorías de la Guía no son mutuamente excluyentes y este caso los combina: la intervención se origina en una exigencia de cierre sobre instalaciones de un proyecto de inversión hidrocarburífero en operación —lo que obliga a razonar en términos de pasivo, autorizaciones, costos de cierre y responsabilidad del titular— y su producto final es la recuperación de la aptitud del suelo de un sector afectado para reincorporarlo a un uso productivo, que es restauración. Se declara además un ámbito secundario, gestión de residuos, porque el material acopiado debe caracterizarse como corriente de residuo peligroso y tener un destino de tratamiento o disposición trazable. El énfasis se coloca en la restauración ecológica, porque el objetivo del proyecto no es operar un sistema de tratamiento sino dejar el sector en condiciones de uso. Este ítem se cerró después de redactar el D, como recomienda la Guía.", "D": "Problema central: dos piletas de contingencia fuera de servicio desde 2007 mantienen acopiados hidrocarburo y agua de formación de alto contenido salino en la Batería Puesto Guardián, departamento Orán, lo que sostiene un pasivo ambiental que impide el cierre del sector exigido por la autoridad y lo mantiene fuera de uso productivo. · Identidad: dos estructuras de acopio construidas para una contingencia y no para el proceso productivo, una habilitada en la emergencia sin impermeabilizar y otra construida por orden de la autoridad, impermeabilizada. · Ubicación: sector de piletas de la Batería Puesto Guardián, Orán, Salta, en un establecimiento donde conviven la actividad agropecuaria y la infraestructura hidrocarburífera. · Tiempo: se origina en el descontrol del pozo MdT 14 en 2007 y se sostiene sin interrupción hasta hoy. · Magnitud: 1.500 m² en la pileta no impermeabilizada (50 × 30 m, 1,5 a 2,5 m de profundidad) y 2.500 m² en la impermeabilizada (50 × 50 × 3,5 m); unos 4.000 m² sustraídos al uso productivo. El volumen acopiado no surge del escenario y debe relevarse. · El enunciado no nombra la solución, de modo que las alternativas quedan abiertas, y no toma por problema el incidente de 2007, que ya fue controlado y aquí opera como causa remota.", "E": "Indicador principal de la situación sin proyecto: 2 piletas de contingencia fuera de servicio, que ocupan 4.000 m² del sector de la Batería Puesto Guardián, con 0 % del material acopiado con destino de tratamiento definido y sin criterio de cierre acordado con la autoridad, a la fecha de formulación del proyecto. Medio de verificación: registro de instalaciones fuera de servicio de la empresa operadora, requerimiento de cierre emitido por la autoridad de aplicación y legajo de antecedentes de la contingencia de 2007. · Indicador complementario: 0 informes de caracterización del material acopiado y del suelo subyacente disponibles a la fecha, según el archivo de monitoreos ambientales posteriores a la contingencia. · Lo que el escenario ya aporta: cantidad y tipo de estructuras, dimensiones, condición de fuera de servicio, existencia de antecedentes del incidente y de monitoreos posteriores, y la exigencia de cierre en curso. · Lo que hay que relevar antes del F02: volumen y caracterización analítica del contenido de cada pileta, discriminando fase hidrocarburada de fracción salina; extensión y profundidad de la afectación del suelo por debajo de la pileta no impermeabilizada; profundidad y calidad del agua subterránea en el sector; parámetros de referencia que la autoridad exigirá para dar por cerrado el sector. · Supuestos declarados para la línea de base: se asume que la capacidad geométrica de la pileta impermeabilizada es del orden de 8.750 m³ y la de la no impermeabilizada de entre 2.250 y 3.750 m³, valores derivados de las dimensiones del escenario; son capacidades de diseño y no volumen acopiado, y deben verificarse por relevamiento topográfico en el F02. No se adopta ningún valor de concentración de hidrocarburos ni de conductividad eléctrica, porque no surge del escenario y su invención condicionaría la elección de alternativa.", "F": "Contexto geográfico: el área Puesto Guardián se localiza en el departamento Orán, en el norte de la provincia de Salta, en un ambiente rural del Chaco semiárido salteño, con régimen de precipitaciones marcadamente estacional concentrado en el verano y prolongado período seco invernal. Esa estacionalidad es relevante para el problema por dos vías: condiciona la ventana operativa de cualquier tratamiento biológico y determina los episodios de escurrimiento superficial que pueden movilizar sales desde el sector de piletas. · Contexto ambiental: el rasgo determinante del sitio es que una de las dos piletas fue habilitada en la contingencia sin impermeabilización, de modo que el hidrocarburo y el agua de formación estuvieron y siguen en contacto con el suelo natural; el agua de formación es el componente crítico, porque su alto contenido salino afecta la estructura del suelo y su aptitud agrícola de manera más persistente que la fase hidrocarburada. La existencia de pozos sumideros utilizados durante el manejo de fluidos indica que el subsuelo del área tiene formaciones receptoras, lo que obliga a caracterizar el acuífero somero antes de definir la alternativa. · Contexto socioeconómico y productivo: el establecimiento desarrolla hoy actividades agrícolas y ganaderas que coexisten con la infraestructura hidrocarburífera, y el propietario pretende ampliar la superficie agropecuaria una vez finalizada la remediación; el departamento Orán combina producción agroindustrial extensiva con actividad hidrocarburífera de larga data, y esa doble matriz explica la superposición de usos sobre un mismo predio. · Contexto institucional: la empresa gestionó ante la provincia las autorizaciones para habilitar un sector de tratamiento de residuos peligrosos dentro de la batería, lo que constituye un activo del contexto —hay capacidad de tratamiento autorizada en el propio sitio— y a la vez una limitación, porque esa autorización regula la operación pero no el cierre. · Se declara que cada dato del contexto que no provenga del escenario debe citarse con fuente y año en el informe: censos, cartografía provincial, informes sectoriales y los antecedentes de monitoreo de la propia empresa.", "G": "Población potencial: quienes internalizan hoy el problema, es decir el propietario del establecimiento y su grupo familiar y laboral, que tienen 4.000 m² y su entorno de resguardo sustraídos al uso productivo y ven postergada la ampliación agropecuaria; el personal de operación y mantenimiento de la Batería Puesto Guardián, que trabaja en proximidad del sector; y los ocupantes de los predios vecinos y usuarios del agua subterránea del área de influencia, expuestos al riesgo de migración de sales e hidrocarburo. · Población objetivo: el propietario del establecimiento y su unidad productiva, que recibirán en forma directa el beneficio de la superficie restituida y del sector cerrado, y el personal que opera en la batería, que dejará de trabajar junto a estructuras fuera de servicio con material acopiado. · Criterio de recorte: el proyecto puede intervenir sobre el sector de piletas y su entorno inmediato dentro del predio, y por lo tanto puede garantizar el beneficio directo a quienes usan ese predio; sobre los usuarios de agua subterránea del área de influencia el proyecto produce un beneficio real pero indirecto y no verificable con los instrumentos del proyecto, de modo que integran la población potencial y no la objetivo. · Cuantificación: no se declara un número de personas porque el escenario no lo aporta; se asume que la unidad productiva del establecimiento y el plantel de la batería constituyen la población objetivo y se establece que su cuantificación —integrantes de la unidad productiva, personal de operación y padrones de vecinos y perforaciones en el área de influencia— debe relevarse en el F02 con padrón predial y registro de personal. No se declara \"toda la comunidad de Orán\" como población objetivo: sería una respuesta incorrecta, porque el proyecto no puede atender ni verificar beneficios sobre ella.", "H": "Autoridad ambiental provincial de Salta · Institución pública · Posición a favor: es quien exige el cierre y la restauración y quien debe aprobar el estándar de finalización · Fuerza alta (0,9): sin su aprobación no hay cierre posible ni baja del pasivo · Importancia alta (0,9): define el criterio técnico que ordena todo el proyecto. · Autoridad provincial de aplicación en materia de hidrocarburos y energía · Institución pública · Posición a favor · Fuerza media (0,6): interviene en la habilitación y el abandono de instalaciones del área · Importancia media (0,6). · Empresa operadora del área Puesto Guardián · Institución privada · Posición a favor con reservas: es responsable del pasivo y titular del proyecto, pero enfrenta el costo del cierre y puede diferirlo si no hay estándar definido ni previsión asignada · Fuerza alta (1,0): controla el acceso, la información y el financiamiento · Importancia alta (1,0). · Propietario del establecimiento · Institución privada · Posición a favor: es el principal beneficiario de la restitución y quien pretende ampliar la superficie agropecuaria, aunque puede oponerse a alternativas que dejen restricciones de uso sobre el predio · Fuerza media-alta (0,7): puede condicionar el acceso y el uso futuro del sector · Importancia alta (0,9). · Operadores habilitados de transporte, tratamiento y disposición final de residuos peligrosos · Institución privada · Posición indiferente, se comportan como proveedores · Fuerza media (0,5): su disponibilidad y su precio condicionan la fracción no tratable · Importancia media (0,5). · Población vecina y usuarios de agua subterránea del área de influencia · Sociedad civil · Posición potencialmente en contra: asocian el sector a la contingencia de 2007, desconocen su estado actual y pueden oponerse a que se trate material dentro del predio · Fuerza media (0,5): pueden presentar reclamos y trabar la ejecución · Importancia media-alta (0,7): su conformidad da licencia social a la intervención. · Municipio de la jurisdicción y organizaciones ambientales del norte salteño · Institución pública y ONG · Posición variable, en general en contra de soluciones que dejen el pasivo en el sitio · Fuerza media-baja (0,4) · Importancia media (0,5): pueden instalar el tema públicamente. · La misma escala cualitativa y numérica se aplica a fuerza y a importancia en todas las filas, y se incluyen deliberadamente los actores capaces de bloquear el proyecto.", "I": "Titular del proyecto: la empresa operadora del área Puesto Guardián, en su carácter de responsable del pasivo generado por la contingencia de 2007 y de titular de las instalaciones y de las autorizaciones vigentes; la figura razonable en esta instancia es la de un proyecto de cierre y restauración ejecutado por el operador bajo control de la autoridad, con contratación de servicios especializados de caracterización, tratamiento y transporte. · Dependencias institucionales directas: la autoridad ambiental provincial de Salta, que debe aprobar el plan de cierre y el estándar de sitio remediado y emitir el acta de cierre; la autoridad provincial de aplicación en materia de hidrocarburos, por tratarse de instalaciones de un área en producción; el registro provincial de generadores, transportistas y operadores de residuos peligrosos, por la corriente de residuo que se genere; y el municipio de la jurisdicción, por los aspectos de uso del suelo y eventual habilitación de movimientos y acopios. · Dependencia contractual: el propietario del establecimiento, cuyo consentimiento y acuerdo sobre el uso futuro del sector son condición para que el proyecto tenga sentido, y los operadores habilitados para la fracción que no pueda tratarse en el sitio. · Estos actores figuran también en el ítem H y la coherencia entre ambos ítems fue verificada. · En esta instancia sólo se identifican las dependencias: no corresponde iniciar gestiones ni tramitar autorizaciones, lo que llegará al pasar de perfil a prefactibilidad.", "J": "Matriz de cumplimiento legal, seleccionando la normativa aplicable a las etapas de caracterización, tratamiento, cierre y restitución. · Nacional: Ley General del Ambiente 25.675, presupuestos mínimos, con las obligaciones de recomposición del daño ambiental de incidencia colectiva, evaluación de impacto ambiental y seguro ambiental; Ley 24.051 de Residuos Peligrosos y su reglamentación, aplicable a la caracterización del material acopiado, al registro del generador y al circuito de transporte y operación; Ley 25.612 de presupuestos mínimos para la gestión integral de residuos industriales y de actividades de servicio; Ley 25.688 de gestión ambiental de aguas, por la protección del recurso subterráneo; Ley 25.831 de acceso a la información pública ambiental, relevante para el ítem de información al propietario y a los vecinos; Ley 17.319 de Hidrocarburos, en cuanto al régimen de las instalaciones del área. · Se agregan, nombradas por materia y no por número porque el equipo no verificó su texto vigente, las resoluciones de la autoridad nacional de energía sobre protección ambiental en la exploración y explotación de hidrocarburos y sobre abandono de pozos e instalaciones, que son las que definen criterios de saneamiento y de abandono aplicables al sector. · Provincial de Salta: Ley 7.070 de Protección del Medio Ambiente de la Provincia y su decreto reglamentario, con el procedimiento de evaluación de impacto ambiental y social, los estándares de calidad y el régimen de responsabilidad por daño ambiental; el Código de Aguas de la Provincia, Ley 7.017, por el uso y la protección del agua subterránea; y las normas provinciales de adhesión y aplicación en materia de residuos peligrosos y de habilitación de operadores, que son las que dan marco a la autorización ya obtenida para el sector de tratamiento dentro de la batería. · Municipal: ordenanzas de uso del suelo, habilitación de actividades y tránsito pesado de la jurisdicción, nombradas por materia. · Advertencia metodológica: la normativa citada en los antecedentes del sitio es anterior a modificaciones posteriores, de modo que antes del F02 debe verificarse vigencia y texto ordenado de cada norma, en particular de la reglamentación provincial en materia de residuos peligrosos y de los estándares de calidad de suelo aplicables al criterio de cierre. No se citan números de norma que el equipo no pueda verificar.", "K": "Causa 1 · Técnica y operativa: el material acopiado en ambas piletas no tiene volumen determinado, caracterización analítica actualizada ni destino de tratamiento definido. Sin saber qué hay y cuánto hay, ninguna alternativa puede dimensionarse ni costearse, y el acopio se perpetúa. · Causa 1.1: los monitoreos ambientales posteriores a la contingencia se concentraron en la superficie saneada y no alcanzaron el perfil de suelo por debajo de las piletas ni el acuífero subyacente. · Causa 1.2 · Ambiental: la pileta habilitada durante la contingencia mantiene el hidrocarburo y el agua de formación en contacto directo con el suelo natural, sin membrana ni barrera, de modo que el material a gestionar no se limita al contenido de la estructura y su volumen es indeterminado. · Causa 1.2.A · Institucional: la habilitación de esa pileta se resolvió en 2007 bajo el régimen de urgencia de la contingencia, como instalación provisoria y sin plan de cierre asociado desde su origen. Es una causa que está en el pasado y sigue produciendo el problema de hoy. · Causa 2 · Institucional y normativa: no existe un criterio de cierre acordado con la autoridad que establezca qué se entiende por sector remediado, con qué parámetros se verifica y para qué uso posterior. Sin estándar acordado no hay proyecto que pueda darse por terminado. · Causa 2.1: la autorización provincial del sector de tratamiento de residuos peligrosos dentro de la batería regula condiciones de operación pero no fija estándares de finalización ni de restitución del sitio. · Causa 2.2: la ausencia de datos del perfil de suelo y del acuífero (causa 1.1) impide fijar valores de referencia verificables, y la habilitación de urgencia de 2007 (causa 1.2.A) no dejó un estándar de partida. · Causa 3 · Territorial: el destino futuro del sector una vez intervenido no está definido ni consensuado entre la empresa operadora y el propietario. El nivel de remediación exigible depende del uso posterior, de modo que sin uso definido el alcance del proyecto queda abierto. · Causa 3.1: el establecimiento superpone en el mismo predio la actividad hidrocarburífera y la agropecuaria sin una regla de compatibilidad de usos acordada. · Causa 3.2 · Social: la información sobre el estado del sitio está dispersa y no fue sistematizada ni puesta a disposición del propietario y de los vecinos, lo que impide negociar el uso futuro sobre una base común. · Causa 4 · Económica: el cierre no cuenta con previsión económica asignada ni responsable de financiamiento establecido dentro de la operación. · Causa 4.1: el costo de no intervenir —sanciones, restricción de uso, depreciación de la superficie y remediación diferida más onerosa— no está estimado ni contabilizado como pasivo, de modo que postergar el cierre aparece contablemente como la opción barata. · Lectura de verificación, de la raíz al tronco: la habilitación de urgencia sin plan de cierre produjo una pileta sin impermeabilizar; esa pileta hace indeterminado el volumen del material a gestionar; esa indeterminación impide definir el destino del material; y sin destino definido las piletas siguen acopiadas y fuera de servicio.", "L": "Efecto 1 · Territorial: alrededor de 4.000 m² del establecimiento —1.500 m² de la pileta habilitada en la contingencia y 2.500 m² de la impermeabilizada—, más su entorno inmediato de resguardo, permanecen sustraídos a todo uso productivo. · Efecto 1.1 · Económico: la ampliación de la superficie agrícola que pretende el propietario permanece postergada por tiempo indefinido, con capital inmovilizado en un sector que no genera renta ni puede transferirse. · Efecto 2 · Ambiental: persiste el riesgo de infiltración de hidrocarburo y de sales hacia el suelo profundo y el agua subterránea por debajo de la pileta que no cuenta con barrera de impermeabilización. · Efecto 2.1 · Ambiental: el suelo del entorno inmediato de las piletas se degrada progresivamente por salinización y pérdida de cobertura vegetal, con reducción de su aptitud agrícola; este efecto realimenta el efecto 1.1, porque cuanto más se extiende la superficie afectada menor es la superficie recuperable para la ampliación pretendida. · Efecto 3 · Institucional: la exigencia de cierre y restauración formulada por la autoridad permanece incumplida, con exposición del operador a observaciones, emplazamientos y sanciones y con el sector registrado como pasivo abierto. · Efecto 4 · Social: se deteriora la confianza entre la empresa operadora, el propietario y la población vecina, que asocia el sector a la contingencia de 2007 y desconoce su estado actual. · Lectura de verificación, del tronco a la rama: las piletas fuera de servicio con material acopiado ocupan superficie; la superficie ocupada posterga la ampliación agropecuaria; la ausencia de barrera sostiene el riesgo de infiltración; el riesgo materializado degrada el suelo del entorno; y la degradación reduce a su vez la superficie recuperable. · Todos estos efectos persistirán mientras el material siga acopiado y las estructuras no se cierren: ninguno se resuelve por el paso del tiempo.", "M": "El árbol se lee de abajo hacia arriba. En la base, tres raíces independientes entre sí. La primera es institucional y viene de 2007: la habilitación de urgencia de una pileta provisoria sin plan de cierre asociado, decisión razonable en la contingencia que hoy explica que una de las dos estructuras esté en contacto directo con el suelo natural; esa ausencia de barrera hace que el material a gestionar no se limite al contenido de la pileta, y junto con unos monitoreos que nunca alcanzaron el perfil de suelo ni el acuífero produce la primera causa directa: un material sin volumen, sin caracterización y sin destino de tratamiento definido. La segunda raíz es normativa: la autorización del sector de tratamiento dentro de la batería regula cómo operar pero no cómo terminar, y la habilitación de 2007 no dejó estándar de partida; sumadas a la falta de datos del subsuelo, producen la segunda causa directa, la ausencia de un criterio de cierre acordado con la autoridad. La tercera raíz es territorial y social: dos usos superpuestos en el mismo predio sin regla de compatibilidad, y una información sobre el estado del sitio que está dispersa y no compartida; de ahí la tercera causa directa, un destino futuro del sector que no está definido ni consensuado. En paralelo, una raíz económica —el costo de no intervenir no está estimado ni contabilizado— sostiene la cuarta causa directa, la ausencia de previsión económica para el cierre. · Las cuatro causas directas convergen en el tronco: dos piletas de contingencia fuera de servicio desde 2007 que mantienen acopiados hidrocarburo y agua de formación de alto contenido salino en la Batería Puesto Guardián, sosteniendo un pasivo que impide el cierre exigido y mantiene el sector fuera de uso productivo. · Hacia arriba, cuatro ramas: el sector ocupado y sustraído al uso productivo, que posterga la ampliación agropecuaria; el riesgo persistente de infiltración, que degrada por salinización el suelo del entorno y realimenta la postergación de la ampliación; la exigencia de cierre incumplida, con exposición a sanciones y pasivo abierto; y el deterioro de la confianza entre empresa, propietario y vecinos. · El árbol es un conjunto de hipótesis de trabajo: cada raíz deberá ponerse a prueba en el F02 con la caracterización del material y del suelo, la consulta a la autoridad sobre el estándar de cierre y el trabajo con el propietario sobre el uso futuro.", "N": "Medios, en espejo con el ítem K y conservando los mismos niveles. · Medio 1: el material acopiado en ambas piletas tiene volumen determinado, caracterización analítica actualizada y destino de tratamiento definido. · Medio 1.1: los monitoreos ambientales cubren el perfil de suelo por debajo de las piletas y el acuífero subyacente. · Medio 1.2: el hidrocarburo y el agua de formación remanentes están confinados sin contacto con el suelo natural hasta su tratamiento o disposición. · Medio 1.2.A: las instalaciones provisorias habilitadas en contingencia cuentan con un plan de cierre asociado desde su habilitación. · Medio 2: existe un criterio de cierre acordado con la autoridad, con parámetros de verificación y uso posterior definidos. · Medio 2.1: la autorización provincial del sector de tratamiento de residuos peligrosos incorpora estándares de finalización y de restitución del sitio. · Medio 3: el destino futuro del sector intervenido está definido y consensuado entre la empresa operadora y el propietario. · Medio 3.1: el establecimiento cuenta con una regla de compatibilidad de usos acordada entre la actividad hidrocarburífera y la agropecuaria. · Medio 3.2: la información sobre el estado del sitio está sistematizada y disponible para el propietario y los vecinos. · Medio 4: el cierre cuenta con previsión económica asignada y responsable de financiamiento establecido. · Medio 4.1: el costo de no intervenir está estimado y contabilizado como pasivo. · Los medios están redactados como estados alcanzados y no como acciones: se escribe \"los monitoreos cubren el perfil de suelo y el acuífero\", no \"mejorar los monitoreos\". · Medios fuera del alcance del proyecto, declarados expresamente: el medio 1.2.A pertenece al régimen de habilitación de instalaciones provisorias y sólo puede modificarse por vía normativa o de procedimiento interno de la empresa, de modo que el proyecto lo toma como lección aprendida y no como resultado propio; el medio 2.1 depende de una decisión de la autoridad provincial sobre el contenido de las autorizaciones y el proyecto sólo puede aportar el antecedente técnico; el medio 3.1 excede el sector de piletas, porque una regla de compatibilidad de usos alcanza a todo el establecimiento; y el medio 4.1 corresponde a la política contable de la empresa. El proyecto actúa sobre los medios 1, 1.1, 1.2, 2, 3 y 3.2.", "O": "Fines, en espejo con el ítem L. · Fin 1: los aproximadamente 4.000 m² ocupados por las piletas y su entorno inmediato están restituidos y disponibles para el uso productivo definido para el sector. · Fin 1.1: la ampliación de la superficie agrícola prevista por el propietario se concreta en los plazos acordados, con el capital del sector reincorporado a la producción. · Fin 2: el riesgo de infiltración de hidrocarburo y de sales hacia el suelo profundo y el agua subterránea está eliminado en todo el sector de piletas. · Fin 2.1: el suelo del entorno inmediato recupera su condición salina y su cobertura vegetal, con aptitud agrícola verificada, lo que a su vez amplía la superficie efectivamente recuperable y refuerza el fin 1.1. · Fin 3: la exigencia de cierre y restauración de la autoridad está cumplida y el sector cuenta con acta de cierre y baja del pasivo. · Fin 4: la empresa operadora, el propietario y la población vecina sostienen una relación de confianza basada en información verificable sobre el estado del sitio. · Cada fin corresponde a un efecto del ítem L y no se agregó ninguno sin efecto correspondiente. Los fines más altos —sector restituido y disponible para el uso productivo, riesgo de afectación del agua subterránea eliminado y pasivo dado de baja— son los que alimentan el nivel Fin de la EAP y de la MML.", "P": "Problema central: dos piletas de contingencia fuera de servicio desde 2007 mantienen acopiados hidrocarburo y agua de formación de alto contenido salino en la Batería Puesto Guardián, departamento Orán, lo que sostiene un pasivo ambiental que impide el cierre del sector exigido por la autoridad y lo mantiene fuera de uso productivo. · Objetivo central, propósito o meta: las dos piletas de contingencia de la Batería Puesto Guardián, departamento Orán, se encuentran sin material acopiado, cerradas y restituidas conforme al estándar acordado con la autoridad, y el sector que ocupan está reincorporado al uso productivo del establecimiento. · Se conservan el mismo sujeto (las dos piletas y el sector que ocupan), la misma variable (permanencia de material acopiado y de estructuras fuera de servicio, y condición de uso del sector) y el mismo lugar (sector de piletas de la Batería Puesto Guardián, departamento Orán): sólo cambia el signo. El alcance no se amplió: la meta no habla del área Puesto Guardián completa ni de los pasivos hidrocarburíferos del departamento, sino del mismo sector de piletas. · Este enunciado es el propósito de la EAP y de la MML, y su indicador es el mismo del ítem E con signo invertido.", "Q": "El árbol de objetivos reproduce exactamente la estructura del árbol de problemas, con la misma cantidad de nodos y las mismas relaciones, cambiado el signo. Abajo, las cuatro raíces convertidas en medios de último nivel: plan de cierre asociado a las instalaciones provisorias, autorización con estándares de finalización, regla de compatibilidad de usos e información del sitio sistematizada, y costo de no intervenir estimado y contabilizado. Sobre ellas, los medios intermedios: monitoreos que alcanzan el perfil de suelo y el acuífero, material remanente confinado sin contacto con el suelo natural. Sobre estos, los cuatro medios directos: material con volumen, caracterización y destino de tratamiento definidos; criterio de cierre acordado con la autoridad; destino futuro del sector definido y consensuado; previsión económica asignada. En el tronco, la meta del ítem P. Arriba, los fines: sector restituido y disponible, ampliación agrícola concretada, riesgo de infiltración eliminado, suelo del entorno recuperado, exigencia de cierre cumplida con pasivo dado de baja, y confianza restablecida entre empresa, propietario y vecinos. · Medios sobre los que el proyecto puede actuar, marcados en el diagrama: material caracterizado con destino definido, monitoreos que cubren el perfil de suelo y el acuífero, material confinado sin contacto con el suelo natural, criterio de cierre acordado, destino futuro consensuado e información sistematizada y disponible. · Medios fuera del alcance, marcados con otra convención: plan de cierre asociado a instalaciones provisorias de contingencia, estándares de finalización dentro de la autorización de tratamiento, regla general de compatibilidad de usos del establecimiento y contabilización del pasivo, según se justificó en el ítem N. · Se verificó que no haya ramas de más ni de menos respecto del ítem M: cada nodo del árbol de objetivos tiene su contraparte exacta en el árbol de problemas.", "R": "Estrategia 1 · Medio: criterio de cierre acordado con la autoridad, con parámetros de verificación y uso posterior definidos. Actividad única: programa de caracterización ambiental del sector de piletas —volumen y tipificación del material por pileta, perfil de suelo bajo la pileta no impermeabilizada y calidad del acuífero somero— y acuerdo del estándar de sitio remediado con la autoridad de aplicación. · Estrategia 2 · Medio: material acopiado con destino de tratamiento definido y sector cerrado. Actividades mutuamente excluyentes: (a) tratamiento biológico in situ del material hidrocarburado mediante biopilas o landfarming en el sector de tratamiento de residuos peligrosos ya autorizado dentro de la batería, con segregación y disposición externa de la fracción salina no tratable biológicamente, seguido del cierre de ambas estructuras y la restitución morfológica y edáfica del sector; (b) retiro y disposición externa de la totalidad del material en operador habilitado, con relleno y restitución morfológica; (c) confinamiento in situ del material mediante encapsulado con cobertura impermeable y restricción registral de uso sobre el sector. · Estrategia 3 · Medio: destino futuro del sector definido y consensuado, e información sistematizada. Actividad única: acuerdo de compatibilidad de usos y zonificación interna del establecimiento entre operador y propietario, con expediente público de antecedentes del sitio. · Actividades descartadas por estar fuera del alcance: la modificación del régimen de habilitación de instalaciones provisorias de contingencia y la incorporación de estándares de finalización en las autorizaciones provinciales de tratamiento, ambas de competencia normativa de la autoridad; y la contabilización del pasivo, que es una decisión de la política contable de la empresa. Se documenta el criterio: el proyecto no puede comprometer resultados que no controla. · Se selecciona la estrategia 2, actividad (a), como idea fuerza del proyecto, incorporando la actividad de la estrategia 1 como primera etapa condicionante —sin caracterización y sin estándar acordado ninguna alternativa de tratamiento puede dimensionarse ni darse por terminada— y la actividad de la estrategia 3 como componente de acuerdo y comunicación asociada. La actividad seleccionada sale directamente del medio 1 del árbol de objetivos y no de una decisión previa: se llegó a ella después de comparar las tres alternativas de destino del material.", "S": "Fin: el sector de piletas de la Batería Puesto Guardián está restituido y disponible para el uso agropecuario acordado, con el riesgo de afectación del suelo profundo y del agua subterránea eliminado y el pasivo dado de baja ante la autoridad. · Propósito: las dos piletas de contingencia de la Batería Puesto Guardián, departamento Orán, se encuentran sin material acopiado, cerradas y restituidas conforme al estándar acordado con la autoridad, y el sector que ocupan está reincorporado al uso productivo del establecimiento. · Componentes, expresados como productos obtenidos y no como acciones: (1) sector de piletas caracterizado y estándar de cierre acordado con la autoridad; (2) material hidrocarburado tratado hasta el estándar acordado y fracción no tratable dispuesta en operador habilitado; (3) estructuras cerradas y sector restituido morfológica y edáficamente; (4) acuerdo de uso futuro suscripto y antecedentes del sitio sistematizados y disponibles. · Actividad: proyecto de tratamiento biológico in situ del material acopiado y cierre y restitución del sector de piletas de contingencia de la Batería Puesto Guardián. · Se controló que ninguna componente esté escrita como verbo de acción: no se escribe \"tratar el material\" sino \"material tratado hasta el estándar acordado\".", "T": "Fin · Resumen narrativo: contribuir a la recuperación de la aptitud productiva del suelo y a la eliminación del riesgo sobre el agua subterránea en el sector de piletas de la Batería Puesto Guardián, con el pasivo dado de baja ante la autoridad. Indicador: al menos 4.000 m² del sector de piletas habilitados para uso agropecuario sin restricción, en la Batería Puesto Guardián, a los 12 meses de emitida el acta de cierre. Medio de verificación: acta de cierre de la autoridad ambiental provincial y relevamiento predial de superficie en producción, archivados en el legajo ambiental del área. Supuesto: el propietario sostiene el uso agropecuario previsto y no se producen nuevas contingencias hidrocarburíferas en la batería que vuelvan a afectar el sector. · Propósito · Resumen narrativo: las dos piletas de contingencia se encuentran sin material acopiado, cerradas y restituidas conforme al estándar acordado, y el sector está reincorporado al uso productivo. Indicador: 100 % del material acopiado retirado de las dos piletas y 0 estructuras fuera de servicio en el sector, con los parámetros de hidrocarburos totales y de conductividad eléctrica del suelo dentro de los valores del estándar de cierre acordado con la autoridad, a los 24 meses de iniciado el proyecto. Medio de verificación: informe final de remediación con analíticas de laboratorio acreditado, aprobado por la autoridad ambiental provincial. Supuesto: la autoridad aprueba el estándar de cierre acordado y lo mantiene estable durante la ejecución. · Componentes · Resumen narrativo: sector caracterizado y estándar acordado; material hidrocarburado tratado y fracción no tratable dispuesta; estructuras cerradas y sector restituido; acuerdo de uso futuro suscripto y antecedentes sistematizados. Indicador: 100 % del volumen caracterizado en la etapa inicial tratado o dispuesto con verificación analítica, y 2 estructuras cerradas y restituidas, en el sector de piletas, a los 18 meses de iniciado el proyecto. Medio de verificación: registro de tratamiento del sector autorizado de residuos peligrosos, manifiestos de transporte y certificados de disposición final del operador habilitado, y acta de conformidad del propietario sobre el uso futuro. Supuesto: el régimen de precipitaciones del período permite sostener la actividad biológica sin anegamientos prolongados, y los operadores habilitados mantienen disponibilidad y capacidad para la fracción no tratable. · Actividad · Resumen narrativo: proyecto de tratamiento biológico in situ del material acopiado y cierre y restitución del sector de piletas de contingencia de la Batería Puesto Guardián. Indicador: 4 etapas ejecutadas —caracterización y acuerdo de estándar, segregación y tratamiento, disposición de la fracción no tratable, cierre y restitución— con 100 % de avance certificado, a los 24 meses de iniciado el proyecto. Medio de verificación: certificados de avance de obra y servicios y libro ambiental del proyecto, disponibles en el legajo del área y ante la autoridad. Supuesto: se mantienen vigentes la autorización provincial del sector de tratamiento de residuos peligrosos dentro de la batería y el acceso al predio otorgado por el propietario. · Ningún supuesto declara como externo algo que el proyecto controla: la contratación de laboratorios, el diseño de las biopilas y la ejecución del cierre son tareas planificadas, no supuestos.", "U": "Lógica vertical, leída de abajo hacia arriba: si se ejecuta el proyecto de tratamiento biológico in situ y cierre —caracterizando primero el material y el suelo y acordando el estándar con la autoridad—, entonces se obtienen las componentes: el sector caracterizado con estándar acordado, el material hidrocarburado tratado y la fracción salina dispuesta en operador habilitado, las dos estructuras cerradas y el sector restituido, y el acuerdo de uso futuro suscripto. Si esas componentes se obtienen y se cumple el supuesto de que la ventana climática permite sostener el tratamiento biológico y hay operador disponible para la fracción no tratable, entonces se alcanza el propósito: piletas sin material acopiado, cerradas y restituidas conforme al estándar, con el sector reincorporado al uso productivo. Si el propósito se alcanza y la autoridad mantiene estable el estándar acordado, entonces se logra el fin: superficie habilitada para uso agropecuario sin restricción, riesgo sobre el agua subterránea eliminado y pasivo dado de baja. · Lógica horizontal, fila por fila: en el fin, el acta de cierre y el relevamiento predial son necesarios y suficientes para verificar la superficie habilitada, porque el acta es el único documento que levanta la restricción y el relevamiento mide la superficie efectivamente incorporada. En el propósito, el informe final con analíticas de laboratorio acreditado permite calcular tanto la remoción del material como el cumplimiento de los parámetros de suelo; su suficiencia depende de que el estándar de cierre haya quedado escrito con parámetros y valores concretos, lo que es precisamente la primera componente. En las componentes, el registro de tratamiento, los manifiestos y los certificados de disposición final documentan íntegramente el flujo del material y permiten cerrar el balance de masa entre lo caracterizado y lo tratado o dispuesto. En la actividad, los certificados de avance y el libro ambiental son la fuente habitual de este tipo de obra y ya existen en la operación, de modo que no hay que construir un sistema de información nuevo. · Lógica zigzag: cada nivel más los supuestos del nivel inferior alcanza el nivel superior, y la cadena se verificó en los cuatro escalones. · Supuesto más frágil: que la autoridad apruebe el estándar de cierre y lo mantenga estable durante la ejecución. Es el más frágil por tres razones: el criterio de sitio remediado no está definido hoy, la autorización vigente del sector de tratamiento regula la operación pero no la finalización, y un cambio de criterio en mitad del proyecto —por ejemplo, exigir valores compatibles con uso agrícola irrestricto en lugar de uso agropecuario con condiciones— modifica el volumen a tratar, el plazo y el costo, y puede invalidar la alternativa seleccionada frente a la disposición externa total. La medida de mitigación es acordar el estándar por escrito como primera componente, antes de movilizar equipos, y no como resultado a negociar durante la ejecución.", "V": "Proyecto de tratamiento biológico in situ del material hidrocarburado y cierre y restitución del sector de piletas de contingencia de la Batería Puesto Guardián, departamento Orán, para su reincorporación al uso agropecuario. · Qué se hace: tratamiento biológico in situ del material acopiado y cierre y restitución de las estructuras. · Para qué: reincorporar el sector al uso agropecuario y dar de baja el pasivo. · Dónde: sector de piletas de la Batería Puesto Guardián, área Puesto Guardián, departamento Orán, Salta. · El nombre es representativo de la alternativa seleccionada en el ítem R, es distinto del nombre de fantasía del equipo del ítem A y no repite el enunciado del problema; acompañará al equipo en los formularios F02, F03 y F04. Si en el F02 la caracterización mostrara que la fracción tratable biológicamente es minoritaria, el nombre debe revisarse junto con la alternativa: el nombre sigue a la decisión técnica y no al revés."}, "eap": {"fin": "Sector de piletas de la Batería Puesto Guardián restituido y disponible para el uso agropecuario acordado, con el riesgo de afectación del suelo profundo y del agua subterránea eliminado y el pasivo dado de baja ante la autoridad de aplicación.", "prop": "Las dos piletas de contingencia de la Batería Puesto Guardián, departamento Orán, se encuentran sin material acopiado, cerradas y restituidas conforme al estándar acordado con la autoridad, y el sector que ocupan está reincorporado al uso productivo del establecimiento.", "comp": "1) Sector de piletas caracterizado y estándar de cierre acordado con la autoridad. 2) Material hidrocarburado tratado hasta el estándar acordado y fracción salina no tratable dispuesta en operador habilitado. 3) Estructuras cerradas y sector restituido morfológica y edáficamente. 4) Acuerdo de uso futuro suscripto con el propietario y antecedentes del sitio sistematizados y disponibles.", "act": "Proyecto de tratamiento biológico in situ de
