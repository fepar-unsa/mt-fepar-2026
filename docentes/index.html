/* =============================================================== AUTOAJUSTE */
var FITMIN = .76, FITMAX = 1.14;
function overflowPx(s){
  var n = Math.max(0, s.scrollHeight - s.clientHeight - 3);
  s.querySelectorAll('.card,.scrolly').forEach(function(e){
    if(e.classList.contains('nofit') || getComputedStyle(e).display === 'none') return;
    var dy = e.scrollHeight - e.clientHeight - 6;
    var dx = e.scrollWidth - e.clientWidth - 14;
    if(dy > 0) n += dy;
    if(dx > 0) n += dx;
  });
  return n;
}
function nofitOver(s){
  var t = false;
  s.querySelectorAll('.nofit').forEach(function(e){
    if(e.scrollHeight > e.clientHeight + 6 || e.scrollWidth > e.clientWidth + 14) t = true; });
  return t;
}
function measureFit(s){
  var z = 1, g = 0;
  s.style.zoom = 1;
  if(SECS[cur] && SECS[cur].work) return 1;
  var base = overflowPx(s);
  if(base === 0){
    while(z < FITMAX - 1e-6 && g++ < 14 && !nofitOver(s)){
      var nz = Math.min(FITMAX, Math.round((z + .04)*100)/100);
      s.style.zoom = nz;
      if(overflowPx(s) > 0 || nofitOver(s)){ s.style.zoom = z; break; }
      z = nz;
    }
  } else {
    var best = z, bestN = base;
    while(z - .03 > FITMIN - 1e-6 && g++ < 18){
      z = Math.round((z - .03)*100)/100;
      s.style.zoom = z;
      var n = overflowPx(s);
      if(n < bestN){ bestN = n; best = z; }
      if(n === 0) break;
    }
    if(bestN > 0 && bestN > base * .75) best = 1;
    z = best; s.style.zoom = z;
  }
  return z;
}
function balUndo(e){
  if(!e.dataset.bal) return;
  e.style.paddingTop = '';
  [].forEach.call(e.children, function(c){ if(c.dataset && c.dataset.bal){ c.style.marginTop=''; delete c.dataset.bal; } });
  delete e.dataset.bal;
}
function balance(root){
  root.querySelectorAll('.card').forEach(function(e){
    balUndo(e);
    var cs = getComputedStyle(e);
    if(cs.display === 'none') return;
    var er = e.getBoundingClientRect();
    if(er.height < 130) return;
    var padT = parseFloat(cs.paddingTop), padB = parseFloat(cs.paddingBottom);
    var bot = er.top + padT, kids = [];
    [].forEach.call(e.children, function(c){
      if(c.classList.contains('pop-b') || c.classList.contains('tag')) return;
      var r = c.getBoundingClientRect();
      if(r.height === 0) return;
      kids.push(c); if(r.bottom > bot) bot = r.bottom;
    });
    if(!kids.length) return;
    var gap = (er.bottom - padB - parseFloat(cs.borderBottomWidth)) - bot;
    if(gap < 46) return;
    var extra = Math.min(gap/(kids.length+1), 60);
    if(extra < 12) return;
    var h0 = e.offsetHeight;
    e.style.paddingTop = (padT+extra)+'px';
    for(var k = 1; k < kids.length; k++){
      var m = parseFloat(getComputedStyle(kids[k]).marginTop) || 0;
      kids[k].style.marginTop = (m+extra)+'px';
      kids[k].dataset.bal = '1';
    }
    e.dataset.bal = '1';
    if(e.offsetHeight > h0 + 2) balUndo(e);
  });
}

/* =============================================================== ZOOM */
var ZOOM = 1, FIT = 1;
function applyZoom(){
  document.getElementById('zlabel').textContent = Math.round(ZOOM*100)+'%';
  var s = SECS[cur] && SECS[cur].el;
  if(!s) return;
  if(window.innerWidth <= 760){ s.style.zoom = ''; return; }
  s.style.zoom = FIT * ZOOM;
}
function fitNow(){
  var s = SECS[cur].el, work = !!SECS[cur].work;
  if(window.innerWidth <= 760){ s.style.zoom = ''; if(!work) balance(s); return; }
  FIT = measureFit(s);
  s.style.zoom = FIT * ZOOM;
  if(!work) balance(s);
}
function setZoom(z){ ZOOM = Math.max(.6, Math.min(2.2, Math.round(z*100)/100)); applyZoom(); }
document.getElementById('b-zi').onclick = function(){ setZoom(ZOOM+.1); };
document.getElementById('b-zo').onclick = function(){ setZoom(ZOOM-.1); };
document.getElementById('zlabel').onclick = function(){ setZoom(1); };

/* =============================================================== ABRIR PANEL */
var POP = {node:null, ph:null, z:1};
function popArm(root){
  root.querySelectorAll('.card').forEach(function(e){
    if(e.classList.contains('nopop') || e.querySelector(':scope > .pop-b')) return;
    var b = E('button','pop-b','⤢'); b.type='button';
    b.title = 'Abrir este panel a pantalla completa';
    b.addEventListener('click', function(ev){ ev.stopPropagation(); ev.preventDefault(); popOpen(e); });
    e.appendChild(b);
  });
}
function popOpen(e){
  if(POP.node) return;
  POP.ph = E('div','pop-ph');
  e.parentNode.insertBefore(POP.ph, e);
  POP.node = e; e.classList.add('popped');
  var h = e.querySelector('h2,h3,h4');
  document.getElementById('pop-t').textContent = h ? h.textContent.trim().slice(0,70) : 'Panel ampliado';
  document.getElementById('pop-in').appendChild(e);
  POP.z = 1; popZ(0);
  document.getElementById('pop').classList.add('on');
}
function popClose(){
  if(!POP.node) return;
  POP.node.classList.remove('popped');
  POP.ph.parentNode.insertBefore(POP.node, POP.ph);
  POP.ph.parentNode.removeChild(POP.ph);
  POP.node = null; POP.ph = null;
  document.getElementById('pop').classList.remove('on');
  document.getElementById('pop-in').style.zoom = '';
}
function popZ(d){
  POP.z = Math.max(.6, Math.min(2.4, Math.round((POP.z+d)*100)/100));
  document.getElementById('pop-in').style.zoom = POP.z;
  document.getElementById('pop-z').textContent = Math.round(POP.z*100)+'%';
}
document.getElementById('pop-x').onclick = popClose;
document.getElementById('pop-zi').onclick = function(){ popZ(.1); };
document.getElementById('pop-zo').onclick = function(){ popZ(-.1); };
document.getElementById('pop').addEventListener('mousedown', function(ev){
  if(ev.target.id === 'pop-in' || ev.target.id === 'pop') popClose(); });

/* =============================================================== TEMA Y TECLADO */
document.getElementById('b-th').onclick = function(){
  var h = document.documentElement;

};
document.addEventListener('keydown', function(e){
  var t = e.target.tagName;
  if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT') return;
  var po = document.getElementById('pop').classList.contains('on');
  if(e.key === 'Escape'){ popClose(); return; }
  if(e.key==='+'||e.key==='='){ e.preventDefault(); po?popZ(.1):setZoom(ZOOM+.1); return; }
  if(e.key==='-'||e.key==='_'){ e.preventDefault(); po?popZ(-.1):setZoom(ZOOM-.1); return; }
  if(e.key==='0'){ e.preventDefault(); if(po){POP.z=1;popZ(0);} else setZoom(1); return; }
  if(po) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); prev(); }
  else if(e.key==='i'||e.key==='I'){ railToggle(); }
  else if(e.key==='t'||e.key==='T'){ document.getElementById('b-th').click(); }
});
document.getElementById('b-next').onclick = next;
document.getElementById('b-prev').onclick = prev;
var rzT=null;
window.addEventListener('resize', function(){ clearTimeout(rzT); rzT=setTimeout(fitNow,220); });
</script>

<script>
"use strict";
/* =============================================================== LECTURA DEL AVANCE DEL EQUIPO */
function avJoin(arr, f){
  return (arr||[]).map(f).filter(function(x){ return String(x||'').trim(); }).join('\n');
}
function avLB(){
  var l = (AV && AV.lb) || {};
  var p = [];
  if(l.c) p.push('Cantidad: '+l.c);
  if(l.v) p.push('Variable: '+l.v);
  if(l.l) p.push('Lugar: '+l.l);
  if(l.p) p.push('Plazo: '+l.p);
  if(l.mv) p.push('Medio de verificación: '+l.mv);
  return p.join('\n');
}
function avCadena(modo){
  if(!AV) return '';
  var sit = AV.sit || [], lnk = AV.lnk || [];
  if(!sit.length) return '';
  var byId = {}; sit.forEach(function(s){ byId[s.id] = s; });
  var T = function(id){
    var s = byId[id];
    if(!s) return '?';
    return modo==='obj' ? ((AV.sito||{})[id] || s.t) : s.t;
  };
  var c = (sit.filter(function(s){ return s.k==='p'; })[0]||{}).id;
  var out = [];
  if(c) out.push((modo==='obj'?'Objetivo central: ':'Problema central: ')+T(c));
  lnk.forEach(function(l){ out.push('· '+T(l.a)+(modo==='obj'?' → permite → ':' → produce → ')+T(l.b)); });
  return out.join('\n');
}
var AVSRC = {
 A:function(){ return (AV.eq||{}).nombre || ''; },
 B:function(){ return avJoin(AV.ints, function(p){
      return p.ap ? '· '+p.ap+(p.fun?' — '+p.fun:'')+(p.perf?' ('+p.perf+')':'')+(p.hs?' — '+p.hs+' h':'') : ''; })
      + ((AV.eq||{}).coord ? '\nCoordinación general: '+AV.eq.coord : ''); },
 C:function(){ return AV.amb || ''; },
 D:function(){ return AV.pc || ''; },
 E:function(){ return avLB(); },
 F:function(){ var c = AV.ctx||{}; return [c.amb, c.soc].filter(Boolean).join('\n\n'); },
 G:function(){ var c = AV.ctx||{};
      return (c.pobP? 'Población potencial: '+c.pobP : '') + (c.pobO? '\nPoblación objetivo: '+c.pobO : ''); },
 H:function(){ return avJoin(AV.inv, function(a){
      return a.n ? '· '+a.n+' — posición: '+(a.pos||'?')+' · fuerza: '+(a.fue||'?')+' · importancia: '+(a.imp||'?')+(a.int?' — '+a.int:'') : ''; }); },
 I:function(){ return (AV.ctx||{}).dep || ''; },
 J:function(){ return (AV.ctx||{}).norm || ''; },
 K:function(){ return avJoin(AV.cau, function(c){ return c.t ? '· [nivel '+(c.lv||1)+'] '+c.t : ''; }); },
 L:function(){ return avJoin(AV.efe, function(c){ return c.t ? '· [nivel '+(c.lv||1)+'] '+c.t : ''; }); },
 M:function(){ return AV.arM || avCadena('prob'); },
 N:function(){ return avJoin(AV.med, function(c){ return c.t ? '· [nivel '+(c.lv||1)+'] '+c.t : ''; }); },
 O:function(){ return avJoin(AV.fin, function(c){ return c.t ? '· '+c.t : ''; }); },
 P:function(){ return AV.obj || ''; },
 Q:function(){ return AV.arQ || avCadena('obj'); },
 R:function(){ var a = (AV.alt||[]).filter(function(x,i){ return (x.id||String.fromCharCode(65+i)) === AV.altSel; })[0];
      return (a ? 'Estrategia elegida ('+a.id+'): '+(a.med||'')+'\nActividad: '+(a.act||'')+'\n\n' : '') + (AV.altJus||''); },
 S:function(){ var e = AV.eap||{};
      return 'Fin: '+(e.fin||'—')+'\nPropósito: '+(e.prop||'—')+'\nComponente: '+(e.comp||'—')+'\nActividad: '+(e.act||'—'); },
 T:function(){ var m = AV.mml||{};
      return [['fin','Fin'],['prop','Propósito'],['comp','Componente'],['act','Actividad']].map(function(r){
        var v = m[r[0]] || [];
        return r[1]+'\n  Resumen: '+(v[0]||'—')+'\n  Indicador: '+(v[1]||'—')+
               '\n  Medio de verificación: '+(v[2]||'—')+'\n  Supuesto: '+(v[3]||'—'); }).join('\n\n'); },
 U:function(){ return AV.mmlU || ''; },
 V:function(){ return (AV.f01||{}).V || ''; }
};
function avText(L){
  if(!AV) return '';
  var t = (AV.f01||{})[L];
  if(String(t||'').trim()) return t;
  try{ return AVSRC[L] ? (AVSRC[L]() || '') : ''; }catch(e){ return ''; }
}
function estadoItem(t){
  var n = String(t||'').trim().length;
  if(n === 0) return {cls:'bad', txt:'sin completar', k:0};
  if(n < 120)  return {cls:'warn', txt:'muy breve ('+n+' caracteres)', k:1};
  return {cls:'ok', txt:n+' caracteres', k:2};
}

/* ---------- chequeos estructurales sobre el avance ---------- */
var RX_CARENCIA = /\b(falta|faltan|ausencia|carencia|escasez|inexisten|no\s+(existe|hay|se\s+cuenta|dispone))\b/i;
var RX_PLAZO = /(a[ñn]o|mes(es)?|semestre|trimestre|d[ií]as|20\d\d|plazo|al cabo|hacia el)/i;
var RX_NUM = /\d/;
function chequeos(){
  var out = [];
  var pc = String(AV.pc || '').trim();
  out.push({t:'El problema central está redactado', ok:pc.length > 30,
    d: pc ? '«'+pc.slice(0,140)+(pc.length>140?'…':'')+'»' : 'El ítem D está vacío.'});
  out.push({t:'No está enunciado como carencia', ok:!!pc && !RX_CARENCIA.test(pc),
    d: RX_CARENCIA.test(pc) ? 'Aparece una fórmula del tipo «falta / no existe / escasez»: el problema quedó escrito como la ausencia de una solución.' : 'No aparecen fórmulas del tipo «falta de…».'});
  var cau = (AV.cau||[]).filter(function(c){ return String(c.t||'').trim(); });
  var efe = (AV.efe||[]).filter(function(c){ return String(c.t||'').trim(); });
  out.push({t:'Al menos seis causas', ok:cau.length >= 6, d:cau.length+' causas cargadas (el modelo tiene '+S.sit.filter(function(s){return s.k==='c';}).length+').'});
  out.push({t:'Causas en más de un nivel', ok:(new Set(cau.map(function(c){ return c.lv||1; }))).size > 1,
    d:'Si todas las causas son de nivel 1, el equipo no preguntó «¿y por qué pasa eso?».'});
  out.push({t:'Al menos tres efectos', ok:efe.length >= 3, d:efe.length+' efectos cargados (el modelo tiene '+S.sit.filter(function(s){return s.k==='e';}).length+').'});
  var med = (AV.med||[]).filter(function(c){ return String(c.t||'').trim(); });
  out.push({t:'El árbol de objetivos refleja el de problemas', ok:med.length >= Math.max(3, Math.floor(cau.length*.6)),
    d:med.length+' medios frente a '+cau.length+' causas. Cada causa debería tener su medio o un descarte explícito.'});
  var mml = AV.mml || {}, llenas = 0;
  [['fin'],['prop'],['comp'],['act']].forEach(function(r){
    var v = mml[r[0]] || [];
    [0,1,2,3].forEach(function(j){ if(String(v[j]||'').trim()) llenas++; });
  });
  out.push({t:'Matriz de Marco Lógico completa', ok:llenas === 16, d:llenas+' de 16 celdas con contenido.'});
  var inds = [['fin'],['prop'],['comp'],['act']].map(function(r){ return String((mml[r[0]]||[])[1]||''); }).filter(function(x){ return x.trim(); });
  var conPlazo = inds.filter(function(x){ return RX_PLAZO.test(x) && RX_NUM.test(x); }).length;
  out.push({t:'Indicadores con cantidad y plazo', ok:inds.length > 0 && conPlazo === inds.length,
    d:conPlazo+' de '+inds.length+' indicadores incluyen un número y una referencia temporal.'});
  var sup = (AV.sup||[]).filter(function(s){ return String(s.t||'').trim(); });
  out.push({t:'Planilla de supuestos iniciada', ok:sup.length >= 3, d:sup.length+' supuestos declarados.'});
  var inv = (AV.inv||[]).filter(function(a){ return String(a.n||'').trim(); });
  out.push({t:'Análisis de involucrados con cuatro actores o más', ok:inv.length >= 4, d:inv.length+' actores cargados.'});
  var sit = (AV.sit||[]).filter(function(s){ return String(s.t||'').trim(); });
  out.push({t:'Usó el análisis de causalidad', ok:sit.length >= 6 && (AV.lnk||[]).length >= 5,
    d:sit.length+' situaciones y '+((AV.lnk||[]).length)+' relaciones en la red causal.'});
  return out;
}

/* =============================================================== 11 · COMPARAR */

  enc.appendChild(e2);

  var r = E('div','row fill');

  b2.appendChild(prosa(S.pc));
  gg.appendChild(a); gg.appendChild(b2);
  cmp.appendChild(gg);
  el.appendChild(cmp);
}});

/* =============================================================== IMPRESIÓN */
function printBody(){
  var lv = levels();
  var h = '<h1>Guía docente · Formulario 01</h1>'+
    '<p><strong>Escenario '+N+' — '+esc(ESC.t)+'</strong><br>'+esc(ESC.lug)+'</p>'+
    '<p style="font-size:9pt;color:#5a6b64">FEPAR 2026 · material de cátedra · generado el '+nowStr()+'</p>';
  h += '<h2>Problema central</h2><p><strong>'+esc(S.pc)+'</strong></p><p>'+nl2br(S.pcjus)+'</p>';
  h += '<h2>Árbol de problemas</h2>';
  var ef = porNivel(-1), ca = porNivel(1);
  Object.keys(ef).map(Number).sort(function(a,b){ return b-a; }).forEach(function(k){
    h += '<h3>Efectos · nivel '+k+'</h3><ul>'+ef[k].map(function(id){ return '<li>'+esc(sitText(id))+'</li>'; }).join('')+'</ul>';
  });
  Object.keys(ca).map(Number).sort(function(a,b){ return a-b; }).forEach(function(k){
    h += '<h3>Causas · nivel '+k+'</h3><ul>'+ca[k].map(function(id){
      var s = sitById(id);
      return '<li>'+esc(sitText(id))+(s&&s.d?' <em>('+esc(dimOf(s.d).n)+')</em>':'')+'</li>'; }).join('')+'</ul>';
  });
  h += '<h3>Relaciones de causalidad</h3><table><tr><th>Esto…</th><th>…produce esto</th></tr>'+
    S.lnk.map(function(l){ return '<tr><td>'+esc(sitText(l.a))+'</td><td>'+esc(sitText(l.b))+'</td></tr>'; }).join('')+'</table>';
  h += '<h2>Árbol de objetivos</h2><p><strong>Objetivo central: </strong>'+esc(S.objc)+'</p>';
  Object.keys(ef).map(Number).sort(function(a,b){ return b-a; }).forEach(function(k){
    h += '<h3>Fines · nivel '+k+'</h3><ul>'+ef[k].map(function(id){ return '<li>'+esc(objText(id))+'</li>'; }).join('')+'</ul>';
  });
  Object.keys(ca).map(Number).sort(function(a,b){ return a-b; }).forEach(function(k){
    h += '<h3>Medios · nivel '+k+'</h3><ul>'+ca[k].map(function(id){ return '<li>'+esc(objText(id))+'</li>'; }).join('')+'</ul>';
  });
  h += '<h2>Alternativas</h2><table><tr><th>#</th><th>Medio</th><th>Actividad</th><th>A favor</th><th>En contra</th></tr>'+
    (S.alt||[]).map(function(a){
      return '<tr><td>'+esc(a.id)+(a.id===S.altSel?' ✔':'')+'</td><td>'+esc(a.med)+'</td><td>'+esc(a.act)+
             '</td><td>'+esc(a.ven)+'</td><td>'+esc(a.des)+'</td></tr>'; }).join('')+'</table>'+
    '<p>'+nl2br(S.altJus)+'</p>';
  var caps = {}, order = [];
  F01.forEach(function(it){ if(!caps[it.cap]){ caps[it.cap]=[]; order.push(it.cap); } caps[it.cap].push(it); });
  h += '<h2>Respuestas modelo del Formulario 01</h2>';
  order.forEach(function(cp){
    h += '<h3>'+esc(cp)+'</h3>';
    caps[cp].forEach(function(it){
      h += '<div class="p-i"><h4>'+it.L+' · '+esc(it.t)+'</h4><div class="p-v">'+nl2br(S.f01[it.L]||'')+'</div></div>';
    });
  });
  h += '<h2>Estructura Analítica del Proyecto</h2><table>'+
    [['Fin','fin'],['Propósito','prop'],['Componente','comp'],['Actividad','act']].map(function(p){
      return '<tr><th>'+p[0]+'</th><td>'+esc(S.eap[p[1]]||'')+'</td></tr>'; }).join('')+'</table>';
  h += '<h2>Matriz de Marco Lógico</h2><table><tr><th></th><th>Resumen narrativo</th><th>Indicadores</th><th>Medios de verificación</th><th>Supuestos</th></tr>'+
    [['fin','Fin'],['prop','Propósito'],['comp','Componente'],['act','Actividad']].map(function(r){
      var m = S.mml[r[0]]||[];
      return '<tr><th>'+r[1]+'</th>'+[0,1,2,3].map(function(j){ return '<td>'+esc(m[j]||'')+'</td>'; }).join('')+'</tr>';
    }).join('')+'</table>';
  h += '<h2>Señales de corrección</h2><ul>'+(S.corr||[]).map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>';
  if(AV){
    var ch = chequeos();
    h += '<h2>Corrección del equipo '+esc((AV.eq||{}).nombre||'sin nombre')+'</h2>'+
      '<table><tr><th>Chequeo</th><th>Resultado</th><th>Detalle</th></tr>'+
      ch.map(function(x){ return '<tr><td>'+esc(x.t)+'</td><td>'+(x.ok?'cumple':'revisar')+'</td><td>'+esc(x.d)+'</td></tr>'; }).join('')+'</table>'+
      '<table><tr><th>Ítem</th><th>Estado</th></tr>'+
      F01.map(function(it){ var st = estadoItem(avText(it.L));
        return '<tr><td>'+it.L+' · '+esc(it.t)+'</td><td>'+st.txt+'</td></tr>'; }).join('')+'</table>';
  }
  return h;
}
function doPrint(){
  document.getElementById('print').innerHTML = printBody();
  setTimeout(function(){ window.print(); }, 60);
}
document.getElementById('b-print').onclick = doPrint;

/* =============================================================== CARGA DEL AVANCE */
document.getElementById('b-load').onclick = function(){ document.getElementById('fileIn').click(); };
document.getElementById('fileIn').addEventListener('change', function(ev){
  var f = ev.target.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var o = JSON.parse(rd.result);
      if(!o || typeof o !== 'object'){ toast('Ese archivo no es un avance del Formulario 01.'); return; }
      AV = o;
      var si = SECS.findIndex(function(s){ return s.t === 'Comparar con el avance del equipo'; });
      if(o.esc && o.esc !== N && SOL[String(o.esc)]){
        if(confirm('Ese avance es del Escenario '+o.esc+' y la guía está en el '+N+'. ¿Cambiar al Escenario '+o.esc+'?')){
          setEsc(o.esc, false);
          si = SECS.findIndex(function(s){ return s.t === 'Comparar con el avance del equipo'; });
        }
      }
      if(si >= 0) show(si); else render(cur);
      toast('Avance de «'+((o.eq||{}).nombre || 'equipo sin nombre')+'» cargado.');
    }catch(e){ toast('No se pudo leer ese archivo.'); }
  };
  rd.readAsText(f);
  ev.target.value = '';
});

/* =============================================================== ARRANQUE */
(function boot(){
  var n = SC[0].n;
  var m = (location.hash||'').replace('#','').split('-');
  var hn = parseInt(m[0], 10), hs = parseInt(m[1], 10);
  if(hn && SOL[String(hn)]) n = hn;
  else { try{ var st = JSON.parse(localStorage.getItem(KEY)||'{}'); if(st.n && SOL[String(st.n)]) n = st.n; }catch(e){} }
  N = n; ESC = SC.filter(function(x){ return x.n===n; })[0]; S = SOL[String(n)];
  scPaint();
  buildAll();
  show(hs >= 1 && hs <= SECS.length ? hs-1 : 0);
})();
