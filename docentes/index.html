846,6 ha, desagregada por las tres zonas de la propuesta (289,8 / 324,0 / 215,3 ha), al año 0. Medio de verificación: clasificación supervisada de imágenes satelitales de la serie de quince años y de las imágenes históricas del visor, más verificación de campo en parcelas permanentes, contrastada con el inventario forestal existente. Valor sin proyecto: el inventario describe un bosque joven con 32 especies leñosas nativas; la superficie exacta remanente por zona y su tendencia anual deben relevarse — se asume, hasta esa verificación, una pérdida neta anual mayor que cero por quema, pastoreo y extracción, dato a confirmar en el F02. · Indicador 2 (función hidrológica): caudal pico descargado por las alcantarillas del corredor vial de la RN 9, único punto de salida de las 846,6 ha, ante el evento de precipitación de diseño, en m³/s, al año 0. Medio de verificación: estudio hidrológico e hidráulico específico con aforo en la alcantarilla de salida y verificación de la capacidad del cauce revestido receptor. Valor sin proyecto: el escenario sólo aporta que el cauce receptor no tiene capacidad ociosa y descarga sobre un sector de riesgo hídrico crítico; el valor numérico debe construirse — se asume que el caudal actual iguala o supera la capacidad del cauce, a verificar en el F02. · Indicador 3 (habitabilidad): superficie de espacio verde público efectivamente accesible por habitante del borde este, en m²/habitante, al año 0. Medio de verificación: relevamiento de espacios verdes del sector cruzado con población por radio censal del último censo. Valor sin proyecto: el escenario documenta que el sector no dispone de espacios verdes públicos más allá de una plaza reducida y en pendiente y una escuela con patio insuficiente, de modo que el valor de línea de base es cercano a cero y muy inferior al recomendado; la cifra exacta se calcula en el F02. · Lo que el escenario y el material publicado ya aportan: la identificación catastral N° 133.745; el reparto propuesto en 289,8 ha no urbanizables de conservación, 324,0 ha urbanizables con restricciones y 215,3 ha urbanizables con cambio de uso; la expansión de 4.430 ha con 91 % residencial; las 342 ha de vacíos remanentes equivalentes al 2,32 % de la mancha urbana; el inventario de 32 leñosas, 82 aves y 6 mamíferos; el punto único de descarga; la capacidad de acogida visual media desde veinte puntos de observación; y las capas de la RN 9 y del Acceso Norte con terreno 3D, imágenes históricas y herramientas de medición. · Lo que hay que relevar: la conciliación de la superficie catastral con la digitalizada y el estado dominial de la parcela; la correspondencia espacial entre cada una de las tres zonas y los sectores de mayor pendiente, que puede leerse del visor pero debe validarse en campo; cartografía de suelos; caudales; población por radio censal de los barrios linderos; y el mapa de usos informales actuales dentro del predio.", "F": "Contexto geográfico y territorial: predio fiscal identificado como catastro N° 133.745, de 846,6 ha digitalizadas —847,97 ha según la memoria del estudio—, en el departamento Capital, sobre la RN 9, a 6 km del centro, en la interfaz campo–ciudad del borde este; el visor publicado del caso permite recorrer el catastro, las tres zonas propuestas, la RN 9 y el Acceso Norte, con terreno 3D, imágenes históricas y herramientas de medición, y descargar las capas en KML y GeoJSON. La ciudad registra la mayor tasa de crecimiento poblacional entre las diez más grandes del país y su aglomerado se expandió 4.430 ha, con el 91 % de esa expansión de destino residencial; restan 342 ha de vacíos urbanos interiores, el 2,32 % de la mancha urbana. En quince años el sector recibió dos frentes de avance de signo opuesto: urbanizaciones cerradas por el norte y ocupación informal ladera arriba por el oeste. · Contexto ambiental: cabecera de cuenca y zona de conducción de un acuífero de escasa dimensión; suelos erosionables; pendientes superiores al 30 % en la mitad alta; zona sísmica. La cobertura boscosa está sujeta al régimen provincial de bosques nativos, recientemente actualizado. El inventario forestal describe un bosque joven con 32 especies leñosas nativas, dos de ellas con categoría de conservación desfavorable, 82 especies de aves y 6 de mamíferos. El escurrimiento descarga por las alcantarillas del corredor vial, único punto de salida; el cauce receptor está revestido, sin capacidad ociosa, y descarga sobre un sector de riesgo hídrico crítico. La cuenca visual se observa desde veinte puntos sobre la ruta, con capacidad de acogida media, y la prospección arqueológica no detectó evidencias en superficie. Sobre el predio hay procesos activos de degradación: extracción de leña y áridos, pastoreo, quema de pastizales y microbasurales perimetrales. · Contexto de planificación: existe un Estudio de Zonificación Ambiental y Propuesta de Master Plan que reparte la parcela en 289,8 ha no urbanizables con destino de conservación, 324,0 ha urbanizables con restricciones y 215,3 ha urbanizables con cambio de uso. Es el insumo técnico de mayor calidad disponible sobre el predio y, a la vez, una propuesta sin acto administrativo que la adopte: su status es el de un antecedente, no el de una norma, y su cartografía es de uso académico. · Contexto social y económico: la oferta habitacional formal no alcanza y predominan la autoconstrucción y las tipologías precarias. La red de agua se interrumpe en el límite del área consolidada y las cotas superiores se abastecen por camión cisterna; no hay red cloacal ni gas, y el vuelco a pozo absorbente se produce sobre el mismo reservorio del que se extrae agua. Hay una única línea de transporte público e irregularidad dominial en los barrios vecinos. Consultada la población sobre un cambio de usos del suelo, una amplia mayoría se manifestó a favor, con reparos referidos a la pérdida de áreas verdes, el aumento del escurrimiento y la competencia por el agua. · Qué del contexto potencia el problema: la presión de expansión sobre un ejido sin vacantes, la pendiente y la erosionabilidad, la ausencia de redes, las normativas metropolitanas dispares y la existencia de 215,3 ha ya calificadas como urbanizables en una propuesta pública, que fija una expectativa de renta antes de que exista una decisión. · Qué contribuye a la solución: la titularidad pública y el dominio único sobre la mayor superficie continua disponible en el borde, con identificación catastral precisa; la existencia de instrumentos de concesión de uso, asociación público-privada y financiamiento internacional; la ausencia de hallazgos arqueológicos que condicionen la obra; una opinión pública mayoritariamente favorable a un cambio de usos del suelo; y la disponibilidad de cartografía digital descargable que abarata cualquier estudio posterior. Fuentes: escenario asignado por la cátedra y visor geoespacial publicado del caso; cada dato debe referenciarse en el informe con su fuente y año.", "G": "Población potencial: los habitantes del borde este de la ciudad de Salta afectados por el deterioro del soporte ambiental del sector, es decir, quienes internalizan el problema porque dependen del predio para infiltración y recarga, para la amortiguación del escurrimiento, para la regulación térmica y para el espacio libre de uso público que el sector no tiene. Incluye tanto a los barrios de ocupación informal ladera arriba por el oeste como a las urbanizaciones cerradas del norte y a la población del sector de riesgo hídrico crítico que recibe la descarga aguas abajo. · Población objetivo: los hogares de los barrios del extremo oeste del sector, en las cotas superiores sin red de agua, cloaca ni gas, que son los que hoy extraen leña, áridos y pastura del predio, los que disponen residuos en el perímetro y los que carecen por completo de espacio verde accesible. Al ejemplificar este mismo ítem con este escenario, la Guía toma un orden de magnitud de aproximadamente 4.000 habitantes con NBI de entre 40 % y 78 %; se adopta ese orden de magnitud como supuesto de trabajo y se declara que debe verificarse por radio censal en el F02. · Criterio de recorte: el proyecto no puede atender al 100 % de la población potencial, porque no controla las obras de red ni la política habitacional; se selecciona como objetivo al subconjunto que reúne dos condiciones simultáneas —mayor privación relativa y dependencia directa del predio— porque es el grupo sobre el cual la intervención produce cambio medible y, a la vez, el que hoy ejerce sobre el predio la presión de uso que la intervención debe reconvertir en uso legítimo y regulado. · Recorte territorial verificable: con la parcela digitalizada y la traza del Acceso Norte y de la RN 9 disponibles como capas, el área de captación de la población objetivo puede delimitarse por distancia de caminata a los accesos previstos y contrastarse con los radios censales, en lugar de definirse por apreciación. Esa delimitación se ejecuta en el F02. La población de aguas abajo se considera beneficiaria indirecta a través de la amortiguación del escurrimiento.", "H": "Se usa escala numérica de 0 a 1 para fuerza e importancia, la misma para ambas columnas. · Organismo provincial con competencia sobre tierras fiscales, titular del dominio del catastro N° 133.745 — institución pública — posición a favor con reservas, porque un destino de conservación reduce el valor de realización del inmueble y las 215,3 ha calificadas como urbanizables fijan una expectativa de ingreso — fuerza 1,0: sin su decisión el proyecto no existe — importancia 1,0 — interés: definir un destino que no comprometa el patrimonio provincial. · Municipalidad de Salta, planeamiento urbano y espacios verdes — institución pública — a favor — fuerza 0,8: define zonificación, otorga habilitaciones y debería recibir el mantenimiento del espacio público — importancia 0,9 — interés: incorporar espacio verde en un ejido sin vacantes, sin asumir un costo operativo que no puede sostener. · Autoridad provincial de aplicación del régimen de bosques nativos — institución pública — a favor — fuerza 0,8: la categoría de conservación asignada al predio condiciona qué usos son admisibles y es la que debe contrastarse con las 289,8 ha propuestas para conservación — importancia 0,8 — interés: que el ordenamiento actualizado se cumpla y no se tramite una recategorización de conveniencia. · Organizaciones vecinales de los barrios del extremo oeste — sociedad civil — posición dividida: a favor del espacio público y del agua, en contra de cualquier restricción que les quite acceso a leña, pastura y suelo para vivienda — fuerza 0,7: la ocupación de hecho puede consolidarse más rápido que el proyecto — importancia 1,0: son la población objetivo y sin su acuerdo el control territorial no es sostenible — interés: vivienda, servicios y espacio de uso cotidiano. · Desarrolladores inmobiliarios y propietarios de las urbanizaciones cerradas del norte — sector privado — en contra de un destino de conservación y a favor de la habilitación residencial, con la propuesta de 215,3 ha urbanizables como argumento ya publicado a su favor; a favor, en cambio, de un parque que valorice sus lotes — fuerza 0,8: capacidad de lobby y de financiamiento, en una ciudad sin suelo vacante — importancia 0,6 — interés: renta del suelo del borde. · Prestadora del servicio de agua y organismo provincial de recursos hídricos — empresa de servicios e institución pública — a favor — fuerza 0,6 — importancia 0,8 — interés: proteger la zona de recarga del acuífero y evitar que la descarga por el punto único agrave el sector de riesgo hídrico crítico. · Equipo autor del estudio de zonificación, universidad y organizaciones ambientalistas — institución académica y ONG ambiental — a favor — fuerza 0,5: aportan la única cartografía disponible del predio y capacidad de instalación pública del tema, con posibilidad de judicializar un cambio de uso — importancia 0,7 — interés: que la zonificación propuesta se discuta técnicamente y que se conserve el último remanente continuo y el hábitat de las 82 especies de aves. · Advertencia de corrección: el listado incluye deliberadamente actores que pueden bloquear el proyecto; un cuadro que sólo enumere aliados está incompleto. También corresponde advertir que el autor del estudio de zonificación es un actor más y no una autoridad: su propuesta se pondera, no se acata.", "I": "Titular del proyecto: el organismo provincial con competencia sobre las tierras fiscales, por ser el propietario del inmueble. El predio ya no es una superficie genérica: es la parcela identificada como catastro N° 133.745, de dominio público provincial y titularidad única, lo que permite escribir este ítem con precisión —hay una parcela, un dominio y un titular— y no en condicional. Sin un acto administrativo de ese organismo que asigne destino de uso, ninguna otra decisión es ejecutable. · Figura propuesta: unidad de gestión de carácter interjurisdiccional, creada por convenio entre la provincia y la Municipalidad de Salta, con participación de la autoridad de aplicación de bosques nativos y del organismo de recursos hídricos, y un mecanismo formal de consulta a las organizaciones vecinales de la población objetivo. El escenario indica que existen instrumentos de concesión de uso, asociación público-privada y financiamiento internacional; en esta instancia se identifican como vías posibles de instrumentación, sin optar todavía por una. · Otras dependencias que condicionan la existencia del proyecto: el organismo provincial de catastro y de registro inmobiliario, que debe certificar la superficie, el límite parcelario y el estado dominial de la parcela N° 133.745 y conciliar la superficie catastral con las 846,6 ha digitalizadas; la autoridad provincial de aplicación del régimen de bosques nativos, recientemente actualizado, que define los usos admisibles según la categoría asignada al predio y ante la cual debe contrastarse el reparto propuesto de 289,8 / 324,0 / 215,3 ha; la autoridad ambiental provincial, para el procedimiento de evaluación de impacto ambiental; el organismo provincial de recursos hídricos, por tratarse de cabecera de cuenca y de zona de conducción de un acuífero; la Municipalidad de Salta, por zonificación, habilitación y eventual mantenimiento del espacio público; la autoridad vial nacional, por los accesos y las alcantarillas del corredor de la RN 9 y por el Acceso Norte; la autoridad provincial de patrimonio cultural, que debe expedirse aunque la prospección no haya detectado evidencias en superficie; y el organismo financiador, en caso de crédito internacional. · Supuestos declarados en este ítem, a verificar en el F02: que la parcela se encuentra libre de gravámenes, servidumbres y ocupaciones con derecho consolidado; que el dominio permanece en cabeza de la provincia y no ha sido transferido ni afectado a otro destino; y que la superficie registral coincide con la digitalizada dentro del margen del 0,16 % observado entre las dos fuentes disponibles. Ninguno de los tres está confirmado por el material y los tres condicionan la figura jurídica que el proyecto pueda adoptar. · Todos estos actores figuran también en el ítem H, y la coherencia entre ambos ítems es parte de lo que se corrige. · En esta instancia sólo se identifica ante quién habría que tramitar: los convenios, comodatos y autorizaciones corresponden al pasaje de perfil a prefactibilidad.", "J": "Se construye la matriz de cumplimiento legal seleccionando las normas que efectivamente condicionan la ejecución, no un listado exhaustivo de derecho ambiental. Las normas se nombran por su materia; el número, la versión vigente y el texto ordenado deben verificarse antes de citarlos en el informe. · Nacional: Constitución Nacional, artículo sobre ambiente sano; ley nacional de presupuestos mínimos de política ambiental (Ley General del Ambiente), que fija la evaluación de impacto ambiental, la participación ciudadana y el daño ambiental de incidencia colectiva; ley nacional de presupuestos mínimos de protección ambiental de los bosques nativos, que obliga a la provincia a mantener su ordenamiento territorial y regula desmontes y aprovechamientos; ley nacional de presupuestos mínimos para la gestión integral de residuos domiciliarios, aplicable a los microbasurales perimetrales; ley nacional de libre acceso a la información pública ambiental; Acuerdo de Escazú, en materia de acceso a la información, participación y justicia ambiental; normativa nacional sobre uso de la zona de camino y accesos en rutas nacionales, aplicable a los accesos y alcantarillas de la RN 9 y al Acceso Norte; normativa nacional de protección del patrimonio arqueológico y paleontológico; y el régimen del Código Civil y Comercial en materia de dominio público y privado del Estado, que determina qué puede y qué no puede hacerse con una parcela fiscal antes de desafectarla. · Provincial de Salta: ley provincial de protección del medio ambiente y su régimen de evaluación de impacto ambiental y social; ordenamiento territorial de bosques nativos de la provincia, recientemente actualizado, que es la norma que define qué usos admite la categoría asignada al predio, que debe consultarse en su versión vigente y no en la citada por documentos anteriores, y contra la cual debe contrastarse el reparto propuesto de 289,8 ha de conservación, 324,0 ha con restricciones y 215,3 ha de cambio de uso; código de aguas provincial, por tratarse de cabecera de cuenca y zona de conducción de un acuífero; régimen provincial de tierras fiscales, de concesión de uso y de desafectación de bienes del dominio público; régimen provincial de catastro y de registro inmobiliario, que fija el valor jurídico de la mensura y la superficie oponible de la parcela N° 133.745; ley provincial de manejo del fuego y normativa sobre quema de pastizales; ley provincial de áreas protegidas, si se optara por asignar al predio una figura de protección sobre las hectáreas de conservación; normativa provincial de patrimonio cultural y arqueológico; normativa provincial de ordenamiento territorial y del área metropolitana. · Municipal: código de planeamiento urbano ambiental de la Municipalidad de Salta, con su zonificación de usos, indicadores urbanísticos y exigencias de cesión de espacio verde, que es el instrumento donde una eventual adopción de la zonificación propuesta tendría que traducirse; ordenanzas de arbolado y espacios verdes; ordenanzas de higiene urbana y disposición de residuos; ordenanzas de habilitación de obras y de accesos. · Alerta específica de este escenario: el propio escenario advierte que el régimen de bosques nativos fue actualizado y que los municipios metropolitanos aplican normativas dispares; copiar el marco normativo de un documento previo sin verificar vigencia es el error que este ítem busca evitar. Se agrega una segunda alerta: la zonificación propuesta no es normativa. Es un antecedente técnico de uso académico y su cartografía, en POSGAR 2007 Faja 3, no reemplaza la cartografía catastral oficial; citarla en la matriz de cumplimiento legal como si fuera una norma vigente es un error de la misma familia. No se consignan números de ley ni de decreto que el equipo no haya verificado en el texto oficial.", "K": "Las causas se ordenan por niveles, leyendo de abajo hacia arriba hasta el problema central. · Causa 1 (institucional) — El predio fiscal catastro N° 133.745 no tiene acto administrativo que le asigne destino de uso ni organismo con la administración efectivamente a cargo: existe un estudio de zonificación con propuesta de master plan, pero ninguna repartición se expidió sobre esa propuesta ni ejerce control territorial sobre las 846,6 ha. Es la raíz que el escenario vuelve inevitable: hay un estudio y una propuesta, pero no una decisión, y mientras no se decide se decide igual, por ocupación de hecho. · Causa 1.1 (técnica) — La información disponible se agota en un estudio de uso académico, en POSGAR 2007 Faja 3, que no reemplaza la cartografía catastral oficial: la superficie difiere entre fuentes (846,6 ha digitalizadas frente a 847,97 declaradas) y las tres zonas suman 829,1 ha, con 17,5 ha sin asignar. Hay más información que antes, pero todavía no la suficiente para que una restricción de uso sea oponible a terceros: sin cartografía validada no hay acto administrativo defendible. · Causa 1.2 (institucional) — La planificación urbana del ejido y la gestión del patrimonio natural fiscal se tramitan por circuitos administrativos separados, y los municipios del área metropolitana aplican normativas de uso del suelo dispares sin un ámbito común de decisión sobre el borde. Es también la razón por la cual una propuesta técnica completa puede quedar años sin tratamiento. · Causa 1.3 (económica) — En una ciudad que agotó su suelo vacante interior, el valor de expectativa del suelo del borde, concentrado en las 215,3 ha calificadas como urbanizables con cambio de uso, orienta la decisión de destino hacia el uso residencial rentable y desalienta comprometer el predio a un uso que no genera renta directa. · Causa 1.A (técnica y operativa, derivada de la causa 1) — Ninguna cuadrilla ni guardia territorial interviene sobre las quemas de pastizal, la extracción de leña y áridos, el ingreso de ganado ni los microbasurales perimetrales, en ninguno de los tres sectores que la propuesta distingue: la zonificación existe en el plano y no en el terreno. · Causa 2 (ambiental, derivada de la 1.A y de la 3) — Las quemas recurrentes, el pastoreo y la extracción impiden la regeneración de la cubierta leñosa joven sobre suelos erosionables con pendientes superiores al 30 % en la mitad alta del predio. · Causa 3 (social) — Los hogares de los barrios linderos obtienen del predio leña, áridos y pastura y disponen allí sus residuos, porque no acceden a gas de red, a materiales de construcción asequibles ni al servicio de recolección en las cotas superiores. · Causa 3.1 (económica) — La oferta habitacional formal no alcanza a los hogares de menores ingresos del sector, que resuelven su vivienda por autoconstrucción y ocupación informal ladera arriba. · Causa 4 (territorial, derivada de la 3.1) — El sector no dispone de espacio verde público —una única plaza reducida y en pendiente y un patio escolar insuficiente— ni de suelo urbano vacante alternativo, de modo que toda la demanda de expansión residencial y de espacio libre recae sobre el predio. · Verificación de derecha a izquierda: la 1.1, la 1.2 y la 1.3 explican por qué no hay acto administrativo (causa 1); la causa 1 explica por qué no hay control territorial (1.A); la 1.A y la 3 explican por qué no regenera la cubierta (causa 2); la 3.1 explica la causa 3 y la causa 4; y las causas 1, 2, 3 y 4 explican, cada una por una vía distinta, la degradación simultánea del soporte y de la habitabilidad. · Advertencia: la zonificación propuesta no es una causa del problema. Es un insumo. Lo que sí es causa es que esa propuesta no haya sido evaluada ni resuelta, y que su superficie no esté todavía validada.", "L": "Los efectos se ordenan de izquierda a derecha, del problema hacia sus consecuencias. · Efecto 1 (ambiental) — La recarga del acuífero de escasa dimensión que la cabecera de cuenca alimenta disminuye al reducirse la superficie con cubierta y capacidad de infiltración, incluidas las 289,8 ha que la propuesta destina a conservación y que hoy no cuentan con protección efectiva, en un sector cuyas cotas superiores ya se abastecen por camión cisterna. · Efecto 1.1 (económico, derivado del 1) — Se agrava la competencia por el agua entre los barrios del sector y se prolonga la dependencia del abastecimiento por camión cisterna, que es la preocupación que la propia población expresó al ser consultada. · Efecto 2 (técnico) — El escurrimiento superficial generado en las 846,6 ha aumenta en volumen y velocidad y descarga por las alcantarillas del corredor vial, único punto de salida hacia un cauce receptor revestido y sin capacidad ociosa. · Efecto 2.1 (territorial, derivado del 2) — El sector de riesgo hídrico crítico situado aguas abajo del punto de descarga queda más expuesto a anegamientos y a daños en viviendas e infraestructura durante los eventos de precipitación intensa. · Efecto 3 (ambiental) — Se contraen las poblaciones de las 32 especies leñosas nativas del bosque joven, dos de ellas con categoría de conservación desfavorable, y el hábitat de las 82 especies de aves y 6 de mamíferos registradas en el inventario. · Efecto 4 (social) — Los hogares del borde este quedan sin ámbito de encuentro ni de actividad al aire libre en condiciones seguras: la recreación se traslada a la calzada, a la banquina de la ruta y a los bordes del predio, con mayor carga térmica estival y exposición al humo de las quemas. · Efecto 5 (institucional) — El destino del predio queda determinado por la ocupación de hecho y no por una decisión de planificación: la única propuesta formulada permanece sin acto que la adopte, la ajuste o la rechace, y cada año que pasa el reparto de 289,8 / 324,0 / 215,3 ha se vuelve menos ejecutable, porque la ocupación consume primero los sectores más accesibles. · Efecto 6 (económico, derivado del 2.1 y del 5) — Crece el costo público futuro de reponer por obra las funciones que hoy presta el predio: retención del escurrimiento, ampliación de redes, forestación y adquisición de suelo para espacio verde. Es la respuesta a la pregunta orientadora sobre quién paga el resultado de no decidir: lo paga el erario, más caro y más tarde, y lo paga la población de aguas abajo con daño directo. · Verificación de izquierda a derecha: el efecto 1 produce el 1.1; el 2 produce el 2.1; el 2.1 y el 5 producen el 6.", "M": "Lectura encadenada del árbol, de las raíces al follaje. · La provincia es titular de una parcela fiscal identificada —catastro N° 133.745, 846,6 ha— sobre la que no pesa ningún acto administrativo que le asigne destino, y que ninguna repartición administra. Hay un estudio de zonificación ambiental que propone repartirla en 289,8 ha de conservación, 324,0 ha urbanizables con restricciones y 215,3 ha con cambio de uso, pero una propuesta no es una decisión. Esa indefinición tiene tres raíces: la información disponible es de uso académico y no está conciliada con el catastro —la superficie difiere entre fuentes y las zonas no cierran contra el total—, de modo que no alcanza para fundar una restricción oponible; la planificación urbana y la gestión del patrimonio natural fiscal se tramitan por circuitos separados, entre municipios metropolitanos con normativas dispares; y el valor de expectativa del suelo, concentrado en las 215,3 ha ya calificadas como urbanizables, empuja la decisión hacia el uso rentable. · De la indefinición se sigue la ausencia de control territorial: nadie interviene sobre quemas, pastoreo, extracción de leña y áridos ni microbasurales, en ninguno de los tres sectores. La zonificación existe en el plano y no en el terreno. Sin control, y con hogares linderos que dependen del predio para leña, pastura y disposición de residuos porque no tienen gas, materiales asequibles ni recolección, la cubierta leñosa joven no regenera sobre suelos erosionables con pendientes superiores al 30 %. · En paralelo, la oferta habitacional formal no alcanza y empuja la ocupación informal ladera arriba, mientras el sector no tiene ni espacio verde público ni suelo vacante alternativo: toda la demanda de expansión y de espacio libre termina recayendo sobre el mismo predio. · Esas cuatro vías convergen en el tronco: el soporte ambiental del que dependen las condiciones de habitabilidad del borde este se degrada, pierde cobertura, infiltración y capacidad de retención, y sigue sin destino resuelto ni acceso público. · Hacia arriba, el tronco se abre en cinco ramas. Baja la recarga del acuífero, y con ella se agrava la competencia por el agua en un sector que ya se abastece por camión cisterna. Aumenta el escurrimiento hacia el punto único de descarga, y el sector de riesgo hídrico crítico de aguas abajo queda más expuesto a anegamientos. Se contrae la biodiversidad del último remanente continuo. La población queda sin espacio de uso cotidiano y la recreación se desplaza a la calzada y a la banquina de la ruta. Y el destino del predio termina fijado por ocupación de hecho, con lo que cada año se vuelve menos ejecutable cualquier reparto, incluido el propuesto. Las dos últimas ramas se juntan en la copa: cada año que pasa, reponer por obra lo que el predio presta gratis cuesta más caro. · Advertencia metodológica: en esta instancia el árbol es un conjunto de hipótesis de trabajo. Cada vínculo —en particular el que une la pérdida de cobertura con el aumento del caudal pico— debe ponerse a prueba con estudios específicos al pasar a perfil y prefactibilidad. Y una advertencia adicional propia de este escenario: el árbol no se dibuja calcando el plano del master plan. La propuesta de zonificación entra al análisis como insumo en las causas 1 y 1.1 y como referencia de superficie en los efectos, no como estructura del árbol.", "N": "Los medios son las causas expresadas como estados alcanzados, con la misma estructura jerárquica y sin verbos de acción. · Medio 1 — El predio fiscal catastro N° 133.745 cuenta con destino de uso asignado por acto administrativo, adoptado a partir de la evaluación de la zonificación propuesta, y con un organismo que ejerce la administración y el control territorial de las 846,6 ha. · Medio 1.1 — El predio cuenta con información sistematizada y oponible: superficie catastral conciliada con la digitalizada, límite parcelario mensurado, cobertura, suelos, pendientes, hidrología y aptitud por sector, con el detalle necesario para fundamentar su zonificación interna y las restricciones de uso. · Medio 1.2 — La planificación urbana del ejido y la gestión del patrimonio natural fiscal se resuelven en un mismo instrumento, con un ámbito metropolitano de decisión sobre el borde y criterios de uso del suelo armonizados entre municipios. · Medio 1.3 — La decisión sobre el destino del predio, y en particular sobre las 215,3 ha calificadas como urbanizables, se adopta con criterios de aptitud y de interés público, con la valoración de los servicios ecosistémicos incorporada a la comparación económica. · Medio 1.A — Una guardería territorial y cuadrillas de manejo intervienen de manera regular sobre quemas, extracción, ingreso de ganado y microbasurales perimetrales, en los tres sectores de la zonificación adoptada. · Medio 2 — La cubierta leñosa joven regenera sobre los suelos erosionables y las pendientes superiores al 30 % de la mitad alta del predio, sin quemas, pastoreo ni extracción. · Medio 3 — Los hogares de los barrios linderos cubren sus necesidades de energía, materiales y disposición de residuos por fuera del predio, con acceso al servicio de recolección en las cotas superiores. · Medio 3.1 — Los hogares de menores ingresos del sector acceden a soluciones habitacionales formales y a lotes con servicios, sin necesidad de ocupar informalmente la ladera. · Medio 4 — El sector dispone de espacio verde público accesible y suficiente, y la demanda de expansión residencial se orienta a suelo apto previsto por la planificación. · Medios fuera del alcance del proyecto, declarados explícitamente: el 3.1 (política habitacional y regularización dominial) y el 1.2 en su componente metropolitana (armonización normativa entre municipios) exceden lo que una unidad de gestión de un predio puede resolver; se los mantiene en el árbol porque explican el problema, pero el proyecto no los asume como componentes y sí los incorpora como supuestos de la MML. La extensión de las redes de agua, cloaca y gas queda igualmente fuera del alcance, aunque el proyecto puede reducir la presión sobre el reservorio por la vía de conservar la zona de recarga. · Nota de redacción: el medio 1 dice destino asignado por acto administrativo, no zonificación adoptada. La diferencia importa: el proyecto no se compromete de antemano con el reparto propuesto, se compromete con que exista una decisión fundada sobre él.", "O": "Los fines son los efectos expresados como situaciones deseadas, conservando el mismo encadenamiento. · Fin 1 — La recarga del acuífero de escasa dimensión que la cabecera de cuenca alimenta se sostiene, con la superficie de infiltración conservada en el predio del borde este, empezando por las 289,8 ha de mayor valor de conservación. · Fin 1.1 (derivado del 1) — La competencia por el agua entre los barrios del sector se atenúa y se reduce la dependencia del abastecimiento por camión cisterna en las cotas superiores. · Fin 2 — El escurrimiento superficial generado en las 846,6 ha se retiene e infiltra dentro del predio y llega amortiguado a las alcantarillas del corredor vial, dentro de la capacidad del cauce receptor. · Fin 2.1 (derivado del 2) — El sector de riesgo hídrico crítico situado aguas abajo del punto de descarga reduce su exposición a anegamientos y a daños en viviendas e infraestructura. · Fin 3 — Las poblaciones de las 32 especies leñosas nativas, incluidas las dos con categoría de conservación desfavorable, y el hábitat de las 82 especies de aves y 6 de mamíferos se mantienen y recuperan en el predio. · Fin 4 — Los hogares del borde este disponen de un ámbito de encuentro y de actividad al aire libre en condiciones seguras, con sombra, menor carga térmica estival y sin exposición al humo de las quemas. · Fin 5 — El destino del predio resulta de una decisión de planificación explícita, que se pronuncia de manera fundada sobre el reparto propuesto y preserva el abanico de alternativas técnicamente posibles. · Fin 6 (derivado del 2.1 y del 5) — Se evita el costo público futuro de reponer por obra las funciones que el predio presta: retención del escurrimiento, ampliación de redes, forestación y adquisición de suelo para espacio verde. · Los fines 1.1, 2.1 y 6 son los más altos del árbol y son los que alimentan el nivel Fin de la EAP y de la MML. Cada fin tiene su efecto espejo en el ítem L: no hay fines agregados sin efecto correspondiente.", "P": "Problema central: el soporte ambiental del que dependen las condiciones de habitabilidad del borde este de la ciudad de Salta —el predio fiscal catastro N° 133.745, de 846,6 ha sobre la RN 9, último remanente continuo de vegetación nativa del sector— se degrada de manera progresiva: pierde cobertura leñosa, capacidad de infiltración y de retención del escurrimiento, y su destino de uso permanece sin decisión que lo asigne —hay una zonificación propuesta, no adoptada— ni acceso público para la población que lo rodea. · Objetivo central, propósito o meta: ese mismo soporte ambiental se conserva y recupera: mantiene su cobertura leñosa, su capacidad de infiltración y de retención del escurrimiento, y cuenta con destino de uso resuelto por decisión fundada sobre la zonificación propuesta y con acceso público para la población que lo rodea. · Se conservan el mismo sujeto, las mismas variables, la misma parcela y la misma superficie de referencia: sólo cambia el signo. El alcance no se amplía al ejido ni al área metropolitana, aunque las causas lleguen hasta allí. El indicador del propósito es el mismo del ítem E, con el valor meta en lugar del valor de línea de base, y desagregado por las tres zonas de la propuesta. · Precisión sobre el signo positivo: la meta no dice que se adopte la zonificación propuesta, dice que el destino queda resuelto por una decisión fundada sobre ella. Escribir la meta como adopción del master plan sería incorporar la solución a la meta y clausurar el ítem R.", "Q": "El árbol de objetivos reproduce nodo por nodo la estructura del árbol de problemas, con medios abajo, meta en el tronco y fines arriba. · Base: los medios 1.1, 1.2 y 1.3 sostienen el medio 1; el medio 1 habilita el 1.A; el 1.A y el medio 3 sostienen el medio 2; el medio 3.1 sostiene el 3 y el 4; y los medios 1, 2, 3 y 4 confluyen en la meta. · Tronco: el soporte ambiental del borde este se conserva y recupera, con destino resuelto y acceso público, sobre las 846,6 ha del catastro N° 133.745. · Copa: de la meta se desprenden los fines 1, 2, 3, 4 y 5; el fin 1 lleva al 1.1, el 2 al 2.1, y el 2.1 junto con el 5 confluyen en el fin 6. · Medios sobre los que el proyecto puede actuar directamente, marcados en el diagrama: 1, 1.1, 1.A, 2 y 4. · Medios sobre los que el proyecto sólo puede incidir parcialmente: 1.2 y 1.3, mediante la participación en el ámbito metropolitano y la valoración económica de los servicios ecosistémicos. · Medios fuera del alcance, señalados con trama distinta: 3.1 y la porción del 3 que depende de la extensión de redes de gas y del servicio de recolección municipal. · Recomendación de representación gráfica, propia de este escenario: conviene acompañar el árbol de objetivos con el plano de las tres zonas propuestas como lámina separada, y no fusionarlos. El árbol organiza medios y fines; el plano organiza superficies. Superponerlos induce a leer el reparto de hectáreas como si fuera la estructura causal, que es exactamente el error que hay que evitar. · Control de simetría: dieciocho nodos en el árbol de problemas, dieciocho en el de objetivos; ningún medio sin causa espejo y ningún fin sin efecto espejo. Si al dibujarlo apareciera un nodo de más o de menos, corresponde volver al ítem M antes de cerrar el Q.", "R": "Se parte de los medios más bajos del árbol y se pregunta qué habría que hacer para materializarlos. Las actividades dentro de cada estrategia son mutuamente excluyentes. Cada alternativa se describe además por lo que hace con el reparto propuesto, de modo que las seis puedan compararse contra el mismo plano: qué hace con las 289,8 ha de conservación, con las 324,0 ha urbanizables con restricciones y con las 215,3 ha urbanizables con cambio de uso. · Estrategia 1 — Medio: el predio cuenta con destino asignado y con administración a cargo. Actividades: (A) plan de manejo y control territorial del predio, con zonificación por aptitud, guardería y clausura de accesos informales, sin obra ni apertura al uso público, adoptando el reparto propuesto tal como está; (B) transferencia del predio a un esquema de urbanización planificada por asociación público-privada, con cesión de un porcentaje de la superficie para espacio verde, que extiende al resto del predio el criterio con que la propuesta califica las 215,3 ha. · Estrategia 2 — Medio: la base natural se conserva, las funciones hidrológicas se recuperan y el sector dispone de espacio público. Actividades: (C) reserva natural urbana de acceso restringido, con clausura perimetral y restauración pasiva, que amplía el criterio de las 289,8 ha a las 846,6 ha; (D) parque periurbano de borde con zonificación por aptitud, que adopta las 289,8 ha de conservación, ajusta el contenido de la restricción sobre las 324,0 ha y discute el destino de las 215,3 ha. · Estrategia 3 — Medio: los hogares linderos no dependen del predio y el sector dispone de servicios. Actividades: (E) programa de sustitución de leña, extensión del servicio de recolección y provisión de materiales de construcción a los barrios de las cotas superiores, indiferente al reparto de superficies; (F) extensión de las redes de agua y cloaca a las cotas superiores, que en los hechos acelera la ocupación de las 215,3 ha. · Actividades descartadas por estar fuera del alcance: la F excede la competencia del titular del proyecto y el ámbito de actuación declarado, y además, ejecutada antes de definir el destino del predio, aceleraría la densificación sobre el borde; la B se descarta por incompatibilidad con la aptitud del sitio y con el régimen de bosques nativos. · Actividad seleccionada: la D, dentro de la estrategia 2. Es la única que interviene sobre el mismo objeto en el que el problema integra base natural y habitabilidad. · Posición del proyecto frente a la zonificación propuesta, que es lo que este ítem debe dejar por escrito: se adoptan las 289,8 ha no urbanizables como núcleo de conservación no negociable, y se incorpora su gestión activa —control de fuego, pastoreo y extracción— porque hoy la categoría existe en el plano y no en el terreno. Se adoptan las 324,0 ha urbanizables con restricciones en su delimitación, pero se define el contenido de la restricción, que la propuesta deja abierto: restauración de la cubierta, obras de retención e infiltración del escurrimiento y uso público extensivo de baja carga, sin loteo ni impermeabilización. Se discute, en cambio, el destino de las 215,3 ha con cambio de uso: el proyecto propone localizar allí el uso público intensivo y los accesos desde los barrios linderos —es la superficie de menor pendiente y de contacto directo con el tejido, según debe verificarse contra el terreno 3D del visor y en campo— y condicionar cualquier cambio de uso residencial a la cesión de superficie para espacio verde y a la capacidad de descarga del punto único de salida, que hoy no tiene margen. Apartarse del reparto en esta zona es legítimo porque la propuesta la califica por su aptitud constructiva y no por su función de contacto con la población, y porque el escenario declara expresamente que la zonificación es un insumo y no una decisión tomada. Las hectáreas concretas que dentro de las 215,3 se destinen a uso público, a equipamiento y a eventual residencia se dimensionan en el F02: acá se fija el criterio, no la cifra. · Se deja constancia de la superficie no asignada: las tres zonas suman 829,1 ha y quedan 17,5 ha sin destino explícito respecto de las 846,6 digitalizadas; el proyecto las trata provisoriamente como franja de borde asociada a la RN 9 y al Acceso Norte, supuesto a confirmar en el F02. · La actividad A no se descarta por incorrecta sino por insuficiente: resuelve el control pero deja intacto el déficit de espacio público, y un control sin uso legítimo del predio es caro de sostener y políticamente frágil. La E se incorpora como línea de trabajo complementaria con la población objetivo, no como alternativa: por sí sola no define el destino del predio.", "S": "Estructura Analítica del Proyecto, de arriba hacia abajo. · Fin: contribuir a que el borde este de la ciudad de Salta sostenga sus condiciones de habitabilidad sobre una base natural conservada, con menor exposición a anegamientos en el sector de riesgo hídrico crítico de aguas abajo, recarga del acuífero sostenida y menor costo público futuro de reposición de funciones. · Propósito: el soporte ambiental del que dependen las condiciones de habitabilidad del borde este —el predio fiscal catastro N° 133.745, de 846,6 ha sobre la RN 9— se conserva y recupera, con destino de uso resuelto y acceso público para la población lindera. · Componentes, todos redactados como productos obtenidos: (1) parque periurbano de borde habilitado al uso público dentro de la zona de menor pendiente y de contacto con los barrios, con accesos desde los barrios linderos; (2) 289,8 ha de conservación y 324,0 ha con restricciones bajo manejo activo, con restauración de la cubierta y control de fuego, pastoreo y extracción implementado; (3) sistema de retención e infiltración del escurrimiento en operación dentro del predio, dimensionado sobre la superficie de aporte de las 846,6 ha; (4) régimen de administración de la parcela fiscal establecido, con zonificación aprobada por acto administrativo sobre la base de la propuesta evaluada y ajustada, superficie catastral conciliada y unidad de gestión conformada. · Actividad: ejecución del proyecto de inversión «parque periurbano de borde con restauración del bosque nativo y manejo del escurrimiento», que comprende el relevamiento y la conciliación catastral y la sistematización de la información del predio, la evaluación de la zonificación propuesta y la tramitación del acto administrativo de destino, el proyecto ejecutivo y la obra del parque y de las obras de retención, la restauración con especies nativas y el plan de manejo del fuego, la conformación de la unidad de gestión y de la guardería territorial, y el programa de uso público y de trabajo con los barrios linderos. · Control de redacción: las cuatro componentes están escritas como estados o productos logrados, no como acciones. «Restaurar el bosque» sería una actividad; «289,8 ha de conservación bajo manejo activo» es la componente.", "T": "Matriz de Marco Lógico, en concordancia estricta con la EAP. · Fin. Resumen narrativo: el borde este de la ciudad de Salta sostiene sus condiciones de habitabilidad sobre una base natural conservada. Indicador: reducción del 30 % del caudal pico descargado por las alcantarillas del corredor vial de la RN 9 hacia el cauce receptor revestido, medido en el punto único de salida de las 846,6 ha del predio fiscal catastro N° 133.745, al quinto año de operación, respecto del valor de línea de base relevado en el F02. Medio de verificación: serie de aforos y registros de nivel en la alcantarilla de salida, a cargo del organismo provincial de recursos hídricos con participación de la unidad de gestión; informe hidrológico anual publicado en el portal de la Municipalidad de Salta. Supuesto: no se habilitan nuevas urbanizaciones ni impermeabilizaciones aguas arriba que incrementen el escurrimiento por encima de lo previsto, y el régimen de precipitaciones no se aparta de la serie histórica considerada. · Propósito. Resumen narrativo: el soporte ambiental del que dependen las condiciones de habitabilidad del borde este se conserva y recupera, con destino de uso resuelto y acceso público. Indicador: cero hectáreas desmontadas u ocupadas dentro de las 289,8 ha de conservación y de las 324,0 ha con restricciones, y superficie con cobertura leñosa nativa igual o mayor a la del inventario forestal de línea de base en esas 613,8 ha del predio fiscal del borde este, al tercer año de ejecución; y al menos el 60 % de los hogares de los barrios linderos declara usar el parque una vez por mes o más, en el mismo plazo (meta adoptada como supuesto de diseño, a validar en el F02). Medio de verificación: monitoreo satelital anual con verificación de campo en parcelas permanentes, sobre las capas del catastro y de las tres zonas descargadas del visor en formato GeoJSON, informado a la autoridad provincial de bosques nativos; encuesta anual de uso del espacio público en los barrios linderos, aplicada por la unidad de gestión y archivada en el expediente del proyecto. Supuesto: la autoridad de aplicación mantiene la categoría de conservación del predio en el ordenamiento territorial de bosques nativos y no se sanciona una recategorización que habilite el uso residencial de las 289,8 ha o de las 324,0 ha. · Componentes. Resumen narrativo: parque periurbano habilitado, 289,8 ha de conservación y 324,0 ha con restricciones bajo manejo activo, sistema de retención e infiltración en operación y régimen de administración establecido. Indicador: superficie de uso público intensivo habilitada dentro de la zona de 215,3 ha, con la magnitud que fije el proyecto ejecutivo y con al menos tres accesos desde los barrios linderos; 613,8 ha con plan de manejo aprobado y con el 100 % del perímetro bajo control de ingreso de ganado y de extracción; obras de retención dimensionadas para el evento de diseño que fije el estudio hidrológico; acto administrativo de zonificación publicado y superficie catastral conciliada con las 846,6 ha digitalizadas; todo al segundo año de ejecución. Medio de verificación: actas de recepción de obra y planos conforme a obra; certificado catastral y plano de mensura de la parcela N° 133.745; registro de intervenciones de la guardería territorial; boletín oficial de la provincia con el acto administrativo; informes trimestrales de la unidad de gestión. Supuesto: se mantiene la disponibilidad del financiamiento comprometido y no se producen conflictos dominiales que impidan materializar los accesos desde los barrios linderos. · Actividades. Resumen narrativo: relevamiento, conciliación catastral y sistematización de la información del predio; evaluación de la zonificación propuesta y tramitación administrativa del destino; proyecto ejecutivo y obra; restauración y manejo del fuego; conformación de la unidad de gestión y de la guardería; y programa de uso público con los barrios linderos. Indicador: 100 % de las actividades del cronograma del primer bienio ejecutadas y certificadas, con presupuesto ejecutado dentro del ±10 % de lo previsto, en el predio fiscal del borde este, al cierre del segundo año. Medio de verificación: curva de avance físico-financiero de la unidad ejecutora, certificados de obra, rendiciones ante el organismo financiador y expediente administrativo del proyecto. Supuesto: los recursos se transfieren en los plazos previstos y los cambios de gestión municipal o provincial no interrumpen la continuidad de la unidad ejecutora. · Nota de coherencia: ninguno de los supuestos consignados es una tarea del proyecto. Contratar la guardería, conciliar la superficie catastral, dimensionar las obras o hacer la encuesta son actividades y están en la primera columna, no en la cuarta. · Nota sobre las cifras: 613,8 ha es la suma de las dos zonas que el proyecto adopta (289,8 + 324,0) y se usa como superficie de control; no es un dato nuevo sino una operación sobre los valores del escenario. La superficie de uso público intensivo no se fija acá porque el material no aporta base para hacerlo: se dimensiona en el F02.", "U": "Lógica vertical, narrada de abajo hacia arriba: si se releva y concilia la información catastral del predio, se evalúa la zonificación propuesta y se aprueba la zonificación resultante, se ejecutan la obra del parque y las obras de retención, se restaura la cubierta y se conforman la unidad de gestión y la guardería, entonces se obtienen las cuatro componentes: un parque habilitado al uso público, 613,8 ha de conservación y restricción bajo manejo activo, un sistema de retención e infiltración en operación y un régimen de administración establecido sobre la parcela N° 133.745. Si esas cuatro componentes existen y se sostienen, entonces el soporte ambiental del borde este deja de degradarse, recupera cobertura e infiltración y pasa a tener destino resuelto y acceso público, que es el propósito. Y si el propósito se cumple, entonces baja el caudal pico que llega al punto único de descarga, se sostiene la recarga del acuífero y la población dispone de espacio de uso cotidiano: el borde este sostiene su habitabilidad sobre una base natural conservada, que es el fin. La cadena se sostiene porque en ningún eslabón se cambia de objeto: se interviene siempre sobre las mismas 846,6 ha de una única parcela identificada. · Lógica horizontal, fila por fila. En la fila del fin, el indicador de caudal pico es evaluable con aforos en un punto único ya existente —la alcantarilla del corredor vial—, de modo que el medio de verificación es necesario y suficiente, aunque exige instalar el registro que hoy no existe. En la fila del propósito se usan dos indicadores porque el propósito tiene dos caras inseparables: la cobertura leñosa sobre las 613,8 ha mide la base natural y la frecuencia de uso mide la habitabilidad; con uno solo, la fila no permitiría concluir sobre el logro del objetivo. La disponibilidad de las capas del catastro y de las tres zonas en GeoJSON vuelve al primer indicador verificable por un tercero con el mismo polígono, que es una condición que antes no existía. En la fila de componentes, los medios de verificación son documentos que la propia ejecución genera —actas, planos, certificado catastral, boletín oficial— y por lo tanto son verificables. En la fila de actividades, la curva de avance físico-financiero permite calcular el indicador sin información adicional. · Lógica zigzag: las actividades más el supuesto de transferencia de recursos en plazo producen las componentes; las componentes más el supuesto de continuidad del financiamiento y de resolución dominial de los accesos producen el propósito; el propósito más el supuesto de que no se recategoriza el predio produce el fin. · Supuesto más frágil: que la autoridad de aplicación mantenga la categoría de conservación del predio y no se sancione una recategorización que habilite el uso residencial de las 289,8 ha de conservación o de las 324,0 ha con restricciones. Es el más frágil porque concentra la presión de todos los actores con mayor fuerza relativa del ítem H —el titular del dominio, que ve reducido el valor de realización, y los desarrolladores, que operan en una ciudad sin suelo vacante y que ya cuentan con 215,3 ha calificadas como urbanizables en un documento público— y porque su ocurrencia no anula un resultado parcial: lo anula todo, ya que sin el predio no hay proyecto. La existencia de una propuesta de zonificación agrava y a la vez mitiga este supuesto: agrava, porque instala públicamente una superficie urbanizable y crea la expectativa de que el resto también puede recategorizarse; mitiga, porque una decisión formal fundada sobre esa propuesta convierte una situación reversible de hecho en una situación reversible sólo por otro acto administrativo. La estrategia de mitigación no es un supuesto adicional sino una decisión de diseño: apoyar el propósito en un uso público masivo y visible, que crea una constituency que vuelve costoso revertir la decisión.", "V": "«Parque periurbano de borde con restauración del bosque nativo y manejo del escurrimiento en el predio fiscal catastro N° 133.745, borde este de la ciudad de Salta». · Qué se hace: implantación de un parque periurbano con zonificación por aptitud, restauración de la cubierta nativa y obras de retención e infiltración. · Para qué: para conservar y recuperar el soporte ambiental del que dependen las condiciones de habitabilidad del sector. · Dónde: la parcela fiscal catastro N° 133.745, de 846,6 ha sobre la RN 9, borde este del ejido de la ciudad de Salta. · La identificación catastral se incorpora al nombre porque el proyecto tiene un objeto material único e inequívoco, y eso lo distingue de un programa territorial difuso. · Este nombre es distinto del nombre de fantasía del equipo del ítem A y acompañará al proyecto en los formularios F02, F03 y F04. No es un nombre publicitario: dice qué se hace, sobre qué y dónde."}, "eap": {"fin": "Contribuir a que el borde este de la ciudad de Salta sostenga sus condiciones de habitabilidad sobre una base natural conservada: menor exposición a anegamientos en el sector de riesgo hídrico crítico de aguas abajo, recarga del acuífero sostenida y menor costo público futuro de reposición de funciones.", "prop": "El soporte ambiental del que dependen las condiciones de habitabilidad del borde este de la ciudad de Salta —el predio fiscal catastro N° 133.745, de 846,6 ha sobre la RN 9— se conserva y recupera, con destino de uso resuelto por decisión fundada y acceso público para la población lindera.", "comp": "(1) Parque periurbano de borde habilitado al uso público dentro de la zona de menor pendiente y de contacto con los barrios, con accesos desde los barrios linderos · (2) 289,8 ha de conservación y 324,0 ha urbanizables con restricciones bajo manejo activo, con restauración de la cubierta y control de fuego, pastoreo y extracción implementado · (3) Sistema de retención e infiltración del escurrimiento en operación dentro del predio, dimensionado sobre la superficie de aporte de las 846,6 ha · (4) Régimen de administración de la parcela fiscal establecido, con zonificación aprobada por acto administrativo sobre la base de la propuesta evaluada y ajustada, superficie catastral conciliada y unidad de gestión conformada.", "act": "Ejecución del proyecto de inversión «parque periurbano de borde con restauración del bosque nativo y manejo del escurrimiento»: relevamiento, conciliación catastral y sistematización de la información del predio; evaluación de la zonificación propuesta y tramitación del acto administrativo de destino; proyecto ejecutivo y obra del parque y de las obras de retención e infiltración; restauración con especies nativas y plan de manejo del fuego; conformación de la unidad de gestión y de la guardería territorial; programa de uso público y de trabajo con los barrios linderos."}, "mml": {"fin": ["El borde este de la ciudad de Salta sostiene sus condiciones de habitabilidad sobre una base natural conservada: menor exposición a anegamientos aguas abajo, recarga del acuífero sostenida y menor costo público futuro de reposición de funciones.", "Reducción del 30 % del caudal pico descargado por las alcantarillas del corredor vial de la RN 9 hacia el cauce receptor revestido, medido en el punto único de salida de las 846,6 ha del predio fiscal catastro N° 133.745 del borde este de la ciudad de Salta, al quinto año de operación, respecto del valor de línea de base relevado en el F02.", "Serie de aforos y registros de nivel en la alcantarilla de salida, a cargo del organismo provincial de recursos hídricos con participación de la unidad de gestión del predio; informe hidrológico anual publicado en el portal de la Municipalidad de Salta.", "No se habilitan nuevas urbanizaciones ni impermeabilizaciones aguas arriba del predio que incrementen el escurrimiento por encima de lo previsto, y el régimen de precipitaciones no se aparta de la serie histórica considerada."], "prop": ["El soporte ambiental del que dependen las condiciones de habitabilidad del borde este de la ciudad de Salta —el predio fiscal catastro N° 133.745, de 846,6 ha sobre la RN 9— se conserva y recupera, con destino de uso resuelto por decisión fundada y acceso público para la población lindera.", "Cero hectáreas desmontadas u ocupadas dentro de las 289,8 ha de conservación y de las 324,0 ha urbanizables con restricciones, y superficie con cobertura leñosa nativa igual o mayor a la del inventario forestal de línea de base en esas 613,8 ha del predio fiscal del borde este, al tercer año de ejecución · al menos el 60 % de los hogares de los barrios linderos declara usar el parque una vez por mes o más, en el mismo plazo y lugar (meta adoptada como supuesto de diseño, a validar en el F02).", "Monitoreo satelital anual con verificación de campo en parcelas permanentes, sobre las capas del catastro y de las tres zonas descargadas del visor del caso en formato GeoJSON, informado a la autoridad provincial de aplicación del régimen de bosques nativos; encuesta anual de uso del espacio público en los barrios linderos, aplicada por la unidad de gestión y archivada en el expediente del proyecto.", "La autoridad de aplicación mantiene la categoría de conservación del predio en el ordenamiento territorial de bosques nativos y no se sanciona una recategorización que habilite el uso residencial de las 289,8 ha de conservación ni de las 324,0 ha con restricciones."], "comp": ["Parque periurbano habilitado al uso público en la zona de menor pendiente y de contacto con los barrios; 289,8 ha de conservación y 324,0 ha con restricciones bajo manejo activo; sistema de retención e infiltración del escurrimiento en operación; régimen de administración de la parcela fiscal establecido con zonificación aprobada y superficie catastral conciliada.", "Superficie de uso público intensivo habilitada dentro de la zona de 215,3 ha, con la magnitud que fije el proyecto ejecutivo y al menos tres accesos desde los barrios linderos; 613,8 ha con plan de manejo aprobado y 100 % del perímetro bajo control de ingreso de ganado y de extracción; obras de retención dimensionadas para el evento de diseño que fije el estudio hidrológico; acto administrativo de zonificación publicado y superficie catastral conciliada con las 846,6 ha digitalizadas; todo en el predio fiscal catastro N° 133.745 del borde este, al segundo año de ejecución.", "Actas de recepción de obra y planos conforme a obra; certificado catastral y plano de mensura de la parcela N° 133.745; registro de intervenciones de la guardería territorial; boletín oficial de la provincia con el acto administrativo de destino; informes trimestrales de la unidad de gestión, disponibles en el expediente del proyecto.", "Se mantiene la disponibilidad del financiamiento comprometido y no se producen conflictos dominiales en los barrios linderos que impidan materializar los accesos al parque."], "act": ["Relevamiento, conciliación catastral y sistematización de la información del predio; evaluación de la zonificación propuesta y tramitación administrativa del destino; proyecto ejecutivo y obra del parque y de las obras de retención e infiltración; restauración con especies nativas y plan de manejo del fuego; conformación de la unidad de gestión y de la guardería territorial; programa de uso público y de trabajo con los barrios linderos.", "100 % de las actividades del cronograma del primer bienio ejecutadas y certificadas, con presupuesto ejecutado dentro del ±10 % de lo previsto, en el predio fiscal catastro N° 133.745 del borde este de la ciudad de Salta, al cierre del segundo año.", "Curva de avance físico-financiero de la unidad ejecutora; certificados de obra; rendiciones ante el organismo financiador; expediente administrativo del proyecto en la mesa de entradas del organismo provincial de tierras fiscales.", "Los recursos se transfieren en los plazos previstos y los cambios de gestión municipal o provincial no interrumpen la continuidad de la unidad ejecutora."]}, "alt": [{"id": "A", "med": "El predio fiscal catastro N° 133.745 cuenta con destino de uso asignado por acto administrativo y con un organismo que ejerce la administración y el control territorial de las 846,6 ha.", "act": "Plan de manejo y control territorial del predio: adopción sin cambios del reparto propuesto —289,8 ha de conservación, 324,0 ha con restricciones y 215,3 ha urbanizables—, guardería, clausura de accesos informales y erradicación de microbasurales, sin obra ni apertura al uso público.", "ven": "Costo de inversión bajo y ejecución rápida; frena la ocupación de hecho y preserva el abanico de alternativas futuras; no requiere estudios hidráulicos ni proyecto ejecutivo de obra; aprovecha íntegramente el trabajo técnico ya realizado por el estudio de zonificación.", "des": "No modifica las condiciones de habitabilidad del borde este: la población sigue sin espacio verde accesible y sin razón para defender el predio. Adopta el reparto sin evaluarlo, de modo que hereda sus indefiniciones —el contenido de la restricción sobre las 324,0 ha, el destino concreto de las 215,3 ha y las 17,5 ha que no cierran contra el total— y las convierte en acto administrativo. El control sin uso legítimo es caro de sostener, genera conflicto con los hogares que hoy extraen leña y pastura, y su continuidad depende de la voluntad política de cada gestión."}, {"id": "B", "med": "El predio fiscal catastro N° 133.745 cuenta con destino de uso asignado por acto administrativo y con un organismo que ejerce la administración y el control territorial de las 846,6 ha.", "act": "Transferencia del predio a un esquema de urbanización planificada por asociación público-privada, con cesión de un porcentaje de la superficie para espacio verde y para equipamiento: extiende al conjunto de las 846,6 ha el criterio con que la propuesta califica las 215,3 ha de cambio de uso.", "ven": "Financia su propia ejecución y genera recursos para el erario; aporta suelo con servicios en una ciudad que agotó su vacante interior y donde el 91 % de la expansión reciente fue residencial; ordena un frente que hoy avanza de manera informal.", "des": "Consume el último remanente continuo de vegetación nativa sobre cabecera de cuenca, zona de conducción del acuífero, suelos erosionables y pendientes superiores al 30 % en la mitad alta; contradice frontalmente las 289,8 ha que el propio estudio califica como no urbanizables y es incompatible con la cobertura sujeta al régimen provincial de bosques nativos; agrava el escurrimiento hacia un punto único de descarga que ya no tiene capacidad ociosa y que vierte sobre un sector de riesgo hídrico crítico."}, {"id": "C", "med": "La cubierta leñosa regenera y las funciones hidrológicas del predio se conservan.", "act": "Reserva natural urbana de acceso restringido, con clausura perimetral, restauración pasiva y monitoreo de fauna y flora: amplía a las 846,6 ha el criterio que la propuesta reserva para 289,8 ha.", "ven": "Máxima protección del bosque joven, de las 32 especies leñosas nativas —dos con conservación desfavorable— y del hábitat de las 82 especies de aves y 6 de mamíferos; conserva íntegra la superficie de infiltración de la cabecera de cuenca; costo de inversión moderado.", "des": "Deja intacto el déficit de espacio público del sector y traslada toda la presión de uso al perímetro, donde se concentran hoy los microbasurales; sin uso social el costo de vigilancia sobre 846,6 ha es alto y el apoyo político frágil; contradice la expectativa mayoritaria de la población consultada, que se manifestó a favor de un cambio de usos; y descarta sin fundamento técnico propio las 539,3 ha que el estudio consideró urbanizables, con lo que desperdicia la mejor información disponible en lugar de discutirla."}, {"id": "D", "med": "El sector dispone de espacio verde público accesible y suficiente sobre una base natural conservada, con el escurrimiento retenido e infiltrado dentro del predio y con el destino de la parcela resuelto por decisión fundada.", "act": "Parque periurbano de borde con zonificación por aptitud, construido sobre la propuesta y no contra ella: adopta las 289,8 ha no urbanizables como núcleo de conservación con manejo activo; adopta la delimitación de las 324,0 ha con restricciones y define el contenido de la restricción como restauración, retención e infiltración del escurrimiento y uso público extensivo de baja carga, sin loteo; y discute el destino de las 215,3 ha urbanizables, proponiendo localizar allí el uso público intensivo y los accesos desde los barrios y condicionar todo cambio de uso residencial a cesión de espacio verde y a la capacidad del punto único de descarga.", "ven": "Interviene sobre el único objeto en el que el problema integra base natural y habitabilidad, sin partirlo en dos proyectos; toma la zonificación propuesta como insumo y se posiciona frente a ella con fundamento, adoptando lo que resiste el análisis y discutiendo lo que no; concentra el uso donde el impacto sobre la regeneración es menor y restringe la mitad alta erosionable; el uso público masivo crea la base social que vuelve costoso revertir la decisión de destino; compatible con la capacidad de acogida visual media de la cuenca observada desde la ruta y con la ausencia de hallazgos arqueológicos en superficie; responde a la vez a los tres reparos que expresó la población consultada —áreas verdes, escurrimiento y agua—.", "des": "Costo de inversión y, sobre todo, de mantenimiento elevado para un municipio; requiere una unidad de gestión interjurisdiccional que hoy no existe y un acuerdo entre provincia y municipio; apartarse del destino previsto para las 215,3 ha resigna el ingreso que esa zona podría generar y expone la decisión a impugnación por parte de los actores con expectativa de renta; el uso público mal zonificado o sin control puede agravar la erosión y el riesgo de incendio; exige la conciliación catastral y estudios hidrológicos, de suelos y de pendientes previos que hoy no están disponibles."}, {"id": "E", "med": "Los hogares de los barrios linderos cubren sus necesidades de energía, materiales y disposición de residuos por fuera del predio.", "act": "Programa de sustitución de leña, extensión del servicio de recolección a las cotas superiores y provisión de materiales de construcción a los hogares de los barrios del extremo oeste.", "ven": "Ataca una causa directa y verificable de la degradación —la extracción y el volcado— y actúa sobre la población objetivo con beneficio inmediato; costo relativamente bajo y alta aceptación social; es indiferente al reparto de superficies, de modo que puede ejecutarse cualquiera sea la decisión que se tome sobre el destino del predio.", "des": "No define el destino del predio: la indefinición dominial, la presión inmobiliaria y la ocupación de hecho continúan, y la propuesta de zonificación sigue sin resolución. Por sí sola no modifica el escurrimiento ni el déficit de espacio verde, y su efecto se revierte apenas se interrumpe el financiamiento del programa. Se conserva como línea complementaria del proyecto, no como alternativa."}, {"id": "F", "med": "El borde este cuenta con infraestructura sanitaria completa y el vuelco domiciliario no compromete el reservorio del que se extrae agua.", "act": "Extensión de las redes de agua y cloaca a las cotas superiores del sector.", "ven": "Elimina el vuelco a pozo absorbente sobre el mismo reservorio del que se extrae agua y suprime la dependencia del camión cisterna; mejora de manera directa las condiciones de habitabilidad.", "des": "Excede la competencia del titular del proyecto y el ámbito de actuación declarado; su costo es de otra escala. Además, ejecutada antes de definir el destino del predio, habilita y acelera la densificación sobre el borde y en particular sobre las 215,3 ha ya calificadas como urbanizables, de modo que agravaría el problema central en lugar de resolverlo. Se descarta por estar fuera del alcance y se declara el criterio."}], "altSel": "D", "altJus": "Los criterios de comparación se fijaron antes de mirar las alternativas, y son seis: consistencia con la aptitud física del sitio (pendiente, erosionabilidad, condición de cabecera de cuenca y de zona de conducción del acuífero); compatibilidad con el marco normativo vigente, en particular con el régimen provincial de bosques nativos recientemente actualizado; capacidad de atacar simultáneamente las dos manifestaciones del problema central —degradación de la base natural y deterioro de la habitabilidad— sin partirlo en dos proyectos; sostenibilidad del arreglo de gestión y del costo operativo una vez terminada la inversión; correspondencia con lo que la población consultada expresó, a favor de un cambio de usos pero con reparos por áreas verdes, escurrimiento y competencia por el agua; y, agregado a partir del material publicado, calidad del posicionamiento frente a la zonificación propuesta, entendido como la capacidad de decir con fundamento qué se hace con cada una de las tres zonas y por qué. · Contra esos criterios, B queda descartada de entrada: es la única que tiene retorno económico directo, pero falla en aptitud del sitio, en marco normativo y en el sexto criterio, porque generaliza a las 846,6 ha un destino que el propio estudio limitó a 215,3; además agrava el efecto de mayor consecuencia sobre terceros, la descarga sobre el sector de riesgo hídrico crítico. La pregunta orientadora del escenario plantea el dilema entre mayor retorno económico y mayor conservación de bosque y agua; la respuesta del equipo es que ese dilema no se resuelve por preferencia sino por aptitud: en pendientes superiores al 30 %, sobre suelos erosionables, en cabecera de cuenca y con un único punto de descarga sin capacidad ociosa, la alternativa rentable transfiere su costo a la población de aguas abajo y al erario, y la comparación deja de ser válida si esos costos no se internalizan en la evaluación. · A y C son técnicamente correctas y ambas conservan la base natural, pero fallan en el tercer criterio: resuelven media situación problemática y dejan la otra media exactamente donde estaba, con el agravante de que un predio conservado y cerrado, en un sector sin espacios verdes y con presión habitacional, es un predio que la sociedad no defiende. En el sexto criterio fallan además por los dos extremos opuestos: A adopta el reparto sin evaluarlo y lo eleva a acto administrativo con sus indefiniciones incluidas; C lo descarta en bloque sin oponerle un análisis propio. E y F fallan en el tercer criterio por el lado inverso: mejoran la habitabilidad sin definir el destino del predio, y F además está fuera del alcance. · Se selecciona D porque es la única que cumple los seis criterios a la vez. Es también la única que hace con la zonificación propuesta lo que corresponde hacer con un insumo técnico de calidad: adopta las 289,8 ha de conservación, adopta la delimitación de las 324,0 ha y le da contenido a la restricción que la propuesta deja abierta, y discute las 215,3 ha con un argumento explícito —la propuesta las califica por aptitud constructiva y no por su función de contacto con la población lindera, que es precisamente el atributo que el problema central pone en juego—. Su punto débil es el cuarto criterio, el costo de mantenimiento y la necesidad de una unidad de gestión interjurisdiccional, y por eso la componente 4 de la EAP es el régimen de administración: sin ella, la obra se degrada en pocos años y el proyecto reproduce el problema que vino a resolver. La ejecución corresponde a un titular público, el organismo provincial de tierras fiscales junto con la Municipalidad de Salta, con financiamiento internacional o esquema de asociación público-privada acotado a la operación de servicios dentro del parque y nunca al destino del suelo, distinción que debe quedar expresa en el F02.", "corr": ["Problema central partido en dos: cualquier enunciado con la forma «deterioro ambiental del predio y falta de espacios verdes para la población» son dos problemas unidos por una conjunción. El árbol resultante se parte también, con dos troncos y causas que no confluyen. Exigir que el enunciado nombre un solo sujeto afectado y que la habitabilidad aparezca como función del soporte, no como problema paralelo.", "Problema central escrito como carencia de la solución: «falta de un parque en el borde este», «ausencia de un plan de manejo», «no hay espacios verdes públicos». En este escenario es el error más probable porque el déficit de espacio verde está explícitamente documentado y se confunde con el problema. La consecuencia es que el ítem R queda vacío: si el problema es la falta del parque, la única alternativa posible es el parque. El error inverso es igual de frecuente: tomar un uso informal visible —volcado de residuos, quema, extracción de leña— como problema central. Son causas de segundo nivel derivadas de que el predio no tiene destino, gestión ni control visible, no el tronco del árbol.", "Las dos señales de alerta que introduce el material ampliado, y que hay que buscar en direcciones opuestas. Primera: el equipo que copia el master plan. Se reconoce porque el árbol de problemas tiene tres ramas que se llaman conservación, restricciones y cambio de uso; porque el problema central se enuncia como «el predio no está zonificado» o «la zonificación propuesta no se aplica»; o porque el ítem R ofrece una sola alternativa que consiste en ejecutar el plano. Ahí el plano ajeno reemplazó al diagnóstico propio. Segunda: el equipo que ignora la propuesta. Se reconoce porque el ítem E sigue hablando de «el predio» en bloque teniendo tres superficies disponibles, porque las alternativas del ítem R no dicen nada sobre qué hacen con cada zona, o porque el trabajo no menciona el reparto en ningún ítem. Ahí se desperdició la mejor información disponible. La respuesta correcta está en el medio y tiene una forma reconocible: adoptar lo que resiste el análisis, ajustar lo que la propuesta deja abierto y discutir lo que se aparta del problema identificado, en todos los casos con el fundamento escrito.", "Manejo descuidado de las superficies. Tres variantes a revisar: usar 846,6 y 847,97 indistintamente a lo largo del trabajo sin elegir un valor ni dejar constancia de la elección; sumar las tres zonas y tratar el resultado como si cerrara contra el total, cuando 289,8 + 324,0 + 215,3 da 829,1 ha y quedan 17,5 ha sin asignar; y citar la cartografía del visor como si fuera catastro oficial, cuando el propio material declara que está en POSGAR 2007 Faja 3, es de uso académico y no reemplaza la cartografía catastral oficial. La elección de un valor de referencia y su justificación es exactamente el tipo de criterio que este ítem evalúa: no hay una respuesta única correcta, pero sí hay respuestas incorrectas, y son las que no eligen o las que eligen sin decirlo.", "Escala desbordada o árbol de una sola dimensión. Lo primero: problemas del tipo «crecimiento urbano desordenado del área metropolitana de Salta» o «déficit habitacional de la ciudad»; verificar que el propósito del ítem P conserve la misma localización y la misma parcela que el problema del ítem D y no salte del predio al ejido. Lo segundo: árboles con causas exclusivamente técnicas o ambientales, cuando en este escenario la raíz principal es institucional —hay estudio y propuesta, pero no acto administrativo ni organismo a cargo— y hay causas económicas (valor de expectativa concentrado en las 215,3 ha urbanizables, oferta habitacional insuficiente), sociales (dependencia de los hogares linderos respecto del predio) y territoriales (ejido sin vacante interior). Un árbol sin la dimensión institucional no llegó a la raíz.", "Cifras inventadas y supuestos mal ubicados. Todo valor que no esté en el escenario ni en el material publicado —población por barrio, presupuestos, caudales, m² verdes por habitante, hectáreas concretas dentro de las 215,3 destinadas a cada uso, números de ley o de decreto— debe figurar como supuesto numerado, con su criterio y con la indicación de verificarlo en el F02. Y en la MML hay que controlar lo inverso: supuestos que en realidad son tareas del proyecto, como «se conforma la unidad de gestión», «se concilia la superficie catastral» o «se realizan los estudios hidrológicos». Todo eso está bajo control del proyecto y pertenece a la primera columna. Los supuestos genuinos de este escenario son la no recategorización del predio en el ordenamiento de bosques nativos y la no habilitación de urbanizaciones aguas arriba."]}, "10": {"n": 10, "pc": "Las tres corrientes de residuos del establecimiento porcino —líquida, sólida y gaseosa— se disponen sin tratamiento adecuado y de manera desacoplada entre sí, afectando el suelo, el agua subterránea y el aire del predio rural de unas 120 ha del Valle de Lerma, en el departamento Rosario de Lerma.", "pcjus": "El escenario describe un sistema único con tres salidas acopladas: el purín que se acumula en fosas y piletas, la fracción sólida con mortandad y placentas que debería estabilizarse en la playa de compostaje, y los gases —amoníaco, sulfuro de hidrógeno y metano— que se liberan desde esas mismas fosas y piletas. Cualquier enunciado que tome una sola corriente deja fuera el mecanismo que explica el caso, porque lo que se retira de una reaparece en las otras dos: por eso el problema central tiene que nombrar las tres y el desacople entre ellas. Se descartó «falta de una planta de tratamiento de efluentes» porque enuncia la solución, y una solución parcial, condicionando el análisis de alternativas antes de empezar. Se descartó «contaminación del establecimiento porcino» por no decir qué se contamina, dónde ni con qué magnitud, lo que impide construir un indicador. Se descartó también «los vecinos se quejan por el olor», que es el efecto más visible y por eso se cuela como problema: el olor es la señal de la emisión gaseosa, no la situación a revertir. La formulación adoptada conserva sujeto afectado (el ambiente receptor del predio y de su entorno inmediato), atributo negativo (disposición sin tratamiento adecuado y desacoplada) y localización (predio de unas 120 ha en Rosario de Lerma, Valle de Lerma), y es mensurable en las tres corrientes a la vez.", "objc": "Las tres corrientes de residuos del establecimiento porcino —líquida, sólida y gaseosa— se gestionan de manera integrada y con tratamiento adecuado, preservando el suelo, el agua subterránea y el aire del predio rural de unas 120 ha del Valle de Lerma, en el departamento Rosario de Lerma.", "sit": [{"id": "s1",
